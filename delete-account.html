<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>刪除帳號 - 安全團聚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

  background: #f5f5f5;
  color: #111;
  min-height: 100vh;
}

.header {
  background: #06C755;
  color: #fff;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.back {
  color: #fff;
  text-decoration: none;
  font-size: 28px;
  line-height: 1;
}

.title {
  font-size: 18px;
  font-weight: 700;
}

.container {
  padding: 20px 16px 40px;
  max-width: 600px;
  margin: auto;
}

.warning {
  background: #fff3cd;
  border: 1px solid #ffe08a;
  color: #664d03;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  line-height: 1.6;
}

.warning-title {
  font-weight: 800;
  font-size: 17px;
  margin-bottom: 8px;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  margin-bottom: 16px;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
}

ul {
  padding-left: 22px;
  line-height: 1.8;
}

.confirm-box {
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.confirm-label {
  display: block;
  font-size: 14px;
  color: #555;
  margin-bottom: 8px;
}

#confirmInput {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  outline: none;
}

#confirmInput:focus {
  border-color: #06C755;
}

.confirm-check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
}

.confirm-check input {
  margin-top: 3px;
}

.delete-btn {
  width: 100%;
  margin-top: 18px;
  border: none;
  border-radius: 10px;
  padding: 13px;
  background: #d32f2f;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
}

.delete-btn:disabled {
  background: #bbb;
  color: #eee;
}

.status {
  text-align: center;
  margin-top: 16px;
  font-size: 14px;
  color: #666;
  min-height: 22px;
}
</style>
</head>

<body>

<div class="header">

  <a
    class="back"
    href="javascript:history.back();">
    ‹
  </a>

  <div class="title">
    刪除帳號
  </div>

</div>

<div class="container">

  <div class="warning">

    <div class="warning-title">
      ⚠️ 刪除帳號前請確認
    </div>

    刪除帳號後，你將無法再使用目前帳號登入「安全團聚」。

    <br><br>

    此操作無法直接復原。

  </div>


  <div class="card">

    <div class="card-title">
      帳號刪除後的資料處理
    </div>

    <ul>

      <li>
        個人帳號將被刪除。
      </li>

      <li>
        登入權限將被取消。
      </li>

      <li>
        SOS 緊急求救紀錄不會因帳號刪除而立即刪除。
      </li>

      <li>
        SOS 證據資料依系統保存政策保存 5 年。
      </li>

      <li>
        SOS 資料可以從一般使用者畫面隱藏，但不代表資料庫中的證據紀錄被刪除。
      </li>

      <li>
        保存期限屆滿後，才依系統資料清理政策處理。
      </li>

    </ul>

  </div>


  <div class="confirm-box">

    <div class="card-title">
      確認刪除帳號
    </div>

    <label
      class="confirm-label"
      for="confirmInput">

      請輸入：

      <strong>
        DELETE
      </strong>

      以確認你確實要刪除帳號。

    </label>


    <input
      type="text"
      id="confirmInput"
      autocomplete="off"
      placeholder="輸入 DELETE">


    <label class="confirm-check">

      <input
        type="checkbox"
        id="confirmCheck">

      <span>
        我了解帳號刪除後無法使用此帳號登入，並了解 SOS 緊急求救紀錄會依法律保存政策保留。
      </span>

    </label>


    <button
      type="button"
      id="deleteBtn"
      class="delete-btn"
      disabled>

      刪除我的帳號

    </button>

  </div>


  <div
    id="status"
    class="status">
  </div>

</div>


<script>

(function () {

  var SUPABASE_URL =
    'https://perfsipperncvjocznhl.supabase.co';

  var SUPABASE_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';


  var supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  var input =
    document.getElementById(
      'confirmInput'
    );

  var checkbox =
    document.getElementById(
      'confirmCheck'
    );

  var deleteBtn =
    document.getElementById(
      'deleteBtn'
    );

  var status =
    document.getElementById(
      'status'
    );


  function setStatus(text) {

    status.textContent =
      text;

  }


  function updateButton() {

    deleteBtn.disabled =
      !(
        input.value.trim() === 'DELETE' &&
        checkbox.checked
      );

  }


  input.addEventListener(
    'input',
    updateButton
  );


  checkbox.addEventListener(
    'change',
    updateButton
  );


  async function checkSession() {

    try {

      var result =
        await supabase.auth.getSession();

      var session =
        result.data &&
        result.data.session;


      if (!session) {

        setStatus(
          '目前沒有登入，請先登入。'
        );

        input.disabled = true;
        checkbox.disabled = true;
        deleteBtn.disabled = true;

        return false;
      }


      setStatus(
        '已登入，可以進行帳號刪除。'
      );

      return true;

    } catch (error) {

      console.error(error);

      setStatus(
        '無法確認登入狀態。'
      );

      return false;
    }

  }


  async function deleteAccount() {

    var sessionOK =
      await checkSession();

    if (!sessionOK) {
      return;
    }


    var confirmed =
      window.confirm(
        '最後確認\n\n' +
        '確定要永久刪除這個帳號嗎？\n\n' +
        'SOS 緊急求救紀錄仍會依保存政策保留。'
      );


    if (!confirmed) {
      return;
    }


    deleteBtn.disabled = true;
    input.disabled = true;
    checkbox.disabled = true;


    setStatus(
      '正在刪除帳號，請稍候…'
    );


    try {

      var result =
        await supabase.functions.invoke(
          'delete-account',
          {
            body: {}
          }
        );


      if (result.error) {
        throw result.error;
      }


      var data =
        result.data;


      if (
        !data ||
        data.success !== true
      ) {

        throw new Error(
          data &&
          data.message
            ? data.message
            : '帳號刪除失敗'
        );

      }


      setStatus(
        '帳號已刪除，正在登出…'
      );


      await supabase.auth.signOut();


      setTimeout(
        function () {

          window.location.href =
            'login.html';

        },
        800
      );


    } catch (error) {

      console.error(
        'delete account error:',
        error
      );


      setStatus(
        '帳號刪除失敗：' +
        (
          error &&
          error.message
            ? error.message
            : '未知錯誤'
        )
      );


      input.disabled = false;
      checkbox.disabled = false;

      updateButton();

    }

  }


  deleteBtn.addEventListener(
    'click',
    deleteAccount
  );


  checkSession();

})();

</script>

</body>
</html>
