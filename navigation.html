<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>安全團聚 - 衛星導航</title>
<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f5f5;
  color:#111;
  min-height:100vh;
  padding-bottom:30px;
}

.header{
  background:#06C755;
  color:white;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}

.header a{
  color:white;
  text-decoration:none;
  font-size:16px;
}

.header h1{
  font-size:18px;
}

.content{
  padding:16px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.status-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#aaa;
}

.status-dot.active{
  background:#06C755;
}

.status-text{
  font-size:14px;
}

.map{
  width:100%;
  height:360px;
  background:#e9e9e9;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#666;
  overflow:hidden;
}

.location-info{
  margin-top:14px;
  font-size:14px;
  line-height:1.8;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.btn-primary{
  background:#06C755;
  color:white;
  width:100%;
}

.btn-danger{
  background:#ff3b30;
  color:white;
}

.btn-secondary{
  background:#eee;
  color:#333;
}

.button-row{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.button-row button{
  flex:1;
}

.section-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:10px;
}

.speed-camera{
  border-left:5px solid #ff3b30;
}

.speed-icon{
  font-size:36px;
  margin-bottom:8px;
}

.speed-status{
  font-size:14px;
  color:#666;
  line-height:1.7;
}

.warning{
  background:#fff3cd;
  color:#856404;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  font-size:13px;
  line-height:1.6;
}

</style>
</head>
<body>
  <div class="header">
  <h1>衛星導航</h1>
</div>
<div class="content">
  <!-- 衛星定位 -->
  <div class="card">
<div class="status">

  <div
    id="gps-dot"
    class="status-dot">
  </div>

  <div
    id="gps-status"
    class="status-text">
    尚未啟動衛星定位
  </div>

</div>


<div
  id="map"
  class="map">

  <div>

    🛰️<br><br>

    等待 GPS / GNSS 定位

  </div>

</div>


<div
  id="location-info"
  class="location-info">

  緯度：尚未取得<br>

  經度：尚未取得<br>

  精度：尚未取得

</div>


<div class="button-row">

  <button
    id="start-btn"
    class="btn-primary"
    onclick="startNavigation()">

    🛰️ 開始定位

  </button>

  <button
    class="btn-secondary"
    onclick="stopNavigation()">

    停止

  </button>

</div>
      </div>
  <!-- 測速照相 -->
  <div
    id="speed-camera"
    class="card speed-camera">
<div class="speed-icon">
  🚨
</div>

<div class="section-title">
  測速照相提醒
</div>

<div class="speed-status">

  開啟後會利用目前 GPS / GNSS
  位置判斷是否接近測速照相點。

</div>


<div class="button-row">

  <button
    id="camera-btn"
    class="btn-primary"
    onclick="toggleSpeedCamera()">

    🚨 開啟提醒

  </button>

</div>


<div class="warning">

  ⚠️ 測速照相提醒功能需要合法且可靠的測速照相資料來源。
  本頁目前先建立導航與提醒架構，避免使用未確認的測速位置資料。

</div>
      </div>
  <!-- 導航資訊 -->
  <div class="card">
<div class="section-title">
  導航資訊
</div>

<div id="navigation-info">

  目前尚未開始導航。

</div>
      </div>
</div>
<script>

let watchId = null;

let currentPosition = null;

let speedCameraEnabled = false;


/* =========================================
   開始 GPS / GNSS 定位
========================================= */

function startNavigation(){

  if(!navigator.geolocation){

    alert("此裝置不支援定位功能");

    return;

  }


  document.getElementById("gps-status")
    .textContent =
    "正在取得衛星定位…";


  document.getElementById("gps-dot")
    .classList.remove("active");


  if(watchId !== null){

    navigator.geolocation.clearWatch(
      watchId
    );

  }


  watchId =
    navigator.geolocation.watchPosition(

      function(position){

        currentPosition =
          position;


        updateLocation(
          position
        );


        document.getElementById("gps-dot")
          .classList.add("active");


        document.getElementById("gps-status")
          .textContent =
          "衛星定位正常";


        checkSpeedCamera(
          position
        );

      },


      function(error){

        document.getElementById("gps-dot")
          .classList.remove("active");


        document.getElementById("gps-status")
          .textContent =
          "無法取得定位";


        let message =
          "定位失敗";


        if(error.code === 1){

          message =
            "你拒絕了定位權限";

        }

        if(error.code === 2){

          message =
            "目前無法取得位置";

        }

        if(error.code === 3){

          message =
            "定位逾時";

        }


        alert(message);

      },

      {

        enableHighAccuracy:true,

        timeout:15000,

        maximumAge:3000

      }

    );

}


/* =========================================
   停止定位
========================================= */

function stopNavigation(){

  if(watchId !== null){

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId = null;

  }


  document.getElementById("gps-dot")
    .classList.remove("active");


  document.getElementById("gps-status")
    .textContent =
    "衛星定位已停止";


  document.getElementById("navigation-info")
    .textContent =
    "目前尚未開始導航。";

}


/* =========================================
   更新位置
========================================= */

function updateLocation(position){

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  document.getElementById("location-info")
    .innerHTML =

      "緯度：" +
      lat.toFixed(6) +

      "<br>" +

      "經度：" +
      lng.toFixed(6) +

      "<br>" +

      "定位精度：約 " +
      Math.round(accuracy) +
      " 公尺";


  document.getElementById("map")
    .innerHTML =

      "<div>" +

      "📍<br><br>" +

      "目前位置<br>" +

      lat.toFixed(6) +
      "<br>" +

      lng.toFixed(6) +

      "</div>";


  document.getElementById("navigation-info")
    .innerHTML =

      "📍 GPS / GNSS 已取得目前位置。<br>" +

      "精度：約 " +
      Math.round(accuracy) +
      " 公尺";

}


/* =========================================
   測速照相開關
========================================= */

function toggleSpeedCamera(){

  speedCameraEnabled =
    !speedCameraEnabled;


  const button =
    document.getElementById(
      "camera-btn"
    );


  if(speedCameraEnabled){

    button.textContent =
      "🚨 已開啟提醒";


    button.className =
      "btn-danger";


    if(
      currentPosition
    ){

      checkSpeedCamera(
        currentPosition
      );

    }

  }else{

    button.textContent =
      "🚨 開啟提醒";


    button.className =
      "btn-primary";

  }

}


/* =========================================
   測速照相判斷
========================================= */

function checkSpeedCamera(position){

  if(!speedCameraEnabled){

    return;

  }


  /*
     測速照相資料庫之後放這裡。

     格式：

     {
       lat: 25.033964,
       lng: 121.564468,
       name: "測速照相",
       speed: 50
     }

  */

  const speedCameras = [];


  /*
     目前沒有載入測速照相資料，
     因此不進行錯誤提醒。
  */

  if(
    speedCameras.length === 0
  ){

    return;

  }

}


/* =========================================
   頁面載入
========================================= */

window.addEventListener(
  "load",
  function(){

    const hash =
      window.location.hash;


    if(
      hash === "#speed-camera"
    ){

      setTimeout(
        function(){

          const target =
            document.getElementById(
              "speed-camera"
            );

          if(target){

            target.scrollIntoView({
              behavior:"smooth"
            });

          }

        },
        300
      );

    }

  }
);

</script>
</body>
</html>
