<script>

/* =========================================================
   Supabase 設定
========================================================= */

/*
   ⚠️ 請把這兩個值換成你目前安全團聚使用的
   Supabase URL 與 Publishable/Anon Key。
*/

const SUPABASE_URL =
  "你的_SUPABASE_URL";

const SUPABASE_KEY =
  "你的_SUPABASE_ANON_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   全域變數
========================================================= */

let map = null;

let userMarker = null;

let accuracyCircle = null;

let watchId = null;

let currentPosition = null;

let currentHeading = null;

let speedCameras = [];

let cameraMarkers = [];

let alertedCameras = new Set();

let lastAlertTime = 0;


/* =========================================================
   地圖初始化
========================================================= */

function initMap(){

  map =
    L.map("map", {
      zoomControl:true
    })
    .setView(
      [25.0330,121.5654],
      13
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  loadSpeedCameras();

}


/* =========================================================
   開始 GPS
========================================================= */

function startNavigation(){

  if(
    !navigator.geolocation
  ){

    alert(
      "此裝置不支援 GPS/GNSS 定位。"
    );

    return;

  }


  if(
    watchId !== null
  ){

    navigator.geolocation.clearWatch(
      watchId
    );

  }


  setGpsStatus(
    "正在取得衛星定位…",
    false
  );


  watchId =
    navigator.geolocation.watchPosition(

      handlePosition,

      handlePositionError,

      {

        enableHighAccuracy:true,

        maximumAge:3000,

        timeout:15000

      }

    );


  requestDeviceOrientation();

}


/* =========================================================
   GPS 成功
========================================================= */

function handlePosition(position){

  const coords =
    position.coords;


  const lat =
    Number(
      coords.latitude
    );


  const lng =
    Number(
      coords.longitude
    );


  const accuracy =
    Number(
      coords.accuracy || 0
    );


  let speed =
    Number(
      coords.speed || 0
    );


  /*
     GPS speed 是 m/s
     轉成 km/h
  */

  if(
    !Number.isFinite(speed)
  ){

    speed = 0;

  }


  const speedKmh =
    Math.max(
      0,
      speed * 3.6
    );


  currentPosition = {

    lat:lat,

    lng:lng,

    accuracy:accuracy,

    speed:speedKmh

  };


  document.getElementById(
    "latitude"
  ).textContent =
    lat.toFixed(6);


  document.getElementById(
    "longitude"
  ).textContent =
    lng.toFixed(6);


  document.getElementById(
    "speed-value"
  ).textContent =
    Math.round(speedKmh) +
    " km/h";


  setGpsStatus(
    "GPS 定位正常",
    true
  );


  updateUserMarker(
    lat,
    lng,
    accuracy
  );


  checkNearbySpeedCameras();

}


/* =========================================================
   GPS 錯誤
========================================================= */

function handlePositionError(error){

  let message =
    "GPS 定位失敗";


  if(
    error.code === 1
  ){

    message =
      "請允許瀏覽器使用定位功能";

  }


  if(
    error.code === 2
  ){

    message =
      "目前無法取得定位";

  }


  if(
    error.code === 3
  ){

    message =
      "定位逾時，請稍候再試";

  }


  setGpsStatus(
    message,
    false
  );

}


/* =========================================================
   GPS 狀態
========================================================= */

function setGpsStatus(
  text,
  active
){

  document.getElementById(
    "gps-status"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "gps-dot"
    );


  if(active){

    dot.classList.add(
      "active"
    );

  }else{

    dot.classList.remove(
      "active"
    );

  }

}


/* =========================================================
   使用者位置 Marker
========================================================= */

function updateUserMarker(
  lat,
  lng,
  accuracy
){

  const position =
    [lat,lng];


  if(
    !userMarker
  ){

    userMarker =
      L.marker(
        position,
        {
          title:
            "我的位置"
        }
      ).addTo(map);


    userMarker.bindPopup(
      "📍 我的位置"
    );

  }else{

    userMarker.setLatLng(
      position
    );

  }


  if(
    !accuracyCircle
  ){

    accuracyCircle =
      L.circle(
        position,
        {
          radius:
            accuracy,

          color:
            "#06C755",

          fillOpacity:
            0.12
        }
      ).addTo(map);

  }else{

    accuracyCircle.setLatLng(
      position
    );

    accuracyCircle.setRadius(
      accuracy
    );

  }


  if(
    !map._userCentered
  ){

    map.setView(
      position,
      16
    );

    map._userCentered =
      true;

  }

}


/* =========================================================
   回到我的位置
========================================================= */

function centerOnMyLocation(){

  if(
    !currentPosition
  ){

    alert(
      "尚未取得 GPS 定位。"
    );

    startNavigation();

    return;

  }


  map.setView(

    [
      currentPosition.lat,
      currentPosition.lng
    ],

    17

  );

}


/* =========================================================
   測速照相資料
========================================================= */

async function loadSpeedCameras(){

  const list =
    document.getElementById(
      "camera-list"
    );


  list.innerHTML =
    "正在從安全團聚資料庫讀取測速照相資料……";


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("speed_cameras")
        .select(
          "*"
        );


    if(error){

      throw error;

    }


    speedCameras =
      Array.isArray(data)
        ? data
        : [];


    renderSpeedCameras();

    renderCameraMarkers();


    document.getElementById(
      "camera-count"
    ).textContent =
      speedCameras.length +
      " 個資料";


  }catch(error){

    console.error(
      "測速照相資料錯誤:",
      error
    );


    list.innerHTML =
      `
      <div style="
        color:#c00;
        line-height:1.6;
      ">
        測速照相資料讀取失敗。<br>
        請確認 Supabase 的
        <b>speed_cameras</b>
        資料表與 RLS 設定。
      </div>
      `;


    document.getElementById(
      "camera-count"
    ).textContent =
      "讀取失敗";

  }

}


/* =========================================================
   取得資料欄位
========================================================= */

function getCameraLatitude(camera){

  return Number(
    camera.latitude ??
    camera.lat ??
    camera["座標緯度"]
  );

}


function getCameraLongitude(camera){

  return Number(
    camera.longitude ??
    camera.lng ??
    camera.lon ??
    camera["座標經度"]
  );

}


function getCameraLimit(camera){

  return (
    camera.speed_limit ??
    camera.limit ??
    camera["速限"] ??
    ""
  );

}


function getCameraAddress(camera){

  return (
    camera.address ??
    camera.location ??
    camera.Address ??
    camera["設置地點"] ??
    "測速執法地點"
  );

}


function getCameraDirection(camera){

  return (
    camera.direction ??
    camera.direct ??
    camera["拍攝方向"] ??
    ""
  );

}


/* =========================================================
   顯示附近測速照相
========================================================= */

function renderSpeedCameras(){

  const list =
    document.getElementById(
      "camera-list"
    );


  if(
    !speedCameras.length
  ){

    list.innerHTML =
      "目前沒有測速照相資料。";

    return;

  }


  let cameras =
    speedCameras.slice();


  if(
    currentPosition
  ){

    cameras =
      cameras
        .map(function(camera){

          const lat =
            getCameraLatitude(
              camera
            );

          const lng =
            getCameraLongitude(
              camera
            );


          if(
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
          ){

            return null;

          }


          return {

            camera:camera,

            distance:
              distanceMeters(
                currentPosition.lat,
                currentPosition.lng,
                lat,
                lng
              )

          };

        })
        .filter(Boolean)
        .sort(function(a,b){

          return a.distance -
            b.distance;

        })
        .slice(0,5);

  }else{

    cameras =
      cameras
        .slice(0,5)
        .map(function(camera){

          return {
            camera:camera,
            distance:null
          };

        });

  }


  list.innerHTML = "";


  cameras.forEach(function(item){

    const camera =
      item.camera;


    const distance =
      item.distance;


    const limit =
      getCameraLimit(
        camera
      );


    const address =
      getCameraAddress(
        camera
      );


    const direction =
      getCameraDirection(
        camera
      );


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "camera-item";


    div.innerHTML =

      (
        distance !== null
          ?
            '<div class="camera-distance">' +
            formatDistance(distance) +
            '</div>'
          :
            '<div class="camera-distance">' +
            '測速照相' +
            '</div>'
      ) +

      '<div class="camera-info">' +
      escapeHtml(address) +
      '</div>' +

      (
        limit !== ""
          ?
            '<span class="camera-limit">' +
            '速限 ' +
            escapeHtml(String(limit)) +
            ' km/h' +
            '</span>'
          :
            ''
      ) +

      (
        direction
          ?
            '<div class="camera-info">' +
            '方向：' +
            escapeHtml(String(direction)) +
            '</div>'
          :
            ''
      );


    list.appendChild(
      div
    );

  });

}


/* =========================================================
   測速照相 Marker
========================================================= */

function renderCameraMarkers(){

  cameraMarkers.forEach(
    function(marker){

      try{

        map.removeLayer(
          marker
        );

      }catch(e){}

    }
  );


  cameraMarkers = [];


  speedCameras.forEach(
    function(camera){

      const lat =
        getCameraLatitude(
          camera
        );


      const lng =
        getCameraLongitude(
          camera
        );


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ){

        return;

      }


      const limit =
        getCameraLimit(
          camera
        );


      const address =
        getCameraAddress(
          camera
        );


      const marker =
        L.circleMarker(

          [
            lat,
            lng
          ],

          {

            radius:7,

            color:"#d32f2f",

            fillColor:"#ff5252",

            fillOpacity:.85

          }

        ).addTo(map);


      marker.bindPopup(

        "<b>🚨 測速照相</b><br>" +

        escapeHtml(
          String(address)
        ) +

        (
          limit !== ""
            ?
              "<br><b>速限：" +
              escapeHtml(
                String(limit)
              ) +
              " km/h</b>"
            :
              ""
        )

      );


      cameraMarkers.push(
        marker
      );

    }
  );

}


/* =========================================================
   接近測速照相
========================================================= */

function checkNearbySpeedCameras(){

  if(
    !currentPosition ||
    !speedCameras.length
  ){

    return;

  }


  let nearest =
    null;


  speedCameras.forEach(
    function(camera){

      const lat =
        getCameraLatitude(
          camera
        );


      const lng =
        getCameraLongitude(
          camera
        );


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ){

        return;

      }


      const distance =
        distanceMeters(
          currentPosition.lat,
          currentPosition.lng,
          lat,
          lng
        );


      if(
        !nearest ||
        distance <
          nearest.distance
      ){

        nearest = {

          camera:camera,

          distance:distance

        };

      }

    }
  );


  if(
    !nearest
  ){

    return;

  }


  renderSpeedCameras();


  /*
     500 公尺內提醒
  */

  if(
    nearest.distance <= 500 &&
    nearest.distance >= 0
  ){

    const camera =
      nearest.camera;


    const cameraId =
      String(
        camera.id ??
        (
          getCameraLatitude(camera) +
          "_" +
          getCameraLongitude(camera)
        )
      );


    const now =
      Date.now();


    /*
       同一個測速點至少間隔 60 秒
    */

    if(
      !alertedCameras.has(
        cameraId
      ) ||
      now - lastAlertTime >
        60000
    ){

      alertedCameras.add(
        cameraId
      );


      lastAlertTime =
        now;


      const limit =
        getCameraLimit(
          camera
        );


      const message =
        "前方 " +
        formatDistance(
          nearest.distance
        ) +
        " 有測速照相" +
        (
          limit
            ?
              "，速限 " +
              limit +
              " 公里"
            :
              ""
        );


      showWarning(
        message
      );


      speak(
        message
      );

    }

  }

}


/* =========================================================
   警告
========================================================= */

function showWarning(
  message
){

  const warning =
    document.getElementById(
      "warning"
    );


  warning.textContent =
    "🚨 " + message;


  warning.classList.add(
    "show"
  );


  setTimeout(
    function(){

      warning.classList.remove(
        "show"
      );

    },

    7000

  );

}


/* =========================================================
   語音
========================================================= */

function speak(
  text
){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  try{

    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      "zh-TW";


    utterance.rate =
      1;


    window.speechSynthesis.speak(
      utterance
    );

  }catch(e){

    console.warn(
      "語音提醒失敗",
      e
    );

  }

}


/* =========================================================
   距離計算
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dp =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dl =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(dp / 2) *
    Math.sin(dp / 2) +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dl / 2) *
    Math.sin(dl / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return R * c;

}


/* =========================================================
   距離顯示
========================================================= */

function formatDistance(
  meters
){

  if(
    meters < 1000
  ){

    return (
      Math.round(meters) +
      " 公尺"
    );

  }


  return (
    (meters / 1000)
      .toFixed(1) +
    " 公里"
  );

}


/* =========================================================
   外部導航
========================================================= */

function openExternalNavigation(){

  const lat =
    Number(
      document.getElementById(
        "dest-lat"
      ).value
    );


  const lng =
    Number(
      document.getElementById(
        "dest-lng"
      ).value
    );


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    alert(
      "請輸入正確的目的地緯度與經度。"
    );

    return;

  }


  /*
     使用 Google Maps 導航 URL。
     手機如果安裝 Google Maps，
     通常會交由 App 開啟。
  */

  const url =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
      lat + "," + lng
    );


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   裝置方向
========================================================= */

function requestDeviceOrientation(){

  if(
    typeof DeviceOrientationEvent !==
    "undefined" &&

    typeof DeviceOrientationEvent
      .requestPermission ===
      "function"
  ){

    DeviceOrientationEvent
      .requestPermission()
      .then(function(permission){

        if(
          permission === "granted"
        ){

          window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
          );

        }

      })
      .catch(function(){

        console.warn(
          "無法取得裝置方向權限"
        );

      });

  }else{

    window.addEventListener(
      "deviceorientation",
      handleOrientation,
      true
    );

  }

}


/* =========================================================
   方向
========================================================= */

function handleOrientation(event){

  let heading =
    event.webkitCompassHeading;


  if(
    typeof heading !==
    "number"
  ){

    heading =
      event.alpha !== null
        ?
          360 -
          event.alpha
        :
          null;

  }


  if(
    heading === null ||
    !Number.isFinite(heading)
  ){

    return;

  }


  currentHeading =
    heading;


  document.getElementById(
    "heading"
  ).textContent =
    headingToText(
      heading
    ) +
    " " +
    Math.round(
      heading
    ) +
    "°";

}


/* =========================================================
   方位文字
========================================================= */

function headingToText(
  heading
){

  const directions = [
    "北",
    "東北",
    "東",
    "東南",
    "南",
    "西南",
    "西",
    "西北"
  ];


  const index =
    Math.round(
      heading / 45
    ) % 8;


  return directions[index];

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHtml(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   啟動
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    initMap();

  }
);

</script>
