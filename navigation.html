<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>導航測速 - 安全團聚</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  background: #111;
}

/* 地圖 */

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* 上方控制區 */

.topbar {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;

  z-index: 1000;

  display: flex;
  gap: 8px;

  align-items: center;
}

.status {
  flex: 1;

  min-width: 0;

  padding: 11px 13px;

  border-radius: 14px;

  background: rgba(255,255,255,0.95);

  box-shadow:
    0 3px 15px rgba(0,0,0,0.2);

  font-size: 14px;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

button {
  border: none;

  border-radius: 14px;

  padding: 11px 16px;

  font-size: 14px;

  font-weight: 700;

  background: #1677ff;

  color: white;

  box-shadow:
    0 3px 15px rgba(0,0,0,0.2);
}

button.stop {
  background: #d93025;
}

/* 底部資訊 */

.panel {
  position: fixed;

  left: 12px;
  right: 12px;
  bottom: 12px;

  z-index: 1000;

  background: rgba(255,255,255,0.97);

  border-radius: 20px;

  padding: 14px;

  box-shadow:
    0 5px 25px rgba(0,0,0,0.25);
}

.grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.card {
  background: #f4f6f8;

  border-radius: 14px;

  padding: 10px 12px;
}

.label {
  color: #666;

  font-size: 12px;
}

.value {
  margin-top: 3px;

  font-size: 23px;

  font-weight: 800;
}

.camera {
  margin-top: 10px;

  padding: 12px;

  border-radius: 14px;

  background: #fff3cd;

  color: #5f4500;
}

.camera.danger {
  background: #ffe1e1;

  color: #8b0000;
}

.small {
  font-size: 12px;

  color: #666;

  margin-top: 7px;

  line-height: 1.5;
}

.hidden {
  display: none;
}

/* Leaflet attribution */

.leaflet-control-attribution {
  font-size: 9px;
}

</style>
</head>

<body>

<div id="map"></div>


<!-- 上方 -->

<div class="topbar">

  <div
    class="status"
    id="status"
  >
    尚未開始定位
  </div>

  <button id="startBtn">
    開始
  </button>

</div>


<!-- 底部 -->

<div class="panel">

  <div class="grid">

    <div class="card">

      <div class="label">
        目前速度
      </div>

      <div
        class="value"
        id="speed"
      >
        -- km/h
      </div>

    </div>


    <div class="card">

      <div class="label">
        行進方向
      </div>

      <div
        class="value"
        id="heading"
      >
        --°
      </div>

    </div>


    <div class="card">

      <div class="label">
        緯度
      </div>

      <div
        class="value"
        id="lat"
        style="font-size:16px"
      >
        --
      </div>

    </div>


    <div class="card">

      <div class="label">
        經度
      </div>

      <div
        class="value"
        id="lng"
        style="font-size:16px"
      >
        --
      </div>

    </div>

  </div>


  <!-- 測速警告 -->

  <div
    id="cameraBox"
    class="camera hidden"
  >

    <strong id="cameraTitle">
      📷 前方測速提醒
    </strong>

    <div id="cameraInfo"></div>

    <div
      class="small"
      id="cameraAddress"
    ></div>

  </div>

</div>


<script>

/* =========================================================
   1. Supabase 設定
   =========================================================

   把這兩個值換成你「安全團聚」目前使用的 Supabase 設定。

   注意：
   只能使用 anon / publishable key。

   不要把 service_role key 放在這裡。
   ========================================================= */

const SUPABASE_URL =
  'https://perfsipperncvjocznhl.supabase.co';

const SUPABASE_ANON_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';

const supabaseReady =
  !SUPABASE_URL.startsWith("YOUR_") &&
  !SUPABASE_ANON_KEY.startsWith("YOUR_");


const supabaseClient =
  supabaseReady
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      )
    : null;


/* =========================================================
   2. 測速資料表
   ========================================================= */

const CAMERA_TABLE =
  "speed_cameras";


/* =========================================================
   3. 地圖
   ========================================================= */

const map =
  L.map("map", {

    zoomControl: true,

    attributionControl: true

  }).setView(
    [23.7, 120.9],
    7
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================================================
   4. 全域變數
   ========================================================= */

let userMarker = null;

let accuracyCircle = null;

let watchId = null;

let cameras = [];

let cameraMarkers = [];

let lastPosition = null;

let lastHeading = null;

let lastWarningCameraId = null;

let lastWarningTime = 0;


/* =========================================================
   5. UI
   ========================================================= */

const statusEl =
  document.getElementById("status");

const speedEl =
  document.getElementById("speed");

const headingEl =
  document.getElementById("heading");

const latEl =
  document.getElementById("lat");

const lngEl =
  document.getElementById("lng");

const cameraBox =
  document.getElementById("cameraBox");

const cameraTitle =
  document.getElementById("cameraTitle");

const cameraInfo =
  document.getElementById("cameraInfo");

const cameraAddress =
  document.getElementById("cameraAddress");

const startBtn =
  document.getElementById("startBtn");


/* =========================================================
   6. 基本工具
   ========================================================= */

function toNumber(value) {

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}


function normalizeText(value) {

  return String(
    value ?? ""
  ).trim();

}


/* =========================================================
   7. 計算兩點距離
   ========================================================= */

function distanceMeters(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dp =
    (lat2 - lat1)
    * Math.PI / 180;

  const dl =
    (lng2 - lng1)
    * Math.PI / 180;


  const a =
    Math.sin(dp / 2) ** 2
    +
    Math.cos(p1)
    *
    Math.cos(p2)
    *
    Math.sin(dl / 2) ** 2;


  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}


/* =========================================================
   8. 計算方位角
   ========================================================= */

function bearingDegrees(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dl =
    (lng2 - lng1)
    * Math.PI / 180;


  const y =
    Math.sin(dl)
    *
    Math.cos(p2);


  const x =
    Math.cos(p1)
    *
    Math.sin(p2)
    -
    Math.sin(p1)
    *
    Math.cos(p2)
    *
    Math.cos(dl);


  return (
    Math.atan2(y, x)
    * 180 / Math.PI
    + 360
  ) % 360;

}


/* =========================================================
   9. 兩個方向的差
   ========================================================= */

function angleDifference(
  a,
  b
) {

  return Math.abs(
    ((a - b + 540) % 360)
    - 180
  );

}


/* =========================================================
   10. 判斷測速方向
   =========================================================

   目前你的資料：

   南北雙向
   東西雙向

   第一版先做方向篩選。

   之後 Map Matching 再升級。
   ========================================================= */

function directMatchesHeading(
  direct,
  heading
) {

  const text =
    normalizeText(direct);


  if (!Number.isFinite(heading)) {

    return true;

  }


  if (
    text.includes("南北")
  ) {

    const northSouth =
      Math.min(
        angleDifference(
          heading,
          0
        ),

        angleDifference(
          heading,
          180
        )
      );


    return northSouth <= 55;

  }


  if (
    text.includes("東西")
  ) {

    const eastWest =
      Math.min(
        angleDifference(
          heading,
          90
        ),

        angleDifference(
          heading,
          270
        )
      );


    return eastWest <= 55;

  }


  return true;

}


/* =========================================================
   11. 距離格式
   ========================================================= */

function formatDistance(
  meters
) {

  if (meters < 1000) {

    return (
      Math.round(meters)
      + " m"
    );

  }


  return (
    (meters / 1000)
      .toFixed(1)
    + " km"
  );

}


/* =========================================================
   12. 從定位資料取得速度
   ========================================================= */

function speedFromPosition(
  position
) {

  const gpsSpeed =
    position.coords.speed;


  if (
    Number.isFinite(gpsSpeed)
    &&
    gpsSpeed >= 0
  ) {

    return (
      gpsSpeed * 3.6
    );

  }


  /*
   如果手機沒有提供 speed，
   用前後 GPS 點自己計算。
  */

  if (!lastPosition) {

    return 0;

  }


  const dt =
    (
      position.timestamp
      -
      lastPosition.timestamp
    ) / 1000;


  if (dt <= 0) {

    return 0;

  }


  const d =
    distanceMeters(

      lastPosition.coords.latitude,

      lastPosition.coords.longitude,

      position.coords.latitude,

      position.coords.longitude

    );


  return (
    d / dt
  ) * 3.6;

}


/* =========================================================
   13. 載入測速資料
   ========================================================= */

async function loadCameras() {

  if (!supabaseClient) {

    statusEl.textContent =
      "請先設定 Supabase";

    return;

  }


  statusEl.textContent =
    "正在載入測速資料…";


  const {
    data,
    error
  } =
    await supabaseClient
      .from(CAMERA_TABLE)
      .select(
        "CityName,RegionName,Address,DeptNm,BranchNm,Longitude,Latitude,direct,limit"
      );


  if (error) {

    console.error(
      "Supabase 測速資料錯誤：",
      error
    );

    statusEl.textContent =
      "測速資料載入失敗";

    return;

  }


  cameras =
    (data || [])

      .map(
        (row, index) => ({

          id: index,

          city:
            normalizeText(
              row.CityName
            ),

          region:
            normalizeText(
              row.RegionName
            ),

          address:
            normalizeText(
              row.Address
            ),

          longitude:
            toNumber(
              row.Longitude
            ),

          latitude:
            toNumber(
              row.Latitude
            ),

          direct:
            normalizeText(
              row.direct
            ),

          speedLimit:
            toNumber(
              row.limit
            )

        })
      )

      .filter(
        camera =>
          Number.isFinite(
            camera.latitude
          )
          &&
          Number.isFinite(
            camera.longitude
          )
      );


  drawCameraMarkers();


  statusEl.textContent =
    `已載入 ${cameras.length} 個測速點`;

}


/* =========================================================
   14. 顯示測速點
   ========================================================= */

function drawCameraMarkers() {

  cameraMarkers.forEach(
    marker =>
      map.removeLayer(marker)
  );


  cameraMarkers = [];


  cameras.forEach(
    camera => {

      const marker =
        L.circleMarker(

          [
            camera.latitude,
            camera.longitude
          ],

          {

            radius: 5,

            weight: 1,

            fillOpacity: 0.8

          }

        );


      marker.bindPopup(`

        <strong>
          📷 測速執法
        </strong>

        <br>

        ${camera.address || "未提供地址"}

        <br>

        速限：
        ${camera.speedLimit ?? "--"}
        km/h

        <br>

        方向：
        ${camera.direct || "--"}

      `);


      marker.addTo(map);

      cameraMarkers.push(
        marker
      );

    }
  );

}


/* =========================================================
   15. 找前方最近測速點
   ========================================================= */

function findNearestRelevantCamera(
  lat,
  lng,
  heading
) {

  let best = null;


  for (
    const camera
    of cameras
  ) {

    const distance =
      distanceMeters(

        lat,
        lng,

        camera.latitude,
        camera.longitude

      );


    /*
      第一版：

      搜尋前方 2 公里。
    */

    if (
      distance > 2000
    ) {

      continue;

    }


    /*
      判斷南北／東西方向。
    */

    if (
      !directMatchesHeading(
        camera.direct,
        heading
      )
    ) {

      continue;

    }


    /*
      判斷測速點是不是大致位於
      車輛前方。

      注意：
      這還不是最終的道路 Map Matching。

      下一版會升級。
    */

    if (
      Number.isFinite(
        heading
      )
    ) {

      const toCamera =
        bearingDegrees(

          lat,
          lng,

          camera.latitude,
          camera.longitude

        );


      if (
        angleDifference(
          heading,
          toCamera
        ) > 70
      ) {

        continue;

      }

    }


    if (
      !best
      ||
      distance <
      best.distance
    ) {

      best = {

        camera,
        distance

      };

    }

  }


  return best;

}


/* =========================================================
   16. 顯示測速警告
   ========================================================= */

function showCameraWarning(
  result,
  currentSpeed
) {

  if (!result) {

    cameraBox.classList.add(
      "hidden"
    );

    return;

  }


  const camera =
    result.camera;

  const distance =
    result.distance;

  const limit =
    camera.speedLimit;


  cameraBox.classList.remove(
    "hidden"
  );


  const isOverSpeed =
    Number.isFinite(limit)
    &&
    currentSpeed >
    limit;


  cameraBox.classList.toggle(
    "danger",
    isOverSpeed
  );


  if (isOverSpeed) {

    cameraTitle.textContent =
      "⚠️ 前方測速＋目前超速";

  } else {

    cameraTitle.textContent =
      "📷 前方測速提醒";

  }


  cameraInfo.textContent =

    `距離 ${formatDistance(distance)}`
    +
    `｜速限 ${limit ?? "--"} km/h`
    +
    `｜目前 ${Math.round(currentSpeed)} km/h`;


  cameraAddress.textContent =

    `${camera.city} `
    +
    `${camera.region} `
    +
    `${camera.address}`;


  /*
    700 公尺內開始語音提醒。

    同一測速點至少 30 秒
    才再次提醒。
  */

  if (
    distance <= 700
  ) {

    const now =
      Date.now();


    if (

      lastWarningCameraId
      !== camera.id

      ||

      now -
      lastWarningTime
      >
      30000

    ) {

      speakCameraWarning(
        camera,
        distance,
        currentSpeed
      );


      lastWarningCameraId =
        camera.id;


      lastWarningTime =
        now;

    }

  }

}


/* =========================================================
   17. 語音提醒
   ========================================================= */

function speakCameraWarning(
  camera,
  distance,
  currentSpeed
) {

  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  const limitText =

    Number.isFinite(
      camera.speedLimit
    )

      ? `，速限 ${camera.speedLimit} 公里`

      : "";


  const speedText =

    Number.isFinite(
      camera.speedLimit
    )
    &&
    currentSpeed >
    camera.speedLimit

      ? `，目前速度 ${Math.round(currentSpeed)} 公里，請減速`

      : "";


  const text =

    `前方 ${Math.round(distance)} 公尺測速照相`
    +
    limitText
    +
    speedText;


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "zh-TW";

  utterance.rate =
    0.95;

  utterance.pitch =
    1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   18. GNSS 定位成功
   ========================================================= */

function handlePosition(
  position
) {

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;


  const accuracy =
    position.coords.accuracy;


  const speed =
    Math.max(
      0,
      speedFromPosition(
        position
      )
    );


  let heading =
    position.coords.heading;


  /*
    如果手機沒有提供 heading，
    就利用前後 GPS 點計算。
  */

  if (
    !Number.isFinite(
      heading
    )
    &&
    lastPosition
  ) {

    const moved =
      distanceMeters(

        lastPosition.coords.latitude,

        lastPosition.coords.longitude,

        lat,
        lng

      );


    if (
      moved >= 3
    ) {

      heading =
        bearingDegrees(

          lastPosition.coords.latitude,

          lastPosition.coords.longitude,

          lat,
          lng

        );

    }

  }


  if (
    Number.isFinite(
      heading
    )
  ) {

    lastHeading =
      heading;

  }

  else if (
    Number.isFinite(
      lastHeading
    )
  ) {

    heading =
      lastHeading;

  }


  /* UI */

  latEl.textContent =
    lat.toFixed(6);


  lngEl.textContent =
    lng.toFixed(6);


  speedEl.textContent =
    `${Math.round(speed)} km/h`;


  headingEl.textContent =

    Number.isFinite(
      heading
    )

      ? `${Math.round(heading)}°`

      : "--°";


  statusEl.textContent =

    `定位正常｜誤差約 ${Math.round(accuracy)} m`;


  /* 使用者位置 */

  if (!userMarker) {

    userMarker =
      L.marker([
        lat,
        lng
      ]).addTo(map);


    userMarker.bindPopup(
      "目前位置"
    );


    map.setView(
      [
        lat,
        lng
      ],
      16
    );

  }

  else {

    userMarker.setLatLng([
      lat,
      lng
    ]);

  }


  /* GPS 誤差圓 */

  if (!accuracyCircle) {

    accuracyCircle =
      L.circle(

        [
          lat,
          lng
        ],

        {

          radius:
            accuracy,

          weight:
            1,

          fillOpacity:
            0.08

        }

      ).addTo(map);

  }

  else {

    accuracyCircle.setLatLng([
      lat,
      lng
    ]);


    accuracyCircle.setRadius(
      accuracy
    );

  }


  /* 找前方測速 */

  const result =
    findNearestRelevantCamera(

      lat,
      lng,
      heading

    );


  showCameraWarning(
    result,
    speed
  );


  /* 保存上一個位置 */

  lastPosition =
    position;

}


/* =========================================================
   19. GNSS 定位錯誤
   ========================================================= */

function handlePositionError(
  error
) {

  console.error(
    "定位錯誤：",
    error
  );


  const messages = {

    1:
      "定位權限被拒絕",

    2:
      "目前無法取得位置",

    3:
      "定位逾時"

  };


  statusEl.textContent =

    messages[
      error.code
    ]

    ||

    "定位發生錯誤";

}


/* =========================================================
   20. 開始導航測速
   ========================================================= */

async function startNavigation() {

  if (
    !navigator.geolocation
  ) {

    statusEl.textContent =
      "此裝置不支援定位";

    return;

  }


  if (
    !window.isSecureContext
  ) {

    statusEl.textContent =
      "定位需要 HTTPS 網站";

    return;

  }


  startBtn.textContent =
    "停止";


  startBtn.classList.add(
    "stop"
  );


  /*
    先載入測速資料。
  */

  await loadCameras();


  /*
    開始持續定位。
  */

  watchId =
    navigator.geolocation.watchPosition(

      handlePosition,

      handlePositionError,

      {

        enableHighAccuracy:
          true,

        maximumAge:
          1000,

        timeout:
          10000

      }

    );

}


/* =========================================================
   21. 停止導航測速
   ========================================================= */

function stopNavigation() {

  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId =
      null;

  }


  startBtn.textContent =
    "開始";


  startBtn.classList.remove(
    "stop"
  );


  statusEl.textContent =
    "已停止定位";

}


/* =========================================================
   22. 開始／停止按鈕
   ========================================================= */

startBtn.addEventListener(
  "click",
  () => {

    if (
      watchId === null
    ) {

      startNavigation();

    }

    else {

      stopNavigation();

    }

  }
);


/* =========================================================
   23. 頁面開啟時先載入測速資料
   ========================================================= */

loadCameras();

</script>

</body>
</html>
