<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>群組通話 - 安全團聚</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.8),transparent);gap:8px}
.room-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.room-sub{font-size:11px;opacity:.85;margin-top:2px}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.online-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:600}
.online-dot{width:7px;height:7px;border-radius:50%;background:#06C755;box-shadow:0 0 6px #06C755}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:16px}

/* 視訊格：預設佔滿；聊天展開時縮小 */
.grid{
  position:absolute;left:0;right:0;top:0;
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  padding:calc(58px + env(safe-area-inset-top,0px)) 6px 6px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:6px;
  transition:bottom .25s ease, padding .25s ease;
}
body.chat-open .grid{
  bottom:calc(38vh + 88px + env(safe-area-inset-bottom,0px));
}
.grid.slots-1{grid-template-columns:1fr}
.grid.slots-3,.grid.slots-4{grid-template-columns:1fr 1fr}
.grid.slots-5,.grid.slots-6{grid-template-columns:1fr 1fr 1fr}
.grid.slots-7,.grid.slots-8{grid-template-columns:1fr 1fr 1fr 1fr}
.slot{position:relative;border-radius:12px;overflow:hidden;background:#1a222d;min-height:70px}
.slot video{width:100%;height:100%;object-fit:cover;display:block}
.slot.audio-only video{display:none}
.slot-avatar{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#1b5e20,#0d47a1)}
.slot-avatar .face{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.slot-name{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;background:rgba(0,0,0,.5);padding:3px 7px;border-radius:7px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-badge{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.45)}
.slot.me{border:1px solid rgba(6,199,85,.55)}

/* 字幕／打字聊天區：約三行可視 + 可滾動 */
.chat-dock{
  position:fixed;left:0;right:0;z-index:45;
  bottom:calc(72px + env(safe-area-inset-bottom,0px));
  height:0;overflow:hidden;
  background:rgba(8,12,18,.92);
  border-top:1px solid rgba(255,255,255,.1);
  transition:height .25s ease;
  display:flex;flex-direction:column;
}
body.chat-open .chat-dock{height:38vh;}
.chat-messages{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 10px;font-size:13px;line-height:1.35;
}
.chat-line{margin-bottom:6px;word-break:break-word}
.chat-line .who{color:#81d4fa;font-weight:700;margin-right:4px}
.chat-line .when{color:#78909c;font-size:10px;margin-left:6px}
.chat-input-row{
  display:flex;gap:6px;padding:8px 10px;
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.35);
}
.chat-input-row input{
  flex:1;border:0;border-radius:10px;padding:10px 12px;
  background:#1c2430;color:#fff;font-size:14px;outline:none;
}
.chat-input-row button{
  border:0;border-radius:10px;padding:0 14px;
  background:#06C755;color:#fff;font-weight:700;font-size:14px;
}

.controls{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;align-items:center;gap:12px;
  padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.92));
}
.ctrl{
  width:54px;height:54px;border-radius:50%;border:0;
  background:rgba(255,255,255,.18);color:#fff;
  font-size:10px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.ctrl .ico{font-size:18px}
.ctrl.off{background:#e53935}
.ctrl.disabled{opacity:.45}
.ctrl.hangup{background:#e53935;width:58px;height:58px}
.ctrl.kb-on{background:#1565c0}

/* 收合時右下小鍵盤浮鈕 */
.kb-fab{
  position:fixed;
  right:14px;
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  z-index:55;
  width:48px;height:48px;border-radius:50%;
  border:0;background:#1565c0;color:#fff;
  font-size:22px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
}
body.chat-open .kb-fab{display:none}

.chat-dock-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px 0;font-size:11px;color:#90a4ae;
}
.chat-dock-head button{
  border:0;background:rgba(255,255,255,.12);color:#fff;
  border-radius:8px;padding:4px 10px;font-size:12px;
}
.chat-messages{
  min-height:4.2em; /* 約三行 */
  max-height:100%;
}

.hint{position:fixed;left:10px;right:10px;z-index:40;text-align:center;font-size:11px;color:#b0bec5;pointer-events:none;
  bottom:calc(78px + env(safe-area-inset-bottom,0px))}
body.chat-open .hint{display:none}

.panel-mask{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55)}
.panel-mask.show{display:block}
.member-panel{position:fixed;left:12px;right:12px;bottom:12px;z-index:90;max-height:55vh;overflow:auto;background:#161c24;border-radius:16px;padding:14px;display:none}
.member-panel.show{display:block}
.member-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.member-av{width:40px;height:40px;border-radius:50%;background:#2a3441;display:flex;align-items:center;justify-content:center;font-weight:700}
.member-meta{flex:1;min-width:0}
.member-meta .n{font-size:14px;font-weight:600}
.member-meta .s{font-size:12px;opacity:.75}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px}
.tag.on{background:rgba(6,199,85,.2);color:#69f0ae}
.tag.off{background:rgba(255,255,255,.08);color:#9e9e9e}
.tag.vid{background:rgba(33,150,243,.2);color:#90caf9}
.tag.txt{background:rgba(255,193,7,.15);color:#ffe082}
</style>
</head>
<body>

<div class="top-bar">
  <div style="min-width:0;flex:1">
    <div class="room-name" id="roomName">群組通話</div>
    <div class="room-sub" id="roomSub">會議進行中 · 準備中…</div>
  </div>
  <div class="top-right">
    <div class="online-pill"><span class="online-dot"></span><span id="onlineCount">0</span>在線</div>
    <button type="button" class="icon-btn" id="btnMembers" title="成員">👤</button>
  </div>
</div>

<div class="grid slots-1" id="videoGrid"></div>

<div class="chat-dock" id="chatDock">
  <div class="chat-dock-head">
    <span>會議字幕（僅本次通話可見，結束即消失）</span>
    <button type="button" id="btnChatCollapse">收起 ⌨️</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="輸入訊息給通話中的朋友…" maxlength="500" autocomplete="off">
    <button type="button" id="btnChatSend">送出</button>
  </div>
</div>

<button type="button" class="kb-fab" id="kbFab" title="打字">⌨️</button>

<div class="hint" id="ruleHint">視訊最多 8 人 · 點右下鍵盤可打字</div>

<div class="controls">
  <button type="button" class="ctrl off" id="btnMic"><span class="ico">🔇</span>麥克風</button>
  <button type="button" class="ctrl off" id="btnCam"><span class="ico">📷</span>視訊</button>
  <button type="button" class="ctrl hangup" id="btnHangup"><span class="ico">📞</span>退出</button>
</div>

<div class="panel-mask" id="panelMask"></div>
<div class="member-panel" id="memberPanel">
  <h3 style="margin:0 0 10px;font-size:15px">群組成員狀態</h3>
  <div id="memberList"></div>
</div>

<script>
(function () {
  var SUPABASE_URL = "https://perfsipperncvjocznhl.supabase.co";
  var SUPABASE_KEY = "sb_publishable_qpqAwj49L6HcWqWTnNsTxw_oBEauWBA";
  var MAX_VIDEO = 8;

  var params = new URLSearchParams(location.search);
  var mode = (params.get("mode") || "audio").toLowerCase();
  var roomName = params.get("name") || params.get("room") || "群組通話";
  var roomId = params.get("room_id") || params.get("id") || roomName;
  var textOnly = params.get("textonly") === "1" || params.get("join") === "chat";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var me = null, myName = "我", myStream = null;
  var micOn = false, camOn = false, chatOpen = false;
  var channel = null, chatChannel = null;
  var members = {};
  var chatLog = [];

  var grid = document.getElementById("videoGrid");
  document.getElementById("roomName").textContent = roomName;

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function initialOf(n) {
    n = (n || "?").trim();
    return n ? n.charAt(0).toUpperCase() : "?";
  }
  function countOnline() {
    var n = 0;
    Object.keys(members).forEach(function (k) { if (members[k].online) n++; });
    return n;
  }
  function countVideoOn() {
    var n = 0;
    Object.keys(members).forEach(function (k) {
      if (members[k].online && members[k].video) n++;
    });
    return n;
  }
  function canEnableVideo() {
    return camOn || countVideoOn() < MAX_VIDEO;
  }

  function updateTop() {
    document.getElementById("onlineCount").textContent = String(countOnline());
    var v = countVideoOn();
    document.getElementById("roomSub").textContent =
      "會議進行中 · " +
      (textOnly ? "打字模式" : (mode === "video" ? "視訊模式" : "語音模式")) +
      " · 視訊 " + v + "/" + MAX_VIDEO;
    var btnCam = document.getElementById("btnCam");
    if (textOnly) {
      btnCam.classList.add("disabled");
      document.getElementById("btnMic").classList.add("disabled");
      document.getElementById("ruleHint").textContent = "你目前以打字加入 · 可傳訊息給通話中的朋友";
    } else if (v >= MAX_VIDEO && !camOn) {
      document.getElementById("ruleHint").textContent = "視訊已滿 8 人，僅能語音；點鍵盤可打字";
      btnCam.classList.add("disabled");
    } else {
      document.getElementById("ruleHint").textContent = "視訊最多 8 人 · 點右下鍵盤可打字";
      btnCam.classList.remove("disabled");
    }
  }

  function setChatOpen(on) {
    chatOpen = !!on;
    document.body.classList.toggle("chat-open", chatOpen);
    // 只保留右下藍色小鍵盤浮鈕（展開後隱藏，用字幕區「收起」關閉）
    setTimeout(function () {
      if (chatOpen) {
        var el = document.getElementById("chatInput");
        if (el) el.focus();
        scrollChatBottom();
      }
    }, 280);
  }

  function scrollChatBottom() {
    var box = document.getElementById("chatMessages");
    if (box) box.scrollTop = box.scrollHeight;
  }

  function renderChat() {
    var box = document.getElementById("chatMessages");
    if (!box) return;
    if (!chatLog.length) {
      box.innerHTML = '<div style="opacity:.6;font-size:12px;padding:8px 0">尚無字幕 · 僅本次會議可見，結束後不會保留</div>';
      return;
    }
    box.innerHTML = chatLog.map(function (m) {
      var t = m.at ? new Date(m.at) : null;
      var ts = t ? (t.getHours() + ":" + String(t.getMinutes()).padStart(2, "0")) : "";
      return '<div class="chat-line"><span class="who">' + escapeHtml(m.name || "成員") +
        '</span>' + escapeHtml(m.text) +
        (ts ? '<span class="when">' + ts + "</span>" : "") + "</div>";
    }).join("");
    scrollChatBottom();
  }

  function pushChat(msg) {
    chatLog.push(msg);
    if (chatLog.length > 200) chatLog = chatLog.slice(-200);
    renderChat();
    // 有人打字時自動展開字幕區，讓視訊視窗縮小
    if (!chatOpen) setChatOpen(true);
  }

  function renderGrid() {
    var list = Object.keys(members).map(function (k) { return members[k]; })
      .filter(function (m) { return m.online && !m.text_only; })
      .sort(function (a, b) {
        if (me && a.user_id === me.id) return -1;
        if (me && b.user_id === me.id) return 1;
        return (a.name || "").localeCompare(b.name || "");
      });
    var slots = list.slice(0, MAX_VIDEO);
    var n = Math.max(1, slots.length);
    grid.className = "grid slots-" + Math.min(8, n);
    grid.innerHTML = "";
    if (!slots.length) {
      grid.innerHTML = '<div class="slot"><div class="slot-avatar"><div class="face">💬</div><div>等待通話成員…</div><div style="font-size:12px;opacity:.8">也可打字參與</div></div></div>';
      return;
    }
    slots.forEach(function (m) {
      var slot = document.createElement("div");
      slot.className = "slot" + (me && m.user_id === me.id ? " me" : "") + (m.video ? "" : " audio-only");
      var avatar = document.createElement("div");
      avatar.className = "slot-avatar";
      avatar.innerHTML = '<div class="face">' + initialOf(m.name) + '</div><div style="font-size:12px">' + escapeHtml(m.name || "成員") + "</div>";
      var video = document.createElement("video");
      video.autoplay = true; video.playsInline = true;
      video.muted = !!(me && m.user_id === me.id);
      if (me && m.user_id === me.id && myStream && m.video) {
        video.srcObject = myStream;
        avatar.style.display = "none";
      }
      var name = document.createElement("div");
      name.className = "slot-name";
      name.textContent = (m.name || "成員") + (m.mic ? " · 🎤" : " · 🔇");
      var badge = document.createElement("div");
      badge.className = "slot-badge";
      badge.textContent = m.video ? "視訊" : "語音";
      slot.appendChild(avatar); slot.appendChild(video); slot.appendChild(name); slot.appendChild(badge);
      grid.appendChild(slot);
    });
  }

  function renderMemberList() {
    var keys = Object.keys(members);
    var box = document.getElementById("memberList");
    if (!keys.length) {
      box.innerHTML = '<div style="opacity:.7;font-size:13px">尚無成員</div>';
      return;
    }
    keys.sort(function (a, b) {
      var ma = members[a], mb = members[b];
      if (ma.online !== mb.online) return ma.online ? -1 : 1;
      return (ma.name || "").localeCompare(mb.name || "");
    });
    box.innerHTML = keys.map(function (k) {
      var m = members[k];
      var tags = '<span class="tag ' + (m.online ? "on" : "off") + '">' + (m.online ? "在線" : "離線") + "</span>";
      if (m.online && m.video) tags += ' <span class="tag vid">視訊</span>';
      if (m.online && m.text_only) tags += ' <span class="tag txt">打字</span>';
      return '<div class="member-row"><div class="member-av">' + initialOf(m.name) +
        '</div><div class="member-meta"><div class="n">' + escapeHtml(m.name || "成員") +
        (me && m.user_id === me.id ? "（我）" : "") + '</div><div class="s">' +
        (m.online ? (m.text_only ? "僅打字參與" : (m.video ? "視訊中" : "語音中")) : "未在通話") +
        "</div></div>" + tags + "</div>";
    }).join("");
  }

  function setMicUi() {
    var b = document.getElementById("btnMic");
    if (micOn) { b.classList.remove("off"); b.innerHTML = '<span class="ico">🎤</span>麥克風'; }
    else { b.classList.add("off"); b.innerHTML = '<span class="ico">🔇</span>麥克風'; }
  }
  function setCamUi() {
    var b = document.getElementById("btnCam");
    if (camOn) { b.classList.remove("off"); b.innerHTML = '<span class="ico">📹</span>視訊'; }
    else { b.classList.add("off"); b.innerHTML = '<span class="ico">📷</span>視訊'; }
  }

  async function ensureMedia() {
    if (textOnly) return null;
    if (myStream) return myStream;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("此瀏覽器不支援麥克風");
    }
    document.getElementById("roomSub").textContent = "請求麥克風權限…";
    myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    myStream.getAudioTracks().forEach(function (t) { t.enabled = false; });
    micOn = false; setMicUi();
    document.getElementById("roomSub").textContent = "麥克風已就緒（預設靜音）";
    return myStream;
  }

  async function trackPresence() {
    if (!channel || !me) return;
    try {
      await channel.track({
        user_id: me.id,
        name: myName,
        online: true,
        mic: micOn,
        video: camOn,
        text_only: !!textOnly,
        at: Date.now()
      });
    } catch (e) { console.warn(e); }
  }

  async function toggleMic() {
    if (textOnly) { alert("你目前是打字模式，無法開麥克風。若要語音請退出後用「進入」以語音加入。"); return; }
    try {
      await ensureMedia();
      micOn = !micOn;
      myStream.getAudioTracks().forEach(function (t) { t.enabled = micOn; });
      setMicUi(); await trackPresence();
      if (me) { members[me.id].mic = micOn; renderGrid(); renderMemberList(); }
    } catch (e) { alert("無法使用麥克風：" + (e.message || e)); }
  }

  async function toggleCam() {
    if (textOnly) { alert("打字模式無法開視訊。"); return; }
    try {
      if (!camOn && !canEnableVideo()) {
        alert("視訊名額已滿（最多 8 人）。\n請等有人關閉視訊。\n你仍可開麥克風或打字。");
        return;
      }
      if (!camOn) {
        var old = myStream;
        myStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        });
        myStream.getAudioTracks().forEach(function (t) { t.enabled = micOn; });
        if (old) old.getTracks().forEach(function (t) { t.stop(); });
        camOn = true;
      } else {
        myStream.getVideoTracks().forEach(function (t) { t.stop(); myStream.removeTrack(t); });
        camOn = false;
      }
      setCamUi(); await trackPresence();
      if (me) { members[me.id].video = camOn; members[me.id].mic = micOn; }
      updateTop(); renderGrid(); renderMemberList();
    } catch (e) { alert("無法使用鏡頭：" + (e.message || e)); }
  }

  function applyPresenceState(state) {
    var onlineIds = {};
    Object.keys(state || {}).forEach(function (key) {
      var meta = (state[key] || [])[0] || {};
      var uid = meta.user_id || key;
      onlineIds[uid] = true;
      members[uid] = {
        user_id: uid,
        name: meta.name || (members[uid] && members[uid].name) || "成員",
        online: true,
        mic: !!meta.mic,
        video: !!meta.video,
        text_only: !!meta.text_only
      };
    });
    Object.keys(members).forEach(function (uid) {
      if (!onlineIds[uid]) {
        members[uid].online = false;
        members[uid].mic = false;
        members[uid].video = false;
      }
    });
    updateTop(); renderGrid(); renderMemberList();
  }

  async function sendChat() {
    var input = document.getElementById("chatInput");
    var text = (input.value || "").trim();
    if (!text || !me) return;
    input.value = "";
    var payload = {
      user_id: me.id,
      name: myName,
      text: text,
      at: Date.now(),
      room_id: String(roomId)
    };
    // 僅會議內即時廣播，不寫入聊天室、不留歷史
    pushChat(payload);
    try {
      if (chatChannel) {
        await chatChannel.send({
          type: "broadcast",
          event: "call_chat",
          payload: payload
        });
      }
    } catch (e) { console.warn(e); }
  }

  async function joinRoom() {
    document.getElementById("roomSub").textContent = "檢查登入…";
    var session;
    try {
      session = await sb.auth.getSession();
    } catch (e) {
      document.getElementById("roomSub").textContent = "登入檢查失敗";
      alert("無法檢查登入：" + (e.message || e));
      return;
    }
    me = session.data && session.data.session && session.data.session.user;
    if (!me) {
      document.getElementById("roomSub").textContent = "尚未登入";
      alert("請先登入再進入群組通話");
      location.href = "login.html";
      return;
    }
    myName = (me.user_metadata && (me.user_metadata.full_name || me.user_metadata.display_name)) ||
      (me.email ? me.email.split("@")[0] : "成員");

    members[me.id] = {
      user_id: me.id, name: myName, online: true,
      mic: false, video: false, text_only: !!textOnly
    };

    if (!textOnly) {
      try { await ensureMedia(); } catch (e) {
        document.getElementById("roomSub").textContent = "無法取得麥克風（仍可打字）";
      }
    }

    var topic = "group-call:" + String(roomId);
    channel = sb.channel(topic, { config: { presence: { key: me.id } } });
    channel
      .on("presence", { event: "sync" }, function () { applyPresenceState(channel.presenceState()); })
      .on("presence", { event: "join" }, function () { applyPresenceState(channel.presenceState()); })
      .on("presence", { event: "leave" }, function () { applyPresenceState(channel.presenceState()); });

    document.getElementById("roomSub").textContent = "連線會議頻道…";
    await channel.subscribe(async function (status) {
      console.log("group-call channel:", status);
      if (status === "SUBSCRIBED") {
        try { localStorage.setItem("safe_reunion_in_meeting_" + String(roomId), "1"); } catch (e) {}
        try { await trackPresence(); } catch (e) { console.warn(e); }
        try { startMeetingAliveBroadcast(); } catch (e) { console.warn(e); }
        try {
          await channel.send({
            type: "broadcast",
            event: "meeting_start",
            payload: {
              room_id: String(roomId),
              starter_id: me.id,
              starter_name: myName,
              mode: mode,
              at: Date.now()
            }
          });
        } catch (e) { console.warn(e); }
        document.getElementById("roomSub").textContent = textOnly ? "已以打字加入" : "已進入會議（可開麥／視訊）";
        updateTop(); renderGrid(); renderMemberList();
      } else if (status === "CHANNEL_ERROR") {
        document.getElementById("roomSub").textContent = "會議頻道連線失敗";
      } else if (status === "TIMED_OUT") {
        document.getElementById("roomSub").textContent = "會議頻道逾時";
      }
    });

    // 通話文字廣播
    chatChannel = sb.channel("group-call-chat:" + String(roomId));
    chatChannel.on("broadcast", { event: "call_chat" }, function (payload) {
      var p = payload && payload.payload ? payload.payload : payload;
      if (!p || !p.text) return;
      if (me && p.user_id === me.id) return; // 自己已本地顯示
      pushChat(p);
    });
    await chatChannel.subscribe();

    // 打字模式預設打開鍵盤區
    if (textOnly) setChatOpen(true);
  }


  var meetingAliveTimer = null;
  function startMeetingAliveBroadcast() {
    if (meetingAliveTimer) clearInterval(meetingAliveTimer);
    async function beat() {
      if (!channel) return;
      var n = 0;
      try {
        var state = channel.presenceState() || {};
        Object.keys(state).forEach(function (k) {
          var metas = state[k] || [];
          if (metas.length) n++;
        });
      } catch (e) {}
      try {
        await channel.send({
          type: "broadcast",
          event: "meeting_alive",
          payload: {
            room_id: String(roomId),
            count: Math.max(1, n),
            starter_name: myName,
            at: Date.now()
          }
        });
      } catch (e) {}
    }
    beat();
    meetingAliveTimer = setInterval(beat, 3000);
  }
  function stopMeetingAliveBroadcast() {
    if (meetingAliveTimer) {
      clearInterval(meetingAliveTimer);
      meetingAliveTimer = null;
    }
    try {
      if (channel) {
        channel.send({
          type: "broadcast",
          event: "meeting_end",
          payload: { room_id: String(roomId), at: Date.now() }
        });
      }
    } catch (e) {}
  }

  function hangup() {
    stopMeetingAliveBroadcast();
    chatLog = [];
    renderChat();
    try {
      if (myStream) { myStream.getTracks().forEach(function (t) { t.stop(); }); myStream = null; }
      if (channel) { try { channel.untrack(); } catch (e) {} sb.removeChannel(channel); channel = null; }
      if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; }
      try { localStorage.removeItem("safe_reunion_in_meeting_" + String(roomId)); } catch (e2) {}
    } catch (e) {}
    // 退回聊天室
    var back = "room.html?id=" + encodeURIComponent(roomId) + "&name=" + encodeURIComponent(roomName);
    location.href = back;
  }

  document.getElementById("btnMic").onclick = function () { toggleMic(); };
  document.getElementById("btnCam").onclick = function () {
    if (document.getElementById("btnCam").classList.contains("disabled") && !camOn) {
      alert(textOnly ? "打字模式無法開視訊" : "視訊已滿 8 人");
      return;
    }
    toggleCam();
  };
  document.getElementById("btnHangup").onclick = hangup;
  var kbFab = document.getElementById("kbFab");
  if (kbFab) kbFab.onclick = function () { setChatOpen(!chatOpen); };
  var btnCollapse = document.getElementById("btnChatCollapse");
  if (btnCollapse) btnCollapse.onclick = function () { setChatOpen(false); };
  document.getElementById("btnChatSend").onclick = sendChat;
  document.getElementById("chatInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendChat(); }
  });
  // 開始打字就展開並縮小視訊
  document.getElementById("chatInput").addEventListener("focus", function () {
    if (!chatOpen) setChatOpen(true);
  });

  document.getElementById("btnMembers").onclick = function () {
    renderMemberList();
    document.getElementById("memberPanel").classList.add("show");
    document.getElementById("panelMask").classList.add("show");
  };
  document.getElementById("panelMask").onclick = function () {
    document.getElementById("memberPanel").classList.remove("show");
    document.getElementById("panelMask").classList.remove("show");
  };

  updateTop(); setMicUi(); setCamUi(); renderChat();
  console.log("group-call boot", { mode: mode, roomId: roomId, roomName: roomName, textOnly: textOnly });
  joinRoom().catch(function (e) {
    console.error(e);
    document.getElementById("roomSub").textContent = "啟動失敗：" + (e.message || e);
  });
})();
</script>
</body>
</html>
