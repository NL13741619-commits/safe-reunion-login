<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>群組通話 - 安全團聚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b0f14;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif
}

.top-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(rgba(0,0,0,.8),transparent);
  gap:8px
}

.room-name{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:42vw
}

.room-sub{
  font-size:11px;
  opacity:.85;
  margin-top:2px
}

.top-right{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0
}

.online-pill{
  display:flex;
  align-items:center;
  gap:5px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:600
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#06C755;
  box-shadow:0 0 6px #06C755
}

.icon-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:0;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:16px
}

.grid{
  position:absolute;
  left:0;
  right:0;
  top:0;
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  padding:calc(58px + env(safe-area-inset-top,0px)) 6px 6px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px
}

.grid.slots-1{
  grid-template-columns:1fr
}

.grid.slots-3,
.grid.slots-4{
  grid-template-columns:1fr 1fr
}

.grid.slots-5,
.grid.slots-6{
  grid-template-columns:1fr 1fr 1fr
}

.grid.slots-7,
.grid.slots-8{
  grid-template-columns:1fr 1fr 1fr 1fr
}

.slot{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background:#1a222d;
  min-height:70px
}

.slot video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#10161e
}

.slot audio{
  display:none
}

.slot-avatar{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:linear-gradient(160deg,#1b5e20,#0d47a1)
}

.slot-avatar .face{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700
}

.slot-name{
  position:absolute;
  left:6px;
  bottom:6px;
  z-index:5;
  font-size:11px;
  font-weight:600;
  background:rgba(0,0,0,.5);
  padding:3px 7px;
  border-radius:7px;
  max-width:92%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.slot-badge{
  position:absolute;
  top:6px;
  right:6px;
  z-index:5;
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  background:rgba(0,0,0,.45)
}

.slot.me{
  border:1px solid rgba(6,199,85,.55)
}

.chat-dock{
  position:fixed;
  left:0;
  right:0;
  z-index:45;
  bottom:calc(72px + env(safe-area-inset-bottom,0px));
  height:0;
  overflow:hidden;
  background:rgba(8,12,18,.94);
  border-top:1px solid rgba(255,255,255,.1);
  transition:height .25s ease;
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px)
}

body.chat-open .chat-dock{
  height:24vh;
  min-height:150px
}

.chat-dock-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 10px 0;
  font-size:11px;
  color:#90a4ae;
  flex-shrink:0
}

.chat-dock-head button{
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  border-radius:8px;
  padding:4px 10px;
  font-size:12px
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:8px 10px;
  font-size:13px;
  line-height:1.35;
  min-height:0
}

.chat-line{
  margin-bottom:6px;
  word-break:break-word
}

.chat-line .who{
  color:#81d4fa;
  font-weight:700;
  margin-right:4px
}

.chat-line .when{
  color:#78909c;
  font-size:10px;
  margin-left:6px
}

.chat-input-row{
  display:flex;
  gap:6px;
  padding:8px 10px;
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.35);
  flex-shrink:0
}

.chat-input-row input{
  flex:1;
  min-width:0;
  border:0;
  border-radius:10px;
  padding:10px 12px;
  background:#1c2430;
  color:#fff;
  font-size:14px;
  outline:none
}

.chat-input-row button{
  border:0;
  border-radius:10px;
  padding:0 14px;
  background:#06C755;
  color:#fff;
  font-weight:700;
  font-size:14px
}

.controls{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.92))
}

.ctrl{
  width:54px;
  height:54px;
  border-radius:50%;
  border:0;
  background:rgba(255,255,255,.18);
  color:#fff;
  font-size:10px;
  font-weight:700;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px
}

.ctrl .ico{
  font-size:18px
}

.ctrl.off{
  background:#e53935
}

.ctrl.disabled{
  opacity:.45
}

.ctrl.hangup{
  background:#e53935;
  width:58px;
  height:58px
}

.kb-fab{
  position:fixed;
  right:14px;
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  z-index:55;
  width:48px;
  height:48px;
  border-radius:50%;
  border:0;
  background:#1565c0;
  color:#fff;
  font-size:22px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center
}

body.chat-open .kb-fab{
  display:none
}

.hint{
  position:fixed;
  left:10px;
  right:10px;
  z-index:40;
  text-align:center;
  font-size:11px;
  color:#b0bec5;
  pointer-events:none;
  bottom:calc(78px + env(safe-area-inset-bottom,0px))
}

body.chat-open .hint{
  display:none
}

.panel-mask{
  display:none;
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(0,0,0,.55)
}

.panel-mask.show{
  display:block
}

.member-panel{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:90;
  max-height:55vh;
  overflow:auto;
  background:#161c24;
  border-radius:16px;
  padding:14px;
  display:none
}

.member-panel.show{
  display:block
}

.member-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 4px;
  border-bottom:1px solid rgba(255,255,255,.06)
}

.member-av{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#2a3441;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700
}

.member-meta{
  flex:1;
  min-width:0
}

.member-meta .n{
  font-size:14px;
  font-weight:600
}

.member-meta .s{
  font-size:12px;
  opacity:.75
}

.tag{
  font-size:11px;
  font-weight:700;
  padding:4px 8px;
  border-radius:999px
}

.tag.on{
  background:rgba(6,199,85,.2);
  color:#69f0ae
}

.tag.off{
  background:rgba(255,255,255,.08);
  color:#9e9e9e
}

.tag.vid{
  background:rgba(33,150,243,.2);
  color:#90caf9
}

.tag.txt{
  background:rgba(255,193,7,.15);
  color:#ffe082
}
</style>
</head>

<body>

<div class="top-bar">
  <div style="min-width:0;flex:1">
    <div class="room-name" id="roomName">群組通話</div>
    <div class="room-sub" id="roomSub">會議進行中 · 準備中…</div>
  </div>

  <div class="top-right">
    <div class="online-pill">
      <span class="online-dot"></span>
      <span id="onlineCount">0</span>在線
    </div>

    <button type="button" class="icon-btn" id="btnMembers" title="成員">
      👤
    </button>
  </div>
</div>

<div class="grid slots-1" id="videoGrid"></div>

<div class="chat-dock" id="chatDock">

  <div class="chat-dock-head">
    <span>會議訊息（所有與會成員都會看到）</span>
    <button type="button" id="btnChatCollapse">收起</button>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-row">
    <input
      type="text"
      id="chatInput"
      placeholder="輸入訊息給通話中的朋友…"
      maxlength="500"
      autocomplete="off"
    >

    <button type="button" id="btnChatSend">
      送出
    </button>
  </div>

</div>

<button
  type="button"
  class="kb-fab"
  id="kbFab"
  title="打字"
>
  ⌨️
</button>

<div class="hint" id="ruleHint">
  視訊最多 8 人 · 視訊／語音都可以打字
</div>

<div class="controls">

  <button type="button" class="ctrl off" id="btnMic">
    <span class="ico">🔇</span>
    麥克風
  </button>

  <button type="button" class="ctrl off" id="btnCam">
    <span class="ico">📷</span>
    視訊
  </button>

  <button type="button" class="ctrl hangup" id="btnHangup">
    <span class="ico">📞</span>
    退出
  </button>

</div>

<div class="panel-mask" id="panelMask"></div>

<div class="member-panel" id="memberPanel">
  <h3 style="margin:0 0 10px;font-size:15px">
    群組成員狀態
  </h3>

  <div id="memberList"></div>
</div>


<script>
(function () {

  "use strict";
  var grid = document.getElementById("videoGrid");
  var SUPABASE_URL =
    "https://perfsipperncvjocznhl.supabase.co";

  var SUPABASE_KEY =
    "sb_publishable_qpqAwj49L6HcWqWTnNsTxw_oBEauWBA";

  var TOKEN_FUNCTION_URL =
    SUPABASE_URL +
    "/functions/v1/livekit-token";

  var MAX_VIDEO = 8;

  var params =
    new URLSearchParams(location.search);

  var mode =
    (params.get("mode") || "audio")
      .toLowerCase();

  var roomName =
    params.get("name") ||
    params.get("room") ||
    "群組通話";

  var roomId =
    params.get("room_id") ||
    params.get("id") ||
    roomName;

  var sb =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  var me = null;

  var myName = "我";

  var livekitRoom = null;

  var livekitUrl = "";

  var chatChannel = null;

  var chatLog = [];

  var chatOpen = false;

  var destroyed = false;

  var participants = {};

  var videoPublications = {};

  var attachedTracks = {};

  var pendingTrackElements = {};

  var micOn = false;

  var camOn = false;


  /*
   * =========================================================
   * 基本工具
   * =========================================================
   */

  function escapeHtml(s) {

    return String(s || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");

  }


  function initialOf(n) {

    n =
      (n || "?").trim();

    return n
      ? n.charAt(0).toUpperCase()
      : "?";

  }


  function getLiveKit(){

    return window.LivekitClient;

  }


  function getParticipantId(p){

    return String(
      p.identity ||
      p.sid ||
      ""
    );

  }


  function getParticipantName(p){

    return (
      p.name ||
      p.identity ||
      "成員"
    );

  }


  function isLocalParticipant(p){

    return (
      livekitRoom &&
      p &&
      p.identity ===
      livekitRoom.localParticipant.identity
    );

  }


  function getAllParticipants(){

    var list = [];

    if(
      livekitRoom &&
      livekitRoom.localParticipant
    ){

      list.push(
        livekitRoom.localParticipant
      );

    }

    if(
      livekitRoom &&
      livekitRoom.remoteParticipants
    ){

      livekitRoom.remoteParticipants
        .forEach(function(p){

          list.push(p);

        });

    }

    return list;

  }


  function getOnlineCount(){

    return getAllParticipants().length;

  }


  function countVideoOn(){

    var n = 0;

    getAllParticipants()
      .forEach(function(p){

        if(
          p.isCameraEnabled
        ){

          n++;

        }

      });

    return n;

  }


  function canEnableVideo(){

    return (
      camOn ||
      countVideoOn() < MAX_VIDEO
    );

  }


  /*
   * =========================================================
   * UI
   * =========================================================
   */

  function updateTop(){

    document.getElementById(
      "onlineCount"
    ).textContent =
      String(getOnlineCount());


    var v =
      countVideoOn();


    document.getElementById(
      "roomSub"
    ).textContent =
      "會議進行中 · " +
      (
        mode === "video"
          ? "視訊模式"
          : "語音模式"
      ) +
      " · 視訊 " +
      v +
      "/" +
      MAX_VIDEO;


    var b =
      document.getElementById(
        "btnCam"
      );


    if(
      v >= MAX_VIDEO &&
      !camOn
    ){

      document.getElementById(
        "ruleHint"
      ).textContent =
        "視訊已滿 8 人，僅能語音；視訊／語音都可以打字";

      b.classList.add(
        "disabled"
      );

    }else{

      document.getElementById(
        "ruleHint"
      ).textContent =
        "視訊／語音都可以打字 · 視訊最多 8 人";

      b.classList.remove(
        "disabled"
      );

    }

  }


  function setMicUi(){

    var b =
      document.getElementById(
        "btnMic"
      );


    if(micOn){

      b.classList.remove(
        "off"
      );

      b.innerHTML =
        '<span class="ico">🎤</span>麥克風';

    }else{

      b.classList.add(
        "off"
      );

      b.innerHTML =
        '<span class="ico">🔇</span>麥克風';

    }

  }


  function setCamUi(){

    var b =
      document.getElementById(
        "btnCam"
      );


    if(camOn){

      b.classList.remove(
        "off"
      );

      b.innerHTML =
        '<span class="ico">📹</span>視訊';

    }else{

      b.classList.add(
        "off"
      );

      b.innerHTML =
        '<span class="ico">📷</span>視訊';

    }

  }


  /*
   * =========================================================
   * Chat UI
   * =========================================================
   */

  function setChatOpen(
    on,
    focusInput
  ){

    chatOpen =
      !!on;

    document.body.classList.toggle(
      "chat-open",
      chatOpen
    );


    setTimeout(function(){

      if(chatOpen){

        var el =
          document.getElementById(
            "chatInput"
          );

        if(
          focusInput &&
          el
        ){

          el.focus();

        }

        scrollChatBottom();

      }

    },120);

  }


  function scrollChatBottom(){

    var box =
      document.getElementById(
        "chatMessages"
      );

    if(box){

      box.scrollTop =
        box.scrollHeight;

    }

  }


  function renderChat(){

    var box =
      document.getElementById(
        "chatMessages"
      );

    if(!box){
      return;
    }


    if(!chatLog.length){

      box.innerHTML =
        '<div style="opacity:.6;font-size:12px;padding:8px 0">'+
        '尚無訊息 · 本次會議結束後不保留'+
        '</div>';

      return;

    }


    box.innerHTML =
      chatLog.map(function(m){

        var t =
          m.at
            ? new Date(m.at)
            : null;

        var ts =
          t
            ? (
              t.getHours() +
              ":" +
              String(
                t.getMinutes()
              ).padStart(2,"0")
            )
            : "";


        return (
          '<div class="chat-line">' +
          '<span class="who">' +
          escapeHtml(
            m.name ||
            "成員"
          ) +
          "</span>" +
          escapeHtml(
            m.text
          ) +
          (
            ts
              ? '<span class="when">'+
                ts+
                "</span>"
              : ""
          ) +
          "</div>"
        );

      }).join("");


    scrollChatBottom();

  }


  function pushChat(msg){

    chatLog.push(msg);

    if(
      chatLog.length > 200
    ){

      chatLog =
        chatLog.slice(-200);

    }

    renderChat();


    if(!chatOpen){

      setChatOpen(
        true,
        false
      );

    }

  }


  /*
   * =========================================================
   * Video Grid
   *
   * LiveKit participant 是唯一狀態來源。
   * 不使用 Supabase Presence。
   * 不使用 RTCPeerConnection。
   * 不重建其他人的 MediaStream。
   * =========================================================
   */

  function renderGrid(){

    var list =
      getAllParticipants();


    list.sort(function(a,b){

      var aLocal =
        isLocalParticipant(a);

      var bLocal =
        isLocalParticipant(b);


      if(aLocal && !bLocal){
        return -1;
      }

      if(!aLocal && bLocal){
        return 1;
      }


      return getParticipantName(a)
        .localeCompare(
          getParticipantName(b)
        );

    });


    var slots =
      list.slice(
        0,
        MAX_VIDEO
      );


    var n =
      Math.max(
        1,
        slots.length
      );


    grid.className =
      "grid slots-" +
      Math.min(
        MAX_VIDEO,
        n
      );


    if(!slots.length){

      grid.innerHTML =
        '<div class="slot waiting-slot">'+
        '<div class="slot-avatar">'+
        '<div class="face">💬</div>'+
        '<div>等待通話成員…</div>'+
        '<div style="font-size:12px;opacity:.8">'+
        '可使用會議內打字'+
        '</div>'+
        '</div>'+
        '</div>';

      return;

    }


    var active = {};


    slots.forEach(function(p){

      var uid =
        getParticipantId(p);


      active[uid] =
        true;


      var slot =
        grid.querySelector(
          '.slot[data-user-id="' +
          CSS.escape(uid) +
          '"]'
        );


      if(!slot){

        slot =
          document.createElement(
            "div"
          );

        slot.className =
          "slot";

        slot.dataset.userId =
          uid;


        var avatar =
          document.createElement(
            "div"
          );

        avatar.className =
          "slot-avatar";

        avatar.innerHTML =
          '<div class="face">'+
          initialOf(
            getParticipantName(p)
          )+
          '</div>'+
          '<div class="avatar-name" '+
          'style="font-size:12px"></div>';


        var media =
          document.createElement(
            "video"
          );

        media.autoplay =
          true;

        media.playsInline =
          true;

        media.controls =
          false;

        media.muted =
          isLocalParticipant(p);


        var name =
          document.createElement(
            "div"
          );

        name.className =
          "slot-name";


        var badge =
          document.createElement(
            "div"
          );

        badge.className =
          "slot-badge";


        slot.appendChild(
          avatar
        );

        slot.appendChild(
          media
        );

        slot.appendChild(
          name
        );

        slot.appendChild(
          badge
        );

        grid.appendChild(
          slot
        );

      }


      var media =
        slot.querySelector(
          "video"
        );

      var avatar =
        slot.querySelector(
          ".slot-avatar"
        );

      var avatarName =
        slot.querySelector(
          ".avatar-name"
        );

      var name =
        slot.querySelector(
          ".slot-name"
        );

      var badge =
        slot.querySelector(
          ".slot-badge"
        );


      slot.className =
        "slot" +
        (
          isLocalParticipant(p)
            ? " me"
            : ""
        );


      if(avatarName){

        avatarName.textContent =
          getParticipantName(p);

      }


      var mic =
        p.isMicrophoneEnabled;


      var video =
        p.isCameraEnabled;


      name.textContent =
        getParticipantName(p) +
        (
          mic
            ? " · 🎤"
            : " · 🔇"
        );


      badge.textContent =
        video
          ? "視訊"
          : "語音";


      /*
       * 本人
       */

      if(
        isLocalParticipant(p)
      ){

        media.muted =
          true;


        var localCamera =
          p.getTrackPublication(
            LivekitClient.Track.Source.Camera
          );


        if(
          localCamera &&
          localCamera.videoTrack
        ){

          try{

            localCamera.videoTrack.detach(
              media
            );

          }catch(e){}


          try{

            localCamera.videoTrack.attach(
              media
            );

          }catch(e){}

          media.style.visibility =
            "visible";

          avatar.style.display =
            "none";

        }else{

          media.style.visibility =
            "hidden";

          avatar.style.display =
            "flex";

        }

      }else{

        media.muted =
          false;


        var publication =
          p.getTrackPublication(
            LivekitClient.Track.Source.Camera
          );


        if(
          publication &&
          publication.videoTrack
        ){

          try{

            publication.videoTrack.detach(
              media
            );

          }catch(e){}


          try{

            publication.videoTrack.attach(
              media
            );

          }catch(e){}

          media.style.visibility =
            "visible";

          avatar.style.display =
            "none";

          media.play().catch(
            function(){}
          );

        }else{

          media.style.visibility =
            "hidden";

          avatar.style.display =
            "flex";

        }

      }

    });


    Array.prototype.slice.call(
      grid.querySelectorAll(
        ".slot[data-user-id]"
      )
    ).forEach(function(slot){

      if(
        !active[
          slot.dataset.userId
        ]
      ){

        /*
         * 離開的人才移除自己的格子。
         * 不碰其他人的 video element。
         */

        slot.remove();

      }

    });

  }


  /*
   * =========================================================
   * 成員面板
   * =========================================================
   */

  function renderMemberList(){

    var box =
      document.getElementById(
        "memberList"
      );


    var list =
      getAllParticipants();


    if(!list.length){

      box.innerHTML =
        '<div style="opacity:.7;font-size:13px">'+
        '尚無成員'+
        '</div>';

      return;

    }


    list.sort(function(a,b){

      var aLocal =
        isLocalParticipant(a);

      var bLocal =
        isLocalParticipant(b);


      if(aLocal && !bLocal){
        return -1;
      }

      if(!aLocal && bLocal){
        return 1;
      }


      return getParticipantName(a)
        .localeCompare(
          getParticipantName(b)
        );

    });


    box.innerHTML =
      list.map(function(p){

        var video =
          p.isCameraEnabled;

        var mic =
          p.isMicrophoneEnabled;


        var tags =
          '<span class="tag on">'+
          "在線"+
          "</span>";


        if(video){

          tags +=
            ' <span class="tag vid">'+
            "視訊"+
            "</span>";

        }


        return (
          '<div class="member-row">'+

          '<div class="member-av">'+
          initialOf(
            getParticipantName(p)
          )+
          '</div>'+

          '<div class="member-meta">'+

          '<div class="n">'+
          escapeHtml(
            getParticipantName(p)
          )+
          (
            isLocalParticipant(p)
              ? "（我）"
              : ""
          )+
          '</div>'+

          '<div class="s">'+
          (
            video
              ? "視訊中"
              : "語音中"
          )+
          (
            mic
              ? " · 麥克風開啟"
              : " · 麥克風關閉"
          )+
          '</div>'+

          '</div>'+

          tags+

          '</div>'
        );

      }).join("");

  }


  /*
   * =========================================================
   * LiveKit Token
   * =========================================================
   */

  async function getLiveKitToken(){

    if(!me){

      throw new Error(
        "尚未登入"
      );

    }


    var sessionResult =
      await sb.auth.getSession();


    var session =
      sessionResult.data &&
      sessionResult.data.session;


    if(!session){

      throw new Error(
        "登入已失效，請重新登入"
      );

    }


    var response =
      await fetch(
        TOKEN_FUNCTION_URL,
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " +
              session.access_token,

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              room:
                String(roomId),

              name:
                myName

            })
        }
      );


    var data;


    try{

      data =
        await response.json();

    }catch(e){

      data = {};

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "LiveKit Token 取得失敗"
      );

    }


    if(
      !data.token ||
      !data.url
    ){

      throw new Error(
        "LiveKit Token 回應不完整"
      );

    }


    livekitUrl =
      data.url;


    return data.token;

  }


  /*
   * =========================================================
   * LiveKit 事件
   * =========================================================
   */

  function setupLiveKitEvents(){

    if(!livekitRoom){
      return;
    }


    livekitRoom.on(
      LivekitClient.RoomEvent.ParticipantConnected,
      function(participant){

        participants[
          getParticipantId(participant)
        ] =
          participant;


        renderGrid();

        renderMemberList();

        updateTop();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.ParticipantDisconnected,
      function(participant){

        var uid =
          getParticipantId(
            participant
          );


        delete participants[uid];


        /*
         * 只移除離開者。
         * 不重建其他人的媒體。
         */

        var slot =
          grid.querySelector(
            '.slot[data-user-id="' +
            CSS.escape(uid) +
            '"]'
          );


        if(slot){

          slot.remove();

        }


        renderGrid();

        renderMemberList();

        updateTop();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.TrackSubscribed,
      function(
        track,
        publication,
        participant
      ){

        if(
          track.kind ===
          LivekitClient.Track.Kind.Video
        ){

          var uid =
            getParticipantId(
              participant
            );


          var slot =
            grid.querySelector(
              '.slot[data-user-id="' +
              CSS.escape(uid) +
              '"]'
            );


          if(!slot){

            renderGrid();

            slot =
              grid.querySelector(
                '.slot[data-user-id="' +
                CSS.escape(uid) +
                '"]'
              );

          }


          if(slot){

            var media =
              slot.querySelector(
                "video"
              );

            var avatar =
              slot.querySelector(
                ".slot-avatar"
              );


            try{

              track.attach(
                media
              );

            }catch(e){

              console.warn(
                "LiveKit video attach failed",
                e
              );

            }


            media.style.visibility =
              "visible";

            avatar.style.display =
              "none";


            media.play().catch(
              function(){}
            );

          }

        }


        if(
          track.kind ===
          LivekitClient.Track.Kind.Audio
        ){

          try{

            var audio =
              track.attach();

            audio.style.display =
              "none";

            document.body.appendChild(
              audio
            );

            audio.play().catch(
              function(){}
            );

          }catch(e){

            console.warn(
              "LiveKit audio attach failed",
              e
            );

          }

        }


        renderGrid();

        renderMemberList();

        updateTop();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.TrackUnsubscribed,
      function(
        track,
        publication,
        participant
      ){

        try{

          track.detach();

        }catch(e){}


        renderGrid();

        renderMemberList();

        updateTop();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.LocalTrackPublished,
      function(){

        renderGrid();

        renderMemberList();

        updateTop();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.LocalTrackUnpublished,
      function(){

        renderGrid();

        renderMemberList();

        updateTop();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.ParticipantMetadataChanged,
      function(){

        renderGrid();

        renderMemberList();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.ActiveSpeakersChanged,
      function(){

        renderGrid();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.Disconnected,
      function(){

        if(!destroyed){

          document.getElementById(
            "roomSub"
          ).textContent =
            "會議連線已中斷";

        }

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.Reconnecting,
      function(){

        document.getElementById(
          "roomSub"
        ).textContent =
          "會議重新連線中…";

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.Reconnected,
      function(){

        document.getElementById(
          "roomSub"
        ).textContent =
          "會議已重新連線";


        renderGrid();

        renderMemberList();

        updateTop();

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.MediaDevicesError,
      function(error){

        console.warn(
          "LiveKit media device error",
          error
        );

      }
    );


    livekitRoom.on(
      LivekitClient.RoomEvent.AudioPlaybackStatusChanged,
      function(){

        if(
          livekitRoom &&
          !livekitRoom.canPlaybackAudio
        ){

          document.getElementById(
            "ruleHint"
          ).textContent =
            "請點擊畫面或按鈕啟用通話聲音";

        }

      }
    );

  }


  /*
   * =========================================================
   * 建立 LiveKit Room
   * =========================================================
   */

  async function connectLiveKit(){

    if(
      !getLiveKit()
    ){

      throw new Error(
        "LiveKit SDK 載入失敗"
      );

    }


    var token =
      await getLiveKitToken();


    livekitRoom =
      new LivekitClient.Room({

        adaptiveStream:true,

        dynacast:true,

        disconnectOnPageLeave:true,

        stopLocalTrackOnUnpublish:true

      });


    setupLiveKitEvents();


    document.getElementById(
      "roomSub"
    ).textContent =
      "連線 LiveKit SFU…";


    await livekitRoom.connect(
      livekitUrl,
      token,
      {
        autoSubscribe:true
      }
    );


    /*
     * 記住目前與會者。
     */

    participants = {};


    participants[
      livekitRoom.localParticipant
        .identity
    ] =
      livekitRoom.localParticipant;


    livekitRoom.remoteParticipants
      .forEach(function(p){

        participants[
          p.identity
        ] =
          p;

      });


    /*
     * 麥克風
     */

    try{

      await livekitRoom
        .localParticipant
        .setMicrophoneEnabled(
          true
        );

      micOn =
        true;

    }catch(e){

      micOn =
        false;

      console.warn(
        "microphone unavailable",
        e
      );

    }


    setMicUi();


    /*
     * 視訊模式自動開鏡。
     */

    if(
      mode === "video"
    ){

      if(
        countVideoOn() <
        MAX_VIDEO
      ){

        try{

          await livekitRoom
            .localParticipant
            .setCameraEnabled(
              true,
              {
                facingMode:"user",

                width:{
                  ideal:640
                },

                height:{
                  ideal:480
                }

              }
            );

          camOn =
            true;

        }catch(e){

          camOn =
            false;

          console.warn(
            "auto camera failed",
            e
          );

        }

      }

    }


    setCamUi();

    renderGrid();

    renderMemberList();

    updateTop();


    try{

      localStorage.setItem(
        "safe_reunion_in_meeting_" +
        String(roomId),
        "1"
      );

    }catch(e){}


    document.getElementById(
      "roomSub"
    ).textContent =
      "已進入會議 · LiveKit SFU";

  }


  /*
   * =========================================================
   * 麥克風
   * =========================================================
   */

  async function toggleMic(){

    if(
      !livekitRoom ||
      !livekitRoom.localParticipant
    ){

      return;

    }


    try{

      var next =
        !micOn;


      await livekitRoom
        .localParticipant
        .setMicrophoneEnabled(
          next
        );


      micOn =
        next;


      setMicUi();

      renderGrid();

      renderMemberList();

      updateTop();

    }catch(e){

      console.error(
        "toggle microphone error",
        e
      );


      alert(
        "無法使用麥克風：" +
        (
          e.message ||
          e
        )
      );

    }

  }


  /*
   * =========================================================
   * 攝影機
   *
   * 這裡完全不建立 PeerConnection。
   * LiveKit 自己處理發佈、取消發佈、
   * 重新連線與其他成員的訂閱。
   * =========================================================
   */

  async function toggleCam(){

    if(
      !livekitRoom ||
      !livekitRoom.localParticipant
    ){

      return;

    }


    try{

      if(
        !camOn &&
        !canEnableVideo()
      ){

        alert(
          "視訊名額已滿（最多 8 人）。\n"+
          "請等有人關閉視訊。\n"+
          "你仍可使用語音或打字。"
        );

        return;

      }


      var next =
        !camOn;


      await livekitRoom
        .localParticipant
        .setCameraEnabled(
          next,
          {
            facingMode:"user",

            width:{
              ideal:640
            },

            height:{
              ideal:480
            }

          }
        );


      camOn =
        next;


      setCamUi();

      renderGrid();

      renderMemberList();

      updateTop();

    }catch(e){

      console.error(
        "toggle camera error",
        e
      );


      alert(
        "無法使用鏡頭：" +
        (
          e.message ||
          e
        )
      );

    }

  }


  /*
   * =========================================================
   * Chat
   * =========================================================
   */

  async function sendChat(){

    var input =
      document.getElementById(
        "chatInput"
      );


    var text =
      (input.value || "")
        .trim();


    if(
      !text ||
      !me
    ){

      return;

    }


    input.value =
      "";


    var payload = {

      user_id:
        me.id,

      name:
        myName,

      text:
        text,

      at:
        Date.now(),

      room_id:
        String(roomId)

    };


    pushChat(payload);


    try{

      if(chatChannel){

        await chatChannel.send({

          type:"broadcast",

          event:"call_chat",

          payload:payload

        });

      }

    }catch(e){

      console.warn(
        "chat send failed",
        e
      );

    }

  }


  async function setupChat(){

    chatChannel =
      sb.channel(
        "group-call-chat:" +
        String(roomId)
      );


    chatChannel.on(
      "broadcast",
      {
        event:"call_chat"
      },
      function(message){

        var p =
          message &&
          message.payload
            ? message.payload
            : message;


        if(
          !p ||
          !p.text
        ){

          return;

        }


        if(
          me &&
          p.user_id ===
          me.id
        ){

          return;

        }


        pushChat(p);

      }
    );


    await chatChannel.subscribe();

  }


  /*
   * =========================================================
   * 加入會議
   * =========================================================
   */

  async function joinRoom(){

    document.getElementById(
      "roomSub"
    ).textContent =
      "檢查登入…";


    var sessionResult;


    try{

      sessionResult =
        await sb.auth.getSession();

    }catch(e){

      document.getElementById(
        "roomSub"
      ).textContent =
        "登入檢查失敗";

      alert(
        "無法檢查登入：" +
        (
          e.message ||
          e
        )
      );

      return;

    }


    var session =
      sessionResult.data &&
      sessionResult.data.session;


    me =
      session &&
      session.user;


    if(!me){

      document.getElementById(
        "roomSub"
      ).textContent =
        "尚未登入";


      alert(
        "請先登入再進入群組通話"
      );


      location.href =
        "login.html";


      return;

    }


    myName =
      (
        me.user_metadata &&
        (
          me.user_metadata.full_name ||
          me.user_metadata.display_name
        )
      ) ||
      (
        me.email
          ? me.email.split("@")[0]
          : "成員"
      );


    document.getElementById(
      "roomName"
    ).textContent =
      roomName;


    document.getElementById(
      "roomSub"
    ).textContent =
      "取得 LiveKit 會議權杖…";


    await setupChat();


    await connectLiveKit();


    renderGrid();

    renderMemberList();

    updateTop();

  }


  /*
   * =========================================================
   * 退出
   * =========================================================
   */

  async function hangup(){

    if(destroyed){
      return;
    }


    destroyed =
      true;


    chatLog =
      [];

    renderChat();


    try{

      if(
        livekitRoom
      ){

        await livekitRoom.disconnect(
          true
        );

        livekitRoom =
          null;

      }

    }catch(e){

      console.warn(
        "LiveKit disconnect error",
        e
      );

    }


    try{

      if(chatChannel){

        await chatChannel.unsubscribe();

        sb.removeChannel(
          chatChannel
        );

        chatChannel =
          null;

      }

    }catch(e){}


    try{

      localStorage.removeItem(
        "safe_reunion_in_meeting_" +
        String(roomId)
      );

    }catch(e){}


    var back =
      "room.html?id=" +
      encodeURIComponent(
        roomId
      ) +
      "&name=" +
      encodeURIComponent(
        roomName
      );


    location.href =
      back;

  }


  /*
   * =========================================================
   * 按鈕
   * =========================================================
   */

  document.getElementById(
    "btnMic"
  ).onclick =
    function(){

      toggleMic();

    };


  document.getElementById(
    "btnCam"
  ).onclick =
    function(){

      if(
        document.getElementById(
          "btnCam"
        ).classList.contains(
          "disabled"
        ) &&
        !camOn
      ){

        alert(
          "視訊已滿 8 人"
        );

        return;

      }


      toggleCam();

    };


  document.getElementById(
    "btnHangup"
  ).onclick =
    function(){

      hangup();

    };


  document.getElementById(
    "kbFab"
  ).onclick =
    function(){

      setChatOpen(
        !chatOpen,
        !chatOpen
      );

    };


  document.getElementById(
    "btnChatCollapse"
  ).onclick =
    function(){

      setChatOpen(
        false
      );

    };


  document.getElementById(
    "btnChatSend"
  ).onclick =
    function(){

      sendChat();

    };


  document.getElementById(
    "chatInput"
  ).addEventListener(
    "keydown",
    function(e){

      if(
        e.key ===
        "Enter"
      ){

        e.preventDefault();

        sendChat();

      }

    }
  );


  document.getElementById(
    "chatInput"
  ).addEventListener(
    "focus",
    function(){

      if(!chatOpen){

        setChatOpen(
          true,
          false
        );

      }

    }
  );


  document.getElementById(
    "btnMembers"
  ).onclick =
    function(){

      renderMemberList();


      document.getElementById(
        "memberPanel"
      ).classList.add(
        "show"
      );


      document.getElementById(
        "panelMask"
      ).classList.add(
        "show"
      );

    };


  document.getElementById(
    "panelMask"
  ).onclick =
    function(){

      document.getElementById(
        "memberPanel"
      ).classList.remove(
        "show"
      );


      document.getElementById(
        "panelMask"
      ).classList.remove(
        "show"
      );

    };


  /*
   * =========================================================
   * 頁面關閉
   * =========================================================
   */

  window.addEventListener(
    "beforeunload",
    function(){

      destroyed =
        true;


      try{

        if(
          livekitRoom
        ){

          livekitRoom.disconnect(
            true
          );

        }

      }catch(e){}


      try{

        if(chatChannel){

          sb.removeChannel(
            chatChannel
          );

        }

      }catch(e){}

    }
  );


  /*
   * =========================================================
   * 啟動
   * =========================================================
   */

  document.getElementById(
    "roomName"
  ).textContent =
  roomName;


  updateTop();

  setMicUi();

  setCamUi();

  renderChat();


  console.log(
    "group-call LiveKit SFU boot",
    {
      mode:
        mode,

      roomId:
        roomId,

      roomName:
        roomName
    }
  );


  joinRoom()
    .catch(function(e){

      console.error(
        "group-call startup error",
        e
      );


      document.getElementById(
        "roomSub"
      ).textContent =
        "啟動失敗：" +
        (
          e.message ||
          e
        );

    });


})();
</script>
