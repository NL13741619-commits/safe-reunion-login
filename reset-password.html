<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>重設密碼 - 安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
    .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
      margin-top: 12px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #06C755; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      margin-top: 24px;
      cursor: pointer;
      background: #06C755;
      color: white;
    }
    .links {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }
    .links a { color: #06C755; text-decoration: none; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      word-break: break-all;
    }
    .status.ok { background: #e8f5e9; color: #2e7d32; display: block; }
    .status.err { background: #fdecea; color: #c62828; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>重設密碼</h1>
    <div class="sub">請輸入新的密碼</div>

    <label>新密碼</label>
    <input type="password" id="password" placeholder="至少 6 碼">

    <label>確認新密碼</label>
    <input type="password" id="password2" placeholder="再輸入一次">

    <button class="btn" id="btnReset">更新密碼</button>

    <div class="links">
      <a href="login.html">返回登入</a>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      if (el) {
        el.textContent = msg;
        el.className = 'status ' + (isError ? 'err' : 'ok');
      }
      alert(msg);
    }

    window.addEventListener('DOMContentLoaded', function () {
      if (!window.supabase) {
        showStatus('Supabase 套件載入失敗', true);
        return;
      }

      const SUPABASE_URL = 'https://perfsipperncvjocznhl.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      document.getElementById('btnReset').onclick = async function () {
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;

        if (!password || password.length < 6) {
          showStatus('密碼至少需要 6 碼', true);
          return;
        }
        if (password !== password2) {
          showStatus('兩次密碼不一致', true);
          return;
        }

        showStatus('正在更新密碼…');

        try {
          const { error } = await supabase.auth.updateUser({ password: password });
          if (error) {
            showStatus('更新失敗：' + error.message, true);
            return;
          }
          showStatus('密碼已更新，請重新登入。');
          setTimeout(function () {
            location.href = 'login.html';
          }, 1500);
        } catch (e) {
          showStatus('發生錯誤：' + e.message, true);
        }
      };
    });
  </script>
</body>
</html>
