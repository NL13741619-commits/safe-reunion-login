<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>安全中心 - 安全團聚</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background: #f5f5f5;
      color: #111;

      min-height: 100vh;
      padding-bottom: 70px;
    }


    /* =====================================================
       頂部
    ====================================================== */

    .header {

      background: #06C755;
      color: white;

      padding: 14px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;

      z-index: 100;
    }


    .header-left {

      display: flex;
      align-items: center;
      gap: 10px;
    }


    .back-btn {

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;
      text-decoration: none;

      font-size: 24px;

      -webkit-tap-highlight-color: transparent;
    }


    .back-btn:active,
    .header-action:active {

      background: rgba(255,255,255,0.18);
      transform: scale(0.94);

    }


    .header h1 {

      font-size: 18px;
      font-weight: 700;
    }


    .header-action {

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;
      text-decoration: none;

      font-size: 21px;
    }


    /* =====================================================
       內容
    ====================================================== */

    .content {

      padding: 16px 12px;
    }


    .section-title {

      font-size: 16px;
      font-weight: 700;

      margin: 4px 4px 12px;
    }


    /* =====================================================
       SOS
    ====================================================== */

    .sos-card {

      background: #e53935;
      color: white;

      border-radius: 16px;

      padding: 22px 18px;

      text-align: center;

      margin-bottom: 12px;

      box-shadow:
        0 4px 12px rgba(229,57,53,0.25);

      cursor: pointer;

      user-select: none;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.1s,
        background 0.2s,
        opacity 0.2s;
    }


    .sos-card:active {

      transform: scale(0.98);

    }


    .sos-card.loading {

      background: #c62828;
      pointer-events: none;

    }


    .sos-card.success {

      background: #b71c1c;

    }


    .sos-icon {

      font-size: 38px;
      margin-bottom: 6px;
    }


    .sos-title {

      font-size: 20px;
      font-weight: 800;

      margin-bottom: 4px;
    }


    .sos-desc {

      font-size: 12px;
      opacity: 0.92;

      line-height: 1.5;
    }


    /* =====================================================
       SOS 群組選擇
    ====================================================== */

    .sos-group-panel {

      display: none;

      background: white;

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }


    .sos-group-panel.show {

      display: block;

    }


    .sos-group-title {

      font-size: 16px;
      font-weight: 700;

      margin-bottom: 6px;
    }


    .sos-group-desc {

      color: #777;

      font-size: 12px;

      line-height: 1.5;

      margin-bottom: 12px;
    }


    .sos-group-select {

      width: 100%;

      height: 44px;

      padding: 0 12px;

      border: 1px solid #ddd;

      border-radius: 10px;

      background: #fff;

      color: #222;

      font-size: 14px;

      outline: none;
    }


    .sos-group-select:focus {

      border-color: #06C755;

    }


    .sos-group-actions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 12px;
    }


    .sos-btn {

      border: none;

      border-radius: 10px;

      min-height: 44px;

      padding: 10px;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    .sos-btn-cancel {

      background: #f1f1f1;

      color: #333;
    }


    .sos-btn-confirm {

      background: #e53935;

      color: white;
    }


    .sos-btn-confirm:disabled {

      background: #aaa;

      cursor: not-allowed;
    }


    /* =====================================================
       SOS 狀態
    ====================================================== */

    .sos-status-card {

      display: none;

      background: white;

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }


    .sos-status-card.show {

      display: block;

    }


    .sos-status-title {

      font-size: 16px;

      font-weight: 700;

      color: #c62828;

      margin-bottom: 10px;
    }


    .sos-status-text {

      font-size: 13px;

      color: #555;

      line-height: 1.65;

      word-break: break-word;
    }


    .sos-location {

      background: #f7f7f7;

      border-radius: 10px;

      padding: 11px;

      margin-top: 10px;

      font-size: 12px;

      line-height: 1.6;

      color: #444;
    }


    .sos-actions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 12px;
    }


    .sos-action-btn {

      border: none;

      border-radius: 10px;

      min-height: 44px;

      padding: 10px;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }


    .call-119 {

      background: #e53935;

      color: white;
    }


    .call-110 {

      background: #1565c0;

      color: white;
    }


    .share-sos {

      background: #06C755;

      color: white;
    }


    .close-sos {

      background: #eee;

      color: #333;
    }


    /* =====================================================
       安全功能
    ====================================================== */

    .function-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom: 20px;
    }


    .function-item {

      background: white;

      border-radius: 14px;

      padding: 16px 6px;

      text-align: center;

      text-decoration: none;

      color: inherit;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.04);

      -webkit-tap-highlight-color: transparent;
    }


    .function-item:active {

      transform: scale(0.98);

    }


    .function-icon {

      font-size: 26px;

      margin-bottom: 7px;
    }


    .function-label {

      font-size: 12px;

      color: #444;

      line-height: 1.3;
    }


    /* =====================================================
       家庭／群組
    ====================================================== */

    .group-card {

      background: white;

      border-radius: 14px;

      padding: 16px;

      margin-bottom: 12px;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.04);
    }


    .group-title {

      font-size: 15px;
      font-weight: 700;

      margin-bottom: 12px;
    }


    .group-row {

      display: flex;

      justify-content: space-between;

      padding: 11px 0;

      border-top: 1px solid #f0f0f0;

      text-decoration: none;

      color: inherit;
    }


    .group-row:first-of-type {

      border-top: none;
    }


    .group-name {

      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 14px;
    }


    .group-arrow {

      color: #999;
      font-size: 20px;
    }


    /* =====================================================
       底部五大平台
    ====================================================== */

    .tabbar {

      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 58px;

      background: #fff;

      border-top: 1px solid #e8e8e8;

      display: flex;

    .tab {

      flex: 1;

      flex-direction: column;

      align-items: center;

      font-size: 11px;

      color: #888;

      text-decoration: none;
    }


    .tab.on {

      color: #06C755;

      font-weight: 600;
    }


    .tab .ico {

      font-size: 20px;

      line-height: 1.2;
    }

  </style>

</head>

  <script>

  (function () {

    "use strict";


    /* =====================================================
       Supabase
    ====================================================== */

    const SUPABASE_URL =
      "https://perfsipperncvjocznhl.supabase.co";


    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY";


    let supabaseClient = null;


    try {

      if (
        window.supabase &&
        window.supabase.createClient
      ) {

        supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

      }

    } catch (error) {

      console.error(
        "Supabase 初始化失敗：",
        error
      );

    }


    /* =====================================================
       DOM
    ====================================================== */

    const sosCard =
      document.getElementById("sosCard");


    const sosIcon =
      document.getElementById("sosIcon");


    const sosTitle =
      document.getElementById("sosTitle");


    const sosDesc =
      document.getElementById("sosDesc");


    const sosGroupPanel =
      document.getElementById("sosGroupPanel");


    const sosGroupSelect =
      document.getElementById("sosGroupSelect");


    const btnCancelSos =
      document.getElementById("btnCancelSos");


    const btnConfirmSos =
      document.getElementById("btnConfirmSos");


    const sosStatusCard =
      document.getElementById("sosStatusCard");


    const sosStatusText =
      document.getElementById("sosStatusText");


    const sosLocation =
      document.getElementById("sosLocation");


    const call119Btn =
      document.getElementById("call119Btn");


    const call110Btn =
      document.getElementById("call110Btn");


    const shareSosBtn =
      document.getElementById("shareSosBtn");


    const closeSosBtn =
      document.getElementById("closeSosBtn");


    /* =====================================================
       SOS 狀態
    ====================================================== */

    let currentUser = null;

    let currentGroups = [];

    let currentLatitude = null;

    let currentLongitude = null;

    let currentAccuracy = null;

    let currentGroupId = null;

    let currentGroupName = "";

    let sosActive = false;


    /* =====================================================
       取得登入者
    ====================================================== */

    async function getCurrentUser() {

      if (!supabaseClient) {

        throw new Error(
          "Supabase 尚未初始化。"
        );

      }


      const result =
        await supabaseClient.auth.getUser();


      if (result.error) {

        throw result.error;

      }


      const user =
        result.data &&
        result.data.user;


      if (!user) {

        throw new Error(
          "請先登入安全團聚。"
        );

      }


      currentUser =
        user;


      return user;

    }


    /* =====================================================
       取得目前使用者加入的群組
       
       ★ 已修正：
       group_members → chat_groups
       
       不再使用 groups
    ====================================================== */

    async function loadMySOSGroups() {

      const user =
        await getCurrentUser();


      const memberResult =
        await supabaseClient
          .from("group_members")
          .select("group_id")
          .eq(
            "user_id",
            user.id
          );


      if (memberResult.error) {

        throw memberResult.error;

      }


      const memberRows =
        memberResult.data || [];


      const groupIds =
        memberRows
          .map(function (row) {

            return row.group_id;

          })
          .filter(function (id) {

            return !!id;

          });


      if (!groupIds.length) {

        return [];

      }


      /*
       * ★★★ 重要修正 ★★★
       *
       * 通訊錄 contacts.html 使用 chat_groups。
       * SOS 也必須使用同一張表。
       */

      const groupResult =
        await supabaseClient
          .from("chat_groups")
          .select("id,name")
          .in(
            "id",
            groupIds
          );


      if (groupResult.error) {

        console.error(
          "chat_groups 查詢失敗：",
          groupResult.error
        );

        throw groupResult.error;

      }


      const groupRows =
        groupResult.data || [];


      return groupIds.map(
        function (groupId) {

          const group =
            groupRows.find(
              function (item) {

                return String(item.id) ===
                  String(groupId);

              }
            );


          /*
           * ★ 不再顯示 UUID 前八碼
           */

          return {

            id:
              groupId,

            name:
              group &&
              group.name
                ? String(group.name)
                : "群組"

          };

        }
      );

    }


    /* =====================================================
       開啟 SOS 群組選擇
    ====================================================== */

    async function openSOSSelector() {

      if (!sosGroupPanel) {

        return;

      }


      sosGroupPanel.classList.add(
        "show"
      );


      sosGroupSelect.innerHTML =
        '<option value="">載入群組中…</option>';


      btnConfirmSos.disabled =
        true;


      currentGroupId =
        null;


      currentGroupName =
        "";


      try {

        const groups =
          await loadMySOSGroups();


        currentGroups =
          groups;


        if (!groups.length) {

          sosGroupSelect.innerHTML =
            '<option value="">你目前沒有加入任何群組</option>';


          alert(
            "你目前沒有加入任何群組，因此無法發送 SOS。"
          );


          return;

        }


        sosGroupSelect.innerHTML =
          '<option value="">請選擇要發送的群組</option>';


        groups.forEach(
          function (group) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              String(group.id);


            /*
             * ★★★ 這裡現在顯示 chat_groups.name
             *
             * 例如：
             * 家人群
             */

            option.textContent =
              group.name;


            sosGroupSelect.appendChild(
              option
            );

          }
        );


      } catch (error) {

        console.error(
          "取得 SOS 群組失敗：",
          error
        );


        sosGroupSelect.innerHTML =
          '<option value="">無法取得群組</option>';


        alert(
          "無法取得你的群組。\n\n" +
          (
            error &&
            error.message
              ? error.message
              : error
          )
        );

      }

    }


    /* =====================================================
       SOS 主按鈕
    ====================================================== */

    async function handleSOSClick() {

      if (sosActive) {

        return;

      }


      await openSOSSelector();

    }


    if (sosCard) {

      sosCard.addEventListener(
        "click",
        handleSOSClick
      );


      sosCard.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter" ||
            event.key === " "
          ) {

            event.preventDefault();

            handleSOSClick();

          }

        }
      );

    }


    /* =====================================================
       選擇群組
    ====================================================== */

    if (sosGroupSelect) {

      sosGroupSelect.addEventListener(
        "change",
        function () {

          const selected =
            sosGroupSelect.value;


          btnConfirmSos.disabled =
            !selected;


          const group =
            currentGroups.find(
              function (item) {

                return String(item.id) ===
                  String(selected);

              }
            );


          currentGroupId =
            selected || null;


          currentGroupName =
            group
              ? group.name
              : "";

        }
      );

    }


    /* =====================================================
       取消
    ====================================================== */

    if (btnCancelSos) {

      btnCancelSos.addEventListener(
        "click",
        function () {

          sosGroupPanel.classList.remove(
            "show"
          );


          sosGroupSelect.value =
            "";


          currentGroupId =
            null;


          currentGroupName =
            "";


          btnConfirmSos.disabled =
            true;

        }
      );

    }


    /* =====================================================
       取得 GPS
    ====================================================== */

    function getGPS() {

      return new Promise(
        function (resolve, reject) {

          if (!navigator.geolocation) {

            reject(
              new Error(
                "此裝置不支援定位功能。"
              )
            );

            return;

          }


          navigator.geolocation.getCurrentPosition(

            function (position) {

              currentLatitude =
                position.coords.latitude;


              currentLongitude =
                position.coords.longitude;


              currentAccuracy =
                position.coords.accuracy;


              resolve(position);

            },


            function (error) {

              let message =
                "無法取得你的位置。";


              if (error.code === 1) {

                message +=
                  "\n請允許瀏覽器使用定位功能。";

              }

              else if (error.code === 2) {

                message +=
                  "\n目前無法取得 GPS 位置。";

              }

              else if (error.code === 3) {

                message +=
                  "\n定位逾時，請再試一次。";

              }


              reject(
                new Error(message)
              );

            },


            {

              enableHighAccuracy:
                true,

              timeout:
                15000,

              maximumAge:
                0

            }

          );

        }
      );

    }


    /* =====================================================
       取得顯示名稱
    ====================================================== */

    function getDisplayName(user) {

      const metadata =
        user &&
        user.user_metadata
          ? user.user_metadata
          : {};


      return (
        metadata.nickname ||
        metadata.username ||
        metadata.full_name ||
        (
          user &&
          user.email
            ? user.email.split("@")[0]
            : "成員"
        )
      );

    }


    /* =====================================================
       建立 SOS 文字內容
       
       ★ 已改名
       避免與 sendSOSMessage 重複
    ====================================================== */

    function createSOSContent(
      displayName
    ) {

      return (
        "🚨 SOS 緊急求助！\n" +
        displayName +
        " 正在求救。\n" +
        "📍 緯度：" +
        currentLatitude.toFixed(6) +
        "\n" +
        "📍 經度：" +
        currentLongitude.toFixed(6) +
        "\n" +
        "🎯 定位誤差：約 " +
        Math.round(
          currentAccuracy || 0
        ) +
        " 公尺"
      );

    }


    /* =====================================================
       寫入 sos_events
    ====================================================== */

    async function createSOSEvent(
      user,
      displayName,
      message
    ) {

      const result =
        await supabaseClient
          .from("sos_events")
          .insert({

            room_id:
              String(
                currentGroupId
              ),

            user_id:
              user.id,

            display_name:
              displayName,

            lat:
              currentLatitude,

            lng:
              currentLongitude,

            message:
              message

          })
          .select()
          .single();


      if (result.error) {

        throw result.error;

      }


      return result.data;

    }


    /* =====================================================
       寫入聊天 messages
       
       ★ 已改名
       避免與 createSOSContent 重複
    ====================================================== */

    async function sendSOSMessage(
      user,
      displayName,
      message
    ) {

      const result =
        await supabaseClient
          .from("messages")
          .insert({

            room_id:
              String(
                currentGroupId
              ),

            user_id:
              user.id,

            sender_name:
              displayName,

            kind:
              "sos",

            body:
              message,

            is_all:
              true

          });


      if (result.error) {

        throw result.error;

      }


      return result.data;

    }


    /* =====================================================
       確認發送 SOS
    ====================================================== */

    async function confirmSendSOS() {

      const selectedGroupId =
        sosGroupSelect.value;


      if (!selectedGroupId) {

        alert(
          "請先選擇要發送 SOS 的群組。"
        );

        return;

      }


      if (sosActive) {

        return;

      }


      /*
       * ★ 確認當下重新取得群組名稱
       */

      const selectedGroup =
        currentGroups.find(
          function (group) {

            return String(group.id) ===
              String(selectedGroupId);

          }
        );


      currentGroupId =
        String(selectedGroupId);


      currentGroupName =
        selectedGroup &&
        selectedGroup.name
          ? selectedGroup.name
          : "群組";


      sosActive =
        true;


      btnConfirmSos.disabled =
        true;


      sosCard.classList.add(
        "loading"
      );


      sosIcon.textContent =
        "📍";


      sosTitle.textContent =
        "正在啟動 SOS";


      sosDesc.textContent =
        "正在取得目前位置……";


      sosStatusCard.classList.add(
        "show"
      );


      sosStatusText.textContent =
        "正在取得登入資訊與 GPS 位置……";


      sosLocation.textContent =
        "📍 正在取得目前位置……";


      try {

        /* ---------------------------------------------
           登入者
        --------------------------------------------- */

        const user =
          await getCurrentUser();


        /* ---------------------------------------------
           GPS
        --------------------------------------------- */

        await getGPS();


        sosStatusText.textContent =
          "📍 位置已取得，正在發送 SOS……";


        sosLocation.innerHTML =
          "📍 緯度：" +
          currentLatitude.toFixed(6) +
          "<br>" +
          "📍 經度：" +
          currentLongitude.toFixed(6) +
          "<br>" +
          "🎯 定位誤差：約 " +
          Math.round(
            currentAccuracy || 0
          ) +
          " 公尺";


        /* ---------------------------------------------
           使用者名稱
        --------------------------------------------- */

        const displayName =
          getDisplayName(user);


        /* ---------------------------------------------
           SOS 訊息
           
           ★ 使用新的 createSOSContent()
        --------------------------------------------- */

        const message =
          createSOSContent(
            displayName
          );


        /* ---------------------------------------------
           記錄 SOS event
        --------------------------------------------- */

        await createSOSEvent(
          user,
          displayName,
          message
        );


        /* ---------------------------------------------
           發送到指定群組聊天
           
           ★ 使用新的 sendSOSMessage()
        --------------------------------------------- */

        await sendSOSMessage(
          user,
          displayName,
          message
        );


        /* ---------------------------------------------
           成功
        --------------------------------------------- */

        sosActive =
          true;


        sosCard.classList.remove(
          "loading"
        );


        sosCard.classList.add(
          "success"
        );


        sosIcon.textContent =
          "🚨";


        sosTitle.textContent =
          "SOS 已發送";


        sosDesc.textContent =
          "群組「" +
          currentGroupName +
          "」已收到你的求救訊息";


        sosStatusText.innerHTML =
          "✅ SOS 已成功發送。<br>" +
          "通知群組：" +
          currentGroupName +
          "<br>" +
          "群組成員可在聊天中看到你的求救訊息與位置。";


        sosGroupPanel.classList.remove(
          "show"
        );


        sosGroupSelect.value =
          "";


        /* ---------------------------------------------
           震動
        --------------------------------------------- */

        if (
          navigator.vibrate
        ) {

          navigator.vibrate([
            300,
            150,
            300,
            150,
            500
          ]);

        }


      } catch (error) {

        console.error(
          "SOS 發送錯誤：",
          error
        );


        sosActive =
          false;


        sosCard.classList.remove(
          "loading"
        );


        sosCard.classList.remove(
          "success"
        );


        sosIcon.textContent =
          "🚨";


        sosTitle.textContent =
          "緊急求助 SOS";


        sosDesc.textContent =
          "SOS 發送失敗，請重新操作";


        sosStatusText.textContent =
          "❌ SOS 發送失敗：\n" +
          (
            error &&
            error.message
              ? error.message
              : error
          );


        alert(
          "SOS 發送失敗。\n\n" +
          (
            error &&
            error.message
              ? error.message
              : error
          )
        );


        currentLatitude =
          null;

        currentLongitude =
          null;

      }

    }


    if (btnConfirmSos) {

      btnConfirmSos.addEventListener(
        "click",
        confirmSendSOS
      );

    }


    /* =====================================================
       119
    ====================================================== */

    if (call119Btn) {

      call119Btn.addEventListener(
        "click",
        function () {

          window.location.href =
            "tel:119";

        }
      );

    }


    /* =====================================================
       110
    ====================================================== */

    if (call110Btn) {

      call110Btn.addEventListener(
        "click",
        function () {

          window.location.href =
            "tel:110";

        }
      );

    }


    /* =====================================================
       分享 SOS 位置
    ====================================================== */

    if (shareSosBtn) {

      shareSosBtn.addEventListener(
        "click",
        async function () {

          if (
            currentLatitude === null ||
            currentLongitude === null
          ) {

            alert(
              "目前還沒有取得有效 GPS 位置。"
            );

            return;

          }


          const mapUrl =
            "https://www.google.com/maps?q=" +
            currentLatitude +
            "," +
            currentLongitude;


          const message =
            "🚨【安全團聚 SOS 緊急求助】\n\n" +

            "我需要協助，請注意我的位置。\n\n" +

            "通知群組：" +
            (
              currentGroupName ||
              "安全團聚群組"
            ) +

            "\n\n" +

            "📍 緯度：" +
            currentLatitude.toFixed(6) +

            "\n" +

            "📍 經度：" +
            currentLongitude.toFixed(6) +

            "\n\n" +

            "🗺️ 地圖位置：\n" +
            mapUrl;


          if (
            navigator.share
          ) {

            try {

              await navigator.share({

                title:
                  "安全團聚 SOS 緊急求助",

                text:
                  message,

                url:
                  mapUrl

              });

            } catch (error) {

              /*
               * 使用者取消分享，
               * 不顯示錯誤。
               */

            }

            return;

          }


          try {

            await navigator.clipboard.writeText(
              message
            );


            alert(
              "SOS 位置資訊已複製，可以貼到 LINE、簡訊或聊天中。"
            );

          } catch (error) {

            alert(message);

          }

        }
      );

    }


    /* =====================================================
       關閉 SOS 狀態
    ====================================================== */

    if (closeSosBtn) {

      closeSosBtn.addEventListener(
        "click",
        function () {

          sosStatusCard.classList.remove(
            "show"
          );

        }
      );

    }


    /* =====================================================
       啟動時檢查 Supabase
    ====================================================== */

    if (!supabaseClient) {

      sosDesc.textContent =
        "目前無法連線到安全團聚伺服器";

    }

  })();

  </script>


</body>
