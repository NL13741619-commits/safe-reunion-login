<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>安全中心 - 安全團聚</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background: #f5f5f5;
      color: #111;

      min-height: 100vh;
      padding-bottom: 70px;
    }


    /* =====================================================
       頂部
    ====================================================== */

    .header {

      background: #06C755;
      color: white;

      padding: 14px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;

      z-index: 100;
    }


    .header-left {

      display: flex;
      align-items: center;
      gap: 10px;
    }


    .back-btn {

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;
      text-decoration: none;

      font-size: 24px;

      -webkit-tap-highlight-color: transparent;
    }


    .header h1 {

      font-size: 18px;
      font-weight: 700;
    }


    .header-action {

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;
      text-decoration: none;

      font-size: 21px;
    }


    /* =====================================================
       內容
    ====================================================== */

    .content {

      padding: 16px 12px;
    }


    .section-title {

      font-size: 16px;
      font-weight: 700;

      margin: 4px 4px 12px;
    }


    /* =====================================================
       SOS
    ====================================================== */

    .sos-card {

      background: #e53935;
      color: white;

      border-radius: 16px;

      padding: 22px 18px;

      text-align: center;

      margin-bottom: 20px;

      box-shadow:
        0 4px 12px rgba(229,57,53,0.25);

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    .sos-card:active {

      transform: scale(0.98);
    }


    .sos-icon {

      font-size: 38px;
      margin-bottom: 6px;
    }


    .sos-title {

      font-size: 20px;
      font-weight: 800;

      margin-bottom: 4px;
    }


    .sos-desc {

      font-size: 12px;
      opacity: 0.92;
    }


    /* =====================================================
       安全功能
    ====================================================== */

    .function-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom: 20px;
    }


    .function-item {

      background: white;

      border-radius: 14px;

      padding: 16px 6px;

      text-align: center;

      text-decoration: none;

      color: inherit;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.04);

      -webkit-tap-highlight-color: transparent;
    }


    .function-icon {

      font-size: 26px;

      margin-bottom: 7px;
    }


    .function-label {

      font-size: 12px;

      color: #444;

      line-height: 1.3;
    }


    /* =====================================================
       家庭／群組
    ====================================================== */

    .group-card {

      background: white;

      border-radius: 14px;

      padding: 16px;

      margin-bottom: 12px;

      box-shadow:
        0 2px 7px rgba(0,0,0,0.04);
    }


    .group-title {

      font-size: 15px;
      font-weight: 700;

      margin-bottom: 12px;
    }


    .group-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 11px 0;

      border-top: 1px solid #f0f0f0;

      text-decoration: none;

      color: inherit;
    }


    .group-row:first-of-type {

      border-top: none;
    }


    .group-name {

      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 14px;
    }


    .group-arrow {

      color: #999;
      font-size: 20px;
    }


    /* =====================================================
       底部五大平台
    ====================================================== */

    .tabbar {

      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 58px;

      background: #fff;

      border-top: 1px solid #e8e8e8;

      display: flex;

      z-index: 200;
    }


    .tab {

      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      font-size: 11px;

      color: #888;

      text-decoration: none;
    }


    .tab.on {

      color: #06C755;

      font-weight: 600;
    }


    .tab .ico {

      font-size: 20px;

      line-height: 1.2;
    }

  </style>

</head>


<body>


  <!-- =====================================================
       頂部
  ====================================================== -->

  <div class="header">

    <div class="header-left">

      <a
        class="back-btn"
        href="home.html"

        ‹
      </a>

      <h1>
        📡 安全中心
      </h1>

    </div>


    <a
      class="header-action"
      href="settings.html"

      ⚙️
    </a>

  </div>


  <!-- =====================================================
       內容
  ====================================================== -->

  <main class="content">


    <!-- SOS -->

    <div class="sos-card">

      <div class="sos-icon">
        🚨
      </div>

      <div class="sos-title">
        緊急求助 SOS
      </div>

      <div class="sos-desc">
        緊急狀況時快速通知指定家庭或群組
      </div>

    </div>


    <!-- 安全功能 -->

    <div class="section-title">

    </div>


    <div class="function-grid">


      <a
        class="function-item"
        href="map.html"
      >

        <div class="function-icon">
          🗺️
        </div>

        <div class="function-label">
          地圖
        </div>

      </a>


      <a
        class="function-item"
        href="map.html"
      >

        <div class="function-icon">
          📍
        </div>

        <div class="function-label">
          即時定位
        </div>

      </a>


      <a
        class="function-item"
        href="map.html"
      >

        <div class="function-icon">
          🧭
        </div>

        <div class="function-label">
          導航
        </div>

      </a>


      <a
        class="function-item"
        href="speed-camera-admin.html"
      >

        <div class="function-icon">
          📸
        </div>

        <div class="function-label">
          測速照相
        </div>

      </a>


      <a
        class="function-item"
        href="#"
      >

        <div class="function-icon">
          🌦️
        </div>

        <div class="function-label">
          氣象
        </div>

      </a>


      <a
        class="function-item"
        href="map.html"
      >

        <div class="function-icon">
          🅿️
        </div>

        <div class="function-label">
          停車場
        </div>

      </a>


    </div>


    <!-- 家庭 -->

    <div class="group-card">

      <div class="group-title">
        👨‍👩‍👧 家庭安全
      </div>


      <a
        class="group-row"
        href="contacts.html"
      >

        <div class="group-name">
          👥
          家庭／群組
        </div>

        <div class="group-arrow">
          ›
        </div>

      </a>


      <a
        class="group-row"
        href="map.html"
      >

        <div class="group-name">
          📍
          群組即時定位
        </div>

        <div class="group-arrow">
          ›
        </div>

      </a>


      <a
        class="group-row"
        href="map.html"
      >

        <div class="group-name">
          📌
          緊急集合點
        </div>

        <div class="group-arrow">
          ›
        </div>

      </a>

    </div>


  </main>


  <!-- =====================================================
       底部五大平台
  ====================================================== -->

  <div class="tabbar">


    <a
      class="tab"
      href="social.html"
    >
      <div class="ico">
        ◎
      </div>
      社群
    </a>


    <a
      class="tab"
      href="learning.html"
    >
      <div class="ico">
        🎓
      </div>
      學習
    </a>


    <a
      class="tab"
      href="shop.html"
    >
      <div class="ico">
        🛍️
      </div>
      購物
    </a>


    <a
      class="tab"
      href="chat.html"
    >
      <div class="ico">
        💬
      </div>
      聊天
    </a>


    <a
      class="tab"
      href="me.html"
    >
      <div class="ico">
        👤
      </div>
      我
    </a>


  </div>


</body>

</html>
