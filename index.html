<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #06C755 0%, #04a344 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
    }
    .logo {
      width: 88px; height: 88px;
      background: white;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 48px; text-align: center; }
    .btn {
      width: 100%; max-width: 320px;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .btn-white {
      background: white;
      color: #06C755;
    }
    .btn-outline {
      background: transparent;
      color: white;
      border: 2px solid rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div class="logo">🛡️</div>
  <h1>安全團聚</h1>
  <div class="subtitle">家人與朋友的安全連結平台</div>

  <button class="btn btn-white" onclick="location.href='login.html'">登入</button>
  <button class="btn btn-outline" onclick="location.href='register.html'">註冊新帳號</button>
</body>
</html>
