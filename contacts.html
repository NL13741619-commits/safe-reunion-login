<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通訊錄 - 安全團聚</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5; color: #111; min-height: 100vh; padding-bottom: 70px;
    }
    .top {
      background: #fff; padding: 12px 16px 10px;
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid #eee;
    }
    .top-title {
      text-align: center; font-size: 17px; font-weight: 700;
      position: relative; margin-bottom: 10px;
    }
    .top-add {
      position: absolute; right: 0; top: 0;
      border: none; background: transparent; font-size: 22px; line-height: 1;
    }
    .search {
      width: 100%; border: none; background: #f0f0f0;
      border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none;
    }
    .status {
      font-size: 12px; color: #888; text-align: center; padding: 6px;
    }
    .menu-item, .person, .group-row {
      display: flex; align-items: center; gap: 12px;
      background: #fff; padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .menu-item { cursor: pointer; }
    .icon-box {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px; flex-shrink: 0;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 8px;
      background: #ddd; object-fit: cover; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #555;
    }
    .name { font-size: 16px; flex: 1; min-width: 0; }
    .sub { font-size: 12px; color: #888; margin-top: 2px; }
    .section {
      font-size: 13px; color: #888; padding: 10px 16px 6px; background: #f5f5f5;
    }
    .btn-sm {
      border: none; border-radius: 8px; padding: 6px 10px;
      font-size: 13px; font-weight: 600; flex-shrink: 0;
    }
    .btn-green { background: #06C755; color: #fff; }
    .btn-gray { background: #eee; color: #333; }
    .btn-outline { background: #fff; color: #06C755; border: 1px solid #06C755; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 58px; background: #fff; border-top: 1px solid #e8e8e8;
      display: flex; z-index: 30;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 11px; color: #888; text-decoration: none;
    }
    .tab.on { color: #06C755; font-weight: 600; }
    .tab .ico { font-size: 20px; line-height: 1.2; }

    .sheet-mask {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 40;
    }
    .sheet-mask.show { display: block; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
      border-radius: 16px 16px 0 0; z-index: 41; padding: 16px 16px 28px;
      transform: translateY(110%); transition: transform 0.2s;
    }
    .sheet.show { transform: translateY(0); }
    .sheet h3 { text-align: center; margin-bottom: 12px; font-size: 16px; }
    .sheet input {
      width: 100%; border: 1px solid #e0e0e0; border-radius: 10px;
      padding: 12px; font-size: 15px; margin-bottom: 10px; outline: none;
    }
    .sheet .row-btns { display: flex; gap: 10px; }
    .sheet .row-btns button {
      flex: 1; border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-title">
      通訊錄
      <button class="top-add" type="button" id="btnMenu">＋</button>
    </div>
    <input class="search" id="searchInput" type="search" placeholder="搜尋帳號、暱稱" autocomplete="off">
  </div>
  <div class="status" id="status">載入中…</div>

  <div class="menu-item" id="btnNewFriend">
    <div class="icon-box" style="background:#ff9800">＋</div>
    <div class="name">新的朋友</div>
  </div>
  <div class="menu-item" id="btnCreateGroup">
    <div class="icon-box" style="background:#06C755">群</div>
    <div class="name">群組</div>
  </div>
  <div class="menu-item" id="btnOpenCallWait">
    <div class="icon-box" style="background:#1e88e5">📞</div>
    <div class="name">等待來電（保持開啟）</div>
  </div>

  <div id="searchSection" style="display:none">
    <div class="section">搜尋結果</div>
    <div id="searchList"></div>
  </div>

  <div class="section">好友</div>
  <div id="friendList"></div>

  <div class="section">我的群組</div>
  <div id="groupList"></div>

  <div class="tabbar">
    <a class="tab" href="chat.html"><div class="ico">💬</div>聊天</a>
    <a class="tab on" href="contacts.html"><div class="ico">👥</div>通訊錄</a>
    <a class="tab" href="home.html"><div class="ico">🧭</div>發現</a>
    <a class="tab" href="me.html"><div class="ico">我</div>我</a>
  </div>

  <div class="sheet-mask" id="mask"></div>
  <div class="sheet" id="sheetAdd">
    <h3>加好友</h3>
    <input id="addKeyword" placeholder="輸入對方帳號或暱稱（不用加 @）">
    <div class="row-btns">
      <button type="button" style="background:#eee" id="btnCancelAdd">取消</button>
      <button type="button" style="background:#06C755;color:#fff" id="btnDoSearch">搜尋</button>
    </div>
  </div>

  <div class="sheet" id="sheetGroup">
    <h3>建立群組</h3>
    <input id="groupName" placeholder="群組名稱（自己取）">
    <div class="row-btns">
      <button type="button" style="background:#eee" id="btnCancelGroup">取消</button>
      <button type="button" style="background:#06C755;color:#fff" id="btnDoCreateGroup">建立</button>
    </div>
  </div>

  <div class="sheet" id="sheetPending">
    <h3>好友邀請</h3>
    <div id="pendingList" style="max-height:40vh;overflow:auto"></div>
    <div class="row-btns" style="margin-top:12px">
      <button type="button" style="background:#eee" id="btnClosePending">關閉</button>
    </div>
  </div>

  <script>
  (function () {
    var SUPABASE_URL = 'https://perfsipperncvjocznhl.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';

    var supabase = null;
    var me = null;
    var myProfile = null;

    function $(id) { return document.getElementById(id); }
    function setStatus(t) { $('status').textContent = t; }

    function showSheet(id) {
      $('mask').classList.add('show');
      $('sheetAdd').classList.remove('show');
      $('sheetGroup').classList.remove('show');
      $('sheetPending').classList.remove('show');
      $(id).classList.add('show');
    }
    function hideSheets() {
      $('mask').classList.remove('show');
      $('sheetAdd').classList.remove('show');
      $('sheetGroup').classList.remove('show');
      $('sheetPending').classList.remove('show');
    }

    function dmRoomId(a, b) {
      var x = String(a), y = String(b);
      return 'dm_' + (x < y ? x + '_' + y : y + '_' + x);
    }

    function avatarHtml(p) {
      if (p && p.avatar_url) {
        return '<img class="avatar" src="' + String(p.avatar_url).replace(/"/g, '') + '" alt="">';
      }
      var n = (p && (p.nickname || p.username)) ? (p.nickname || p.username) : '?';
      return '<div class="avatar">' + String(n).slice(0, 1) + '</div>';
    }

    function goChat(uid, displayName) {
      location.href = 'room.html?id=' + encodeURIComponent(dmRoomId(me.id, uid)) +
        '&name=' + encodeURIComponent(displayName || '好友');
    }
    function goVideo(uid, displayName) {
      location.href = 'call.html?mode=video'
        + '&to=' + encodeURIComponent(uid)
        + '&name=' + encodeURIComponent(displayName || '視訊');
    }
    function goAudio(uid, displayName) {
      location.href = 'call.html?mode=audio'
        + '&to=' + encodeURIComponent(uid)
        + '&name=' + encodeURIComponent(displayName || '語音');
    }

    async function ensureProfile() {
      var { data } = await supabase.from('profiles').select('*').eq('id', me.id).maybeSingle();
      if (data) {
        myProfile = data;
        return;
      }
      var nick = (me.user_metadata && (me.user_metadata.nickname || me.user_metadata.username)) ||
        (me.email ? me.email.split('@')[0] : 'user');
      var username = (me.user_metadata && me.user_metadata.username) || nick;
      username = String(username).toLowerCase().replace(/\s+/g, '_').slice(0, 24);
      var ins = await supabase.from('profiles').insert({
        id: me.id,
        username: username,
        nickname: nick
      }).select().maybeSingle();
      myProfile = ins.data || { id: me.id, username: username, nickname: nick };
    }

    async function loadFriends() {
      var { data: rows, error } = await supabase
        .from('friendships')
        .select('*')
        .eq('status', 'accepted')
        .or('user_id.eq.' + me.id + ',friend_id.eq.' + me.id);

      if (error) {
        setStatus('好友載入失敗：' + error.message);
        return;
      }

      var ids = [];
      (rows || []).forEach(function (r) {
        var other = r.user_id === me.id ? r.friend_id : r.user_id;
        if (ids.indexOf(other) < 0) ids.push(other);
      });

      var box = $('friendList');
      box.innerHTML = '';
      if (!ids.length) {
        box.innerHTML = '<div class="person"><div class="name" style="color:#888">尚無好友，點上方「＋」搜尋帳號</div></div>';
        return;
      }

      var { data: profiles } = await supabase.from('profiles').select('*').in('id', ids);
      var map = {};
      (profiles || []).forEach(function (p) { map[p.id] = p; });

      ids.forEach(function (uid) {
        var p = map[uid] || { id: uid, nickname: uid.slice(0, 8), username: '' };
        var display = p.nickname || p.username || '使用者';
        var div = document.createElement('div');
        div.className = 'person';
        div.innerHTML =
          avatarHtml(p) +
          '<div class="name">' + display +
            (p.username ? '<div class="sub">@' + p.username + '</div>' : '') +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn-sm btn-green" type="button">聊天</button>' +
            '<button class="btn-sm btn-gray" type="button">語音</button>' +
            '<button class="btn-sm btn-green" type="button">視訊</button>' +
          '</div>';
        var btns = div.querySelectorAll('button');
        btns[0].onclick = function () { goChat(uid, display); };
        btns[1].onclick = function () { goAudio(uid, display); };
        btns[2].onclick = function () { goVideo(uid, display); };
        box.appendChild(div);
      });
    }

    async function loadGroups() {
      var { data: mems, error } = await supabase
        .from('group_members')
        .select('group_id')
        .eq('user_id', me.id);
      var box = $('groupList');
      box.innerHTML = '';
      if (error) {
        box.innerHTML = '<div class="person"><div class="name" style="color:#888">' + error.message + '</div></div>';
        return;
      }
      var gids = (mems || []).map(function (m) { return m.group_id; });
      if (!gids.length) {
        box.innerHTML = '<div class="person"><div class="name" style="color:#888">尚無群組</div></div>';
        return;
      }
      var { data: groups } = await supabase.from('chat_groups').select('*').in('id', gids);
      (groups || []).forEach(function (g) {
        var div = document.createElement('div');
        div.className = 'group-row';
        div.innerHTML =
          '<div class="icon-box" style="background:#06C755">群</div>' +
          '<div class="name">' + (g.name || '群組') + '</div>' +
          '<button class="btn-sm btn-green" type="button">進入</button>';
        div.querySelector('button').onclick = function () {
          location.href = 'room.html?id=' + encodeURIComponent(g.id) +
            '&name=' + encodeURIComponent(g.name || '群組');
        };
        box.appendChild(div);
      });
    }

    async function loadPending() {
      var { data: rows } = await supabase
        .from('friendships')
        .select('*')
        .eq('friend_id', me.id)
        .eq('status', 'pending');

      var box = $('pendingList');
      box.innerHTML = '';
      if (!rows || !rows.length) {
        box.innerHTML = '<div style="text-align:center;color:#888;padding:12px">沒有待處理邀請</div>';
        return;
      }
      var ids = rows.map(function (r) { return r.user_id; });
      var { data: profiles } = await supabase.from('profiles').select('*').in('id', ids);
      var map = {};
      (profiles || []).forEach(function (p) { map[p.id] = p; });

      rows.forEach(function (r) {
        var p = map[r.user_id] || {};
        var div = document.createElement('div');
        div.className = 'person';
        div.innerHTML =
          avatarHtml(p) +
          '<div class="name">' + (p.nickname || p.username || '使用者') +
          '<div class="sub">想加你為好友</div></div>' +
          '<div class="actions">' +
            '<button class="btn-sm btn-green" type="button">接受</button>' +
            '<button class="btn-sm btn-gray" type="button">忽略</button>' +
          '</div>';
        var btns = div.querySelectorAll('button');
        btns[0].onclick = async function () {
          await supabase.from('friendships').update({ status: 'accepted' }).eq('id', r.id);
          await supabase.from('friendships').upsert({
            user_id: me.id,
            friend_id: r.user_id,
            status: 'accepted'
          }, { onConflict: 'user_id,friend_id' });
          await loadPending();
          await loadFriends();
          setStatus('已接受好友');
        };
        btns[1].onclick = async function () {
          await supabase.from('friendships').delete().eq('id', r.id);
          await loadPending();
        };
        box.appendChild(div);
      });
    }

    async function searchPeople(keyword) {
      keyword = (keyword || '').trim().replace(/^@/, '');
      if (!keyword) {
        $('searchSection').style.display = 'none';
        return;
      }
      setStatus('搜尋中…');
      var r1 = await supabase.from('profiles').select('*').ilike('username', '%' + keyword + '%').limit(20);
      var r2 = await supabase.from('profiles').select('*').ilike('nickname', '%' + keyword + '%').limit(20);
      var map = {};
      (r1.data || []).concat(r2.data || []).forEach(function (p) {
        if (p.id !== me.id) map[p.id] = p;
      });
      var list = Object.keys(map).map(function (k) { return map[k]; });
      var box = $('searchList');
      box.innerHTML = '';
      $('searchSection').style.display = 'block';
      if (!list.length) {
        box.innerHTML = '<div class="person"><div class="name" style="color:#888">找不到使用者</div></div>';
        setStatus('搜尋完成');
        return;
      }
      list.forEach(function (p) {
        var div = document.createElement('div');
        div.className = 'person';
        div.innerHTML =
          avatarHtml(p) +
          '<div class="name">' + (p.nickname || '使用者') +
          '<div class="sub">@' + (p.username || '') + '</div></div>' +
          '<button class="btn-sm btn-outline" type="button">加好友</button>';
        div.querySelector('button').onclick = async function () {
          var res = await supabase.from('friendships').insert({
            user_id: me.id,
            friend_id: p.id,
            status: 'pending'
          });
          if (res.error) {
            if (String(res.error.message).toLowerCase().indexOf('duplicate') >= 0) {
              setStatus('已送過邀請或已是好友');
            } else {
              setStatus('失敗：' + res.error.message);
            }
            return;
          }
          setStatus('已送出好友邀請');
        };
        box.appendChild(div);
      });
      setStatus('搜尋完成 · ' + list.length + ' 人');
    }

    async function createGroup() {
      var name = $('groupName').value.trim();
      if (!name) {
        setStatus('請輸入群組名稱');
        return;
      }
      setStatus('建立群組中…');
      var g = await supabase.from('chat_groups').insert({
        name: name,
        owner_id: me.id
      }).select().single();
      if (g.error) {
        setStatus('建立失敗：' + g.error.message);
        return;
      }
      var m = await supabase.from('group_members').insert({
        group_id: g.data.id,
        user_id: me.id,
        role: 'owner'
      });
      if (m.error) {
        setStatus('加入群組成員失敗：' + m.error.message);
        return;
      }
      hideSheets();
      location.href = 'room.html?id=' + encodeURIComponent(g.data.id) +
        '&name=' + encodeURIComponent(name);
    }

    async function boot() {
      if (!window.supabase) {
        setStatus('套件載入失敗');
        return;
      }
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var sess = await supabase.auth.getSession();
      if (!sess.data.session) {
        setStatus('未登入');
        location.href = 'login.html';
        return;
      }
      me = sess.data.session.user;
      try {
        await ensureProfile();
        await loadFriends();
        await loadGroups();
        setStatus('帳號：@' + (myProfile && myProfile.username ? myProfile.username : 'user') +
          ' · 視訊前請對方也打開通訊錄或「等待來電」');
      } catch (e) {
        setStatus('錯誤：' + (e.message || e));
      }
    }

    $('btnMenu').onclick = function () { showSheet('sheetAdd'); };
    $('btnNewFriend').onclick = function () {
      loadPending();
      showSheet('sheetPending');
    };
    $('btnCreateGroup').onclick = function () {
      $('groupName').value = '';
      showSheet('sheetGroup');
    };
    $('btnOpenCallWait').onclick = function () {
      location.href = 'call.html';
    };
    $('mask').onclick = hideSheets;
    $('btnCancelAdd').onclick = hideSheets;
    $('btnCancelGroup').onclick = hideSheets;
    $('btnClosePending').onclick = hideSheets;
    $('btnDoSearch').onclick = function () {
      hideSheets();
      var k = $('addKeyword').value.trim();
      $('searchInput').value = k;
      searchPeople(k);
    };
    $('btnDoCreateGroup').onclick = createGroup;

    var searchTimer = null;
    $('searchInput').addEventListener('input', function () {
      clearTimeout(searchTimer);
      var v = $('searchInput').value;
      searchTimer = setTimeout(function () { searchPeople(v); }, 350);
    });

    boot();
  })();
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="call-notify.js"></script>
</body>
</html>
