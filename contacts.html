<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通訊錄 - 安全團聚</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    .top {
      background: #fff;
      padding: 12px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid #eee;
    }

    .top-title {
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      position: relative;
      margin-bottom: 10px;
    }

    .top-add {
      position: absolute;
      right: 0;
      top: 0;
      border: none;
      background: transparent;
      font-size: 22px;
      line-height: 1;
    }

    .search {
      width: 100%;
      border: none;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
    }

    .status {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 6px 10px;
      word-break: break-all;
    }

    .menu-item,
    .person,
    .group-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #ddd;
      object-fit: cover;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #555;
    }

    .name {
      font-size: 16px;
      flex: 1;
      min-width: 0;
    }

    .sub {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .section {
      font-size: 13px;
      color: #888;
      padding: 10px 16px 6px;
      background: #f5f5f5;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
      background: #f5f5f5;
      font-size: 13px;
      color: #888;
    }

    .btn-sm {
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .btn-green {
      background: #06C755;
      color: #fff;
    }

    .btn-gray {
      background: #eee;
      color: #333;
    }

    .btn-outline {
      background: #fff;
      color: #06C755;
      border: 1px solid #06C755;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* =========================
       數字 Badge
    ========================= */

    .message-badge,
    .friend-badge {
      display: none;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 11px;
      background: #f44336;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 22px;
      text-align: center;
      flex-shrink: 0;
    }

    .message-badge.show,
    .friend-badge.show {
      display: inline-block;
    }

    .menu-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    /* =========================
       滑動刪除 / 退群
    ========================= */

    .swipe-row {
      position: relative;
      overflow: hidden;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
    }

    .swipe-delete {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 92px;
      border: none;
      background: #e53935;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      z-index: 0;
    }

    .swipe-content {
      position: relative;
      z-index: 1;
      background: #fff;
      transition: transform .2s ease;
      touch-action: pan-y;
    }

    .swipe-content.swiped {
      transform: translateX(-92px);
    }

    .swipe-content .person,
    .swipe-content .group-row {
      border-bottom: none;
    }

    /* =========================
       底部
    ========================= */

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      z-index: 30;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #888;
      text-decoration: none;
    }

    .tab.on {
      color: #06C755;
      font-weight: 600;
    }

    .tab .ico {
      font-size: 20px;
      line-height: 1.2;
    }

    /* =========================
       Bottom Sheet
    ========================= */

    .sheet-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 40;
    }

    .sheet-mask.show {
      display: block;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      border-radius: 16px 16px 0 0;
      z-index: 41;
      padding: 16px 16px 28px;
      transform: translateY(110%);
      transition: transform 0.2s;
    }

    .sheet.show {
      transform: translateY(0);
    }

    .sheet h3 {
      text-align: center;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .sheet input {
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
    }

    .sheet .row-btns {
      display: flex;
      gap: 10px;
    }

    .sheet .row-btns button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>

<script>

  var me = null;
  var myProfile = null;

  var unreadFriendTotal = 0;
  var unreadGroupTotal = 0;


  function $(id) {
    return document.getElementById(id);
  }


  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function setStatus(t) {
    $('status').textContent = t;
  }


  function setBadge(id, count) {

    var badge = $(id);

    if (!badge) {
      return;
    }

    count = Number(count || 0);

    if (count > 0) {

      badge.textContent =
        count > 99
          ? '99+'
          : String(count);

      badge.style.display =
        'inline-block';

    } else {

      badge.textContent = '0';

      badge.style.display =
        'none';
    }
  }


  /* =========================
     彈出視窗
  ========================= */

  function showSheet(id) {

    $('mask').classList.add('show');

    $('sheetAdd').classList.remove('show');
    $('sheetGroup').classList.remove('show');
    $('sheetPending').classList.remove('show');

    $(id).classList.add('show');

  function hideSheets() {

    $('mask').classList.remove('show');

    $('sheetAdd').classList.remove('show');
    $('sheetGroup').classList.remove('show');
    $('sheetPending').classList.remove('show');

  /* =========================
     私聊房間 ID
  ========================= */

  function dmRoomId(a, b) {

    var x = String(a);
    var y = String(b);

    return 'dm_' +
      (x < y
        ? x + '_' + y
        : y + '_' + x);
  }


  /* =========================
     未讀訊息
     
     使用 localStorage 記錄最後讀取時間。
     不需要修改資料表。
  ========================= */

  function getReadKey(type, id) {

    return 'contacts_read_' +
      type +
      '_' +
      String(id);
  }


  function getLastRead(type, id) {

    var value =
      localStorage.getItem(
        getReadKey(type, id)
      );

    return value || '1970-01-01T00:00:00.000Z';
  }


  function setLastRead(type, id, time) {

    if (!id) {
      return;
    }

    localStorage.setItem(
      getReadKey(type, id),
      time || new Date().toISOString()
    );
  }


  function countUnreadRows(rows) {

    return (rows || []).length;
  }


  /* =========================
     頭像
  ========================= */

  function avatarHtml(p) {

    if (p && p.avatar_url) {

      return '<img class="avatar" src="' +
        String(p.avatar_url)
          .replace(/"/g, '') +
        '" alt="">';
    }

    var n =
      (p &&
       (p.nickname || p.username))
        ? (p.nickname || p.username)
        : '?';

    return '<div class="avatar">' +
      escapeHtml(
        String(n).slice(0, 1)
      ) +
      '</div>';
  }


  /* =========================
     聊天 / 語音 / 視訊
  ========================= */

  function goChat(uid, displayName) {

    /*
     * 點進好友聊天前，
     * 把目前好友訊息標記成已讀。
     */
    setLastRead(
      'friend',

    );

    location.href =
      'room.html?id=' +
      encodeURIComponent(
        dmRoomId(me.id, uid)

      );
  }


  function goVideo(uid, displayName) {

    location.href =
      'call.html?mode=video&to=' +
      encodeURIComponent(uid) +
      '&name=' +
      encodeURIComponent(
        displayName || '視訊'
      );
  }


  function goAudio(uid, displayName) {

    location.href =
      'call.html?mode=audio&to=' +
      encodeURIComponent(uid) +
      '&name=' +
      encodeURIComponent(
        displayName || '語音'
      );
  }


  /* =========================
     個人資料
  ========================= */

  async function ensureProfile() {

    var res =
      await supabase
        .from('profiles')
        .select('*')
        .eq('id', me.id)
        .maybeSingle();

    if (res.error) {

      throw new Error(
        'profiles：' +
        res.error.message
      );
    }

    if (res.data) {

      myProfile = res.data;

      return;
    }

    var nick =
      (me.user_metadata &&
       (me.user_metadata.nickname ||
        me.user_metadata.username)) ||
      (me.email
        ? me.email.split('@')[0]
        : 'user');

    var username =
      String(
        (me.user_metadata &&
         me.user_metadata.username) ||
        nick
      )
      .toLowerCase()
      .replace(/\s+/g, '_')
      .slice(0, 24);

    var ins =
      await supabase
        .from('profiles')
        .insert({
          id: me.id,
          username: username,
          nickname: nick
        })
        .select()
        .maybeSingle();

    if (
      ins.error &&
      String(ins.error.message)
        .indexOf('duplicate') < 0
    ) {

      throw new Error(
        '建立 profile：' +
        ins.error.message
      );
    }

    myProfile =
      ins.data || {
        id: me.id,
        username: username,
        nickname: nick
      };
  }


  /* =========================
     滑動操作
  ========================= */

  function enableSwipe(content) {

    var startX = 0;
    var startY = 0;
    var moved = false;

    content.addEventListener(
      'touchstart',
      function (e) {

        if (
          !e.touches ||
          !e.touches[0]
        ) {
          return;
        }

        startX =
          e.touches[0].clientX;

        startY =
          e.touches[0].clientY;

        moved = false;

      },
      {
        passive: true
      }
    );


    content.addEventListener(
      'touchmove',
      function (e) {

        if (
          !e.touches ||
          !e.touches[0]
        ) {
          return;
        }

        var dx =
          e.touches[0].clientX -
          startX;

        var dy =
          e.touches[0].clientY -
          startY;

        if (
          Math.abs(dx) <
          Math.abs(dy)
        ) {
          return;
        }

        if (
          Math.abs(dx) < 10
        ) {
          return;
        }

        moved = true;

        if (dx < 0) {

          content.classList.add(
            'swiped'
          );

        } else {

          content.classList.remove(
            'swiped'
          );

        }

      },
      {
        passive: true
      }
    );


    content.addEventListener(
      'touchend',
      function () {

        if (!moved) {
          return;
        }

      },
      {
        passive: true
      }
    );
  }


  /* =========================
     好友未讀訊息
     
     messages
     conversation_id
     sender_id
     created_at
  ========================= */

  async function getFriendUnreadCount(uid) {

    if (!uid || !me) {
      return 0;
    }

    var conversationId =
      dmRoomId(me.id, uid);

    var lastRead =
      getLastRead(
        'friend',
        conversationId
      );

    var res =
      await supabase
        .from('messages')
        .select(
          'id',
          {
            count: 'exact',
            head: true
          }
        )
        .eq(
          'conversation_id',
          conversationId
        )
        .neq(
          'sender_id',
          me.id
        )
        .gt(
          'created_at',
          lastRead
        );

    if (res.error) {

      console.log(
        '好友未讀訊息讀取失敗：',
        res.error.message
      );

      return 0;
    }

    return Number(
      res.count || 0
    );
  }


  async function loadFriendUnreadMap(ids) {

    var map = {};
    var total = 0;

    for (
      var i = 0;
      i < ids.length;
      i++
    ) {

      var uid = ids[i];

      var count =
        await getFriendUnreadCount(
          uid
        );

      map[uid] = count;

      total += count;
    }

    unreadFriendTotal = total;

    setBadge(
      'friendMessageTotalBadge',
      total
    );

    return map;
  }


  /* =========================
     好友列表
  ========================= */

  async function loadFriends() {

    var box =
      $('friendList');

    var result =
      await supabase
        .from('friendships')
        .select('*')
        .eq('status', 'accepted')
        .or(
          'user_id.eq.' +
          me.id +
          ',friend_id.eq.' +
          me.id
        );

    var rows =
      result.data;

    var error =
      result.error;

    if (error) {

      box.innerHTML =
        '<div class="person">' +
        '<div class="name" style="color:#c62828">' +
        '好友讀取失敗：' +
        escapeHtml(
          error.message
        ) +
        '</div></div>';

      return;
    }

    var ids = [];

    (rows || []).forEach(
      function (r) {

        var other =
          r.user_id === me.id
            ? r.friend_id
            : r.user_id;

        if (
          ids.indexOf(other) < 0
        ) {
          ids.push(other);
        }

      }
    );

    box.innerHTML = '';

    if (!ids.length) {

      setBadge(
        'friendMessageTotalBadge',
        0
      );

      box.innerHTML =
        '<div class="person">' +
        '<div class="name" style="color:#888">' +
        '尚無好友，點「＋」搜尋帳號加好友' +
        '</div></div>';

      return;
    }

    var profileResult =
      await supabase
        .from('profiles')
        .select('*')
        .in('id', ids);

    var profiles =
      profileResult.data || [];

    var profileMap = {};

    profiles.forEach(
      function (p) {
        profileMap[p.id] = p;
      }
    );

    var unreadMap =
      await loadFriendUnreadMap(
        ids
      );


    ids.forEach(
      function (uid) {

        var p =
          profileMap[uid] || {
            id: uid,
            nickname:
              uid.slice(0, 8),
            username: ''
          };

        var display =
          p.nickname ||
          p.username ||
          '使用者';

        var unread =
          unreadMap[uid] || 0;


        var swipeRow =
          document.createElement(
            'div'
          );

        swipeRow.className =
          'swipe-row';


        var deleteBtn =
          document.createElement(
            'button'
          );

        deleteBtn.type =
          'button';

        deleteBtn.className =
          'swipe-delete';

        deleteBtn.textContent =
          '刪除';

        deleteBtn.onclick =
          async function () {

            await deleteFriend(
              uid,
              display
            );

          };


        var content =
          document.createElement(
            'div'
          );

        content.className =
          'swipe-content';


        var person =
          document.createElement(
            'div'
          );

        person.className =
          'person';

  async function deleteFriend(uid, name) {

  if (!me || !uid) {
    return;
  }

  if (!confirm('確定要刪除好友「' + name + '」嗎？')) {
    return;
  }

  try {

    // 刪除「我 → 對方」
    var r1 = await supabase
      .from('friendships')
      .delete()
      .eq('user_id', me.id)
      .eq('friend_id', uid);

    if (r1.error) {
      throw r1.error;

    // 刪除「對方 → 我」
    var r2 = await supabase
      .from('friendships')
      .delete()
      .eq('user_id', uid)
      .eq('friend_id', me.id);

    if (r2.error) {
      throw r2.error;
    }

    await loadFriends();

    setStatus('已刪除好友「' + name + '」');

  } catch (e) {

    setStatus(
      '刪除好友失敗：' +
      (e.message || e)
    );
  }
}


  /* =========================
     群組未讀訊息
     
     group_messages
     group_id
     sender_id
     created_at
  ========================= */

  async function getGroupUnreadCount(
    groupId
  ) {

    if (
      !groupId ||
      !me
    ) {
      return 0;
    }

    var lastRead =
      getLastRead(
        'group',
        groupId
      );

    var res =
      await supabase
        .from('group_messages')
        .select(
          'id',
          {
            count: 'exact',
            head: true
          }
        )
        .eq(
          'group_id',
          groupId
        )
        .neq(
          'sender_id',
          me.id
        )
        .gt(
          'created_at',
          lastRead
        );

    if (res.error) {

      console.log(
        '群組未讀訊息讀取失敗：',
        res.error.message
      );

      return 0;
    }

    return Number(
      res.count || 0
    );
  }


  async function loadGroupUnreadMap(
    gids
  ) {

    var map = {};
    var total = 0;

    for (
      var i = 0;
      i < gids.length;
      i++
    ) {

      var gid = gids[i];

      var count =
        await getGroupUnreadCount(
          gid
        );

      map[gid] = count;

      total += count;
    }

    unreadGroupTotal = total;

    setBadge(
      'groupMessageBadge',
      total
    );

    return map;
  }

  async function loadGroups() {

    var box =
      $('groupList');

    try {

      var memberResult =
        await supabase
          .from('group_members')
          .select(
            'group_id,role'
          )
          .eq(
            'user_id',
            me.id
          );

      var mems =
        memberResult.data || [];

      var error =
        memberResult.error;

      box.innerHTML = '';

      if (error) {

        box.innerHTML =
          '<div class="person">' +
          '<div class="name" style="color:#888">' +
          '群組：' +
          escapeHtml(
            error.message
          ) +
          '</div></div>';

        return;
      }

      var gids =
        mems.map(
          function (m) {
            return m.group_id;
          }
        );

      if (!gids.length) {

        setBadge(
          'groupMessageBadge',
          0
        );

        box.innerHTML =
          '<div class="person">' +
          '<div class="name" style="color:#888">' +
          '尚無群組' +
          '</div></div>';

        return;
      }

      var groupResult =
        await supabase
          .from('chat_groups')
          .select('*')
          .in(

            gids
          );

      var groups =
        groupResult.data || [];

      var unreadMap =
        await loadGroupUnreadMap(
          gids
        );


      groups.forEach(
        function (g) {

          var memberInfo =
            mems.find(
              function (m) {
                return m.group_id === g.id;
              }
            );

          var isGroupOwner =
            memberInfo &&
            memberInfo.role === 'owner';

          var unread =
            unreadMap[g.id] || 0;


          var swipeRow =
            document.createElement(
              'div'
            );

          swipeRow.className =
            'swipe-row';


          var content =
            document.createElement(
              'div'
            );

          content.className =
            'swipe-content';


          var group =
            document.createElement(
              'div'
            );

          group.className =
            'group-row';


          var badgeHtml =
            unread > 0
              ? '<span class="message-badge show">' +

                    ? '99+'
                    : String(unread)
                ) +
                '</span>'
              : '<span class="message-badge">0</span>';


          group.innerHTML =
            '<div class="icon-box" style="background:#06C755">' +
            '群' +
            '</div>' +

            '<div class="name">' +
            escapeHtml(
              g.name || '群組'
            ) +
            '</div>' +

            badgeHtml +

            '<button class="btn-sm btn-green" type="button">' +
            '進入' +
            '</button>';


          group.querySelector(
            'button'
          ).onclick =
            function () {

              /*
               * 進入群組前標記已讀
               */
              setLastRead(
                'group',
                g.id
              );

              location.href =
                'room.html?id=' +
                encodeURIComponent(
                  g.id
                ) +
                '&name=' +
                encodeURIComponent(
                  g.name ||
                  '群組'
                );

            };


          content.appendChild(
            group
          );


          /*
           * 群主不能退群
           */
          if (
            !isGroupOwner
          ) {

            var leaveBtn =
              document.createElement(
                'button'
              );

            leaveBtn.type =
              'button';

            leaveBtn.className =
              'swipe-delete';

            leaveBtn.textContent =
              '退群';

            leaveBtn.onclick =
              async function () {

                await leaveGroup(
                  g.id,
                  g.name ||
                  '群組'
                );

              };

            swipeRow.appendChild(
              leaveBtn
            );
          }


          swipeRow.appendChild(
            content
          );

          box.appendChild(
            swipeRow
          );


          if (
            !isGroupOwner
          ) {

            enableSwipe(
              content
            );

          }

        }
      );

    } catch (e) {

      box.innerHTML =
        '<div class="person">' +
        '<div class="name" style="color:#888">' +
        '群組載入異常' +
        '</div></div>';
    }

  async function leaveGroup(
    groupId,
    groupName

    if (

      !groupId

    if (
      !confirm(
        '確定要退出「' +
        groupName +
        '」嗎？'

      return;
    }

    var res =
      await supabase
        .from('group_members')
        .delete()
        .eq(

          groupId
        )
        .eq(
          'user_id',
          me.id
        );

    if (res.error) {

      '已退出「' +
      groupName +
      '」'
    );
  }

  async function searchPeople(keyword) {

    keyword =
      (keyword || '')
        .trim()
        .replace(/^@/, '');

    if (!keyword) {

      $('searchSection').style.display =
        'none';

      return;
    }

    setStatus(
      '搜尋中…'
    );


    var r1 =
      await supabase
        .from('profiles')
        .select('*')
        .ilike(
          'username',
          '%' +
          keyword +
          '%'
        )
        .limit(20);


    var r2 =
      await supabase
        .from('profiles')
        .select('*')
        .ilike(
          'nickname',
          '%' +
          keyword +
          '%'
        )
        .limit(20);


    var map = {};

    (r1.data || [])
      .concat(
        r2.data || []
      )
      .forEach(

            map[p.id] = p;

    var list =

    var box =

    if (!list.length) {

      box.innerHTML =
        '<div class="person">' +
        '<div class="name" style="color:#888">' +

  /* =========================
     建立群組
  ========================= */

  async function createGroup() {

    var name =
      $('groupName')
        .value
        .trim();

    if (!name) {

      setStatus(
        '請輸入群組名稱'
      );

      return;
    }

    if (!supabase) {

      setStatus(
        'Supabase 沒有連線'
      );

      return;
    }

    if (!me) {

      setStatus(
        '目前沒有登入使用者'
      );

      return;
    }


    var g =
      await supabase
        .from('chat_groups')
        .insert({
          name:
            name,

          owner_id:
            me.id
        })
        .select()
        .single();


    if (g.error) {

      setStatus(
        '建立失敗：' +
        g.error.message
      );

      return;
    }


    var m =
      await supabase
        .from('group_members')
        .insert({
          group_id:
            g.data.id,

          user_id:
            me.id,

          role:
            'owner'
        });


    if (m.error) {

      setStatus(
        '加入群組失敗：' +
        m.error.message
      );

      return;
    }


    hideSheets();


    location.href =
      'room.html?id=' +
      encodeURIComponent(
        g.data.id
      ) +
      '&name=' +
      encodeURIComponent(
        name
      );
  }


  /* =========================
     啟動
  ========================= */

  async function boot() {

    setStatus(
      '檢查套件…'
    );


    if (
      !window.supabase ||
      !window.supabase.createClient
    ) {

      setStatus(
        '套件載入失敗，請重新整理'
      );

      return;
    }


    try {

      supabase =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      setStatus(
        '檢查登入…'
      );


      var sess =
        await supabase.auth.getSession();


      if (
        !sess.data.session
      ) {

        setStatus(
          '未登入，前往登入頁…'
        );


        setTimeout(
          function () {

            location.href =
              'login.html';

          },
          600
        );

        return;
      }


      me =
        sess.data.session.user;


      setStatus(
        '載入個人資料…'
      );

      await ensureProfile();


      setStatus(
        '檢查好友邀請…'
      );

      await loadPendingCount();


      setStatus(
        '載入好友…'
      );

      await loadFriends();


      setStatus(
        '載入群組…'
      );

      await loadGroups();


      setStatus(
        '帳號：@' +
        (
          myProfile &&
          myProfile.username
            ? myProfile.username
            : 'user'
        )
      );


    } catch (e) {

      setStatus(
        '錯誤：' +
        (
          e &&
          e.message
            ? e.message
            : e
        )
      );
    }
  }

    .addEventListener(
      'input',
      function () {

        clearTimeout(
          searchTimer
        );

        var v =
          $('searchInput')
            .value;

        searchTimer =
          setTimeout(
            function () {

              searchPeople(v);

            },
            350
          );

      }
    );


  /* =========================
     回到通訊錄時重新整理數字
  ========================= */

  document.addEventListener(
    'visibilitychange',
    function () {

      if (
        document.visibilityState ===
        'visible' &&
        me &&
        supabase
      ) {

        loadPendingCount();

        loadFriends();

        loadGroups();

      }

    }
  );


  window.addEventListener(
    'focus',
    function () {

      if (
        me &&
        supabase
      ) {

        loadPendingCount();

        loadFriends();

        loadGroups();

      }

    }
  );


  /* =========================
     啟動網站
  ========================= */

  boot();

})();
</script>

<script src="call-notify.js"></script>

</body>
</html>
