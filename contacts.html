<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通訊錄 - 安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .search {
      background: white;
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
    }
    .search input {
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .section-title {
      padding: 12px 16px 6px;
      font-size: 13px;
      color: #888;
      font-weight: 500;
    }

    .contact-item {
      background: white;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #f5f5f5;
    }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .contact-name { font-weight: 600; font-size: 15px; }
    .contact-rel { font-size: 12px; color: #999; margin-top: 2px; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 18px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 10px;
      width: 60px;
      text-decoration: none;
    }
    .nav-item.active { color: #06C755; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>通訊錄</h1>
    <button class="header-btn" onclick="alert('之後可新增聯絡人')">＋</button>
  </div>

  <div class="search">
    <input type="text" placeholder="搜尋聯絡人">
  </div>

  <div class="section-title">家人</div>
  <div class="contact-item" onclick="alert('之後可查看個人資料或聊天')">
    <div class="avatar">👩</div>
    <div>
      <div class="contact-name">老婆</div>
      <div class="contact-rel">家人</div>
    </div>
  </div>
  <div class="contact-item" onclick="alert('之後可查看個人資料或聊天')">
    <div class="avatar">👨</div>
    <div>
      <div class="contact-name">爸爸</div>
      <div class="contact-rel">家人</div>
    </div>
  </div>
  <div class="contact-item" onclick="alert('之後可查看個人資料或聊天')">
    <div class="avatar">👩</div>
    <div>
      <div class="contact-name">媽媽</div>
      <div class="contact-rel">家人</div>
    </div>
  </div>

  <div class="section-title">親戚</div>
  <div class="contact-item" onclick="alert('之後可查看個人資料或聊天')">
    <div class="avatar">👤</div>
    <div>
      <div class="contact-name">姑姑</div>
      <div class="contact-rel">親戚</div>
    </div>
  </div>
  <div class="contact-item" onclick="alert('之後可查看個人資料或聊天')">
    <div class="avatar">👤</div>
    <div>
      <div class="contact-name">舅舅</div>
      <div class="contact-rel">親戚</div>
    </div>
  </div>

  <div class="section-title">同學</div>
  <div class="contact-item" onclick="alert('之後可查看個人資料或聊天')">
    <div class="avatar">🎓</div>
    <div>
      <div class="contact-name">鄭中奕</div>
      <div class="contact-rel">碩班同學</div>
    </div>
  </div>

  <div class="section-title">群組</div>
  <div class="contact-item" onclick="alert('之後進入群組')">
    <div class="avatar">👥</div>
    <div>
      <div class="contact-name">家人群組</div>
      <div class="contact-rel">5 位成員</div>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-item" href="home.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">🏠</div>
      首頁
    </a>
    <a class="nav-item" href="chat.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">💬</div>
      聊天
    </a>
    <a class="nav-item active" href="contacts.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">👥</div>
      通訊錄
    </a>
    <a class="nav-item" href="me.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">👤</div>
      我
    </a>
  </div>
</body>
</html>
