<script>

(function () {

"use strict";


/* =====================================================

var SUPABASE_URL =
  'https://perfsipperncvjocznhl.supabase.co';

var SUPABASE_KEY =

var supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   狀態
===================================================== */

var allDisasters = [];

var currentFilter = 'all';

/*
 * 預設直接顯示今天
 */
var currentPeriod = 'today';


/* =====================================================
   DOM
===================================================== */

var list =
  document.getElementById(
    'disasterList'
  );

var statusText =
  document.getElementById(
    'statusText'
  );

var statusDot =
  document.getElementById(
    'statusDot'
  );

var refreshBtn =
  document.getElementById(
    'refreshBtn'
  );

var voiceHint =
  document.getElementById(
    'voiceHint'
  );


/* =====================================================
   災害圖示
===================================================== */

function getDisasterIcon(type) {

  var text =
    String(type || '')
      .toLowerCase();

  if (
    text.includes('颱風') ||
    text.includes('typhoon')
  ) {

    return '🌀';

  }

  if (
    text.includes('地震') ||
    text.includes('earthquake')
  ) {

    return '🌎';

  }

  if (
    text.includes('豪雨') ||
    text.includes('大雨') ||
    text.includes('雨') ||
    text.includes('rain')
  ) {

    return '🌧️';

  }

  if (
    text.includes('雷') ||
    text.includes('thunder')
  ) {

    return '⛈️';

  }

  if (
    text.includes('火') ||
    text.includes('fire')
  ) {

    return '🔥';

  }

  return '⚠️';

}


/* =====================================================
   災害類型
===================================================== */

function getDisasterTypeName(type) {

  if (!type) {

    return '其他';

  }

  var value =
    String(type)
      .toLowerCase();

  if (
    value.includes('typhoon') ||
    value.includes('颱風')
  ) {

    return '颱風';

  }

  if (
    value.includes('earthquake') ||
    value.includes('地震')
  ) {

    return '地震';

  }

  if (
    value.includes('rain') ||
    value.includes('豪雨') ||
    value.includes('大雨')
  ) {

    return '豪雨';

  }

  return type;

}


/* =====================================================
   等級
===================================================== */

function getSeverityClass(severity) {

  var value =
    String(severity || '')
      .toLowerCase();

  if (
    value.includes('極') ||
    value.includes('critical') ||
    value.includes('嚴重')
  ) {

    return 'critical';

  }

  if (
    value.includes('高') ||
    value.includes('high')
  ) {

    return 'high';

  }

  if (
    value.includes('中') ||
    value.includes('medium')
  ) {

    return 'medium';

  }

  return 'low';

}


/* =====================================================
   等級文字
===================================================== */

function getSeverityText(severity) {

  if (!severity) {

    return '一般';

  }

  return String(severity);

}


/* =====================================================
   日期格式
===================================================== */

function formatDate(value) {

  if (!value) {

    return '--';

  }

  try {

    return new Date(value)
      .toLocaleString(
        'zh-TW',
        {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }
      );

  } catch (e) {

    return String(value);

  }

}


/* =====================================================
   日期開始
===================================================== */

function startOfDay(date) {

  var d =
    new Date(date);

  d.setHours(
    0,
    0,
    0,
    0
  );

  return d;

}


/* =====================================================
   日期結束
===================================================== */

function endOfDay(date) {

  var d =
    startOfDay(date);

  d.setDate(
    d.getDate() + 1
  );

  return d;

}


/* =====================================================
   判斷災害是否與某一天重疊
===================================================== */

function itemOverlapsDay(
  item,
  day
) {

  var dayStart =
    startOfDay(day);

  var dayEnd =
    endOfDay(day);


  /*
   * 沒有 start_at：
   * 無法判斷預報日期
   */
  if (!item.start_at) {

    return false;

  }


  var itemStart =
    new Date(
      item.start_at
    );


  /*
   * 沒有 end_at：
   * 只要開始時間落在這一天
   * 就算屬於這一天
   */
  if (!item.end_at) {

    return (
      itemStart >= dayStart &&
      itemStart < dayEnd
    );

  }


  var itemEnd =
    new Date(
      item.end_at
    );


  /*
   * 時間區間重疊判斷
   *
   * itemStart < dayEnd
   * &&
   * itemEnd >= dayStart
   */
  return (
    itemStart < dayEnd &&
    itemEnd >= dayStart
  );

}


/* =====================================================
   日期篩選
===================================================== */

function itemMatchesDate(
  item,
  period
) {

  var today =
    startOfDay(
      new Date()
    );


  if (
    period === 'all'
  ) {

    return true;

  }


  if (
    period === 'today'
  ) {

    return itemOverlapsDay(
      item,
      today
    );

  }


  if (
    period === 'tomorrow'
  ) {

    var tomorrow =
      new Date(today);

    tomorrow.setDate(
      tomorrow.getDate() + 1
    );

    return itemOverlapsDay(
      item,
      tomorrow
    );

  }


  if (
    period ===
    'dayAfterTomorrow'
  ) {

    var dayAfterTomorrow =
      new Date(today);

    dayAfterTomorrow.setDate(
      dayAfterTomorrow.getDate() + 2
    );

    return itemOverlapsDay(
      item,
      dayAfterTomorrow
    );

  }


  return true;

}


/* =====================================================
   數值
===================================================== */

function formatNumber(
  value,
  unit
) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '--';

  }

  return value + (
    unit || ''
  );

}


/* =====================================================
   日期標籤
===================================================== */

function getPeriodText(item) {

  if (!item.start_at) {

    return '';

  }


  var today =
    startOfDay(
      new Date()
    );


  var tomorrow =
    new Date(today);

  tomorrow.setDate(
    tomorrow.getDate() + 1
  );


  var dayAfterTomorrow =
    new Date(today);

  dayAfterTomorrow.setDate(
    dayAfterTomorrow.getDate() + 2
  );


  if (
    itemOverlapsDay(
      item,
      today
    )
  ) {

    return '今天';

  }


  if (
    itemOverlapsDay(
      item,
      tomorrow
    )
  ) {

    return '明天';

  }


  if (
    itemOverlapsDay(
      item,
      dayAfterTomorrow
    )
  ) {

    return '後天';

  }


  return '';

}


/* =====================================================
   災害卡片
===================================================== */

function createDisasterCard(item) {

  var typeName =
    getDisasterTypeName(
      item.disaster_type
    );

  var severityClass =
    getSeverityClass(
      item.severity
    );

  var icon =
    getDisasterIcon(
      item.disaster_type
    );

  var periodText =
    getPeriodText(item);


  var card =
    document.createElement(
      'div'
    );

  card.className =
    'disaster-card ' +
    severityClass;


  var html = '';


  html +=
    '<div class="disaster-top">';


  html +=
    '<div class="disaster-icon">' +
    icon +
    '</div>';


  html +=
    '<div class="disaster-heading">';


  html +=
    '<div class="disaster-type">' +
    escapeHtml(typeName) +
    '</div>';


  html +=
    '<div class="disaster-title">' +
    escapeHtml(
      item.title ||
      '災害通知'
    ) +
    '</div>';


  if (periodText) {

    html +=
      '<span class="period-badge">' +
      escapeHtml(
        periodText
      ) +
      '</span>';

  }


  html +=
    '</div>';


  html +=
    '<span class="severity ' +
    severityClass +
    '">' +
    escapeHtml(
      getSeverityText(
        item.severity
      )
    ) +
    '</span>';


  html +=
    '</div>';


  if (item.description) {

    html +=
      '<div class="disaster-description">' +
      escapeHtml(
        item.description
      ) +
      '</div>';

  }


  html +=
    '<div class="disaster-info">';


  if (item.region) {

    html +=
      infoItem(
        '📍 地區',
        item.region
      );

  }


  if (item.alert_level) {

    html +=
      infoItem(
        '🚨 警戒',
        item.alert_level
      );

  }


  if (item.typhoon_name) {

    html +=
      infoItem(
        '🌀 颱風',
        item.typhoon_name
      );

  }


  if (item.typhoon_status) {

    html +=
      infoItem(
        '狀態',
        item.typhoon_status
      );

  }


  if (
    item.pressure !== null &&
    item.pressure !== undefined
  ) {

    html +=
      infoItem(
        '氣壓',
        formatNumber(
          item.pressure,
          ' hPa'
        )
      );

  }


  if (
    item.max_wind_speed !== null &&
    item.max_wind_speed !== undefined
  ) {

    html +=
      infoItem(
        '最大風速',
        item.max_wind_speed
      );

  }


  if (item.movement_direction) {

    html +=
      infoItem(
        '移動方向',
        item.movement_direction
      );

  }


  if (
    item.movement_speed !== null &&
    item.movement_speed !== undefined
  ) {

    html +=
      infoItem(
        '移動速度',
        item.movement_speed
      );

  }


  if (
    item.magnitude !== null &&
    item.magnitude !== undefined
  ) {

    html +=
      infoItem(
        '規模',
        item.magnitude
      );

  }


  if (
    item.depth !== null &&
    item.depth !== undefined
  ) {

    html +=
      infoItem(
        '深度',
        item.depth + ' km'
      );

  }


  if (item.earthquake_location) {

    html +=
      infoItem(
        '震央',
        item.earthquake_location
      );

  }


  if (item.intensity) {

    html +=
      infoItem(
        '震度',
        item.intensity
      );

  }


  if (
    item.rainfall !== null &&
    item.rainfall !== undefined
  ) {

    html +=
      infoItem(
        '雨量',
        item.rainfall
      );

  }


  if (
    item.rain_probability !== null &&
    item.rain_probability !== undefined
  ) {

    html +=
      infoItem(
        '降雨機率',
        item.rain_probability +
        '%'
      );

  }


  if (
    item.latitude !== null &&
    item.longitude !== null
  ) {

    html +=
      infoItem(
        '座標',
        Number(
          item.latitude
        ).toFixed(4) +
        ', ' +
        Number(
          item.longitude
        ).toFixed(4)
      );

  }


  html +=
    '</div>';


  html +=
    '<div class="disaster-info">';


  html +=
    infoItem(
      '開始時間',
      formatDate(
        item.start_at
      )
    );


  html +=
    infoItem(
      '結束時間',
      formatDate(
        item.end_at
      )
    );


  html +=
    '</div>';


  html +=
    '<div class="disaster-footer">';


  html +=
    '<div class="source-text">' +
    escapeHtml(
      item.source ||
      '安全團聚災害資料庫'
    ) +
    '</div>';


  if (item.source_url) {

    html +=
      '<a ' +
      'class="source-btn" ' +
      'href="' +
      escapeAttribute(
        item.source_url
      ) +
      '" ' +
      'target="_blank" ' +
      'rel="noopener">' +
      '查看來源 →' +
      '</a>';

  }


  html +=
    '</div>';


  card.innerHTML =
    html;


  return card;

}


/* =====================================================
   資料項目
===================================================== */

function infoItem(
  label,
  value
) {

  return (

    '<div class="info-item">' +

      '<div class="info-label">' +
        escapeHtml(label) +
      '</div>' +

      '<div class="info-value">' +
        escapeHtml(
          value === null ||
          value === undefined
            ? '--'
            : String(value)
        ) +
      '</div>' +

    '</div>'

  );

}


/* =====================================================
   HTML 安全處理
===================================================== */

function escapeHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* =====================================================
   顯示資料
===================================================== */

function renderDisasters() {

  if (!list) {

    return;

  }


  list.innerHTML = '';


  var filtered =
    allDisasters.filter(
      function(item) {

        var periodOK =
          itemMatchesDate(
            item,
            currentPeriod
          );


        if (!periodOK) {

          return false;

        }


        if (
          currentFilter ===
          'all'
        ) {

          return true;

        }


        return (
          getDisasterTypeName(
            item.disaster_type
          ) ===
          currentFilter
        );

      }
    );


  if (!filtered.length) {

    var periodName =
      getPeriodName(
        currentPeriod
      );


    list.innerHTML =

      '<div class="empty-state">' +

        '<div class="empty-icon">' +
          '📭' +
        '</div>' +

        '<div class="empty-title">' +
          '目前沒有資料' +
        '</div>' +

        '<div class="empty-text">' +

          escapeHtml(
            periodName +
            '沒有符合目前篩選條件的災害或預報資料。'
          ) +

        '</div>' +

      '</div>';

    return;

  }


  filtered.forEach(
    function(item) {

      list.appendChild(
        createDisasterCard(
          item
        )
      );

    }
  );

}


/* =====================================================
   日期名稱
===================================================== */

function getPeriodName(
  period
) {

  if (
    period === 'today'
  ) {

    return '今天';

  }

  if (
    period === 'tomorrow'
  ) {

    return '明天';

  }

  if (
    period ===
    'dayAfterTomorrow'
  ) {

    return '後天';

  }

  return '全部';

}


/* =====================================================
   讀取 disaster_data
===================================================== */

async function loadDisasters() {

  if (!list) {

    return;

  }


  setStatus(
    'loading',
    '正在更新災害資料…'
  );


  list.innerHTML =

    '<div class="loading">' +

    '正在讀取災害資料…' +

    '</div>';


  try {

    /*
     * 讀取全部資料。
     *
     * 不在 Supabase 查詢階段
     * 限制日期。
     *
     * 日期篩選交給前端處理。
     */

    var result =

      await supabaseClient

        .from(
          'disaster_data'
        )

        .select('*')

        .order(
          'start_at',
          {
            ascending: true
          }
        );


    if (result.error) {

      throw result.error;

    }


    allDisasters =
      result.data || [];


    renderDisasters();


    setStatus(
      'ok',
      '已讀取 ' +
      allDisasters.length +
      ' 筆災害資料'
    );


  } catch (error) {

    console.error(
      'disaster_data 讀取失敗：',
      error
    );


    allDisasters = [];


    list.innerHTML =

      '<div class="empty-state">' +

        '<div class="empty-icon">' +
          '⚠️' +
        '</div>' +

        '<div class="empty-title">' +
          '災害資料讀取失敗' +
        '</div>' +

        '<div class="empty-text">' +

          '請確認 Supabase 的資料表與 RLS 權限。' +

          '<br><br>' +

          escapeHtml(
            error.message ||
            '未知錯誤'
          ) +

        '</div>' +

      '</div>';


    setStatus(
      'error',
      '資料讀取失敗'
    );

  }

}


/* =====================================================
   狀態
===================================================== */

function setStatus(
  type,
  text
) {

  if (statusText) {

    statusText.textContent =
      text;

  }


  if (statusDot) {

    statusDot.classList.remove(
      'loading',
      'error'
    );


    if (
      type ===
      'loading'
    ) {

      statusDot.classList.add(
        'loading'
      );

    }


    if (
      type ===
      'error'
    ) {

      statusDot.classList.add(
        'error'
      );

    }

  }

}


/* =====================================================
   日期篩選按鈕
===================================================== */

document
  .querySelectorAll(
    '.date-btn'
  )
  .forEach(
    function(button) {

      button.addEventListener(
        'click',
        function() {

          document
            .querySelectorAll(
              '.date-btn'
            )
            .forEach(
              function(item) {

                item.classList.remove(
                  'active'
                );

              }
            );


          button.classList.add(
            'active'
          );


          currentPeriod =
            button.dataset.period ||
            'today';


          renderDisasters();

        }
      );

    }
  );


/* =====================================================
   災害類型篩選
===================================================== */

document
  .querySelectorAll(
    '.filter-btn'
  )
  .forEach(
    function(button) {

      button.addEventListener(
        'click',
        function() {

          document
            .querySelectorAll(
              '.filter-btn'
            )
            .forEach(
              function(item) {

                item.classList.remove(
                  'active'
                );

              }
            );


          button.classList.add(
            'active'
          );


          currentFilter =
            button.dataset.type ||
            'all';


          renderDisasters();

        }
      );

    }
  );


/* =====================================================
   更新
===================================================== */

if (refreshBtn) {

  refreshBtn.addEventListener(
    'click',
    function() {

      loadDisasters();

    }
  );

}


/* =====================================================
   語音提示
===================================================== */

function showVoiceHint() {

  if (!voiceHint) {

    return;

  }


  voiceHint.classList.add(
    'show'
  );


  setTimeout(
    function() {

      voiceHint.classList.remove(
        'show'
      );

    },
    4500
  );

}


/* =====================================================
   更新日期按鈕
===================================================== */

function updatePeriodButtons() {

  document
    .querySelectorAll(
      '.date-btn'
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          'active',
          (
            button.dataset.period ||
            'today'
          ) ===
          currentPeriod
        );

      }
    );

}


/* =====================================================
   更新災害類型按鈕
===================================================== */

function updateTypeButtons() {

  document
    .querySelectorAll(
      '.filter-btn'
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          'active',
          (
            button.dataset.type ||
            'all'
          ) ===
          currentFilter
        );

      }
    );

}


/* =====================================================
   語音控制
===================================================== */

function handleVoiceCommand(
  text
) {

  var command =
    String(text || '')
      .trim()
      .toLowerCase();


  /*
   * 日期
   */

  if (
    command.includes('後天')
  ) {

    currentPeriod =
      'dayAfterTomorrow';

  }

  else if (
    command.includes('明天')
  ) {

    currentPeriod =
      'tomorrow';

  }

  else if (
    command.includes('今天')
  ) {

    currentPeriod =
      'today';

  }

  else if (
    command.includes('全部')
  ) {

    currentPeriod =
      'all';

  }


  /*
   * 災害類型
   */

  if (
    command.includes('颱風')
  ) {

    currentFilter =
      '颱風';

  }

  else if (
    command.includes('地震')
  ) {

    currentFilter =
      '地震';

  }

  else if (
    command.includes('豪雨') ||
    command.includes('大雨')
  ) {

    currentFilter =
      '豪雨';

  }

  else if (
    command.includes('其他')
  ) {

    currentFilter =
      '其他';

  }

  else if (
    command.includes('全部')
  ) {

    /*
     * 如果只說「全部」
     * 保留日期選擇。
     *
     * 例如目前是「明天」
     * 說「全部」不會把日期
     * 強制改成全部。
     */

    if (
      !(
        command.includes('今天') ||
        command.includes('明天') ||
        command.includes('後天')
      )
    ) {

      currentFilter =
        'all';

    }

  }


  /*
   * 更新
   */

  if (
    command.includes('更新') ||
    command.includes('重新整理') ||
    command.includes('刷新')
  ) {

    loadDisasters();

    return;

  }


  updatePeriodButtons();

  updateTypeButtons();

  renderDisasters();

}


/* =====================================================
   Web Speech
===================================================== */

if (
  'webkitSpeechRecognition'
  in window
) {

  var recognition =
    new webkitSpeechRecognition();


  recognition.lang =
    'zh-TW';


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  window.startDisasterVoice =
    function() {

      try {

        showVoiceHint();

        recognition.start();

      }

      catch (e) {}

    };


  recognition.onresult =
    function(event) {

      var transcript =
        event
          .results[0][0]
          .transcript;


      console.log(
        '災害語音：',
        transcript
      );


      handleVoiceCommand(
        transcript
      );

    };


  recognition.onerror =
    function(event) {

      console.log(
        '語音辨識錯誤：',
        event.error
      );

    };

}


/* =====================================================
   語音播放
===================================================== */

function speak(text) {

  if (
    !(
      'speechSynthesis'
      in window
    )
  ) {

    return;

  }


  try {

    window.speechSynthesis.cancel();


    var utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      'zh-TW';


    utterance.rate =
      1;


    window.speechSynthesis.speak(
      utterance
    );

  }

  catch (e) {}

}


/* =====================================================
   啟動
===================================================== */

loadDisasters();


/* =====================================================
   每 5 分鐘自動更新
===================================================== */

setInterval(
  function() {

    loadDisasters();

  },
  5 * 60 * 1000
);


/* =====================================================
   首次提示
===================================================== */

setTimeout(
  function() {

    showVoiceHint();

  },
  1500
);


})();

</script>
