<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登入 - 安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
    .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 28px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #06C755; }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 20px;
      font-size: 14px;
      color: #555;
    }
    .remember input { width: auto; margin: 0; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .btn-green { background: #06C755; color: white; }
    .btn-outline {
      background: white;
      border: 1px solid #ddd;
      color: #333;
    }
    .divider {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin: 16px 0;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .links a { color: #06C755; text-decoration: none; margin: 0 8px; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      word-break: break-all;
    }
    .status.ok { background: #e8f5e9; color: #2e7d32; display: block; }
    .status.err { background: #fdecea; color: #c62828; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>安全團聚</h1>
    <div class="sub">登入你的帳號</div>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="密碼">

    <label class="remember">
      <input type="checkbox" id="remember"> 記住我（15 天）
    </label>

    <button class="btn btn-green" id="btnLogin">登入</button>

    <div class="divider">或使用以下方式</div>

    <button class="btn btn-outline" id="btnGoogle">用 Google 登入</button>
    <button class="btn btn-outline" id="btnLine">用 LINE 登入</button>

    <div class="links">
      <a href="register.html">註冊新帳號</a>
      <a href="#" id="btnForgot">忘記密碼</a>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://perfsipperncvjocznhl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (isError ? 'err' : 'ok');
    }

    function setRemember(days) {
      if (days > 0) {
        localStorage.setItem('remember_until', Date.now() + days * 24 * 60 * 60 * 1000);
      } else {
        localStorage.removeItem('remember_until');
      }
    }

    document.getElementById('btnLogin').onclick = async function () {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) {
        showStatus('請輸入 Email 和密碼', true);
        return;
      }

      showStatus('登入中…');

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          showStatus('登入失敗：' + error.message, true);
          return;
        }

        setRemember(remember ? 15 : 0);
        showStatus('登入成功，正在進入…');
        setTimeout(function () {
          location.href = 'home.html';
        }, 600);
      } catch (e) {
        showStatus('發生錯誤：' + e.message, true);
      }
    };

    document.getElementById('btnGoogle').onclick = async function () {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://nl13741619-commits.github.io/safe-reunion-login/home.html' }
      });
      if (error) showStatus('Google 失敗：' + error.message, true);
    };

    document.getElementById('btnLine').onclick = async function () {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'CUSTOM:LINE',
        options: { redirectTo: 'https://nl13741619-commits.github.io/safe-reunion-login/home.html' }
      });
      if (error) showStatus('LINE 失敗：' + error.message, true);
    };

    document.getElementById('btnForgot').onclick = function (e) {
      e.preventDefault();
      alert('忘記密碼功能下一步會做');
    };

    supabase.auth.getSession().then(function (result) {
      if (result.data.session) {
        location.href = 'home.html';
      }
    });
  </script>
</body>
</html>
