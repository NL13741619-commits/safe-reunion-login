name: Patch SOS positioning only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only sendSOS positioning flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('map.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('async function sendSOS() {')
          end_marker = 'document.getElementById(\"btnSosTop\").onclick =\n  sendSOS;'
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('sendSOS block not found; no changes made')

          end += len(end_marker)

          new = r'''async function sendSOS() {
  if (!me) {
    alert("請先登入");
    return;
  }

  if (!confirm("向本群組／活動發送 SOS 求助？")) {
    return;
  }

  // SOS 專用定位：不使用舊的 myLat / myLng 快取，強制取得目前手機位置。
  if (!navigator.geolocation) {
    alert("🚨 SOS 無法發送：此裝置不支援定位功能。");
    return;
  }

  showSosBanner("📍 正在取得目前位置…", 5000);

  let sosPosition;
  try {
    sosPosition = await new Promise(function (resolve, reject) {
      navigator.geolocation.getCurrentPosition(
        function (position) {
          resolve(position);
        },
        function (error) {
          reject(error);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  } catch (e) {
    const code = e && e.code;
    let message = "🚨 SOS 無法發送：尚未取得手機定位。";
    if (code === 1) {
      message = "🚨 SOS 無法發送：請允許瀏覽器使用定位權限後再試。";
    } else if (code === 2) {
      message = "🚨 SOS 無法發送：目前無法取得手機定位，請稍後再試。";
    } else if (code === 3) {
      message = "🚨 SOS 無法發送：定位逾時，請到訊號較好的地方再試。";
    }
    showSosBanner(message, 7000);
    alert(message);
    return;
  }

  const lat = Number(sosPosition.coords.latitude);
  const lng = Number(sosPosition.coords.longitude);

  if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
    const message = "🚨 SOS 無法發送：手機沒有回傳有效座標。";
    showSosBanner(message, 7000);
    alert(message);
    return;
  }

  // 只更新 SOS 所需的目前座標；不修改既有 GPS watch / 群組定位流程。
  myLat = lat;
  myLng = lng;

  // 保留既有位置處理流程（包含目前地圖定位顯示），但 SOS 不依賴它是否開啟分享。
  try {
    onPosition(sosPosition);
  } catch (e) {
    console.warn("SOS onPosition 處理失敗，仍使用 SOS 專用座標：", e);
  }

  // 確保 SOS 發送前，自己的最新座標已寫入 location_shares，供接收端／後端備援使用。
  try {
    const shareResult = await sb
      .from("location_shares")
      .upsert({
        user_id: me.id,
        room_id: roomId,
        lat: lat,
        lng: lng,
        display_name: (me.email || "user").split("@")[0],
        updated_at: new Date().toISOString()
      }, { onConflict: "user_id,room_id" });

    if (shareResult.error) {
      console.warn("SOS location_shares 寫入失敗：", shareResult.error);
    }
  } catch (e) {
    console.warn("SOS location_shares 備援寫入失敗：", e);
  }

  const result = await sb
    .from("sos_events")
    .insert({
      room_id: roomId,
      user_id: me.id,
      display_name: (me.email || "user").split("@")[0],
      lat: lat,
      lng: lng,
      message: "遇到危險或迷路，需要協助"
    });

  if (result.error) {
    alert("SOS 失敗：" + result.error.message);
    return;
  }

  L.circleMarker(
    [lat, lng],
    {
      radius: 12,
      color: "#c62828",
      fillColor: "#c62828",
      fillOpacity: 0.5
    }
  )
    .addTo(map)
    .bindPopup("🚨 SOS")
    .openPopup();

  showSosBanner("🚨 SOS 已發送給群組（已附目前定位）", 5000);

  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200, 100, 400]);
  }
}

document.getElementById("btnSosTop").onclick =
  sendSOS;'''

          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify only SOS function changed
        run: |
          git diff --check
          git diff -- map.html
          grep -n "async function sendSOS" map.html
          grep -n "maximumAge: 0" map.html
          grep -n "location_shares" map.html

      - name: Commit map.html and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map.html
          git rm .github/workflows/patch-sos-position.yml
          git commit -m "Fix SOS positioning only"
          git push
