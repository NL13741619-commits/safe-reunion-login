name: Fix SOS location

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sos-location.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force fresh SOS location
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('map.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'''  /\*\n     SOS 前先確認目前位置\n  \*/\n\n  if \(\n    myLat == null \|\|\n    myLng == null\n  \) \{.*?\n  \}\n\n  const result =''',
              re.S
          )

          replacement = '''  /*
     SOS 發送前強制取得一次最新座標。
     不使用舊快取，避免只有 SOS 通知卻沒有 lat/lng。
  */

  if (!navigator.geolocation) {
    alert("此裝置不支援定位，無法發送帶位置的 SOS");
    return;
  }

  let sosPositionOK = False

  try:
    await new Promise(function (resolve) {
      navigator.geolocation.getCurrentPosition(
        function (position) {
          onPosition(position);
          sosPositionOK = (
            Number.isFinite(Number(position.coords.latitude)) and
            Number.isFinite(Number(position.coords.longitude))
          );
          resolve();
        },
        function (error) {
          console.warn("SOS 最新定位失敗：", error);
          resolve();
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  } catch (e) {
    console.warn("SOS 定位補抓失敗：", e);
  }

  if (
    !sosPositionOK ||
    !Number.isFinite(Number(myLat)) ||
    !Number.isFinite(Number(myLng))
  ) {
    alert("目前無法取得手機最新位置，為了避免發送沒有座標的 SOS，請確認已允許定位後再試。");
    return;
  }

  const result ='''

          # Correct Python placeholder tokens inside the JavaScript replacement.
          replacement = replacement.replace('False', 'false').replace(' and ', ' && ')

          if not pattern.search(s):
              raise SystemExit('SOS target block not found; no file changed')

          s = pattern.sub(replacement, s, count=1)
          p.write_text(s, encoding='utf-8')

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-sos-location.yml
          git add map.html .github/workflows/fix-sos-location.yml
          git diff --cached --check
          git commit -m "fix: SOS must include fresh location [sos-fix]"
          git push
