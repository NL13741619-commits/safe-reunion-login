name: Remove camera markers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-map-view.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible speed camera markers only
        shell: python
        run: |
          from pathlib import Path
          p = Path('map.html')
          s = p.read_text(encoding='utf-8')

          # Do not touch the map, map layers, four buttons, GPS, SOS or realtime location.
          s = s.replace('drawCameraMarkers();', '')

          # Replace only the camera-marker drawing function, if present.
          start = s.find('function drawCameraMarkers(')
          if start != -1:
              brace = s.find('{', start)
              if brace != -1:
                  depth = 0
                  end = -1
                  for i in range(brace, len(s)):
                      if s[i] == '{':
                          depth += 1
                      elif s[i] == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end != -1:
                      replacement = '''function drawCameraMarkers() {
  if (typeof cameraMarkers !== 'undefined' && typeof map !== 'undefined') {
    cameraMarkers.forEach(function (m) {
      if (map.hasLayer(m)) map.removeLayer(m);
    });
    cameraMarkers = [];
  }
}'''
                      s = s[:start] + replacement + s[end:]

          p.write_text(s, encoding='utf-8')

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-map-view.yml
          git add map.html .github/workflows/restore-map-view.yml
          git commit -m "Remove visible camera markers only" || exit 0
          git push
