name: Safe-Reunion targeted fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safe-reunion-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) map.html: remove visible camera icons, keep speed-camera warning logic.
          p = Path('map.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    drawCameraMarkers();\n    console.log("測速資料：", cameras.length);',
                        '    console.log("測速資料：", cameras.length);')
          # Keep the function available for compatibility, but make it render nothing.
          s = re.sub(r'function drawCameraMarkers\(\) \{.*?\n\}',
                     'function drawCameraMarkers() {\n  cameraMarkers.forEach(function (m) {\n    if (map.hasLayer(m)) map.removeLayer(m);\n  });\n  cameraMarkers = [];\n}', s, count=1, flags=re.S)
          # 2) Critical mainland-location fix: never discard coordinates only because accuracy >300m.
          s = s.replace('  if (Number.isFinite(accuracy) && accuracy > 300) {\n    subEl.textContent = "GPS 訊號較弱 ±" + Math.round(accuracy) + "m";\n    return;\n  }',
                        '  if (Number.isFinite(accuracy) && accuracy > 300) {\n    subEl.textContent = "GPS 訊號較弱 ±" + Math.round(accuracy) + "m｜仍持續分享";\n  }')
          p.write_text(s, encoding='utf-8')

          # 3) home.html: ensure the board is not shown on the home page.
          p = Path('home.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<[^>]*>[^<]*寶寶留言板[^<]*</[^>]+>\s*', '\n', s)
          p.write_text(s, encoding='utf-8')

          # 4) me.html: add the board only to the personal "我" page.
          p = Path('me.html')
          s = p.read_text(encoding='utf-8')
          if 'id="baobao-message-board-link"' not in s:
              block = '''\n  <div class="menu-group" id="baobao-message-board-link">\n    <div class="menu-item" onclick="location.href='baobao-message-board.html'">\n      <div class="menu-icon" style="background:#e8f5e9">💬</div>\n      <div class="menu-text">寶寶留言板</div>\n      <div class="menu-arrow">›</div>\n    </div>\n  </div>\n'''
              marker = '<div id="home-section" class="section active">'
              if marker in s:
                  s = s.replace(marker, marker + block, 1)
              else:
                  raise SystemExit('me.html insertion marker not found')
          p.write_text(s, encoding='utf-8')

          # Remove this one-shot workflow after applying the patch.
          Path('.github/workflows/safe-reunion-fix.yml').unlink()

      - name: Commit targeted fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map.html home.html me.html .github/workflows/safe-reunion-fix.yml
          git commit -m "Fix map camera icons and mainland location sharing" || exit 0
          git push
