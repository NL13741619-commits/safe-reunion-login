name: Fix gray map overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-map-gray-overlay.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated HTML document if present
        shell: python
        run: |
          from pathlib import Path
          p = Path('map.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!DOCTYPE html>'
          positions = []
          start = 0
          while True:
              i = s.lower().find(marker.lower(), start)
              if i < 0:
                  break
              positions.append(i)
              start = i + len(marker)
          changed = False
          if len(positions) > 1:
              s = s[:positions[1]]
              end = s.lower().rfind('</html>')
              if end >= 0:
                  s = s[:end + len('</html>')] + '\n'
              changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          print(f'DOCTYPE count before fix: {len(positions)}; changed={changed}')
      - name: Commit map fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map.html .github/workflows/fix-map-gray-overlay.yml
          git diff --cached --quiet || git commit -m 'Fix gray map overlay'
          git push
          git rm -f .github/workflows/fix-map-gray-overlay.yml
          git commit -m 'Remove one-shot map repair workflow'
          git push
