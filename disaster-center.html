<script>
/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  'https://perfsipperncvjocznhl.supabase.co';

const SUPABASE_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzZXJ2aWNlIiwicmVmIjoicGVyZnNpcHBlcm5jdmpvY3puaGwiLCJyb2xlIjoiYW5vbiJ9';

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

let allDisasters = [];

let currentFilter = 'all';


/* =====================================================
   工具
===================================================== */

function escapeHtml(value) {

  if (value === null ||
      value === undefined) {

    return '';

  }

  return String(value)

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


/* =====================================================
   災害圖示
===================================================== */

function getDisasterIcon(type) {

  const value =
    String(type || '').toLowerCase();

  if (
    value.includes('typhoon') ||
    value.includes('颱風')
  ) {
    return '🌀';
  }

  if (
    value.includes('earthquake') ||
    value.includes('地震')
  ) {
    return '🌎';
  }

  if (
    value.includes('rain') ||
    value.includes('flood') ||
    value.includes('豪雨') ||
    value.includes('洪水')
  ) {
    return '🌧️';
  }

  if (
    value.includes('tsunami') ||
    value.includes('海嘯')
  ) {
    return '🌊';
  }

  if (
    value.includes('heat') ||
    value.includes('高溫')
  ) {
    return '🔥';
  }

  if (
    value.includes('wind') ||
    value.includes('強風')
  ) {
    return '💨';
  }

  return '⚠️';
}


/* =====================================================
   類型判斷
===================================================== */

function normalizeType(type) {

  const value =
    String(type || '').toLowerCase();

  if (
    value.includes('typhoon') ||
    value.includes('颱風')
  ) {
    return 'typhoon';
  }

  if (
    value.includes('earthquake') ||
    value.includes('地震')
  ) {
    return 'earthquake';
  }

  if (
    value.includes('rain') ||
    value.includes('flood') ||
    value.includes('豪雨') ||
    value.includes('洪水')
  ) {
    return 'rain';
  }

  if (
    value.includes('tsunami') ||
    value.includes('海嘯')
  ) {
    return 'tsunami';
  }

  if (
    value.includes('heat') ||
    value.includes('高溫')
  ) {
    return 'heat';
  }

  if (
    value.includes('wind') ||
    value.includes('強風')
  ) {
    return 'wind';
  }

  return 'other';
}


/* =====================================================
   嚴重程度
===================================================== */

function normalizeSeverity(value) {

  const text =
    String(value || '').toLowerCase();

  if (
    text.includes('critical') ||
    text.includes('極高') ||
    text.includes('嚴重') ||
    text.includes('紅')
  ) {
    return {
      className: 'critical',
      label: value || '嚴重'
    };
  }

  if (
    text.includes('high') ||
    text.includes('高') ||
    text.includes('橙')
  ) {
    return {
      className: 'high',
      label: value || '高'
    };
  }

  if (
    text.includes('medium') ||
    text.includes('中') ||
    text.includes('黃')
  ) {
    return {
      className: 'medium',
      label: value || '中'
    };
  }

  return {
    className: 'low',
    label: value || '低'
  };
}


/* =====================================================
   日期
===================================================== */

function formatDate(value) {

  if (!value) {
    return '';
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return '';
  }

  return date.toLocaleString(
    'zh-TW',
    {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    }
  );
}


/* =====================================================
   取得災害資料
===================================================== */

async function loadDisasters() {

  const list =
    document.getElementById(
      'disasterList'
    );

  const status =
    document.getElementById(
      'status'
    );

  try {

    status.textContent =
      '正在取得最新災害資料…';


    const now =
      new Date().toISOString();


    const result =
      await db

        .from('disaster_data')

        .select('*')

        .eq(
          'is_active',
          true
        )

        .lte(
          'start_at',
          now
        )

        .or(
          `end_at.is.null,end_at.gte.${now}`
        )

        .order(
          'severity',
          {
            ascending: false
          }
        )

        .order(
          'start_at',
          {
            ascending: false
          }
        );


    if (result.error) {

      throw result.error;

    }


    allDisasters =
      result.data || [];


    status.textContent =
      `目前共有 ${allDisasters.length} 筆有效災害資訊`;


    renderDisasters();


  } catch (error) {

    console.error(
      '災害資料讀取失敗：',
      error
    );


    status.textContent =
      '災害資料讀取失敗';


    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div class="empty-title">
          暫時無法取得資料
        </div>

        <div class="empty-text">
          請稍後再試。
        </div>

      </div>

    `;

  }

}


/* =====================================================
   建立颱風資料
===================================================== */

function renderTyphoon(data) {

  if (
    !data.typhoon_name &&
    !data.typhoon_status &&
    data.pressure == null &&
    data.max_wind_speed == null
  ) {

    return '';

  }


  return `

    <div class="typhoon-box">

      <div class="typhoon-title">
        🌀 颱風資訊
      </div>

      <div class="info-grid">

        ${
          data.typhoon_name
            ? `
              <div class="info-item">
                <div class="info-label">
                  颱風名稱
                </div>
                <div class="info-value">
                  ${escapeHtml(data.typhoon_name)}
                </div>
              </div>
            `
            : ''
        }

        ${
          data.typhoon_status
            ? `
              <div class="info-item">
                <div class="info-label">
                  目前狀態
                </div>
                <div class="info-value">
                  ${escapeHtml(data.typhoon_status)}
                </div>
              </div>
            `
            : ''
        }

        ${
          data.pressure != null
            ? `
              <div class="info-item">
                <div class="info-label">
                  中心氣壓
                </div>
                <div class="info-value">
                  ${data.pressure} hPa
                </div>
              </div>
            `
            : ''
        }

        ${
          data.max_wind_speed != null
            ? `
              <div class="info-item">
                <div class="info-label">
                  最大風速
                </div>
                <div class="info-value">
                  ${data.max_wind_speed}
                </div>
              </div>
            `
            : ''
        }

        ${
          data.movement_direction
            ? `
              <div class="info-item">
                <div class="info-label">
                  移動方向
                </div>
                <div class="info-value">
                  ${escapeHtml(data.movement_direction)}
                </div>
              </div>
            `
            : ''
        }

        ${
          data.movement_speed != null
            ? `
              <div class="info-item">
                <div class="info-label">
                  移動速度
                </div>
                <div class="info-value">
                  ${data.movement_speed}
                </div>
              </div>
            `
            : ''
        }

      </div>

    </div>

  `;

}


/* =====================================================
   建立地震資料
===================================================== */

function renderEarthquake(data) {

  if (
    data.magnitude == null &&
    data.depth == null &&
    !data.earthquake_location &&
    !data.intensity
  ) {

    return '';

  }


  return `

    <div class="earthquake-box">

      <div class="earthquake-title">
        🌎 地震資訊
      </div>

      <div class="info-grid">

        ${
          data.magnitude != null
            ? `
              <div class="info-item">
                <div class="info-label">
                  規模
                </div>
                <div class="info-value">
                  芮氏 ${data.magnitude}
                </div>
              </div>
            `
            : ''
        }

        ${
          data.depth != null
            ? `
              <div class="info-item">
                <div class="info-label">
                  深度
                </div>
                <div class="info-value">
                  ${data.depth} km
                </div>
              </div>
            `
            : ''
        }

        ${
          data.intensity
            ? `
              <div class="info-item">
                <div class="info-label">
                  最大震度
                </div>
                <div class="info-value">
                  ${escapeHtml(data.intensity)}
                </div>
              </div>
            `
            : ''
        }

        ${
          data.earthquake_location
            ? `
              <div class="info-item">
                <div class="info-label">
                  震央位置
                </div>
                <div class="info-value">
                  ${escapeHtml(data.earthquake_location)}
                </div>
              </div>
            `
            : ''
        }

      </div>

    </div>

  `;

}


/* =====================================================
   建立一般災害詳細資料
===================================================== */

function renderExtraInfo(data) {

  const type =
    normalizeType(
      data.disaster_type
    );


  if (
    type !== 'rain' &&
    data.rainfall == null &&
    data.rain_probability == null
  ) {

    return '';

  }


  if (
    data.rainfall == null &&
    data.rain_probability == null
  ) {

    return '';

  }


  return `

    <div class="info-grid">

      ${
        data.rainfall != null
          ? `
            <div class="info-item">
              <div class="info-label">
                累積雨量
              </div>
              <div class="info-value">
                ${data.rainfall} mm
              </div>
            </div>
          `
          : ''
      }

      ${
        data.rain_probability != null
          ? `
            <div class="info-item">
              <div class="info-label">
                降雨機率
              </div>
              <div class="info-value">
                ${data.rain_probability}%
              </div>
            </div>
          `
          : ''
      }

    </div>

  `;

}


/* =====================================================
   建立卡片
===================================================== */

function createCard(data) {

  const type =
    normalizeType(
      data.disaster_type
    );


  const severity =
    normalizeSeverity(
      data.severity
    );


  const icon =
    getDisasterIcon(
      data.disaster_type
    );


  let detail = '';


  if (
    type === 'typhoon'
  ) {

    detail =
      renderTyphoon(data);

  }


  if (
    type === 'earthquake'
  ) {

    detail =
      renderEarthquake(data);

  }


  if (
    type === 'rain'
  ) {

    detail =
      renderExtraInfo(data);

  }


  const location =
    data.region ||
    data.earthquake_location ||
    '未提供地區';


  return `

    <article
      class="
        disaster-card
        ${severity.className}
      "
    >

      <div class="card-header">

        <div class="disaster-icon">
          ${icon}
        </div>

        <div class="card-main">

          <div class="card-title">
            ${escapeHtml(
              data.title ||
              '災害通知'
            )}
          </div>

          <div class="card-type">
            ${escapeHtml(
              data.disaster_type ||
              '其他災害'
            )}
          </div>

          <span
            class="
              severity
              severity-${severity.className}
            "
          >
            ${escapeHtml(
              severity.label
            )}
          </span>

        </div>

      </div>


      ${
        data.description
          ? `
            <div class="description">
              ${escapeHtml(
                data.description
              ).replace(
                /\n/g,
                '<br>'
              )}
            </div>
          `
          : ''
      }


      <div class="location">
        📍 ${escapeHtml(location)}
      </div>


      ${detail}


      <div class="card-footer">

        <div class="source">

          ${
            data.source
              ? `
                資料來源：
                ${escapeHtml(data.source)}
              `
              : '安全團聚災害資料庫'
          }

          <br>

          ${
            data.start_at
              ? `
                發布：
                ${formatDate(data.start_at)}
              `
              : ''
          }

        </div>


        ${
          data.source_url
            ? `
              <a
                class="source-link"
                href="${escapeHtml(
                  data.source_url
                )}"
                target="_blank"
                rel="noopener noreferrer"
              >
                官方來源 →
              </a>
            `
            : ''
        }

      </div>

    </article>

  `;

}


/* =====================================================
   顯示資料
===================================================== */

function renderDisasters() {

  const list =
    document.getElementById(
      'disasterList'
    );


  let filtered =
    allDisasters;


  if (
    currentFilter !== 'all'
  ) {

    filtered =
      allDisasters.filter(
        function(data) {

          return (
            normalizeType(
              data.disaster_type
            ) ===
            currentFilter
          );

        }
      );

  }


  if (!filtered.length) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛡️
        </div>

        <div class="empty-title">
          目前沒有災害警報
        </div>

        <div class="empty-text">
          目前沒有符合條件的有效災害資訊。
        </div>

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(createCard)
      .join('');

}


/* =====================================================
   篩選按鈕
===================================================== */

document
  .querySelectorAll(
    '.filter-btn'
  )
  .forEach(
    function(button) {

      button.addEventListener(
        'click',
        function() {

          document
            .querySelectorAll(
              '.filter-btn'
            )
            .forEach(
              function(item) {

                item.classList.remove(
                  'active'
                );

              }
            );


          button.classList.add(
            'active'
          );


          currentFilter =
            button.dataset.type;


          renderDisasters();

        }
      );

    }
  );


/* =====================================================
   即時更新
===================================================== */

async function refreshDisasters() {

  await loadDisasters();

}


/* =====================================================
   啟動
===================================================== */

loadDisasters();


/*
 * 每 60 秒重新取得一次資料
 */

setInterval(
  refreshDisasters,
  60000
);

</script>

</body>
</html>
