<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>災害資訊 - 安全團聚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

  background: #f5f5f5;
  color: #111;

  min-height: 100vh;

  padding-bottom: 72px;
}

/* =========================
   HEADER
========================= */

.header {
  height: 58px;

  background: #06C755;
  color: white;

  display: flex;
  align-items: center;

  padding: 0 12px;

  position: sticky;
  top: 0;

  z-index: 100;
}

.header-btn {
  width: 38px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  text-decoration: none;

  font-size: 21px;

  border-radius: 50%;

  border: none;
  background: transparent;

  cursor: pointer;
}

.header-btn:active {
  background: rgba(255,255,255,.18);
  transform: scale(.94);
}

.header-title {
  flex: 1;

  text-align: center;

  font-size: 18px;
  font-weight: 700;
}

.header-spacer {
  width: 38px;
}

/* =========================
   INTRO
========================= */

.intro {
  background: white;

  margin: 12px;

  padding: 15px;

  border-radius: 14px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.06);
}

.intro-title {
  font-size: 16px;
  font-weight: 700;

  margin-bottom: 5px;
}

.intro-text {
  font-size: 13px;

  color: #777;

  line-height: 1.5;
}

/* =========================
   FILTER
========================= */

.filter-wrap {
  padding: 0 12px 12px;
}

.filter {
  display: flex;

  gap: 8px;

  overflow-x: auto;

  scrollbar-width: none;
}

.filter::-webkit-scrollbar {
  display: none;
}

.filter-btn {
  flex-shrink: 0;

  border: none;

  background: white;

  color: #666;

  padding: 9px 14px;

  border-radius: 20px;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;

  box-shadow:
    0 1px 5px rgba(0,0,0,.05);
}

.filter-btn.active {
  background: #06C755;
  color: white;
}

/* =========================
   STATUS
========================= */

.status-card {
  margin: 0 12px 12px;

  background: white;

  border-radius: 12px;

  padding: 11px 13px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  box-shadow:
    0 1px 6px rgba(0,0,0,.05);
}

.status-left {
  display: flex;

  align-items: center;

  gap: 7px;

  font-size: 12px;

  color: #777;
}

.status-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #06C755;
}

.status-dot.loading {
  background: #f39c12;
}

.status-dot.error {
  background: #e53935;
}

.refresh-btn {
  border: none;

  background: #f1f1f1;

  border-radius: 8px;

  padding: 7px 10px;

  font-size: 12px;

  cursor: pointer;
}

/* =========================
   LIST
========================= */

.disaster-list {
  padding: 0 12px;
}

/* =========================
   CARD
========================= */

.disaster-card {
  background: white;

  border-radius: 15px;

  margin-bottom: 12px;

  padding: 16px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.06);

  border-left: 5px solid #999;
}

.disaster-card.critical {
  border-left-color: #d32f2f;
}

.disaster-card.high {
  border-left-color: #f57c00;
}

.disaster-card.medium {
  border-left-color: #fbc02d;
}

.disaster-card.low {
  border-left-color: #388e3c;
}

/* =========================
   CARD HEADER
========================= */

.card-header {
  display: flex;

  align-items: flex-start;

  gap: 10px;
}

.disaster-icon {
  width: 46px;
  height: 46px;

  border-radius: 13px;

  background: #f1f1f1;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 25px;

  flex-shrink: 0;
}

.card-main {
  flex: 1;

  min-width: 0;
}

.card-title {
  font-size: 16px;

  font-weight: 700;

  line-height: 1.35;

  color: #222;
}

.card-type {
  font-size: 12px;

  color: #888;

  margin-top: 4px;
}

/* =========================
   SEVERITY
========================= */

.severity {
  display: inline-block;

  margin-top: 8px;

  padding: 4px 8px;

  border-radius: 7px;

  font-size: 11px;

  font-weight: 700;
}

.severity-critical {
  background: #ffebee;
  color: #c62828;
}

.severity-high {
  background: #fff3e0;
  color: #ef6c00;
}

.severity-medium {
  background: #fffde7;
  color: #827717;
}

.severity-low {
  background: #e8f5e9;
  color: #2e7d32;
}

/* =========================
   DESCRIPTION
========================= */

.description {
  margin-top: 12px;

  font-size: 13px;

  line-height: 1.6;

  color: #555;

  white-space: pre-wrap;
}

/* =========================
   LOCATION
========================= */

.location {
  margin-top: 12px;

  background: #f7f7f7;

  border-radius: 10px;

  padding: 10px 12px;

  font-size: 12px;

  color: #555;

  line-height: 1.5;
}

/* =========================
   INFO
========================= */

.info-grid {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 8px;

  margin-top: 10px;
}

.info-item {
  background: #f7f7f7;

  border-radius: 9px;

  padding: 9px;
}

.info-label {
  font-size: 10px;

  color: #999;

  margin-bottom: 3px;
}

.info-value {
  font-size: 13px;

  font-weight: 700;

  color: #333;

  word-break: break-word;
}

/* =========================
   TYPHOON
========================= */

.detail-box {
  margin-top: 12px;

  border-radius: 11px;

  padding: 12px;
}

.typhoon-box {
  background: #eef7ff;
}

.earthquake-box {
  background: #fff5f5;
}

.rain-box {
  background: #f0fff5;
}

.detail-title {
  font-size: 13px;

  font-weight: 700;

  margin-bottom: 8px;
}

.typhoon-title {
  color: #1565c0;
}

.earthquake-title {
  color: #c62828;
}

.rain-title {
  color: #2e7d32;
}

/* =========================
   FOOTER
========================= */

.card-footer {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  margin-top: 14px;

  padding-top: 12px;

  border-top: 1px solid #eee;
}

.source {
  font-size: 11px;

  color: #999;

  line-height: 1.5;

  min-width: 0;
}

.source-link {
  flex-shrink: 0;

  color: #06C755;

  font-size: 12px;

  font-weight: 700;

  text-decoration: none;
}

/* =========================
   EMPTY
========================= */

.empty {
  background: white;

  border-radius: 14px;

  padding: 38px 20px;

  text-align: center;

  color: #888;
}

.empty-icon {
  font-size: 42px;

  margin-bottom: 10px;
}

.empty-title {
  font-size: 16px;

  font-weight: 700;

  color: #444;

  margin-bottom: 6px;
}

.empty-text {
  font-size: 13px;

  line-height: 1.5;
}

/* =========================
   LOADING
========================= */

.loading {
  text-align: center;

  padding: 35px 20px;

  color: #888;

  font-size: 13px;
}

/* =========================
   VOICE
========================= */

.voice-hint {
  position: fixed;

  left: 50%;

  bottom: 70px;

  transform:
    translateX(-50%);

  background:
    rgba(0,0,0,.82);

  color: white;

  padding: 9px 14px;

  border-radius: 20px;

  font-size: 12px;

  display: none;

  z-index: 300;

  white-space: nowrap;
}

.voice-hint.show {
  display: block;
}

/* =========================
   BOTTOM NAV
========================= */

.tabbar {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 58px;

  background: white;

  border-top:
    1px solid #e8e8e8;

  display: flex;

  z-index: 200;
}

.tab {
  flex: 1;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-decoration: none;

  color: #888;

  font-size: 11px;
}

.tab .ico {
  font-size: 20px;

  line-height: 1.2;
}

.tab.active {
  color: #06C755;

  font-weight: 700;
}

</style>
</head>

<script>

(function () {

"use strict";


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  'https://perfsipperncvjocznhl.supabase.co';


/*
 * 兩個災害頁面必須使用同一把 publishable key。
 *
 * 不使用第二份程式裡面那個錯誤的 JWT。
 */

const SUPABASE_KEY =
  'sb_publishable_qpqAwj49L6HcWqWTnNsTxw_oBEauWBA';


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

let allDisasters = [];

let currentFilter = 'all';


/* =====================================================
   DOM
===================================================== */

const list =
  document.getElementById(
    'disasterList'
  );

const status =
  document.getElementById(
    'status'
  );

const statusDot =
  document.getElementById(
    'statusDot'
  );

const refreshBtn =
  document.getElementById(
    'refreshBtn'
  );

const voiceBtn =
  document.getElementById(
    'voiceBtn'
  );

const voiceHint =
  document.getElementById(
    'voiceHint'
  );


/* =====================================================
   HTML 安全
===================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }

  return String(value)

    .replace(/&/g, '&amp;')

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   類型
===================================================== */

function normalizeType(type) {

  const value =
    String(type || '')
      .toLowerCase()
      .trim();


  if (
    value.includes('typhoon') ||
    value.includes('颱風')
  ) {

    return 'typhoon';

  }


  if (
    value.includes('earthquake') ||
    value.includes('地震')
  ) {

    return 'earthquake';

  }


  if (
    value.includes('rain') ||
    value.includes('flood') ||
    value.includes('豪雨') ||
    value.includes('大雨') ||
    value.includes('洪水')
  ) {

    return 'rain';

  }


  if (
    value.includes('tsunami') ||
    value.includes('海嘯')
  ) {

    return 'tsunami';

  }


  if (
    value.includes('heat') ||
    value.includes('高溫')
  ) {

    return 'heat';

  }


  if (
    value.includes('wind') ||
    value.includes('強風')
  ) {

    return 'wind';

  }


  return 'other';

}


/* =====================================================
   類型名稱
===================================================== */

function getTypeName(type) {

  const normalized =
    normalizeType(type);


  const names = {

    typhoon: '颱風',

    earthquake: '地震',

    rain: '豪雨',

    tsunami: '海嘯',

    heat: '高溫',

    wind: '強風',

    other: '其他災害'

  };


  return (
    names[normalized] ||
    '其他災害'
  );

}


/* =====================================================
   圖示
===================================================== */

function getIcon(type) {

  const icons = {

    typhoon: '🌀',

    earthquake: '🌎',

    rain: '🌧️',

    tsunami: '🌊',

    heat: '🔥',

    wind: '💨',

    other: '⚠️'

  };


  return (
    icons[
      normalizeType(type)
    ] ||
    '⚠️'
  );

}


/* =====================================================
   嚴重程度
===================================================== */

function normalizeSeverity(value) {

  const text =
    String(value || '')
      .toLowerCase()
      .trim();


  if (
    text.includes('critical') ||
    text.includes('極高') ||
    text.includes('極嚴重') ||
    text.includes('嚴重') ||
    text.includes('紅')
  ) {

    return {

      className: 'critical',

      label:
        value ||
        '嚴重'

    };

  }


  if (
    text.includes('high') ||
    text.includes('高') ||
    text.includes('橙')
  ) {

    return {

      className: 'high',

      label:
        value ||
        '高'

    };

  }


  if (
    text.includes('medium') ||
    text.includes('中') ||
    text.includes('黃')
  ) {

    return {

      className: 'medium',

      label:
        value ||
        '中'

    };

  }


  return {

    className: 'low',

    label:
      value ||
      '一般'

  };

}


/* =====================================================
   日期
===================================================== */

function formatDate(value) {

  if (!value) {

    return '--';

  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return '--';

  }


  return date.toLocaleString(
    'zh-TW',
    {

      year: 'numeric',

      month: '2-digit',

      day: '2-digit',

      hour: '2-digit',

      minute: '2-digit'

    }
  );

}


/* =====================================================
   INFO ITEM
===================================================== */

function infoItem(
  label,
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '';

  }


  return `

    <div class="info-item">

      <div class="info-label">
        ${escapeHtml(label)}
      </div>

      <div class="info-value">
        ${escapeHtml(value)}
      </div>

    </div>

  `;

}


/* =====================================================
   颱風
===================================================== */

function renderTyphoon(data) {

  const hasData =

    data.typhoon_name ||

    data.typhoon_status ||

    data.pressure != null ||

    data.max_wind_speed != null ||

    data.movement_direction ||

    data.movement_speed != null;


  if (!hasData) {

    return '';

  }


  return `

    <div class="detail-box typhoon-box">

      <div class="detail-title typhoon-title">
        🌀 颱風資訊
      </div>

      <div class="info-grid">

        ${infoItem(
          '颱風名稱',
          data.typhoon_name
        )}

        ${infoItem(
          '目前狀態',
          data.typhoon_status
        )}

        ${infoItem(
          '中心氣壓',
          data.pressure != null
            ? data.pressure + ' hPa'
            : null
        )}

        ${infoItem(
          '最大風速',
          data.max_wind_speed
        )}

        ${infoItem(
          '移動方向',
          data.movement_direction
        )}

        ${infoItem(
          '移動速度',
          data.movement_speed
        )}

      </div>

    </div>

  `;

}


/* =====================================================
   地震
===================================================== */

function renderEarthquake(data) {

  const hasData =

    data.magnitude != null ||

    data.depth != null ||

    data.earthquake_location ||

    data.intensity;


  if (!hasData) {

    return '';

  }


  return `

    <div class="detail-box earthquake-box">

      <div class="detail-title earthquake-title">
        🌎 地震資訊
      </div>

      <div class="info-grid">

        ${infoItem(
          '規模',
          data.magnitude != null
            ? '芮氏 ' +
              data.magnitude
            : null
        )}

        ${infoItem(
          '深度',
          data.depth != null
            ? data.depth + ' km'
            : null
        )}

        ${infoItem(
          '最大震度',
          data.intensity
        )}

        ${infoItem(
          '震央位置',
          data.earthquake_location
        )}

      </div>

    </div>

  `;

}


/* =====================================================
   豪雨
===================================================== */

function renderRain(data) {

  const hasData =

    data.rainfall != null ||

    data.rain_probability != null;


  if (!hasData) {

    return '';

  }


  return `

    <div class="detail-box rain-box">

      <div class="detail-title rain-title">
        🌧️ 降雨資訊
      </div>

      <div class="info-grid">

        ${infoItem(
          '累積雨量',
          data.rainfall != null
            ? data.rainfall + ' mm'
            : null
        )}

        ${infoItem(
          '降雨機率',
          data.rain_probability != null
            ? data.rain_probability + '%'
            : null
        )}

      </div>

    </div>

  `;

}


/* =====================================================
   一般資料
===================================================== */

function renderGeneralInfo(data) {

  const items = [];


  if (
    data.alert_level
  ) {

    items.push(
      infoItem(
        '警戒',
        data.alert_level
      )
    );

  }


  if (
    data.latitude != null
  ) {

    items.push(
      infoItem(
        '緯度',
        Number(
          data.latitude
        ).toFixed(4)
      )
    );

  }


  if (
    data.longitude != null
  ) {

    items.push(
      infoItem(
        '經度',
        Number(
          data.longitude
        ).toFixed(4)
      )
    );

  }


  if (
    !items.length
  ) {

    return '';

  }


  return `

    <div class="info-grid">

      ${items.join('')}

    </div>

  `;

}


/* =====================================================
   建立卡片
===================================================== */

function createCard(data) {

  const type =
    normalizeType(
      data.disaster_type
    );


  const severity =
    normalizeSeverity(
      data.severity
    );


  const icon =
    getIcon(
      data.disaster_type
    );


  let details = '';


  if (
    type === 'typhoon'
  ) {

    details +=
      renderTyphoon(data);

  }


  if (
    type === 'earthquake'
  ) {

    details +=
      renderEarthquake(data);

  }


  if (
    type === 'rain'
  ) {

    details +=
      renderRain(data);

  }


  details +=
    renderGeneralInfo(data);


  const location =

    data.region ||

    data.earthquake_location ||

    '未提供地區';


  return `

    <article
      class="
        disaster-card
        ${severity.className}
      "
    >

      <div class="card-header">

        <div class="disaster-icon">
          ${icon}
        </div>

        <div class="card-main">

          <div class="card-title">
            ${escapeHtml(
              data.title ||
              '災害通知'
            )}
          </div>

          <div class="card-type">
            ${escapeHtml(
              getTypeName(
                data.disaster_type
              )
            )}
          </div>

          <span
            class="
              severity
              severity-${severity.className}
            "
          >
            ${escapeHtml(
              severity.label
            )}
          </span>

        </div>

      </div>


      ${
        data.description
          ? `
            <div class="description">
              ${escapeHtml(
                data.description
              )}
            </div>
          `
          : ''
      }


      <div class="location">
        📍 ${escapeHtml(location)}
      </div>


      ${details}


      <div class="info-grid">

        ${infoItem(
          '開始時間',
          formatDate(
            data.start_at
          )
        )}

        ${infoItem(
          '結束時間',
          formatDate(
            data.end_at
          )
        )}

      </div>


      <div class="card-footer">

        <div class="source">

          ${
            data.source
              ? '資料來源：' +
                escapeHtml(
                  data.source
                )
              : '安全團聚災害資料庫'
          }

        </div>


        ${
          data.source_url
            ? `
              <a
                class="source-link"
                href="${escapeHtml(
                  data.source_url
                )}"
                target="_blank"
                rel="noopener noreferrer"
              >
                官方來源 →
              </a>
            `
            : ''
        }

      </div>

    </article>

  `;

}


/* =====================================================
   顯示
===================================================== */

function renderDisasters() {

  if (!list) {

    return;

  }


  let filtered =
    allDisasters;


  if (
    currentFilter !== 'all'
  ) {

    filtered =
      allDisasters.filter(
        function(item) {

          return (

            normalizeType(
              item.disaster_type
            ) ===

            currentFilter

          );

        }
      );

  }


  if (
    !filtered.length
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛡️
        </div>

        <div class="empty-title">
          目前沒有災害警報
        </div>

        <div class="empty-text">
          目前沒有符合條件的有效災害資訊。
        </div>

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(
        createCard
      )
      .join('');

}


/* =====================================================
   狀態
===================================================== */

function setStatus(
  type,
  text
) {

  if (status) {

    status.textContent =
      text;

  }


  if (statusDot) {

    statusDot.classList.remove(
      'loading',
      'error'
    );


    if (
      type === 'loading'
    ) {

      statusDot.classList.add(
        'loading'
      );

    }


    if (
      type === 'error'
    ) {

      statusDot.classList.add(
        'error'
      );

    }

  }

}


/* =====================================================
   從 Supabase 讀取
===================================================== */

async function loadDisasters() {

  setStatus(
    'loading',
    '正在取得最新災害資料…'
  );


  list.innerHTML = `

    <div class="loading">
      正在讀取災害資料…
    </div>

  `;


  try {

    const now =
      new Date().toISOString();


    const result =
      await db

        .from('disaster_data')

        .select('*')

        .eq(
          'is_active',
          true
        )

        .lte(
          'start_at',
          now
        )

        .or(
          'end_at.is.null,end_at.gte.' +
          now
        )

        .order(
          'start_at',
          {
            ascending: false
          }
        );


    if (
      result.error
    ) {

      throw result.error;

    }


    allDisasters =
      result.data || [];


    renderDisasters();


    setStatus(
      'ok',
      allDisasters.length
        ? '目前有 ' +
          allDisasters.length +
          ' 筆有效災害資訊'
        : '目前沒有有效災害資訊'
    );


  } catch (error) {

    console.error(
      'disaster_data 讀取失敗：',
      error
    );


    allDisasters = [];


    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div class="empty-title">
          災害資料讀取失敗
        </div>

        <div class="empty-text">

          無法從災害資料庫取得資料。

          <br><br>

          ${escapeHtml(
            error.message ||
            '未知錯誤'
          )}

        </div>

      </div>

    `;


    setStatus(
      'error',
      '資料讀取失敗'
    );

  }

}


/* =====================================================
   篩選
===================================================== */

document
  .querySelectorAll(
    '.filter-btn'
  )
  .forEach(
    function(button) {

      button.addEventListener(
        'click',
        function() {

          currentFilter =
            button.dataset.type ||
            'all';


          document
            .querySelectorAll(
              '.filter-btn'
            )
            .forEach(
              function(item) {

                item.classList.toggle(
                  'active',
                  (
                    item.dataset.type ||
                    'all'
                  ) ===
                  currentFilter
                );

              }
            );


          renderDisasters();

        }
      );

    }
  );


/* =====================================================
   更新
===================================================== */

if (refreshBtn) {

  refreshBtn.addEventListener(
    'click',
    loadDisasters
  );

}


/* =====================================================
   語音提示
===================================================== */

function showVoiceHint() {

  if (!voiceHint) {

    return;

  }


  voiceHint.classList.add(
    'show'
  );


  setTimeout(
    function() {

      voiceHint.classList.remove(
        'show'
      );

    },
    3500
  );

}


/* =====================================================
   語音命令
===================================================== */

function handleVoiceCommand(
  text
) {

  const command =
    String(text || '')
      .trim()
      .toLowerCase();


  if (
    command.includes('更新') ||
    command.includes('重新整理') ||
    command.includes('刷新')
  ) {

    loadDisasters();

    return;

  }


  let filter = null;


  if (
    command.includes('颱風')
  ) {

    filter = 'typhoon';

  }

  else if (
    command.includes('地震')
  ) {

    filter = 'earthquake';

  }

  else if (
    command.includes('豪雨') ||
    command.includes('大雨') ||
    command.includes('洪水')
  ) {

    filter = 'rain';

  }

  else if (
    command.includes('海嘯')
  ) {

    filter = 'tsunami';

  }

  else if (
    command.includes('高溫')
  ) {

    filter = 'heat';

  }

  else if (
    command.includes('強風')
  ) {

    filter = 'wind';

  }

  else if (
    command.includes('其他')
  ) {

    filter = 'other';

  }

  else if (
    command.includes('全部')
  ) {

    filter = 'all';

  }


  if (
    filter === null
  ) {

    return;

  }


  currentFilter =
    filter;


  document
    .querySelectorAll(
      '.filter-btn'
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          'active',
          (
            button.dataset.type ||
            'all'
          ) ===
          currentFilter
        );

      }
    );


  renderDisasters();

}


/* =====================================================
   Web Speech
===================================================== */

let recognition = null;


if (
  'webkitSpeechRecognition' in window
) {

  recognition =
    new webkitSpeechRecognition();


  recognition.lang =
    'zh-TW';


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onresult =
    function(event) {

      const transcript =
        event
          .results[0][0]
          .transcript;


      handleVoiceCommand(
        transcript
      );

    };


  recognition.onerror =
    function(error) {

      console.log(
        '語音辨識：',
        error
      );

    };

}


/* =====================================================
   語音按鈕
===================================================== */

if (voiceBtn) {

  voiceBtn.addEventListener(
    'click',
    function() {

      if (!recognition) {

        alert(
          '此裝置目前不支援網頁語音辨識。'
        );

        return;

      }


      try {

        showVoiceHint();

        recognition.start();

      } catch (error) {

        console.log(
          '語音啟動：',
          error
        );

      }

    }
  );

}


/* =====================================================
   啟動
===================================================== */

loadDisasters();


/* =====================================================
   每 60 秒自動更新
===================================================== */

setInterval(
  loadDisasters,
  60 * 1000
);


/* =====================================================
   首次語音提示
===================================================== */

setTimeout(
  showVoiceHint,
  1500
);

})();

</script>

</body>
</html>
