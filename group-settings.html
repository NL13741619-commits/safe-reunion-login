<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>群組設定 - 安全團聚</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    .top {
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 17px;
      font-weight: 700;
    }

    .back {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      font-size: 26px;
      cursor: pointer;
    }

    .card {
      background: #fff;
      margin-top: 12px;
      padding: 24px 16px;
    }

    .avatar-box {
      text-align: center;
      margin-bottom: 25px;
    }

    .group-avatar {
      width: 90px;
      height: 90px;
      border-radius: 18px;
      background: #06C755;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      overflow: hidden;
      cursor: pointer;
    }

    .group-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-tip {
      margin-top: 8px;
      color: #888;
      font-size: 13px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #777;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    .field input:focus {
      border-color: #06C755;
    }

    .save {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #06C755;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .save:disabled {
      background: #aaa;
    }

    .status {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 15px;
      min-height: 45px;
    }

    #avatarFile {
      display: none;
    }
  </style>
</head>

<body>

  <div class="top">
    <button class="back" id="btnBack">‹</button>
    群組設定
  </div>

  <div class="card">

    <div class="avatar-box">
      <label for="avatarFile">
        <div class="group-avatar" id="groupAvatar">
          群
        </div>
      </label>

      <div class="avatar-tip">
        點擊頭像修改
      </div>

      <input
        type="file"
        id="avatarFile"
        accept="image/*"
      >
    </div>

    <div class="field">
      <label>群組名稱</label>
      <input
        id="groupName"
        type="text"
        maxlength="50"
        placeholder="輸入群組名稱"
      >
    </div>

    <button
      class="save"
      id="btnSave"
      type="button"
    >
      儲存修改
    </button>

    <div class="status" id="status"></div>

  </div>

<script>

(function () {

  var SUPABASE_URL = 'https://perfsipperncvjocznhl.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';  var supabase = null;
  var me = null;
  var groupId = null;
  var groupData = null;

  function $(id) {
    return document.getElementById(id);
  }

  function setStatus(text) {
    $('status').textContent = text;
  }

  async function boot() {

    if (!window.supabase) {
      setStatus('Supabase 載入失敗');
      return;
    }

    try {

      supabase =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      var sessionResult =
        await supabase.auth.getSession();

      if (!sessionResult.data.session) {
        location.href = 'login.html';
        return;
      }

      me = sessionResult.data.session.user;

      var params =
        new URLSearchParams(location.search);

      groupId = params.get('id');

      if (!groupId) {
        setStatus('找不到群組 ID');
        return;
      }

      setStatus('載入群組資料…');

      var result =
        await supabase
          .from('chat_groups')
          .select('*')
          .eq('id', groupId)
          .maybeSingle();

      if (result.error) {
        setStatus(
          '讀取失敗：' +
          result.error.message
        );
        return;
      }

      if (!result.data) {
        setStatus('找不到這個群組');
        return;
      }

      groupData = result.data;

      $('groupName').value =
        groupData.name || '';

      if (groupData.avatar_url) {

        $('groupAvatar').innerHTML =
          '<img src="' +
          groupData.avatar_url +
          '" alt="">';

      } else {

        $('groupAvatar').textContent = '群';

      }

      setStatus('');

    } catch (e) {

      setStatus(
        '錯誤：' +
        (e.message || e)
      );

    }

  }


  $('btnBack').onclick = function () {

    history.back();

  };


  $('btnSave').onclick = async function () {

    var name =
      $('groupName').value.trim();

    if (!name) {

      setStatus('請輸入群組名稱');

      return;

    }

    $('btnSave').disabled = true;

    setStatus('儲存中…');

    try {

      var result =
        await supabase
          .from('chat_groups')
          .update({
            name: name
          })
          .eq('id', groupId);

      if (result.error) {

        setStatus(
          '修改失敗：' +
          result.error.message
        );

        $('btnSave').disabled = false;

        return;

      }

      setStatus('群組名稱修改成功');

    } catch (e) {

      setStatus(
        '錯誤：' +
        (e.message || e)
      );

    }

    $('btnSave').disabled = false;

  };


  /*
   * 頭像目前先做「選取圖片預覽」。
   * 下一步再接 Supabase Storage，
   * 避免一次改太多造成問題。
   */

  $('avatarFile').onchange = function () {

    var file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith('image/')) {

      setStatus('請選擇圖片');

      return;

    }

    var reader =
      new FileReader();

    reader.onload = function (e) {

      $('groupAvatar').innerHTML =
        '<img src="' +
        e.target.result +
        '" alt="">';

      setStatus(
        '圖片已選取，按「儲存修改」後再正式上傳'
      );

    };

    reader.readAsDataURL(file);

  };


  boot();

})();

</script>

</body>
</html>
