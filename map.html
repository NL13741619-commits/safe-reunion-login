/* =========================================================

function setSub(text) {

/* =========================================================
   6. 基本計算
========================================================= */

function distanceMeters(
  lat1,
  lng1,
  lat2,
  lng2
) {

  var R = 6371000;

  var p1 =
    lat1 * Math.PI / 180;

  var p2 =
    lat2 * Math.PI / 180;

  var dp =
    (lat2 - lat1)
    * Math.PI / 180;

  var dl =
    (lng2 - lng1)
    * Math.PI / 180;

  var a =
    Math.sin(dp / 2) *
    Math.sin(dp / 2)
    +
    Math.cos(p1)
    *
    Math.cos(p2)
    *
    Math.sin(dl / 2)
    *
    Math.sin(dl / 2);

  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}


function bearingDegrees(
  lat1,
  lng1,
  lat2,
  lng2
) {

  var p1 =
    lat1 * Math.PI / 180;

  var p2 =
    lat2 * Math.PI / 180;

  var dl =
    (lng2 - lng1)
    * Math.PI / 180;

  var y =
    Math.sin(dl)
    *
    Math.cos(p2);

  var x =
    Math.cos(p1)
    *
    Math.sin(p2)
    -
    Math.sin(p1)
    *
    Math.cos(p2)
    *
    Math.cos(dl);

  return (
    Math.atan2(y, x)
    * 180 / Math.PI
    + 360
  ) % 360;

}


function angleDifference(
  a,
  b
) {

  return Math.abs(
    ((a - b + 540) % 360)
    - 180
  );

}


function formatDistance(
  meters
) {

  if (
    meters < 1000
  ) {

    return (
      Math.round(meters)
      +
      ' m'
    );

  }

  return (
    (meters / 1000)
      .toFixed(1)
    +
    ' km'
  );

}


/* =========================================================
   7. 速度
========================================================= */

function getSpeed(
  position
) {

  var gpsSpeed =
    position.coords.speed;

  if (
    Number.isFinite(
      gpsSpeed
    )
    &&
    gpsSpeed >= 0
  ) {

    return gpsSpeed * 3.6;

  }


  if (
    !lastPosition
  ) {

    return 0;

  }


  var dt =
    (
      position.timestamp
      -
      lastPosition.timestamp
    ) / 1000;


  if (
    dt <= 0
  ) {

    return 0;

  }


  var d =
    distanceMeters(

      lastPosition.coords.latitude,

      lastPosition.coords.longitude,

      position.coords.latitude,

      position.coords.longitude

    );


  return (
    d / dt
  ) * 3.6;

}


/* =========================================================
   8. 方向
========================================================= */

function getHeading(
  position
) {

  var heading =
    position.coords.heading;

  if (
    Number.isFinite(
      heading
    )
    &&
    heading >= 0
  ) {

    return heading;

  }


  if (
    lastPosition
  ) {

    var moved =
      distanceMeters(

        lastPosition.coords.latitude,

        lastPosition.coords.longitude,

        position.coords.latitude,

        position.coords.longitude

      );


    if (
      moved >= 3
    ) {

      return bearingDegrees(

        lastPosition.coords.latitude,

        lastPosition.coords.longitude,

        position.coords.latitude,

        position.coords.longitude

      );

    }

  }


  return lastHeading;

}


/* =========================================================
   9. 使用者 Marker
========================================================= */

function updateMyMarker(
  accuracy
) {

  if (
    myLat == null
  ) {

    return;

  }


  if (
    myMarker
  ) {

    myMarker.setLatLng([
      myLat,
      myLng
    ]);

  }

  else {

    myMarker =
      L.circleMarker(

        [
          myLat,
          myLng
        ],

        {

          radius: 8,

          color: '#06C755',

          fillColor: '#06C755',

          fillOpacity: .95

        }

      ).addTo(map);

    myMarker.bindPopup(
      '我的位置'
    );

  }


  if (
    Number.isFinite(
      accuracy
    )
  ) {

    if (
      !accuracyCircle
    ) {

      accuracyCircle =
        L.circle(

          [
            myLat,
            myLng
          ],

          {

            radius: accuracy,

            weight: 1,

            fillOpacity: .05

          }

        ).addTo(map);

    }

    else {

      accuracyCircle.setLatLng([
        myLat,
        myLng
      ]);

      accuracyCircle.setRadius(
        accuracy
      );

    }

  }

}


/* =========================================================
   10. GPS
========================================================= */

function onPosition(
  position
) {

  myLat =
    position.coords.latitude;

  myLng =
    position.coords.longitude;

  currentSpeed =
    Math.max(
      0,
      getSpeed(position)
    );


  var heading =
    getHeading(position);


  if (
    Number.isFinite(
      heading
    )
  ) {

    lastHeading =
      heading;

  }


  updateMyMarker(
    position.coords.accuracy
  );


  document.getElementById(
    'navSpeed'
  ).textContent =
    Math.round(
      currentSpeed
    );


  document.getElementById(
    'navHeading'
  ).textContent =
    Number.isFinite(
      lastHeading
    )
      ? Math.round(
          lastHeading
        )
      : '--';


  setSub(
    '定位中｜'
    +
    Math.round(
      currentSpeed
    )
    +
    ' km/h'
  );


  if (
    navigationActive
  ) {

    updateNavigation();

  }


  checkSpeedCamera();


  uploadLocation();


  lastPosition =
    position;

}


/* =========================================================
   11. 定位分享
========================================================= */

function geoErrorText(
  err
) {

  if (!err) {

    return '未知錯誤';

  }

  if (
    err.code === 1
  ) {

    return '定位權限被拒絕';

  }

  if (
    err.code === 2
  ) {

    return '目前無法取得位置';

  }

  if (
    err.code === 3
  ) {

    return '定位逾時';

  }

  return (
    err.message
    ||
    String(err)
  );

}


function startShare() {

  if (
    !navigator.geolocation
  ) {

    alert(
      '此裝置不支援定位'
    );

    return;

  }


  shareOn = true;


  document.getElementById(
    'btnShare'
  ).textContent =
    '關閉定位';


  document.getElementById(
    'btnShare'
  ).className =
    'btn btn-red';


  setShareStatus(
    '定位：開啟中…'
  );


  navigator.geolocation.getCurrentPosition(

    function (pos) {

      onPosition(pos);

      map.setView(
        [
          myLat,
          myLng
        ],
        16
      );

      setShareStatus(
        '定位：開啟'
      );

    },

    function (err) {

      stopShare();

      alert(
        '定位失敗：'
        +
        geoErrorText(err)
      );

    },

    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );


  watchId =
    navigator.geolocation.watchPosition(

      onPosition,

      function (err) {

        setSub(

/* =========================================================
   16. 測速方向
========================================================= */

function directionMatches(
  direct,
  heading
) {

  if (
    !Number.isFinite(
      heading
    )
  ) {

    return true;

  }


  var text =
    String(
      direct
      ||
      ''
    );


  if (
    text.includes('南北')
  ) {

    return (
      Math.min(
        angleDifference(
          heading,
          0
        ),
        angleDifference(
          heading,
          180
        )
      )
      <=
      55
    );

  }


  if (
    text.includes('東西')
  ) {

    return (
      Math.min(
        angleDifference(
          heading,
          90
        ),
        angleDifference(
          heading,
          270
        )
      )
      <=
      55
    );

  }


  return true;

}


/* =========================================================
   17. 找前方測速
========================================================= */

function findCamera() {

  if (
    myLat == null
  ) {

    return null;

  }


  var best = null;


  cameras.forEach(
    function (camera) {

      var d =
        distanceMeters(

          myLat,
          myLng,

          camera.lat,
          camera.lng

        );


      /*
        先找 2 公里內。
      */

      if (
        d > 2000
      ) {

        return;

      }


      if (
        !directionMatches(
          camera.direct,
          lastHeading
        )
      ) {

        return;

      }


      if (
        Number.isFinite(
          lastHeading
        )
      ) {

        var toCamera =
          bearingDegrees(

            myLat,
            myLng,

            camera.lat,
            camera.lng

          );


        if (
          angleDifference(
            lastHeading,
            toCamera
          )
          >
          70
        ) {

          return;

        }

      }


      /*
        如果正在導航，
        優先判斷測速點是否靠近導航路線。
      */

      if (
        navigationActive
        &&
        routeCoordinates.length
      ) {

        var nearRoute =
          false;


        for (
          var i = 0;
          i < routeCoordinates.length;
          i += 10
        ) {

          var p =
            routeCoordinates[i];


          if (
            distanceMeters(

              camera.lat,
              camera.lng,

              p[0],
              p[1]

            )
            <=
            100
          ) {

            nearRoute = true;

            break;

          }

        }


        if (
          !nearRoute
        ) {

          return;

        }

      }


      if (
        !best
        ||
        d < best.distance
      ) {

        best = {

          camera: camera,

          distance: d

        };

      }

    }
  );


  return best;

}


/* =========================================================
   18. 測速警告
========================================================= */

function speak(
  text
) {

  if (
    !('speechSynthesis' in window)
  ) {

  }


  speechSynthesis.cancel();


  var u =
    new SpeechSynthesisUtterance(
      text
    );


  u.lang =
    'zh-TW';

  u.rate =
    .95;


  speechSynthesis.speak(u);

}


function checkSpeedCamera() {

  }


  var camera =

    )

    currentSpeed >

  var box =

  );

  document.getElementById(

    +

    )
    +
    ' km/h｜目前 '
    +
    Math.round(
      currentSpeed
    )
    +
    ' km/h';


  /*
    700 公尺語音。
  */

  if (
    d <= 700
  ) {

    var now =
      Date.now();


    if (
      lastWarningCameraId
      !==
      camera.id
      ||
      now -
      lastWarningTime
      >
      30000
    ) {

      var text =
        '前方 '
        +
        Math.round(d)
        +
        ' 公尺測速照相';


      if (
        Number.isFinite(
          camera.limit
        )
      ) {

        text +=
          '，速限 '
          +
          camera.limit
          +
          ' 公里';

      }


      if (
        over
      ) {

        text +=
          '，目前超速，請減速';

      }


      speak(text);


      lastWarningCameraId =
        camera.id;


      lastWarningTime =
        now;

    }

  }

}

/* =========================================================
   21. OSRM 道路路線
========================================================= */

async function calculateRoute() {

  if (
    !destination
    ||
    myLat == null
  ) {

    return;

  }


  var url =

    'https://router.project-osrm.org/route/v1/driving/'
    +

    myLng
    +
    ','
    +
    myLat
    +
    ';'
    +
    destination.lng
    +
    ','
    +
    destination.lat
    +

    '?overview=full&geometries=geojson&steps=true';


  try {

    var response =
      await fetch(url);


    if (
      !response.ok
    ) {

      throw new Error(
        'route error'
      );

    }


    var data =
      await response.json();


    if (
      data.code !== 'Ok'
      ||
      !data.routes.length
    ) {

      throw new Error(
        '找不到道路'
      );

    }


    var route =
      data.routes[0];


    routeDistance =
      route.distance;


    routeCoordinates =
      route.geometry.coordinates.map(
        function (p) {

          return [
            p[1],
            p[0]
          ];

        }
      );


    if (
      routeLine
    ) {

      map.removeLayer(
        routeLine
      );

    }


    routeLine =
      L.polyline(

        routeCoordinates,

        {

          weight: 6,

          opacity: .85

        }

      ).addTo(map);


    map.fitBounds(
      routeLine.getBounds(),
      {
        padding: [70, 70]
      }
    );


    navigationActive =
      true;


    document.getElementById(
      'stopNavigationBtn'
    ).style.display =
      'inline-block';


    document.getElementById(
      'routeStatus'
    ).textContent =
      '導航前往：'
      +
      destination.name
      +
      '｜總距離 '
      +
      formatDistance(
        routeDistance
      );


    speak(
      '導航開始，前往'
      +
      destination.name
    );

  }

  catch (error) {

    console.error(
      error
    );


    document.getElementById(
      'routeStatus'
    ).textContent =
      '導航路線規劃失敗';

    alert(
      '目前無法取得導航路線，請稍後再試。'
    );

  }

}


/* =========================================================
   22. 計算目前距離目的地
========================================================= */

function updateNavigation() {

  if (
    !navigationActive
    ||
    !destination
    ||
    myLat == null
  ) {

    return;

  }


  var d =
    distanceMeters(

      myLat,
      myLng,

      destination.lat,
      destination.lng

    );


  document.getElementById(
    'navDistance'
  ).textContent =
    formatDistance(d);


  /*
    接近目的地
  */

  if (
    d <= 40
  ) {

    document.getElementById(
      'routeStatus'
    ).textContent =
      '🏁 已抵達目的地';


    speak(
      '您已抵達目的地'
    );


    navigationActive =
      false;


    return;

  }


  /*
    判斷是否偏離導航路線
  */

  var nearest =
    nearestRouteDistance();


  if (
    nearest > 80
  ) {

    var now =
      Date.now();


    if (
      now -
      lastRerouteTime
      >
      10000
    ) {

      lastRerouteTime =
        now;


      document.getElementById(
        'routeStatus'
      ).textContent =
        '↻ 偵測到偏離路線，重新規劃…';


      calculateRoute();

    }

  }

}


/* =========================================================
   23. 找最近路線距離
========================================================= */

function nearestRouteDistance() {

  if (
    !routeCoordinates.length
    ||
    myLat == null
  ) {

    return Infinity;

  }


  var min =
    Infinity;


  /*
    每隔幾個點檢查一次，
    避免手機負擔太大。
  */

  for (
    var i = 0;
    i < routeCoordinates.length;
    i += 3
  ) {

    var p =
      routeCoordinates[i];


    var d =
      distanceMeters(

        myLat,
        myLng,

        p[0],
        p[1]

      );


    if (
      d < min
    ) {

      min = d;

    }

  }


  return min;

}


/* =========================================================
   24. 結束導航
========================================================= */

function stopNavigation() {

  navigationActive =
    false;


  destination =
    null;


  routeCoordinates =
    [];


  if (
    routeLine

    map.removeLayer(

    '尚未開始導航';

}

  'btnSos'
).onclick =
  async function () {

    if (
      !me
    ) {

      alert(
        '請先登入'
      );

      return;

    }


    if (
      !confirm(
        '向本群組發送 SOS？'
      )
    ) {

      return;

    }


    var res =
      await sb
        .from('sos_events')
        .insert({

          room_id:
            roomId,

          user_id:
            me.id,

          display_name:
            (
              me.email
              ||
              'user'
            ).split('@')[0],

          lat:
            myLat,

          lng:
            myLng,

          message:
            '遇到危險或迷路，需要協助'

        });


    if (
      res.error
    ) {

      alert(
        'SOS 失敗：'
        +
        res.error.message
      );

      return;

    }


    alert(
      '已向群組發送 SOS'
    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        200,
        100,
        200,
        100,
        400
      ]);

    }

  };


/* =========================================================
   29. SOS 即時監聽
========================================================= */

function listenSos() {

  sb.channel(
    'sos-' + roomId
  )

  .on(

    'postgres_changes',

    {

      event:
        'INSERT',

      schema:
        'public',

      table:
        'sos_events',

      filter:
        'room_id=eq.'
        +
        roomId

    },

    function (payload) {

      var row =
        payload.new;


      if (
        !row
      ) {

        return;

      }


      var banner =
        document.getElementById(
          'sosBanner'
        );


      banner.textContent =
        '🚨 SOS '
        +
        (
          row.display_name
          ||
          '成員'
        )
        +
        '：'
        +
        (
          row.message
          ||
          '需要協助'
        );


      banner.classList.add(
        'show'
      );


      if (
        row.lat != null
      ) {

        L.circleMarker(

          [
            row.lat,
            row.lng
          ],

          {

            radius: 12,

            color: '#c62828',

            fillColor: '#c62828',

            fillOpacity: .5

          }

        )
        .addTo(map)
        .bindPopup(
          '🚨 SOS '
          +
          (
            row.display_name
            ||
            ''
          )
        )
        .openPopup();

      }


      if (
        navigator.vibrate
      ) {

        navigator.vibrate([
          300,
          150,
          300
        ]);

      }

    }

  )

  .subscribe();

}

/* =========================================================
   31. 登入初始化
========================================================= */

async function bootAuth() {

  var session =
    await sb.auth.getSession();


  if (
    session.data.session
  ) {

    me =
      session.data.session.user;


    setSub(
      '已登入｜準備地圖'
    );


    await loadWaypoints();

    await loadPeers();

    listenSos();

  }

  else {

    setSub(
      '未登入｜可使用導航與本機定位'
    );

  }


  await loadCameras();


  setInterval(
    loadPeers,
    8000
  );

}


/* =========================================================
   32. 啟動
========================================================= */

bootAuth();


})();
