  );


const btnShare =

  );


const shareStatus =
  document.getElementById(
    "shareStatus"
  );


const speedBox =
  document.getElementById(
    "speedBox"
  );


const speedTitle =

  );

/* =========================================================
   5. 全域變數
   ========================================================= */

let me = null;

let shareOn = false;

let navigationOn = false;

let voiceOn = true;

let watchId = null;

let uploadTimer = null;

let myLat = null;

let myLng = null;

let myMarker = null;

let accuracyCircle = null;

let lastPosition = null;

let lastHeading = null;

let cameras = [];

let cameraMarkers = [];

let lastWarningCameraId = null;

let lastWarningTime = 0;

let waypoints = [];

let wpMarkers = {};

let peerMarkers = {};

let currentSpeed = 0;


/* =========================================================
   6. 工具
   ========================================================= */

function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


function distanceMeters(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R =
    6371000;


  const p1 =
    lat1 * Math.PI / 180;


  const p2 =
    lat2 * Math.PI / 180;


  const dp =
    (lat2 - lat1)
    * Math.PI / 180;


  const dl =
    (lng2 - lng1)
    * Math.PI / 180;


  const a =
    Math.sin(dp / 2) ** 2
    +
    Math.cos(p1)
    *
    Math.cos(p2)
    *
    Math.sin(dl / 2) ** 2;


  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}


function bearingDegrees(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const p1 =
    lat1 * Math.PI / 180;


  const p2 =
    lat2 * Math.PI / 180;


  const dl =
    (lng2 - lng1)
    * Math.PI / 180;


  const y =
    Math.sin(dl)
    *
    Math.cos(p2);


  const x =
    Math.cos(p1)
    *
    Math.sin(p2)
    -
    Math.sin(p1)
    *
    Math.cos(p2)
    *
    Math.cos(dl);


  return (
    (
      Math.atan2(y, x)
      * 180 / Math.PI
      + 360
    )
    % 360
  );

}


function angleDifference(
  a,
  b
) {

  return Math.abs(
    (
      (a - b + 540)
      % 360
    )
    - 180
  );

}


function formatDistance(
  meters
) {

  if (
    meters < 1000
  ) {

    return (
      Math.round(meters)
      + " m"
    );

  }


  return (
    (meters / 1000)
      .toFixed(1)
    +
    " km"
  );

}


function geoErrorText(
  error
) {

  if (!error) {

    return "未知錯誤";

  }


  if (
    error.code === 1
  ) {

    return "定位權限被拒絕";

  }


  if (
    error.code === 2
  ) {

    return "目前無法取得位置";

  }


  if (
    error.code === 3
  ) {

    return "定位逾時";

  }


  return (
    error.message
    ||
    String(error)
  );

}


/* =========================================================
   7. 方向判斷
   ========================================================= */

function directMatchesHeading(
  direct,
  heading
) {

  const text =
    String(
      direct || ""
    );


  if (
    !Number.isFinite(
      heading
    )
  ) {

    return true;

  }


  if (
    text.includes("南北")
  ) {

    const d =
      Math.min(

        angleDifference(
          heading,
          0
        ),

        angleDifference(
          heading,
          180
        )

      );


    return d <= 55;

  }


  if (
    text.includes("東西")
  ) {

    const d =
      Math.min(

        angleDifference(
          heading,
          90
        ),

        angleDifference(
          heading,
          270
        )

      );


    return d <= 55;

  }


  return true;

}


/* =========================================================
   8. Supabase 登入
   ========================================================= */

async function bootAuth() {

  try {

    const result =
      await sb.auth.getSession();


    if (

/* =========================================================
   9. 載入測速資料
   ========================================================= */

async function loadCameras() {

  try {

    const result =
      await sb
        .from(
          CAMERA_TABLE
        )
        .select(
          "CityName,RegionName,Address,DeptNm,BranchNm,Longitude,Latitude,direct,limit"
        );


    if (
      result.error
    ) {

      console.error(
        "測速資料錯誤",
        result.error
      );

      subEl.textContent =
        "測速資料載入失敗";

      return;

    }


    cameras =
      (result.data || [])

        .map(
          function (row, index) {

            return {

              id:
                index,

              city:
                String(
                  row.CityName || ""
                ),

              region:
                String(
                  row.RegionName || ""
                ),

              address:
                String(
                  row.Address || ""
                ),

              latitude:
                number(
                  row.Latitude
                ),

              longitude:
                number(
                  row.Longitude
                ),

              direct:
                String(
                  row.direct || ""
                ),

              speedLimit:
                number(
                  row.limit
                )

            };

          }
        )

        .filter(
          function (camera) {

            return (

              Number.isFinite(
                camera.latitude
              )

              &&

              Number.isFinite(
                camera.longitude
              )

            );

          }
        );


    drawCameraMarkers();


    console.log(
      "測速資料：",
      cameras.length
    );

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   10. 測速點
   ========================================================= */

function drawCameraMarkers() {

  cameraMarkers.forEach(
    function (marker) {

      map.removeLayer(
        marker
      );

    }
  );


  cameraMarkers = [];


  cameras.forEach(
    function (camera) {

      const marker =
        L.circleMarker(

          [
            camera.latitude,
            camera.longitude
          ],

          {

            radius: 5,

            weight: 1,

            fillOpacity: .8

          }

        );


      marker.bindPopup(

        "<strong>📷 測速照相</strong>"
        +
        "<br>"
        +
        (
          camera.address
          ||
          "未提供地址"
        )
        +
        "<br>速限："
        +
        (
          camera.speedLimit
          ?? "--"
        )
        +
        " km/h"
        +
        "<br>方向："
        +
        (
          camera.direct
          ||
          "--"
        )

      );


      marker.addTo(
        map
      );


      cameraMarkers.push(
        marker
      );

    }
  );

}


/* =========================================================
   11. 找前方測速點
   ========================================================= */

function findNearestRelevantCamera(
  lat,
  lng,
  heading
) {

  let best =
    null;


  for (
    const camera
    of cameras
  ) {

    const distance =
      distanceMeters(

        lat,
        lng,

        camera.latitude,
        camera.longitude

      );


    if (
      distance > 2000
    ) {

      continue;

    }


    if (
      !directMatchesHeading(
        camera.direct,
        heading
      )
    ) {

      continue;

    }


    if (
      Number.isFinite(
        heading
      )
    ) {

      const toCamera =
        bearingDegrees(

          lat,
          lng,

          camera.latitude,
          camera.longitude

        );


      if (
        angleDifference(
          heading,
          toCamera
        ) > 70
      ) {

        continue;

      }

    }


    if (
      !best
      ||
      distance <
      best.distance
    ) {

      best = {

        camera:
          camera,

        distance:
          distance

      };

    }

  }


  return best;

}

/* =========================================================
   14. GPS 速度
   ========================================================= */

function getSpeed(
  position
) {

  const gpsSpeed =
    position.coords.speed;


  if (
    Number.isFinite(
      gpsSpeed
    )
    &&
    gpsSpeed >= 0
  ) {

    return (
      gpsSpeed * 3.6
    );

  }


  if (
    !lastPosition
  ) {

    return 0;

  }


  const dt =
    (
      position.timestamp
      -
      lastPosition.timestamp
    )
    /
    1000;


  if (
    dt <= 0
  ) {

    return 0;

  }


  const d =
    distanceMeters(

      lastPosition.coords.latitude,
      lastPosition.coords.longitude,

      position.coords.latitude,
      position.coords.longitude

    );


  return (
    d / dt
  ) * 3.6;

}


/* =========================================================
   15. GPS
   ========================================================= */

function onPosition(
  position
) {

  myLat =
    position.coords.latitude;


  myLng =
    position.coords.longitude;


  const accuracy =
    position.coords.accuracy;


  currentSpeed =
    Math.max(
      0,
      getSpeed(
        position
      )
    );


  let heading =
    position.coords.heading;


  if (
    !Number.isFinite(
      heading
    )
    &&
    lastPosition
  ) {

    const moved =
      distanceMeters(

        lastPosition.coords.latitude,
        lastPosition.coords.longitude,

        myLat,
        myLng

      );


    if (
      moved >= 3
    ) {

      heading =
        bearingDegrees(

          lastPosition.coords.latitude,
          lastPosition.coords.longitude,

          myLat,
          myLng

        );

    }

  }


  if (
    Number.isFinite(
      heading
    )
  ) {

    lastHeading =
      heading;

  }
  else {

    heading =
      lastHeading;

  }


  currentSpeedEl.textContent =
    Math.round(
      currentSpeed
    );


  currentHeadingEl.textContent =

    Number.isFinite(
      heading
    )

      ? Math.round(
          heading
        )

      : "--";


  const now =
    new Date();


  subEl.textContent =

    "GPS "
    +
    "±"
    +
    Math.round(
      accuracy
    )
    +
    "m"
    +
    "｜"
    +
    now.getHours()
    +
    ":"
    +
    String(
      now.getMinutes()
    ).padStart(2, "0");


  /* =======================================================
     我的標記
     ======================================================= */

  if (
    !myMarker
  ) {

    myMarker =
      L.circleMarker(

        [
          myLat,
          myLng
        ],

        {

          radius: 8,

          color: "#06C755",

          fillColor: "#06C755",

          fillOpacity: .95

        }

      )
      .addTo(map)
      .bindPopup(
        "我的位置"
      );

  }
  else {

    myMarker.setLatLng([
      myLat,
      myLng
    ]);

  }


  /* =======================================================
     GPS 誤差
     ======================================================= */

  if (
    !accuracyCircle
  ) {

    accuracyCircle =
      L.circle(

        [
          myLat,
          myLng
        ],

        {

          radius:
            accuracy,

          weight: 1,

          fillOpacity: .06

        }

      ).addTo(map);

  }
  else {

    accuracyCircle.setLatLng([
      myLat,
      myLng
    ]);

    accuracyCircle.setRadius(
      accuracy
    );

  }


  /* =======================================================
     導航模式自動跟隨
     ======================================================= */

  if (
    navigationOn
  ) {

    map.setView(
      [
        myLat,
        myLng
      ],
      Math.max(
        map.getZoom(),
        15
      ),
      {
        animate: true
      }
    );

  }


  /* =======================================================
     測速
     ======================================================= */

  if (
    navigationOn
  ) {

    const result =
      findNearestRelevantCamera(

        myLat,
        myLng,
        heading

      );


    showCameraWarning(
      result
    );

  }


  /* =======================================================
     上傳位置
     ======================================================= */

  uploadLocation();


  lastPosition =
    position;

}


/* =========================================================
   16. 開始 GPS
   ========================================================= */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    alert(
      "此裝置不支援 GPS 定位"
    );

    return false;

  }


  if (
    location.protocol !== "https:"
    &&
    location.hostname !== "localhost"
  ) {

    alert(
      "定位需要 HTTPS，請使用 GitHub Pages"
    );

    return false;

  }


  if (
    watchId !== null
  ) {

    return true;

  }


  watchId =
    navigator.geolocation.watchPosition(

      onPosition,

      function (error) {

        subEl.textContent =
          "GPS：" +
          geoErrorText(
            error
          );

      },

      {

        enableHighAccuracy:
          true,

        maximumAge:
          1000,

        timeout:
          10000

      }

    );


  return true;

}


/* =========================================================
   17. 停止 GPS
   ========================================================= */

function stopGPS() {

  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId =
      null;

  }


  if (
    uploadTimer
  ) {

    clearInterval(
      uploadTimer
    );

    uploadTimer =
      null;

  }

}

/* =========================================================
   21. 語音系統＋聲音選擇
   ========================================================= */

let speechReady = false;

let selectedVoice = null;


/* ---------------------------------------------------------
   讀取已儲存的聲音
   --------------------------------------------------------- */

const savedVoiceName =
  localStorage.getItem(
    "safeReunionVoice"
  );


/* ---------------------------------------------------------
   取得手機可用聲音
   --------------------------------------------------------- */

function getAvailableVoices() {

  if (
    !("speechSynthesis" in window)
  ) {

    return [];

  }


  return window
    .speechSynthesis
    .getVoices();

}


/* ---------------------------------------------------------
   選擇最佳中文聲音
   --------------------------------------------------------- */

function chooseDefaultVoice() {

  const voices =
    getAvailableVoices();


  if (
    !voices.length
  ) {

    return null;

  }


  /*
   * 如果使用者之前已經選過聲音
   * 優先使用之前的選擇
   */

  if (
    savedVoiceName
  ) {

    const saved =
      voices.find(
        function (voice) {

          return (
            voice.name
            ===
            savedVoiceName
          );

        }
      );


    if (
      saved
    ) {

      return saved;

    }

  }


  /*
   * 優先台灣中文
   */

  let voice =
    voices.find(
      function (voice) {

        return (
          voice.lang
          .toLowerCase()
          ===
          "zh-tw"
        );

      }
    );


  /*
   * 再找其他中文
   */

  if (
    !voice
  ) {

    voice =
      voices.find(
        function (voice) {

          return (
            voice.lang
              .toLowerCase()
              .startsWith(
                "zh"
              )
          );

        }
      );

  }


  /*
   * 最後使用系統第一個聲音
   */

  if (
    !voice
  ) {

    voice =
      voices[0];

  }


  return voice;

}


/* ---------------------------------------------------------
   初始化語音
   --------------------------------------------------------- */

function initSpeech() {

  if (
    !("speechSynthesis" in window)
  ) {

    console.warn(
      "此裝置不支援語音"
    );

    return;

  }


  function refreshVoices() {

    const voices =
      getAvailableVoices();


    if (
      voices.length
    ) {

      speechReady =
        true;


      if (
        !selectedVoice
      ) {

        selectedVoice =
          chooseDefaultVoice();

      }


      console.log(
        "可用語音：",
        voices
      );

    }

  }


  refreshVoices();


  /*
   * iPhone / Safari
   * 語音清單可能延遲載入
   */

  window
    .speechSynthesis
    .onvoiceschanged =
      refreshVoices;

}


/* ---------------------------------------------------------
   播放語音
   --------------------------------------------------------- */

function speak(
  text
) {

  if (
    !voiceOn
  ) {

    return;

  }


  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  if (
    !text
  ) {

    return;

  }


  const voices =
    getAvailableVoices();


  /*
   * 如果聲音還沒準備好
   * 再重新找一次
   */

  if (
    !selectedVoice
    &&
    voices.length
  ) {

    selectedVoice =
      chooseDefaultVoice();

  }


  try {

    window
      .speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    /*
     * 使用使用者選擇的聲音
     */

    if (
      selectedVoice
    ) {

      utterance.voice =
        selectedVoice;

      utterance.lang =
        selectedVoice.lang;

    }
    else {

      utterance.lang =
        "zh-TW";

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    utterance.onerror =
      function (event) {

        console.error(
          "語音播放錯誤：",
          event
        );

      };


    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch (error) {

    console.error(
      "語音錯誤：",
      error
    );

  }

}


/* ---------------------------------------------------------
   iPhone / Safari 語音啟動
   --------------------------------------------------------- */

function unlockSpeech() {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  try {

    window
      .speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        "語音導航已開啟"
      );


    if (
      selectedVoice
    ) {

      utterance.voice =
        selectedVoice;

      utterance.lang =
        selectedVoice.lang;

    }
    else {

      utterance.lang =
        "zh-TW";

    }


    utterance.rate =
      1;


    utterance.volume =
      1;


    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch (error) {

    console.error(
      "語音初始化失敗：",
      error
    );

  }

}


/* ---------------------------------------------------------
   建立聲音選擇器
   --------------------------------------------------------- */

function showVoiceSelector() {

  const voices =
    getAvailableVoices();


  if (
    !voices.length
  ) {

    alert(
      "目前還沒有取得手機語音清單，請稍後再試。"
    );

    return;

  }


  /*
   * 只顯示中文優先，
   * 但如果沒有中文就顯示全部。
   */

  let chineseVoices =
    voices.filter(
      function (voice) {

        return voice.lang
          .toLowerCase()
          .startsWith("zh");

      }
    );


  const list =
    chineseVoices.length
      ? chineseVoices
      : voices;


  let message =
    "選擇語音：\n\n";


  list.forEach(
    function (voice, index) {

      message +=

        (
          index + 1
        )
        +
        ". "
        +
        voice.name
        +
        "（"
        +
        voice.lang
        +
        "）";

      if (
        selectedVoice
        &&
        voice.name
        ===
        selectedVoice.name
      ) {

        message +=
          " ✓";

      }


      message +=
        "\n";

    }
  );


  const answer =
    prompt(
      message
      +
      "\n請輸入編號："
    );


  if (
    answer === null
  ) {

    return;

  }


  const index =
    parseInt(
      answer,
      10
    );


  if (
    !Number.isInteger(index)
    ||
    index < 1
    ||
    index > list.length
  ) {

    alert(
      "編號無效"
    );

    return;

  }


  selectedVoice =
    list[
      index - 1
    ];


  localStorage.setItem(
    "safeReunionVoice",
    selectedVoice.name
  );


  /*
   * 立即測試新聲音
   */

  speak(
    "這是新的導航語音"
  );

}

async function uploadLocation() {

  ) {

    return;

  }


  try {

    await sb
      .from("location_shares")
      .upsert({

        user_id:
          me.id,

        room_id:
          roomId,

        lat:
          myLat,

        lng:
          myLng,

        display_name:
          (
            me.email
            ||
            "user"
          )
          .split("@")[0],

        updated_at:
          new Date()
            .toISOString()

      });

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   25. 成員定位
   ========================================================= */

async function loadPeers() {

  if (
    !roomId
  ) {

    return;

  }


  try {

    const result =
      await sb
        .from(
          "location_shares"
        )
        .select("*")
        .eq(
          "room_id",
          roomId
        )
        .gte(

          "updated_at",

          new Date(
            Date.now()
            -
            30 *
            60 *
            1000
          ).toISOString()

        );


    const rows =
      result.data
      ||
      [];


    Object.keys(
      peerMarkers
    ).forEach(
      function (key) {

        map.removeLayer(
          peerMarkers[key]
        );

      }
    );


    peerMarkers =
      {};


    let count =
      0;


    rows.forEach(
      function (row) {

        if (
          me
          &&
          row.user_id
          ===
          me.id
        ) {

          return;

        }


        if (
          row.lat == null
          ||
          row.lng == null
        ) {

          return;

        }


        count++;


        peerMarkers[
          row.user_id
        ] =

          L.circleMarker(

            [
              row.lat,
              row.lng
            ],

            {

              radius: 7,

              color: "#1e88e5",

              fillColor: "#1e88e5",

              fillOpacity: .9

            }

          )

          .addTo(map)

          .bindPopup(

            row.display_name
            ||
            "成員"

          );

      }
    );


    document.getElementById(
      "partStatus"
    ).textContent =

      "目前分享定位人數："
      +
      (
        count
        +
        (
          shareOn
          &&
          myLat != null
            ? 1
            : 0
        )
      )
      +
      "（含行程點 "
      +
      waypoints.length
      +
      " 個）";

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   26. 集合點圖示
   ========================================================= */

function numIcon(
  number
) {

  return L.divIcon({

    className: "",

    html:
      '<div class="marker-num">'
      +
      number
      +
      "</div>",

    iconSize:
      [28, 28],

    iconAnchor:
      [14, 14]

  });

}


/* =========================================================
   27. 載入集合點
   ========================================================= */

async function loadWaypoints() {

  if (
    !me
  ) {

    return;

  }


  const result =
    await sb
      .from(
        "meetup_waypoints"
      )
      .select("*")
      .eq(
        "room_id",
        roomId
      )
      .order(
        "seq",
        {
          ascending:
            true
        }
      );


  if (
    result.error
  ) {

    console.error(
      result.error
    );

    return;

  }


  waypoints =
    result.data
    ||
    [];


  renderWaypoints();

}


/* =========================================================
   28. 顯示集合點
   ========================================================= */

function renderWaypoints() {

  Object.keys(
    wpMarkers
  ).forEach(
    function (key) {

      map.removeLayer(
        wpMarkers[key]
      );

    }
  );


  wpMarkers =
    {};


  const box =
    document.getElementById(
      "wpList"
    );


  box.innerHTML =
    "";


  if (
    !waypoints.length
  ) {

    box.innerHTML =
      '<div style="color:#888;font-size:12px;padding:8px 0">尚未設定行程點</div>';

    return;

  }


  waypoints.forEach(
    function (w) {

      const marker =
        L.marker(

          [
            w.lat,
            w.lng
          ],

          {
            icon:
              numIcon(
                w.seq
              )
          }

        )
        .addTo(map);


      const timeStr =
        w.meet_at

          ? new Date(
              w.meet_at
            ).toLocaleString()

          : "時間未定";


      marker.bindPopup(

        "<b>#"
        +
        w.seq
        +
        " "
        +
        w.title
        +
        "</b>"
        +
        "<br>"
        +
        timeStr

      );


      wpMarkers[
        w.id
      ] =
        marker;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "wp-item";


      div.innerHTML =

        '<div class="num">'
        +
        w.seq
        +
        "</div>"
        +

        '<div style="flex:1">'
        +

        '<div style="font-weight:600">'
        +
        w.title
        +
        "</div>"
        +

        '<div style="color:#888;margin-top:2px">'
        +
        timeStr
        +
        "</div>"
        +

        "</div>"
        +

        '<button type="button" class="btn btn-outline">刪</button>';


      div
        .querySelector("button")
        .onclick =
        function () {

          deleteWp(
            w.id
          );

        };


      box.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   29. 新增集合點
   ========================================================= */

async function addWaypoint(
  lat,
  lng
) {

  if (
    !me
  ) {

    alert(
      "請先登入才能設定集合點"
    );

    return;

  }


  const title =
    document.getElementById(
      "wpTitle"
    )
    .value
    .trim()
    ||
    (
      "集合點 "
      +
      (
        waypoints.length
        + 1
      )
    );


  const t =
    document.getElementById(
      "wpTime"
    )
    .value;


  const meetAt =
    t

      ? new Date(
          t
        ).toISOString()

      : null;


  const seq =
    waypoints.length

      ? (
          waypoints[
            waypoints.length - 1
          ].seq
          + 1
        )

      : 1;


  const result =
    await sb
      .from(
        "meetup_waypoints"
      )
      .insert({

        room_id:
          roomId,

        seq:
          seq,

        title:
          title,

        lat:
          lat,

        lng:
          lng,

        meet_at:
          meetAt,

        created_by:
          me.id

      })
      .select()
      .single();


  if (
    result.error
  ) {

    alert(
      "新增失敗："
      +
      result.error.message
    );

    return;

  }


  document.getElementById(
    "wpTitle"
  ).value =
    "";


  await loadWaypoints();

}


/* =========================================================
   30. 刪除集合點
   ========================================================= */

async function deleteWp(
  id
) {

  if (
    !me
  ) {

    return;

  }


  const result =
    await sb
      .from(
        "meetup_waypoints"
      )
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "created_by",
        me.id
      );


  if (
    result.error
  ) {

    alert(
      "刪除失敗："
      +
      result.error.message
    );

    return;

  }


  await loadWaypoints();

}


/* =========================================================
   31. 搜尋地址
   ========================================================= */

async function searchPlace() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const q =
    input.value.trim();


  if (
    !q
  ) {

    alert(
      "請輸入地址或地名"
    );

    return;

  }


  const box =
    document.getElementById(
      "searchResults"
    );


  box.style.display =
    "block";


  box.innerHTML =

    '<div style="padding:10px;color:#888;font-size:12px">搜尋中…</div>';


  try {

    const url =

      "https://nominatim.openstreetmap.org/search"
      +
      "?format=json"
      +
      "&q="
      +
      encodeURIComponent(
        q
      )
      +
      "&limit=6"
      +
      "&accept-language=zh-TW";


    const response =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    const arr =
      await response.json();


    box.innerHTML =
      "";


    if (
      !arr.length
    ) {

      box.innerHTML =

        '<div style="padding:10px;color:#888;font-size:12px">找不到地點</div>';

      return;

    }


    arr.forEach(
      function (item) {

        const div =
          document.createElement(
            "div"
          );


        div.style.cssText =

          "padding:10px;"
          +
          "border-bottom:1px solid #eee;"
          +
          "font-size:12px;"
          +
          "cursor:pointer;";


        div.textContent =
          item.display_name;


        div.onclick =
          async function () {

            const lat =
              parseFloat(
                item.lat
              );


            const lng =
              parseFloat(
                item.lon
              );


            const title =
              (
                item.display_name
                ||
                q
              )
              .split(",")[0];


            const titleInput =
              document.getElementById(
                "wpTitle"
              );


            if (
              !titleInput.value.trim()
            ) {

              titleInput.value =
                title;

            }


            map.setView(
              [
                lat,
                lng
              ],
              16
            );


            L.circleMarker(

              [
                lat,
                lng
              ],

              {

                radius: 6,

                color: "#1565c0",

                fillColor: "#1565c0",

                fillOpacity: .8

              }

            ).addTo(map);


            box.style.display =
              "none";


            await addWaypoint(
              lat,
              lng
            );

          };


        box.appendChild(
          div
        );

      }
    );

  }

  catch (error) {

    console.error(
      error
    );


    box.innerHTML =

      '<div style="padding:10px;color:#c62828;font-size:12px">搜尋失敗，請稍後再試</div>';

  }

}


document.getElementById(

/* =========================================================
   34. SOS
   ========================================================= */

async function sendSOS() {

  if (
    !me
  ) {

    alert(
      "請先登入"
    );

    return;

  }


  if (
    !confirm(
      "向本群組／活動發送 SOS 求助？"
    )
  ) {

    return;

  }


  const result =
    await sb
      .from(
        "sos_events"
      )
      .insert({

        room_id:
          roomId,

        user_id:
          me.id,

        display_name:
          (
            me.email
            ||
            "user"
          )
          .split("@")[0],

        lat:
          myLat,

        lng:
          myLng,

        message:
          "遇到危險或迷路，需要協助"

      });


  if (
    result.error
  ) {

    alert(
      "SOS 失敗："
      +
      result.error.message
    );

    return;

  }


  if (
    myLat !== null
  ) {

    L.circleMarker(

      [
        myLat,
        myLng
      ],

      {

        radius: 12,

        color: "#c62828",

        fillColor: "#c62828",

        fillOpacity: .5

      }

    )
    .addTo(map)
    .bindPopup(
      "🚨 SOS"
    )
    .openPopup();

  }


  sosBanner.textContent =
    "🚨 SOS 已發送給群組";


  sosBanner.classList.add(
    "show"
  );


  setTimeout(
    function () {

      sosBanner.classList.remove(
        "show"
      );

    },
    5000
  );


  if (
    navigator.vibrate
  ) {

    navigator.vibrate([
      200,
      100,
      200,
      100,
      400
    ]);

  }

}


document.getElementById(
  "btnSosTop"
).onclick =
  sendSOS;


/* =========================================================
   35. SOS 即時通知
   ========================================================= */

function listenSos() {

  sb
    .channel(
      "sos-" + roomId
    )

    .on(

      "postgres_changes",

      {

        event:
          "INSERT",

        schema:
          "public",

        table:
          "sos_events",

        filter:
          "room_id=eq."
          +
          roomId

      },

      function (payload) {

        const row =
          payload.new;


        if (
          !row
        ) {

          return;

        }


        sosBanner.textContent =

          "🚨 SOS "
          +
          (
            row.display_name
            ||
            "成員"
          )
          +
          "："
          +
          (
            row.message
            ||
            "需要協助"
          );


        sosBanner.classList.add(
          "show"
        );


        if (
          row.lat != null
          &&
          row.lng != null
        ) {

          L.circleMarker(

            [
              row.lat,
              row.lng
            ],

            {

              radius: 12,

              color: "#c62828",

              fillColor: "#c62828",

              fillOpacity: .5

            }

          )
          .addTo(map)
          .bindPopup(
            "🚨 SOS "
            +
            (
              row.display_name
              ||
              ""
            )
          )
          .openPopup();

        }


        if (
          navigator.vibrate
        ) {

          navigator.vibrate([
            300,
            150,
            300
          ]);

        }


        setTimeout(
          function () {

            sosBanner.classList.remove(
              "show"
            );

          },
          8000
        );

      }

    )

    .subscribe();

}
