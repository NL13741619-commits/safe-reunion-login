<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>導航測速・安全團聚</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: #e8eef4;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: #dfe7ef;
}

/* ===== Header ===== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  min-height: 56px;
  padding: 8px 8px env(safe-area-inset-top, 0);
  background: #06C755;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 2000;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
  transform: translateZ(0);
}

.back {
  width: 36px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; text-decoration: none; font-size: 28px; flex-shrink: 0;
}

.header-info { flex: 1; min-width: 0; line-height: 1.15; }
.header-title {
  font-size: 15px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-sub {
  margin-top: 2px; font-size: 10px; opacity: .95;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.top-btn {
  border: none; min-width: 40px; height: 38px;
  padding: 0 9px; border-radius: 10px;
  font-size: 13px; font-weight: 700;
  color: #333; background: #fff;
  box-shadow: 0 2px 7px rgba(0,0,0,.15);
  flex-shrink: 0; cursor: pointer;
}
.top-btn.nav { background: #1677ff; color: #fff; }
.top-btn.stop { background: #d93025; color: #fff; }
.top-btn.silent { background: #333; color: #fff; }

.sos-top {
  border: none; width: 44px; height: 38px; border-radius: 10px;
  background: #d93025; color: #fff; font-size: 13px; font-weight: 900;
  box-shadow: 0 2px 8px rgba(0,0,0,.22); flex-shrink: 0; cursor: pointer;
}

.leaflet-top.leaflet-left { top: 64px; left: 8px; }
.leaflet-control-zoom a {
  width: 38px !important; height: 38px !important;
  line-height: 38px !important; font-size: 20px !important;
}

/* ===== Speed warning ===== */
.speed-box {
  position: fixed; top: 66px; left: 54px; right: 54px; z-index: 1800;
  display: none; background: rgba(255,255,255,.97);
  border-radius: 12px; padding: 8px 11px;
  box-shadow: 0 3px 16px rgba(0,0,0,.22); font-size: 12px;
}
.speed-box.show { display: block; }
.speed-box.danger { background: #ffe1e1; color: #8b0000; }
.speed-title { font-weight: 900; font-size: 13px; }
.speed-info { margin-top: 3px; line-height: 1.4; }
.speed-address {
  margin-top: 2px; color: #666; font-size: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ===== Navigation bottom info (Uber-like) ===== */
.navigation-info {
  position: fixed; left: 10px; right: 10px; bottom: 12px; z-index: 1900;
  display: none; gap: 8px;
}
.navigation-info.show { display: flex; }

.speed-current, .navigation-direction, .nav-eta {
  background: rgba(255,255,255,.96);
  border-radius: 14px; padding: 8px 10px;
  box-shadow: 0 3px 14px rgba(0,0,0,.18);
  flex: 1; text-align: center;
}
.info-label { font-size: 10px; color: #666; }
.info-value { margin-top: 2px; font-size: 20px; font-weight: 900; }

/* ===== Main panel ===== */
.panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1700;
  background: #fff;
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -3px 20px rgba(0,0,0,.16);
  max-height: 32vh;
  overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 12px calc(18px + env(safe-area-inset-bottom, 0));
  transition: transform .28s ease;
  overscroll-behavior-x: none;
}
.panel.hidden, body.navigation-mode .panel { transform: translateY(110%); }
.panel-handle {
  width: 42px; height: 4px; background: #ccc;
  border-radius: 10px; margin: 0 auto 9px;
}

.row {
  display: flex; gap: 7px; align-items: center;
  margin-bottom: 8px; flex-wrap: wrap;
}
.status { flex: 1; min-width: 110px; font-size: 12px; color: #555; }

.btn {
  border: none; border-radius: 10px;
  padding: 9px 11px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.btn-green { background: #06C755; color: #fff; }
.btn-red { background: #e53935; color: #fff; }
.btn-orange { background: #fb8c00; color: #fff; }
.btn-outline { background: #fff; border: 1px solid #ddd; color: #333; }

.list-title { font-size: 12px; color: #888; margin: 9px 0 5px; }

input, select {
  width: 100%; padding: 9px 10px;
  border: 1px solid #e0e0e0; border-radius: 9px;
  font-size: 13px; margin-bottom: 7px; outline: none;
}

.wp-item {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px;
}
.num {
  width: 25px; height: 25px; border-radius: 50%;
  background: #06C755; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; flex-shrink: 0;
}
.marker-num {
  background: #06C755; color: #fff; border-radius: 50%;
  width: 28px; height: 28px; line-height: 28px; text-align: center;
  font-weight: 700; border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}

.sos-banner {
  position: fixed; top: 60px; left: 10px; right: 10px; z-index: 2100;
  display: none; background: #c62828; color: #fff;
  padding: 9px 11px; border-radius: 11px;
  font-size: 12px; font-weight: 700; text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.25);
}
.sos-banner.show { display: block; }

#searchResults {
  display: none; border: 1px solid #eee; border-radius: 9px;
  margin-bottom: 8px; max-height: 140px; overflow-y: auto;
}

/* pin / arrival / admin */
.pin-choice-mask {
  display: none; position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,.35); align-items: flex-end; justify-content: center;
}
.pin-choice-mask.show { display: flex; }
.pin-choice-box {
  width: 100%; max-width: 420px; background: #fff;
  border-radius: 16px 16px 0 0; padding: 16px;
  box-shadow: 0 -4px 24px rgba(0,0,0,.2);
}
.pin-choice-box h3 { margin: 0 0 6px; font-size: 16px; }
.pin-choice-box p { margin: 0 0 12px; font-size: 12px; color: #666; }
.pin-choice-yellow { background: #f9a825 !important; color: #111 !important; }
.pin-choice-red { background: #e53935 !important; color: #fff !important; }

.arrival-fab {
  position: fixed; right: 12px; bottom: 34vh; z-index: 1800;
  width: 48px; height: 48px; border-radius: 50%; border: none;
  background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.25);
  font-size: 22px; cursor: pointer;
}
.arrival-panel {
  display: none; position: fixed; right: 12px; bottom: calc(34vh + 56px);
  z-index: 1800; width: min(280px, 85vw); max-height: 40vh; overflow-y: auto;
  background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.22);
  padding: 12px; font-size: 13px;
}
.arrival-panel.show { display: block; }
.arrival-panel h4 { margin: 0 0 8px; font-size: 14px; }
.arrival-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid #eee;
}
.depart-banner {
  display: none; position: fixed; top: 68px; left: 12px; right: 12px; z-index: 1850;
  background: #fff3e0; border: 1px solid #ff9800; border-radius: 12px;
  padding: 10px 12px; font-size: 13px; box-shadow: 0 3px 12px rgba(0,0,0,.15);
}
.depart-banner.show { display: block; }

.admin-fab {
  position: fixed; left: 12px; bottom: 34vh; z-index: 1800;
  width: 44px; height: 44px; border-radius: 50%; border: none;
  background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.25);
  font-size: 18px; cursor: pointer; display: none;
}
.admin-panel {
  display: none; position: fixed; left: 12px; right: 12px; bottom: 12px;
  z-index: 3000; max-height: 70vh; overflow-y: auto;
  background: #fff; border-radius: 14px; box-shadow: 0 6px 28px rgba(0,0,0,.25);
  padding: 14px;
}
.admin-panel.show { display: block; }
.admin-panel h3 { margin: 0 0 8px; font-size: 16px; }
.admin-panel label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
.admin-panel input {
  width: 100%; padding: 10px; border: 1px solid #ddd;
  border-radius: 8px; margin-top: 4px; font-size: 14px;
}

.my-location-arrow, .pin-marker, .group-member-leaflet-icon {
  background: transparent !important; border: none !important;
}
.pin-emoji {
  font-size: 32px; line-height: 1;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.35));
  transform: translateY(-6px);
}

@media (max-width: 390px) {
  .header { gap: 4px; padding-left: 5px; padding-right: 5px; }
  .header-title { font-size: 13px; }
  .header-sub { font-size: 9px; }
  .top-btn { min-width: 36px; height: 36px; padding: 0 6px; font-size: 11px; }
  .sos-top { width: 40px; height: 36px; font-size: 12px; }
  .speed-box { left: 50px; right: 50px; }
}
</style>
</head>
<body>

<div id="map"></div>

<button type="button" class="admin-fab" id="adminFab" title="開發者設定">⚙️</button>
<div class="admin-panel" id="adminPanel">
  <h3>⚙️ 開發者・臨時帳號</h3>
  <p style="font-size:12px;color:#666;margin:0 0 8px">僅開發者可見。可建立臨時帳號給來不及註冊的同學（免信箱驗證）。</p>
  <label>暱稱（顯示名稱）</label>
  <input id="tempDisplayName" placeholder="例如：同學A" />
  <label>登入帳號（英文/數字）</label>
  <input id="tempLoginId" placeholder="例如：classmate01" />
  <label>密碼（至少 6 碼）</label>
  <input id="tempPassword" type="password" placeholder="臨時密碼" />
  <button type="button" class="btn btn-green" id="btnCreateTempUser" style="width:100%;margin-top:12px">建立臨時帳號</button>
  <div id="tempUserResult" style="margin-top:10px;font-size:12px;white-space:pre-wrap;color:#333"></div>
  <button type="button" class="btn btn-outline" id="btnCloseAdmin" style="width:100%;margin-top:8px">關閉</button>
</div>

<div class="pin-choice-mask" id="pinChoiceMask">
  <div class="pin-choice-box">
    <h3>📍 放置大頭針</h3>
    <p>請選擇這個位置的用途</p>
    <button type="button" class="btn pin-choice-yellow" id="btnPinPrivate" style="width:100%">🟡 個人定位（只有自己看得到）</button>
    <button type="button" class="btn pin-choice-red" id="btnPinGroup" style="width:100%">🔴 集體集合點（所有人看得到）</button>
    <button type="button" class="btn btn-outline" id="btnPinCancel" style="width:100%">取消</button>
  </div>
</div>

<button type="button" class="arrival-fab" id="arrivalFab" title="誰已抵達">👤</button>
<div class="arrival-panel" id="arrivalPanel">
  <h4>抵達順序紀錄</h4>
  <div id="arrivalList"><div style="color:#888">尚無紀錄</div></div>
  <button type="button" class="btn btn-outline" id="btnClearArrivalLocal" style="width:100%;margin-top:8px;font-size:12px">清除本機紀錄</button>
</div>
<div class="depart-banner" id="departBanner"></div>

<!-- Header -->
<div class="header">
  <a class="back" id="btnBack" href="chat.html">‹</a>
  <div class="header-info">
    <div class="header-title" id="title">集合地圖</div>
    <div class="header-sub" id="sub">尚未定位</div>
  </div>
  <button type="button" class="top-btn" id="voiceBtn" title="語音">🔊</button>
  <button type="button" class="top-btn nav" id="navigationBtn">開始導航</button>
  <button id="btn3DMode" type="button" class="btn btn-outline">
  🚗 3D駕駛
</button>
  <button type="button" class="sos-top" id="btnSosTop">SOS</button>
</div>

<div class="sos-banner" id="sosBanner"></div>

<div class="speed-box" id="speedBox">
  <div class="speed-title" id="speedTitle">📷 前方測速提醒</div>
  <div class="speed-info" id="speedInfo"></div>
  <div class="speed-address" id="speedAddress"></div>
</div>

<div class="navigation-info" id="navigationInfo">
  <div class="speed-current">
    <div class="info-label">目前速度</div>
    <div class="info-value" id="currentSpeed">0</div>
    <div class="info-label">km/h</div>
  </div>
  <div class="navigation-direction">
    <div class="info-label">行進方向</div>
    <div class="info-value" id="currentHeading">--</div>
    <div class="info-label">°</div>
  </div>
  <div class="nav-eta" id="navEtaBox" style="display:none">
    <div class="info-label">預估到達</div>
    <div class="info-value" id="navEta" style="font-size:16px">--</div>
    <div class="info-label" id="navDist">--</div>
  </div>
</div>

<!-- Panel -->
<div class="panel" id="mainPanel">
  <div class="panel-handle"></div>

  <div class="row">
    <div class="status" id="shareStatus">定位：關閉</div>
    <button type="button" class="btn btn-green" id="btnShare">開啟定位分享</button>
  </div>

  <div class="status" id="partStatus">參與者：—</div>

  <div class="list-title">新增行程／集合點</div>
  <input id="wpTitle" placeholder="地點名稱（例如：花蓮車站）">
  <input id="wpTime" type="datetime-local">

  <div class="list-title">
    地圖模式
    <span id="searchCountLabel" style="float:right;font-size:12px;color:#666;font-weight:normal;display:none"></span>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <button type="button" class="btn btn-green" id="btnModeTaiwan" style="flex:1">地圖</button>
    <button type="button" class="btn btn-outline" id="btnModeGoogle" style="flex:1">Google</button>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <button type="button" class="btn btn-outline" id="btnSatellite" style="flex:1">衛星圖</button>
    <button type="button" class="btn btn-outline" id="btnRecenter" style="flex:1">回到我</button>
  </div>

  <div class="list-title">搜尋地址設為集合點</div>
  <input id="searchInput" placeholder="搜尋地址（例如：台北車站）">
  <div class="row">
    <button type="button" class="btn btn-green" id="btnSearch" style="flex:1">搜尋</button>
  </div>
  <div id="searchResults"></div>

  <div class="row">
    <button type="button" class="btn btn-green" id="btnAddHere" style="flex:1">用目前位置新增</button>
    <button type="button" class="btn btn-outline" id="btnAddMap" style="flex:1">用地圖中心新增</button>
  </div>

  <div class="list-title">行程列表</div>
  <div id="wpList"></div>
</div>

<script>
(function () {
"use strict";

/* =========================================================
   1. Supabase
   ========================================================= */
const SUPABASE_URL = "https://perfsipperncvjocznhl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY";
const CAMERA_TABLE = "speed_cameras";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================================================
   2. 房間參數
   ========================================================= */
const params = new URLSearchParams(location.search);
const roomId = params.get("id") || params.get("room") || "general";
const roomName = params.get("name") ? decodeURIComponent(params.get("name")) : "集合地圖";

document.getElementById("title").textContent = roomName + "・導航";
document.getElementById("btnBack").href =
  roomId !== "general"
    ? "room.html?id=" + encodeURIComponent(roomId) + "&name=" + encodeURIComponent(roomName)
    : "chat.html";

/* =========================================================
   3. 地圖 + 穩定底圖（解決灰頻）
   ========================================================= */
const map = L.map("map", {
  zoomControl: true,
  attributionControl: true,
  preferCanvas: false
}).setView([23.97, 121.0], 8);

const cartoLayer = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: "abcd",
    errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
  }
);

const osmLayer = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap",
    errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
  }
);

const esriLayer = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri",
    errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
  }
);

const satelliteLayer = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri"
  }
);

const baseLayers = [cartoLayer, osmLayer, esriLayer];
let activeBaseLayer = cartoLayer;
let satelliteOn = false;
let currentMapMode = "taiwan";
let tileFailCount = 0;

cartoLayer.addTo(map);

function switchToNextBaseLayer() {
  if (satelliteOn) return;
  const idx = baseLayers.indexOf(activeBaseLayer);
  const next = baseLayers[(idx + 1) % baseLayers.length];
  if (map.hasLayer(activeBaseLayer)) map.removeLayer(activeBaseLayer);
  if (!map.hasLayer(next)) next.addTo(map);
  activeBaseLayer = next;
  console.warn("[map] 底圖切換", next === cartoLayer ? "Carto" : next === osmLayer ? "OSM" : "Esri");
}

baseLayers.forEach(function (layer) {
  layer.on("tileerror", function () {
    tileFailCount++;
    if (tileFailCount >= 2 && layer === activeBaseLayer && !satelliteOn) {
      tileFailCount = 0;
      switchToNextBaseLayer();
    }
  });
});

function forceMapResize() {
  try { map.invalidateSize({ animate: false }); } catch (e) {}
}
setTimeout(forceMapResize, 150);
setTimeout(forceMapResize, 500);
setTimeout(forceMapResize, 1200);
window.addEventListener("resize", forceMapResize);
window.addEventListener("orientationchange", function () {
  setTimeout(forceMapResize, 350);
});

/* 相容舊變數名稱 */
const taiwanLayer = cartoLayer;
const taiwanLayerBackup = osmLayer;
const amapLayer = osmLayer;

/* =========================================================
   4. DOM
   ========================================================= */
const subEl = document.getElementById("sub");
const navigationBtn = document.getElementById("navigationBtn");
const voiceBtn = document.getElementById("voiceBtn");
const btnShare = document.getElementById("btnShare");
const shareStatus = document.getElementById("shareStatus");
const speedBox = document.getElementById("speedBox");
const speedTitle = document.getElementById("speedTitle");
const speedInfo = document.getElementById("speedInfo");
const speedAddress = document.getElementById("speedAddress");
const currentSpeedEl = document.getElementById("currentSpeed");
const currentHeadingEl = document.getElementById("currentHeading");
const sosBanner = document.getElementById("sosBanner");
const partStatus = document.getElementById("partStatus");
const navigationInfo = document.getElementById("navigationInfo");
const navEtaBox = document.getElementById("navEtaBox");
const navEtaEl = document.getElementById("navEta");
const navDistEl = document.getElementById("navDist");

/* =========================================================
   5. 全域狀態
   ========================================================= */
let me = null;
let shareOn = false;
let navigationOn = false;
let voiceOn = true;
let watchId = null;
let uploadTimer = null;
let myLat = null;
let myLng = null;
let myMarker = null;
let accuracyCircle = null;
let lastPosition = null;
let lastHeading = null;
let myHeading = null;
let currentSpeed = 0;
let cameras = [];
let cameraMarkers = [];
let camerasLoaded = false;
let lastWarningCameraId = null;
let lastWarningTime = 0;
let waypoints = [];
let wpMarkers = {};
let peerMarkers = {};          // user_id → L.marker
let routeLines = {};
let routeUpdateTimer = null;
let sosChannel = null;
let peerChannel = null;
let peerTimer = null;
let privatePins = [];
let privatePinMarkers = {};
let longPressTimer = null;
let longPressLatLng = null;
let tempPinMarker = null;
let pendingPinLatLng = null;

/* =========================================================
   6. 工具函式
   ========================================================= */
function number(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function bearingDegrees(lat1, lng1, lat2, lng2) {
  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;
  const dl = (lng2 - lng1) * Math.PI / 180;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function angleDifference(a, b) {
  return Math.abs(((a - b + 540) % 360) - 180);
}

function formatDistance(meters) {
  if (meters < 1000) return Math.round(meters) + " m";
  return (meters / 1000).toFixed(1) + " km";
}

function formatDuration(sec) {
  if (!Number.isFinite(sec) || sec < 0) return "--";
  if (sec < 60) return Math.round(sec) + " 秒";
  if (sec < 3600) return Math.round(sec / 60) + " 分";
  const h = Math.floor(sec / 3600);
  const m = Math.round((sec % 3600) / 60);
  return h + " 時 " + m + " 分";
}

function geoErrorText(error) {
  if (!error) return "未知錯誤";
  if (error.code === 1) return "定位權限被拒絕";
  if (error.code === 2) return "目前無法取得位置";
  if (error.code === 3) return "定位逾時";
  return error.message || String(error);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalizeHeading(value) {
  if (value == null || !Number.isFinite(Number(value))) return null;
  let h = Number(value) % 360;
  if (h < 0) h += 360;
  return h;
}

/* =========================================================
   7. 測速方向匹配
   ========================================================= */
function directMatchesHeading(direct, heading) {
  const text = String(direct || "");
  if (!Number.isFinite(heading)) return true;
  if (text.includes("南北")) {
    return Math.min(angleDifference(heading, 0), angleDifference(heading, 180)) <= 55;
  }
  if (text.includes("東西")) {
    return Math.min(angleDifference(heading, 90), angleDifference(heading, 270)) <= 55;
  }
  return true;
}

/* =========================================================
   9. 測速相機
   ========================================================= */
async function loadCameras() {
  if (camerasLoaded) return;
  try {
    const result = await sb.from(CAMERA_TABLE).select(
      "CityName,RegionName,Address,DeptNm,BranchNm,Longitude,Latitude,direct,limit"
    );
    if (result.error) {
      console.error("測速資料錯誤：", result.error);
      return;
    }
    cameras = (result.data || []).map(function (row, index) {
      return {
        id: index,
        city: String(row.CityName || ""),
        region: String(row.RegionName || ""),
        address: String(row.Address || ""),
        latitude: number(row.Latitude),
        longitude: number(row.Longitude),
        direct: String(row.direct || ""),
        speedLimit: number(row.limit)
      };
    }).filter(function (c) {
      return Number.isFinite(c.latitude) && Number.isFinite(c.longitude);
    });
    camerasLoaded = true;
    drawCameraMarkers();
    console.log("測速資料：", cameras.length);
  } catch (e) {
    console.error("測速資料載入例外：", e);
  }
}

function cameraMarkerIcon() {
  return L.divIcon({
    className: "pin-marker",
    html: '<div class="pin-emoji" style="font-size:22px;transform:none;line-height:1">📷</div>',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -12]
  });
}
function drawCameraMarkers() {
  cameraMarkers.forEach(function (m) {
    if (map.hasLayer(m)) map.removeLayer(m);
  });
  cameraMarkers = [];
  cameras.forEach(function (camera) {
    const marker = L.marker([camera.latitude, camera.longitude], {
      icon: cameraMarkerIcon(),
      zIndexOffset: 200
    });
    marker.bindPopup(
      "<strong>📷 測速照相</strong><br>" +
      (camera.address || "未提供地址") +
      "<br>速限：" + (camera.speedLimit ?? "--") + " km/h" +
      "<br>方向：" + (camera.direct || "--")
    );
    marker.addTo(map);
    cameraMarkers.push(marker);
  });
}

function findNearestRelevantCamera(lat, lng, heading) {
  let best = null;
  for (const camera of cameras) {
    const distance = distanceMeters(lat, lng, camera.latitude, camera.longitude);
    if (distance > 2000) continue;
    if (!directMatchesHeading(camera.direct, heading)) continue;
    if (Number.isFinite(heading)) {
      const toCamera = bearingDegrees(lat, lng, camera.latitude, camera.longitude);
      if (angleDifference(heading, toCamera) > 70) continue;
    }
    if (!best || distance < best.distance) {
      best = { camera: camera, distance: distance };
    }
  }
  return best;
}

function showCameraWarning(result) {
  if (!result) {
    speedBox.classList.remove("show");
    return;
  }
  const camera = result.camera;
  const distance = result.distance;
  const limit = camera.speedLimit;
  const overSpeed = Number.isFinite(limit) && currentSpeed > limit;

  speedBox.classList.add("show");
  speedBox.classList.toggle("danger", overSpeed);
  speedTitle.textContent = overSpeed ? "⚠️ 前方測速＋目前超速" : "📷 前方測速提醒";
  speedInfo.textContent =
    "距離 " + formatDistance(distance) +
    "｜速限 " + (limit ?? "--") + " km/h｜目前 " + Math.round(currentSpeed) + " km/h";
  speedAddress.textContent = camera.city + " " + camera.region + " " + camera.address;

  if (distance <= 700) {
    const now = Date.now();
    const shouldSpeak =
      lastWarningCameraId !== camera.id || (now - lastWarningTime > 30000);
    if (shouldSpeak) {
      speakCameraWarning(camera, distance, overSpeed);
      lastWarningCameraId = camera.id;
      lastWarningTime = now;
    }
  }
}

function speakCameraWarning(camera, distance, overSpeed) {
  if (!voiceOn) return;
  let text = "前方 " + Math.round(distance) + " 公尺測速照相";
  if (Number.isFinite(camera.speedLimit)) text += "，速限 " + camera.speedLimit + " 公里";
  if (overSpeed) text += "，目前超速，請減速";
  speak(text);
}

/* =========================================================
   10. GPS 速度與位置
   ========================================================= */
function getSpeed(position) {
  if (!position || !position.coords) return 0;
  const gpsSpeed = Number(position.coords.speed);
  if (Number.isFinite(gpsSpeed) && gpsSpeed >= 0) return gpsSpeed * 3.6;
  if (!lastPosition) return 0;
  const dt = (position.timestamp - lastPosition.timestamp) / 1000;
  if (dt <= 0) return 0;
  const d = distanceMeters(
    lastPosition.coords.latitude, lastPosition.coords.longitude,
    position.coords.latitude, position.coords.longitude
  );
  return (d / dt) * 3.6;
}

function onPosition(position) {
  if (!position || !position.coords) return;

  const coords = position.coords;
  const lat = Number(coords.latitude);
  const lng = Number(coords.longitude);
  const accuracy = Number(coords.accuracy);

  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

  if (Number.isFinite(accuracy) && accuracy > 300) {
    subEl.textContent = "GPS 訊號較弱 ±" + Math.round(accuracy) + "m";
    return;
  }

  // 速度
  let calculatedSpeed = getSpeed(position);
  if (!Number.isFinite(calculatedSpeed) || calculatedSpeed < 0) calculatedSpeed = 0;
  const gpsSpeed = Number(coords.speed);
  if (Number.isFinite(gpsSpeed) && gpsSpeed >= 0) calculatedSpeed = gpsSpeed * 3.6;
  if (calculatedSpeed > 200) calculatedSpeed = currentSpeed;

  if (Number.isFinite(currentSpeed) && currentSpeed > 0) {
    currentSpeed = currentSpeed * 0.65 + calculatedSpeed * 0.35;
  } else {
    currentSpeed = calculatedSpeed;
  }

  // 方向
  let heading = Number(coords.heading);
  if (!Number.isFinite(heading) && lastPosition) {
    const moved = distanceMeters(
      lastPosition.coords.latitude, lastPosition.coords.longitude, lat, lng
    );
    if (moved >= 6) {
      heading = bearingDegrees(
        lastPosition.coords.latitude, lastPosition.coords.longitude, lat, lng
      );
    }
  }
  if (Number.isFinite(heading) && currentSpeed >= 3) lastHeading = heading;
  if (!Number.isFinite(heading)) heading = lastHeading;
  if (!Number.isFinite(heading) && myHeading != null) heading = myHeading;

  myLat = lat;
  myLng = lng;

  currentSpeedEl.textContent = Math.round(currentSpeed);
  currentHeadingEl.textContent = Number.isFinite(heading) ? Math.round(heading) : "--";

  const now = new Date();
  subEl.textContent =
    "GPS ±" + (Number.isFinite(accuracy) ? Math.round(accuracy) : "--") + "m｜" +
    now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");

  // 自己標記（方向箭頭）
  const headingDeg = Number.isFinite(heading) ? heading : 0;
  const arrowHtml =
    '<div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;' +
    'transform:rotate(' + headingDeg + 'deg);filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));">' +
    '<div style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;' +
    'border-bottom:22px solid #06C755;"></div></div>';

  if (!myMarker) {
    myMarker = L.marker([myLat, myLng], {
      icon: L.divIcon({
        className: "my-location-arrow",
        html: arrowHtml,
        iconSize: [36, 36],
        iconAnchor: [18, 18]
      }),
      zIndexOffset: 1000
    }).addTo(map).bindPopup("我的位置");
  } else {
    myMarker.setLatLng([myLat, myLng]);
    myMarker.setIcon(L.divIcon({
      className: "my-location-arrow",
      html: arrowHtml,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    }));
  }

  if (Number.isFinite(accuracy)) {
    if (!accuracyCircle) {
      accuracyCircle = L.circle([myLat, myLng], {
        radius: accuracy, weight: 1, fillOpacity: 0.06, color: "#06C755"
      }).addTo(map);
    } else {
      accuracyCircle.setLatLng([myLat, myLng]);
      accuracyCircle.setRadius(accuracy);
    }
  }

  // 導航模式跟隨（Uber-like）

  if (navigationOn && camerasLoaded) {
    showCameraWarning(findNearestRelevantCamera(myLat, myLng, heading));
  }

  if (me && (shareOn || navigationOn)) {
    uploadLocation();
  }

  scheduleRouteUpdate();
  updateNavigationPosition();
  lastPosition = position;
}

function startGPS() {
  if (!navigator.geolocation) {
    alert("此裝置不支援 GPS 定位");
    return false;
  }
  if (location.protocol !== "https:" && location.hostname !== "localhost") {
    alert("定位需要 HTTPS，請使用 GitHub Pages 或正式網域");
    return false;
  }
  if (watchId !== null) return true;

  watchId = navigator.geolocation.watchPosition(
    onPosition,
    function (error) {
      subEl.textContent = "GPS：" + geoErrorText(error);
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 12000 }
  );
  return true;
}

function stopGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  if (uploadTimer) {
    clearInterval(uploadTimer);
    uploadTimer = null;
  }
}

/* =========================================================
   12. 語音
   ========================================================= */
let speechReady = false;
let selectedVoice = null;
const savedVoiceName = localStorage.getItem("safeReunionVoice");

function getAvailableVoices() {
  if (!("speechSynthesis" in window)) return [];
  return window.speechSynthesis.getVoices();
}

function chooseDefaultVoice() {
  const voices = getAvailableVoices();
  if (!voices.length) return null;
  if (savedVoiceName) {
    const saved = voices.find(function (v) { return v.name === savedVoiceName; });
    if (saved) return saved;
  }
  let voice = voices.find(function (v) { return v.lang.toLowerCase() === "zh-tw"; });
  if (!voice) voice = voices.find(function (v) { return v.lang.toLowerCase().startsWith("zh"); });
  if (!voice) voice = voices[0];
  return voice;
}

function initSpeech() {
  if (!("speechSynthesis" in window)) return;
  function refresh() {
    const voices = getAvailableVoices();
    if (voices.length) {
      speechReady = true;
      if (!selectedVoice) selectedVoice = chooseDefaultVoice();
    }
  }
  refresh();
  window.speechSynthesis.onvoiceschanged = refresh;
}

function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window) || !text) return;
  const voices = getAvailableVoices();
  if (!selectedVoice && voices.length) selectedVoice = chooseDefaultVoice();
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (selectedVoice) {
      u.voice = selectedVoice;
      u.lang = selectedVoice.lang;
    } else {
      u.lang = "zh-TW";
    }
    u.rate = 0.95;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {
    console.error("語音錯誤：", e);
  }
}

function unlockSpeech() {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("語音導航已開啟");
    u.lang = selectedVoice ? selectedVoice.lang : "zh-TW";
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function showVoiceSelector() {
  const voices = getAvailableVoices();
  if (!voices.length) {
    alert("目前還沒有取得手機語音清單，請稍後再試。");
    return;
  }
  const chinese = voices.filter(function (v) {
    return v.lang.toLowerCase().startsWith("zh");
  });
  const list = chinese.length ? chinese : voices;
  let message = "選擇語音：\n\n";
  list.forEach(function (v, i) {
    message += (i + 1) + ". " + v.name + "（" + v.lang + "）";
    if (selectedVoice && v.name === selectedVoice.name) message += " ✓";
    message += "\n";
  });
  const answer = prompt(message + "\n請輸入編號：");
  if (answer === null) return;
  const index = parseInt(answer, 10);
  if (!Number.isInteger(index) || index < 1 || index > list.length) {
    alert("編號無效");
    return;
  }
  selectedVoice = list[index - 1];
  localStorage.setItem("safeReunionVoice", selectedVoice.name);
  speak("這是新的導航語音");
}

voiceBtn.onclick = function () {
  voiceOn = !voiceOn;
  if (voiceOn) {
    voiceBtn.textContent = "🔊";
    voiceBtn.classList.remove("silent");
    unlockSpeech();

    voiceBtn.textContent = "🔇";

async function startShare() {
  if (!navigator.geolocation) {
    alert("此裝置不支援定位");
    return;
  }
  shareOn = true;
  btnShare.textContent = "關閉定位分享";
  btnShare.className = "btn btn-red";
  shareStatus.textContent = "定位：開啟中…";

  await startDeviceOrientation();
  if (!startGPS()) {
    shareOn = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function (position) {
      onPosition(position);
      if (myLat != null && myLng != null) {
        map.setView([myLat, myLng], 15);
      }
      shareStatus.textContent = "定位：開啟（分享中）";
      uploadLocation();
    },
    function (error) {
      shareOn = false;
      if (!navigationOn) stopGPS();
      btnShare.textContent = "開啟定位分享";
      btnShare.className = "btn btn-green";
      shareStatus.textContent = "定位：關閉";
      alert("定位失敗：" + geoErrorText(error));
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );

  if (!uploadTimer) {
    uploadTimer = setInterval(function () {
      if (shareOn || navigationOn) {
        uploadLocation().then(function () {
          loadPeers();
        });
      }
    }, 2500);
  }
  // 立刻再拉一次成員，避免對方已分享卻看不到
  setTimeout(loadPeers, 800);
  setTimeout(loadPeers, 2500);
}

function stopShare() {
  shareOn = false;
  if (!navigationOn) stopGPS();
  btnShare.textContent = "開啟定位分享";
  btnShare.className = "btn btn-green";
  shareStatus.textContent = "定位：關閉";
  subEl.textContent = navigationOn ? "導航中" : "定位已關閉";
}

btnShare.onclick = function () {
  if (shareOn) stopShare();
  else startShare();
};

/* 裝置方向 */
function handleDeviceOrientation(event) {
  let heading = null;
  if (event.webkitCompassHeading != null && Number.isFinite(Number(event.webkitCompassHeading))) {
    heading = Number(event.webkitCompassHeading);
  } else if (event.alpha != null && Number.isFinite(Number(event.alpha))) {
    heading = 360 - Number(event.alpha);
  }
  heading = normalizeHeading(heading);
  if (heading != null) myHeading = heading;
}

async function startDeviceOrientation() {
  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") return false;
    }
    window.addEventListener("deviceorientation", handleDeviceOrientation, true);
    return true;
  } catch (e) {
    console.error("方向感測失敗：", e);
    return false;
  }
}

/* 上傳位置（失敗會顯示在畫面上，方便排查） */
let lastUploadOk = false;
let lastUploadError = "";
let lastUploadAt = 0;

async function uploadLocation() {
  if (!me || !me.id || !roomId) {
    if (shareOn && shareStatus) {
      shareStatus.textContent = "定位：未登入，無法分享給他人";
      shareStatus.style.color = "#c62828";
    }
    return;
  }
  if (myLat == null || myLng == null) return;

  const payload = {
    user_id: me.id,
    room_id: String(roomId),
    lat: Number(myLat),
    lng: Number(myLng),
    display_name:
      (me.user_metadata && me.user_metadata.full_name) ||
      (me.email ? me.email.split("@")[0] : "成員"),
    updated_at: new Date().toISOString(),
    heading: myHeading != null ? Number(myHeading) : (lastHeading != null ? Number(lastHeading) : null)
  };

  try {
    // 先查是否已有自己在此房間的定位（不依賴 id 欄位）
    const existing = await sb
      .from("location_shares")
      .select("user_id,room_id")
      .eq("user_id", me.id)
      .eq("room_id", String(roomId))
      .maybeSingle();

    let result;

    if (existing.error && existing.error.code !== "PGRST116") {
      result = existing;
    } else if (existing.data) {
      // 已有 → 只更新座標與時間
      result = await sb
        .from("location_shares")
        .update({
          lat: payload.lat,
          lng: payload.lng,
          display_name: payload.display_name,
          updated_at: payload.updated_at,
          heading: payload.heading
        })
        .eq("user_id", me.id)
        .eq("room_id", String(roomId));
    } else {
      // 沒有 → 新增
      result = await sb.from("location_shares").insert(payload);
    }

    // 若仍因競態撞到唯一鍵，再強制 update
    if (result.error && /duplicate key|unique constraint/i.test(result.error.message || "")) {
      result = await sb
        .from("location_shares")
        .update({
          lat: payload.lat,
          lng: payload.lng,
          display_name: payload.display_name,
          updated_at: payload.updated_at,
          heading: payload.heading
        })
        .eq("user_id", me.id)
        .eq("room_id", String(roomId));
    }

    if (result.error) {
      lastUploadOk = false;
      lastUploadError = result.error.message || String(result.error);
      console.error("定位上傳失敗：", result.error);
      if (shareStatus) {
        shareStatus.style.color = "#c62828";
        shareStatus.textContent = "上傳失敗：" + lastUploadError.slice(0, 70);
      }
      return;
    }

    lastUploadOk = true;
    lastUploadError = "";
    lastUploadAt = Date.now();
    if (shareStatus && shareOn) {
      shareStatus.style.color = "#166534";
      shareStatus.textContent =
        "定位：分享中 ✓ " +
        new Date().toLocaleTimeString("zh-TW", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
    }
  } catch (e) {
    lastUploadOk = false;
    lastUploadError = e.message || String(e);
    console.error("定位上傳例外：", e);
    if (shareStatus) {
      shareStatus.style.color = "#c62828";
      shareStatus.textContent = "上傳例外：" + lastUploadError.slice(0, 50);
    }
  }
}

const MEMBER_PIN_COLORS = [
  "#1565C0", "#2E7D32", "#EF6C00", "#6A1B9A", "#C62828",
  "#00838F", "#AD1457", "#5D4037", "#283593", "#558B2F"
];

function memberColorFromId(userId) {
  const text = String(userId || "member");
  let hash = 0;
  for (let i = 0; i < text.length; i++) {
    hash = ((hash << 5) - hash) + text.charCodeAt(i);
    hash |= 0;
  }
  return MEMBER_PIN_COLORS[Math.abs(hash) % MEMBER_PIN_COLORS.length];
}

function createMemberPinIcon(color) {
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="42" height="52" viewBox="0 0 42 52">' +
    '<path d="M21 1C10 1 2 9.4 2 20c0 13.5 19 30 19 30s19-16.5 19-30C40 9.4 32 1 21 1z" ' +
    'fill="' + color + '" stroke="#ffffff" stroke-width="3"/>' +
    '<circle cx="21" cy="20" r="8" fill="#ffffff"/>' +
    '<circle cx="21" cy="20" r="4" fill="' + color + '"/>' +
    "</svg>";
  return L.divIcon({
    className: "group-member-leaflet-icon",
    html: '<div style="width:42px;height:52px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));">' + svg + "</div>",
    iconSize: [42, 52],
    iconAnchor: [21, 50],
    popupAnchor: [0, -48]
  });
}

function createMemberPopup(row, color) {
  const name = row.display_name || "成員";
  const updated = row.updated_at
    ? new Date(row.updated_at).toLocaleString("zh-TW")
    : "未知";
  return (
    '<div style="min-width:160px;font-size:14px;">' +
    '<div style="font-size:15px;font-weight:700;margin-bottom:6px;color:' + color + ';">📍 ' +
    escapeHtml(name) + "</div>" +
    '<div style="margin-bottom:4px;"><b>最後定位：</b><br>' + escapeHtml(updated) + "</div>" +
    '<div style="font-size:11px;color:#888;margin-top:6px;">此顏色為固定識別色</div></div>'
  );
}

async function loadPeers() {
  if (!roomId) return;
  try {
    // 讀取本房間全部定位（先不過濾時間，避免時鐘差造成全消失）
    let result = await sb
      .from("location_shares")
      .select("*")
      .eq("room_id", String(roomId));

    // 若 0 筆，再試一次不轉型比對（少數專案 room_id 型別不一致）
    if (!result.error && (!result.data || result.data.length === 0)) {
      const allTry = await sb.from("location_shares").select("*").limit(50);
      if (!allTry.error && allTry.data && allTry.data.length) {
        const matched = allTry.data.filter(function (r) {
          return String(r.room_id) === String(roomId);
        });
        if (matched.length) {
          result = { data: matched, error: null };
        } else if (partStatus) {
          // 顯示實際存在的 room_id，方便對照
          const rooms = {};
          allTry.data.forEach(function (r) {
            rooms[String(r.room_id)] = (rooms[String(r.room_id)] || 0) + 1;
          });
          partStatus.style.color = "#c62828";
          partStatus.textContent =
            "房間不匹配｜我的 room=" + String(roomId) +
            "｜資料庫有：" + Object.keys(rooms).slice(0, 5).join(", ");
          console.warn("[loadPeers] room mismatch", roomId, rooms);
        }
      }
    }

    if (result.error) {
      console.error("成員定位錯誤：", result.error);
      if (partStatus) {
        partStatus.style.color = "#c62828";
        partStatus.textContent =
          "讀取成員失敗：" + (result.error.message || "").slice(0, 60);
      }
      return;
    }

    let rows = result.data || [];
    const rawCount = rows.length;

    // 不再用時間過濾：安全團聚優先「看得到人」
    // 只要本房間有有效座標就顯示
    rows = rows.filter(function (row) {
      if (!row) return false;
      const lat = Number(row.lat != null ? row.lat : row.latitude);
      const lng = Number(row.lng != null ? row.lng : row.longitude);
      return Number.isFinite(lat) && Number.isFinite(lng);
    });

    window._lastPeerRows = rows;
    const activePeerIds = {};
    const boundsPts = [];

    rows.forEach(function (row) {
      if (!row || row.user_id == null) return;

      // 相容 lat/lng 或 latitude/longitude
      const lat = Number(row.lat != null ? row.lat : row.latitude);
      const lng = Number(row.lng != null ? row.lng : row.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

      const userId = String(row.user_id);
      const isSelf = me && userId === String(me.id);

      if (!isSelf) {
        activePeerIds[userId] = true;
        const color = memberColorFromId(userId);
        const name = row.display_name || row.name || "成員";

        if (peerMarkers[userId]) {
          peerMarkers[userId].setLatLng([lat, lng]);
          peerMarkers[userId].setPopupContent(
            createMemberPopup(
              { display_name: name, updated_at: row.updated_at, user_id: userId },
              color
            )
          );
        } else {
          const marker = L.marker([lat, lng], {
            icon: createMemberPinIcon(color),
            zIndexOffset: 500
          })
            .addTo(map)
            .bindPopup(
              createMemberPopup(
                { display_name: name, updated_at: row.updated_at, user_id: userId },
                color
              )
            );
          marker.on("click", function () { marker.openPopup(); });
          peerMarkers[userId] = marker;
        }
        boundsPts.push([lat, lng]);
      } else if (myLat != null && myLng != null) {
        boundsPts.push([myLat, myLng]);
      }
    });

    Object.keys(peerMarkers).forEach(function (userId) {
      if (!activePeerIds[userId]) {
        if (map.hasLayer(peerMarkers[userId])) map.removeLayer(peerMarkers[userId]);
        delete peerMarkers[userId];
      }
    });

    const otherCount = Object.keys(activePeerIds).length;
    const selfCount = (shareOn && myLat != null && lastUploadOk) ? 1 : 0;

    if (partStatus) {
      partStatus.style.color = otherCount > 0 ? "#166534" : "#555";
      partStatus.textContent =
        "可見 " + (otherCount + selfCount) +
        " 人｜DB本房 " + rawCount + " 筆(有座標" + rows.length + ")" +
        "｜room=" + String(roomId).slice(0, 12);
      if (otherCount === 0 && rawCount === 0 && shareOn) {
        partStatus.textContent += "｜對方可能不同房間或未寫入";
      }
    }

    // 有其他成員時，自動把地圖縮放到大家都能看到
    
    scheduleRouteUpdate();
  } catch (e) {
    console.error("成員定位例外：", e);
    if (partStatus) {
      partStatus.style.color = "#c62828";
      partStatus.textContent = "讀取例外：" + (e.message || e);
    }
  }
}

function startPeerRealtime() {
  if (!roomId || !sb || peerChannel) return;
  peerChannel = sb
    .channel("location-shares-" + roomId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "location_shares",
        filter: "room_id=eq." + roomId
      },
      function () { loadPeers(); }
    )
    .subscribe(function (status) {
      console.log("成員定位 Realtime：", status);
    });
}

function startPeerPolling() {
  if (peerTimer) clearInterval(peerTimer);
  loadPeers();
  // 2.5 秒同步一次，接近 Uber 即時感，也避免 Realtime 沒開時完全看不到
  peerTimer = setInterval(function () {
    if (roomId) loadPeers();
  }, 2500);
}

async function loadWaypoints() {
  if (!me) return;
  const result = await sb
    .from("meetup_waypoints")
    .select("*")
    .eq("room_id", roomId)
    .order("seq", { ascending: true });

  if (result.error) {
    console.error("集合點載入錯誤：", result.error);
    return;
  }
  waypoints = result.data || [];
  renderWaypoints();
  scheduleRouteUpdate();
}

function renderWaypoints() {
  Object.keys(wpMarkers).forEach(function (key) {
    if (map.hasLayer(wpMarkers[key])) map.removeLayer(wpMarkers[key]);
  });
  wpMarkers = {};

  const box = document.getElementById("wpList");
  box.innerHTML = "";

  if (!waypoints.length) {
    box.innerHTML = '<div style="color:#888;font-size:12px;padding:8px 0">尚未設定行程點</div>';
    return;
  }

  waypoints.forEach(function (w) {
    const isOwner = me && w.created_by && String(w.created_by) === String(me.id);
    const marker = L.marker([w.lat, w.lng], {
      icon: createColoredPinIcon("#e53935"),
      draggable: !!isOwner
    }).addTo(map);

    if (isOwner) {
      marker.on("dragend", async function (e) {
        const pos = e.target.getLatLng();
        const result = await sb
          .from("meetup_waypoints")
          .update({ lat: pos.lat, lng: pos.lng })
          .eq("id", w.id);
        if (result.error) {
          alert("移動集合點失敗：" + result.error.message);
          marker.setLatLng([w.lat, w.lng]);
          return;
        }
        w.lat = pos.lat;
        w.lng = pos.lng;
        await loadWaypoints();
      });
    }

    const timeStr = w.meet_at
      ? new Date(w.meet_at).toLocaleString("zh-TW")
      : "時間未定";
    const ownerHint = isOwner
      ? '<br><span style="font-size:11px;color:#888">可拖曳移動（僅建立者）</span>'
      : "";

    marker.bindPopup(
      "<b>📍 #" + w.seq + " " + escapeHtml(w.title) + "</b><br>" +
      escapeHtml(timeStr) + ownerHint
    );
    wpMarkers[w.id] = marker;

    const div = document.createElement("div");
    div.className = "wp-item";
    div.innerHTML =
      '<div class="num">' + escapeHtml(w.seq) + "</div>" +
      '<div style="flex:1">' +
      '<div style="font-weight:600">' + escapeHtml(w.title) + "</div>" +
      '<div style="color:#888;margin-top:2px">' + escapeHtml(timeStr) + "</div></div>" +
      '<button type="button" class="btn btn-outline">刪</button>';
    div.querySelector("button").onclick = function () { deleteWp(w.id); };
    box.appendChild(div);
  });
}

async function addWaypoint(lat, lng) {
  if (!me) {
    alert("請先登入才能設定集合點");
    return;
  }
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
    alert("集合點座標無效");
    return;
  }

  const titleInput = document.getElementById("wpTitle");
  const timeInput = document.getElementById("wpTime");
  const title = titleInput.value.trim() || ("集合點 " + (waypoints.length + 1));
  let meetAt = null;
  if (timeInput.value) {
    const date = new Date(timeInput.value);
    if (!Number.isNaN(date.getTime())) meetAt = date.toISOString();
  }

  const seq = waypoints.length
    ? Math.max.apply(null, waypoints.map(function (w) { return Number(w.seq) || 0; })) + 1
    : 1;

  const result = await sb
    .from("meetup_waypoints")
    .insert({
      room_id: roomId,
      seq: seq,
      title: title,
      lat: lat,
      lng: lng,
      meet_at: meetAt,
      created_by: me.id
    })
    .select()
    .single();

  if (result.error) {
    alert("集體集合點新增失敗：" + result.error.message);
    return;
  }

  titleInput.value = "";
  timeInput.value = "";
  await loadWaypoints();
}

async function deleteWp(id) {
  if (!me) {
    alert("請先登入後再刪除集合點");
    return;
  }
  if (!confirm("確定要刪除這個集合點嗎？")) return;

  const result = await sb.from("meetup_waypoints").delete().eq("id", id).select();
  if (result.error) {
    alert("刪除失敗：\n" + result.error.message);
    return;
  }
  if (!result.data || result.data.length === 0) {
    alert("刪除失敗：可能是權限不足（RLS）或集合點不存在。");
    return;
  }
  await loadWaypoints();
}

const GOOGLE_SEARCH_LIMIT = 8000;

function getSearchCountKey() {
  const now = new Date();
  return "google_search_count_" + now.getFullYear() + "_" + (now.getMonth() + 1);
}
function getSearchCount() {
  return parseInt(localStorage.getItem(getSearchCountKey()) || "0", 10);
}
function increaseSearchCount() {
  const key = getSearchCountKey();
  const count = getSearchCount() + 1;
  localStorage.setItem(key, String(count));
  updateSearchCountLabel();
  return count;
}
function updateSearchCountLabel() {
  const el = document.getElementById("searchCountLabel");
  if (!el) return;
  if (currentMapMode === "google") {
    const count = getSearchCount();
    el.style.display = "";
    el.textContent = "Google：" + count + " / 10000";
    el.style.color = count >= GOOGLE_SEARCH_LIMIT ? "#c62828" : "#666";
  } else {
    el.style.display = "none";
  }
}

async function searchPlace() {
  const input = document.getElementById("searchInput");
  const q = input.value.trim();
  if (!q) {
    alert("請輸入地址或地名");
    return;
  }

  const box = document.getElementById("searchResults");
  box.style.display = "block";
  box.innerHTML = '<div style="padding:10px;color:#888;font-size:12px">搜尋中…</div>';

  try {
    let results = [];

    if (currentMapMode === "google" && getSearchCount() >= GOOGLE_SEARCH_LIMIT) {
      alert("本月 Google 搜尋已達上限，已切回地圖模式。");
      switchMapMode("taiwan");
    }

    if (currentMapMode === "taiwan") {
      const landmarks = {
        "台北車站": { name: "台北車站", lat: 25.0478, lng: 121.5170 },
        "臺北車站": { name: "台北車站", lat: 25.0478, lng: 121.5170 },
        "桃園機場": { name: "桃園國際機場", lat: 25.0797, lng: 121.2342 },
        "台北101": { name: "台北101", lat: 25.0340, lng: 121.5645 },
        "花蓮車站": { name: "花蓮車站", lat: 23.9929, lng: 121.6013 },
        "台中車站": { name: "台中車站", lat: 24.1369, lng: 120.6867 },
        "高雄車站": { name: "高雄車站", lat: 22.6398, lng: 120.3022 },
        "西門町": { name: "西門町", lat: 25.0421, lng: 121.5080 },
        "故宮": { name: "國立故宮博物院", lat: 25.1023, lng: 121.5485 }
      };
      const qNorm = q.replace(/\s+/g, "").toLowerCase();
      let hit = null;
      Object.keys(landmarks).forEach(function (key) {
        if (hit) return;
        const k = key.replace(/\s+/g, "").toLowerCase();
        if (qNorm === k || qNorm.indexOf(k) !== -1 || k.indexOf(qNorm) !== -1) {
          hit = landmarks[key];
        }
      });

      if (hit) {
        results = [{ name: hit.name, lat: hit.lat, lng: hit.lng }];
      } else {
        const url =
          "https://nominatim.openstreetmap.org/search?format=json&q=" +
          encodeURIComponent(q + " 台灣") +
          "&limit=8&countrycodes=tw&accept-language=zh-TW&addressdetails=1";
        const response = await fetch(url, {
          headers: {
            "Accept": "application/json",
            "User-Agent": "SafeReunionMap/1.0"
          }
        });
        if (response.ok) {
          const arr = await response.json();
          results = (arr || []).map(function (item) {
            return {
              name: item.display_name,
              lat: parseFloat(item.lat),
              lng: parseFloat(item.lon)
            };
          });
        }
      }
    } else if (currentMapMode === "google") {
      const { data, error } = await sb.functions.invoke("geocode", {
        body: { address: q }
      });
      if (error) throw new Error(error.message || "Google 搜尋失敗");
      if (data && data.error) throw new Error(data.error);
      results = (data && data.results) ? data.results : [];
      const count = increaseSearchCount();
      if (count >= GOOGLE_SEARCH_LIMIT) {
        setTimeout(function () {
          alert("本月 Google 搜尋已達上限，已切回地圖模式。");
          switchMapMode("taiwan");
        }, 400);
      }
    }

    box.innerHTML = "";
    if (!results.length) {
      box.innerHTML = '<div style="padding:10px;color:#888;font-size:12px">找不到地點</div>';
      return;
    }

    results.forEach(function (item) {
      const div = document.createElement("div");
      div.style.cssText = "padding:10px;border-bottom:1px solid #eee;font-size:12px;cursor:pointer;";
      div.textContent = item.name;
      div.onclick = async function () {
        if (!Number.isFinite(item.lat) || !Number.isFinite(item.lng)) {
          alert("搜尋結果座標無效");
          return;
        }
        const titleInput = document.getElementById("wpTitle");
        if (!titleInput.value.trim()) {
          titleInput.value = (item.name || "").split(/[,，]/)[0];
        }
        map.setView([item.lat, item.lng], 17);
        box.style.display = "none";
        await addWaypoint(item.lat, item.lng);
      };
      box.appendChild(div);
    });
  } catch (error) {
    console.error("地址搜尋錯誤：", error);
    box.innerHTML =
      '<div style="padding:10px;color:#c62828;font-size:12px">搜尋失敗：' +
      (error.message || "請稍後再試") + "</div>";
  }
}

function clearAllRouteLines() {
  Object.keys(routeLines).forEach(function (key) {
    if (map.hasLayer(routeLines[key])) {
      map.removeLayer(routeLines[key]);
    }
  });
  routeLines = {};
}

   目前使用的集合點
--------------------------------------------------------- */

function getActiveMeetingPoint() {
  if (!waypoints || !waypoints.length) return null;
  return waypoints[0];
}


/* ---------------------------------------------------------
   OSRM 路線
   steps=true → 同時取得逐步導航資料
--------------------------------------------------------- */

async function fetchRouteCoords(fromLat, fromLng, toLat, toLng) {

  const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    fromLng + "," + fromLat + ";" +
    toLng + "," + toLat +
    "?overview=full" +
    "&geometries=geojson" +
    "&steps=true";

  try {

    const res = await fetch(url);

    if (!res.ok) {
      console.error("OSRM HTTP 錯誤：", res.status);
      return null;
    }

    const data = await res.json();

    if (
      !data.routes ||
      !data.routes.length
    ) {
      return null;
    }

    const route = data.routes[0];

    const coords =
      route.geometry.coordinates.map(function (c) {
        return [c[1], c[0]];
      });

    /*
       取得逐步導航步驟
    */

    let steps = [];

    if (
      route.legs &&
      route.legs.length
    ) {

      route.legs.forEach(function (leg) {

        if (
          leg.steps &&
          Array.isArray(leg.steps)
        ) {

          steps = steps.concat(leg.steps);

        }

      });

    }

    return {
      coords: coords,
      distance: route.distance,
      duration: route.duration,
      steps: steps
    };

  } catch (e) {

    console.error("路線取得失敗：", e);

    return null;

  }

}


/* ---------------------------------------------------------
   畫路線
--------------------------------------------------------- */

function drawRouteLine(key, coords, isSelf, color) {

  if (
    routeLines[key] &&
    map.hasLayer(routeLines[key])
  ) {
    map.removeLayer(routeLines[key]);
  }

  if (
    !coords ||
    coords.length < 2
  ) {
    return;
  }

  const line =
    L.polyline(
      coords,
      {
        color:
          color ||
          (isSelf ? "#1565c0" : "#7e57c2"),

        weight:
          isSelf ? 5 : 4,

        opacity:
          isSelf ? 0.9 : 0.65,

        dashArray:
          isSelf ? null : "10, 10",

        lineJoin: "round"
      }
    ).addTo(map);

  routeLines[key] = line;

}

let navigationSteps = [];

/* ---------------------------------------------------------
   將 OSRM maneuver 轉成中文
--------------------------------------------------------- */

function getManeuverText(step) {

  if (!step || !step.maneuver) {
    return "繼續行駛";
  }

  const type =
    step.maneuver.type || "";

  const modifier =
    step.maneuver.modifier || "";

  const name =
    step.name || "";

  let action = "";

  if (type === "depart") {
    action = "出發";
  }

  else if (type === "arrive") {
    action = "抵達目的地";
  }

  else if (type === "turn") {

    if (modifier === "left") {
      action = "左轉";
    }

    else if (modifier === "right") {
      action = "右轉";
    }

    else if (
      modifier === "slight left"
    ) {
      action = "向左前方";
    }

    else if (
      modifier === "slight right"
    ) {
      action = "向右前方";
    }

    else if (
      modifier === "sharp left"
    ) {
      action = "向左急轉";
    }

    else if (
      modifier === "sharp right"
    ) {
      action = "向右急轉";
    }

    else {
      action = "轉彎";
    }

  }

  else if (
    type === "continue"
  ) {

    if (modifier === "left") {
      action = "靠左行駛";
    }

    else if (modifier === "right") {
      action = "靠右行駛";
    }

    else {
      action = "繼續直行";
    }

  }

  else if (
    type === "new name"
  ) {

    action = "繼續行駛";

  }

  else if (
    type === "merge"
  ) {

    action = "併入道路";

  }

  else if (
    type === "on ramp"
  ) {

    action = "進入匝道";

  }

  else if (
    type === "off ramp"
  ) {

    action = "離開匝道";

  }

  else if (
    type === "fork"
  ) {

    if (modifier === "left") {
      action = "在岔路靠左";
    }

    else if (modifier === "right") {
      action = "在岔路靠右";
    }

    else {
      action = "通過岔路";
    }

  }

  else if (
    type === "roundabout" ||
    type === "rotary"
  ) {

    action = "進入圓環";

  }

  else if (
    type === "exit roundabout" ||
    type === "exit rotary"
  ) {

    action = "離開圓環";

  }

  else if (
    type === "uturn"
  ) {

    action = "迴轉";

  }

  else if (
    type === "notification"
  ) {

    action = "注意前方道路";

  }

  else {

    action = "繼續行駛";

  }


  /*
     如果有道路名稱
  */

  if (
    name &&
    type !== "arrive"
  ) {

    return action + "，進入 " + name;

  }

  return action;

}


/* ---------------------------------------------------------
   距離格式
--------------------------------------------------------- */

function formatNavigationDistance(meters) {

  meters = Number(meters) || 0;

  if (meters >= 1000) {

    return (
      (meters / 1000)
        .toFixed(meters >= 10000 ? 0 : 1)
      + " 公里"
    );

  }

  if (meters >= 100) {

    return (
      Math.round(meters / 10) * 10
      + " 公尺"
    );

  }

  return (
    Math.max(10, Math.round(meters / 10) * 10)
    + " 公尺"
  );

}


/* ---------------------------------------------------------
   導航步驟初始化
--------------------------------------------------------- */

function prepareNavigationSteps(route) {

  navigationSteps = [];

  navigationStepIndex = 0;

  navigationLastAnnounce = 0;

  navigationLastStepIndex = -1;

  if (
    !route ||
    !Array.isArray(route.steps)
  ) {
    return;
  }

  navigationSteps =
    route.steps.filter(function (step) {

      if (!step || !step.maneuver) {
        return false;
      }

      const type =
        step.maneuver.type || "";

      return (
        type !== "depart"
      );

    });

}


/* ---------------------------------------------------------
   尋找目前最接近的導航步驟
--------------------------------------------------------- */

function getNavigationStepDistance(step) {

  if (
    !step ||
    !step.maneuver ||
    !step.maneuver.location
  ) {
    return Infinity;
  }

  const loc =
    step.maneuver.location;

  if (
    !Array.isArray(loc) ||
    loc.length < 2
  ) {
    return Infinity;
  }

  const lng = Number(loc[0]);
  const lat = Number(loc[1]);

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ) {
    return Infinity;
  }

  return distanceMeters(
    myLat,
    myLng,
    lat,
    lng
  );

}


/* ---------------------------------------------------------
   導航語音判斷
--------------------------------------------------------- */

function updateNavigationVoice() {

  if (
    !navigationOn ||
    !voiceOn ||
    myLat == null ||
    myLng == null ||
    !navigationSteps.length
  ) {
    return;
  }


  /*
     從目前步驟開始尋找最近的轉彎
  */

  let bestIndex =
    navigationStepIndex;

  let bestDistance =
    Infinity;


  for (
    let i = navigationStepIndex;
    i < navigationSteps.length;
    i++
  ) {

    const d =
      getNavigationStepDistance(
        navigationSteps[i]
      );

    if (d < bestDistance) {

      bestDistance = d;

      bestIndex = i;

    }

  }


  navigationStepIndex =
    bestIndex;


  const step =
    navigationSteps[navigationStepIndex];

  if (!step) return;


  const distance =
    getNavigationStepDistance(step);


  const now =
    Date.now();


  /*
     抵達
  */

  if (
    step.maneuver &&
    step.maneuver.type === "arrive"
  ) {

    if (
      now - navigationLastAnnounce > 15000
    ) {

      speak("您已抵達目的地");

      navigationLastAnnounce = now;

    }

    return;

  }


  const instruction =
    getManeuverText(step);


  /*
     500 公尺提醒
  */

  if (
    distance <= 550 &&
    distance > 250 &&
    navigationLastStepIndex !==
      navigationStepIndex
  ) {

    speak(
      "前方約 " +
      formatNavigationDistance(distance) +
      "，" +
      instruction
    );

    navigationLastStepIndex =
      navigationStepIndex;

    navigationLastAnnounce =
      now;

    return;

  }


  /*
     200 公尺再次提醒
  */

  if (
    distance <= 250 &&
    distance > 80 &&
    now - navigationLastAnnounce > 12000
  ) {

    speak(
      "前方 " +
      formatNavigationDistance(distance) +
      "，" +
      instruction
    );

    navigationLastAnnounce =
      now;

    return;

  }


  /*
     80 公尺內再次提醒
  */

  if (
    distance <= 80 &&
    now - navigationLastAnnounce > 10000
  ) {

    speak(
      "現在，" +
      instruction
    );

    navigationLastAnnounce =
      now;

    /*
       進入下一步
    */

    if (
      navigationStepIndex <
      navigationSteps.length - 1
    ) {

      navigationStepIndex++;

    }

  }

}

let driving3D = false;

function setDriving3D(on) {
  driving3D = !!on;

  if (btn3DMode) {
    btn3DMode.textContent =
      driving3D ? "🗺️ 平面模式" : "🚗 3D駕駛";

    btn3DMode.classList.toggle("btn-green", driving3D);
    btn3DMode.classList.toggle("btn-outline", !driving3D);
  }

  if (driving3D) {
    startDriving3D();

}

function startDriving3D() {
  if (!map || driving3DOverlay) return;

  const container = map.getContainer();

  driving3DOverlay = document.createElement("div");

  driving3DOverlay.id = "driving3DOverlay";

  driving3DOverlay.style.cssText =
    "position:absolute;" +
    "left:0;" +
    "right:0;" +
    "top:0;" +
    "bottom:0;" +
    "pointer-events:none;" +
    "z-index:450;" +
    "overflow:hidden;" +
    "perspective:700px;";

  container.appendChild(driving3DOverlay);

  renderDriving3D();

  if (driving3DFrame) {
    cancelAnimationFrame(driving3DFrame);
  }

  function loop() {
    if (!driving3D) return;

    renderDriving3D();

    driving3DFrame =
      requestAnimationFrame(loop);
  }

  loop();
}

function stopDriving3D() {
  if (driving3DFrame) {
    cancelAnimationFrame(driving3DFrame);
    driving3DFrame = null;
  }

  if (driving3DOverlay) {
    driving3DOverlay.remove();
    driving3DOverlay = null;

  if (map) {

/* =========================================================
   更新全部路線
========================================================= */

async function updateAllRoutes() {

  const target =
    getActiveMeetingPoint();


  if (
    !target ||
    !Number.isFinite(
      Number(target.lat)
    ) ||
    !Number.isFinite(
      Number(target.lng)
    )
  ) {

    clearAllRouteLines();

    navigationSteps = [];

    if (navEtaBox) {
      navEtaBox.style.display = "none";
    }

    return;

  }


  /* =======================================================
     自己
  ======================================================= */

  if (
    myLat != null &&
    myLng != null
  ) {

    const mine =
      await fetchRouteCoords(
        myLat,
        myLng,
        Number(target.lat),
        Number(target.lng)
      );


    if (mine) {

      drawRouteLine(
        "me",
        mine.coords,
        true,
        "#1565c0"
      );


      /*
         導航模式下保存逐步導航資料
      */

      if (navigationOn) {

        prepareNavigationSteps(mine);

      }


      /*
         ETA
      */

      if (
        navEtaBox &&
        navigationOn
      ) {

        navEtaBox.style.display = "";

        navEtaEl.textContent =
          formatDuration(
            mine.duration
          );

        navDistEl.textContent =
          formatDistance(
            mine.distance
          );

      }

    }

    else {

      /*
         OSRM 失敗時保留直線 fallback
      */

      drawRouteLine(
        "me",
        [
          [myLat, myLng],
          [
            Number(target.lat),
            Number(target.lng)
          ]
        ],
        true,
        "#1565c0"
      );

    }

  }


  /* =======================================================
     其他成員
  ======================================================= */

  if (
    window._lastPeerRows &&
    Array.isArray(
      window._lastPeerRows
    )
  ) {

    for (
      let i = 0;
      i < window._lastPeerRows.length;
      i++
    ) {

      const row =
        window._lastPeerRows[i];

      if (
        !row ||
        !row.user_id
      ) {
        continue;
      }


      if (
        me &&
        String(row.user_id) ===
        String(me.id)
      ) {
        continue;
      }


      const lat =
        Number(
          row.lat != null
            ? row.lat
            : row.latitude
        );

      const lng =
        Number(
          row.lng != null
            ? row.lng
            : row.longitude
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {
        continue;
      }


      const color =
        memberColorFromId(
          row.user_id
        );


      const route =
        await fetchRouteCoords(
          lat,
          lng,
          Number(target.lat),
          Number(target.lng)
        );


      if (route) {

        drawRouteLine(
          "peer_" + row.user_id,
          route.coords,
          false,
          color
        );

      }

    }

  }

}

  if (!e.touches || e.touches.length !== 1) {
    cancelLongPress();
    return;
  }
  if (e.target && e.target.closest &&
      (e.target.closest(".panel") || e.target.closest(".header") || e.target.closest("button"))) {
    return;
  }
  const t = e.touches[0];
  longPressStartPos = {
    x: t.clientX,
    y: t.clientY,
    latlng: latLngFromTouch(t)
  };
  longPressTimer = setTimeout(function () {
    if (!longPressStartPos) return;
    try { if (window.getSelection) window.getSelection().removeAllRanges(); } catch (err) {}
    placeTempPin(longPressStartPos.latlng);
    cancelLongPress();
  }, 550);
}, { passive: true });

map.getContainer().addEventListener("touchmove", function (e) {
  if (!longPressTimer || !longPressStartPos || !e.touches || !e.touches.length) return;
  const t = e.touches[0];
  if (Math.abs(t.clientX - longPressStartPos.x) > 10 ||
      Math.abs(t.clientY - longPressStartPos.y) > 10) {
    cancelLongPress();
  }
}, { passive: true });

map.getContainer().addEventListener("touchend", cancelLongPress, { passive: true });
map.getContainer().addEventListener("touchcancel", cancelLongPress, { passive: true });
map.getContainer().addEventListener("selectstart", function (e) {
  e.preventDefault();
  return false;
}, { passive: false });

function initPrivatePins() {
  privatePins = loadPrivatePinsFromStorage();

}

/* =========================================================
   19. SOS

async function sendSOS() {
  if (!me) {
    alert("請先登入");
    return;
  }
  if (!confirm("向本群組／活動發送 SOS 求助？")) return;

  const result = await sb.from("sos_events").insert({
    room_id: roomId,
    user_id: me.id,
    display_name: (me.email || "user").split("@")[0],
    lat: myLat,
    lng: myLng,
    message: "遇到危險或迷路，需要協助"
  });

  if (result.error) {
    alert("SOS 失敗：" + result.error.message);
    return;
  }

  if (myLat != null && myLng != null) {
    L.circleMarker([myLat, myLng], {
      radius: 12, color: "#c62828", fillColor: "#c62828", fillOpacity: 0.5
    }).addTo(map).bindPopup("🚨 SOS").openPopup();
  }

  showSosBanner("🚨 SOS 已發送給群組", 5000);
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
}

document.getElementById("btnSosTop").onclick = sendSOS;

function showSosBanner(text, duration) {
  sosBanner.textContent = text;
  sosBanner.classList.add("show");
  setTimeout(function () {
    sosBanner.classList.remove("show");
  }, duration || 5000);
}

function listenSos() {
  if (sosChannel) return;
  sosChannel = sb
    .channel("sos-" + roomId)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "sos_events",
        filter: "room_id=eq." + roomId
      },
      function (payload) {
        const row = payload.new;
        if (!row) return;
        showSosBanner(
          "🚨 SOS " + (row.display_name || "成員") + "：" + (row.message || "需要協助"),
          8000
        );
        if (row.lat != null && row.lng != null) {
          L.circleMarker([row.lat, row.lng], {
            radius: 12, color: "#c62828", fillColor: "#c62828", fillOpacity: 0.5
          }).addTo(map).bindPopup("🚨 SOS " + (row.display_name || "")).openPopup();
        }
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      }
    )
    .subscribe(function (status) {
      console.log("SOS Realtime：", status);
    });
}

/* =========================================================
   20. 抵達紀錄
   ========================================================= */
let arrivalHistory = [];
let arrivalCheckTimer = null;

function arrivalStorageKey() {
  const uid = (me && me.id) ? me.id : "guest";
  return "arrival_history_" + roomId + "_" + uid;
}

function loadArrivalHistory() {
  try {
    const raw = localStorage.getItem(arrivalStorageKey());
    arrivalHistory = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arrivalHistory)) arrivalHistory = [];
  } catch (e) {
    arrivalHistory = [];
  }
}

function saveArrivalHistory() {
  try {
    localStorage.setItem(arrivalStorageKey(), JSON.stringify(arrivalHistory));
  } catch (e) {}
}

function renderArrivalList() {
  const box = document.getElementById("arrivalList");
  if (!box) return;
  if (!arrivalHistory.length) {
    box.innerHTML = '<div style="color:#888">尚無紀錄</div>';
    return;
  }
  const sorted = arrivalHistory.slice().sort(function (a, b) {
    return new Date(a.time) - new Date(b.time);
  });
  box.innerHTML = sorted.map(function (item, idx) {
    const t = new Date(item.time).toLocaleString("zh-TW");
    return (
      '<div class="arrival-item">' +
      '<div><b>#' + (idx + 1) + "</b> " + escapeHtml(item.name || "我") +
      '<div style="font-size:11px;color:#888">' + escapeHtml(item.place || "") + "</div></div>" +
      '<div style="font-size:11px;color:#666">' + escapeHtml(t) + "</div></div>"
    );
  }).join("");
}

function markArrivedAtWaypoint(w) {
  if (!w || !w.id) return;
  if (arrivalHistory.some(function (h) { return String(h.waypointId) === String(w.id); })) return;
  arrivalHistory.push({
    waypointId: w.id,
    name: (me && me.user_metadata && me.user_metadata.full_name) || "我",
    place: w.title || ("集合點 #" + w.seq),
    time: new Date().toISOString()
  });
  saveArrivalHistory();
  renderArrivalList();
}

function checkArrivalByDistance() {
  if (myLat == null || myLng == null || !waypoints.length) return;
  waypoints.forEach(function (w) {
    if (distanceMeters(myLat, myLng, w.lat, w.lng) <= 80) {
      markArrivedAtWaypoint(w);
    }
  });
  updateDepartBanner();
}

function getNextWaypointAfterArrived() {
  if (!waypoints || waypoints.length < 2) return null;
  const arrivedIds = {};
  arrivalHistory.forEach(function (h) {
    arrivedIds[String(h.waypointId)] = true;
  });
  for (let i = 0; i < waypoints.length - 1; i++) {
    if (arrivedIds[String(waypoints[i].id)]) {
      const next = waypoints[i + 1];
      if (!arrivedIds[String(next.id)]) {
        return { current: waypoints[i], next: next };
      }
    }
  }
  return null;
}

function updateDepartBanner() {
  const banner = document.getElementById("departBanner");
  if (!banner) return;
  const pair = getNextWaypointAfterArrived();
  if (!pair) {
    banner.classList.remove("show");
    return;
  }
  const next = pair.next;
  const arriveStr = next.meet_at
    ? new Date(next.meet_at).toLocaleString("zh-TW")
    : "時間未定";
  banner.innerHTML =
    "<b>➡️ 前往下一集合點</b><br>" +
    escapeHtml(next.title || ("集合點 #" + next.seq)) + "<br>" +
    '<span style="color:#e65100">預計到達：' + escapeHtml(arriveStr) + "</span>";
  banner.classList.add("show");
}

document.getElementById("arrivalFab").onclick = function () {
  document.getElementById("arrivalPanel").classList.toggle("show");
  renderArrivalList();
};
document.getElementById("btnClearArrivalLocal").onclick = function () {
  if (!confirm("確定清除本機抵達紀錄？")) return;
  arrivalHistory = [];
  saveArrivalHistory();
  renderArrivalList();
  updateDepartBanner();
};

loadArrivalHistory();
renderArrivalList();
arrivalCheckTimer = setInterval(checkArrivalByDistance, 5000);

document.getElementById("btnCreateTempUser").onclick = async function () {
  if (!isDeveloper()) {
    alert("僅開發者可使用");
    return;
  }
  const displayName = (document.getElementById("tempDisplayName").value || "").trim();
  const loginId = (document.getElementById("tempLoginId").value || "")
    .trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
  const password = document.getElementById("tempPassword").value || "";
  const resultEl = document.getElementById("tempUserResult");

  if (!loginId || loginId.length < 3) {
    alert("登入帳號至少 3 個英數字");
    return;
  }
  if (!password || password.length < 6) {
    alert("密碼至少 6 碼");
    return;
  }

  resultEl.style.color = "#666";
  resultEl.textContent = "建立中…";

  try {
    const { data, error } = await sb.functions.invoke("create-temp-user", {
      body: {
        login_id: loginId,
        password: password,
        display_name: displayName || loginId
      }
    });
    if (error) throw new Error(error.message || "建立失敗");
    if (data && data.error) throw new Error(data.error);

    const loginEmail = (data && data.email)
      ? data.email
      : (loginId + "@temp.safereunion.local");

    resultEl.style.color = "#166534";
    resultEl.textContent =
      "建立成功！請把下面資料給同學：\n\n" +
      "登入 Email：\n" + loginEmail + "\n\n" +
      "密碼：\n" + password + "\n\n" +
      "暱稱：" + (displayName || loginId);
    document.getElementById("tempPassword").value = "";
  } catch (e) {
    resultEl.style.color = "#b91c1c";
    resultEl.textContent =
      "失敗：" + (e.message || e) +
      "\n\n請確認已部署 Edge Function：create-temp-user";
  }
};
