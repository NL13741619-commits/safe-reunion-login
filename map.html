/* =========================================================

/* =========================================================
   6. 工具
   ========================================================= */

function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


/* =========================================================
   距離
   ========================================================= */

function distanceMeters(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dp =
    (
      lat2 -
      lat1
    )
    *
    Math.PI /
    180;


  const dl =
    (
      lng2 -
      lng1
    )
    *
    Math.PI /
    180;


  const a =
    Math.sin(
      dp / 2
    ) ** 2
    +
    Math.cos(p1)
    *
    Math.cos(p2)
    *
    Math.sin(
      dl / 2
    ) ** 2;


  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(
        1 - a
      )
    )
  );

}


/* =========================================================
   方位角
   ========================================================= */

function bearingDegrees(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dl =
    (
      lng2 -
      lng1
    )
    *
    Math.PI /
    180;


  const y =
    Math.sin(dl)
    *
    Math.cos(p2);


  const x =
    Math.cos(p1)
    *
    Math.sin(p2)
    -
    Math.sin(p1)
    *
    Math.cos(p2)
    *
    Math.cos(dl);


  return (
    (
      Math.atan2(
        y,
        x
      )
      *
      180 /
      Math.PI
      +
      360
    )
    %
    360
  );

}


/* =========================================================
   方向差
   ========================================================= */

function angleDifference(
  a,
  b
) {

  return Math.abs(
    (
      (
        a -
        b +
        540
      )
      %
      360
    )
    -
    180
  );

}


/* =========================================================
   距離格式
   ========================================================= */

function formatDistance(
  meters
) {

  if (
    meters < 1000
  ) {

    return (
      Math.round(
        meters
      )
      +
      " m"
    );

  }


  return (
    (
      meters /
      1000
    ).toFixed(1)
    +
    " km"
  );

}


/* =========================================================
   GPS 錯誤
   ========================================================= */

function geoErrorText(
  error
) {

  if (!error) {

    return "未知錯誤";

  }


  if (
    error.code === 1
  ) {

    return "定位權限被拒絕";

  }


  if (
    error.code === 2
  ) {

    return "目前無法取得位置";

  }


  if (
    error.code === 3
  ) {

    return "定位逾時";

  }


  return (
    error.message
    ||
    String(error)
  );

}


/* =========================================================
   7. 測速方向
   ========================================================= */

function directMatchesHeading(
  direct,
  heading
) {

  const text =
    String(
      direct ||
      ""
    );


  if (
    !Number.isFinite(
      heading
    )
  ) {

    return true;

  }


  if (
    text.includes("南北")
  ) {

    const d =
      Math.min(

        angleDifference(
          heading,
          0
        ),

        angleDifference(
          heading,
          180
        )

      );


    return d <= 55;

  }


  if (
    text.includes("東西")
  ) {

    const d =
      Math.min(

        angleDifference(
          heading,
          90
        ),

        angleDifference(
          heading,
          270
        )

      );


    return d <= 55;

  }


  return true;

}

   9. 載入測速資料
   ========================================================= */

async function loadCameras() {

  if (
    camerasLoaded
  ) {

    return;

  }


  try {

    const result =
      await sb
        .from(
          CAMERA_TABLE
        )
        .select(
          "CityName,RegionName,Address,DeptNm,BranchNm,Longitude,Latitude,direct,limit"
        );


    if (
      result.error
    ) {

      console.error(
        "測速資料錯誤：",
        result.error
      );

      subEl.textContent =
        "測速資料載入失敗";

      return;

    }


    cameras =
      (
        result.data ||
        []
      )

      .map(
        function (
          row,
          index
        ) {

          return {

            id:
              index,

            city:
              String(
                row.CityName ||
                ""
              ),

            region:
              String(
                row.RegionName ||
                ""
              ),

            address:
              String(
                row.Address ||
                ""
              ),

            latitude:
              number(
                row.Latitude
              ),

            longitude:
              number(
                row.Longitude
              ),

            direct:
              String(
                row.direct ||
                ""
              ),

            speedLimit:
              number(
                row.limit
              )

          };

        }
      )

      .filter(
        function (
          camera
        ) {

          return (

            Number.isFinite(
              camera.latitude
            )

            &&

            Number.isFinite(
              camera.longitude
            )

          );

        }
      );


    camerasLoaded =
      true;


    drawCameraMarkers();


    console.log(
      "測速資料：",
      cameras.length
    );

  }

  catch (error) {

    console.error(
      "測速資料載入例外：",
      error
    );

  }

}


/* =========================================================
   10. 畫測速點
   ========================================================= */

function drawCameraMarkers() {

  cameraMarkers.forEach(
    function (
      marker
    ) {

      if (
        map.hasLayer(
          marker
        )
      ) {

        map.removeLayer(
          marker
        );

      }

    }
  );


  cameraMarkers =
    [];


  cameras.forEach(
    function (
      camera
    ) {

      const marker =
        L.circleMarker(

          [
            camera.latitude,
            camera.longitude
          ],

          {

            radius:
              5,

            weight:
              1,

            fillOpacity:
              .8

          }

        );


      marker.bindPopup(

        "<strong>📷 測速照相</strong>"
        +
        "<br>"
        +
        (
          camera.address
          ||
          "未提供地址"
        )
        +
        "<br>速限："
        +
        (
          camera.speedLimit
          ??
          "--"
        )
        +
        " km/h"
        +
        "<br>方向："
        +
        (
          camera.direct
          ||
          "--"
        )

      );


      marker.addTo(
        map
      );


      cameraMarkers.push(
        marker
      );

    }
  );

}


/* =========================================================
   11. 找前方測速
   ========================================================= */

function findNearestRelevantCamera(
  lat,
  lng,
  heading
) {

  let best =
    null;


  for (
    const camera
    of cameras
  ) {

    const distance =
      distanceMeters(

        lat,
        lng,

        camera.latitude,
        camera.longitude

      );


    /*
     * 只找前方 2 公里
     */

    if (
      distance >
      2000
    ) {

      continue;

    }


    /*
     * 如果資料有方向，
     * 先判斷道路方向。
     */

    if (
      !directMatchesHeading(
        camera.direct,
        heading
      )
    ) {

      continue;

    }


    /*
     * 再判斷照相機是否在前方。
     */

    if (
      Number.isFinite(
        heading
      )
    ) {

      const toCamera =
        bearingDegrees(

          lat,
          lng,

          camera.latitude,
          camera.longitude

        );


      if (
        angleDifference(
          heading,
          toCamera
        )
        >
        70
      ) {

        continue;

      }

    }


    if (
      !best
      ||
      distance <
      best.distance
    ) {

      best = {

        camera:
          camera,

        distance:
          distance

      };

    }

  }


  return best;

}


/* =========================================================
   12. 顯示測速

function showCameraWarning(

) {

  );

  speedInfo.textContent =

    "距離 "
    +
    formatDistance(
      distance
    )
    +
    "｜速限 "
    +
    (
      limit ??
      "--"
    )
    +
    " km/h｜目前 "
    +
    Math.round(
      currentSpeed
    )
    +
    " km/h";


  speedAddress.textContent =

    camera.city
    +
    " "
    +
    camera.region
    +
    " "
    +

  /*
   * 700 公尺內才開始語音提醒
   */

  if (
    distance <=

  ) {

    const now =
      Date.now();


    const shouldSpeak =

      lastWarningCameraId
      !==
      camera.id

      ||

      (
        now -
        lastWarningTime
        >
        30000
      );


    if (
      shouldSpeak
    ) {

      speakCameraWarning(
        camera,
        distance,
        overSpeed
      );


      lastWarningCameraId =
        camera.id;


      lastWarningTime =
        now;

    }

  }

}


/* =========================================================
   13. 測速語音
   ========================================================= */

function speakCameraWarning(

  distance,

) {

  if (

  ) {

  let text =

  );

}


/* =========================================================
   14. 計算 GPS 速度
   ========================================================= */

function getSpeed(
  position
) {

  if (
    !position ||
    !position.coords
  ) {

    return 0;

  }


  const gpsSpeed =
    Number(
      position.coords.speed
    );


  /*
   * GPS 有直接速度，
   * 優先使用。
   */

  if (
    Number.isFinite(
      gpsSpeed
    )
    &&
    gpsSpeed >= 0
  ) {

    return (
      gpsSpeed *
      3.6
    );

  }


  /*
   * 沒有 GPS speed，
   * 才使用兩點距離計算。
   */

  if (
    !lastPosition
  ) {

    return 0;

  }


  const dt =
    (
      position.timestamp -
      lastPosition.timestamp
    )
    /
    1000;


  if (
    dt <= 0
  ) {

    return 0;

  }


  const d =
    distanceMeters(

      lastPosition.coords.latitude,
      lastPosition.coords.longitude,

      position.coords.latitude,
      position.coords.longitude

    );


  return (
    d /
    dt
  )
  *
  3.6;

}


/* =========================================================
   15. GPS 位置處理
   ========================================================= */

function onPosition(
  position
) {

  if (
    !position ||
    !position.coords
  ) {

    return;

  }


  const coords =
    position.coords;


  const lat =
    Number(
      coords.latitude
    );


  const lng =
    Number(
      coords.longitude
    );


  const accuracy =
    Number(
      coords.accuracy
    );


  if (
    !Number.isFinite(lat)
    ||
    !Number.isFinite(lng)
  ) {

    return;

  }


  /*
   * GPS 精度太差時，
   * 不更新位置。
   */

  if (
    Number.isFinite(
      accuracy
    )
    &&
    accuracy >
    300
  ) {

    subEl.textContent =
      "GPS 訊號較弱 ±"
      +
      Math.round(
        accuracy
      )
      +
      "m";

    return;

  }


  /* -------------------------------------------------------
     速度
     ------------------------------------------------------- */

  let calculatedSpeed =
    getSpeed(
      position
    );


  if (
    !Number.isFinite(
      calculatedSpeed
    )
    ||
    calculatedSpeed <
    0
  ) {

    calculatedSpeed =
      0;

  }


  /*
   * GPS 直接速度
   */

  const gpsSpeed =
    Number(
      coords.speed
    );


  if (
    Number.isFinite(
      gpsSpeed
    )
    &&
    gpsSpeed >= 0
  ) {

    calculatedSpeed =
      gpsSpeed *
      3.6;

  }


  /*
   * 防止 GPS 跳點
   */

  if (
    calculatedSpeed >
    200
  ) {

    calculatedSpeed =
      currentSpeed;

  }


  /*
   * 速度平滑
   */

  if (
    Number.isFinite(
      currentSpeed
    )
    &&
    currentSpeed >
    0
  ) {

    currentSpeed =

      currentSpeed *
      0.7

      +

      calculatedSpeed *
      0.3;

  }
  else {

    currentSpeed =
      calculatedSpeed;

  }


  /* -------------------------------------------------------
     方向
     ------------------------------------------------------- */

  let heading =
    Number(
      coords.heading
    );


  /*
   * GPS 沒有 heading，
   * 使用移動座標計算。
   */

  if (
    !Number.isFinite(
      heading
    )
    &&
    lastPosition
  ) {

    const moved =
      distanceMeters(

        lastPosition.coords.latitude,
        lastPosition.coords.longitude,

        lat,
        lng

      );


    if (
      moved >= 8
    ) {

      heading =
        bearingDegrees(

          lastPosition.coords.latitude,
          lastPosition.coords.longitude,

          lat,
          lng

        );

    }

  }


  /*
   * 低速不要相信 GPS heading。
   */

  if (
    Number.isFinite(
      heading
    )
    &&
    currentSpeed >= 5
  ) {

    lastHeading =
      heading;

  }


  if (
    !Number.isFinite(
      heading
    )
  ) {

    heading =
      lastHeading;

  }


  /* -------------------------------------------------------
     保存位置
     ------------------------------------------------------- */

  myLat =
    lat;


  myLng =
    lng;


  /* -------------------------------------------------------
     顯示速度
     ------------------------------------------------------- */

  currentSpeedEl.textContent =
    Math.round(
      currentSpeed
    );


  currentHeadingEl.textContent =

    Number.isFinite(
      heading
    )

      ? Math.round(
          heading
        )

      : "--";


  /* -------------------------------------------------------
     GPS 狀態
     ------------------------------------------------------- */

  const now =
    new Date();


  subEl.textContent =

    "GPS ±"
    +
    (
      Number.isFinite(
        accuracy
      )

        ? Math.round(
            accuracy
          )

        : "--"
    )
    +
    "m｜"
    +
    now.getHours()
    +
    ":"
    +
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  /* -------------------------------------------------------
     我的定位標記
     ------------------------------------------------------- */

  if (
    !myMarker
  ) {

    myMarker =
      L.circleMarker(

        [
          myLat,
          myLng
        ],

        {

          radius:
            8,

          color:
            "#06C755",

          fillColor:
            "#06C755",

          fillOpacity:
            .95

        }

      )
      .addTo(map)
      .bindPopup(
        "我的位置"
      );

  }
  else {

    myMarker.setLatLng([
      myLat,
      myLng
    ]);

  }


  /* -------------------------------------------------------
     GPS 精度圈
     ------------------------------------------------------- */

  if (
    Number.isFinite(
      accuracy
    )
  ) {

    if (
      !accuracyCircle
    ) {

      accuracyCircle =
        L.circle(

          [
            myLat,
            myLng
          ],

          {

            radius:
              accuracy,

            weight:
              1,

            fillOpacity:
              .06

          }

        ).addTo(map);

    }
    else {

      accuracyCircle.setLatLng([
        myLat,
        myLng
      ]);

      accuracyCircle.setRadius(
        accuracy
      );

    }

  }


  /* -------------------------------------------------------
     導航模式跟隨
     ------------------------------------------------------- */

  if (
    navigationOn
  ) {

    map.setView(

      [
        myLat,
        myLng
      ],

      Math.max(
        map.getZoom(),
        15
      ),

      {
        animate:
          true
      }

    );

  }


  /* -------------------------------------------------------
     測速判斷
     ------------------------------------------------------- */

  if (
    navigationOn &&
    camerasLoaded
  ) {

    const result =
      findNearestRelevantCamera(

        myLat,
        myLng,
        heading

      );


    showCameraWarning(
      result
    );

  }


  /* -------------------------------------------------------
     上傳位置
     ------------------------------------------------------- */

  if (
    me &&
    (
      shareOn ||
      navigationOn
    )
  ) {

    uploadLocation();

  }


  /*
   * 保存最後位置
   */

  lastPosition =
    position;

}


/* =========================================================
   16. 開始 GPS
   ========================================================= */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    alert(
      "此裝置不支援 GPS 定位"
    );

    return false;

  }


  if (
    location.protocol !==
      "https:"
    &&
    location.hostname !==
      "localhost"
  ) {

    alert(
      "定位需要 HTTPS，請使用 GitHub Pages"
    );

    return false;

  }


  if (
    watchId !== null
  ) {

    return true;

  }


  watchId =
    navigator.geolocation.watchPosition(

      onPosition,

      function (
        error
      ) {

        subEl.textContent =
          "GPS："
          +
          geoErrorText(
            error
          );

      },

      {

        enableHighAccuracy:
          true,

        maximumAge:
          1000,

        timeout:
          10000

      }

    );


  return true;

}


/* =========================================================
   17. 停止 GPS
   ========================================================= */

function stopGPS() {

  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId =
      null;

  }


  if (
    uploadTimer
  ) {

    clearInterval(
      uploadTimer
    );

    uploadTimer =
      null;

  }

}


/* =========================================================
   18. 開始導航
   ========================================================= */

async function startNavigation() {

  if (
    navigationOn
  ) {

    return;

  }


  const ok =
    startGPS();


  if (
    !ok
  ) {

    return;

  }


  navigationOn =
    true;


  document.body.classList.add(
    "navigation-mode"
  );


  navigationBtn.textContent =
    "停止導航";


  navigationBtn.classList.remove(
    "nav"
  );


  navigationBtn.classList.add(
    "stop"
  );


  subEl.textContent =
    "導航啟動中…";


  /*
   * 先載入測速資料
   */

  await loadCameras();


  /*
   * 使用者主動點擊導航，
   * 解鎖手機語音。
   */

  if (
    voiceOn
  ) {

    unlockSpeech();

  }


  map.invalidateSize();


  if (
    myLat !== null &&
    myLng !== null
  ) {

    map.setView(

      [
        myLat,
        myLng
      ],

      16

    );

  }

}


/* =========================================================
   19. 停止導航
   ========================================================= */

function stopNavigation() {

  navigationOn =
    false;


  /*
   * 如果一般定位沒有開啟，
   * 才真正停止 GPS。
   */

  if (
    !shareOn
  ) {

    stopGPS();

  }


  document.body.classList.remove(
    "navigation-mode"
  );


  navigationBtn.textContent =
    "開始導航";


  navigationBtn.classList.remove(
    "stop"
  );


  navigationBtn.classList.add(
    "nav"
  );


  speedBox.classList.remove(
    "show"
  );


  currentSpeed =
    0;


  currentSpeedEl.textContent =
    "0";


  currentHeadingEl.textContent =
    "--";


  if (
    window.speechSynthesis
  ) {

    window.speechSynthesis.cancel();

  }


  subEl.textContent =
    shareOn
      ? "定位：開啟"
      : "導航已停止";


  map.invalidateSize();

}


/* =========================================================
   20. 導航按鈕
   ========================================================= */

navigationBtn.onclick =
  function () {

    if (
      navigationOn
    ) {

      stopNavigation();

    }
    else {

      startNavigation();

    }

  };


/* =========================================================
   21. 語音
   ========================================================= */

let speechReady =
  false;


let selectedVoice =
  null;


const savedVoiceName =
  localStorage.getItem(
    "safeReunionVoice"
  );


/* =========================================================
   取得聲音
   ========================================================= */

function getAvailableVoices() {

  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    return [];

  }


  return window
    .speechSynthesis
    .getVoices();

}


/* =========================================================
   選擇預設中文聲音
   ========================================================= */

function chooseDefaultVoice() {

  const voices =
    getAvailableVoices();


  if (
    !voices.length
  ) {

    return null;

  }


  /*
   * 優先使用之前選擇
   */

  if (
    savedVoiceName
  ) {

    const saved =
      voices.find(
        function (
          voice
        ) {

          return (
            voice.name
            ===
            savedVoiceName
          );

        }
      );


    if (
      saved
    ) {

      return saved;

    }

  }


  /*
   * 台灣中文
   */

  let voice =
    voices.find(
      function (
        voice
      ) {

        return (
          voice.lang
            .toLowerCase()
          ===
          "zh-tw"
        );

      }
    );


  /*
   * 其他中文
   */

  if (
    !voice
  ) {

    voice =
      voices.find(
        function (
          voice
        ) {

          return (
            voice.lang
              .toLowerCase()
              .startsWith(
                "zh"
              )
          );

        }
      );

  }


  /*
   * 最後使用系統聲音
   */

  if (
    !voice
  ) {

    voice =
      voices[0];

  }


  return voice;

}


/* =========================================================
   初始化語音
   ========================================================= */

function initSpeech() {

  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    console.warn(
      "此裝置不支援語音"
    );

    return;

  }


  function refreshVoices() {

    const voices =
      getAvailableVoices();


    if (
      voices.length
    ) {

      speechReady =
        true;


      if (
        !selectedVoice
      ) {

        selectedVoice =
          chooseDefaultVoice();

      }

    }

  }


  refreshVoices();


  window
    .speechSynthesis
    .onvoiceschanged =
      refreshVoices;

}


/* =========================================================
   播放語音
   ========================================================= */

function speak(
  text
) {

  if (
    !voiceOn
  ) {

    return;

  }


  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    return;

  }


  if (
    !text
  ) {

    return;

  }


  const voices =
    getAvailableVoices();


  if (
    !selectedVoice
    &&
    voices.length
  ) {

    selectedVoice =
      chooseDefaultVoice();

  }


  try {

    window
      .speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    if (
      selectedVoice
    ) {

      utterance.voice =
        selectedVoice;

      utterance.lang =
        selectedVoice.lang;

    }
    else {

      utterance.lang =
        "zh-TW";

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    utterance.onerror =
      function (
        event
      ) {

        console.error(
          "語音播放錯誤：",
          event
        );

      };


    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch (
    error
  ) {

    console.error(
      "語音錯誤：",
      error
    );

  }

}


/* =========================================================
   iPhone / Safari 語音解鎖
   ========================================================= */

function unlockSpeech() {

  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    return;

  }


  try {

    window
      .speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        "語音導航已開啟"
      );


    if (
      selectedVoice
    ) {

      utterance.voice =
        selectedVoice;

      utterance.lang =
        selectedVoice.lang;

    }
    else {

      utterance.lang =
        "zh-TW";

    }


    utterance.rate =
      1;


    utterance.volume =
      1;


    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch (
    error
  ) {

    console.error(
      "語音初始化失敗：",
      error
    );

  }

}


/* =========================================================
   語音選擇
   ========================================================= */

function showVoiceSelector() {

  const voices =
    getAvailableVoices();


  if (
    !voices.length
  ) {

    alert(
      "目前還沒有取得手機語音清單，請稍後再試。"
    );

    return;

  }


  const chineseVoices =
    voices.filter(
      function (
        voice
      ) {

        return voice.lang
          .toLowerCase()
          .startsWith(
            "zh"
          );

      }
    );


  const list =
    chineseVoices.length
      ? chineseVoices
      : voices;


  let message =
    "選擇語音：\n\n";


  list.forEach(
    function (
      voice,
      index
    ) {

      message +=

        (
          index +
          1
        )
        +
        ". "
        +
        voice.name
        +
        "（"
        +
        voice.lang
        +
        "）";


      if (
        selectedVoice
        &&
        voice.name
        ===
        selectedVoice.name
      ) {

        message +=
          " ✓";

      }


      message +=
        "\n";

    }
  );


  const answer =
    prompt(

      message
      +
      "\n請輸入編號："

    );


  if (
    answer ===
    null
  ) {

    return;

  }


  const index =
    parseInt(
      answer,
      10
    );


  if (
    !Number.isInteger(
      index
    )
    ||
    index <
    1
    ||
    index >
    list.length
  ) {

    alert(
      "編號無效"
    );

    return;

  }


  selectedVoice =
    list[
      index -
      1
    ];


  localStorage.setItem(
    "safeReunionVoice",
    selectedVoice.name
  );


  speak(
    "這是新的導航語音"
  );

}

/* =========================================================
   22. 開啟一般定位
   ========================================================= */

function startShare() {

  if (
    !navigator.geolocation
  ) {

    alert(
      "此裝置不支援定位"
    );

    return;

  }


  shareOn =
    true;


  btnShare.textContent =
    "關閉定位";


  btnShare.className =
    "btn btn-red";


  shareStatus.textContent =
    "定位：開啟中…";


  const gpsStarted =
    startGPS();


  if (
    !gpsStarted
  ) {

    shareOn =
      false;

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function (
      position
    ) {

      onPosition(
        position
      );


      if (
        myLat !== null &&
        myLng !== null
      ) {

        map.setView(
          [
            myLat,
            myLng
          ],
          15
        );

      }


      shareStatus.textContent =
        "定位：開啟";

    },

    function (
      error
    ) {

      shareOn =
        false;


      if (
        !navigationOn
      ) {

        stopGPS();

      }


      btnShare.textContent =
        "開啟定位";


      btnShare.className =
        "btn btn-green";


      shareStatus.textContent =
        "定位：關閉";


      alert(
        "定位失敗："
        +
        geoErrorText(
          error
        )
      );

    },

    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );


  /*
   * 定時同步位置
   */

  if (
    !uploadTimer
  ) {

    uploadTimer =
      setInterval(

        function () {

          if (
            shareOn ||
            navigationOn
          ) {

            uploadLocation();

          }

        },

        5000

      );

  }

}


/* =========================================================
   23. 關閉一般定位
   ========================================================= */

function stopShare() {

  shareOn =
    false;


  /*
   * 如果目前沒有導航，
   * 才停止 GPS。
   */

  if (
    !navigationOn
  ) {

    stopGPS();

  }


  btnShare.textContent =
    "開啟定位";


  btnShare.className =
    "btn btn-green";


  shareStatus.textContent =
    "定位：關閉";


  subEl.textContent =
    navigationOn
      ? "導航中"
      : "定位已關閉";

}


btnShare.onclick =
  function () {

    if (
      shareOn
    ) {

      stopShare();

    }
    else {

      startShare();

    }

  };


/* =========================================================
   24. 上傳位置
   ========================================================= */

async function uploadLocation() {

  if (
    !me
    ||
    myLat === null
    ||
    myLng === null
  ) {

    return;

  }


  if (
    !shareOn
    &&
    !navigationOn
  ) {

    return;

  }


  try {

    const result =
      await sb
        .from(
          "location_shares"
        )
        .upsert(

          {

            user_id:
              me.id,

            room_id:
              roomId,

            lat:
              myLat,

            lng:
              myLng,

            display_name:
              (
                me.email
                ||
                "user"
              )
              .split(
                "@"
              )[0],

            updated_at:
              new Date()
                .toISOString()

          },

          {
            onConflict:
              "user_id,room_id"
          }

        );


    if (
      result.error
    ) {

      console.error(
        "位置上傳錯誤：",
        result.error
      );

    }

  }

  catch (
    error
  ) {

    console.error(
      "位置上傳例外：",
      error
    );

  }

}


/* =========================================================
   25. 成員定位
   ========================================================= */

let peerChannel = null;

async function loadPeers() {

  if (!roomId) {
    return;
  }

  try {

    const result =
      await sb
        .from("location_shares")
        .select("*")
        .eq("room_id", roomId)
        .gte(
          "updated_at",
          new Date(
            Date.now() - 30 * 60 * 1000
          ).toISOString()
        );

    if (result.error) {

      console.error(
        "成員定位錯誤：",
        result.error
      );

      return;
    }

    const rows =
      result.data || [];

    /*
     * 清除舊成員 Marker
     *
     * 注意：
     * 不碰測速照相 Marker。
     */
    Object.keys(peerMarkers).forEach(
      function (key) {

        if (
          peerMarkers[key] &&
          map.hasLayer(peerMarkers[key])
        ) {

          map.removeLayer(
            peerMarkers[key]
          );

        }

      }
    );

    peerMarkers = {};

    let count = 0;

    rows.forEach(
      function (row) {

        /*
         * 自己不重複顯示
         */
        if (
          me &&
          row.user_id === me.id
        ) {

          return;
        }

        if (
          row.lat == null ||
          row.lng == null
        ) {

          return;
        }

        const lat =
          Number(row.lat);

        const lng =
          Number(row.lng);

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {

          return;
        }

        /*
         * 取得固定成員顏色＋形狀
         */
        let identifier = null;

        if (
          window.GroupLocationIdentifiers
        ) {

          identifier =
            window
              .GroupLocationIdentifiers
              .createMemberIdentifier(
                row
              );

        }

        /*
         * 如果後台沒有識別資料，
         * 暫時使用藍色圓形。
         *
         * 這只是成員 Marker，
         * 不會碰測速照相 Marker。
         */
        let marker;

        if (
          identifier
        ) {

          const html =
            window
              .GroupLocationIdentifiers
              .createMemberMarkerSVG(
                identifier,
                row.display_name ||
                "成員"
              );

          marker =
            L.marker(
              [
                lat,
                lng
              ],
              {
                icon:
                  L.divIcon({

                    className:
                      "group-member-leaflet-icon",

                    html:
                      html,

                    iconSize:
                      [
                        36,
                        36
                      ],

                    iconAnchor:
                      [
                        18,
                        18
                      ],

                    popupAnchor:
                      [
                        0,
                        -18
                      ]

                  })
              }
            );

        }
        else {

          marker =
            L.circleMarker(
              [
                lat,
                lng
              ],
              {

                radius:
                  8,

                color:
                  "#1565c0",

                fillColor:
                  "#1565c0",

                fillOpacity:
                  0.9,

                weight:
                  2

              }
            );

        }

        marker
          .addTo(map)
          .bindPopup(
            escapeHtml(
              row.display_name ||
              "成員"
            )
          );

        peerMarkers[
          row.user_id
        ] =
          marker;

        count++;

      }
    );

    const statusEl =
      document.getElementById(
        "partStatus"
      );

    if (statusEl) {

      statusEl.textContent =
        "目前分享定位人數："
        +
        (
          count +
          (
            shareOn &&
            myLat != null
              ? 1
              : 0
          )
        )
        +
        "（含行程點 "
        +
        waypoints.length
        +
        " 個）";

    }

  }
  catch (error) {

    console.error(
      "成員定位例外：",
      error
    );

  }

}


/* =========================================================
   成員定位即時更新
   ========================================================= */

function startPeerRealtime() {

  if (
    !roomId ||
    !sb
  ) {

    return;
  }

  /*
   * 避免重複建立
   */
  if (peerChannel) {

    return;
  }

  peerChannel =
    sb
      .channel(
        "location-shares-" +
        roomId
      )

      .on(

        "postgres_changes",

        {

          event:
            "*",

          schema:
            "public",

          table:
            "location_shares",

          filter:
            "room_id=eq." +
            roomId

        },

        function () {

          /*
           * 有任何成員位置變化，
           * 立即重新抓一次整個群組。
           */
          loadPeers();

        }

      )

      .subscribe(

        function (status) {

          console.log(
            "成員定位 Realtime：",
            status
          );

        }

      );

}


/* =========================================================
   成員定位輪詢備援
   ========================================================= */

function startPeerPolling() {

  if (
    peerTimer
  ) {

    clearInterval(
      peerTimer
    );

  }

  /*
   * 第一次立即載入
   */
  loadPeers();

  /*
   * 每 3 秒同步一次。
   *
   * 即使 Realtime 沒有正常工作，
   * 成員仍然可以出現。
   */
  peerTimer =
    setInterval(
      function () {

        if (
          roomId
        ) {

          loadPeers();

        }

      },
      3000
    );

}

/* =========================================================
   28. 顯示集合點
   ========================================================= */

function renderWaypoints() {

  /*
   * 清除舊標記
   */

  Object.keys(
    wpMarkers
  ).forEach(
    function (
      key
    ) {

      if (
        map.hasLayer(
          wpMarkers[key]
        )
      ) {

        map.removeLayer(
          wpMarkers[key]
        );

      }

    }
  );


  wpMarkers =
    {};


  const box =
    document.getElementById(
      "wpList"
    );


  box.innerHTML =
    "";


  if (
    !waypoints.length
  ) {

    box.innerHTML =

      '<div style="color:#888;font-size:12px;padding:8px 0">'
      +
      "尚未設定行程點"
      +
      "</div>";

    return;

  }


  waypoints.forEach(
    function (
      w
    ) {

      const marker =
        L.marker(

          [
            w.lat,
            w.lng
          ],

          {
            icon:
              numIcon(
                w.seq
              )
          }

        )
        .addTo(
          map
        );


      const timeStr =
        w.meet_at

          ? new Date(
              w.meet_at
            ).toLocaleString(
              "zh-TW"
            )

          : "時間未定";


      marker.bindPopup(

        "<b>#"
        +
        w.seq
        +
        " "
        +
        escapeHtml(
          w.title
        )
        +
        "</b>"
        +
        "<br>"
        +
        escapeHtml(
          timeStr
        )

      );


      wpMarkers[
        w.id
      ] =
        marker;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "wp-item";


      div.innerHTML =

        '<div class="num">'
        +
        escapeHtml(
          w.seq
        )
        +
        "</div>"
        +

        '<div style="flex:1">'
        +

        '<div style="font-weight:600">'
        +
        escapeHtml(
          w.title
        )
        +
        "</div>"
        +

        '<div style="color:#888;margin-top:2px">'
        +
        escapeHtml(
          timeStr
        )
        +
        "</div>"
        +

        "</div>"
        +

        '<button type="button" class="btn btn-outline">'
        +
        "刪"
        +
        "</button>";


      div
        .querySelector(
          "button"
        )
        .onclick =
        function () {

          deleteWp(
            w.id
          );

        };


      box.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   HTML 安全
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   29. 新增集合點
   ========================================================= */

async function addWaypoint(
  lat,
  lng
) {

  if (
    !me
  ) {

    alert(
      "請先登入才能設定集合點"
    );

    return;

  }


  if (
    !Number.isFinite(
      lat
    )
    ||
    !Number.isFinite(
      lng
    )
  ) {

    alert(
      "集合點座標無效"
    );

    return;

  }


  const titleInput =
    document.getElementById(
      "wpTitle"
    );


  const timeInput =
    document.getElementById(
      "wpTime"
    );


  const title =
    titleInput.value.trim()
    ||
    (
      "集合點 "
      +
      (
        waypoints.length +
        1
      )
    );


  const t =
    timeInput.value;


  let meetAt =
    null;


  if (
    t
  ) {

    const date =
      new Date(
        t
      );


    if (
      !Number.isNaN(
        date.getTime()
      )
    ) {

      meetAt =
        date.toISOString();

    }

  }


  const seq =
    waypoints.length

      ? (
          Math.max(
            ...waypoints.map(
              function (
                w
              ) {

                return (
                  Number(
                    w.seq
                  )
                  ||
                  0
                );

              }
            )
          )
          +
          1
        )

      : 1;


  const result =
    await sb
      .from(
        "meetup_waypoints"
      )
      .insert(

        {

          room_id:
            roomId,

          seq:
            seq,

          title:
            title,

          lat:
            lat,

          lng:
            lng,

          meet_at:
            meetAt,

          created_by:
            me.id

        }

      )
      .select()
      .single();


  if (
    result.error
  ) {

    alert(
      "新增失敗："
      +
      result.error.message
    );

    return;

  }


  titleInput.value =
    "";


  timeInput.value =
    "";


  await loadWaypoints();


  await loadPeers();

}


/* =========================================================
   30. 刪除集合點
   ========================================================= */

async function deleteWp(
  id
) {

  if (
    !me
  ) {

    return;

  }


  const result =
    await sb
      .from(
        "meetup_waypoints"
      )
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "created_by",
        me.id
      );


  if (
    result.error
  ) {

    alert(
      "刪除失敗："
      +
      result.error.message
    );

    return;

  }


  await loadWaypoints();


  await loadPeers();

}


/* =========================================================
   31. 搜尋地址
   ========================================================= */

async function searchPlace() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const q =
    input.value.trim();


  if (
    !q
  ) {

    alert(
      "請輸入地址或地名"
    );

    return;

  }


  const box =
    document.getElementById(
      "searchResults"
    );


  box.style.display =
    "block";


  box.innerHTML =

    '<div style="padding:10px;color:#888;font-size:12px">'
    +
    "搜尋中…"
    +
    "</div>";


  try {

    const url =

      "https://nominatim.openstreetmap.org/search"
      +
      "?format=json"
      +
      "&q="
      +
      encodeURIComponent(
        q
      )
      +
      "&limit=6"
      +
      "&accept-language=zh-TW";


    const response =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "搜尋服務 HTTP "
        +
        response.status
      );

    }


    const arr =
      await response.json();


    box.innerHTML =
      "";


    if (
      !Array.isArray(arr)
      ||
      !arr.length
    ) {

      box.innerHTML =

        '<div style="padding:10px;color:#888;font-size:12px">'
        +
        "找不到地點"
        +
        "</div>";

      return;

    }


    arr.forEach(
      function (
        item
      ) {

        const div =
          document.createElement(
            "div"
          );


        div.style.cssText =

          "padding:10px;"
          +
          "border-bottom:1px solid #eee;"
          +
          "font-size:12px;"
          +
          "cursor:pointer;";


        div.textContent =
          item.display_name;


        div.onclick =
          async function () {

            const lat =
              parseFloat(
                item.lat
              );


            const lng =
              parseFloat(
                item.lon
              );


            if (
              !Number.isFinite(
                lat
              )
              ||
              !Number.isFinite(
                lng
              )
            ) {

              alert(
                "搜尋結果座標無效"
              );

              return;

            }


            const title =
              (
                item.display_name
                ||
                q
              )
              .split(
                ","
              )[0];


            const titleInput =
              document.getElementById(
                "wpTitle"
              );


            if (
              !titleInput.value.trim()
            ) {

              titleInput.value =
                title;

            }


            map.setView(
              [
                lat,
                lng
              ],
              16
            );


            L.circleMarker(

              [
                lat,
                lng
              ],

              {

                radius:
                  6,

                color:
                  "#1565c0",

                fillColor:
                  "#1565c0",

                fillOpacity:
                  .8

              }

            )
            .addTo(
              map
            );


            box.style.display =
              "none";


            await addWaypoint(
              lat,
              lng
            );

          };


        box.appendChild(
          div
        );

      }
    );

  }

  catch (
    error
  ) {

    console.error(
      "地址搜尋錯誤：",
      error
    );


    box.innerHTML =

      '<div style="padding:10px;color:#c62828;font-size:12px">'
      +
      "搜尋失敗，請稍後再試"
      +
      "</div>";

  }

}

/* =========================================================
   32. 目前位置新增
   ========================================================= */

document.getElementById(
  "btnAddHere"
).onclick =
  function () {

    if (
      myLat === null
      ||
      myLng === null
    ) {

      alert(
        "請先開啟定位"
      );

      return;

    }


    addWaypoint(
      myLat,
      myLng
    );

  };


/* =========================================================
   33. 地圖中心新增
   ========================================================= */

document.getElementById(
  "btnAddMap"
).onclick =
  function () {

    const center =
      map.getCenter();


    addWaypoint(
      center.lat,
      center.lng
    );

  };


/* =========================================================
   34. SOS
   ========================================================= */

async function sendSOS() {

  if (
    !me
  ) {

    alert(
      "請先登入"
    );

    return;

  }


  if (
    !confirm(
      "向本群組／活動發送 SOS 求助？"
    )
  ) {

    return;

  }


  const result =
    await sb
      .from(
        "sos_events"
      )
      .insert(

        {

          room_id:
            roomId,

          user_id:
            me.id,

          display_name:
            (
              me.email
              ||
              "user"
            )
            .split(
              "@"
            )[0],

          lat:
            myLat,

          lng:
            myLng,

          message:
            "遇到危險或迷路，需要協助"

        }

      );


  if (
    result.error
  ) {

    alert(
      "SOS 失敗："
      +
      result.error.message
    );

    return;

  }


  /*
   * 顯示自己的 SOS
   */

  if (
    myLat !== null &&
    myLng !== null
  ) {

    L.circleMarker(

      [
        myLat,
        myLng
      ],

      {

        radius:
          12,

        color:
          "#c62828",

        fillColor:
          "#c62828",

        fillOpacity:
          .5

      }

    )
    .addTo(
      map
    )
    .bindPopup(
      "🚨 SOS"
    )
    .openPopup();

  }


  showSosBanner(
    "🚨 SOS 已發送給群組",
    5000
  );


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [
        200,
        100,
        200,
        100,
        400
      ]
    );

  }

}


document.getElementById(
  "btnSosTop"
).onclick =
  sendSOS;


/* =========================================================
   SOS Banner
   ========================================================= */

function showSosBanner(
  text,
  duration
) {

  sosBanner.textContent =
    text;


  sosBanner.classList.add(
    "show"
  );


  setTimeout(
    function () {

      sosBanner.classList.remove(
        "show"
      );

    },
    duration ||
    5000
  );

}


/* =========================================================
   35. SOS 即時通知
   ========================================================= */

function listenSos() {

  if (
    sosChannel
  ) {

    return;

  }


  sosChannel =
    sb
      .channel(
        "sos-" +
        roomId
      )


      .on(

        "postgres_changes",

        {

          event:
            "INSERT",

          schema:
            "public",

          table:
            "sos_events",

          filter:
            "room_id=eq."
            +
            roomId

        },

        function (
          payload
        ) {

          const row =
            payload.new;


          if (
            !row
          ) {

            return;

          }


          /*
           * 顯示 SOS
           */

          showSosBanner(

            "🚨 SOS "
            +
            (
              row.display_name
              ||
              "成員"
            )
            +
            "："
            +
            (
              row.message
              ||
              "需要協助"
            ),

            8000

          );


          /*
           * 地圖顯示 SOS 位置
           */

          if (
            row.lat != null
            &&
            row.lng != null
          ) {

            L.circleMarker(

              [
                row.lat,
                row.lng
              ],

              {

                radius:
                  12,

                color:
                  "#c62828",

                fillColor:
                  "#c62828",

                fillOpacity:
                  .5

              }

            )
            .addTo(
              map
            )
            .bindPopup(

              "🚨 SOS "
              +
              (
                row.display_name
                ||
                ""
              )

            )
            .openPopup();

          }


          /*
           * 震動
           */

          if (
            navigator.vibrate
          ) {

            navigator.vibrate(
              [
                300,
                150,
                300
              ]
            );

          }

        }

      )

      .subscribe(
        function (
          status
        ) {

          console.log(
            "SOS Realtime：",
            status
          );

        }
      );

}


/* =========================================================
   36. 頁面離開
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function () {

    stopGPS();


    if (
      peerTimer
    ) {

      clearInterval(
        peerTimer
      );

    }


    if (
      sosChannel
    ) {

      sb.removeChannel(
        sosChannel
      );

    }


    if (
      window.speechSynthesis
    ) {

      window
        .speechSynthesis
        .cancel();

    }

  }
);


/* =========================================================
   37. 啟動
   ========================================================= */

loadCameras();

bootAuth();


})();
