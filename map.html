<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>定位集合 - 安全團聚</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }
    .back { color: white; text-decoration: none; font-size: 24px; }
    .header-info { flex: 1; }
    .header-title { font-weight: 700; font-size: 16px; }
    .header-sub { font-size: 12px; opacity: 0.9; }

    #map { flex: 1; width: 100%; min-height: 220px; }

    #speedAlert {
      display: none;
      position: fixed;
      top: 56px;
      left: 12px;
      right: 12px;
      z-index: 2000;
      background: #c62828;
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    .panel {
      background: white;
      padding: 12px 14px 20px;
      border-top: 1px solid #eee;
      max-height: 48vh;
      overflow-y: auto;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-green { background: #06C755; color: white; }
    .btn-red { background: #e53935; color: white; }
    .btn-outline {
      background: white;
      border: 1px solid #ddd;
      color: #333;
    }
    .btn-shelter {
      background: #1565c0;
      color: white;
      width: 100%;
      margin-bottom: 10px;
    }
    .status {
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }
    .list-title {
      font-size: 13px;
      color: #888;
      margin: 12px 0 6px;
    }
    .person {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    .person-name { font-weight: 600; }
    .person-meta { font-size: 12px; color: #888; margin-top: 2px; }
    .dist { color: #06C755; font-weight: 600; font-size: 13px; white-space: nowrap; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 8px;
      outline: none;
    }
    input:focus { border-color: #06C755; }
    .search-results {
      border: 1px solid #eee;
      border-radius: 10px;
      margin-bottom: 8px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }
    .search-item {
      padding: 10px 12px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
      cursor: pointer;
    }
    .search-item:active, .search-item:hover { background: #f5f5f5; }
    .search-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="header">
    <a class="back" href="chat.html">‹</a>
    <div class="header-info">
      <div class="header-title" id="groupName">定位集合</div>
      <div class="header-sub" id="updateInfo">尚未開始定位</div>
    </div>
  </div>

  <div id="speedAlert"></div>
  <div id="map"></div>

  <div class="panel">
    <button class="btn btn-shelter" onclick="openShelterMap()">🛡️ 附近防空避難（官方地圖）</button>

    <div class="row">
      <div class="status" id="shareStatus">定位分享：關閉</div>
      <button class="btn btn-green" id="btnShare" onclick="toggleShare()">開啟定位</button>
    </div>

    <div class="list-title">搜尋並設定集合點</div>
    <input type="text" id="searchInput" placeholder="搜尋地點（例如：花蓮火車站）" onkeydown="if(event.key==='Enter')searchPlace()">
    <div class="row">
      <button class="btn btn-green" style="flex:1" onclick="searchPlace()">搜尋</button>
      <button class="btn btn-outline" style="flex:1" onclick="setMeetHere()">用目前位置</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="status" id="meetInfo">尚未設定集合點</div>

    <div class="list-title">本群組成員位置</div>
    <div id="memberList"></div>
  </div>

  <script>
    const map = L.map('map').setView([23.97, 121.0], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let shareOn = false;
    let watchId = null;
    let myLat = null, myLng = null;
    let myMarker = null;
    let meetMarker = null;
    let meetLat = null, meetLng = null;
    let updateTimer = null;
    const memberMarkers = {};

    // 依群組名稱決定示範成員（之後改接資料庫真實成員）
    function buildMembers(groupName) {
      const me = { id: 'me', name: '我', lat: null, lng: null, color: '#06C755' };
      const n = groupName || '';

      if (n.indexOf('家人') >= 0) {
        return [
          me,
          { id: 'aunt', name: '姑姑', lat: 24.1477, lng: 120.6736, color: '#1e88e5' },
          { id: 'mom', name: '媽媽', lat: 25.0169, lng: 121.4628, color: '#f4511e' },
          { id: 'sis', name: '妹妹', lat: 25.0330, lng: 121.5654, color: '#8e24aa' }
        ];
      }

      if (n.indexOf('同學') >= 0 || n.indexOf('碩') >= 0) {
        return [
          me,
          { id: 'c1', name: '同學A', lat: 25.04, lng: 121.52, color: '#1e88e5' },
          { id: 'c2', name: '同學B', lat: 25.05, lng: 121.54, color: '#8e24aa' }
        ];
      }

      // 其他群組：只顯示自己
      return [me];
    }

    const params = new URLSearchParams(location.search);
    const gname = params.get('name') ? decodeURIComponent(params.get('name')) : '';
    if (gname) {
      document.getElementById('groupName').textContent = gname + '・定位';
    }
    let members = buildMembers(gname);

    // 示範測速點（之後可改接官方資料）
    const speedCams = [
      { name: '台北示範測速', lat: 25.0330, lng: 121.5654, limit: 50 },
      { name: '台中示範測速', lat: 24.1477, lng: 120.6736, limit: 60 },
      { name: '花蓮示範測速', lat: 23.9929, lng: 121.6015, limit: 50 }
    ];
    const alertedCams = {};
    const ALERT_RADIUS_M = 300;

    function openShelterMap() {
      window.open('https://adr.npa.gov.tw/map', '_blank');
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const toRad = function (d) { return d * Math.PI / 180; };
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDist(km) {
      if (km == null || isNaN(km)) return '—';
      if (km < 1) return Math.round(km * 1000) + ' 公尺';
      return km.toFixed(1) + ' 公里';
    }

    function speak(text) {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-TW';
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function showSpeedAlert(msg) {
      const el = document.getElementById('speedAlert');
      el.textContent = msg;
      el.style.display = 'block';
      speak(msg);
      setTimeout(function () { el.style.display = 'none'; }, 5000);
    }

    function checkSpeedCams() {
      if (myLat == null || myLng == null) return;
      const now = Date.now();
      speedCams.forEach(function (cam) {
        const meters = haversine(myLat, myLng, cam.lat, cam.lng) * 1000;
        if (meters > ALERT_RADIUS_M) return;
        const key = cam.name + '_' + cam.lat + '_' + cam.lng;
        if (alertedCams[key] && now - alertedCams[key] < 60000) return;
        alertedCams[key] = now;
        showSpeedAlert('注意，前方測速照相，速限 ' + cam.limit + ' 公里');
      });
    }

    function setMeetPoint(lat, lng, label) {
      meetLat = lat;
      meetLng = lng;
      if (meetMarker) map.removeLayer(meetMarker);
      meetMarker = L.marker([lat, lng]).addTo(map).bindPopup(label || '集合點').openPopup();
      document.getElementById('meetInfo').textContent =
        '集合點：' + (label || '') + '（' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '）';
      document.getElementById('searchResults').style.display = 'none';
      renderMembers();
      map.setView([lat, lng], 14);
    }

    function setMeetHere() {
      if (myLat == null) {
        alert('請先開啟定位');
        return;
      }
      setMeetPoint(myLat, myLng, '目前位置');
    }

    async function searchPlace() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) {
        alert('請輸入要搜尋的地點');
        return;
      }
      const box = document.getElementById('searchResults');
      box.style.display = 'block';
      box.innerHTML = '<div class="search-item">搜尋中…</div>';
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&countrycodes=tw&q=' + encodeURIComponent(q);
        const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
        const data = await res.json();
        if (!data.length) {
          box.innerHTML = '<div class="search-item">找不到地點，請換關鍵字</div>';
          return;
        }
        box.innerHTML = '';
        data.forEach(function (item) {
          const div = document.createElement('div');
          div.className = 'search-item';
          div.textContent = item.display_name;
          div.onclick = function () {
            setMeetPoint(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0]);
          };
          box.appendChild(div);
        });
      } catch (e) {
        box.innerHTML = '<div class="search-item">搜尋失敗，請稍後再試</div>';
      }
    }

    function updateMyMarker() {
      if (myLat == null) return;
      if (!myMarker) {
        myMarker = L.circleMarker([myLat, myLng], {
          radius: 10, color: '#06C755', fillColor: '#06C755', fillOpacity: 0.9
        }).addTo(map).bindPopup('我');
      } else {
        myMarker.setLatLng([myLat, myLng]);
      }
      members[0].lat = myLat;
      members[0].lng = myLng;
    }

    function renderMembers() {
      const box = document.getElementById('memberList');
      box.innerHTML = '';
      if (members.length <= 1) {
        box.innerHTML = '<div class="status">目前只有你。其他成員開啟定位後才會出現。</div>';
      }
      members.forEach(function (m) {
        if (m.lat != null) {
          if (!memberMarkers[m.id]) {
            memberMarkers[m.id] = L.circleMarker([m.lat, m.lng], {
              radius: 8, color: m.color, fillColor: m.color, fillOpacity: 0.85
            }).addTo(map).bindPopup(m.name);
          } else {
            memberMarkers[m.id].setLatLng([m.lat, m.lng]);
          }
        }
        let distText = '—';
        if (meetLat != null && m.lat != null) {
          distText = formatDist(haversine(m.lat, m.lng, meetLat, meetLng));
        }
        const div = document.createElement('div');
        div.className = 'person';
        div.innerHTML =
          '<div><div class="person-name">' + m.name + '</div>' +
          '<div class="person-meta">' +
          (m.lat != null ? m.lat.toFixed(4) + ', ' + m.lng.toFixed(4) : '尚無座標') +
          '</div></div>' +
          '<div class="dist">距集合點 ' + distText + '</div>';
        box.appendChild(div);
      });
    }

    function simulateFamilyMove() {
      if (meetLat == null) return;
      members.forEach(function (m) {
        if (m.id === 'me' || m.lat == null) return;
        m.lat += (meetLat - m.lat) * 0.03;
        m.lng += (meetLng - m.lng) * 0.03;
      });
      renderMembers();
    }

    function onPosition(pos) {
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;
      updateMyMarker();
      renderMembers();
      checkSpeedCams();
      const t = new Date();
      document.getElementById('updateInfo').textContent =
        '已更新 ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0');
    }

    function toggleShare() {
      if (shareOn) {
        shareOn = false;
        if (watchId != null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        if (updateTimer) {
          clearInterval(updateTimer);
          updateTimer = null;
        }
        document.getElementById('btnShare').textContent = '開啟定位';
        document.getElementById('btnShare').className = 'btn btn-green';
        document.getElementById('shareStatus').textContent = '定位分享：關閉';
        document.getElementById('updateInfo').textContent = '定位已關閉';
        return;
      }

      if (!navigator.geolocation) {
        alert('此裝置不支援定位');
        return;
      }

      shareOn = true;
      document.getElementById('btnShare').textContent = '關閉定位';
      document.getElementById('btnShare').className = 'btn btn-red';
      document.getElementById('shareStatus').textContent = '定位分享：開啟（約每 5 秒）';
      speak('定位已開啟');

      watchId = navigator.geolocation.watchPosition(
        onPosition,
        function (err) {
          alert('定位失敗：' + err.message);
          toggleShare();
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
      );

      updateTimer = setInterval(function () {
        if (myLat != null) {
          onPosition({ coords: { latitude: myLat, longitude: myLng } });
        }
        simulateFamilyMove();
        checkSpeedCams();
      }, 5000);
    }

    renderMembers();
  </script>
</body>
</html>
