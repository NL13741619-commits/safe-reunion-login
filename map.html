<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>集合地圖 - 安全團聚</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; display: flex; flex-direction: column; background: #f5f5f5;
    }
    .header {
      background: #06C755; color: #fff; padding: 12px 14px;
      display: flex; align-items: center; gap: 10px; z-index: 1000;
    }
    .back { color: #fff; text-decoration: none; font-size: 24px; }
    .header-info { flex: 1; min-width: 0; }
    .header-title { font-weight: 700; font-size: 16px; }
    .header-sub { font-size: 12px; opacity: 0.95; }
    #map { flex: 1; width: 100%; min-height: 240px; }
    .panel {
      background: #fff; padding: 12px 14px 18px; border-top: 1px solid #eee;
      max-height: 46vh; overflow-y: auto;
    }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: 10px; padding: 10px 12px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-green { background: #06C755; color: #fff; }
    .btn-red { background: #e53935; color: #fff; }
    .btn-orange { background: #fb8c00; color: #fff; }
    .btn-outline { background: #fff; border: 1px solid #ddd; color: #333; }
    .status { font-size: 13px; color: #555; flex: 1; }
    .list-title { font-size: 13px; color: #888; margin: 10px 0 6px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0;
      border-radius: 10px; font-size: 14px; margin-bottom: 8px; outline: none;
    }
    .wp-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px;
    }
    .num {
      width: 26px; height: 26px; border-radius: 50%; background: #06C755; color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
    }
    .sos-banner {
      display: none; background: #c62828; color: #fff; padding: 10px 12px;
      font-size: 14px; font-weight: 600; text-align: center;
    }
    .sos-banner.show { display: block; }
    .marker-num {
      background: #06C755; color: #fff; border-radius: 50%;
      width: 28px; height: 28px; line-height: 28px; text-align: center;
      font-weight: 700; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <a class="back" id="btnBack" href="chat.html">‹</a>
    <div class="header-info">
      <div class="header-title" id="title">集合地圖</div>
      <div class="header-sub" id="sub">尚未定位</div>
    </div>
  </div>

  <div class="sos-banner" id="sosBanner"></div>
  <div id="map"></div>

  <div class="panel">
    <div class="row">
      <div class="status" id="shareStatus">定位：關閉</div>
      <button type="button" class="btn btn-green" id="btnShare">開啟定位</button>
      <button type="button" class="btn btn-red" id="btnSos">SOS</button>
    </div>
    <div class="status" id="partStatus">參與者：—</div>

    <div class="list-title">新增行程／集合點（編號為先後順序）</div>
<input id="wpTitle" placeholder="地點名稱（例如：花蓮車站）">
<input id="wpTime" type="datetime-local">

<div class="list-title">搜尋地址設為集合點</div>
<input id="searchInput" placeholder="搜尋地址（例如：台北車站、花蓮火車站）"
       onkeydown="if(event.key==='Enter')searchPlace()">
<div class="row">
  <button type="button" class="btn btn-green" id="btnSearch" style="flex:1">搜尋</button>
</div>
<div id="searchResults" style="display:none;border:1px solid #eee;border-radius:10px;margin-bottom:10px;max-height:160px;overflow:auto;"></div>

<div class="row">
  <button type="button" class="btn btn-green" id="btnAddHere" style="flex:1">用目前位置新增</button>
  <button type="button" class="btn btn-outline" id="btnAddMap" style="flex:1">用地圖中心新增</button>
</div>

    <div class="list-title">行程列表</div>
    <div id="wpList"></div>
  </div>

  <script>
  (function () {
    var SUPABASE_URL = 'https://perfsipperncvjocznhl.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';

    var params = new URLSearchParams(location.search);
    var roomId = params.get('id') || params.get('room') || 'general';
    var roomName = params.get('name') ? decodeURIComponent(params.get('name')) : '集合地圖';
    document.getElementById('title').textContent = roomName + '・集合';
    document.getElementById('btnBack').href = roomId !== 'general'
      ? ('room.html?id=' + encodeURIComponent(roomId) + '&name=' + encodeURIComponent(roomName))
      : 'chat.html';

    var map = L.map('map').setView([23.97, 121.0], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var sb = null, me = null;
    var shareOn = false, watchId = null, uploadTimer = null;
    var myLat = null, myLng = null, myMarker = null;
    var wpMarkers = {};
    var peerMarkers = {};
    var waypoints = [];

    function setSub(t) { document.getElementById('sub').textContent = t; }
    function setShareStatus(t) { document.getElementById('shareStatus').textContent = t; }

    function numIcon(n) {
      return L.divIcon({
        className: '',
        html: '<div class="marker-num">' + n + '</div>',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    function geoErrorText(err) {
      if (!err) return '未知錯誤';
      if (err.code === 1) return '權限被拒：請到 iPhone設定→Safari→位置→允許';
      if (err.code === 2) return '目前無法取得位置（訊號／系統）';
      if (err.code === 3) return '定位逾時，請到戶外再試';
      return err.message || String(err);
    }

    async function bootAuth() {
      if (!window.supabase) {
        setSub('套件未載入');
        return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var sess = await sb.auth.getSession();
      if (!sess.data.session) {
        setSub('未登入（仍可本機定位）');
        return;
      }
      me = sess.data.session.user;
      setSub('已登入');
      await loadWaypoints();
      await loadPeers();
      listenSos();
      setInterval(loadPeers, 8000);
    }

    async function loadWaypoints() {
      if (!sb) return;
      var res = await sb.from('meetup_waypoints')
        .select('*')
        .eq('room_id', roomId)
        .order('seq', { ascending: true });
      if (res.error) {
        setSub('行程載入失敗：' + res.error.message);
        return;
      }
      waypoints = res.data || [];
      renderWaypoints();
    }

    function renderWaypoints() {
      Object.keys(wpMarkers).forEach(function (k) {
        map.removeLayer(wpMarkers[k]);
      });
      wpMarkers = {};

      var box = document.getElementById('wpList');
      box.innerHTML = '';
      if (!waypoints.length) {
        box.innerHTML = '<div style="color:#888;font-size:13px;padding:8px 0">尚未設定行程點</div>';
        return;
      }

      var bounds = [];
      waypoints.forEach(function (w) {
        var m = L.marker([w.lat, w.lng], { icon: numIcon(w.seq) }).addTo(map);
        var timeStr = w.meet_at ? new Date(w.meet_at).toLocaleString() : '時間未定';
        m.bindPopup('<b>#' + w.seq + ' ' + w.title + '</b><br>' + timeStr);
        wpMarkers[w.id] = m;
        bounds.push([w.lat, w.lng]);

        var div = document.createElement('div');
        div.className = 'wp-item';
        div.innerHTML =
          '<div class="num">' + w.seq + '</div>' +
          '<div style="flex:1">' +
            '<div style="font-weight:600">' + w.title + '</div>' +
            '<div style="color:#888;margin-top:2px">' + timeStr + '</div>' +
          '</div>' +
          '<button type="button" class="btn btn-outline" data-id="' + w.id + '">刪</button>';
        div.querySelector('button').onclick = function () { deleteWp(w.id); };
        box.appendChild(div);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [40, 40] });
    }

    async function addWaypoint(lat, lng) {
      if (!me || !sb) {
        alert('請先登入才能設定集合點');
        location.href = 'login.html';
        return;
      }
      var title = document.getElementById('wpTitle').value.trim() || ('集合點 ' + (waypoints.length + 1));
      var t = document.getElementById('wpTime').value;
      var meetAt = t ? new Date(t).toISOString() : null;
      var seq = waypoints.length ? (waypoints[waypoints.length - 1].seq + 1) : 1;

      var res = await sb.from('meetup_waypoints').insert({
        room_id: roomId,
        seq: seq,
        title: title,
        lat: lat,
        lng: lng,
        meet_at: meetAt,
        created_by: me.id
      }).select().single();

      if (res.error) {
        alert('新增失敗：' + res.error.message);
        return;
      }
      document.getElementById('wpTitle').value = '';
      await loadWaypoints();
    }
    async function searchPlace() {
  var q = document.getElementById('searchInput').value.trim();

  if (!q) {
    alert('請輸入要搜尋的地址或地名');
    return;
  }

  var box = document.getElementById('searchResults');

  box.style.display = 'block';
  box.innerHTML = '<div style="padding:10px;font-size:13px;color:#888">搜尋中…</div>';

  try {
    var url = 'https://nominatim.openstreetmap.org/search?format=json&q=' +
      encodeURIComponent(q) +
      '&limit=6&accept-language=zh-TW';

    var res = await fetch(url, {
      headers: {
        'Accept': 'application/json'
      }
    });

    var arr = await res.json();

    box.innerHTML = '';

    if (!arr || !arr.length) {
      box.innerHTML =
        '<div style="padding:10px;font-size:13px;color:#888">找不到地點</div>';
      return;
    }

    arr.forEach(function (item) {

      var div = document.createElement('div');

      div.style.cssText =
        'padding:10px 12px;' +
        'border-bottom:1px solid #f5f5f5;' +
        'font-size:13px;' +
        'cursor:pointer;';

      div.textContent = item.display_name;

      div.onclick = async function () {

        var lat = parseFloat(item.lat);
        var lng = parseFloat(item.lon);

        var shortName =
          (item.display_name || q).split(',')[0];

        // 如果地點名稱沒有輸入，
        // 自動使用搜尋結果名稱
        var titleInput =
          document.getElementById('wpTitle');

        if (!titleInput.value.trim()) {
          titleInput.value = shortName;
        }

        // 地圖移動到搜尋的位置
        map.setView([lat, lng], 16);

        // 在地圖上顯示搜尋位置
        L.circleMarker([lat, lng], {
          radius: 6,
          color: '#1565c0',
          fillColor: '#1565c0',
          fillOpacity: 0.8
        }).addTo(map);

        // 隱藏搜尋結果
        box.style.display = 'none';

        // 直接建立集合點
        await addWaypoint(lat, lng);
      };

      box.appendChild(div);
    });

  } catch (e) {

    box.innerHTML =
      '<div style="padding:10px;font-size:13px;color:#c62828">' +
      '搜尋失敗（網路或服務限制）' +
      '</div>';
  }
}

document.getElementById('btnSearch').onclick = searchPlace;
    async function deleteWp(id) {
      if (!sb || !me) return;
      var res = await sb.from('meetup_waypoints').delete().eq('id', id).eq('created_by', me.id);
      if (res.error) alert('刪除失敗：' + res.error.message);
      await loadWaypoints();
    }

    function updateMyMarker() {
      if (myLat == null) return;
      if (myMarker) myMarker.setLatLng([myLat, myLng]);
      else {
        myMarker = L.circleMarker([myLat, myLng], {
          radius: 8, color: '#06C755', fillColor: '#06C755', fillOpacity: 0.9
        }).addTo(map).bindPopup('我');
      }
    }

    async function uploadLocation() {
      if (!sb || !me || myLat == null) return;
      await sb.from('location_shares').upsert({
        user_id: me.id,
        room_id: roomId,
        lat: myLat,
        lng: myLng,
        display_name: (me.email || 'user').split('@')[0],
        updated_at: new Date().toISOString()
      });
    }

    async function loadPeers() {
      if (!sb || !roomId) return;
      var res = await sb.from('location_shares')
        .select('*')
        .eq('room_id', roomId)
        .gte('updated_at', new Date(Date.now() - 30 * 60 * 1000).toISOString());
      var rows = res.data || [];
      var count = 0;
      Object.keys(peerMarkers).forEach(function (k) {
        map.removeLayer(peerMarkers[k]);
      });
      peerMarkers = {};
      rows.forEach(function (r) {
        if (me && r.user_id === me.id) return;
        if (r.lat == null) return;
        count += 1;
        peerMarkers[r.user_id] = L.circleMarker([r.lat, r.lng], {
          radius: 7, color: '#1e88e5', fillColor: '#1e88e5', fillOpacity: 0.9
        }).addTo(map).bindPopup(r.display_name || '成員');
      });
      document.getElementById('partStatus').textContent =
        '目前分享定位人數：' + (count + (shareOn && myLat != null ? 1 : 0)) +
        '（含行程點 ' + waypoints.length + ' 個）';
    }

    function onPosition(pos) {
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;
      updateMyMarker();
      var t = new Date();
      setSub('定位中 ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0') + ':' +
        String(t.getSeconds()).padStart(2, '0'));
      uploadLocation();
      loadPeers();
    }

    function stopShare() {
      shareOn = false;
      if (watchId != null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (uploadTimer) {
        clearInterval(uploadTimer);
        uploadTimer = null;
      }
      document.getElementById('btnShare').textContent = '開啟定位';
      document.getElementById('btnShare').className = 'btn btn-green';
      setShareStatus('定位：關閉');
      setSub('定位已關閉');
    }

    function startShare() {
      if (!window.isSecureContext && location.protocol !== 'https:') {
        alert('定位需要 HTTPS。請用 GitHub Pages 網址開啟，不要用檔案直接開。');
        return;
      }
      if (!navigator.geolocation) {
        alert('此裝置／瀏覽器不支援定位');
        return;
      }
      shareOn = true;
      document.getElementById('btnShare').textContent = '關閉定位';
      document.getElementById('btnShare').className = 'btn btn-red';
      setShareStatus('定位：開啟中…');
      setSub('正在請求定位權限…');

      navigator.geolocation.getCurrentPosition(function (pos) {
        onPosition(pos);
        map.setView([myLat, myLng], 15);
        setShareStatus('定位：開啟');
      }, function (err) {
        stopShare();
        alert('定位失敗：' + geoErrorText(err));
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });

      watchId = navigator.geolocation.watchPosition(
        onPosition,
        function (err) {
          setSub('定位異常：' + geoErrorText(err));
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 3000 }
      );

      uploadTimer = setInterval(function () {
        if (myLat != null) uploadLocation();
      }, 5000);
    }

    document.getElementById('btnShare').onclick = function () {
      if (shareOn) stopShare();
      else startShare();
    };

    document.getElementById('btnAddHere').onclick = function () {
      if (myLat == null) {
        alert('請先開啟定位');
        return;
      }
      addWaypoint(myLat, myLng);
    };
    document.getElementById('btnAddMap').onclick = function () {
      var c = map.getCenter();
      addWaypoint(c.lat, c.lng);
    };

    document.getElementById('btnSos').onclick = async function () {
      if (!me || !sb) {
        alert('請先登入');
        return;
      }
      if (!confirm('向本群組／活動發送 SOS 求助？')) return;
      var res = await sb.from('sos_events').insert({
        room_id: roomId,
        user_id: me.id,
        display_name: (me.email || 'user').split('@')[0],
        lat: myLat,
        lng: myLng,
        message: '遇到危險或迷路，需要協助'
      });
      if (res.error) {
        alert('SOS 失敗：' + res.error.message);
        return;
      }
      if (myLat != null) {
        L.circleMarker([myLat, myLng], {
          radius: 12, color: '#c62828', fillColor: '#c62828', fillOpacity: 0.5
        }).addTo(map).bindPopup('SOS').openPopup();
      }
      alert('已向群組發送 SOS');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    };

    function listenSos() {
      if (!sb) return;
      sb.channel('sos-' + roomId)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'sos_events',
          filter: 'room_id=eq.' + roomId
        }, function (payload) {
          var row = payload.new;
          if (!row) return;
          var ban = document.getElementById('sosBanner');
          ban.textContent = '🚨 SOS ' + (row.display_name || '成員') + '：' + (row.message || '需要協助');
          ban.classList.add('show');
          if (row.lat != null) {
            L.circleMarker([row.lat, row.lng], {
              radius: 12, color: '#c62828', fillColor: '#c62828', fillOpacity: 0.5
            }).addTo(map).bindPopup('SOS ' + (row.display_name || '')).openPopup();
            map.setView([row.lat, row.lng], 15);
          }
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        })
        .subscribe();
    }

    bootAuth();
  })();
  </script>
  <script src="call-notify.js"></script>
</body>
</html>
