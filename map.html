<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>導航測速・安全團聚</title>


<!-- =========================================================
     Leaflet
     ========================================================= -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =========================================================
     Supabase
     ========================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<style>

/* =========================================================
   基本
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f5f5f5;
}


/* =========================================================
   地圖
   ========================================================= */

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: #dfe7ef;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   上方控制列
   ========================================================= */

.header {

  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  min-height: 58px;

  background: #06C755;

  color: white;

  display: flex;

  align-items: center;

  gap: 6px;

  padding: 8px;

  z-index: 2000;

  box-shadow:
    0 2px 10px rgba(0,0,0,.22);

  /* 加強鎖定，減少手機瀏覽器晃動 */
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
  will-change: transform;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}


.back {

  width: 34px;
  height: 38px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: white;

  text-decoration: none;

  font-size: 28px;

  flex-shrink: 0;
}


.header-info {

  flex: 1;

  min-width: 0;

  line-height: 1.15;
}


.header-title {

  font-size: 15px;

  font-weight: 800;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.header-sub {

  margin-top: 3px;

  font-size: 10px;

  opacity: .95;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =========================================================
   上方按鈕
   ========================================================= */

.top-btn {

  border: none;

  min-width: 40px;
  height: 38px;

  padding: 0 9px;

  border-radius: 10px;

  font-size: 13px;

  font-weight: 700;

  color: #333;

  background: white;

  box-shadow:
    0 2px 7px rgba(0,0,0,.15);

  flex-shrink: 0;

  cursor: pointer;
}


.top-btn.nav {

  background: #1677ff;

  color: white;
}


.top-btn.stop {

  background: #d93025;

  color: white;
}


.top-btn.silent {

  background: #333;

  color: white;
}


/* =========================================================
   SOS
   ========================================================= */

.sos-top {

  border: none;

  width: 43px;
  height: 38px;

  border-radius: 10px;

  background: #d93025;

  color: white;

  font-size: 14px;

  font-weight: 900;

  box-shadow:
    0 2px 8px rgba(0,0,0,.22);

  flex-shrink: 0;

  cursor: pointer;
}


/* =========================================================
   Leaflet 縮放控制
   不遮住上方按鈕
   ========================================================= */

.leaflet-top.leaflet-left {

  top: 66px;

  left: 8px;
}


.leaflet-control-zoom {

  margin-top: 0 !important;
}


.leaflet-control-zoom a {

  width: 38px !important;
  height: 38px !important;

  line-height: 38px !important;

  font-size: 22px !important;
}


/* =========================================================
   測速浮動資訊
   ========================================================= */

.speed-box {

  position: fixed;

  top: 68px;

  left: 55px;
  right: 55px;

  z-index: 1800;

  display: none;

  background:
    rgba(255,255,255,.96);

  border-radius: 13px;

  padding: 8px 11px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.22);

  font-size: 12px;
}


.speed-box.show {

  display: block;
}


.speed-box.danger {

  background: #ffe1e1;

  color: #8b0000;
}


.speed-title {

  font-weight: 900;

  font-size: 13px;
}


.speed-info {

  margin-top: 3px;

  line-height: 1.4;
}


.speed-address {

  margin-top: 2px;

  color: #666;

  font-size: 10px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =========================================================
   導航資訊
   ========================================================= */

.navigation-info {

  position: fixed;

  left: 10px;
  right: 10px;

  bottom: 10px;

  z-index: 1900;

  display: none;

  gap: 8px;
}


.navigation-info.show {

  display: flex;
}


.speed-current,
.navigation-direction {

  background:
    rgba(255,255,255,.95);

  border-radius: 14px;

  padding: 8px 12px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.2);

  flex: 1;

  text-align: center;
}


.info-label {

  font-size: 10px;

  color: #666;
}


.info-value {

  margin-top: 2px;

  font-size: 21px;

  font-weight: 900;
}


/* =========================================================
   一般面板
   ========================================================= */

.panel {

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 1700;

  background: white;

  border-radius:
    18px 18px
    0 0;

  box-shadow:
    0 -3px 20px rgba(0,0,0,.18);

  max-height: 28vh;          /* 大約 3 行左右的空間 */

  overflow-x: hidden;        /* 鎖住左右移動 */
  overflow-y: auto;          /* 只允許上下滾動 */

  -webkit-overflow-scrolling: touch;

  padding: 10px 12px 18px;

  transition:
    transform .25s ease;

  overscroll-behavior-x: none;   /* 防止左右彈性滾動 */
}


.panel.hidden {

  transform:
    translateY(110%);
}


.panel-handle {

  width: 42px;
  height: 4px;

  background: #ccc;

  border-radius: 10px;

  margin:
    0 auto
    9px;
}


/* =========================================================
   一般控制列
   ========================================================= */

.row {

  display: flex;

  gap: 7px;

  align-items: center;

  margin-bottom: 8px;

  flex-wrap: wrap;
}


.status {

  flex: 1;

  min-width: 120px;

  font-size: 12px;

  color: #555;
}


.btn {

  border: none;

  border-radius: 10px;

  padding: 9px 11px;

  font-size: 12px;

  font-weight: 700;

  cursor: pointer;
}


.btn-green {

  background: #06C755;

  color: white;
}


.btn-red {

  background: #e53935;

  color: white;
}


.btn-orange {

  background: #fb8c00;

  color: white;
}


.btn-outline {

  background: white;

  border: 1px solid #ddd;

  color: #333;
}


/* =========================================================
   行程
   ========================================================= */

.list-title {

  font-size: 12px;

  color: #888;

  margin:
    9px 0 5px;
}


input,
select {

  width: 100%;

  padding: 9px 10px;

  border:
    1px solid #e0e0e0;

  border-radius: 9px;

  font-size: 13px;

  margin-bottom: 7px;

  outline: none;
}


.wp-item {

  display: flex;

  gap: 8px;

  align-items: flex-start;

  padding: 8px 0;

  border-bottom:
    1px solid #f0f0f0;

  font-size: 12px;
}


.num {

  width: 25px;
  height: 25px;

  border-radius: 50%;

  background: #06C755;

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-weight: 700;

  flex-shrink: 0;
}


.marker-num {

  background: #06C755;

  color: white;

  border-radius: 50%;

  width: 28px;
  height: 28px;

  line-height: 28px;

  text-align: center;

  font-weight: 700;

  border: 2px solid white;

  box-shadow:
    0 1px 4px rgba(0,0,0,.3);
}


/* =========================================================
   SOS Banner
   ========================================================= */

.sos-banner {

  position: fixed;

  top: 62px;

  left: 10px;
  right: 10px;

  z-index: 2100;

  display: none;

  background: #c62828;

  color: white;

  padding: 9px 11px;

  border-radius: 11px;

  font-size: 12px;

  font-weight: 700;

  text-align: center;

  box-shadow:
    0 3px 12px rgba(0,0,0,.25);
}


.sos-banner.show {

  display: block;
}


/* =========================================================
   導航模式
   ========================================================= */

body.navigation-mode .panel {

  transform:
    translateY(110%);
}


body.navigation-mode .navigation-info {

  display: flex;
}


/* =========================================================
   搜尋結果
   ========================================================= */

#searchResults {

  display: none;

  border:
    1px solid #eee;

  border-radius: 9px;

  margin-bottom: 8px;

  max-height: 150px;

  overflow-y: auto;
}


/* =========================================================
   小螢幕
   ========================================================= */

@media (max-width: 390px) {

  .header {

    gap: 4px;

    padding-left: 5px;
    padding-right: 5px;
  }


  .header-title {

    font-size: 13px;
  }


  .header-sub {

    font-size: 9px;
  }


  .top-btn {

    min-width: 36px;

    height: 36px;

    padding: 0 6px;

    font-size: 11px;
  }


  .sos-top {

    width: 39px;

    height: 36px;

    font-size: 12px;
  }


  .speed-box {

    left: 52px;

    right: 52px;
  }

}


/* =========================================================
   群組成員定位標記樣式（家人不同顏色＋形狀）
   ========================================================= */

.group-member-leaflet-icon {
  background: transparent !important;
  border: none !important;
}

.group-member-marker {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,.45));
}

.member-shape {
  width: 22px;
  height: 22px;
  box-sizing: border-box;
}

/* 圓形 */
.member-circle {
  border-radius: 50%;
  border: 2px solid #fff;
}

/* 方形 */
.member-square {
  border-radius: 3px;
  border: 2px solid #fff;
}

/* 三角形 */
.member-triangle {
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-bottom: 22px solid;
  background: transparent !important;
}

/* 菱形 */
.member-diamond {
  width: 18px;
  height: 18px;
  transform: rotate(45deg);
  border: 2px solid #fff;
}

/* 星星 */
.member-star {
  font-size: 26px;
  line-height: 1;
  text-shadow: 0 0 2px #fff, 0 0 3px #fff;
}

/* 六角形 */
.member-hexagon {
  width: 22px;
  height: 20px;
  border-radius: 4px;
  border: 2px solid #fff;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

/* 五角形 */
.member-pentagon {
  width: 22px;
  height: 22px;
  border: 2px solid #fff;
  clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
}

/* 加號 */
.member-plus {
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 0 2px #fff;
}

/* SOS 專用 */
.group-member-sos {
  width: 42px;
  height: 42px;
  background: #ff0000;
  border-radius: 50%;
  border: 3px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 3px rgba(255,0,0,.35);
}

.group-member-sos-icon {
  color: white;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.5px;
}



.my-location-arrow {
  background: transparent !important;
  border: none !important;
}

/* 長按大頭針 */
.pin-marker {
  background: transparent !important;
  border: none !important;
}
.pin-emoji {
  font-size: 32px;
  line-height: 1;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.35));
  transform: translateY(-6px);
}


/* 抵達紀錄與出發提醒 */
.arrival-fab {
  position: fixed;
  right: 12px;
  bottom: 32vh;
  z-index: 1800;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: #fff;
  box-shadow: 0 3px 12px rgba(0,0,0,.25);
  font-size: 24px;
  cursor: pointer;
}
.arrival-panel {
  display: none;
  position: fixed;
  right: 12px;
  bottom: calc(32vh + 56px);
  z-index: 1800;
  width: min(280px, 85vw);
  max-height: 40vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.22);
  padding: 12px;
  font-size: 13px;
}
.arrival-panel.show { display: block; }
.arrival-panel h4 {
  margin: 0 0 8px;
  font-size: 14px;
}
.arrival-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid #eee;
}
.depart-banner {
  display: none;
  position: fixed;
  top: 70px;
  left: 12px;
  right: 12px;
  z-index: 1850;
  background: #fff3e0;
  border: 1px solid #ff9800;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
}
.depart-banner.show { display: block; }


.pin-choice-mask {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0,0,0,.35);
  align-items: flex-end;
  justify-content: center;
}
.pin-choice-mask.show {
  display: flex;
}
.pin-choice-box {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: 16px 16px 0 0;
  padding: 16px;
  box-shadow: 0 -4px 24px rgba(0,0,0,.2);
}
.pin-choice-box h3 {
  margin: 0 0 6px;
  font-size: 16px;
}
.pin-choice-box p {
  margin: 0 0 12px;
  font-size: 12px;
  color: #666;
}
.pin-choice-box .btn {
  margin-top: 8px;
}
.pin-choice-yellow {
  background: #f9a825 !important;
  color: #111 !important;
}
.pin-choice-red {
  background: #e53935 !important;
  color: #fff !important;
}


.admin-fab {
  position: fixed;
  left: 12px;
  bottom: 32vh;
  z-index: 1800;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: #fff;
  box-shadow: 0 3px 12px rgba(0,0,0,.25);
  font-size: 20px;
  cursor: pointer;
  display: none;
}
.admin-panel {
  display: none;
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 3000;
  max-height: 70vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 6px 28px rgba(0,0,0,.25);
  padding: 14px;
}
.admin-panel.show { display: block; }
.admin-panel h3 { margin: 0 0 8px; font-size: 16px; }
.admin-panel label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
.admin-panel input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-top: 4px;
  font-size: 14px;
}

</style>

</head>


<body>


<!-- =======================================================
     地圖
     ======================================================= -->

<div id="map"></div>

<button type="button" class="admin-fab" id="adminFab" title="開發者設定">⚙️</button>
<div class="admin-panel" id="adminPanel">
  <h3>⚙️ 開發者・臨時帳號</h3>
  <p style="font-size:12px;color:#666;margin:0 0 8px">
    僅開發者可見。可建立臨時帳號給來不及註冊的同學（免信箱驗證）。
  </p>
  <label>暱稱（顯示名稱）</label>
  <input id="tempDisplayName" placeholder="例如：同學A" />
  <label>登入帳號（英文/數字，會變成登入用 email）</label>
  <input id="tempLoginId" placeholder="例如：classmate01" />
  <label>密碼（至少 6 碼）</label>
  <input id="tempPassword" type="password" placeholder="臨時密碼" />
  <button type="button" class="btn btn-green" id="btnCreateTempUser" style="width:100%;margin-top:12px">
    建立臨時帳號
  </button>
  <div id="tempUserResult" style="margin-top:10px;font-size:12px;white-space:pre-wrap;color:#333"></div>
  <button type="button" class="btn btn-outline" id="btnCloseAdmin" style="width:100%;margin-top:8px">關閉</button>
</div>


<div class="pin-choice-mask" id="pinChoiceMask">
  <div class="pin-choice-box">
    <h3>📍 放置大頭針</h3>
    <p>請選擇這個位置的用途（顏色不同）</p>
    <button type="button" class="btn pin-choice-yellow" id="btnPinPrivate" style="width:100%">
      🟡 個人定位（只有自己看得到）
    </button>
    <button type="button" class="btn pin-choice-red" id="btnPinGroup" style="width:100%">
      🔴 集體集合點（所有人看得到）
    </button>
    <button type="button" class="btn btn-outline" id="btnPinCancel" style="width:100%">
      取消
    </button>
  </div>
</div>


<!-- 抵達人員 -->
<button type="button" class="arrival-fab" id="arrivalFab" title="誰已抵達">👤</button>
<div class="arrival-panel" id="arrivalPanel">
  <h4>抵達順序紀錄</h4>
  <div id="arrivalList"><div style="color:#888">尚無紀錄</div></div>
  <button type="button" class="btn btn-outline" id="btnClearArrivalLocal" style="width:100%;margin-top:8px;font-size:12px">
    清除本機紀錄
  </button>
</div>

<!-- 下一站出發提醒 -->
<div class="depart-banner" id="departBanner"></div>



<!-- =======================================================
     上方控制區
     ======================================================= -->

<div class="header">

  <a
    class="back"
    id="btnBack"
    href="chat.html"
  >
    ‹
  </a>


  <div class="header-info">

    <div
      class="header-title"
      id="title"
    >
      集合地圖
    </div>


    <div
      class="header-sub"
      id="sub"
    >
      尚未定位
    </div>

  </div>


  <!-- 語音 -->

  <button
    type="button"
    class="top-btn"
    id="voiceBtn"
    title="語音"
  >
    🔊
  </button>


  <!-- 導航 -->

  <button
    type="button"
    class="top-btn nav"
    id="navigationBtn"
  >
    開始導航
  </button>


  <!-- SOS -->

  <button
    type="button"
    class="sos-top"
    id="btnSosTop"
  >
    SOS
  </button>

</div>


<!-- =======================================================
     SOS 通知
     ======================================================= -->

<div
  class="sos-banner"
  id="sosBanner"
></div>


<!-- =======================================================
     測速資訊
     ======================================================= -->

<div
  class="speed-box"
  id="speedBox"
>

  <div
    class="speed-title"
    id="speedTitle"
  >
    📷 前方測速提醒
  </div>


  <div
    class="speed-info"
    id="speedInfo"
  ></div>


  <div
    class="speed-address"
    id="speedAddress"
  ></div>

</div>


<!-- =======================================================
     導航速度資訊
     ======================================================= -->

<div
  class="navigation-info"
  id="navigationInfo"
>

  <div class="speed-current">

    <div class="info-label">
      目前速度
    </div>


    <div
      class="info-value"
      id="currentSpeed"
    >
      0
    </div>


    <div class="info-label">
      km/h
    </div>

  </div>


  <div class="navigation-direction">

    <div class="info-label">
      行進方向
    </div>


    <div
      class="info-value"
      id="currentHeading"
    >
      --
    </div>


    <div class="info-label">
      °
    </div>

  </div>

</div>


<!-- =======================================================
     一般操作面板
     ======================================================= -->

<div
  class="panel"
  id="mainPanel"
>

  <div class="panel-handle"></div>


  <!-- 定位 -->

  <div class="row">

    <div
      class="status"
      id="shareStatus"
    >
      定位：關閉
    </div>


    <button
      type="button"
      class="btn btn-green"
      id="btnShare"
    >
      開啟定位
    </button>

  </div>


  <!-- 成員 -->

  <div
    class="status"
    id="partStatus"
  >
    參與者：—
  </div>


  <!-- =====================================================
       集合點
       ===================================================== -->

  <div class="list-title">
    新增行程／集合點
  </div>


  <input
    id="wpTitle"

function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

/* =========================================================
   距離
   ========================================================= */

function distanceMeters(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dp =
    (
      lat2 -
      lat1
    )
    *
    Math.PI /
    180;


  const dl =
    (
      lng2 -
      lng1
    )
    *
    Math.PI /
    180;


  const a =
    Math.sin(
      dp / 2
    ) ** 2
    +
    Math.cos(p1)
    *
    Math.cos(p2)
    *
    Math.sin(
      dl / 2
    ) ** 2;


  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(
        1 - a
      )
    )
  );

}


/* =========================================================
   方位角
   ========================================================= */

function bearingDegrees(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dl =
    (
      lng2 -
      lng1
    )
    *
    Math.PI /
    180;


  const y =
    Math.sin(dl)
    *
    Math.cos(p2);


  const x =
    Math.cos(p1)
    *
    Math.sin(p2)
    -
    Math.sin(p1)
    *
    Math.cos(p2)
    *
    Math.cos(dl);


  return (
    (
      Math.atan2(
        y,
        x
      )
      *
      180 /
      Math.PI
      +
      360
    )
    %
    360
  );

}


/* =========================================================
   方向差
   ========================================================= */

function angleDifference(
  a,
  b
) {

  return Math.abs(
    (
      (
        a -
        b +
        540
      )
      %
      360
    )
    -
    180
  );

}


/* =========================================================
   距離格式
   ========================================================= */

function formatDistance(
  meters
) {

  if (
    meters < 1000
  ) {

    return (
      Math.round(
        meters
      )
      +
      " m"
    );

  }


  return (
    (
      meters /
      1000
    ).toFixed(1)
    +
    " km"
  );

}


/* =========================================================

function geoErrorText(

) {

  if (!error) {

  }


  if (

  ) {

    return "定位權限被拒絕";

  }


  if (

  ) {

    return "目前無法取得位置";

  }


  if (
    error.code === 3
  ) {

    return "定位逾時";

  }


  return (
    error.message
    ||
    String(error)
  );

}


/* =========================================================
   7. 測速方向
   ========================================================= */

function directMatchesHeading(
  direct,
  heading
) {

  const text =
    String(
      direct ||
      ""
    );


  if (
    !Number.isFinite(
      heading
    )
  ) {

    return true;

  }


  if (
    text.includes("南北")
  ) {

    const d =
      Math.min(

        angleDifference(
          heading,
          0
        ),

        angleDifference(
          heading,
          180
        )

      );


    return d <= 55;

  }


  if (
    text.includes("東西")
  ) {

    const d =
      Math.min(

        angleDifference(
          heading,
          90
        ),

        angleDifference(
          heading,
          270
        )

      );


    return d <= 55;

  }


  return true;

}

/* =========================================================
   11. 找前方測速
   ========================================================= */

function findNearestRelevantCamera(
  lat,
  lng,
  heading
) {

  let best =
    null;


  for (
    const camera
    of cameras
  ) {

    const distance =
      distanceMeters(

        lat,
        lng,

        camera.latitude,
        camera.longitude

      );


    /*
     * 只找前方 2 公里
     */

    if (
      distance >
      2000
    ) {

      continue;

    }


    /*
     * 如果資料有方向，
     * 先判斷道路方向。
     */

    if (
      !directMatchesHeading(
        camera.direct,
        heading
      )
    ) {

      continue;

    }


    /*
     * 再判斷照相機是否在前方。
     */

    if (
      Number.isFinite(
        heading
      )
    ) {

      const toCamera =
        bearingDegrees(

          lat,
          lng,

          camera.latitude,
          camera.longitude

        );


      if (
        angleDifference(
          heading,
          toCamera
        )
        >
        70
      ) {

        continue;

      }

    }


    if (
      !best
      ||
      distance <
      best.distance
    ) {

      best = {

        camera:
          camera,

        distance:
          distance

      };

    }

  }


  return best;

}

/* =========================================================
   14. 計算 GPS 速度
   ========================================================= */

function getSpeed(
  position
) {

  if (
    !position ||
    !position.coords
  ) {

    return 0;

  }


  const gpsSpeed =
    Number(
      position.coords.speed
    );


  /*
   * GPS 有直接速度，
   * 優先使用。
   */

  if (
    Number.isFinite(
      gpsSpeed
    )
    &&
    gpsSpeed >= 0
  ) {

    return (
      gpsSpeed *
      3.6
    );

  }


  /*
   * 沒有 GPS speed，
   * 才使用兩點距離計算。
   */

  if (
    !lastPosition
  ) {

    return 0;

  }


  const dt =
    (
      position.timestamp -
      lastPosition.timestamp
    )
    /
    1000;


  if (
    dt <= 0
  ) {

    return 0;

  }


  const d =
    distanceMeters(

      lastPosition.coords.latitude,
      lastPosition.coords.longitude,

      position.coords.latitude,
      position.coords.longitude

    );


  return (
    d /
    dt
  )
  *
  3.6;

}


/* =========================================================
   15. GPS 位置處理
   ========================================================= */

function onPosition(
  position
) {

  if (
    !position ||
    !position.coords
  ) {

    return;

  }


  const coords =
    position.coords;


  const lat =
    Number(
      coords.latitude
    );


  const lng =
    Number(
      coords.longitude
    );


  const accuracy =
    Number(
      coords.accuracy
    );


  if (
    !Number.isFinite(lat)
    ||
    !Number.isFinite(lng)
  ) {

    return;

  }


  /*
   * GPS 精度太差時，
   * 不更新位置。
   */

  if (
    Number.isFinite(
      accuracy
    )
    &&
    accuracy >
    300
  ) {

    subEl.textContent =
      "GPS 訊號較弱 ±"
      +
      Math.round(
        accuracy
      )
      +
      "m";

    return;

  }


  /* -------------------------------------------------------
     速度
     ------------------------------------------------------- */

  let calculatedSpeed =
    getSpeed(
      position
    );


  if (
    !Number.isFinite(
      calculatedSpeed
    )
    ||
    calculatedSpeed <
    0
  ) {

    calculatedSpeed =
      0;

  }


  /*
   * GPS 直接速度
   */

  const gpsSpeed =
    Number(
      coords.speed
    );


  if (
    Number.isFinite(
      gpsSpeed
    )
    &&
    gpsSpeed >= 0
  ) {

    calculatedSpeed =
      gpsSpeed *
      3.6;

  }


  /*
   * 防止 GPS 跳點
   */

  if (
    calculatedSpeed >
    200
  ) {

    calculatedSpeed =
      currentSpeed;

  }


  /*
   * 速度平滑
   */

  if (
    Number.isFinite(
      currentSpeed
    )
    &&
    currentSpeed >
    0
  ) {

    currentSpeed =

      currentSpeed *
      0.7

      +

      calculatedSpeed *
      0.3;

  }
  else {

    currentSpeed =
      calculatedSpeed;

  }


  /* -------------------------------------------------------
     方向
     ------------------------------------------------------- */

  let heading =
    Number(
      coords.heading
    );


  /*
   * GPS 沒有 heading，
   * 使用移動座標計算。
   */

  if (
    !Number.isFinite(
      heading
    )
    &&
    lastPosition
  ) {

    const moved =
      distanceMeters(

        lastPosition.coords.latitude,
        lastPosition.coords.longitude,

        lat,
        lng

      );


    if (
      moved >= 8
    ) {

      heading =
        bearingDegrees(

          lastPosition.coords.latitude,
          lastPosition.coords.longitude,

          lat,
          lng

        );

    }

  }


  /*
   * 低速不要相信 GPS heading。
   */

  if (
    Number.isFinite(
      heading
    )
    &&
    currentSpeed >= 5
  ) {

    lastHeading =
      heading;

  }


  if (
    !Number.isFinite(
      heading
    )
  ) {

    heading =
      lastHeading;

  }


  /* -------------------------------------------------------
     保存位置
     ------------------------------------------------------- */

  myLat =
    lat;


  myLng =
    lng;


  /* -------------------------------------------------------
     顯示速度
     ------------------------------------------------------- */

  currentSpeedEl.textContent =
    Math.round(
      currentSpeed
    );


  currentHeadingEl.textContent =

    Number.isFinite(
      heading
    )

      ? Math.round(
          heading
        )

      : "--";


  /* -------------------------------------------------------
     GPS 狀態
     ------------------------------------------------------- */

  const now =
    new Date();


  subEl.textContent =

    "GPS ±"
    +
    (
      Number.isFinite(
        accuracy
      )

        ? Math.round(
            accuracy
          )

        : "--"
    )
    +
    "m｜"
    +
    now.getHours()
    +
    ":"
    +
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  /* -------------------------------------------------------
     我的定位標記（方向箭頭）
     ------------------------------------------------------- */

  const headingDeg = Number.isFinite(heading) ? heading : 0;

  const arrowHtml =
    '<div style="' +
      'width:36px;height:36px;' +
      'display:flex;align-items:center;justify-content:center;' +
      'transform:rotate(' + headingDeg + 'deg);' +
      'filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));' +
    '">' +
      '<div style="' +
        'width:0;height:0;' +
        'border-left:10px solid transparent;' +
        'border-right:10px solid transparent;' +
        'border-bottom:22px solid #06C755;' +
      '"></div>' +
    '</div>';

  if (
    !myMarker
  ) {

    myMarker =
      L.marker(

        [
          myLat,
          myLng
        ],

        {
          icon: L.divIcon({
            className: "my-location-arrow",
            html: arrowHtml,
            iconSize: [36, 36],
            iconAnchor: [18, 18]
          }),
          zIndexOffset: 1000
        }

      )
      .addTo(map)
      .bindPopup(
        "我的位置"
      );

  }
  else {

    myMarker.setLatLng([
      myLat,
      myLng
    ]);

    // 更新箭頭方向

    scheduleRouteUpdate();

    const icon = L.divIcon({
      className: "my-location-arrow",
      html: arrowHtml,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });
    myMarker.setIcon(icon);

  }


  /* -------------------------------------------------------
     GPS 精度圈
     ------------------------------------------------------- */

  if (
    Number.isFinite(
      accuracy
    )
  ) {

    if (
      !accuracyCircle
    ) {

      accuracyCircle =
        L.circle(

          [
            myLat,
            myLng
          ],

          {

            radius:
              accuracy,

            weight:
              1,

            fillOpacity:
              .06

          }

        ).addTo(map);

    }
    else {

      accuracyCircle.setLatLng([
        myLat,
        myLng
      ]);

      accuracyCircle.setRadius(
        accuracy
      );

    }

  }


  /* -------------------------------------------------------
     導航模式跟隨
     ------------------------------------------------------- */

  if (
    navigationOn
  ) {

    map.setView(

      [
        myLat,
        myLng
      ],

      Math.max(
        map.getZoom(),
        15
      ),

      {
        animate:
          true
      }

    );

  }


  /* -------------------------------------------------------
     測速判斷
     ------------------------------------------------------- */

  if (
    navigationOn &&
    camerasLoaded
  ) {

    const result =
      findNearestRelevantCamera(

        myLat,
        myLng,
        heading

      );


    showCameraWarning(
      result
    );

  }


  /* -------------------------------------------------------
     上傳位置
     ------------------------------------------------------- */

  if (
    me &&
    (
      shareOn ||
      navigationOn
    )
  ) {

    uploadLocation();

  }


  /*
   * 保存最後位置
   */

  lastPosition =
    position;

}


/* =========================================================
   16. 開始 GPS
   ========================================================= */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    alert(
      "此裝置不支援 GPS 定位"
    );

    return false;

  }


  if (
    location.protocol !==
      "https:"
    &&
    location.hostname !==
      "localhost"
  ) {

    alert(
      "定位需要 HTTPS，請使用 GitHub Pages"
    );

    return false;

  }


  if (
    watchId !== null
  ) {

    return true;

  }


  watchId =
    navigator.geolocation.watchPosition(

      onPosition,

      function (
        error
      ) {

        subEl.textContent =
          "GPS："
          +
          geoErrorText(
            error
          );

      },

      {

        enableHighAccuracy:
          true,

        maximumAge:
          1000,

        timeout:
          10000

      }

    );


  return true;

}


/* =========================================================
   17. 停止 GPS
   ========================================================= */

function stopGPS() {

  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId =
      null;

  }


  if (
    uploadTimer
  ) {

    clearInterval(
      uploadTimer
    );

    uploadTimer =
      null;

  }

}

let speechReady =

const savedVoiceName =
  localStorage.getItem(

/* =========================================================
   取得聲音
   ========================================================= */

function getAvailableVoices() {

  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    return [];

  }


  return window
    .speechSynthesis
    .getVoices();

}


/* =========================================================
   選擇預設中文聲音
   ========================================================= */

function chooseDefaultVoice() {

  const voices =
    getAvailableVoices();


  if (
    !voices.length
  ) {

    return null;

  }


  /*
   * 優先使用之前選擇
   */

  if (
    savedVoiceName
  ) {

    const saved =
      voices.find(
        function (
          voice
        ) {

          return (
            voice.name
            ===
            savedVoiceName
          );

        }
      );


    if (
      saved
    ) {

      return saved;

    }

  }


  /*
   * 台灣中文
   */

  let voice =
    voices.find(
      function (
        voice
      ) {

        return (
          voice.lang
            .toLowerCase()
          ===
          "zh-tw"
        );

      }
    );


  /*
   * 其他中文
   */

  if (
    !voice
  ) {

    voice =
      voices.find(
        function (
          voice
        ) {

          return (
            voice.lang
              .toLowerCase()
              .startsWith(
                "zh"
              )
          );

        }
      );

  }


  /*
   * 最後使用系統聲音
   */

  if (
    !voice
  ) {

    voice =
      voices[0];

  }


  return voice;

}


/* =========================================================
   初始化語音
   ========================================================= */

function initSpeech() {

  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    console.warn(
      "此裝置不支援語音"
    );

    return;

  }


  function refreshVoices() {

    const voices =
      getAvailableVoices();


    if (
      voices.length
    ) {

      speechReady =
        true;


      if (
        !selectedVoice
      ) {

        selectedVoice =
          chooseDefaultVoice();

      }

    }

  }


  refreshVoices();


  window
    .speechSynthesis
    .onvoiceschanged =
      refreshVoices;

}


/* =========================================================
   播放語音
   ========================================================= */

function speak(
  text
) {

  if (
    !voiceOn
  ) {

    return;

  }


  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    return;

  }


  if (
    !text
  ) {

    return;

  }


  const voices =
    getAvailableVoices();


  if (
    !selectedVoice
    &&
    voices.length
  ) {

    selectedVoice =
      chooseDefaultVoice();

  }


  try {

    window
      .speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    if (
      selectedVoice
    ) {

      utterance.voice =
        selectedVoice;

      utterance.lang =
        selectedVoice.lang;

    }
    else {

      utterance.lang =
        "zh-TW";

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    utterance.onerror =
      function (
        event
      ) {

        console.error(
          "語音播放錯誤：",
          event
        );

      };


    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch (
    error
  ) {

    console.error(
      "語音錯誤：",
      error
    );

  }

}


/* =========================================================
   iPhone / Safari 語音解鎖
   ========================================================= */

function unlockSpeech() {

  if (
    !(
      "speechSynthesis"
      in
      window
    )
  ) {

    return;

  }


  try {

    window
      .speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        "語音導航已開啟"
      );


    if (
      selectedVoice
    ) {

      utterance.voice =
        selectedVoice;

      utterance.lang =
        selectedVoice.lang;

    }
    else {

      utterance.lang =
        "zh-TW";

    }


    utterance.rate =
      1;


    utterance.volume =
      1;


    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch (
    error
  ) {

    console.error(
      "語音初始化失敗：",
      error
    );

  }

}


/* =========================================================
   語音選擇
   ========================================================= */

function showVoiceSelector() {

  const voices =
    getAvailableVoices();


  if (
    !voices.length
  ) {

    alert(
      "目前還沒有取得手機語音清單，請稍後再試。"
    );

    return;

  }


  const chineseVoices =
    voices.filter(
      function (
        voice
      ) {

        return voice.lang
          .toLowerCase()
          .startsWith(
            "zh"
          );

      }
    );


  const list =
    chineseVoices.length
      ? chineseVoices
      : voices;


  let message =
    "選擇語音：\n\n";


  list.forEach(
    function (
      voice,
      index
    ) {

      message +=

        (
          index +
          1
        )
        +
        ". "
        +
        voice.name
        +
        "（"
        +
        voice.lang
        +
        "）";


      if (
        selectedVoice
        &&
        voice.name
        ===
        selectedVoice.name
      ) {

        message +=
          " ✓";

      }


      message +=
        "\n";

    }
  );


  const answer =
    prompt(

      message
      +
      "\n請輸入編號："

    );


  if (
    answer ===
    null
  ) {

    return;

  }


  const index =
    parseInt(
      answer,
      10
    );


  if (
    !Number.isInteger(
      index
    )
    ||
    index <
    1
    ||
    index >
    list.length
  ) {

    alert(
      "編號無效"
    );

    return;

  }


  selectedVoice =
    list[
      index -
      1
    ];


  localStorage.setItem(
    "safeReunionVoice",
    selectedVoice.name
  );


  speak(
    "這是新的導航語音"
  );

}

let myHeading = null;

/* =========================================================
   手機方向／羅盤
   ========================================================= */

function normalizeHeading(value) {
  if (value == null || !Number.isFinite(Number(value))) {
    return null;
  }

  let h = Number(value) % 360;
  if (h < 0) h += 360;

  return h;
}

function handleDeviceOrientation(event) {

  console.log(
    "方向事件：",
    {
      alpha: event.alpha,
      beta: event.beta,
      gamma: event.gamma,
      webkitCompassHeading:
        event.webkitCompassHeading
    }
  );

  let heading = null;

  if (
    event.webkitCompassHeading != null &&
    Number.isFinite(
      Number(event.webkitCompassHeading)
    )
  ) {

    heading =
      Number(
        event.webkitCompassHeading
      );

  }
  else if (
    event.alpha != null &&
    Number.isFinite(
      Number(event.alpha)
    )
  ) {

    heading =
      360 -
      Number(event.alpha);

  }

  heading =
    normalizeHeading(heading);

  if (heading != null) {

    myHeading =
      heading;

    console.log(
      "目前手機方向 heading =",
      myHeading
    );

  }

}

/* ---------------------------------------------------------
   啟動手機方向感測
   --------------------------------------------------------- */

async function startDeviceOrientation() {

  try {

    /*
     * iPhone / iPad 需要使用者操作後授權
     */
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") {

        console.warn(
          "手機方向權限未授權"
        );

        return false;
      }

    }

    window.addEventListener(
      "deviceorientation",
      handleDeviceOrientation,
      true
    );

    console.log(
      "手機方向感測已啟動"
    );

    return true;

  }
  catch (error) {

    console.error(
      "手機方向啟動失敗：",
      error
    );

    return false;
  }

}
/* =========================================================
   24. 上傳位置
   ========================================================= */

async function uploadLocation() {

  if (!me || !me.id) return;
  if (!roomId) return;
  if (myLat == null || myLng == null) return;

  const payload = {

    user_id:
      me.id,

    room_id:
      roomId,

    lat:
      Number(myLat),

    lng:
      Number(myLng),

    display_name:
      (me.user_metadata &&
       me.user_metadata.full_name) ||
      (me.email
        ? me.email.split("@")[0]
        : "成員"),

    updated_at:
      new Date().toISOString(),

    heading:
      myHeading != null
        ? Number(myHeading)
        : null

  };

  const result =
    await sb
      .from("location_shares")
      .upsert(
        payload,
        {
          onConflict:
            "user_id,room_id"
        }
      );

  if (result.error) {

    console.error(
      "定位上傳失敗：",
      result.error
    );

  } else {

    console.log(
      "定位＋方向已更新：",
      payload
    );

  }

}

  "#AD1457", // 粉紅
  "#5D4037", // 咖啡
  "#283593", // 靛藍
  "#558B2F"  // 黃綠
];

function memberColorFromId(userId) {

  const text =
    String(userId || "member");

  let hash = 0;

  for (let i = 0; i < text.length; i++) {
    hash =
      ((hash << 5) - hash) +
      text.charCodeAt(i);

    hash |= 0;
  }

  const index =
    Math.abs(hash) %
    MEMBER_PIN_COLORS.length;

  return MEMBER_PIN_COLORS[index];
}

/* ---------------------------------------------------------
   載入群組成員位置
   --------------------------------------------------------- */

async function loadPeers() {

  if (!roomId) {
    return;
  }

  try {

    const result =
      await sb
        .from("location_shares")
        .select("*")
        .eq("room_id", roomId)
        .gte(
          "updated_at",
          new Date(
            Date.now() -
            30 * 60 * 1000
          ).toISOString()
        );

    if (result.error) {

      console.error(
        "成員定位錯誤：",
        result.error
      );

      return;
    }

    const rows =
      result.data || [];

    console.log(
      "[loadPeers]",
      "roomId=",
      roomId,
      "收到定位資料=",
      rows.length,
      rows
    );


    /* -----------------------------------------------------
       供路線圖使用
       ----------------------------------------------------- */

    window._lastPeerRows =
      rows;

    scheduleRouteUpdate();


    /* -----------------------------------------------------
       記錄目前資料庫裡仍然存在的成員
       ----------------------------------------------------- */

    const activePeerIds = {};


    /* -----------------------------------------------------
       更新 / 建立 Marker
       不再每次全部刪除重建
       ----------------------------------------------------- */

    rows.forEach(function (row) {

      /*
       * 自己不重複顯示
       */
      if (
        me &&
        String(row.user_id) ===
        String(me.id)
      ) {

        return;

      }


      /*
       * 座標檢查
       */
      if (
        row.lat == null ||
        row.lng == null
      ) {

        return;

      }


      const lat =
        Number(row.lat);

      const lng =
        Number(row.lng);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return;

      }


      const userId =
        String(row.user_id);


      activePeerIds[userId] =
        true;


      /*
       * 固定顏色
       */
      const color =
        memberColorFromId(
          userId
        );


      /*
       * 已經有 Marker
       * → 只移動位置
       */
      if (
        peerMarkers[userId]
      ) {

        const marker =
          peerMarkers[userId];


        /*
         * 只更新座標
         *
         * 不 remove
         * 不重新 add
         * 不重新建立 icon
         *
         * 這樣就不會出現：
         * 出現 → 消失 → 出現
         */
        marker.setLatLng([
          lat,
          lng
        ]);


        /*
         * 更新 Popup 內容
         */
        marker.setPopupContent(
          createMemberPopup(
            row,
            color
          )
        );


        return;

      }


      /* ---------------------------------------------------
         第一次出現 → 建立大頭針
         --------------------------------------------------- */

      const marker =
        L.marker(
          [
            lat,
            lng
          ],
          {
            icon:
              createMemberPinIcon(
                color
              ),

            zIndexOffset:
              500
          }
        );


      marker
        .addTo(map)
        .bindPopup(
          createMemberPopup(
            row,
            color
          )
        );


      /*
       * 點擊大頭針
       */
      marker.on(
        "click",
        function () {

          marker.openPopup();

        }
      );


      /*
       * 保存 Marker
       */
      peerMarkers[userId] =
        marker;

    });


    /* -----------------------------------------------------
       移除已經不在資料庫的舊成員
       ----------------------------------------------------- */

    Object.keys(
      peerMarkers
    ).forEach(
      function (userId) {

        if (
          !activePeerIds[userId]
        ) {

          const marker =
            peerMarkers[userId];


          if (
            marker &&
            map.hasLayer(marker)
          ) {

            map.removeLayer(
              marker
            );

          }


          delete peerMarkers[
            userId
          ];

        }

      }
    );


    /* -----------------------------------------------------
       計算目前分享定位人數
       ----------------------------------------------------- */

    let count = 0;

    rows.forEach(
      function (row) {

        if (
          me &&
          String(row.user_id) ===
          String(me.id)
        ) {

          return;

        }

        if (
          row.lat == null ||
          row.lng == null
        ) {

          return;

        }

        const lat =
          Number(row.lat);

        const lng =
          Number(row.lng);

        if (
          Number.isFinite(lat) &&
          Number.isFinite(lng)
        ) {

          count++;

        }

      }
    );


    /*
     * 狀態文字
     */
    const statusEl =
      document.getElementById(
        "partStatus"
      );


    if (statusEl) {

      statusEl.textContent =
        "目前分享定位人數：" +
        (
          count +
          (
            shareOn &&
            myLat != null
              ? 1
              : 0
          )
        ) +
        "（含行程點 " +
        waypoints.length +
        " 個）";

    }

  }
  catch (error) {

    console.error(
      "成員定位例外：",
      error
    );

  }

}

/* =========================================================
   成員定位即時更新
   ========================================================= */

function startPeerRealtime() {

  if (
    !roomId ||
    !sb
  ) {

    return;
  }

  /*
   * 避免重複建立
   */
  if (peerChannel) {

    return;
  }

  peerChannel =
    sb
      .channel(
        "location-shares-" +
        roomId
      )

      .on(

        "postgres_changes",

        {

          event:
            "*",

          schema:
            "public",

          table:
            "location_shares",

          filter:
            "room_id=eq." +
            roomId

        },

        function () {

          /*
           * 有任何成員位置變化，
           * 立即重新抓一次整個群組。
           */
          loadPeers();

        }

      )

      .subscribe(

        function (status) {

          console.log(
            "成員定位 Realtime：",
            status
          );

        }

      );

}


/* =========================================================
   成員定位輪詢備援
   ========================================================= */

function startPeerPolling() {

  if (
    peerTimer
  ) {

    clearInterval(
      peerTimer
    );

  }

  /*
   * 第一次立即載入
   */
  loadPeers();

  /*
   * 每 3 秒同步一次。
   *
   * 即使 Realtime 沒有正常工作，
   * 成員仍然可以出現。
   */
  peerTimer =
    setInterval(
      function () {

        if (
          roomId
        ) {

          loadPeers();

        }

      },
      3000
    );

}

      .from(
        "meetup_waypoints"

      .select("*")

      .order(

  scheduleRouteUpdate();

/* =========================================================
   28. 顯示集合點
   ========================================================= */

function renderWaypoints() {

  /*
   * 清除舊標記
   */

  Object.keys(
    wpMarkers
  ).forEach(
    function (
      key
    ) {

      if (
        map.hasLayer(
          wpMarkers[key]
        )
      ) {

        map.removeLayer(
          wpMarkers[key]
        );

      }

    }
  );


  wpMarkers =
    {};


  const box =
    document.getElementById(
      "wpList"
    );


  box.innerHTML =
    "";


  if (
    !waypoints.length
  ) {

    box.innerHTML =

      '<div style="color:#888;font-size:12px;padding:8px 0">'
      +
      "尚未設定行程點"
      +
      "</div>";

    return;

  }


  waypoints.forEach(
    function (
      w
    ) {

      const isOwner =
        me &&
        w.created_by &&
        String(w.created_by) === String(me.id);

      const marker =
        L.marker(

          [
            w.lat,
            w.lng
          ],

          {
            icon:
              (typeof createColoredPinIcon === "function"
                ? createColoredPinIcon("#e53935", "集合")
                : numIcon(w.seq)),
            draggable: !!isOwner   // 只有放大頭針的人能移動
          }

        )
        .addTo(
          map
        );

      // 擁有者可拖曳更新位置（大家都會看到）
      if (isOwner) {
        marker.on("dragend", async function (e) {
          const pos = e.target.getLatLng();
          const result = await sb
            .from("meetup_waypoints")
            .update({ lat: pos.lat, lng: pos.lng })
            .eq("id", w.id);

          if (result.error) {
            alert("移動集合點失敗：" + result.error.message);
            // 還原位置
            marker.setLatLng([w.lat, w.lng]);
            return;
          }

          w.lat = pos.lat;
          w.lng = pos.lng;
          await loadWaypoints();
        });
      }


      const timeStr =
        w.meet_at

          ? new Date(
              w.meet_at
            ).toLocaleString(
              "zh-TW"
            )

          : "時間未定";


      const ownerHint =
        (me && w.created_by && String(w.created_by) === String(me.id))
          ? '<br><span style="font-size:11px;color:#888">可拖曳移動位置（僅建立者）</span>'
          : '';

      marker.bindPopup(

        "<b>📍 #"
        +
        w.seq
        +
        " "
        +
        escapeHtml(
          w.title
        )
        +
        "</b>"
        +
        "<br>"
        +
        escapeHtml(
          timeStr
        )
        +
        ownerHint

      );


      wpMarkers[
        w.id
      ] =
        marker;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "wp-item";


      div.innerHTML =

        '<div class="num">'
        +
        escapeHtml(
          w.seq
        )
        +
        "</div>"
        +

        '<div style="flex:1">'
        +

        '<div style="font-weight:600">'
        +
        escapeHtml(
          w.title
        )
        +
        "</div>"
        +

        '<div style="color:#888;margin-top:2px">'
        +
        escapeHtml(
          timeStr
        )
        +
        "</div>"
        +

        "</div>"
        +

        '<button type="button" class="btn btn-outline">'
        +
        "刪"
        +
        "</button>";


      div
        .querySelector(
          "button"
        )
        .onclick =
        function () {

          deleteWp(
            w.id
          );

        };


      box.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   HTML 安全
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

async function addWaypoint(
  lat,
  lng
) {

  if (
    !me
  ) {

    alert(
      "請先登入才能設定集合點"
    );

    return;

  }


  if (
    !Number.isFinite(
      lat
    )
    ||
    !Number.isFinite(
      lng
    )
  ) {

    alert(
      "集合點座標無效"
    );

    return;

  }


  const titleInput =
    document.getElementById(
      "wpTitle"
    );


  const timeInput =
    document.getElementById(
      "wpTime"
    );


  const title =
    titleInput.value.trim()
    ||
    (
      "集合點 "
      +
      (
        waypoints.length +
        1
      )
    );


  const t =
    timeInput.value;


  let meetAt =
    null;


  if (
    t
  ) {

    const date =
      new Date(
        t
      );


    if (
      !Number.isNaN(
        date.getTime()
      )
    ) {

      meetAt =
        date.toISOString();

    }

  }


  const seq =
    waypoints.length

      ? (
          Math.max(
            ...waypoints.map(
              function (
                w
              ) {

                return (
                  Number(
                    w.seq
                  )
                  ||
                  0
                );

              }
            )
          )
          +
          1
        )

      : 1;


  const result =
    await sb
      .from(
        "meetup_waypoints"
      )
      .insert(

        {

          room_id:
            roomId,

          seq:
            seq,

          title:
            title,

          lat:
            lat,

          lng:
            lng,

          meet_at:
            meetAt,

          created_by:
            me.id

        }

      )
      .select()
      .single();


  if (result.error) {
    alert(
      "集體集合點新增失敗：" +
      result.error.message +
      "\n（若權限不足請檢查 Supabase meetup_waypoints 的 RLS）"
    );
    throw new Error(result.error.message);
  }


  titleInput.value =
    "";


  timeInput.value =
    "";


  await loadWaypoints();


  await loadPeers();

}

  await loadWaypoints();


  await loadPeers();

}

const GOOGLE_SEARCH_LIMIT = 8000;   // 達到此次數自動切回台灣模式

function getSearchCountKey() {
  const now = new Date();
  return "google_search_count_" + now.getFullYear() + "_" + (now.getMonth() + 1);
}

function getSearchCount() {
  return parseInt(localStorage.getItem(getSearchCountKey()) || "0", 10);
}

function increaseSearchCount() {
  const key = getSearchCountKey();
  const count = getSearchCount() + 1;
  localStorage.setItem(key, String(count));
  updateSearchCountLabel();
  return count;
}

function updateSearchCountLabel() {
  const el = document.getElementById("searchCountLabel");
  if (!el) return;

  // 只有 Google 模式才顯示使用次數；台灣／百度不顯示
  if (typeof currentMapMode !== "undefined" && currentMapMode === "google") {
    const count = getSearchCount();
    el.style.display = "";
    el.textContent = "Google：" + count + " / 10000";
    if (count >= GOOGLE_SEARCH_LIMIT) {
      el.style.color = "#c62828";
    } else {
      el.style.color = "#666";
    }
  } else {
    el.style.display = "none";
    el.textContent = "";
  }
}

/* =========================================================
   行走路線圖
   自己：實線
   其他人：虛線
   目標：目前第一個集合點
   ========================================================= */

function clearAllRouteLines() {
  Object.keys(routeLines).forEach(function (key) {
    if (map.hasLayer(routeLines[key])) {
      map.removeLayer(routeLines[key]);
    }
  });
  routeLines = {};
}

function getActiveMeetingPoint() {
  if (!waypoints || !waypoints.length) return null;
  // 取第一個（seq 最小）集合點
  return waypoints[0];
}

async function fetchRouteCoords(fromLat, fromLng, toLat, toLng) {
  // OSRM 公開服務（步行）
  const url =
    "https://router.project-osrm.org/route/v1/foot/" +
    fromLng + "," + fromLat + ";" +
    toLng + "," + toLat +
    "?overview=full&geometries=geojson";

  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.routes || !data.routes.length) return null;

    const coords = data.routes[0].geometry.coordinates.map(function (c) {
      return [c[1], c[0]]; // geojson 是 [lng,lat] → leaflet [lat,lng]
    });

    const summary = {
      distance: data.routes[0].distance, // meters
      duration: data.routes[0].duration  // seconds
    };

    return { coords: coords, summary: summary };
  } catch (e) {
    console.error("路線取得失敗：", e);
    return null;
  }
}

function drawRouteLine(key, coords, isSelf, color) {
  if (routeLines[key] && map.hasLayer(routeLines[key])) {
    map.removeLayer(routeLines[key]);
  }

  if (!coords || coords.length < 2) return;

  const line = L.polyline(coords, {
    color: color || (isSelf ? "#1565c0" : "#7e57c2"),
    weight: isSelf ? 5 : 4,
    opacity: isSelf ? 0.9 : 0.7,
    dashArray: isSelf ? null : "10, 10",  // 自己實線，其他人虛線
    lineJoin: "round"
  }).addTo(map);

  routeLines[key] = line;
}

async function updateAllRoutes() {
  const target = getActiveMeetingPoint();
  if (!target || !Number.isFinite(target.lat) || !Number.isFinite(target.lng)) {
    clearAllRouteLines();
    return;
  }

  // 1. 自己的路線（實線）
  if (myLat != null && myLng != null) {
    const mine = await fetchRouteCoords(myLat, myLng, target.lat, target.lng);
    if (mine) {
      drawRouteLine("me", mine.coords, true, "#1565c0");
    }
  }

  // 2. 其他家人的路線（虛線）
  // peerMarkers 的 key 是 user_id，需要座標
  // 從最近一次 loadPeers 的資料比較難拿，改從 DOM / 全域暫存
  if (window._lastPeerRows && Array.isArray(window._lastPeerRows)) {
    for (let i = 0; i < window._lastPeerRows.length; i++) {
      const row = window._lastPeerRows[i];
      if (!row || !row.user_id) continue;
      if (me && String(row.user_id) === String(me.id)) continue;

      const lat = Number(row.lat);
      const lng = Number(row.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

      // 用成員顏色（若有）
      let color = "#7e57c2";
      if (window.GroupLocationIdentifiers && row.color_id) {
        try {
          const ident = window.GroupLocationIdentifiers.createMemberIdentifier(row);
          if (ident && ident.color) color = ident.color;
        } catch (e) {}
      }

      const route = await fetchRouteCoords(lat, lng, target.lat, target.lng);
      if (route) {
        drawRouteLine("peer_" + row.user_id, route.coords, false, color);
      }
    }
  }
}

function scheduleRouteUpdate() {
  if (routeUpdateTimer) clearTimeout(routeUpdateTimer);
  routeUpdateTimer = setTimeout(function () {
    updateAllRoutes();
  }, 1200);
}

/* =========================================================
   抵達紀錄 + 下一站出發提醒
   ========================================================= */

let arrivalHistory = [];  // {waypointId, name, time, order}
let currentFocusWaypointId = null;
let nextDepartArrow = null;
let arrivalCheckTimer = null;

function arrivalStorageKey() {
  const uid = (me && me.id) ? me.id : "guest";
  return "arrival_history_" + roomId + "_" + uid;
}

function loadArrivalHistory() {
  try {
    const raw = localStorage.getItem(arrivalStorageKey());
    arrivalHistory = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arrivalHistory)) arrivalHistory = [];
  } catch (e) {
    arrivalHistory = [];
  }
}

function saveArrivalHistory() {
  try {
    localStorage.setItem(arrivalStorageKey(), JSON.stringify(arrivalHistory));
  } catch (e) {}
}

function renderArrivalList() {
  const box = document.getElementById("arrivalList");
  if (!box) return;

  if (!arrivalHistory.length) {
    box.innerHTML = '<div style="color:#888">尚無紀錄</div>';
    return;
  }

  // 依時間排序
  const sorted = arrivalHistory.slice().sort(function (a, b) {
    return new Date(a.time) - new Date(b.time);
  });

  box.innerHTML = sorted.map(function (item, idx) {
    const t = new Date(item.time).toLocaleString("zh-TW");
    return (
      '<div class="arrival-item">' +
        '<div><b>#' + (idx + 1) + '</b> ' + escapeHtml(item.name || "我") +
        '<div style="font-size:11px;color:#888">' + escapeHtml(item.place || "") + '</div></div>' +
        '<div style="font-size:11px;color:#666">' + escapeHtml(t) + '</div>' +
      '</div>'
    );
  }).join("");
}

function markArrivedAtWaypoint(w) {
  if (!w || !w.id) return;
  // 同一集合點只記一次
  const exists = arrivalHistory.some(function (h) {
    return String(h.waypointId) === String(w.id);
  });
  if (exists) return;

  arrivalHistory.push({
    waypointId: w.id,
    name: (me && (me.user_metadata && me.user_metadata.full_name)) || "我",
    place: w.title || ("集合點 #" + w.seq),
    time: new Date().toISOString()
  });
  saveArrivalHistory();
  renderArrivalList();
}

function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad;
  const dLng = (lng2 - lng1) * toRad;
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(a));
}

function checkArrivalByDistance() {
  if (myLat == null || myLng == null) return;
  if (!waypoints || !waypoints.length) return;

  // 檢查是否接近任一集合點（80 公尺內）
  waypoints.forEach(function (w) {
    const d = distanceMeters(myLat, myLng, w.lat, w.lng);
    if (d <= 80) {
      markArrivedAtWaypoint(w);
    }
  });

  updateDepartBanner();
}

function getNextWaypointAfterArrived() {
  if (!waypoints || waypoints.length < 2) return null;
  // 找「已抵達的最後一個」的下一個
  const arrivedIds = {};
  arrivalHistory.forEach(function (h) {
    arrivedIds[String(h.waypointId)] = true;
  });

  for (let i = 0; i < waypoints.length - 1; i++) {
    if (arrivedIds[String(waypoints[i].id)]) {
      const next = waypoints[i + 1];
      if (!arrivedIds[String(next.id)]) {
        return { current: waypoints[i], next: next };
      }
    }
  }
  // 若第一個都還沒抵達，不顯示下一站
  return null;
}

function updateDepartBanner() {
  const banner = document.getElementById("departBanner");
  if (!banner) return;

  const pair = getNextWaypointAfterArrived();
  if (!pair) {
    banner.classList.remove("show");
    if (nextDepartArrow && map.hasLayer(nextDepartArrow)) {
      map.removeLayer(nextDepartArrow);
      nextDepartArrow = null;
    }
    return;
  }

  const next = pair.next;
  const arriveStr = next.meet_at
    ? new Date(next.meet_at).toLocaleString("zh-TW")
    : "時間未定（發起人尚未設定）";

  // 出發時間：若有 meet_at，提前 0 顯示為「請依發起人時間出發」
  // 簡化：顯示下一站預計到達時間，並提醒出發
  banner.innerHTML =
    '<b>➡️ 前往下一集合點</b><br>' +
    escapeHtml(next.title || ("集合點 #" + next.seq)) + '<br>' +
    '<span style="color:#e65100">預計到達：' + escapeHtml(arriveStr) + '</span><br>' +
    '<span style="font-size:11px;color:#666">請依發起人設定時間出發（地圖箭頭指向下一站）</span>';

  banner.classList.add("show");

  // 地圖箭頭：從目前位置指向下一站（簡化用 polyline 箭頭感）
  if (myLat != null && myLng != null) {
    if (nextDepartArrow && map.hasLayer(nextDepartArrow)) {
      map.removeLayer(nextDepartArrow);
    }
    nextDepartArrow = L.polyline(
      [[myLat, myLng], [next.lat, next.lng]],
      {
        color: "#ff9800",
        weight: 4,
        opacity: 0.85,
        dashArray: "1, 8"
      }
    ).addTo(map);
  }
}

function setSatellite(on) {
  satelliteOn = !!on;
  const btn = document.getElementById("btnSatellite");

    if (typeof taiwanLayerBackup !== "undefined" && map.hasLayer(taiwanLayerBackup)) {
      map.removeLayer(taiwanLayerBackup);
    }
    if (!map.hasLayer(satelliteLayer)) {
      satelliteLayer.addTo(map);
    }
    if (btn) {
      btn.classList.add("btn-green");
      btn.classList.remove("btn-outline");
      btn.textContent = "衛星圖（開）";
    }
  } else {
    if (map.hasLayer(satelliteLayer)) map.removeLayer(satelliteLayer);
    if (btn) {
      btn.classList.add("btn-outline");
      btn.classList.remove("btn-green");
      btn.textContent = "衛星圖";
    }
    // 恢復目前模式底圖
    if (typeof switchMapMode === "function") {
      switchMapMode(currentMapMode || "taiwan");
    }
  }

  setTimeout(function () {
    try { map.invalidateSize(); } catch (e) {}
  }, 100);
}

function createPinIcon(color) {
  // color: "yellow" | "red"
  const emoji = color === "red" ? "📍" : "📍";
  const filter =
    color === "red"
      ? "drop-shadow(0 0 0 #e53935) drop-shadow(0 2px 3px rgba(0,0,0,.4))"
      : "drop-shadow(0 0 0 #f9a825) drop-shadow(0 2px 3px rgba(0,0,0,.4)) hue-rotate(5deg) saturate(2.2) brightness(1.15)";

  return L.divIcon({
    className: "pin-marker",
    html:
      '<div class="pin-emoji" style="filter:' + filter + '">' +
      emoji +
      "</div>",
    iconSize: [36, 42],
    iconAnchor: [18, 40],
    popupAnchor: [0, -36]
  });
}

function createColoredPinIcon(hexColor, label) {
  // SVG pin for clearer color difference
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="42" viewBox="0 0 36 42">' +
    '<path d="M18 0C10.3 0 4 6.3 4 14c0 10.5 14 28 14 28s14-17.5 14-28C32 6.3 25.7 0 18 0z" fill="' + hexColor + '" stroke="#fff" stroke-width="2"/>' +
    '<circle cx="18" cy="14" r="5" fill="#fff"/>' +
    "</svg>";

  return L.divIcon({
    className: "pin-marker",
    html: '<div style="width:36px;height:42px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))">' + svg + "</div>",
    iconSize: [36, 42],
    iconAnchor: [18, 40],
    popupAnchor: [0, -36]
  });
}

function getPrivatePinsStorageKey() {
  const uid = (me && me.id) ? me.id : "guest";
  return "private_pins_" + roomId + "_" + uid;
}

function loadPrivatePinsFromStorage() {
  try {
    const raw = localStorage.getItem(getPrivatePinsStorageKey());
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function savePrivatePinsToStorage() {
  try {
    const data = privatePins.map(function (p) {
      return { id: p.id, lat: p.lat, lng: p.lng, title: p.title || "" };
    });
    localStorage.setItem(getPrivatePinsStorageKey(), JSON.stringify(data));
  } catch (e) {}
}

function clearTempPin() {
  if (tempPinMarker && map.hasLayer(tempPinMarker)) {
    map.removeLayer(tempPinMarker);
  }
  tempPinMarker = null;
  longPressLatLng = null;
}

function renderPrivatePins() {
  // clear old
  Object.keys(privatePinMarkers).forEach(function (key) {
    if (map.hasLayer(privatePinMarkers[key])) {
      map.removeLayer(privatePinMarkers[key]);
    }
  });
  privatePinMarkers = {};

  privatePins.forEach(function (p) {
    const marker = L.marker([p.lat, p.lng], {
      icon: createColoredPinIcon("#f9a825", "私人"),
      draggable: true   // 私人大頭針只有自己看得到，可直接拖曳移動
    }).addTo(map);

    const popupHtml =
      "<b>📍 私人定位點</b><br>" +
      (p.title ? escapeHtml(p.title) + "<br>" : "") +
      '<div style="font-size:11px;color:#888;margin:4px 0">長按或拖曳可移動位置</div>' +
      '<button type="button" class="btn btn-outline" style="margin-top:6px;width:100%" data-pin-id="' +
      p.id +
      '">移除大頭針</button>';

    marker.bindPopup(popupHtml);

    marker.on("popupopen", function () {
      const btn = document.querySelector('button[data-pin-id="' + p.id + '"]');
      if (btn) {
        btn.onclick = function () {
          removePrivatePin(p.id);
        };
      }
    });

    // 拖曳結束 → 更新位置
    marker.on("dragend", function (e) {
      const pos = e.target.getLatLng();
      p.lat = pos.lat;
      p.lng = pos.lng;
      // 同步陣列裡的資料
      const found = privatePins.find(function (x) { return x.id === p.id; });
      if (found) {
        found.lat = pos.lat;
        found.lng = pos.lng;
      }
      savePrivatePinsToStorage();
    });

    privatePinMarkers[p.id] = marker;
  });
}

function removePrivatePin(id) {
  privatePins = privatePins.filter(function (p) {
    return p.id !== id;
  });
  savePrivatePinsToStorage();
  renderPrivatePins();
}

function addPrivatePin(lat, lng) {
  const id = "p_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
  privatePins.push({
    id: id,
    lat: lat,
    lng: lng,
    title: "私人定位"
  });
  savePrivatePinsToStorage();
  renderPrivatePins();
}

async function addGroupPinAsWaypoint(lat, lng) {
  // 集體集合點 = 紅色，寫入 meetup_waypoints，同群組的人都能看到
  if (!me || !me.id) {
    alert("請先登入後才能設定「集體集合點」（紅色）。\n黃色個人針不需登入。");
    return;
  }

  if (!roomId) {
    alert("缺少群組 roomId，無法建立集體集合點");
    return;
  }

  if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
    alert("座標無效");
    return;
  }

  const title = "集體集合點 " + (waypoints.length + 1);
  const seq = waypoints.length
    ? (Math.max.apply(null, waypoints.map(function (w) { return Number(w.seq) || 0; })) + 1)
    : 1;

  // 立刻放紅針
  const tempRed = L.marker([lat, lng], {
    icon: createColoredPinIcon("#e53935", "集合")
  }).addTo(map);
  tempRed.bindPopup("<b>📍 集體集合點</b><br>" + escapeHtml(title));

  try {
    const payload = {
      room_id: roomId,
      seq: seq,
      title: title,
      lat: lat,
      lng: lng,
      meet_at: null,
      created_by: me.id
    };

    console.log("建立集體集合點", payload);

    let result = await sb
      .from("meetup_waypoints")
      .insert(payload)
      .select();

    // 若 select 被 RLS 擋，再試一次只 insert
    if (result.error) {
      console.warn("insert+select 失敗，改試純 insert", result.error);
      result = await sb.from("meetup_waypoints").insert(payload);
    }

    if (result.error) {
      console.error("集體集合點失敗", result.error);
      if (map.hasLayer(tempRed)) map.removeLayer(tempRed);
      alert(
        "無法建立紅色集體大頭針\n\n" +
        result.error.message +
        "\n\n請到 Supabase → meetup_waypoints → RLS\n" +
        "新增 INSERT 政策：允許 authenticated 新增\n" +
        "USING / WITH CHECK 可先設 true 測試"
      );
      return;
    }

    // 成功：重載集合點（正式紅針）
    await loadWaypoints();
    if (map.hasLayer(tempRed)) map.removeLayer(tempRed);

    alert("已建立紅色集體集合點，群組成員都能看到。");

  } catch (e) {
    console.error(e);
    if (map.hasLayer(tempRed)) map.removeLayer(tempRed);
    alert("集體集合點建立例外：" + (e.message || e));
  }
}

/* --- 長按偵測（手機 + 電腦）— 關閉系統複製／全選，改放大頭針 --- */

let longPressStartPos = null;

function cancelLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
  longPressStartPos = null;
}

function latLngFromTouch(touch) {
  const rect = map.getContainer().getBoundingClientRect();
  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;
  return map.containerPointToLatLng([x, y]);
}

// 電腦右鍵
map.getContainer().addEventListener("contextmenu", function (e) {
  e.preventDefault();
  e.stopPropagation();
  const rect = map.getContainer().getBoundingClientRect();
  const latlng = map.containerPointToLatLng([e.clientX - rect.left, e.clientY - rect.top]);
  placeTempPin(latlng);
  return false;
}, { passive: false });

// 手機長按
map.getContainer().addEventListener("touchstart", function (e) {
  if (!e.touches || e.touches.length !== 1) {
    cancelLongPress();
    return;
  }
  // 不要在按鈕／面板上觸發
  if (e.target && e.target.closest && (e.target.closest(".panel") || e.target.closest(".header") || e.target.closest("button"))) {
    return;
  }

  const t = e.touches[0];
  longPressStartPos = {
    x: t.clientX,
    y: t.clientY,
    latlng: latLngFromTouch(t)
  };

  longPressTimer = setTimeout(function () {
    if (!longPressStartPos) return;
    // 觸發時禁止系統選取／複製選單
    try {
      if (window.getSelection) window.getSelection().removeAllRanges();
    } catch (err) {}
    placeTempPin(longPressStartPos.latlng);
    cancelLongPress();
  }, 550);
}, { passive: true });

map.getContainer().addEventListener("touchmove", function (e) {
  if (!longPressTimer || !longPressStartPos || !e.touches || !e.touches.length) return;
  const t = e.touches[0];
  const dx = t.clientX - longPressStartPos.x;
  const dy = t.clientY - longPressStartPos.y;
  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
    cancelLongPress();
  }
}, { passive: true });

map.getContainer().addEventListener("touchend", cancelLongPress, { passive: true });
map.getContainer().addEventListener("touchcancel", cancelLongPress, { passive: true });

// 禁止地圖上的選取開始
map.getContainer().addEventListener("selectstart", function (e) {
  e.preventDefault();
  return false;
}, { passive: false });

/* =========================================================
   群組成員定位顯示 — 強制同步版
   直接以 location_shares 為準
   ========================================================= */

let groupLocationMarkers = {};

async function forceRenderGroupLocations() {

  if (!me || !me.id || !roomId) {
    return;
  }

  try {

    const result = await sb
      .from("location_shares")
      .select(
        "user_id,room_id,lat,lng,display_name,updated_at"
      )
      .eq(
        "room_id",
        roomId
      );

    if (result.error) {

      console.error(
        "群組定位讀取失敗：",
        result.error
      );

      return;
    }

    const rows =
      Array.isArray(result.data)
        ? result.data
        : [];

    console.log(
      "群組定位同步：",
      rows
    );

    /*
     * 提供給路線功能使用
     */
    window._lastPeerRows =
      rows.slice();

    /*
     * 本次資料中實際存在的成員
     */
    const activeIds = {};

    /*
     * 建立／更新其他成員 marker
     */
    rows.forEach(
      function (row) {

        if (!row || !row.user_id) {
          return;
        }

        /*
         * 自己的位置不畫群組 marker
         */
        if (
          String(row.user_id) ===
          String(me.id)
        ) {
          return;
        }

        const lat =
          Number(row.lat);

        const lng =
          Number(row.lng);

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {
          return;
        }

        const userId =
          String(row.user_id);

        activeIds[userId] = true;

        /*
         * 已存在 → 只更新位置
         */
        if (
          groupLocationMarkers[userId]
        ) {

          const marker =
            groupLocationMarkers[userId];

          marker.setLatLng(
            [lat, lng]
          );

          /*
           * 更新名稱
           */
          marker.setPopupContent(
            "📍 " +
            escapeHtml(
              row.display_name ||
              "群組成員"
            )
          );

          return;
        }

        /*
         * 新成員 → 建立 marker
         */
        const marker =
          L.marker(
            [lat, lng]
          ).addTo(map);

        marker.bindPopup(
          "📍 " +
          escapeHtml(
            row.display_name ||
            "群組成員"
          )
        );

        groupLocationMarkers[userId] =
          marker;

      }
    );

    /*
     * 移除已經離開群組定位資料的 marker
     */
    Object.keys(
      groupLocationMarkers
    ).forEach(
      function (userId) {

        if (
          !activeIds[userId]
        ) {

          const marker =
            groupLocationMarkers[userId];

          if (
            marker &&
            map.hasLayer(marker)
          ) {

            map.removeLayer(
              marker
            );

          }

          delete groupLocationMarkers[userId];
        }

      }
    );

    /*
     * 更新路線
     */
    if (
      typeof scheduleRouteUpdate ===
      "function"
    ) {

      scheduleRouteUpdate();

    }

  } catch (e) {

    console.error(
      "群組定位同步例外：",
      e
    );

  }

}
