<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>聊天 - 安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .chat-item {
      background: white;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .meta { flex: 1; min-width: 0; }
    .name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .name { font-weight: 600; font-size: 15px; }
    .time { font-size: 12px; color: #999; }
    .preview {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      background: #e53935;
      color: white;
      font-size: 11px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      font-weight: 600;
    }
    .badge.show { display: flex; }
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 18px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 10px;
      width: 60px;
      text-decoration: none;
    }
    .nav-item.active { color: #06C755; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">聊天</div>

  <div id="chatList"></div>

  <div class="bottom-nav">
    <a class="nav-item" href="home.html">
      <div class="nav-icon">🏠</div>首頁
    </a>
    <a class="nav-item active" href="chat.html">
      <div class="nav-icon">💬</div>聊天
    </a>
    <a class="nav-item" href="contacts.html">
      <div class="nav-icon">👥</div>通訊錄
    </a>
    <a class="nav-item" href="me.html">
      <div class="nav-icon">👤</div>我
    </a>
  </div>

  <script>
    // 示範聊天（之後改接資料庫）
    const chats = [
      { id: 'family', name: '家人群組', icon: '👨‍👩‍👧‍👦', preview: '今天集合點在公園門口', time: '10:21', unread: 2 },
      { id: 'class', name: '碩班同學', icon: '🎓', preview: '作業什麼時候交？', time: '昨天', unread: 0 },
      { id: 'wife', name: '老婆', icon: '👩', preview: '到家了嗎', time: '週一', unread: 1 }
    ];

    function getUnread(id, defaultUnread) {
      const key = 'read_' + id;
      if (localStorage.getItem(key) === '1') return 0;
      return defaultUnread || 0;
    }

    function openChat(id, name) {
      localStorage.setItem('read_' + id, '1'); // 點進去 = 已讀
      location.href = 'room.html?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(name);
    }

    function render() {
      const box = document.getElementById('chatList');
      box.innerHTML = '';
      chats.forEach(function (c) {
        const unread = getUnread(c.id, c.unread);
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.onclick = function () { openChat(c.id, c.name); };
        div.innerHTML =
          '<div class="avatar">' + c.icon + '</div>' +
          '<div class="meta">' +
            '<div class="name-row">' +
              '<div class="name">' + c.name + '</div>' +
              '<div class="time">' + c.time + '</div>' +
            '</div>' +
            '<div class="preview">' + c.preview + '</div>' +
          '</div>' +
          '<div class="badge' + (unread > 0 ? ' show' : '') + '">' + (unread > 0 ? unread : '') + '</div>';
        box.appendChild(div);
      });
    }

    render();
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="call-notify.js"></script>
</body>
</html>
