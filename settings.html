var DEVELOPER_EMAILS = [

try {

function isDeveloperSettings(user) {
  if (!user) return false;
  var email = (user.email || "").toLowerCase();
  if (email && DEVELOPER_EMAILS.indexOf(email) !== -1) return true;
  var meta = user.user_metadata || {};
  if (meta.is_developer === true || meta.role === "admin") return true;
  return false;
}

function openTempUserSettings() {
  hidePages();
  document.getElementById("tempUserSettings").classList.add("active");
  document.getElementById("pageTitle").textContent = "臨時帳號";
}

async function initDeveloperMenu() {
  var group = document.getElementById("developerMenuGroup");
  if (!group || !sbSettings) return;

  try {
    var sessionRes = await sbSettings.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    meSettings = session && session.user ? session.user : null;

    if (isDeveloperSettings(meSettings)) {
      group.style.display = "block";
    } else {
      group.style.display = "none";
    }
  } catch (e) {
    group.style.display = "none";
  }
}

document.addEventListener("DOMContentLoaded", function () {
  initDeveloperMenu();

  var btn = document.getElementById("btnCreateTempUser");
  var resultEl = document.getElementById("tempUserResult");

  if (btn) {
    btn.onclick = async function () {
      if (!isDeveloperSettings(meSettings)) {
        alert("僅開發者可使用");
        return;
      }

      var displayName = (document.getElementById("tempDisplayName").value || "").trim();
      var loginId = (document.getElementById("tempLoginId").value || "").trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
      var password = document.getElementById("tempPassword").value || "";

      if (!loginId || loginId.length < 3) {
        alert("登入帳號至少 3 個英數字");
        return;
      }
      if (!password || password.length < 6) {
        alert("密碼至少 6 碼");
        return;
      }

      resultEl.style.display = "block";
      resultEl.style.color = "#666";
      resultEl.textContent = "建立中…";

      try {
        var res = await sbSettings.functions.invoke("create-temp-user", {
          body: {
            login_id: loginId,
            password: password,
            display_name: displayName || loginId
          }
        });

        if (res.error) throw new Error(res.error.message || "建立失敗");
        if (res.data && res.data.error) throw new Error(res.data.error);

        var loginEmail = (res.data && res.data.email) ? res.data.email : (loginId + "@temp.safereunion.local");

        resultEl.style.color = "#166534";

          "暱稱：" + (displayName || loginId);

        document.getElementById("tempPassword").value = "";

<script>

/* =========================================================
   Store
========================================================= */

function getStore(key) {

  try {

    var value =
      localStorage.getItem(
        "safe_reunion_" + key
      );

    if (!value) {
      return null;
    }

    return JSON.parse(value);

  } catch (e) {

    console.error(e);

    return null;

  }

}


function setStore(key,value) {

  try {

    localStorage.setItem(
      "safe_reunion_" + key,
      JSON.stringify(value)
    );

  } catch (e) {

    console.error(e);

  }

}


/* =========================================================
   預設設定
========================================================= */

function getDefaultSettings() {

  return {

    targetDays: 7

  };

}


/* =========================================================
   顯示頁面
========================================================= */

function hidePages() {

  document
    .querySelectorAll(".settings-page")
    .forEach(function(page) {

      page.classList.remove(
        "active"
      );

    });

}


function showMainSettings() {

  hidePages();

  document
    .getElementById(
      "mainSettings"
    )
    .classList.add("active");

  document
    .getElementById(
      "pageTitle"
    )
    .textContent =
      "設定";

}


/* =========================================================
   一般設定
========================================================= */

function openGeneralSettings() {

  hidePages();

  var settings =
    getStore("settings") ||
    getDefaultSettings();


  document
    .getElementById(
      "target-days"
    )
    .value =
      settings.targetDays || 7;


  document
    .getElementById(
      "generalSettings"
    )
    .classList.add("active");


  document
    .getElementById(
      "pageTitle"
    )
    .textContent =
      "一般設定";

}


/* =========================================================
   儲存飲水天數
========================================================= */

function saveTargetDays() {

  var input =
    document.getElementById(
      "target-days"
    );


  var value =
    Number(input.value) || 7;


  value =
    Math.max(
      1,
      Math.min(
        30,
        value
      )
    );


  var settings =
    getStore("settings") ||
    getDefaultSettings();


  settings.targetDays =
    value;


  setStore(
    "settings",
    settings
  );


  document
    .getElementById(
      "generalStatus"
    )
    .textContent =
      "設定已儲存";

}


/* =========================================================
   匯出資料
========================================================= */

function exportData() {

  var data = {

    profile:
      getStore("profile"),

    family:
      getStore("family"),

    inventory:
      getStore("inventory"),

    goBag:
      getStore("goBag"),

    settings:
      getStore("settings"),

    waypoints:
      getStore("waypoints"),

    exportedAt:
      new Date().toISOString(),

    version:
      2

  };


  var blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  var url =
    URL.createObjectURL(
      blob
    );


  var a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    "安全團聚備份_" +
    new Date()
      .toISOString()
      .slice(0,10) +
    ".json";


  a.click();


  URL.revokeObjectURL(
    url
  );


  document
    .getElementById(
      "generalStatus"
    )
    .textContent =
      "資料已匯出";

}


/* =========================================================
   匯入資料
========================================================= */

function importData(event) {

  var file =
    event.target.files[0];


  if (!file) {
    return;
  }


  var reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        var data =
          JSON.parse(
            e.target.result
          );


        if (data.profile)
          setStore(
            "profile",
            data.profile
          );


        if (data.family)
          setStore(
            "family",
            data.family
          );


        if (data.inventory)
          setStore(
            "inventory",
            data.inventory
          );


        if (data.goBag)
          setStore(
            "goBag",
            data.goBag
          );


        if (data.settings)
          setStore(
            "settings",
            data.settings
          );


        if (data.waypoints)
          setStore(
            "waypoints",
            data.waypoints
          );


        document
          .getElementById(
            "generalStatus"
          )
          .textContent =
            "匯入成功，頁面即將重新載入";


        setTimeout(
          function() {

            location.reload();

          },
          800
        );


      } catch (err) {

        alert(
          "檔案格式錯誤，無法匯入"
        );

      }

    };


  reader.readAsText(
    file
  );

}


/* =========================================================
   清除本機資料
========================================================= */

function clearAllLocalData() {

  if (
    !confirm(
      "確定要清除本機所有安全團聚資料嗎？\n\n此操作無法復原。"
    )
  ) {

    return;

  }


  var prefix =
    "safe_reunion_";


  Object.keys(
    localStorage
  )
  .forEach(
    function(key) {

      if (
        key.indexOf(
          prefix
        ) === 0
      ) {

        localStorage.removeItem(
          key
        );

      }

    }
  );


  localStorage.removeItem(
    "weather_city"
  );


  localStorage.removeItem(
    "last_eq_id"
  );


  alert(
    "本機資料已清除，頁面將重新載入。"
  );


  location.reload();

}

========================================================= */

(function() {

  var params =
    new URLSearchParams(
      window.location.search
    );


  var setting =
    params.get(
      "settings"
    );


  if (
    setting === "general"
  ) {

    setTimeout(
      openGeneralSettings,
      50
    );

  }


  if (
    setting === "notifications"
  ) {

    setTimeout(
      openNotificationSettings,
      50
    );

  }


  if (
    setting === "privacy"
  ) {

    setTimeout(
      openPrivacySettings,
      50
    );

  }

})();
