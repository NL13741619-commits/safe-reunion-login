<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>我的聲音設定 - 安全團聚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {

  width: 100%;
  min-height: 100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f5f5f5;
  color: #222;

}

.header {

  position: sticky;
  top: 0;

  height: 58px;

  background: #06C755;
  color: white;

  display: flex;
  align-items: center;

  padding: 0 12px;

  z-index: 100;

  box-shadow:
    0 2px 8px rgba(0,0,0,.18);

}

.back {

  width: 38px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  text-decoration: none;

  font-size: 30px;

}

.header-title {

  font-size: 17px;
  font-weight: 800;

  margin-left: 6px;

}

.container {

  padding: 15px;

  max-width: 600px;

  margin: auto;

}

.card {

  background: white;

  border-radius: 16px;

  padding: 16px;

  margin-bottom: 14px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

}

.card-title {

  font-size: 17px;

  font-weight: 800;

  margin-bottom: 8px;

}

.description {

  font-size: 13px;

  color: #666;

  line-height: 1.6;

  margin-bottom: 14px;

}

.voice-name {

  width: 100%;

  padding: 11px;

  border:
    1px solid #ddd;

  border-radius: 10px;

  font-size: 14px;

  margin-bottom: 12px;

  outline: none;

}

.record-area {

  text-align: center;

  padding: 12px 0;

}

.record-button {

  width: 90px;
  height: 90px;

  border-radius: 50%;

  border: none;

  background: #e53935;

  color: white;

  font-size: 34px;

  cursor: pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.2);

}

.record-button.recording {

  background: #b71c1c;

  animation: pulse 1.2s infinite;

}

@keyframes pulse {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.08);
  }

  100% {
    transform: scale(1);
  }

}

.record-status {

  margin-top: 12px;

  font-size: 14px;

  font-weight: 700;

}

.timer {

  margin-top: 6px;

  color: #777;

  font-size: 13px;

}

audio {

  width: 100%;

  margin-top: 14px;

}

.button-row {

  display: flex;

  gap: 8px;

  margin-top: 12px;

}

.btn {

  flex: 1;

  border: none;

  border-radius: 10px;

  padding: 11px;

  font-size: 14px;

  font-weight: 700;

  cursor: pointer;

}

.btn-green {

  background: #06C755;
  color: white;

}

.btn-blue {

  background: #1677ff;
  color: white;

}

.btn-gray {

  background: #eee;
  color: #333;

}

.btn-red {

  background: #e53935;
  color: white;

}

.btn:disabled {

  opacity: .45;

}

.voice-item {

  border-bottom:
    1px solid #eee;

  padding: 12px 0;

}

.voice-item:last-child {

  border-bottom: none;

}

.voice-item-title {

  font-weight: 700;

  font-size: 14px;

  margin-bottom: 4px;

}

.voice-item-info {

  color: #888;

  font-size: 11px;

  margin-bottom: 6px;

}

.voice-item audio {

  margin-top: 4px;

}

.empty {

  text-align: center;

  color: #888;

  padding: 20px 0;

  font-size: 13px;

}

.loading {

  text-align: center;

  color: #777;

  padding: 20px;

  font-size: 13px;

}

.notice {

  background: #fff8e1;

  border-left: 4px solid #ffb300;

  padding: 10px;

  border-radius: 8px;

  font-size: 12px;

  line-height: 1.6;

  margin-top: 12px;

}

</style>

</head>


<body>


<div class="header">

  <a
    href="javascript:history.back()"
    class="back"
  >
    ‹
  </a>

  <div class="header-title">
    我的聲音設定
  </div>

</div>


<div class="container">


  <!-- 錄音 -->

  <div class="card">

    <div class="card-title">
      🎙️ 錄製我的聲音
    </div>

    <div class="description">

      錄製自己的聲音，未來可以用於
      「安全團聚」的 AI 語音功能、
      導航提醒及家庭 AI 助手。

    </div>


    <input
      id="voiceName"
      class="voice-name"
      placeholder="例如：我的聲音"
      value="我的聲音"
    >


    <div class="record-area">

      <button
        id="recordButton"
        class="record-button"
        type="button"
      >
        🎙️
      </button>

      <div
        id="recordStatus"
        class="record-status"
      >
        按下開始錄音
      </div>

      <div
        id="timer"
        class="timer"
      >
        00:00
      </div>

    </div>


    <audio
      id="previewAudio"
      controls
      style="display:none"
    ></audio>


    <div class="button-row">

      <button
        id="uploadButton"
        class="btn btn-green"
        disabled
      >
        ☁️ 上傳聲音
      </button>

      <button
        id="resetButton"
        class="btn btn-gray"
        disabled
      >
        🔄 重新錄音
      </button>

    </div>


    <div class="notice">

      建議錄音環境保持安靜。
      每段錄音建議約 10～30 秒，
      說話自然、清楚即可。

    </div>

  </div>


  <!-- 已有聲音 -->

  <div class="card">

    <div class="card-title">
      🎵 我的聲音
    </div>

    <div
      id="voiceList"
      class="loading"
    >
      載入中…
    </div>

  </div>


</div>


<script>

(function () {

"use strict";


/* =========================================================
   Supabase
   ========================================================= */

const SUPABASE_URL =
  "https://perfsipperncvjocznhl.supabase.co";


const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const BUCKET =
  "voice-recordings";


/* =========================================================
   DOM
   ========================================================= */

const recordButton =
  document.getElementById(
    "recordButton"
  );


const recordStatus =
  document.getElementById(
    "recordStatus"
  );


const timerEl =
  document.getElementById(
    "timer"
  );


const previewAudio =
  document.getElementById(
    "previewAudio"
  );


const uploadButton =
  document.getElementById(
    "uploadButton"
  );


const resetButton =
  document.getElementById(
    "resetButton"
  );


const voiceName =
  document.getElementById(
    "voiceName"
  );


const voiceList =
  document.getElementById(
    "voiceList"
  );


/* =========================================================
   狀態
   ========================================================= */

let user = null;

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioUrl = null;

let timerInterval = null;

let recordingSeconds = 0;


/* =========================================================
   登入
   ========================================================= */

async function checkAuth() {

  const result =
    await sb.auth.getSession();


  if (
    result.error
    ||
    !result.data.session
  ) {

    recordStatus.textContent =
      "請先登入安全團聚";

    recordButton.disabled =
      true;

    uploadButton.disabled =
      true;

    voiceList.innerHTML =
      '<div class="empty">請先登入</div>';

    return false;

  }


  user =
    result.data.session.user;


  return true;

}


/* =========================================================
   格式化時間
   ========================================================= */

function formatTime(
  seconds
) {

  const min =
    Math.floor(
      seconds / 60
    );

  const sec =
    seconds % 60;


  return (
    String(min).padStart(2, "0")
    +
    ":"
    +
    String(sec).padStart(2, "0")
  );

}


/* =========================================================
   找可用錄音格式
   ========================================================= */

function getMimeType() {

  const types = [

    "audio/webm;codecs=opus",

    "audio/webm",

    "audio/mp4",

    "audio/ogg;codecs=opus"

  ];


  for (
    const type
    of types
  ) {

    if (
      window.MediaRecorder
      &&
      MediaRecorder.isTypeSupported
      &&
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;

    }

  }


  return "";

}


/* =========================================================
   開始錄音
   ========================================================= */

async function startRecording() {

  try {

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices.getUserMedia
    ) {

      alert(
        "此瀏覽器不支援錄音"
      );

      return;

    }


    const stream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          noiseSuppression: true,

          autoGainControl: true

        }

      });


    audioChunks =
      [];


    audioBlob =
      null;


    if (audioUrl) {

      URL.revokeObjectURL(
        audioUrl
      );

      audioUrl =
        null;

    }


    const mimeType =
      getMimeType();


    mediaRecorder =
      mimeType

        ? new MediaRecorder(
            stream,
            {
              mimeType:
                mimeType
            }
          )

        : new MediaRecorder(
            stream
          );


    mediaRecorder.ondataavailable =
      function (event) {

        if (
          event.data
          &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function () {

        const finalType =
          mediaRecorder.mimeType
          ||
          mimeType
          ||
          "audio/webm";


        audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                finalType
            }
          );


        audioUrl =
          URL.createObjectURL(
            audioBlob
          );


        previewAudio.src =
          audioUrl;


        previewAudio.style.display =
          "block";


        uploadButton.disabled =
          false;


        resetButton.disabled =
          false;


        recordStatus.textContent =
          "錄音完成，可以播放或上傳";


        stream
          .getTracks()
          .forEach(
            function (track) {

              track.stop();

            }
          );

      };


    mediaRecorder.start();


    recordingSeconds =
      0;


    timerEl.textContent =
      "00:00";


    recordButton.classList.add(
      "recording"
    );


    recordButton.textContent =
      "⏹️";


    recordStatus.textContent =
      "正在錄音…";


    uploadButton.disabled =
      true;


    resetButton.disabled =
      true;


    timerInterval =
      setInterval(
        function () {

          recordingSeconds++;


          timerEl.textContent =
            formatTime(
              recordingSeconds
            );


          if (
            recordingSeconds >= 60
          ) {

            stopRecording();

          }

        },
        1000
      );


  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "無法開始錄音："
      +
      error.message
    );

  }

}


/* =========================================================
   停止錄音
   ========================================================= */

function stopRecording() {

  if (
    !mediaRecorder
  ) {

    return;

  }


  if (
    mediaRecorder.state ===
    "recording"
  ) {

    mediaRecorder.stop();

  }


  if (
    timerInterval
  ) {

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;

  }


  recordButton.classList.remove(
    "recording"
  );


  recordButton.textContent =
    "🎙️";

}


/* =========================================================
   錄音按鈕
   ========================================================= */

recordButton.onclick =
  function () {

    if (
      mediaRecorder
      &&
      mediaRecorder.state ===
      "recording"
    ) {

      stopRecording();

    }
    else {

      startRecording();

    }

  };


/* =========================================================
   重新錄音
   ========================================================= */

resetButton.onclick =
  function () {

    if (
      mediaRecorder
      &&
      mediaRecorder.state ===
      "recording"
    ) {

      stopRecording();

    }


    audioChunks =
      [];


    audioBlob =
      null;


    if (audioUrl) {

      URL.revokeObjectURL(
        audioUrl
      );

      audioUrl =
        null;

    }


    previewAudio.removeAttribute(
      "src"
    );


    previewAudio.style.display =
      "none";


    uploadButton.disabled =
      true;


    resetButton.disabled =
      true;


    recordingSeconds =
      0;


    timerEl.textContent =
      "00:00";


    recordStatus.textContent =
      "按下開始錄音";

  };


/* =========================================================
   取得副檔名
   ========================================================= */

function getExtension(
  mime
) {

  if (
    mime.includes("mp4")
  ) {

    return "mp4";

  }


  if (
    mime.includes("ogg")
  ) {

    return "ogg";

  }


  return "webm";

}


/* =========================================================
   上傳
   ========================================================= */

async function uploadVoice() {

  if (
    !user
  ) {

    alert(
      "請先登入"
    );

    return;

  }


  if (
    !audioBlob
  ) {

    alert(
      "請先錄音"
    );

    return;

  }


  const name =
    voiceName.value.trim()
    ||
    "我的聲音";


  uploadButton.disabled =
    true;


  uploadButton.textContent =
    "上傳中…";


  try {

    const extension =
      getExtension(
        audioBlob.type
      );


    const fileName =

      "voice_"
      +
      Date.now()
      +
      "."
      +
      extension;


    const storagePath =

      user.id
      +
      "/"
      +
      fileName;


    const uploadResult =
      await sb.storage
        .from(
          BUCKET
        )
        .upload(
          storagePath,
          audioBlob,
          {

            contentType:
              audioBlob.type
              ||
              "audio/webm",

            upsert:
              false

          }
        );


    if (
      uploadResult.error
    ) {

      throw uploadResult.error;

    }


    const dbResult =
      await sb
        .from(
          "voice_profiles"
        )
        .insert({

          user_id:
            user.id,

          voice_name:
            name,

          storage_path:
            storagePath,

          mime_type:
            audioBlob.type,

          duration_seconds:
            recordingSeconds

        });


    if (
      dbResult.error
    ) {

      await sb.storage
        .from(
          BUCKET
        )
        .remove([
          storagePath
        ]);

      throw dbResult.error;

    }


    alert(
      "聲音已成功儲存"
    );


    resetButton.click();


    await loadVoiceList();

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "上傳失敗："
      +
      error.message
    );

  }


  uploadButton.disabled =
    false;


  uploadButton.textContent =
    "☁️ 上傳聲音";

}


/* =========================================================
   上傳按鈕
   ========================================================= */

uploadButton.onclick =
  uploadVoice;


/* =========================================================
   產生私人下載 URL
   ========================================================= */

async function createAudioUrl(
  path
) {

  const result =
    await sb.storage
      .from(
        BUCKET
      )
      .createSignedUrl(
        path,
        3600
      );


  if (
    result.error
  ) {

    console.error(
      result.error
    );

    return null;

  }


  return result.data.signedUrl;

}


/* =========================================================
   載入聲音列表
   ========================================================= */

async function loadVoiceList() {

  if (
    !user
  ) {

    return;

  }


  voiceList.innerHTML =
    '<div class="loading">載入中…</div>';


  const result =
    await sb
      .from(
        "voice_profiles"
      )
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  if (
    result.error
  ) {

    console.error(
      result.error
    );


    voiceList.innerHTML =
      '<div class="empty">聲音資料載入失敗</div>';

    return;

  }


  const rows =
    result.data
    ||
    [];


  if (
    !rows.length
  ) {

    voiceList.innerHTML =
      '<div class="empty">目前還沒有錄製的聲音</div>';

    return;

  }


  voiceList.innerHTML =
    "";


  for (
    const row
    of rows
  ) {

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "voice-item";


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "voice-item-title";


    title.textContent =
      "🎵 "
      +
      row.voice_name;


    const info =
      document.createElement(
        "div"
      );


    info.className =
      "voice-item-info";


    const date =
      new Date(
        row.created_at
      ).toLocaleString(
        "zh-TW"
      );


    info.textContent =

      date
      +
      "｜"
      +
      (
        row.duration_seconds
        ||
        0
      )
      +
      " 秒";


    const audio =
      document.createElement(
        "audio"
      );


    audio.controls =
      true;


    const signedUrl =
      await createAudioUrl(
        row.storage_path
      );


    if (signedUrl) {

      audio.src =
        signedUrl;

    }


    const buttonRow =
      document.createElement(
        "div"
      );


    buttonRow.className =
      "button-row";


    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "btn btn-red";


    deleteButton.textContent =
      "🗑️ 刪除";


    deleteButton.onclick =
      function () {

        deleteVoice(
          row
        );

      };


    buttonRow.appendChild(
      deleteButton
    );


    item.appendChild(
      title
    );

    item.appendChild(
      info
    );

    item.appendChild(
      audio
    );

    item.appendChild(
      buttonRow
    );


    voiceList.appendChild(
      item
    );

  }

}


/* =========================================================
   刪除聲音
   ========================================================= */

async function deleteVoice(
  row
) {

  if (
    !confirm(
      "確定要刪除這段聲音嗎？"
    )
  ) {

    return;

  }


  try {

    const storageResult =
      await sb.storage
        .from(
          BUCKET
        )
        .remove([
          row.storage_path
        ]);


    if (
      storageResult.error
    ) {

      throw storageResult.error;

    }


    const dbResult =
      await sb
        .from(
          "voice_profiles"
        )
        .delete()
        .eq(
          "id",
          row.id
        )
        .eq(
          "user_id",
          user.id
        );


    if (
      dbResult.error
    ) {

      throw dbResult.error;

    }


    await loadVoiceList();

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "刪除失敗："
      +
      error.message
    );

  }

}


/* =========================================================
   啟動
   ========================================================= */

async function init() {

  const ok =
    await checkAuth();


  if (!ok) {

    return;

  }


  await loadVoiceList();

}


init();


})();
</script>

</body>
</html>
