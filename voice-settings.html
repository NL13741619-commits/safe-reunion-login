<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>我的導航聲音｜安全團聚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f4f6f8;

  color: #222;

  padding-bottom: 30px;

}

.header {

  position: sticky;

  top: 0;

  z-index: 100;

  background: #06C755;

  color: white;

  padding:
    14px
    14px;

  display: flex;

  align-items: center;

  gap: 10px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.18);

}

.back {

  color: white;

  text-decoration: none;

  font-size: 30px;

  width: 35px;

  text-align: center;

}

.header-title {

  font-size: 17px;

  font-weight: 900;

}

.header-sub {

  font-size: 11px;

  margin-top: 3px;

  opacity: .9;

}

.container {

  padding: 14px;

  max-width: 700px;

  margin: auto;

}

.notice {

  background: white;

  border-radius: 14px;

  padding: 14px;

  margin-bottom: 14px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

  font-size: 13px;

  line-height: 1.6;

}

.notice strong {

  color: #06C755;

}

.voice-card {

  background: white;

  border-radius: 15px;

  padding: 14px;

  margin-bottom: 12px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

}

.voice-top {

  display: flex;

  align-items: center;

  gap: 10px;

}

.voice-number {

  width: 34px;

  height: 34px;

  border-radius: 50%;

  background: #06C755;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: 900;

  flex-shrink: 0;

}

.voice-title {

  font-size: 15px;

  font-weight: 900;

}

.voice-text {

  margin-top: 4px;

  color: #555;

  font-size: 13px;

}

.status {

  margin-top: 10px;

  font-size: 12px;

  color: #888;

}

.status.success {

  color: #06a044;

  font-weight: 700;

}

.status.recording {

  color: #d93025;

  font-weight: 900;

}

.button-row {

  display: flex;

  gap: 7px;

  margin-top: 11px;

}

button {

  border: none;

  border-radius: 10px;

  padding: 10px 12px;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

}

.record-btn {

  flex: 1;

  background: #06C755;

  color: white;

}

.record-btn.recording {

  background: #d93025;

}

.play-btn {

  background: #1677ff;

  color: white;

}

.delete-btn {

  background: #eee;

  color: #333;

}

button:disabled {

  opacity: .45;

  cursor: not-allowed;

}

.progress {

  margin-top: 10px;

  height: 5px;

  background: #eee;

  border-radius: 10px;

  overflow: hidden;

  display: none;

}

.progress.show {

  display: block;

}

.progress-bar {

  height: 100%;

  width: 0%;

  background: #06C755;

  transition: width .2s;

}

.global-status {

  position: fixed;

  left: 12px;

  right: 12px;

  bottom: 12px;

  z-index: 999;

  display: none;

  background: #222;

  color: white;

  border-radius: 12px;

  padding: 11px 13px;

  text-align: center;

  font-size: 12px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.25);

}

.global-status.show {

  display: block;

}

.login-box {

  background: #fff3cd;

  color: #664d03;

  border-radius: 12px;

  padding: 14px;

  font-size: 13px;

  display: none;

}

.login-box.show {

  display: block;

}

</style>

</head>


<body>


<!-- =====================================================
     頂部
     ===================================================== -->

<div class="header">

  <a
    href="javascript:history.back()"
    class="back"
  >
    ‹
  </a>

  <div>

    <div class="header-title">
      我的導航聲音
    </div>

    <div
      class="header-sub"
      id="loginStatus"
    >
      載入中…
    </div>

  </div>

</div>


<div class="container">


  <!-- ===================================================
       說明
       =================================================== -->

  <div class="notice">

    <strong>🎙️ 建立你的導航語音</strong>

    <br>

    請依照每個句子錄音。

    <br>

    錄好後會自動上傳到安全團聚的 Supabase Storage。

    <br>

    之後導航時，可以播放你自己錄製的聲音。

    <br><br>

    建議：

    <br>

    • 在安靜環境錄音

    <br>

    • 每句約 1～3 秒

    <br>

    • 用正常說話速度

  </div>


  <div
    class="login-box"
    id="loginBox"
  >

    ⚠️ 請先登入安全團聚，再使用導航語音。

  </div>


  <!-- ===================================================
       10 組語音
       =================================================== -->

  <div id="voiceList"></div>


</div>


<div
  class="global-status"
  id="globalStatus"
></div>


<script>

"use strict";


/* =========================================================
   1. Supabase
   ========================================================= */

const SUPABASE_URL =
  "https://perfsipperncvjocznhl.supabase.co";


const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlzcyI6InN1cGFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   2. Storage Bucket
   ========================================================= */

const VOICE_BUCKET =
  "voice-recordings";


/* =========================================================
   3. 資料表
   ========================================================= */

const VOICE_TABLE =
  "user_voice_settings";


/* =========================================================
   4. 10 組導航語音
   ========================================================= */

const VOICES = [

  {
    id: "start",
    title: "開始導航",
    text: "導航開始"
  },

  {
    id: "camera",
    title: "測速提醒",
    text: "前方測速照相"
  },

  {
    id: "slow",
    title: "減速提醒",
    text: "請減速"
  },

  {
    id: "overspeed",
    title: "超速提醒",
    text: "目前超速，請減速"
  },

  {
    id: "right",
    title: "右轉",
    text: "前方右轉"
  },

  {
    id: "left",
    title: "左轉",
    text: "前方左轉"
  },

  {
    id: "near_destination",
    title: "即將到達",
    text: "即將抵達目的地"
  },

  {
    id: "arrived",
    title: "已到達",
    text: "已到達目的地"
  },

  {
    id: "attention",
    title: "注意路況",
    text: "請注意前方路況"
  },

  {
    id: "stop",
    title: "導航停止",
    text: "導航已停止"
  }

];


/* =========================================================
   5. 全域變數
   ========================================================= */

let currentUser = null;

let mediaRecorder = null;

let recordingChunks = [];

let recordingVoiceId = null;

let voiceData = {};


/* =========================================================
   6. DOM
   ========================================================= */

const voiceList =
  document.getElementById(
    "voiceList"
  );


const loginStatus =
  document.getElementById(
    "loginStatus"
  );


const loginBox =
  document.getElementById(
    "loginBox"
  );


const globalStatus =
  document.getElementById(
    "globalStatus"
  );


/* =========================================================
   7. 顯示訊息
   ========================================================= */

function showStatus(
  text
) {

  globalStatus.textContent =
    text;

  globalStatus.classList.add(
    "show"
  );

  setTimeout(
    function () {

      globalStatus.classList.remove(
        "show"
      );

    },
    2500
  );

}


/* =========================================================
   8. 建立頁面
   ========================================================= */

function renderVoiceList() {

  voiceList.innerHTML =
    "";

  VOICES.forEach(
    function (voice, index) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "voice-card";

      card.dataset.id =
        voice.id;


      card.innerHTML = `

        <div class="voice-top">

          <div class="voice-number">
            ${index + 1}
          </div>

          <div>

            <div class="voice-title">
              ${voice.title}
            </div>

            <div class="voice-text">
              請錄：「${voice.text}」
            </div>

          </div>

        </div>


        <div
          class="status"
          id="status-${voice.id}"
        >
          尚未錄音
        </div>


        <div class="progress">
          <div
            class="progress-bar"
            id="progress-${voice.id}"
          ></div>
        </div>


        <div class="button-row">

          <button
            type="button"
            class="record-btn"
            id="record-${voice.id}"
            onclick="startRecording('${voice.id}')"
          >
            🎙️ 錄音
          </button>

          <button
            type="button"
            class="play-btn"
            id="play-${voice.id}"
            onclick="playVoice('${voice.id}')"
            disabled
          >
            ▶️ 播放
          </button>

          <button
            type="button"
            class="delete-btn"
            id="delete-${voice.id}"
            onclick="deleteVoice('${voice.id}')"
            disabled
          >
            🗑️
          </button>

        </div>

      `;


      voiceList.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   9. 取得登入者
   ========================================================= */

async function loadUser() {

  const result =
    await sb.auth.getSession();


  if (
    result.error
  ) {

    console.error(
      result.error
    );

  }


  if (
    result.data.session
  ) {

    currentUser =
      result.data.session.user;


    loginStatus.textContent =
      "已登入｜"
      +
      (
        currentUser.email
        ||
        "使用者"
      );


    loginBox.classList.remove(
      "show"
    );


    await loadVoiceSettings();

  }
  else {

    loginStatus.textContent =
      "尚未登入";


    loginBox.classList.add(
      "show"
    );


    disableAllButtons();

  }

}


/* =========================================================
   10. 停用按鈕
   ========================================================= */

function disableAllButtons() {

  document
    .querySelectorAll(
      "button"
    )
    .forEach(
      function (button) {

        button.disabled =
          true;

      }
    );

}


/* =========================================================
   11. 載入語音資料
   ========================================================= */

async function loadVoiceSettings() {

  if (
    !currentUser
  ) {

    return;

  }


  const result =
    await sb
      .from(
        VOICE_TABLE
      )
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      );


  if (
    result.error
  ) {

    console.error(
      result.error
    );

    showStatus(
      "載入語音設定失敗"
    );

    return;

  }


  voiceData =
    {};


  (result.data || [])
    .forEach(
      function (row) {

        voiceData[
          row.voice_id
        ] =
          row;

      }
    );


  VOICES.forEach(
    function (voice) {

      const row =
        voiceData[
          voice.id
        ];


      if (
        row
        &&
        row.file_path
      ) {

        updateVoiceUI(
          voice.id,
          true
        );

      }

    }
  );

}


/* =========================================================
   12. 更新 UI
   ========================================================= */

function updateVoiceUI(
  voiceId,
  exists
) {

  const status =
    document.getElementById(
      "status-" + voiceId
    );


  const play =
    document.getElementById(
      "play-" + voiceId
    );


  const del =
    document.getElementById(
      "delete-" + voiceId
    );


  if (
    exists
  ) {

    status.textContent =
      "✅ 已錄製";


    status.classList.add(
      "success"
    );


    play.disabled =
      false;


    del.disabled =
      false;

  }
  else {

    status.textContent =
      "尚未錄音";


    status.classList.remove(
      "success"
    );


    play.disabled =
      true;


    del.disabled =
      true;

  }

}


/* =========================================================
   13. 開始錄音
   ========================================================= */

async function startRecording(
  voiceId
) {

  if (
    !currentUser
  ) {

    alert(
      "請先登入"
    );

    return;

  }


  if (
    recordingVoiceId
  ) {

    return;

  }


  if (
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices.getUserMedia
  ) {

    alert(
      "此瀏覽器不支援錄音功能"
    );

    return;

  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: true
        }
      );


    recordingChunks =
      [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    recordingVoiceId =
      voiceId;


    const recordBtn =
      document.getElementById(
        "record-" + voiceId
      );


    const status =
      document.getElementById(
        "status-" + voiceId
      );


    recordBtn.textContent =
      "⏹️ 停止錄音";


    recordBtn.classList.add(
      "recording"
    );


    status.textContent =
      "🔴 正在錄音…再按一次停止";


    status.classList.add(
      "recording"
    );


    mediaRecorder.ondataavailable =
      function (event) {

        if (
          event.data.size > 0
        ) {

          recordingChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async function () {

        stream
          .getTracks()
          .forEach(
            function (track) {

              track.stop();

            }
          );


        const blob =
          new Blob(
            recordingChunks,
            {
              type:
                mediaRecorder.mimeType
                ||
                "audio/webm"
            }
          );


        mediaRecorder =
          null;


        recordingChunks =
          [];


        const finishedVoiceId =
          recordingVoiceId;


        recordingVoiceId =
          null;


        const btn =
          document.getElementById(
            "record-" +
            finishedVoiceId
          );


        btn.textContent =
          "🎙️ 錄音";


        btn.classList.remove(
          "recording"
        );


        await uploadVoice(
          finishedVoiceId,
          blob
        );

      };


    mediaRecorder.start();

  }

  catch (error) {

    console.error(
      error
    );


    recordingVoiceId =
      null;


    alert(
      "無法使用麥克風："
      +
      error.message
    );

  }

}


/* =========================================================
   14. 停止錄音
   ========================================================= */

function stopCurrentRecording() {

  if (
    mediaRecorder
    &&
    mediaRecorder.state
    !==
    "inactive"
  ) {

    mediaRecorder.stop();

  }

}


/* =========================================================
   15. 點擊錄音按鈕
   ========================================================= */

document.addEventListener(
  "click",
  function (event) {

    const button =
      event.target.closest(
        ".record-btn"
      );


    if (
      !button
    ) {

      return;

    }


    if (
      recordingVoiceId
    ) {

      stopCurrentRecording();

    }

  }
);


/* =========================================================
   16. 上傳錄音
   ========================================================= */

async function uploadVoice(
  voiceId,
  blob
) {

  if (
    !currentUser
  ) {

    return;

  }


  const progress =
    document.getElementById(
      "progress-" +
      voiceId
    );


  const progressBar =
    document.getElementById(
      "progress-" +
      voiceId
    )
    .querySelector
    ? null
    : null;


  progress.classList.add(
    "show"
  );


  const status =
    document.getElementById(
      "status-" +
      voiceId
    );


  status.textContent =
    "☁️ 正在上傳…";


  status.classList.remove(
    "recording"
  );


  try {

    const old =
      voiceData[
        voiceId
      ];


    /*
     * 如果原本有檔案，
     * 先刪除舊檔案
     */

    if (
      old
      &&
      old.file_path
    ) {

      await sb.storage
        .from(
          VOICE_BUCKET
        )
        .remove([
          old.file_path
        ]);

    }


    const extension =
      blob.type.includes(
        "mp4"
      )
        ? "mp4"
        : "webm";


    const filePath =

      currentUser.id
      +
      "/"
      +
      voiceId
      +
      "."
      +
      extension;


    const upload =
      await sb.storage
        .from(
          VOICE_BUCKET
        )
        .upload(
          filePath,
          blob,
          {
            contentType:
              blob.type
              ||
              "audio/webm",

            upsert:
              true
          }
        );


    if (
      upload.error
    ) {

      throw upload.error;

    }


    /*
     * 建立／更新資料表
     */

    const save =
      await sb
        .from(
          VOICE_TABLE
        )
        .upsert(
          {

            user_id:
              currentUser.id,

            voice_id:
              voiceId,

            file_path:
              filePath,

            mime_type:
              blob.type
              ||
              "audio/webm",

            updated_at:
              new Date()
                .toISOString()

          },

          {
            onConflict:
              "user_id,voice_id"
          }

        )
        .select()
        .single();


    if (
      save.error
    ) {

      throw save.error;

    }


    voiceData[
      voiceId
    ] =
      save.data;


    updateVoiceUI(
      voiceId,
      true
    );


    status.textContent =
      "✅ 上傳成功";


    showStatus(
      "語音上傳成功"
    );

  }

  catch (error) {

    console.error(
      error
    );


    status.textContent =
      "❌ 上傳失敗";


    alert(
      "語音上傳失敗："
      +
      error.message
    );

  }

  finally {

    progress.classList.remove(
      "show"
    );

  }

}


/* =========================================================
   17. 取得語音 URL
   ========================================================= */

function getVoiceUrl(
  filePath
) {

  const result =
    sb.storage
      .from(
        VOICE_BUCKET
      )
      .getPublicUrl(
        filePath
      );


  return result.data.publicUrl;

}


/* =========================================================
   18. 播放語音
   ========================================================= */

async function playVoice(
  voiceId
) {

  const row =
    voiceData[
      voiceId
    ];


  if (
    !row
    ||
    !row.file_path
  ) {

    alert(
      "這段語音尚未錄製"
    );

    return;

  }


  try {

    const url =
      getVoiceUrl(
        row.file_path
      );


    const audio =
      new Audio(
        url
      );


    await audio.play();

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "播放失敗，請確認 Storage Bucket 權限"
    );

  }

}


/* =========================================================
   19. 刪除語音
   ========================================================= */

async function deleteVoice(
  voiceId
) {

  if (
    !currentUser
  ) {

    return;

  }


  const row =
    voiceData[
      voiceId
    ];


  if (
    !row
  ) {

    return;

  }


  const voice =
    VOICES.find(
      function (item) {

        return item.id === voiceId;

      }
    );


  if (
    !confirm(
      "確定刪除「"
      +
      (
        voice
          ? voice.title
          : voiceId
      )
      +
      "」的錄音嗎？"
    )
  ) {

    return;

  }


  try {

    /*
     * 刪除 Storage
     */

    const storageResult =
      await sb.storage
        .from(
          VOICE_BUCKET
        )
        .remove([
          row.file_path
        ]);


    if (
      storageResult.error
    ) {

      throw storageResult.error;

    }


    /*
     * 刪除資料表
     */

    const dbResult =
      await sb
        .from(
          VOICE_TABLE
        )
        .delete()
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "voice_id",
          voiceId
        );


    if (
      dbResult.error
    ) {

      throw dbResult.error;

    }


    delete voiceData[
      voiceId
    ];


    updateVoiceUI(
      voiceId,
      false
    );


    showStatus(
      "錄音已刪除"
    );

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "刪除失敗："
      +
      error.message
    );

  }

}


/* =========================================================
   20. 初始化
   ========================================================= */

renderVoiceList();

loadUser();


</script>

</body>

</html>
