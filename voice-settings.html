<script>

"use strict";


/* =========================================================
   1. Supabase
   ========================================================= */

const SUPABASE_URL =
  "https://perfsipperncvjocznhl.supabase.co";


const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlzcyI6InN1cGVyYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY";


const sb =
  window.supabase.createClient(

  );


/* =========================================================
   2. Storage Bucket
   ========================================================= */

const VOICE_BUCKET =
  "voice-recordings";


/* =========================================================
   3. 正確的資料表
   ========================================================= */

const VOICE_TABLE =
  "voice_profiles";


/* =========================================================
   4. 10 組導航語音
   ========================================================= */

const VOICES = [

  {
    id: "start",
    title: "開始導航",
    text: "導航開始"
  },

  {
    id: "camera",
    title: "測速提醒",
    text: "前方測速照相"
  },

  {
    id: "slow",
    title: "減速提醒",
    text: "請減速"
  },

  {
    id: "overspeed",
    title: "超速提醒",
    text: "目前超速，請減速"
  },

  {
    id: "right",
    title: "右轉",
    text: "前方右轉"
  },

  {
    id: "left",
    title: "左轉",
    text: "前方左轉"
  },

  {
    id: "near_destination",
    title: "即將到達",
    text: "即將抵達目的地"
  },

  {
    id: "arrived",
    title: "已到達",
    text: "已到達目的地"
  },

  {
    id: "attention",
    title: "注意路況",
    text: "請注意前方路況"
  },

  {
    id: "stop",
    title: "導航停止",
    text: "導航已停止"
  }

];


/* =========================================================
   5. 全域變數
   ========================================================= */

let currentUser = null;

let mediaRecorder = null;

let recordingChunks = [];

let recordingVoiceId = null;

let recordingStream = null;

let recordingStartTime = 0;

let recordingTimer = null;

let voiceData = {};


/* =========================================================
   6. DOM
   ========================================================= */

const voiceList =
  document.getElementById(
    "voiceList"
  );


const loginStatus =
  document.getElementById(
    "loginStatus"
  );


const loginBox =
  document.getElementById(
    "loginBox"
  );


const globalStatus =
  document.getElementById(
    "globalStatus"
  );


/* =========================================================
   7. 顯示訊息
   ========================================================= */

function showStatus(
  text
) {

  globalStatus.textContent =
    text;

  globalStatus.classList.add(
    "show"
  );

  setTimeout(
    function () {

      globalStatus.classList.remove(
        "show"
      );

    },
    2500
  );

}


/* =========================================================
   8. 找到瀏覽器支援的錄音格式
   ========================================================= */

function getRecordingMimeType() {

  const types = [

    "audio/mp4",

    "audio/webm;codecs=opus",

    "audio/webm",

    "audio/ogg;codecs=opus"

  ];


  for (
    const type of types
  ) {

    if (
      typeof MediaRecorder !== "undefined"
      &&
      MediaRecorder.isTypeSupported
      &&
      MediaRecorder.isTypeSupported(type)
    ) {

      return type;

    }

  }


  return "";

}


/* =========================================================
   9. 取得副檔名
   ========================================================= */

function getFileExtension(
  mimeType
) {

  if (
    mimeType.includes(
      "mp4"
    )
  ) {

    return "mp4";

  }


  if (
    mimeType.includes(
      "ogg"
    )
  ) {

    return "ogg";

  }


  return "webm";

}


/* =========================================================
   10. 建立頁面
   ========================================================= */

function renderVoiceList() {

  voiceList.innerHTML =
    "";


  VOICES.forEach(
    function (voice, index) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "voice-card";


      card.dataset.id =
        voice.id;


      card.innerHTML = `

        <div class="voice-top">

          <div class="voice-number">
            ${index + 1}
          </div>

          <div>

            <div class="voice-title">
              ${voice.title}
            </div>

            <div class="voice-text">
              請錄：「${voice.text}」
            </div>

          </div>

        </div>


        <div
          class="status"
          id="status-${voice.id}"
        >
          尚未錄音
        </div>


        <div
          class="duration"
          id="duration-${voice.id}"
        ></div>


        <div
          class="progress"
          id="progress-${voice.id}"
        >

          <div
            class="progress-bar"
            id="progress-bar-${voice.id}"
          ></div>

        </div>


        <div class="button-row">

          <button
            type="button"
            class="record-btn"
            data-action="record"
            data-voice-id="${voice.id}"
            id="record-${voice.id}"
          >
            🎙️ 錄音
          </button>


          <button
            type="button"
            class="play-btn"
            data-action="play"
            data-voice-id="${voice.id}"
            id="play-${voice.id}"
            disabled
          >
            ▶️ 播放
          </button>


          <button
            type="button"
            class="delete-btn"
            data-action="delete"
            data-voice-id="${voice.id}"
            id="delete-${voice.id}"
            disabled
          >
            🗑️
          </button>

        </div>

      `;


      voiceList.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   11. 取得登入者
   ========================================================= */

async function loadUser() {

  try {

    const result =
      await sb.auth.getSession();


    if (
      result.error
    ) {

      throw result.error;

    }


    if (
      result.data
      &&
      result.data.session
    ) {

      currentUser =
        result.data.session.user;


      loginStatus.textContent =
        "已登入｜"
        +
        (
          currentUser.email
          ||
          "使用者"
        );


      loginBox.classList.remove(
        "show"
      );


      await loadVoiceSettings();

    }
    else {

      loginStatus.textContent =
        "尚未登入";


      loginBox.classList.add(
        "show"
      );


      disableAllButtons();

    }

  }

  catch (error) {

    console.error(
      "取得登入狀態失敗：",
      error
    );


    loginStatus.textContent =
      "登入狀態讀取失敗";


    loginBox.classList.add(
      "show"
    );


    disableAllButtons();

  }

}


/* =========================================================
   12. 停用按鈕
   ========================================================= */

function disableAllButtons() {

  document
    .querySelectorAll(
      "button"
    )
    .forEach(
      function (button) {

        button.disabled =
          true;

      }
    );

}


/* =========================================================
   13. 載入語音資料
   ========================================================= */

async function loadVoiceSettings() {

  if (
    !currentUser
  ) {

    return;

  }


  try {

    const result =
      await sb
        .from(
          VOICE_TABLE
        )
        .select(
          "id,user_id,voice_name,storage_path,mime_type,duration_seconds,created_at"
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if (
      result.error
    ) {

      throw result.error;

    }


    voiceData =
      {};


    (
      result.data
      ||
      []
    )
      .forEach(
        function (row) {

          voiceData[
            row.voice_name
          ] =
            row;

        }
      );


    VOICES.forEach(
      function (voice) {

        const row =
          voiceData[
            voice.id
          ];


        if (
          row
          &&
          row.storage_path
        ) {

          updateVoiceUI(
            voice.id,
            true,
            row
          );

        }
        else {

          updateVoiceUI(
            voice.id,
            false
          );

        }

      }
    );

  }

  catch (error) {

    console.error(
      "載入語音資料失敗：",
      error
    );


    showStatus(
      "載入語音導航失敗"
    );

  }

}


/* =========================================================
   14. 更新 UI
   ========================================================= */

function updateVoiceUI(
  voiceId,
  exists,
  row
) {

  const status =
    document.getElementById(
      "status-" +
      voiceId
    );


  const duration =
    document.getElementById(
      "duration-" +
      voiceId
    );


  const play =
    document.getElementById(
      "play-" +
      voiceId
    );


  const del =
    document.getElementById(
      "delete-" +
      voiceId
    );


  if (
    exists
  ) {

    status.textContent =
      "✅ 已錄製";


    status.classList.add(
      "success"
    );


    status.classList.remove(
      "error"
    );


    play.disabled =
      false;


    del.disabled =
      false;


    if (
      row
      &&
      row.duration_seconds !== null
      &&
      row.duration_seconds !== undefined
    ) {

      duration.textContent =
        "錄音長度："
        +
        Number(
          row.duration_seconds
        ).toFixed(1)
        +
        " 秒";

    }

  }
  else {

    status.textContent =
      "尚未錄音";


    status.classList.remove(
      "success"
    );


    status.classList.remove(
      "error"
    );


    play.disabled =
      true;


    del.disabled =
      true;


    duration.textContent =
      "";

  }

}


/* =========================================================
   15. 開始錄音
   ========================================================= */

async function startRecording(
  voiceId
) {

  if (
    !currentUser
  ) {

    alert(
      "請先登入"
    );

    return;

  }


  if (
    recordingVoiceId
  ) {

    return;

  }


  if (
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices.getUserMedia
  ) {

    alert(
      "此瀏覽器不支援錄音功能"
    );

    return;

  }


  if (
    typeof MediaRecorder ===
    "undefined"
  ) {

    alert(
      "此裝置不支援 MediaRecorder 錄音功能"
    );

    return;

  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: {

            echoCancellation:
              true,

            noiseSuppression:
              true,

            autoGainControl:
              true

          }
        }
      );


    recordingStream =
      stream;


    recordingChunks =
      [];


    const mimeType =
      getRecordingMimeType();


    if (
      mimeType
    ) {

      mediaRecorder =
        new MediaRecorder(
          stream,
          {
            mimeType:
              mimeType
          }
        );

    }
    else {

      mediaRecorder =
        new MediaRecorder(
          stream
        );

    }


    recordingVoiceId =
      voiceId;


    recordingStartTime =
      Date.now();


    const recordBtn =
      document.getElementById(
        "record-" +
        voiceId
      );


    const status =
      document.getElementById(
        "status-" +
        voiceId
      );


    recordBtn.textContent =
      "⏹️ 停止錄音";


    recordBtn.classList.add(
      "recording"
    );


    status.textContent =
      "🔴 正在錄音…";


    status.classList.add(
      "recording"
    );


    status.classList.remove(
      "success"
    );


    updateRecordingTimer(
      voiceId
    );


    recordingTimer =
      setInterval(
        function () {

          updateRecordingTimer(
            voiceId
          );

        },
        200
      );


    mediaRecorder.ondataavailable =
      function (event) {

        if (
          event.data
          &&
          event.data.size > 0
        ) {

          recordingChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onerror =
      function (event) {

        console.error(
          "MediaRecorder 錯誤：",
          event
        );

      };


    mediaRecorder.onstop =
      async function () {

        if (
          recordingTimer
        ) {

          clearInterval(
            recordingTimer
          );

          recordingTimer =
            null;

        }


        if (
          recordingStream
        ) {

          recordingStream
            .getTracks()
            .forEach(
              function (track) {

                track.stop();

              }
            );

          recordingStream =
            null;

        }


        const finalMimeType =
          mediaRecorder.mimeType
          ||
          mimeType
          ||
          "audio/webm";


        const blob =
          new Blob(
            recordingChunks,
            {
              type:
                finalMimeType
            }
          );


        const durationSeconds =
          (
            Date.now()
            -
            recordingStartTime
          )
          /
          1000;


        const finishedVoiceId =
          recordingVoiceId;


        mediaRecorder =
          null;


        recordingChunks =
          [];


        recordingVoiceId =
          null;


        const btn =
          document.getElementById(
            "record-" +
            finishedVoiceId
          );


        if (
          btn
        ) {

          btn.textContent =
            "🎙️ 錄音";


          btn.classList.remove(
            "recording"
          );

        }


        if (
          blob.size === 0
        ) {

          const status =
            document.getElementById(
              "status-" +
              finishedVoiceId
            );


          status.textContent =
            "❌ 沒有錄到聲音";


          status.classList.add(
            "error"
          );


          return;

        }


        await uploadVoice(
          finishedVoiceId,
          blob,
          durationSeconds
        );

      };


    mediaRecorder.start();

  }

  catch (error) {

    console.error(
      "錄音錯誤：",
      error
    );


    if (
      recordingStream
    ) {

      recordingStream
        .getTracks()
        .forEach(
          function (track) {

            track.stop();

          }
        );

      recordingStream =
        null;

    }


    recordingVoiceId =
      null;


    if (
      recordingTimer
    ) {

      clearInterval(
        recordingTimer
      );

      recordingTimer =
        null;

    }


    alert(
      "無法使用麥克風："
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


/* =========================================================
   16. 顯示錄音秒數
   ========================================================= */

function updateRecordingTimer(
  voiceId
) {

  const status =
    document.getElementById(
      "status-" +
      voiceId
    );


  if (
    !status
    ||
    !recordingStartTime
  ) {

    return;

  }


  const seconds =
    (
      Date.now()
      -
      recordingStartTime
    )
    /
    1000;


  status.textContent =
    "🔴 正在錄音 "
    +
    seconds.toFixed(1)
    +
    " 秒…";


}


/* =========================================================
   17. 停止目前錄音
   ========================================================= */

function stopCurrentRecording() {

  if (
    mediaRecorder
    &&
    mediaRecorder.state
    !==
    "inactive"
  ) {

    mediaRecorder.stop();

  }

}


/* =========================================================
   18. 上傳錄音
   ========================================================= */

async function uploadVoice(
  voiceId,
  blob,
  durationSeconds
) {

  if (
    !currentUser
  ) {

    return;

  }


  const progress =
    document.getElementById(
      "progress-" +
      voiceId
    );


  const progressBar =
    document.getElementById(
      "progress-bar-" +
      voiceId
    );


  const status =
    document.getElementById(
      "status-" +
      voiceId
    );


  progress.classList.add(
    "show"
  );


  progressBar.style.width =
    "20%";


  status.textContent =
    "☁️ 正在上傳…";


  status.classList.remove(
    "recording"
  );


  try {

    const old =
      voiceData[
        voiceId
      ];


    /*
     * 舊檔案路徑
     */

    const oldStoragePath =
      old
      &&
      old.storage_path
        ? old.storage_path
        : null;


    /*
     * 取得 MIME
     */

    const mimeType =
      blob.type
      ||
      "audio/webm";


    /*
     * 副檔名
     */

    const extension =
      getFileExtension(
        mimeType
      );


    /*
     * 新檔案路徑
     *
     * 每個使用者自己的資料夾
     */

    const filePath =
      currentUser.id
      +
      "/"
      +
      voiceId
      +
      "."
      +
      extension;


    progressBar.style.width =
      "40%";


    /*
     * 如果舊檔案存在
     * 先刪除
     */

    if (
      oldStoragePath
    ) {

      const oldDelete =
        await sb.storage
          .from(
            VOICE_BUCKET
          )
          .remove([
            oldStoragePath
          ]);


      if (
        oldDelete.error
      ) {

        console.warn(
          "刪除舊語音失敗：",
          oldDelete.error
        );

      }

    }


    /*
     * 上傳新檔案
     */

    const upload =
      await sb.storage
        .from(
          VOICE_BUCKET
        )
        .upload(
          filePath,
          blob,
          {

            contentType:
              mimeType,

            upsert:
              true

          }
        );


    if (
      upload.error
    ) {

      throw upload.error;

    }


    progressBar.style.width =
      "70%";


    /*
     * 先查詢這一段語音
     */

    const existing =
      await sb
        .from(
          VOICE_TABLE
        )
        .select(
          "id"
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "voice_name",
          voiceId
        )
        .maybeSingle();


    if (
      existing.error
    ) {

      throw existing.error;

    }


    let save;


    /*
     * 已經有資料
     * → UPDATE
     */

    if (
      existing.data
      &&
      existing.data.id
    ) {

      save =
        await sb
          .from(
            VOICE_TABLE
          )
          .update(
            {

              storage_path:
                filePath,

              mime_type:
                mimeType,

              duration_seconds:
                Number(
                  durationSeconds.toFixed(2)
                )

            }
          )
          .eq(
            "id",
            existing.data.id
          )
          .select()
          .single();

    }

    /*
     * 沒有資料
     * → INSERT
     */

    else {

      save =
        await sb
          .from(
            VOICE_TABLE
          )
          .insert(
            {

              user_id:
                currentUser.id,

              voice_name:
                voiceId,

              storage_path:
                filePath,

              mime_type:
                mimeType,

              duration_seconds:
                Number(
                  durationSeconds.toFixed(2)
                )

            }
          )
          .select()
          .single();

    }


    if (
      save.error
    ) {

      throw save.error;

    }


    progressBar.style.width =
      "100%";


    voiceData[
      voiceId
    ] =
      save.data;


    updateVoiceUI(
      voiceId,
      true,
      save.data
    );


    status.textContent =
      "✅ 上傳成功";


    showStatus(
      "語音「"
      +
      (
        VOICES.find(
          function (v) {

            return v.id === voiceId;

          }
        )?.title
        ||
        voiceId
      )
      +
      "」上傳成功"
    );

  }

  catch (error) {

    console.error(
      "語音上傳錯誤：",
      error
    );


    status.textContent =
      "❌ 上傳失敗";


    status.classList.add(
      "error"
    );


    alert(
      "語音上傳失敗：\n"
      +
      (
        error.message
        ||
        error
      )
    );

  }

  finally {

    setTimeout(
      function () {

        progress.classList.remove(
          "show"
        );

        progressBar.style.width =
          "0%";

      },
      500
    );

  }

}


/* =========================================================
   19. 取得私人語音 Signed URL
   ========================================================= */

async function getVoiceUrl(
  filePath
) {

  const result =
    await sb.storage
      .from(
        VOICE_BUCKET
      )
      .createSignedUrl(
        filePath,
        3600
      );


  if (
    result.error
  ) {

    throw result.error;

  }


  return result.data.signedUrl;

}


/* =========================================================
   20. 播放語音
   ========================================================= */

async function playVoice(
  voiceId
) {

  const row =
    voiceData[
      voiceId
    ];


  if (
    !row
    ||
    !row.storage_path
  ) {

    alert(
      "這段語音尚未錄製"
    );

    return;

  }


  try {

    showStatus(
      "正在準備播放…"
    );


    const url =
      await getVoiceUrl(
        row.storage_path
      );


    const audio =
      new Audio();


    audio.preload =
      "auto";


    audio.src =
      url;


    await audio.play();

  }

  catch (error) {

    console.error(
      "播放失敗：",
      error
    );


    alert(
      "播放失敗：\n"
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


/* =========================================================
   21. 刪除語音
   ========================================================= */

async function deleteVoice(
  voiceId
) {

  if (
    !currentUser
  ) {

    return;

  }


  const row =
    voiceData[
      voiceId
    ];


  if (
    !row
  ) {

    return;

  }


  const voice =
    VOICES.find(
      function (item) {

        return item.id === voiceId;

      }
    );


  if (
    !confirm(
      "確定刪除「"
      +
      (
        voice
          ? voice.title
          : voiceId
      )
      +
      "」的錄音嗎？"
    )
  ) {

    return;

  }


  try {

    /*
     * 刪除 Storage
     */

    if (
      row.storage_path
    ) {

      const storageResult =
        await sb.storage
          .from(
            VOICE_BUCKET
          )
          .remove([
            row.storage_path
          ]);


      if (
        storageResult.error
      ) {

        throw storageResult.error;

      }

    }


    /*
     * 刪除資料表資料
     */

    const dbResult =
      await sb
        .from(
          VOICE_TABLE
        )
        .delete()
        .eq(
          "id",
          row.id
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if (
      dbResult.error
    ) {

      throw dbResult.error;

    }


    delete voiceData[
      voiceId
    ];


    updateVoiceUI(
      voiceId,
      false
    );


    showStatus(
      "錄音已刪除"
    );

  }

  catch (error) {

    console.error(
      "刪除語音失敗：",
      error
    );


    alert(
      "刪除失敗：\n"
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


/* =========================================================
   22. 按鈕事件
   =========================================================
   
   注意：
   不使用 HTML onclick。
   避免開始錄音後被事件再次觸發，
   造成「一按錄音就停止」的問題。
   
   ========================================================= */

voiceList.addEventListener(
  "click",
  async function (event) {

    const button =
      event.target.closest(
        "button"
      );


    if (
      !button
    ) {

      return;

    }


    const action =
      button.dataset.action;


    const voiceId =
      button.dataset.voiceId;


    if (
      !voiceId
    ) {

      return;

    }


    /*
     * 錄音 / 停止
     */

    if (
      action ===
      "record"
    ) {

      if (
        recordingVoiceId
        ===
        voiceId
      ) {

        stopCurrentRecording();

      }
      else {

        if (
          recordingVoiceId
        ) {

          return;

        }


        await startRecording(
          voiceId
        );

      }


      return;

    }


    /*
     * 播放
     */

    if (
      action ===
      "play"
    ) {

      await playVoice(
        voiceId
      );

      return;

    }


    /*
     * 刪除
     */

    if (
      action ===
      "delete"
    ) {

      await deleteVoice(
        voiceId
      );

      return;

    }

  }
);


/* =========================================================
   23. 初始化
   ========================================================= */

renderVoiceList();

loadUser();


</script>
