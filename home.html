<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 14px; font-size: 20px; }

    .alert-banner {
      background: #fdecea;
      border-left: 5px solid #e74c3c;
      margin: 12px 12px 0;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }
    .alert-icon { font-size: 22px; flex-shrink: 0; }
    .alert-content { flex: 1; padding-right: 24px; }
    .alert-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 4px; }
    .alert-text { font-size: 13px; color: #555; line-height: 1.4; }
    .alert-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .alert-link {
      font-size: 13px;
      color: #06C755;
      font-weight: 600;
      text-decoration: none;
    }
    .siren-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .alert-close {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 18px;
      color: #999;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content { padding: 16px 12px; }

    .empty-state {
      background: white;
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .empty-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
    }
    .empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .empty-desc { font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.4; }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: #06C755; color: white; }
    .btn-outline {
      background: white;
      color: #06C755;
      border: 1px solid #06C755;
      margin-left: 8px;
    }

    .sos-bar {
      background: #e74c3c;
      color: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .quick-item {
      background: white;
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }
    .quick-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 6px;
      font-size: 20px;
    }
    .quick-label { font-size: 12px; color: #555; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 18px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 10px;
      width: 60px;
      text-decoration: none;
    }
    .nav-item.active { color: #06C755; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>安全團聚</h1>
    <div class="header-right">
      <span>🔔</span>
      <span>⚙️</span>
    </div>
  </div>

  <div class="alert-banner" id="alertBanner">
    <div class="alert-icon">⚠️</div>
    <div class="alert-content">
      <div class="alert-title">警訊通知</div>
      <div class="alert-text">
        [演習預告] 8/10 中部地區及 8/13 北部地區將實施城鎮韌性（防空）演習，行動網路可能受影響。
      </div>
      <div class="alert-actions">
        <a class="alert-link" href="https://gov.tw/KxS" target="_blank" rel="noopener">查看詳細資訊 →</a>
        <button type="button" class="siren-btn" id="btnSiren">▶ 播放警笛</button>
      </div>
    </div>
    <div class="alert-close" id="btnCloseAlert">✕</div>
  </div>

  <div class="content">
    <div class="sos-bar" id="btnSos">
      🚨 緊急求助 SOS
    </div>

    <div class="empty-state">
      <div class="empty-icon">👥</div>
      <div class="empty-title">尚未加入任何成員</div>
      <div class="empty-desc">邀請家人或同學加入，即可即時掌握彼此安全狀態</div>
      <button type="button" class="btn btn-primary" onclick="location.href='contacts.html'">去通訊錄</button>
      <button type="button" class="btn btn-outline" onclick="location.href='contacts.html'">建立群組</button>
    </div>

    <div class="quick-row">
      <a class="quick-item" href="map.html">
        <div class="quick-icon">🗺️</div>
        <div class="quick-label">地圖</div>
      </a>
      <a class="quick-item" href="chat.html">
        <div class="quick-icon">💬</div>
        <div class="quick-label">聊天</div>
      </a>
      <a class="quick-item" href="me.html">
        <div class="quick-icon">📦</div>
        <div class="quick-label">物資</div>
      </a>
      <a class="quick-item" href="map.html">
        <div class="quick-icon">📍</div>
        <div class="quick-label">集合點</div>
      </a>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-item active" href="home.html">
      <div class="nav-icon">🏠</div>
      首頁
    </a>
    <a class="nav-item" href="chat.html">
      <div class="nav-icon">💬</div>
      聊天
    </a>
    <a class="nav-item" href="contacts.html">
      <div class="nav-icon">👥</div>
      通訊錄
    </a>
    <a class="nav-item" href="me.html">
      <div class="nav-icon">👤</div>
      我
    </a>
  </div>

  <script>
  (function () {
    var audioCtx = null;
    var oscillator = null;
    var gainNode = null;
    var isPlaying = false;
    var stopTimer = null;
    var sweepTimer = null;

    var ALERT_ID = 'alert-20260807';

    function closeAlert() {
      var banner = document.getElementById('alertBanner');
      if (banner) banner.style.display = 'none';
      try { localStorage.setItem(ALERT_ID, 'seen'); } catch (e) {}
      stopSiren();
    }

    function stopSiren() {
      if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
      if (sweepTimer) { clearInterval(sweepTimer); sweepTimer = null; }
      if (oscillator) {
        try { oscillator.stop(); } catch (e) {}
        oscillator = null;
      }
      isPlaying = false;
      var btn = document.getElementById('btnSiren');
      if (btn) btn.textContent = '▶ 播放警笛';
    }

    function playSiren() {
      if (isPlaying) {
        stopSiren();
        return;
      }

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        alert('此裝置不支援網頁音效');
        return;
      }

      function startTone() {
        isPlaying = true;
        var btn = document.getElementById('btnSiren');
        if (btn) btn.textContent = '■ 停止警笛';

        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();
        oscillator.type = 'sawtooth';
        gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        var t0 = audioCtx.currentTime;
        oscillator.frequency.setValueAtTime(800, t0);
        oscillator.frequency.linearRampToValueAtTime(1200, t0 + 0.5);
        oscillator.frequency.linearRampToValueAtTime(800, t0 + 1);
        oscillator.start();

        // 重複高低掃頻，比較像警笛
        var phase = 0;
        sweepTimer = setInterval(function () {
          if (!oscillator || !audioCtx) return;
          phase += 1;
          var now = audioCtx.currentTime;
          try {
            if (phase % 2 === 1) {
              oscillator.frequency.cancelScheduledValues(now);
              oscillator.frequency.setValueAtTime(800, now);
              oscillator.frequency.linearRampToValueAtTime(1200, now + 0.5);
            } else {
              oscillator.frequency.cancelScheduledValues(now);
              oscillator.frequency.setValueAtTime(1200, now);
              oscillator.frequency.linearRampToValueAtTime(800, now + 0.5);
            }
          } catch (e) {}
        }, 500);

        stopTimer = setTimeout(function () {
          stopSiren();
        }, 8000);
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(startTone).catch(function () {
          alert('請再點一次播放警笛（需解除靜音）');
        });
      } else {
        startTone();
      }
    }

    document.getElementById('btnSiren').onclick = playSiren;
    document.getElementById('btnCloseAlert').onclick = closeAlert;
    document.getElementById('btnSos').onclick = function () {
      alert('SOS 功能之後會接上真實後端');
    };

    try {
      if (localStorage.getItem(ALERT_ID) === 'seen') {
        var banner = document.getElementById('alertBanner');
        if (banner) banner.style.display = 'none';
      }
    } catch (e) {}
  })();
  </script>
  <script src="call-notify.js"></script>
</body>
</html>
