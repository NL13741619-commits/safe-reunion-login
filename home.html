<!DOCTYPE html>

  <title>安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 16px; font-size: 20px; }
    .content { padding: 0; }
    .section-title {
      padding: 14px 16px 8px;
      font-size: 13px;
      color: #888;
      font-weight: 500;
    }
    .member-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }
    .member-item:active { background: #f8f8f8; }
    .member-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #e9e9e9;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 16px; font-weight: 500; }
    .member-status { font-size: 13px; color: #999; margin-top: 2px; }
    .status-safe { color: #06C755; }
    .status-unknown { color: #f5a623; }
    .status-danger { color: #e74c3c; }
    .sos-bar {
      margin: 16px;
      background: #e74c3c;
      color: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.25);
    }
    .quick-row {
      display: flex;
      justify-content: space-around;
      padding: 16px 8px;
      border-top: 8px solid #f5f5f5;
    }
    .quick-item {
      text-align: center;
      width: 70px;
    }
    .quick-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 6px;
      font-size: 24px;
    }
    .quick-label { font-size: 12px; color: #555; }
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 18px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 10px;
      width: 60px;
    }
    .nav-item.active { color: #06C755; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
