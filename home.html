<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }

    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 20px;
    }

    /* =========================
       警訊
    ========================== */

    .alert-banner {
      background: #fdecea;
      border-left: 5px solid #e74c3c;
      margin: 12px 12px 0;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }

    .alert-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .alert-content {
      flex: 1;
      padding-right: 24px;
    }

    .alert-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .alert-text {
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }

    .alert-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .alert-link {
      font-size: 13px;
      color: #06C755;
      font-weight: 600;
      text-decoration: none;
    }

    .siren-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .alert-close {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 18px;
      color: #999;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       SOS 收到通知
    ========================== */

    .sos-incoming {
      display: none;
      background: #b71c1c;
      color: #fff;
      margin: 12px;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(183,28,28,0.35);
      position: relative;
      z-index: 150;
    }

    .sos-incoming.show {
      display: block;
      animation: sosPulse 1s infinite alternate;
    }

    @keyframes sosPulse {
      from {
        box-shadow: 0 4px 16px rgba(183,28,28,0.25);
      }
      to {
        box-shadow: 0 4px 25px rgba(183,28,28,0.7);
      }
    }

    .sos-incoming-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .sos-incoming-text {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .sos-incoming-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sos-incoming-buttons button {
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 600;
    }

    .sos-map-btn {
      background: #fff;
      color: #b71c1c;
    }

    .sos-close-btn {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* =========================
       內容
    ========================== */

    .content {
      padding: 16px 12px;
    }

    .empty-state {
      background: white;
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #06C755;
      color: white;
    }

    .btn-outline {
      background: white;
      color: #06C755;
      border: 1px solid #06C755;
      margin-left: 8px;
    }

    /* =========================
       SOS
    ========================== */

    .sos-bar {
      background: #e74c3c;
      color: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }

    .sos-bar:active {
      transform: scale(0.98);
    }

    .sos-status {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: -8px;
      margin-bottom: 16px;
      min-height: 18px;
    }

    /* =========================
       快速功能
    ========================== */

    .quick-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .quick-item {
      background: white;
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .quick-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      font-size: 20px;
    }

    .quick-label {
      font-size: 12px;
      color: #555;
    }

    /* =========================
       底部
    ========================== */

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      z-index: 30;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #888;
      text-decoration: none;
    }

    .tab.active {
      color: #06C755;
      font-weight: 600;
    }

    .tab-icon {
      font-size: 20px;
      line-height: 1.2;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>安全團聚</h1>
    <div class="header-right">
      <span>🔔</span>
      <span>⚙️</span>
    </div>
  </div>

  <!-- 收到其他群組成員 SOS -->

    <div class="sos-incoming-title">

    </div>

    </div>

    <div class="sos-incoming-buttons">

  <!-- 原本警訊 -->
  <div class="alert-banner" id="alertBanner">

  <div class="content">

    <!-- SOS -->
    <div

    </div>

    <div

    <div class="empty-state">

      <div class="empty-icon">

      <div class="empty-title">

      </div>

      <div class="empty-desc">
        邀請家人或同學加入，即可即時掌握彼此安全狀態
      </div>

      <button
        type="button"

        去通訊錄

      <button
        type="button"

    <div class="quick-row">

      <a

      </a>

      <a
        class="quick-item"

      </a>

      <a
        class="quick-item"

      </a>

      <a

  <!-- 底部導航 -->

  <div class="tabbar">

    <a
      class="tab"

    <a

    <a

<script>

(function () {

  /* =========================================================
     Supabase
  ========================================================= */

  var SUPABASE_URL =
    'https://perfsipperncvjocznhl.supabase.co';

  var SUPABASE_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';

  var supabase = null;
  var myUser = null;

  var activeGroupId = null;
  var realtimeChannel = null;

  var lastIncomingSOS = null;


  /* =========================================================
     基本工具
  ========================================================= */

  function setSOSStatus(text) {

    var el = document.getElementById('sosStatus');

    if (el) {
      el.textContent = text;
    }

  }


  function escapeHtml(text) {

    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

  }


  function getQueryGroupId() {

    try {

      var params = new URLSearchParams(location.search);

      return (
        params.get('group_id') ||
        params.get('groupId') ||
        params.get('id') ||
        ''
      );

    } catch (e) {

      return '';

    }

  }


  /* =========================================================
     找目前群組
  ========================================================= */

  async function findActiveGroup() {

    var urlGroup = getQueryGroupId();

    if (urlGroup) {

      activeGroupId = urlGroup;

      try {
        localStorage.setItem(
          'active_group_id',
          activeGroupId
        );
      } catch (e) {}

      return activeGroupId;
    }


    try {

      var saved =
        localStorage.getItem('active_group_id');

      if (saved) {

        activeGroupId = saved;

        return activeGroupId;

      }

    } catch (e) {}


    if (!supabase || !myUser) {
      return null;
    }


    /*
      如果 home.html 沒有帶群組 ID，
      嘗試找使用者第一個群組。
    */

    var result = await supabase
      .from('group_members')
      .select('group_id')
      .eq('user_id', myUser.id)
      .limit(1)
      .maybeSingle();


    if (
      result &&
      result.data &&
      result.data.group_id
    ) {

      activeGroupId = result.data.group_id;

      try {

        localStorage.setItem(
          'active_group_id',
          activeGroupId
        );

      } catch (e) {}

      return activeGroupId;

    }


    return null;

  }


  /* =========================================================
     GPS
  ========================================================= */

  function getCurrentLocation() {

    return new Promise(function (resolve) {

      if (!navigator.geolocation) {

        resolve({
          latitude: null,
          longitude: null
        });

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function (position) {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude

          });

        },

        function () {

          resolve({

            latitude: null,
            longitude: null

          });

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        }

      );

    });

  }


  /* =========================================================
     警笛
  ========================================================= */

  var audioCtx = null;
  var oscillator = null;
  var gainNode = null;
  var isPlaying = false;
  var stopTimer = null;
  var sweepTimer = null;


  function stopSiren() {

    if (stopTimer) {

      clearTimeout(stopTimer);
      stopTimer = null;

    }

    if (sweepTimer) {

      clearInterval(sweepTimer);
      sweepTimer = null;

    }

    if (oscillator) {

      try {
        oscillator.stop();
      } catch (e) {}

      oscillator = null;

    }

    isPlaying = false;

    var btn =
      document.getElementById('btnSiren');

    if (btn) {

      btn.textContent =
        '▶ 播放警笛';

    }

  }


  function playSiren() {

    if (isPlaying) {

      stopSiren();

      return;

    }


    try {

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    } catch (e) {

      alert('此裝置不支援網頁音效');

      return;

    }


    function startTone() {

      isPlaying = true;

      var btn =
        document.getElementById('btnSiren');

      if (btn) {

        btn.textContent =
          '■ 停止警笛';

      }


      oscillator =
        audioCtx.createOscillator();

      gainNode =
        audioCtx.createGain();


      oscillator.type =
        'sawtooth';

      gainNode.gain.setValueAtTime(
        0.12,
        audioCtx.currentTime
      );


      oscillator.connect(gainNode);

      gainNode.connect(
        audioCtx.destination
      );


      var t0 =
        audioCtx.currentTime;


      oscillator.frequency.setValueAtTime(
        800,
        t0
      );

      oscillator.frequency.linearRampToValueAtTime(
        1200,
        t0 + 0.5
      );

      oscillator.frequency.linearRampToValueAtTime(
        800,
        t0 + 1
      );


      oscillator.start();


      var phase = 0;


      sweepTimer =
        setInterval(function () {

          if (!oscillator || !audioCtx) {
            return;
          }


          phase++;

          var now =
            audioCtx.currentTime;


          try {

            if (phase % 2 === 1) {

              oscillator.frequency.cancelScheduledValues(now);

              oscillator.frequency.setValueAtTime(
                800,
                now
              );

              oscillator.frequency.linearRampToValueAtTime(
                1200,
                now + 0.5
              );

            } else {

              oscillator.frequency.cancelScheduledValues(now);

              oscillator.frequency.setValueAtTime(
                1200,
                now
              );

              oscillator.frequency.linearRampToValueAtTime(
                800,
                now + 0.5
              );

            }

          } catch (e) {}

        }, 500);


      stopTimer =
        setTimeout(function () {

          stopSiren();

        }, 8000);

    }


    if (audioCtx.state === 'suspended') {

      audioCtx.resume()
        .then(startTone)
        .catch(function () {

          alert(
            '請再點一次播放警笛'
          );

        });

    } else {

      startTone();

    }

  }


  document.getElementById(
    'btnSiren'
  ).onclick = playSiren;


  /* =========================================================
     原本警訊關閉
  ========================================================= */

  var ALERT_ID =
    'alert-20260807';


  function closeAlert() {

    var banner =
      document.getElementById(
        'alertBanner'
      );

    if (banner) {

      banner.style.display =
        'none';

    }

    try {

      localStorage.setItem(
        ALERT_ID,
        'seen'
      );

    } catch (e) {}

    stopSiren();

  }


  document.getElementById(
    'btnCloseAlert'
  ).onclick = closeAlert;


  try {

    if (
      localStorage.getItem(
        ALERT_ID
      ) === 'seen'
    ) {

      var banner =
        document.getElementById(
          'alertBanner'
        );

      if (banner) {

        banner.style.display =
          'none';

      }

    }

  } catch (e) {}


  /* =========================================================
     發送 SOS
  ========================================================= */

  async function sendSOS() {

    if (!supabase || !myUser) {

      alert(
        '請先登入安全團聚，再使用 SOS。'
      );

      return;

    }


    /*
      找群組
    */

    var groupId =
      await findActiveGroup();


    if (!groupId) {

      alert(
        '目前找不到你所在的群組。\n\n' +
        '請先進入群組，或從群組頁面開啟安全團聚。'
      );

      return;

    }


    var confirmSOS =
      confirm(
        '🚨 確定要發出 SOS 緊急求助嗎？\n\n' +
        '同群組成員將收到你的 SOS 通知。'
      );


    if (!confirmSOS) {

      return;

    }


    setSOSStatus(
      '正在取得目前位置…'
    );


    var location =
      await getCurrentLocation();


    var latitude =
      location.latitude;

    var longitude =
      location.longitude;


    var displayName =
      (
        myUser.user_metadata &&
        (
          myUser.user_metadata.nickname ||
          myUser.user_metadata.username
        )
      ) ||
      (
        myUser.email
          ? myUser.email.split('@')[0]
          : '成員'
      );


    var message =
      '🚨 ' +
      displayName +
      ' 發出 SOS 緊急求助';


    /*
      =============================================
      第一階段：
      寫入 sos_events
      =============================================
    */

    setSOSStatus(
      '正在建立 SOS 事件…'
    );


    var eventResult =
      await supabase
        .from('sos_events')
        .insert({

          room_id:
            String(groupId),

          user_id:
            myUser.id,

          display_name:
            displayName,

          lat:
            latitude,

          lng:
            longitude,

          message:
            message

        })
        .select()
        .single();


    if (eventResult.error) {

      console.error(
        'sos_events error:',
        eventResult.error
      );

      setSOSStatus(
        'SOS 建立失敗'
      );

      alert(
        'SOS 建立失敗：\n' +
        eventResult.error.message
      );

      return;

    }


    var event =
      eventResult.data;


    /*
      =============================================
      第二階段：
      找同群組所有成員
      =============================================
    */

    setSOSStatus(
      '正在通知群組成員…'
    );


    var membersResult =
      await supabase
        .from('group_members')
        .select('user_id')
        .eq(
          'group_id',
          groupId
        );


    if (membersResult.error) {

      console.error(
        'group_members error:',
        membersResult.error
      );

      setSOSStatus(
        'SOS 已建立，但無法取得群組成員'
      );

      alert(
        'SOS 已成功建立！\n\n' +
        '但是目前無法取得群組成員名單：\n' +
        membersResult.error.message
      );

      return;

    }


    var members =
      membersResult.data || [];


    /*
      不通知自己
    */

    var recipients =
      members.filter(function (member) {

        return (
          member.user_id &&
          member.user_id !== myUser.id
        );

      });


    /*
      =============================================
      第三階段：
      建立 sos_alerts
      =============================================
      
      這裡採用：

      user_id = 「收到通知的人」

      group_id = 群組

      event_id = sos_events.id

    */

    var alertRows =
      recipients.map(function (member) {

        return {

          event_id:
            event.id,

          group_id:
            groupId,

          user_id:
            member.user_id,

          latitude:
            latitude,

          longitude:
            longitude,

          address:
            '',

          message:
            message,

          status:
            'unread'

        };

      });


    if (alertRows.length) {

      var alertsResult =
        await supabase
          .from('sos_alerts')
          .insert(alertRows);


      if (alertsResult.error) {

        console.error(
          'sos_alerts error:',
          alertsResult.error
        );


        setSOSStatus(
          'SOS 已建立，但通知未送出'
        );


        /*
          這個錯誤非常重要。

          如果看到：

          new row violates row-level security policy

          就代表是 Supabase RLS
          阻止前端替其他 user_id 建立通知。
        */

        alert(
          '🚨 SOS 已成功建立！\n\n' +
          '但是「群組通知」沒有成功寫入 sos_alerts。\n\n' +
          '錯誤：\n' +
          alertsResult.error.message
        );

        return;

      }

    }


    setSOSStatus(
      '🚨 SOS 已發出，群組成員已通知'
    );


    alert(
      '🚨 SOS 已發出！\n\n' +
      '你的 SOS 已建立，' +
      recipients.length +
      ' 位群組成員將收到通知。'
    );

  }


  document.getElementById(
    'btnSos'
  ).onclick = sendSOS;


  /* =========================================================
     顯示收到的 SOS
  ========================================================= */

  function showIncomingSOS(alertRow) {

    if (!alertRow) {
      return;
    }


    /*
      防止同一事件重複顯示
    */

    if (
      lastIncomingSOS ===
      alertRow.event_id
    ) {

      return;

    }


    lastIncomingSOS =
      alertRow.event_id;


    var box =
      document.getElementById(
        'incomingSOS'
      );

    var text =
      document.getElementById(
        'incomingSOSText'
      );


    var name =
      '群組成員';


    if (
      alertRow.message &&
      alertRow.message.indexOf(
        '發出 SOS'
      ) >= 0
    ) {

      name =
        alertRow.message
          .replace('🚨 ', '')
          .replace(' 發出 SOS 緊急求助', '');

    }


    var locationText =
      '位置：未取得';


    if (
      alertRow.latitude !== null &&
      alertRow.latitude !== undefined &&
      alertRow.longitude !== null &&
      alertRow.longitude !== undefined
    ) {

      locationText =
        '位置：' +
        Number(alertRow.latitude).toFixed(6) +
        ', ' +
        Number(alertRow.longitude).toFixed(6);

    }


    text.innerHTML =
      '<strong>' +
      escapeHtml(name) +
      '</strong> 發出緊急 SOS。<br>' +
      escapeHtml(locationText);


    box.classList.add('show');


    /*
      震動
    */

    try {

      if (navigator.vibrate) {

        navigator.vibrate([
          300,
          150,
          300,
          150,
          500
        ]);

      }

    } catch (e) {}


    /*
      播放提示音
    */

    try {

      var ctx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      var osc =
        ctx.createOscillator();

      var gain =
        ctx.createGain();

      osc.frequency.value =
        880;

      gain.gain.value =
        0.15;

      osc.connect(gain);

      gain.connect(
        ctx.destination
      );

      osc.start();

      osc.stop(
        ctx.currentTime + 0.5
      );

    } catch (e) {}

  }


  /* =========================================================
     SOS 地圖
  ========================================================= */

  document.getElementById(
    'incomingSOSMap'
  ).onclick = function () {

    if (!lastIncomingSOS) {
      return;
    }


    var lat =
      lastIncomingSOS.latitude;

    var lng =
      lastIncomingSOS.longitude;


    if (
      lat === null ||
      lat === undefined ||
      lng === null ||
      lng === undefined
    ) {

      alert(
        '這次 SOS 沒有取得 GPS 位置。'
      );

      return;

    }


    /*
      導向 map.html，
      並把 SOS 座標傳過去。
    */

    location.href =
      'map.html' +
      '?id=' +
      encodeURIComponent(
        activeGroupId || ''
      ) +
      '&name=' +
      encodeURIComponent(
        'SOS 位置'
      ) +
      '&lat=' +
      encodeURIComponent(lat) +
      '&lng=' +
      encodeURIComponent(lng);

  };


  document.getElementById(
    'incomingSOSClose'
  ).onclick = function () {

    document
      .getElementById('incomingSOS')
      .classList.remove('show');

  };


  /* =========================================================
     Realtime：監聽 sos_alerts
  ========================================================= */

  async function subscribeSOSAlerts() {

    if (
      !supabase ||
      !myUser
    ) {

      return;

    }


    if (!activeGroupId) {

      await findActiveGroup();

    }


    if (!activeGroupId) {

      setSOSStatus(
        '尚未選擇群組'
      );

      return;

    }


    /*
      如果之前已經訂閱，
      先取消。
    */

    if (realtimeChannel) {

      try {

        await supabase.removeChannel(
          realtimeChannel
        );

      } catch (e) {}

      realtimeChannel = null;

    }


    realtimeChannel =
      supabase
        .channel(
          'sos-alerts-' +
          activeGroupId +
          '-' +
          myUser.id
        )
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'sos_alerts',
            filter:
              'user_id=eq.' +
              myUser.id
          },
          function (payload) {

            console.log(
              '收到 SOS alert:',
              payload.new
            );


            var row =
              payload.new;


            /*
              再確認是不是自己的群組
            */

            if (
              row.group_id &&
              String(row.group_id) !==
              String(activeGroupId)
            ) {

              return;

            }


            showIncomingSOS(row);

          }
        )
        .subscribe(
          function (status) {

            console.log(
              'SOS Realtime:',
              status
            );

          }
        );

  }


  /* =========================================================
     載入登入狀態
  ========================================================= */

  async function initSOS() {

    try {

      if (
        !window.supabase ||
        !window.supabase.createClient
      ) {

        setSOSStatus(
          'Supabase 套件載入失敗'
        );

        return;

      }


      supabase =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      var sessionResult =
        await supabase.auth.getSession();


      var session =
        sessionResult.data &&
        sessionResult.data.session;


      if (!session) {

        setSOSStatus(
          '尚未登入，SOS 暫不可使用'
        );

        return;

      }


      myUser =
        session.user;


      await findActiveGroup();


      if (activeGroupId) {

        setSOSStatus(
          'SOS 系統已啟動'
        );

        await subscribeSOSAlerts();

      } else {

        setSOSStatus(
          '尚未找到群組'
        );

      }


    } catch (error) {

      console.error(
        'SOS init error:',
        error
      );

      setSOSStatus(
        'SOS 系統初始化失敗'
      );

    }

  }


  /* =========================================================
     啟動
  ========================================================= */

  initSOS();


})();

</script>
