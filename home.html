<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }

    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 20px;
    }

    .alert-banner {
      background: #fdecea;
      border-left: 5px solid #e74c3c;
      margin: 12px 12px 0;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }

    .alert-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .alert-content {
      flex: 1;
      padding-right: 24px;
    }

    .alert-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .alert-text {
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }

    .alert-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .alert-link {
      font-size: 13px;
      color: #06C755;
      font-weight: 600;
      text-decoration: none;
    }

    .siren-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .alert-close {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 18px;
      color: #999;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 16px 12px;
    }

    .empty-state {
      background: white;
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #06C755;
      color: white;
    }

    .btn-outline {
      background: white;
      color: #06C755;
      border: 1px solid #06C755;
      margin-left: 8px;
    }

    /* SOS */
    .sos-bar {
      background: #e53935;
      color: white;
      border-radius: 12px;
      padding: 17px 16px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 16px;
      box-shadow: 0 3px 10px rgba(229,57,53,0.25);
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, opacity 0.1s;
    }

    .sos-bar:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .sos-bar.sending {
      background: #b71c1c;
      pointer-events: none;
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .quick-item {
      background: white;
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .quick-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      font-size: 20px;
    }

    .quick-label {
      font-size: 12px;
      color: #555;
    }

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      z-index: 30;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #888;
      text-decoration: none;
    }

    .tab.on {
      color: #06C755;
      font-weight: 600;
    }

    .tab .ico {
      font-size: 20px;
      line-height: 1.2;
    }
  </style>
</head>

<body>

  <!-- 頂部 -->
  <div class="header">
    <h1>安全團聚</h1>

    <div class="header-right">
      <span>🔔</span>
      <span>⚙️</span>
    </div>
  </div>


  <!-- 警訊 -->
  <div class="alert-banner" id="alertBanner">

    <div class="alert-icon">⚠️</div>

    <div class="alert-content">

      <div class="alert-title">
        警訊通知
      </div>

      <div class="alert-text">
        [演習預告] 8/10 中部地區及 8/13 北部地區將實施城鎮韌性（防空）演習，行動網路可能受影響。
      </div>

      <div class="alert-actions">

        <a
          class="alert-link"
          href="https://gov.tw/KxS"
          target="_blank"
          rel="noopener"
        >
          查看詳細資訊 →
        </a>

        <button
          type="button"
          class="siren-btn"
          id="btnSiren"
        >
          ▶ 播放警笛
        </button>

      </div>

    </div>

    <div
      class="alert-close"
      id="btnCloseAlert"
    >
      ✕
    </div>

  </div>


  <div class="content">

    <!-- SOS -->
    <div
      class="sos-bar"
      id="btnSos"
    >
      🚨 緊急求助 SOS
    </div>


    <!-- 成員 -->
    <div class="empty-state">

      <div class="empty-icon">
        👥
      </div>

      <div class="empty-title">
        尚未加入任何成員
      </div>

      <div class="empty-desc">
        邀請家人或同學加入，即可即時掌握彼此安全狀態
      </div>

      <button
        type="button"
        class="btn btn-primary"
        onclick="location.href='contacts.html'"
      >
        去通訊錄
      </button>

      <button
        type="button"
        class="btn btn-outline"
        onclick="location.href='contacts.html'"
      >
        建立群組
      </button>

    </div>


    <!-- 快速功能 -->
    <div class="quick-row">

      <a
        class="quick-item"
        href="map.html"
      >
        <div class="quick-icon">
          🗺️
        </div>

        <div class="quick-label">
          地圖
        </div>
      </a>


      <a
        class="quick-item"
        href="chat.html"
      >
        <div class="quick-icon">
          💬
        </div>

        <div class="quick-label">
          聊天
        </div>
      </a>


      <a
        class="quick-item"
        href="me.html"
      >
        <div class="quick-icon">
          📦
        </div>

        <div class="quick-label">
          物資
        </div>
      </a>


      <a
        class="quick-item"
        href="chat.html"
      >
        <div class="quick-icon">
          📍
        </div>

        <div class="quick-label">
          去聊天設集合
        </div>
      </a>

    </div>

  </div>


  <!-- 底部導航 -->
  <div class="tabbar">

    <a
      class="tab"
      href="chat.html"
    >
      <div class="ico">
        💬
      </div>
      聊天
    </a>


    <a
      class="tab"
      href="contacts.html"
    >
      <div class="ico">
        👥
      </div>
      通訊錄
    </a>


    <a
      class="tab on"
      href="home.html"
    >
      <div class="ico">
        🧭
      </div>
      發現
    </a>


    <a
      class="tab"
      href="me.html"
    >
      <div class="ico">
        👤
      </div>
      我
    </a>

  </div>


<script>

(function () {

  /* =========================================================
     Supabase
     ========================================================= */

  var SUPABASE_URL =
    'https://perfsipperncvjocznhl.supabase.co';

  var SUPABASE_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';

  var supabase = null;


  /* =========================================================
     初始化 Supabase
     ========================================================= */

  function initSupabase() {

    try {

      if (
        window.supabase &&
        window.supabase.createClient
      ) {

        supabase =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

        return true;
      }

    } catch (e) {

      console.error(
        'Supabase 初始化失敗：',
        e
      );

    }

    return false;
  }


  initSupabase();


  /* =========================================================
     警訊
     ========================================================= */

  var audioCtx = null;
  var oscillator = null;
  var gainNode = null;
  var isPlaying = false;
  var stopTimer = null;
  var sweepTimer = null;

  var ALERT_ID = 'alert-20260807';


  function closeAlert() {

    var banner =
      document.getElementById('alertBanner');

    if (banner) {
      banner.style.display = 'none';
    }

    try {
      localStorage.setItem(
        ALERT_ID,
        'seen'
      );
    } catch (e) {}

    stopSiren();
  }


  function stopSiren() {

    if (stopTimer) {
      clearTimeout(stopTimer);
      stopTimer = null;
    }

    if (sweepTimer) {
      clearInterval(sweepTimer);
      sweepTimer = null;
    }

    if (oscillator) {

      try {
        oscillator.stop();
      } catch (e) {}

      oscillator = null;
    }

    isPlaying = false;

    var btn =
      document.getElementById('btnSiren');

    if (btn) {
      btn.textContent = '▶ 播放警笛';
    }
  }


  function playSiren() {

    if (isPlaying) {
      stopSiren();
      return;
    }

    try {

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    } catch (e) {

      alert('此裝置不支援網頁音效');
      return;
    }


    function startTone() {

      isPlaying = true;

      var btn =
        document.getElementById('btnSiren');

      if (btn) {
        btn.textContent = '■ 停止警笛';
      }


      oscillator =
        audioCtx.createOscillator();

      gainNode =
        audioCtx.createGain();

      oscillator.type = 'sawtooth';

      gainNode.gain.setValueAtTime(
        0.12,
        audioCtx.currentTime
      );


      oscillator.connect(gainNode);

      gainNode.connect(
        audioCtx.destination
      );


      var t0 =
        audioCtx.currentTime;


      oscillator.frequency.setValueAtTime(
        800,
        t0
      );

      oscillator.frequency.linearRampToValueAtTime(
        1200,
        t0 + 0.5
      );

      oscillator.frequency.linearRampToValueAtTime(
        800,
        t0 + 1
      );


      oscillator.start();


      var phase = 0;


      sweepTimer =
        setInterval(function () {

          if (!oscillator || !audioCtx) {
            return;
          }

          phase += 1;

          var now =
            audioCtx.currentTime;

          try {

            if (phase % 2 === 1) {

              oscillator.frequency.cancelScheduledValues(
                now
              );

              oscillator.frequency.setValueAtTime(
                800,
                now
              );

              oscillator.frequency.linearRampToValueAtTime(
                1200,
                now + 0.5
              );

            } else {

              oscillator.frequency.cancelScheduledValues(
                now
              );

              oscillator.frequency.setValueAtTime(
                1200,
                now
              );

              oscillator.frequency.linearRampToValueAtTime(
                800,
                now + 0.5
              );

            }

          } catch (e) {}

        }, 500);


      stopTimer =
        setTimeout(function () {
          stopSiren();
        }, 8000);

    }


    if (audioCtx.state === 'suspended') {

      audioCtx
        .resume()
        .then(startTone)
        .catch(function () {

          alert(
            '請再點一次播放警笛（需解除靜音）'
          );

        });

    } else {

      startTone();

    }

  }


  document.getElementById(
    'btnSiren'
  ).onclick = playSiren;


  document.getElementById(
    'btnCloseAlert'
  ).onclick = closeAlert;


  try {

    if (
      localStorage.getItem(ALERT_ID) ===
      'seen'
    ) {

      var banner =
        document.getElementById('alertBanner');

      if (banner) {
        banner.style.display = 'none';
      }

    }

  } catch (e) {}


  /* =========================================================
     SOS
     
     重要：
     1. 取得登入者
     2. 取得 GPS
     3. 找出群組
     4. 寫入 sos_events
     5. 寫入 messages
     
     messages 是讓群組聊天室即時看到 SOS 的關鍵。
     ========================================================= */

  var sosButton =
    document.getElementById('btnSos');


  async function sendSOS() {

    if (!sosButton) {
      return;
    }


    /* 防止連續狂按 */

    if (
      sosButton.classList.contains('sending')
    ) {
      return;
    }


    /* -----------------------------------------------------
       檢查 Supabase
       ----------------------------------------------------- */

    if (!supabase) {

      alert(
        '目前無法連線到安全團聚伺服器，請稍後再試。'
      );

      return;
    }


    sosButton.classList.add('sending');

    sosButton.textContent =
      '📍 正在取得位置…';


    try {

      /* ---------------------------------------------------
         取得登入狀態
         --------------------------------------------------- */

      var sessionResult =
        await supabase.auth.getSession();


      var session =
        sessionResult.data &&
        sessionResult.data.session;


      if (!session) {

        alert(
          '請先登入安全團聚。'
        );

        sosButton.classList.remove('sending');

        sosButton.textContent =
          '🚨 緊急求助 SOS';

        return;
      }


      var user =
        session.user;


      /* ---------------------------------------------------
         檢查定位
         --------------------------------------------------- */

      if (!navigator.geolocation) {

        alert(
          '此裝置不支援定位功能。'
        );

        sosButton.classList.remove('sending');

        sosButton.textContent =
          '🚨 緊急求助 SOS';

        return;
      }


      /* ---------------------------------------------------
         取得 GPS
         --------------------------------------------------- */

      navigator.geolocation.getCurrentPosition(

        async function (position) {

          try {

            var latitude =
              position.coords.latitude;

            var longitude =
              position.coords.longitude;


            sosButton.textContent =
              '🚨 正在發送 SOS…';


            /* ---------------------------------------------
               使用者名稱
               --------------------------------------------- */

            var displayName =
              (
                user.user_metadata &&
                (
                  user.user_metadata.nickname ||
                  user.user_metadata.username ||
                  user.user_metadata.full_name
                )
              ) ||
              (
                user.email
                  ? user.email.split('@')[0]
                  : '成員'
              );


            /* ---------------------------------------------
               找出使用者加入的群組
               --------------------------------------------- */

            var memberResult =
              await supabase
                .from('group_members')
                .select('group_id')
                .eq(
                  'user_id',
                  user.id
                );


            if (memberResult.error) {
              throw memberResult.error;
            }


            var groupRows =
              memberResult.data || [];


            if (!groupRows.length) {

              alert(
                '你目前沒有加入任何群組，因此無法通知群組成員。'
              );

              sosButton.classList.remove('sending');

              sosButton.textContent =
                '🚨 緊急求助 SOS';

              return;
            }


            /* ---------------------------------------------
               SOS 內容
               --------------------------------------------- */

            var sosMessage =
              '🚨 SOS 緊急求助！\n' +
              displayName +
              ' 正在求救。\n' +
              '📍 緯度：' +
              latitude.toFixed(6) +
              '\n' +
              '📍 經度：' +
              longitude.toFixed(6);


            var successCount = 0;


            /* ---------------------------------------------
               對每一個群組發送
               --------------------------------------------- */

            for (
              var i = 0;
              i < groupRows.length;
              i++
            ) {

              var groupId =
                groupRows[i].group_id;


              /* ===========================================
                 ① 建立 SOS EVENT
                 
                 這是 SOS 專用紀錄。
                 =========================================== */

              var eventResult =
                await supabase
                  .from('sos_events')
                  .insert({

                    room_id:
                      String(groupId),

                    user_id:
                      user.id,

                    display_name:
                      displayName,

                    lat:
                      latitude,

                    lng:
                      longitude,

                    message:
                      sosMessage

                  })
                  .select()
                  .single();


              if (eventResult.error) {

                console.error(
                  'sos_events 寫入失敗：',
                  eventResult.error
                );

                continue;
              }


              /* ===========================================
                 ② 建立群組聊天訊息
                 
                 這是非常重要的。
                 
                 room.html 目前監聽 messages，
                 所以 SOS 必須同時進 messages。
                 =========================================== */

              var messageResult =
                await supabase
                  .from('messages')
                  .insert({

                    room_id:
                      String(groupId),

                    user_id:
                      user.id,

                    sender_name:
                      displayName,

                    kind:
                      'sos',

                    body:
                      sosMessage,

                    is_all:
                      true

                  });


              if (messageResult.error) {

                console.error(
                  'messages SOS 寫入失敗：',
                  messageResult.error
                );

                continue;
              }


              successCount++;

            }


            /* ---------------------------------------------
               發送結果
               --------------------------------------------- */

            if (successCount > 0) {

              alert(
                '🚨 SOS 已發送！\n\n' +
                '已通知 ' +
                successCount +
                ' 個群組。\n\n' +
                '群組成員可以在聊天中看到你的求救訊息。'
              );

            } else {

              alert(
                'SOS 發送失敗。\n\n' +
                '請檢查網路連線及 Supabase 權限設定。'
              );

            }


            sosButton.classList.remove(
              'sending'
            );

            sosButton.textContent =
              '🚨 緊急求助 SOS';


          } catch (e) {

            console.error(
              'SOS 發送錯誤：',
              e
            );

            alert(
              'SOS 發送發生錯誤：\n' +
              (
                e && e.message
                  ? e.message
                  : e
              )
            );

            sosButton.classList.remove(
              'sending'
            );

            sosButton.textContent =
              '🚨 緊急求助 SOS';

          }

        },


        /* ---------------------------------------------
           GPS 失敗
           --------------------------------------------- */

        function (error) {

          console.error(
            'GPS 定位失敗：',
            error
          );


          var message =
            '無法取得你的位置。';


          if (error.code === 1) {

            message +=
              '\n請允許瀏覽器使用定位功能。';

          } else if (error.code === 2) {

            message +=
              '\n目前無法取得 GPS 位置。';

          } else if (error.code === 3) {

            message +=
              '\n定位逾時，請再試一次。';

          }


          alert(message);


          sosButton.classList.remove(
            'sending'
          );

          sosButton.textContent =
            '🚨 緊急求助 SOS';

        },


        /* ---------------------------------------------
           GPS 設定
           --------------------------------------------- */

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );


    } catch (e) {

      console.error(
        'SOS ERROR:',
        e
      );

      alert(
        'SOS 發送發生錯誤：\n' +
        (
          e && e.message
            ? e.message
            : e
        )
      );

      sosButton.classList.remove(
        'sending'
      );

      sosButton.textContent =
        '🚨 緊急求助 SOS';

    }

  }


  sosButton.onclick =
    sendSOS;


})();

</script>


<script src="call-notify.js"></script>

</body>
