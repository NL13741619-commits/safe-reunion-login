<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚 - 主畫面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F5F7FA;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    /* 頂部 */
    .header {
      background: #1E3A5F;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #4A6FA5;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    /* 內容區 */
    .content { padding: 20px 16px; }
    .section-title {
      font-size: 15px; font-weight: 600; color: #1E3A5F;
      margin-bottom: 12px;
    }
    /* 家庭成員卡片 */
    .member-card {
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .member-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #E8EEF5;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .member-info { flex: 1; }
    .member-name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .member-status { font-size: 13px; color: #666; margin-top: 2px; }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-left: 8px;
    }
    .status-safe { background: #43A047; }
    .status-unknown { background: #FB8C00; }
    .status-danger { background: #E53935; }
    /* SOS 按鈕 */
    .sos-area {
      margin: 28px 0;
      text-align: center;
    }
    .sos-btn {
      width: 160px; height: 160px;
      border-radius: 50%;
      background: #E53935;
      color: white;
      border: none;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(229, 57, 53, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
    }
    .sos-btn span { font-size: 13px; font-weight: 500; margin-top: 4px; opacity: 0.9; }
    /* 快捷功能 */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 8px;
    }
    .quick-item {
      background: white;
      border-radius: 14px;
      padding: 16px 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .quick-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: #E8EEF5;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px;
      font-size: 20px;
    }
    .quick-label { font-size: 12px; color: #333; font-weight: 500; }
    /* 底部導覽 */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 20px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 11px;
    }
    .nav-item.active { color: #1E3A5F; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <!-- 頂部 -->
  <div class="header">
    <h1>安全團聚</h1>
    <div class="header-right">
      <div style="font-size:20px">🔔</div>
      <div class="avatar">豪</div>
    </div>
  </div>

  <div class="content">
    <!-- 家庭成員 -->
    <div class="section-title">家庭成員</div>
    
    <div class="member-card">
      <div class="member-avatar">👨</div>
      <div class="member-info">
        <div class="member-name">爸爸</div>
        <div class="member-status">最後回報 10 分鐘前</div>
      </div>
      <div class="status-dot status-safe"></div>
    </div>

    <div class="member-card">
      <div class="member-avatar">👩</div>
      <div class="member-info">
        <div class="member-name">媽媽</div>
        <div class="member-status">最後回報 25 分鐘前</div>
      </div>
      <div class="status-dot status-safe"></div>
    </div>

    <div class="member-card">
      <div class="member-avatar">👧</div>
      <div class="member-info">
        <div class="member-name">小美</div>
        <div class="member-status">尚未回報</div>
      </div>
      <div class="status-dot status-unknown"></div>
    </div>

    <!-- SOS -->
    <div class="sos-area">
      <button class="sos-btn" onclick="alert('SOS 功能之後會接上真實後端')">
        SOS
        <span>緊急求助</span>
      </button>
    </div>

    <!-- 快捷功能 -->
    <div class="section-title">快捷功能</div>
    <div class="quick-grid">
      <div class="quick-item">
        <div class="quick-icon">🗺️</div>
        <div class="quick-label">地圖</div>
      </div>
      <div class="quick-item">
        <div class="quick-icon">💬</div>
        <div class="quick-label">聊天</div>
      </div>
      <div class="quick-item">
        <div class="quick-icon">📦</div>
        <div class="quick-label">物資</div>
      </div>
      <div class="quick-item">
        <div class="quick-icon">📍</div>
        <div class="quick-label">集合點</div>
      </div>
    </div>
  </div>

  <!-- 底部導覽 -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🏠</div>
      首頁
    </div>
    <div class="nav-item">
      <div class="nav-icon">🗺️</div>
      地圖
    </div>
    <div class="nav-item">
      <div class="nav-icon">💬</div>
      聊天
    </div>
    <div class="nav-item">
      <div class="nav-icon">⚙️</div>
      設定
    </div>
  </div>
</body>
</html>
