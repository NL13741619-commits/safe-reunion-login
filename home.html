  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }

    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 20px;
    }

    .header-action {
      cursor: pointer;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      text-decoration: none;
      color: white;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .header-action:active {
      background: rgba(255,255,255,0.18);
      transform: scale(0.94);
    }

    /* =====================================================
   左上角固定首頁入口
===================================================== */

.home-header-btn {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  text-decoration: none;
  color: white;

  font-size: 20px;

  user-select: none;
  -webkit-tap-highlight-color: transparent;

  flex-shrink: 0;
}

.home-header-btn:active {
  background: rgba(255,255,255,0.18);
  transform: scale(0.94);
}
    
    .alert-banner {
      background: #fdecea;
      border-left: 5px solid #e74c3c;
      margin: 12px 12px 0;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }

    .alert-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .alert-content {
      flex: 1;
      padding-right: 24px;
    }

    .alert-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .alert-text {
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }

    .alert-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .alert-link {
      font-size: 13px;
      color: #06C755;
      font-weight: 600;
      text-decoration: none;
    }

    .siren-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .alert-close {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 18px;
      color: #999;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 16px 12px;
    }

    .empty-state {
      background: white;
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #06C755;
      color: white;
    }

    .btn-outline {
      background: white;
      color: #06C755;
      border: 1px solid #06C755;
      margin-left: 8px;
    }

    /* SOS */
    .sos-bar {
      background: #e53935;
      color: white;
      border-radius: 12px;
      padding: 17px 16px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 16px;
      box-shadow: 0 3px 10px rgba(229,57,53,0.25);
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, opacity 0.1s;
    }

    .sos-bar:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .sos-bar.sending {
      background: #b71c1c;
      pointer-events: none;
    }

    /* SOS 群組選擇 */
    .sos-group-panel {
      display: none;
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .sos-group-panel.show {
      display: block;
    }

    .sos-group-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sos-group-desc {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .sos-group-select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      font-size: 15px;
      color: #222;
      outline: none;
    }

    .sos-group-select:focus {
      border-color: #06C755;
    }

    .sos-group-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .sos-group-actions button {
      flex: 1;
      margin: 0;
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .quick-item {
      background: white;
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .quick-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      font-size: 20px;
    }

    .quick-label {
      font-size: 12px;
      color: #555;
    }

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      z-index: 30;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #888;
      text-decoration: none;
    }

    .tab.on {
      color: #06C755;
      font-weight: 600;
    }

    .tab .ico {
      font-size: 20px;
      line-height: 1.2;
    }
        /* =====================================================
       天氣卡片
    ====================================================== */

    .weather-card {
      background: white;
      border-radius: 14px;
      margin-bottom: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);

    .weather-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;

    .weather-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #222;

    .weather-location {

      margin-top: 3px;

    .weather-update {

      color: #999;
      text-align: right;

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .weather-current {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .weather-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;

    .weather-temp {

      font-weight: 700;
      color: #222;
      line-height: 1;

    .weather-description {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;

    .weather-detail {

      border-radius: 10px;
      padding: 10px;

    .weather-detail-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }

    .weather-detail-value {
      font-size: 14px;
      font-weight: 700;
      color: #333;
    }

    .weather-loading {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 12px 0;
    }

    .weather-error {
      text-align: center;
      color: #999;
      font-size: 13px;
      line-height: 1.5;
      padding: 8px 0;
    }

.weather-location-picker {

.weather-location-btn {

.weather-location-btn:active {

}

.weather-location-arrow {

  color: #777;
}


/* =====================================================
   地點選擇面板
===================================================== */

.weather-location-panel {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #eee;
}

.weather-location-panel.show {
  display: block;
}

.weather-location-search {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  color: #222;
  font-size: 14px;
  outline: none;
}

.weather-location-search:focus {
  border-color: #06C755;
  box-shadow: 0 0 0 2px rgba(6,199,85,0.08);
}

.weather-location-results {
  margin-top: 8px;
  max-height: 220px;
  overflow-y: auto;
  border-radius: 10px;
}

.weather-location-result {
  width: 100%;
  border: none;
  background: #f7f7f7;
  padding: 11px 12px;
  text-align: left;
  font-size: 13px;
  color: #333;
  cursor: pointer;
  border-bottom: 1px solid #eee;
}

.weather-location-result:first-child {
  border-radius: 10px 10px 0 0;
}

.weather-location-result:last-child {
  border-bottom: none;
  border-radius: 0 0 10px 10px;
}

.weather-location-result:active {
  background: #e8f5e9;
}

.weather-location-empty {
  text-align: center;
  padding: 12px;
  color: #999;
  font-size: 12px;
}
  </style>

var audioCtx = null;
var oscillator = null;
var gainNode = null;
var isPlaying = false;
var stopTimer = null;
var sweepTimer = null;


/* =========================================================
   停止警笛
========================================================= */

function stopSiren() {

  if (stopTimer) {
    clearTimeout(stopTimer);
    stopTimer = null;
  }

  if (sweepTimer) {
    clearInterval(sweepTimer);
    sweepTimer = null;
  }

  if (oscillator) {

    try {
      oscillator.stop();
    } catch (e) {}

    oscillator = null;
  }

  isPlaying = false;

  var btn =
    document.getElementById('btnSiren');

  if (btn) {
    btn.textContent = '▶ 播放警笛';
  }
}


/* =========================================================
   播放警笛
========================================================= */

function playSiren() {

  if (isPlaying) {
    stopSiren();
    return;
  }

  try {

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  } catch (e) {

    alert('此裝置不支援網頁音效');
    return;
  }


  function startTone() {

    isPlaying = true;

    var btn =
      document.getElementById('btnSiren');

    if (btn) {
      btn.textContent = '■ 停止警笛';
    }


    oscillator =
      audioCtx.createOscillator();

    gainNode =
      audioCtx.createGain();


    oscillator.type =
      'sawtooth';


    gainNode.gain.setValueAtTime(
      0.12,
      audioCtx.currentTime
    );


    oscillator.connect(
      gainNode
    );

    gainNode.connect(
      audioCtx.destination
    );


    var t0 =
      audioCtx.currentTime;


    oscillator.frequency.setValueAtTime(
      800,
      t0
    );

    oscillator.frequency.linearRampToValueAtTime(
      1200,
      t0 + 0.5
    );

    oscillator.frequency.linearRampToValueAtTime(
      800,
      t0 + 1
    );


    oscillator.start();


    var phase = 0;


    sweepTimer =
      setInterval(
        function () {

          if (
            !oscillator ||
            !audioCtx
          ) {
            return;
          }


          phase += 1;


          var now =
            audioCtx.currentTime;


          try {

            if (
              phase % 2 === 1
            ) {

              oscillator.frequency.cancelScheduledValues(
                now
              );

              oscillator.frequency.setValueAtTime(
                800,
                now
              );

              oscillator.frequency.linearRampToValueAtTime(
                1200,
                now + 0.5
              );

            } else {

              oscillator.frequency.cancelScheduledValues(
                now
              );

              oscillator.frequency.setValueAtTime(
                1200,
                now
              );

              oscillator.frequency.linearRampToValueAtTime(
                800,
                now + 0.5
              );

            }

          } catch (e) {}

        },
        500
      );


    stopTimer =
      setTimeout(
        function () {

          stopSiren();

        },
        8000
      );

  }


  if (
    audioCtx.state ===
    'suspended'
  ) {

    audioCtx
      .resume()
      .then(startTone)
      .catch(
        function () {

          alert(
            '請再點一次播放警笛（需解除靜音）'
          );

        }
      );

  } else {

    startTone();

  }

}

async function loadCurrentAlert() {

      'Supabase 尚未初始化，無法讀取 alerts'
    );
    return;
  }


  try {

    var now =
      new Date().toISOString();


    var result =
      await supabase
        .from('alerts')
        .select(
          'id,title,message,region,start_at,end_at,detail_url,siren_enabled,is_active'
        )
        .eq(
          'is_active',
          true
        )
        .lte(
          'start_at',
          now
        )
        .gte(
          'end_at',
          now
        )
        .order(
          'start_at',
          {
            ascending: false
          }
        )
        .limit(1);


    if (result.error) {

      console.error(
        '讀取 alerts 失敗：',
        result.error
      );

      return;
    }


    var alerts =
      result.data || [];


    var banner =
      document.getElementById(
        'alertBanner'
      );


    if (!banner) {
      return;
    }


    /* 沒有有效警訊 */

    if (!alerts.length) {

      banner.style.display =
        'none';

      return;
    }


    var alertData =
      alerts[0];


    /* =====================================================
       標題
    ===================================================== */

    var title =
      document.getElementById(
        'alertTitle'
      );

    if (title) {

      title.textContent =
        alertData.title ||
        '警訊通知';
    }


    /* =====================================================
       內容
    ===================================================== */

    var text =
      document.getElementById(
        'alertText'
      );

    if (text) {

      var regionText =
        alertData.region
          ? '【' +
            alertData.region +
            '】'
          : '';


      text.textContent =
        regionText +
        ' ' +
        (
          alertData.message ||
          ''
        );
    }


    /* =====================================================
       詳細資訊
    ===================================================== */

    var link =
      document.getElementById(
        'alertLink'
      );

    if (link) {

      if (alertData.detail_url) {

        link.href =
          alertData.detail_url;

        link.style.display =
          'inline';

      } else {

        link.style.display =
          'none';
      }
    }


    /* =====================================================
       警笛
    ===================================================== */

    var sirenButton =
      document.getElementById(
        'btnSiren'
      );

    if (sirenButton) {

      if (
        alertData.siren_enabled
      ) {

        sirenButton.style.display =
          'inline-block';

        sirenButton.onclick =
          playSiren;

      } else {

        sirenButton.style.display =
          'none';
      }
    }


    /* =====================================================
       關閉按鈕
    ===================================================== */

    var closeButton =
      document.getElementById(
        'btnCloseAlert'
      );

    if (closeButton) {

      closeButton.onclick =
        closeAlert;
    }


    /* =====================================================
       顯示警訊
    ===================================================== */

    banner.style.display =
      'flex';


  } catch (e) {

    console.error(
      '載入目前警訊失敗：',
      e
    );

  }

}

  /* =========================================================
     取得目前使用者的群組
     
     注意：
     不寫死任何 group_id。
     
     只根據 group_members：
     user_id = 目前登入者
     
     找到的群組就是這個使用者實際加入的群組。
  ========================================================= */

  async function loadMySOSGroups() {

    if (!supabase) {

      throw new Error(
        'Supabase 尚未初始化'
      );

    }


    var sessionResult =
      await supabase.auth.getSession();


    var session =
      sessionResult.data &&
      sessionResult.data.session;


    if (!session) {

      throw new Error(
        '請先登入安全團聚。'
      );

    }


    var user =
      session.user;


    var memberResult =
      await supabase
        .from('group_members')
        .select('group_id')
        .eq(
          'user_id',
          user.id
        );


    if (memberResult.error) {

      throw memberResult.error;

    }


    var rows =
      memberResult.data || [];


    if (!rows.length) {

      return [];

    }


    /*
     * 取得群組基本資料
     *
     * 這裡嘗試讀取常見欄位：
     * id / name
     *
     * 如果你的 groups 表實際欄位就是這兩個，
     * 就會直接取得群組名稱。
     */

    var groupIds =
      rows
        .map(
          function(row) {
            return row.group_id;
          }
        )
        .filter(
          function(id) {
            return !!id;
          }
        );


    if (!groupIds.length) {

      return [];

    }


    var groupResult =
      await supabase
        .from('groups')
        .select('id,name')
        .in(
          'id',
          groupIds
        );


    /*
     * 如果 groups 查詢失敗，
     * 仍然保留 group_id，
     * 不讓 SOS 整個不能使用。
     */

    if (groupResult.error) {

      console.warn(
        '群組名稱讀取失敗：',
        groupResult.error
      );


      return groupIds.map(
        function(groupId) {

          return {

            id:
              groupId,

            name:
              '群組 ' +
              String(groupId).slice(0,8)

          };

        }
      );

    }


    var groupRows =
      groupResult.data || [];


    return groupIds.map(
      function(groupId) {

        var group =
          groupRows.find(
            function(item) {

              return String(item.id) ===
                String(groupId);

            }
          );


        return {

          id:
            groupId,

          name:
            group &&
            group.name
              ? group.name
              : '群組 ' +
                String(groupId).slice(0,8)

        };

      }
    );

  }

  /* =========================================================
     確認發送 SOS

  async function confirmSendSOS() {

    if (!sosGroupSelect) {
      return;
    }


    var selectedGroupId =
      sosGroupSelect.value;


    if (!selectedGroupId) {

      alert(
        '請先選擇要發送 SOS 的群組。'

    if (
      sosButton.classList.contains(

    sosButton.classList.add(

    sosButton.textContent =

    try {

      /* ---------------------------------------------------
         取得登入狀態

      var sessionResult =
        await supabase.auth.getSession();


      var session =
        sessionResult.data &&
        sessionResult.data.session;


      if (!session) {

        throw new Error(
          '請先登入安全團聚。'
        );

      }


      var user =
        session.user;


      /* ---------------------------------------------------
         檢查定位

      if (!navigator.geolocation) {

        throw new Error(
          '此裝置不支援定位功能。'
        );

      }


      /* ---------------------------------------------------
         取得 GPS
      --------------------------------------------------- */

      navigator.geolocation.getCurrentPosition(

        async function(position) {

          try {

            var latitude =
              position.coords.latitude;


            var longitude =
              position.coords.longitude;


            sosButton.textContent =
              '🚨 正在發送 SOS…';


            /* ---------------------------------------------
               使用者名稱
            --------------------------------------------- */

            var displayName =
              (
                user.user_metadata &&
                (
                  user.user_metadata.nickname ||
                  user.user_metadata.username ||
                  user.user_metadata.full_name
                )
              ) ||
              (
                user.email
                  ? user.email.split('@')[0]
                  : '成員'
              );


            /* ---------------------------------------------
               SOS 內容
            --------------------------------------------- */

            var sosMessage =
              '🚨 SOS 緊急求助！\n' +
              displayName +
              ' 正在求救。\n' +
              '📍 緯度：' +
              latitude.toFixed(6) +
              '\n' +
              '📍 經度：' +
              longitude.toFixed(6);


            /* =============================================
               只建立「選定群組」的 SOS EVENT
            ============================================= */

            var eventResult =
              await supabase
                .from('sos_events')
                .insert({

                  room_id:
                    String(
                      selectedGroupId
                    ),

                  user_id:
                    user.id,

                  display_name:
                    displayName,

                  lat:
                    latitude,

                  lng:
                    longitude,

                  message:
                    sosMessage

                })
                .select()
                .single();


            if (eventResult.error) {

              throw eventResult.error;

            }


            /* =============================================
               只建立「選定群組」的聊天 SOS 訊息
            ============================================= */

            var messageResult =
              await supabase
                .from('messages')
                .insert({

                  room_id:
                    String(
                      selectedGroupId
                    ),

                  user_id:
                    user.id,

                  sender_name:
                    displayName,

                  kind:
                    'sos',

                  body:
                    sosMessage,

                  is_all:
                    true

                });


            if (messageResult.error) {

              throw messageResult.error;

            }


            /* =============================================
               找到選擇的群組名稱
            ============================================= */

            var selectedOption =
              sosGroupSelect.options[
                sosGroupSelect.selectedIndex
              ];


            var selectedGroupName =
              selectedOption
                ? selectedOption.textContent
                : '指定群組';


            alert(
              '🚨 SOS 已發送！\n\n' +
              '發送群組：' +
              selectedGroupName +
              '\n\n' +
              '群組成員可以在聊天中看到你的求救訊息。'
            );


            /* 關閉選擇器 */

            sosGroupPanel.classList.remove(
              'show'
            );


            sosGroupSelect.value =
              '';


            sosButton.classList.remove(
              'sending'
            );


            sosButton.textContent =
              '🚨 緊急求助 SOS';


          } catch (e) {

            console.error(
              'SOS 發送錯誤：',
              e
            );


            alert(
              'SOS 發送發生錯誤：\n' +
              (
                e && e.message
                  ? e.message
                  : e
              )
            );


            sosButton.classList.remove(
              'sending'
            );


            sosButton.textContent =
              '🚨 緊急求助 SOS';

          }

        },


        /* ---------------------------------------------
           GPS 失敗
        --------------------------------------------- */

        function(error) {

          console.error(
            'GPS 定位失敗：',
            error
          );


          var message =
            '無法取得你的位置。';


          if (
            error.code === 1
          ) {

            message +=
              '\n請允許瀏覽器使用定位功能。';

          } else if (
            error.code === 2
          ) {

            message +=
              '\n目前無法取得 GPS 位置。';

          } else if (
            error.code === 3
          ) {

            message +=
              '\n定位逾時，請再試一次。';

          }


          alert(message);


          sosButton.classList.remove(
            'sending'
          );


          sosButton.textContent =
            '🚨 緊急求助 SOS';

        },


        /* ---------------------------------------------
           GPS 設定
        --------------------------------------------- */

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );


    } catch (e) {

      console.error(
        'SOS ERROR:',
        e
      );


      alert(
        'SOS 發送發生錯誤：\n' +
        (
          e && e.message
            ? e.message
            : e
        )
      );


      sosButton.classList.remove(
        'sending'
      );


      sosButton.textContent =
        '🚨 緊急求助 SOS';

    }

  }


  if (btnConfirmSos) {

    btnConfirmSos.onclick =
      confirmSendSOS;

  }

          '</div>';


        searchTimer =
          setTimeout(
            function () {

              searchWeatherCities(
                keyword
              );

            },
            400
          );

      }
    );

  }


  /* =====================================================
     全球城市搜尋
  ===================================================== */

  async function searchWeatherCities(
    keyword
  ) {

    if (!locationResults) {
      return;
    }


    try {

      var url =
        'https://nominatim.openstreetmap.org/search' +
        '?format=jsonv2' +
        '&q=' +
        encodeURIComponent(
          keyword
        ) +
        '&limit=8' +
        '&addressdetails=1' +
        '&accept-language=zh-TW';


      var response =
        await fetch(
          url,
          {
            headers: {
              'Accept':
                'application/json'
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          '城市搜尋失敗'
        );

      }


      var results =
        await response.json();


      if (!results.length) {

        locationResults.innerHTML =
          '<div class="weather-location-empty">' +
          '找不到這個地點' +
          '</div>';

        return;

      }


      locationResults.innerHTML =
        '';


      results.forEach(
        function (place) {

          var button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          button.className =
            'weather-location-result';


          button.textContent =
            place.display_name;


          button.addEventListener(
            'click',
            function () {

              selectWeatherLocation(
                place
              );

            }
          );


          locationResults.appendChild(
            button
          );

        }
      );


    } catch (error) {

      console.error(
        '城市搜尋失敗：',
        error
      );


      locationResults.innerHTML =
        '<div class="weather-location-empty">' +
        '城市搜尋失敗，請稍後再試' +
        '</div>';

    }

  }


  /* =====================================================
     選擇城市
     ===================================================== */

  function selectWeatherLocation(
  place
) {

  var address =
    place.address ||
    {};

  var cityName =
    address.city ||
    address.town ||
    address.municipality ||
    address.county ||
    address.state ||
    place.name ||
    place.display_name;

  var latitude =
    parseFloat(place.lat);

  var longitude =
    parseFloat(place.lon);


  /* =====================================================
     更新目前顯示的城市
  ===================================================== */

  var locationElement =
    document.getElementById(
      'weatherLocation'
    );

  if (locationElement) {

    locationElement.textContent =
      cityName;

  }


  /* =====================================================
     關閉地點選擇器
  ===================================================== */

  if (locationPanel) {

    locationPanel.classList.remove(
      'show'
    );

  }

  if (locationSearch) {

    locationSearch.value =
      '';

  }


  /* =====================================================
     顯示載入狀態
  ===================================================== */

  var statusElement =
    document.getElementById(
      'weatherStatus'
    );

  var descriptionElement =
    document.getElementById(
      'weatherDescription'
    );

  var updatedElement =
    document.getElementById(
      'weatherUpdated'
    );

  if (statusElement) {

    statusElement.textContent =
      '載入天氣中…';

  }

  if (descriptionElement) {

    descriptionElement.textContent =
      '正在取得 ' +
      cityName +
      ' 的天氣資料…';

  }

  if (updatedElement) {

    updatedElement.textContent =
      '更新中…';

  }


  /* =====================================================
     清除搜尋結果
  ===================================================== */

  if (locationResults) {

    locationResults.innerHTML =
      '<div class="weather-location-empty">' +
      '已選擇：' +
      cityName +
      '</div>';

  }


  /* =====================================================
     檢查經緯度
  ===================================================== */

  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    if (statusElement) {

      statusElement.textContent =
        '地點資料錯誤';

    }

    console.error(
      '天氣地點沒有有效經緯度：',
      place
    );

    return;

  }


  console.log(
    '選擇天氣地點：',
    {
      name:
        cityName,

      latitude:
        latitude,

      longitude:
        longitude
    }
  );


  /* =====================================================
     取得這個城市的天氣
  ===================================================== */

  loadWeatherByLocation(
    cityName,
    latitude,
    longitude
  );

}
  
})();

/* =========================================================
   天氣代碼轉中文
========================================================= */

function getWeatherDescription(code) {

  if (code === 0) {
    return {
      text: '晴天',
      icon: '☀️'
    };
  }

  if (code === 1 || code === 2) {
    return {
      text: '晴時多雲',
      icon: '🌤️'
    };
  }

  if (code === 3) {
    return {
      text: '陰天',
      icon: '☁️'
    };
  }

  if (
    code === 45 ||
    code === 48
  ) {
    return {
      text: '有霧',
      icon: '🌫️'
    };
  }

  if (
    code === 51 ||
    code === 53 ||
    code === 55
  ) {
    return {
      text: '毛毛雨',
      icon: '🌦️'
    };
  }

  if (
    code === 56 ||
    code === 57
  ) {
    return {
      text: '凍毛毛雨',
      icon: '🌧️'
    };
  }

  if (
    code === 61 ||
    code === 63 ||
    code === 65
  ) {
    return {
      text: '下雨',
      icon: '🌧️'
    };
  }

  if (
    code === 66 ||
    code === 67
  ) {
    return {
      text: '凍雨',
      icon: '🌧️'
    };
  }

  if (
    code === 71 ||
    code === 73 ||
    code === 75
  ) {
    return {
      text: '下雪',
      icon: '🌨️'
    };
  }

  if (code === 77) {
    return {
      text: '雪粒',
      icon: '🌨️'
    };
  }

  if (
    code === 80 ||
    code === 81 ||
    code === 82
  ) {
    return {
      text: '陣雨',
      icon: '🌦️'
    };
  }

  if (
    code === 85 ||
    code === 86
  ) {
    return {
      text: '陣雪',
      icon: '🌨️'
    };
  }

  if (
    code === 95
  ) {
    return {
      text: '雷雨',
      icon: '⛈️'
    };
  }

  if (
    code === 96 ||
    code === 99
  ) {
    return {
      text: '雷雨伴冰雹',
      icon: '⛈️'
    };
  }

  return {
    text: '天氣狀況未知',
    icon: '🌤️'
  };

}
async function loadWeatherByLocation(
  cityName,
  latitude,
  longitude
) {

  var statusElement =
    document.getElementById(
      'weatherStatus'
    );

  var tempElement =
    document.getElementById(
      'weatherTemp'
    );

  var maxElement =
    document.getElementById(
      'weatherMax'
    );

  var minElement =
    document.getElementById(
      'weatherMin'
    );

  var rainElement =
    document.getElementById(
      'weatherRain'
    );

  var descriptionElement =
    document.getElementById(
      'weatherDescription'
    );

  var updatedElement =
    document.getElementById(
      'weatherUpdated'
    );

  var iconElement =
    document.getElementById(
      'weatherIcon'
    );


  try {

    if (statusElement) {

      statusElement.textContent =
        '載入中…';

    }


    var url =
      'https://api.open-meteo.com/v1/forecast' +
      '?latitude=' +
      encodeURIComponent(latitude) +
      '&longitude=' +
      encodeURIComponent(longitude) +
      '&current=temperature_2m,weather_code' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&forecast_days=1' +
      '&timezone=auto';


    var response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        '天氣服務回應失敗：' +
        response.status
      );

    }


    var data =
      await response.json();


    var current =
      data.current ||
      {};

    var daily =
      data.daily ||
      {};


    /* =====================================================
       目前溫度
    ===================================================== */

    if (
      tempElement &&
      current.temperature_2m != null
    ) {

      tempElement.textContent =
        current.temperature_2m +
        '°C';

    }


    /* =====================================================
       今日最高溫
    ===================================================== */

    if (
      maxElement &&
      daily.temperature_2m_max &&
      daily.temperature_2m_max[0] != null
    ) {

      maxElement.textContent =
        daily.temperature_2m_max[0] +
        '°C';

    }


    /* =====================================================
       今日最低溫
    ===================================================== */

    if (
      minElement &&
      daily.temperature_2m_min &&
      daily.temperature_2m_min[0] != null
    ) {

      minElement.textContent =
        daily.temperature_2m_min[0] +
        '°C';

    }


    /* =====================================================
       降雨機率
    ===================================================== */

    if (
      rainElement &&
      daily.precipitation_probability_max &&
      daily.precipitation_probability_max[0] != null
    ) {

      rainElement.textContent =
        daily.precipitation_probability_max[0] +
        '%';

    }


    /* =====================================================
       天氣狀況
    ===================================================== */

    var weatherCode =
      current.weather_code;


    var weatherInfo =
      getWeatherDescription(
        weatherCode
      );


    if (descriptionElement) {

      descriptionElement.textContent =
        weatherInfo.text;

    }


    if (iconElement) {

      iconElement.textContent =
        weatherInfo.icon;

    }


    /* =====================================================
       更新時間
    ===================================================== */

    if (updatedElement) {

      updatedElement.textContent =
        '剛剛更新';

    }


    if (statusElement) {

      statusElement.textContent =
        '資料正常';

    }


    /* =====================================================
       保存目前選擇的城市
       下次開啟 Home 可以直接使用
    ===================================================== */

    try {

      localStorage.setItem(
        'safeReunionWeatherLocation',
        JSON.stringify({

          cityName:
            cityName,

          latitude:
            latitude,

          longitude:
            longitude

        })
      );

    } catch (e) {}


  } catch (error) {

    console.error(
      '全球城市天氣讀取失敗：',
      error
    );


    if (statusElement) {

      statusElement.textContent =
        '讀取失敗';

    }

    if (descriptionElement) {

      descriptionElement.textContent =
        '目前無法取得 ' +
        cityName +
        ' 的天氣資料';

    }

    if (updatedElement) {

      updatedElement.textContent =
        '請稍後再試';

    }

  }

}
