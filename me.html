<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚 - 我</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }
    .profile-header {
      background: white;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 64px; height: 64px;
      border-radius: 8px;
      background: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      color: #999;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .profile-id { font-size: 13px; color: #888; }
    .profile-arrow { color: #ccc; font-size: 18px; }

    .menu-group {
      background: white;
      margin-top: 10px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .menu-text { flex: 1; font-size: 16px; }
    .menu-arrow { color: #ccc; font-size: 16px; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 18px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 10px;
      width: 60px;
      text-decoration: none;
    }
    .nav-item.active { color: #06C755; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="profile-header" onclick="alert('之後可編輯個人資料與上傳頭像')">
    <div class="avatar">👤</div>
    <div class="profile-info">
      <div class="profile-name">使用者</div>
      <div class="profile-id">點擊設定暱稱與頭像</div>
    </div>
    <div class="profile-arrow">›</div>
  </div>

  <div class="menu-group">
  <div class="menu-item" onclick="location.href='tools.html'">
    <div class="menu-icon" style="background:#e3f2fd">🛠️</div>
    <div class="menu-text">生活工具</div>
    <div class="menu-arrow">›</div>
  </div>
  <div class="menu-item" onclick="alert('之後會接上')">
    <div class="menu-icon" style="background:#e8f5e9">🛡️</div>
    <div class="menu-text">安全狀態</div>
    <div class="menu-arrow">›</div>
  </div>
  <div class="menu-item" onclick="alert('之後會接上')">
    <div class="menu-icon" style="background:#e3f2fd">📍</div>
    <div class="menu-text">我的位置</div>
    <div class="menu-arrow">›</div>
  </div>
  <div class="menu-item" onclick="alert('之後會接上')">
    <div class="menu-icon" style="background:#fff3e0">📦</div>
    <div class="menu-text">我的物資</div>
    <div class="menu-arrow">›</div>
  </div>
</div>

  <div class="menu-group">
    <div class="menu-item" onclick="alert('之後會接上')">
      <div class="menu-icon" style="background:#f3e5f5">🔔</div>
      <div class="menu-text">通知設定</div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="alert('之後會接上')">
      <div class="menu-icon" style="background:#e0f7fa">🔒</div>
      <div class="menu-text">隱私設定</div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="alert('之後會接上')">
      <div class="menu-icon" style="background:#fce4ec">⚙️</div>
      <div class="menu-text">一般設定</div>
      <div class="menu-arrow">›</div>
    </div>
  </div>

  <div class="menu-group">
    <div class="menu-item" onclick="if(confirm('確定登出？')) location.href='index.html'">
      <div class="menu-icon" style="background:#ffebee">🚪</div>
      <div class="menu-text">登出</div>
      <div class="menu-arrow">›</div>
    </div>
  </div>

<div id="bottomNav" style="position:fixed;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:1px solid #e8e8e8;display:flex;z-index:9999;">

  <a data-page="chat.html" href="chat.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-size:11px;color:#888;">

    <span style="font-size:20px;line-height:22px;">💬</span>

    <span class="navText">聊天</span>

  </a>

  <a data-page="contacts.html" href="contacts.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-size:11px;color:#888;">

    <span style="font-size:20px;line-height:22px;">👥</span>

    <span class="navText">通訊錄</span>

  </a>

  <a data-page="home.html" href="home.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-size:11px;color:#888;">

    <span style="font-size:20px;line-height:22px;">🧭</span>

    <span class="navText">發現</span>

  </a>

  <a data-page="me.html" href="me.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-size:11px;color:#888;">

    <span style="font-size:20px;line-height:22px;">👤</span>

    <span class="navText">我</span>

  </a>

</div>

<script>

(function () {

  var currentPage = location.pathname.split('/').pop();

  if (!currentPage) {

    currentPage = 'home.html';

  }

  var links = document.querySelectorAll('#bottomNav a');

  links.forEach(function (link) {

    if (link.getAttribute('data-page') === currentPage) {

      link.style.color = '#06C755';

      link.style.fontWeight = '600';

      var text = link.querySelector('.navText');

      if (text) {

        text.style.color = '#06C755';

      }

    }

  });

})();

</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="call-notify.js"></script>
</body>
</html>
