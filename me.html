<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚 - 我</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }
    .profile-header {
      background: white;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 64px; height: 64px;
      border-radius: 8px;
      background: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      color: #999;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .profile-id { font-size: 13px; color: #888; }
    .profile-arrow { color: #ccc; font-size: 18px; }

    .menu-group {
      background: white;
      margin-top: 10px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .menu-text { flex: 1; font-size: 16px; }
    .menu-arrow { color: #ccc; font-size: 16px; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 18px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 10px;
      width: 60px;
      text-decoration: none;
    }
    .nav-item.active { color: #06C755; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="profile-header" onclick="alert('之後可編輯個人資料與上傳頭像')">
    <div class="avatar">👤</div>
    <div class="profile-info">
      <div class="profile-name">使用者</div>
      <div class="profile-id">點擊設定暱稱與頭像</div>
    </div>
    <div class="profile-arrow">›</div>
  </div>

  <div class="menu-group">
  <div class="menu-item" onclick="location.href='tools.html'">
    <div class="menu-icon" style="background:#e3f2fd">🛠️</div>
    <div class="menu-text">生活工具</div>
    <div class="menu-arrow">›</div>
  </div>
  <div class="menu-item" onclick="alert('之後會接上')">
    <div class="menu-icon" style="background:#e8f5e9">🛡️</div>
    <div class="menu-text">安全狀態</div>
    <div class="menu-arrow">›</div>
  </div>
  <div class="menu-item" onclick="alert('之後會接上')">
    <div class="menu-icon" style="background:#e3f2fd">📍</div>
    <div class="menu-text">我的位置</div>
    <div class="menu-arrow">›</div>
  </div>
  <div class="menu-item" onclick="alert('之後會接上')">
    <div class="menu-icon" style="background:#fff3e0">📦</div>
    <div class="menu-text">我的物資</div>
    <div class="menu-arrow">›</div>
  </div>
</div>

  <div class="menu-group">
    <div class="menu-item" onclick="alert('之後會接上')">
      <div class="menu-icon" style="background:#f3e5f5">🔔</div>
      <div class="menu-text">通知設定</div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="alert('之後會接上')">
      <div class="menu-icon" style="background:#e0f7fa">🔒</div>
      <div class="menu-text">隱私設定</div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="alert('之後會接上')">
      <div class="menu-icon" style="background:#fce4ec">⚙️</div>
      <div class="menu-text">一般設定</div>
      <div class="menu-arrow">›</div>
    </div>
  </div>

  <div class="menu-group">
    <div class="menu-item" onclick="if(confirm('確定登出？')) location.href='index.html'">
      <div class="menu-icon" style="background:#ffebee">🚪</div>
      <div class="menu-text">登出</div>
      <div class="menu-arrow">›</div>
    </div>
  </div>

  <div class="bottom-nav">
  <a class="nav-item" href="home.html" style="text-decoration:none; color:inherit;">
    <div class="nav-icon">🏠</div>
    首頁
  </a>
  <a class="nav-item" href="chat.html" style="text-decoration:none; color:inherit;">
    <div class="nav-icon">💬</div>
    聊天
  </a>
  <a class="nav-item" href="contacts.html" style="text-decoration:none; color:inherit;">
    <div class="nav-icon">👥</div>
    通訊錄
  </a>
  <a class="nav-item active" href="me.html" style="text-decoration:none; color:inherit;">
    <div class="nav-icon">👤</div>
    我
  </a>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="call-notify.js"></script>
</body>
</html>
