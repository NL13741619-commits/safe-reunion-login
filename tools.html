<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安全團聚 - 工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 70px;
      color: #111;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-back {
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    .content { padding: 16px; }

    .section-title {
      font-size: 14px;
      color: #888;
      margin: 16px 0 10px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .tool-item {
      background: white;
      border-radius: 14px;
      padding: 18px 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-decoration: none;
      color: inherit;
    }
    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 24px;
    }
    .tool-label {
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eaeaea;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 18px;
      z-index: 100;
    }
    .nav-item {
      text-align: center;
      color: #999;
      font-size: 10px;
      width: 60px;
      text-decoration: none;
    }
    .nav-item.active { color: #06C755; }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>
 <div class="header">
  <a class="header-back" href="me.html">‹ 返回</a>
  <h1>生活工具</h1>
  <a class="header-back" href="home.html">🏠 安全團聚</a>
</div>

  <div class="content">
    <div class="section-title">交通與即時資訊</div>
    <div class="grid">
      <a class="tool-item" href="https://www.taoyuan-airport.com/main_ch/flight.jsp" target="_blank">
        <div class="tool-icon">✈️</div>
        <div class="tool-label">飛機航班</div>
      </a>
      <a class="tool-item" href="https://www.thsrc.com.tw/" target="_blank">
        <div class="tool-icon">🚄</div>
        <div class="tool-label">高鐵</div>
      </a>
     <a class="tool-item" href="https://ebus.gov.taipei/" target="_blank" rel="noopener noreferrer">
  <div class="tool-icon">🚌</div>
  <div class="tool-label">公車</div>
</a>
     <a class="tool-item" href="https://www.anjyue.com/" target="_blank" rel="noopener noreferrer">

  <div class="tool-icon">🅿️</div>

  <div class="tool-label">全台停車</div>

</a>
    </div>

    <div class="section-title">天氣與災害</div>
    <div class="grid">
      <a class="tool-item" href="https://www.cwa.gov.tw/" target="_blank">
        <div class="tool-icon">🌤️</div>
        <div class="tool-label">氣象</div>
      </a>
      <a class="tool-item" href="https://scweb.cwa.gov.tw/" target="_blank">
        <div class="tool-icon">🌍</div>
        <div class="tool-label">地震</div>
      </a>
      <a class="tool-item" href="https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html" target="_blank">
        <div class="tool-icon">📡</div>
        <div class="tool-label">雷達回波</div>
      </a>
    </div>

    <div class="section-title">其他</div>
    <div class="grid">
      <a class="tool-item" href="https://www.radio-taiwan.com/" target="_blank">
        <div class="tool-icon">📻</div>
        <div class="tool-label">廣播電台</div>
      </a>
      <a class="tool-item" href="https://gov.tw/KxS" target="_blank">
        <div class="tool-icon">⚠️</div>
        <div class="tool-label">防災警報</div>
      </a>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-item" href="home.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">🏠</div>
      首頁
    </a>
    <a class="nav-item" href="chat.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">💬</div>
      聊天
    </a>
    <a class="nav-item" href="contacts.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">👥</div>
      通訊錄
    </a>
    <a class="nav-item" href="me.html" style="text-decoration:none; color:inherit;">
      <div class="nav-icon">👤</div>
      我
    </a>
  </div>
</body>
</html>
