<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>通話 - 安全團聚</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    body {
      position: relative;
    }

    #remoteVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #1a1a1a;
      z-index: 1;
    }

    #localVideo {
      position: absolute;
      top: 56px;
      right: 12px;
      width: 100px;
      height: 140px;
      border-radius: 12px;
      object-fit: cover;
      transform: scaleX(-1);
      border: 2px solid rgba(255,255,255,0.55);
      background: #333;
      z-index: 10;
    }

    #audioBg {
      position: absolute;
      inset: 0;
      z-index: 2;

      display: none;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      gap: 12px;

      background:
        linear-gradient(
          160deg,
          #1b5e20,
          #0d47a1
        );
    }

    .top-bar {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      z-index: 20;

      padding:
        48px
        16px
        18px;

      text-align: center;

      background:
        linear-gradient(
          rgba(0,0,0,0.65),
          rgba(0,0,0,0)
        );
    }

    .top-name {
      font-size: 17px;
      font-weight: 600;
    }

    .top-status {
      margin-top: 6px;

      font-size: 13px;

      opacity: 0.95;

      min-height: 18px;
    }

    .controls {
      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      z-index: 20;

      padding:
        16px
        12px
        36px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;

      flex-wrap: wrap;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,0.82)
        );
    }

    .ctrl {
      min-width: 54px;
      height: 54px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.22);

      color: #fff;

      font-size: 12px;

      font-weight: 600;

      padding: 0 8px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .ctrl:active {
      transform: scale(0.95);
    }

    .ctrl.off {
      background: #e53935;
    }

    .ctrl.hangup {
      width: 58px;
      height: 58px;

      background: #e53935;
    }

    .ctrl.accept {
      width: 58px;
      height: 58px;

      background: #06C755;
    }

    #incomingPanel {
      display: none;

      position: absolute;

      inset: 0;

      z-index: 30;

      background:
        rgba(0,0,0,0.90);

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 16px;
    }

    #incomingPanel.show {
      display: flex;
    }

    #incomingPanel .big {
      font-size: 24px;
      font-weight: 700;
    }

    #incomingSub {
      font-size: 15px;
      opacity: 0.9;
    }

    #connectingPanel {
      position: absolute;

      inset: 0;

      z-index: 25;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 12px;

      background:
        rgba(0,0,0,0.55);

      pointer-events: none;
    }

    #connectingPanel.show {
      display: flex;
    }

    .loading-circle {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,0.25);

      border-top-color: #fff;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #errorPanel {
      position: absolute;

      left: 12px;
      right: 12px;

      top: 110px;

      z-index: 40;

      display: none;

      padding: 12px 14px;

      border-radius: 12px;

      background:
        rgba(180,0,0,0.88);

      font-size: 13px;

      line-height: 1.5;

      text-align: center;
    }

    #errorPanel.show {
      display: block;
    }
  </style>
</head>

<body>

  <!-- 遠端影像 -->
  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>


  <!-- 語音背景 -->
  <div id="audioBg">
    <div style="font-size:64px">📞</div>

    <div
      style="
        font-size:18px;
        font-weight:600;
      "
    >
      語音通話
    </div>
  </div>


  <!-- 本機影像 -->
  <video
    id="localVideo"
    autoplay
    playsinline
    muted
  ></video>


  <!-- 上方資訊 -->
  <div class="top-bar">

    <div
      class="top-name"
      id="callName"
    >
      通話
    </div>

    <div
      class="top-status"
      id="callStatus"
    >
      正在啟動通話…
    </div>

  </div>


  <!-- 連線中 -->
  <div id="connectingPanel">

    <div class="loading-circle"></div>

    <div id="connectingText">
      正在建立安全連線…
    </div>

  </div>


  <!-- 錯誤 -->
  <div
    id="errorPanel"
  ></div>


  <!-- 來電 -->
  <div id="incomingPanel">

    <div
      class="big"
      id="incomingTitle"
    >
      來電
    </div>

    <div id="incomingSub">
      邀請你通話
    </div>

    <div
      style="
        display:flex;
        gap:24px;
        margin-top:20px;
      "
    >

      <button
        class="ctrl hangup"
        type="button"
        id="btnReject"
      >
        拒接
      </button>

      <button
        class="ctrl accept"
        type="button"
        id="btnAccept"
      >
        接聽
      </button>

    </div>

  </div>


  <!-- 控制列 -->
  <div
    class="controls"
    id="controls"
  >

    <button
      class="ctrl"
      id="btnMic"
      type="button"
    >
      麥
    </button>

    <button
      class="ctrl"
      id="btnCam"
      type="button"
    >
      鏡頭
    </button>

    <button
      class="ctrl hangup"
      id="btnHang"
      type="button"
    >
      掛斷
    </button>

  </div>


  <script>
  (function () {

    "use strict";


    /* =========================================================
       Supabase
    ========================================================= */

    var SUPABASE_URL =
      "https://perfsipperncvjocznhl.supabase.co";


    /*
     * 這裡使用你目前 Supabase 顯示的 Publishable Key。
     *
     * 不放 Metered TURN 密碼。
     */

    var SUPABASE_KEY =
      "sb_publishable_qpqAwj49L6HcWqWTnNsTxw_oBEauWBA";


    /* =========================================================
       URL 參數
    ========================================================= */

    var params =
      new URLSearchParams(
        window.location.search
      );


    var mode =
      params.get("mode") || "video";


    var toUser =
      params.get("to") || "";


    var name =
      params.get("name")
        ? decodeURIComponent(
            params.get("name")
          )
        : "通話";


    document
      .getElementById("callName")
      .textContent = name;


    /* =========================================================
       全域狀態
    ========================================================= */

    var supabase = null;

    var me = null;

    var pc = null;

    var localStream = null;

    var callRowId = null;

    var isCaller = false;

    var micOn = true;

    var camOn = true;

    var ringTimer = null;

    var audioCtx = null;

    var pollTimer = null;

    var incomingTimer = null;

    var channel = null;

    var incomingChannel = null;

    var shuttingDown = false;

    var remoteDescriptionSet = false;

    var answerApplied = false;

    var offerApplied = false;

    var iceGatheringFinished = false;


    /* =========================================================
       UI 狀態
    ========================================================= */

    function setStatus(text) {

      var el =
        document.getElementById(
          "callStatus"
        );

      if (el) {
        el.textContent = text;
      }
    }


    function showConnecting(text) {

      var panel =
        document.getElementById(
          "connectingPanel"
        );

      var label =
        document.getElementById(
          "connectingText"
        );

      if (label) {
        label.textContent =
          text || "正在建立安全連線…";
      }

      if (panel) {
        panel.classList.add("show");
      }
    }


    function hideConnecting() {

      var panel =
        document.getElementById(
          "connectingPanel"
        );

      if (panel) {
        panel.classList.remove("show");
      }
    }


    function showError(text) {

      var panel =
        document.getElementById(
          "errorPanel"
        );

      if (!panel) {
        return;
      }

      panel.textContent = text;

      panel.classList.add("show");
    }


    function hideError() {

      var panel =
        document.getElementById(
          "errorPanel"
        );

      if (panel) {
        panel.classList.remove("show");
      }
    }


    /* =========================================================
       音效
    ========================================================= */

    function ensureAudio() {

      try {

        if (!audioCtx) {

          var AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContext) {
            return null;
          }

          audioCtx =
            new AudioContext();
        }

        if (
          audioCtx.state ===
          "suspended"
        ) {

          audioCtx.resume()
            .catch(function () {});
        }

        return audioCtx;

      } catch (e) {

        return null;
      }
    }


    function beep(freq, dur) {

      try {

        var ctx =
          ensureAudio();

        if (!ctx) {
          return;
        }

        var oscillator =
          ctx.createOscillator();

        var gain =
          ctx.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value =
          freq;

        gain.gain.value =
          0.08;

        oscillator.connect(gain);

        gain.connect(
          ctx.destination
        );

        oscillator.start();

        oscillator.stop(
          ctx.currentTime +
          (dur || 0.2)
        );

      } catch (e) {}
    }


    function startDialTone() {

      stopRing();

      beep(440, 0.15);

      ringTimer =
        setInterval(function () {

          beep(440, 0.15);

          setTimeout(function () {
            beep(480, 0.15);
          }, 180);

        }, 1200);
    }


    function startIncomingRing() {

      stopRing();

      try {

        if (navigator.vibrate) {

          navigator.vibrate([
            300,
            200,
            300,
            200
          ]);
        }

      } catch (e) {}


      beep(880, 0.25);


      ringTimer =
        setInterval(function () {

          beep(880, 0.25);

          setTimeout(function () {

            beep(980, 0.25);

          }, 300);


          try {

            if (navigator.vibrate) {

              navigator.vibrate(200);

            }

          } catch (e) {}

        }, 1500);
    }


    function stopRing() {

      if (ringTimer) {

        clearInterval(
          ringTimer
        );

        ringTimer = null;
      }
    }


    /* =========================================================
       取得 TURN
    ========================================================= */

    async function getIceServers() {

      setStatus(
        "正在取得安全連線設定…"
      );

      showConnecting(
        "正在取得安全連線設定…"
      );


      try {

        var result =
          await supabase.functions.invoke(
            "get-turn-credentials",
            {
              method: "POST",
              body: {}
            }
          );


        if (result.error) {

          console.error(
            "TURN Function Error:",
            result.error
          );

          throw new Error(
            result.error.message ||
            "TURN Edge Function 無法使用"
          );
        }


        if (
          !result.data ||
          !result.data.iceServers
        ) {

          throw new Error(
            "TURN 設定格式錯誤"
          );
        }


        console.log(
          "TURN ICE Servers 已取得"
        );


        return {
          iceServers:
            result.data.iceServers
        };


      } catch (error) {

        console.error(
          "getIceServers:",
          error
        );

        throw error;
      }
    }


    /* =========================================================
       取得媒體
    ========================================================= */

    async function getMedia() {

      setStatus(
        mode === "audio"
          ? "正在啟動麥克風…"
          : "正在啟動麥克風與相機…"
      );


      var constraints;


      if (mode === "audio") {

        constraints = {
          audio: true,
          video: false
        };

      } else {

        constraints = {
          audio: true,
          video: {
            facingMode: "user"
          }
        };
      }


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "此瀏覽器不支援相機／麥克風"
        );
      }


      localStream =
        await navigator.mediaDevices
          .getUserMedia(
            constraints
          );


      var localVideo =
        document.getElementById(
          "localVideo"
        );


      if (mode === "audio") {

        document
          .getElementById(
            "audioBg"
          )
          .style.display = "flex";


        document
          .getElementById(
            "remoteVideo"
          )
          .style.display = "none";


        localVideo.style.display =
          "none";


        document
          .getElementById(
            "btnCam"
          )
          .style.display = "none";

      } else {

        localVideo.srcObject =
          localStream;

        localVideo.style.display =
          "block";


        try {

          await localVideo.play();

        } catch (e) {}
      }


      return localStream;
    }


    /* =========================================================
       等待 ICE Gathering 完成
       
       這一版故意等 ICE 完成後才交換 SDP，
       避免你目前 call_sessions 裡面
       caller_ice / callee_ice 的時序問題。
    ========================================================= */

    function waitForIceGatheringComplete() {

      return new Promise(
        function (resolve) {

          if (!pc) {

            resolve();

            return;
          }


          if (
            pc.iceGatheringState ===
            "complete"
          ) {

            iceGatheringFinished =
              true;

            resolve();

            return;
          }


          var timeout =
            setTimeout(
              function () {

                iceGatheringFinished =
                  true;

                resolve();

              },
              15000
            );


          function check() {

            if (!pc) {

              clearTimeout(timeout);

              resolve();

              return;
            }


            if (
              pc.iceGatheringState ===
              "complete"
            ) {

              clearTimeout(timeout);

              iceGatheringFinished =
                true;

              pc.removeEventListener(
                "icegatheringstatechange",
                check
              );

              resolve();
            }
          }


          pc.addEventListener(
            "icegatheringstatechange",
            check
          );

        }
      );
    }


    /* =========================================================
       建立 PeerConnection
    ========================================================= */

    async function createPeerConnection(role) {

      showConnecting(
        "正在建立安全連線…"
      );


      var rtcConfig =
        await getIceServers();


      console.log(
        "RTCPeerConnection config:",
        rtcConfig
      );


      pc =
        new RTCPeerConnection(
          rtcConfig
        );


      /*
       * 每次建立新的 PeerConnection
       * 都重置這些狀態。
       */

      remoteDescriptionSet =
        false;

      answerApplied =
        false;

      offerApplied =
        false;

      iceGatheringFinished =
        false;


      /* -------------------------------------------------------
         加入本機音訊／影像
      ------------------------------------------------------- */

      if (localStream) {

        var tracks =
          localStream.getTracks();


        tracks.forEach(
          function (track) {

            pc.addTrack(
              track,
              localStream
            );

          }
        );
      }


      /* -------------------------------------------------------
         收到遠端媒體
      ------------------------------------------------------- */

      pc.ontrack =
        function (event) {

          console.log(
            "收到遠端 Track:",
            event.track.kind
          );


          var remoteVideo =
            document.getElementById(
              "remoteVideo"
            );


          if (
            event.streams &&
            event.streams.length > 0
          ) {

            remoteVideo.srcObject =
              event.streams[0];

          } else {

            /*
             * 某些瀏覽器不提供 streams，
             * 自己建立 MediaStream。
             */

            if (
              !remoteVideo.srcObject
            ) {

              remoteVideo.srcObject =
                new MediaStream();
            }


            try {

              remoteVideo.srcObject
                .addTrack(
                  event.track
                );

            } catch (e) {}
          }


          if (mode !== "audio") {

            remoteVideo.style.display =
              "block";

            try {

              remoteVideo.play();

            } catch (e) {}

          } else {

            /*
             * 語音模式仍然使用
             * remoteVideo 元素播放遠端音訊。
             */

            remoteVideo.style.display =
              "block";

            remoteVideo.style.width =
              "1px";

            remoteVideo.style.height =
              "1px";

            remoteVideo.style.opacity =
              "0";
          }


          hideConnecting();

          setStatus(
            "通話中"
          );

          stopRing();
        };


      /* -------------------------------------------------------
         ICE Connection State
      ------------------------------------------------------- */

      pc.oniceconnectionstatechange =
        function () {

          if (!pc) {
            return;
          }


          var state =
            pc.iceConnectionState;


          console.log(
            "ICE:",
            state
          );


          if (
            state === "checking"
          ) {

            setStatus(
              "正在建立安全連線…"
            );

            showConnecting(
              "正在建立安全連線…"
            );

            return;
          }


          if (
            state === "connected" ||
            state === "completed"
          ) {

            hideConnecting();

            setStatus(
              "通話中"
            );

            stopRing();

            return;
          }


          if (
            state === "disconnected"
          ) {

            setStatus(
              "網路暫時中斷…"
            );

            return;
          }


          if (
            state === "failed"
          ) {

            hideConnecting();

            setStatus(
              "連線失敗"
            );

            showError(
              "WebRTC 連線失敗，請檢查網路或 TURN 設定。"
            );

            return;
          }


          if (
            state === "closed"
          ) {

            setStatus(
              "通話已結束"
            );
          }
        };


      /* -------------------------------------------------------
         ICE Candidate
         
         這一版不再逐筆寫入資料庫。
         因為我們會等待 ICE gathering complete，
         Candidate 會包含在 offer / answer SDP 裡。
      ------------------------------------------------------- */

      pc.onicecandidate =
        function (event) {

          if (event.candidate) {

            console.log(
              "ICE candidate 已產生"
            );
          }
        };


      /* -------------------------------------------------------
         Connection State
      ------------------------------------------------------- */

      pc.onconnectionstatechange =
        function () {

          if (!pc) {
            return;
          }


          var state =
            pc.connectionState;


          console.log(
            "Peer connection:",
            state
          );


          if (
            state === "connected"
          ) {

            hideConnecting();

            hideError();

            setStatus(
              "通話中"
            );

            stopRing();
          }


          if (
            state === "failed"
          ) {

            hideConnecting();

            setStatus(
              "通話連線失敗"
            );

            showError(
              "通話連線失敗，請確認雙方網路是否正常。"
            );
          }


          if (
            state === "disconnected"
          ) {

            setStatus(
              "網路暫時中斷…"
            );
          }
        };


      return pc;
    }


    /* =========================================================
       Realtime
    ========================================================= */

    function subscribeCallRow() {

      if (!callRowId) {
        return;
      }


      if (channel) {

        try {

          supabase.removeChannel(
            channel
          );

        } catch (e) {}

        channel = null;
      }


      channel =
        supabase
          .channel(
            "call-row-" +
            callRowId
          )

          .on(
            "postgres_changes",
            {
              event: "UPDATE",
              schema: "public",
              table: "call_sessions",
              filter:
                "id=eq." +
                callRowId
            },

            async function (
              payload
            ) {

              await handleCallUpdate(
                payload.new
              );
            }
          )

          .subscribe(
            function (
              status
            ) {

              console.log(
                "Call Realtime:",
                status
              );

            }
          );
    }


    /* =========================================================
       處理通話資料
    ========================================================= */

    async function handleCallUpdate(
      row
    ) {

      if (!row || shuttingDown) {
        return;
      }


      /* -------------------------------------------------------
         拒接
      ------------------------------------------------------- */

      if (
        row.status ===
        "rejected"
      ) {

        stopRing();

        hideConnecting();

        setStatus(
          "對方已拒接"
        );


        setTimeout(
          function () {

            hangup(
              false
            );

          },
          800
        );

        return;
      }


      /* -------------------------------------------------------
         掛斷
      ------------------------------------------------------- */

      if (
        row.status ===
        "ended"
      ) {

        hangup(
          false
        );

        return;
      }


      /* -------------------------------------------------------
         Caller 收到 Answer
         
         最重要的修正：
         一旦 Answer 已經套用，
         Realtime 或 polling 再收到相同 Answer，
         絕對不能再次 setRemoteDescription。
      ------------------------------------------------------- */

      if (
        isCaller &&
        row.answer &&
        pc &&
        !answerApplied
      ) {

        /*
         * 只有目前仍在等待 Remote Answer
         * 才允許套用。
         */

        if (
          pc.signalingState !==
          "have-local-offer"
        ) {

          console.warn(
            "忽略重複 Answer，state:",
            pc.signalingState
          );

        } else {

          try {

            answerApplied =
              true;


            await pc.setRemoteDescription(
              row.answer
            );


            remoteDescriptionSet =
              true;


            hideConnecting();


            setStatus(
              "已接通，建立媒體中…"
            );


            stopRing();


          } catch (error) {

            /*
             * 如果瀏覽器表示 stable，
             * 不再重試同一個 Answer。
             */

            console.error(
              "setRemoteDescription(answer):",
              error
            );


            if (
              String(
                error.message || ""
              ).indexOf(
                "wrong state"
              ) !== -1
            ) {

              answerApplied =
                true;

              hideConnecting();

              setStatus(
                "通話中"
              );

            } else {

              answerApplied =
                false;

              setStatus(
                "設定對方通話資料失敗"
              );
            }
          }
        }
      }


      /*
       * 注意：
       *
       * 這一版不再處理 caller_ice / callee_ice。
       *
       * 因為我們等 ICE gathering complete，
       * Candidate 已經寫入 SDP。
       */
    }


    /* =========================================================
       建立 Offer
    ========================================================= */

    async function createCallerOffer() {

      if (!pc) {
        throw new Error(
          "PeerConnection 尚未建立"
        );
      }


      setStatus(
        "正在建立通話邀請…"
      );


      var offer =
        await pc.createOffer({
          offerToReceiveAudio: true,
          offerToReceiveVideo:
            mode !== "audio"
        });


      await pc.setLocalDescription(
        offer
      );


      setStatus(
        "正在取得網路連線資訊…"
      );


      /*
       * 等待 ICE 完成。
       *
       * 完成後 localDescription.sdp
       * 已經包含必要 Candidate。
       */

      await waitForIceGatheringComplete();


      if (
        !pc.localDescription
      ) {

        throw new Error(
          "Offer 建立失敗"
        );
      }


      return {
        type:
          pc.localDescription.type,

        sdp:
          pc.localDescription.sdp
      };
    }


    /* =========================================================
       建立 Answer
    ========================================================= */

    async function createCalleeAnswer(
      offer
    ) {

      if (!pc) {

        throw new Error(
          "PeerConnection 尚未建立"
        );
      }


      if (
        pc.signalingState !==
        "stable"
      ) {

        throw new Error(
          "目前通話狀態不允許設定 Offer：" +
          pc.signalingState
        );
      }


      if (offerApplied) {

        throw new Error(
          "Offer 已經處理過"
        );
      }


      offerApplied = true;


      await pc.setRemoteDescription(
        offer
      );


      remoteDescriptionSet =
        true;


      setStatus(
        "正在建立接聽連線…"
      );


      var answer =
        await pc.createAnswer({
          offerToReceiveAudio: true,
          offerToReceiveVideo:
            mode !== "audio"
        });


      await pc.setLocalDescription(
        answer
      );


      setStatus(
        "正在完成安全連線…"
      );


      await waitForIceGatheringComplete();


      if (
        !pc.localDescription
      ) {

        throw new Error(
          "Answer 建立失敗"
        );
      }


      return {
        type:
          pc.localDescription.type,

        sdp:
          pc.localDescription.sdp
      };
    }


    /* =========================================================
       掛斷
    ========================================================= */

    async function hangup(
      updateDb
    ) {

      if (shuttingDown) {
        return;
      }


      shuttingDown = true;


      stopRing();

      hideConnecting();


      if (pollTimer) {

        clearInterval(
          pollTimer
        );

        pollTimer = null;
      }


      if (incomingTimer) {

        clearInterval(
          incomingTimer
        );

        incomingTimer = null;
      }


      if (channel) {

        try {

          await supabase.removeChannel(
            channel
          );

        } catch (e) {}

        channel = null;
      }


      if (incomingChannel) {

        try {

          await supabase.removeChannel(
            incomingChannel
          );

        } catch (e) {}

        incomingChannel = null;
      }


      if (pc) {

        try {

          pc.ontrack = null;

          pc.onicecandidate = null;

          pc.close();

        } catch (e) {}

        pc = null;
      }


      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            function (track) {

              try {

                track.stop();

              } catch (e) {}

            }
          );

        localStream = null;
      }


      if (
        updateDb &&
        callRowId &&
        supabase
      ) {

        try {

          await supabase
            .from(
              "call_sessions"
            )
            .update({
              status:
                "ended"
            })
            .eq(
              "id",
              callRowId
            );

        } catch (e) {

          console.error(
            "掛斷更新失敗:",
            e
          );
        }
      }


      window.location.href =
        "contacts.html";
    }


    /* =========================================================
       撥出電話
    ========================================================= */

    async function startAsCaller() {

      isCaller = true;

      hideError();


      setStatus(
        "正在撥號…"
      );


      startDialTone();


      /* -------------------------------------------------------
         相機／麥克風
      ------------------------------------------------------- */

      try {

        await getMedia();

      } catch (error) {

        stopRing();

        console.error(
          "getUserMedia:",
          error
        );


        hideConnecting();


        setStatus(
          "無法取得麥克風／相機"
        );


        showError(
          "請允許瀏覽器使用麥克風與相機。"
        );


        return;
      }


      /* -------------------------------------------------------
         PeerConnection
      ------------------------------------------------------- */

      try {

        await createPeerConnection(
          "caller"
        );

      } catch (error) {

        stopRing();

        hideConnecting();


        console.error(
          "createPeerConnection:",
          error
        );


        setStatus(
          "無法建立安全連線"
        );


        showError(
          "TURN 設定取得失敗：" +
          (error.message ||
           error)
        );


        return;
      }


      /* -------------------------------------------------------
         Offer
      ------------------------------------------------------- */

      var offer;


      try {

        offer =
          await createCallerOffer();

      } catch (error) {

        stopRing();

        hideConnecting();


        console.error(
          "createOffer:",
          error
        );


        setStatus(
          "建立通話邀請失敗"
        );


        showError(
          "建立通話邀請失敗：" +
          (error.message ||
           error)
        );


        return;
      }


      /* -------------------------------------------------------
         建立 call_sessions
      ------------------------------------------------------- */

      setStatus(
        "正在發送通話邀請…"
      );


      var insertResult =
        await supabase
          .from(
            "call_sessions"
          )
          .insert({

            caller_id:
              me.id,

            callee_id:
              toUser,

            mode:
              mode,

            status:
              "ringing",

            offer:
              offer,

            caller_ice:
              [],

            callee_ice:
              []

          })
          .select()
          .single();


      if (
        insertResult.error
      ) {

        stopRing();

        hideConnecting();


        console.error(
          "call_sessions insert:",
          insertResult.error
        );


        setStatus(
          "撥號失敗"
        );


        showError(
          "撥號失敗：" +
          insertResult.error.message
        );


        return;
      }


      callRowId =
        insertResult.data.id;


      console.log(
        "Call ID:",
        callRowId
      );


      subscribeCallRow();


      setStatus(
        "等待對方接聽…"
      );


      showConnecting(
        "等待對方接聽…"
      );


      /* -------------------------------------------------------
         Polling 備援
      ------------------------------------------------------- */

      pollTimer =
        setInterval(
          async function () {

            if (
              !callRowId ||
              shuttingDown
            ) {
              return;
            }


            try {

              var result =
                await supabase
                  .from(
                    "call_sessions"
                  )
                  .select("*")
                  .eq(
                    "id",
                    callRowId
                  )
                  .single();


              if (
                result.data
              ) {

                await handleCallUpdate(
                  result.data
                );
              }

            } catch (error) {

              console.error(
                "Call polling:",
                error
              );
            }

          },
          2000
        );
    }


    /* =========================================================
       顯示來電
    ========================================================= */

    function showIncoming(row) {

      if (
        !row ||
        !row.id
      ) {
        return;
      }


      if (
        isCaller
      ) {
        return;
      }


      if (
        document
          .getElementById(
            "incomingPanel"
          )
          .classList
          .contains(
            "show"
          )
      ) {

        return;
      }


      callRowId =
        row.id;


      mode =
        row.mode ||
        mode;


      document
        .getElementById(
          "incomingPanel"
        )
        .classList
        .add(
          "show"
        );


      document
        .getElementById(
          "incomingSub"
        )
        .textContent =
          (
            mode === "audio"
              ? "語音"
              : "視訊"
          ) +
          "通話邀請";


      setStatus(
        "來電中"
      );


      startIncomingRing();


      subscribeCallRow();
    }


    /* =========================================================
       接聽
    ========================================================= */

    async function acceptCall() {

      if (
        !callRowId
      ) {

        setStatus(
          "來電資料不存在"
        );

        return;
      }


      stopRing();


      document
        .getElementById(
          "incomingPanel"
        )
        .classList
        .remove(
          "show"
        );


      hideError();


      setStatus(
        "正在接聽…"
      );


      /* -------------------------------------------------------
         取得媒體
      ------------------------------------------------------- */

      try {

        await getMedia();

      } catch (error) {

        console.error(
          "getUserMedia:",
          error
        );


        setStatus(
          "無法取得麥克風／相機"
        );


        showError(
          "請允許瀏覽器使用麥克風與相機。"
        );


        return;
      }


      /* -------------------------------------------------------
         建立 PeerConnection
      ------------------------------------------------------- */

      try {

        await createPeerConnection(
          "callee"
        );

      } catch (error) {

        console.error(
          "createPeerConnection:",
          error
        );


        hideConnecting();


        setStatus(
          "無法建立安全連線"
        );


        showError(
          "TURN 設定取得失敗：" +
          (error.message ||
           error)
        );


        return;
      }


      /* -------------------------------------------------------
         取得 Caller Offer
      ------------------------------------------------------- */

      var result =
        await supabase
          .from(
            "call_sessions"
          )
          .select("*")
          .eq(
            "id",
            callRowId
          )
          .single();


      if (
        result.error ||
        !result.data
      ) {

        hideConnecting();


        setStatus(
          "來電已失效"
        );


        return;
      }


      var row =
        result.data;


      if (
        !row.offer
      ) {

        hideConnecting();


        setStatus(
          "找不到通話邀請"
        );


        return;
      }


      /* -------------------------------------------------------
         建立 Answer
      ------------------------------------------------------- */

      var answer;


      try {

        answer =
          await createCalleeAnswer(
            row.offer
          );


      } catch (error) {

        console.error(
          "createAnswer:",
          error
        );


        hideConnecting();


        setStatus(
          "接聽失敗"
        );


        showError(
          "建立接聽連線失敗：" +
          (error.message ||
           error)
        );


        return;
      }


      /* -------------------------------------------------------
         寫入 Answer
      ------------------------------------------------------- */

      var updateResult =
        await supabase
          .from(
            "call_sessions"
          )
          .update({

            status:
              "accepted",

            answer:
              answer

          })
          .eq(
            "id",
            callRowId
          );


      if (
        updateResult.error
      ) {

        console.error(
          "Answer update:",
          updateResult.error
        );


        hideConnecting();


        setStatus(
          "接聽失敗"
        );


        showError(
          "無法傳送接聽資訊：" +
          updateResult.error.message
        );


        return;
      }


      setStatus(
        "已接聽，正在建立媒體連線…"
      );


      showConnecting(
        "正在建立媒體連線…"
      );


      /* -------------------------------------------------------
         Polling 備援
      ------------------------------------------------------- */

      if (pollTimer) {

        clearInterval(
          pollTimer
        );
      }


      pollTimer =
        setInterval(
          async function () {

            if (
              !callRowId ||
              shuttingDown
            ) {
              return;
            }


            try {

              var pollResult =
                await supabase
                  .from(
                    "call_sessions"
                  )
                  .select("*")
                  .eq(
                    "id",
                    callRowId
                  )
                  .single();


              if (
                pollResult.data
              ) {

                await handleCallUpdate(
                  pollResult.data
                );
              }

            } catch (error) {

              console.error(
                "Call polling:",
                error
              );
            }

          },
          2000
        );
    }


    /* =========================================================
       拒接
    ========================================================= */

    async function rejectCall() {

      stopRing();


      if (
        callRowId &&
        supabase
      ) {

        try {

          await supabase
            .from(
              "call_sessions"
            )
            .update({
              status:
                "rejected"
            })
            .eq(
              "id",
              callRowId
            );

        } catch (error) {

          console.error(
            "reject:",
            error
          );
        }
      }


      window.location.href =
        "contacts.html";
    }


    /* =========================================================
       監聽來電
    ========================================================= */

    async function listenIncoming() {

      try {

        incomingChannel =
          supabase
            .channel(
              "incoming-" +
              me.id
            )

            .on(
              "postgres_changes",
              {
                event: "INSERT",
                schema: "public",
                table: "call_sessions",
                filter:
                  "callee_id=eq." +
                  me.id
              },

              function (
                payload
              ) {

                if (
                  payload.new &&
                  payload.new.status ===
                    "ringing" &&
                  !isCaller
                ) {

                  showIncoming(
                    payload.new
                  );
                }
              }
            )

            .subscribe(
              function (
                status
              ) {

                console.log(
                  "Incoming Realtime:",
                  status
                );
              }
            );

      } catch (error) {

        console.error(
          "Incoming Realtime:",
          error
        );
      }


      async function checkOnce() {

        if (
          isCaller ||
          shuttingDown
        ) {
          return;
        }


        if (
          document
            .getElementById(
              "incomingPanel"
            )
            .classList
            .contains(
              "show"
            )
        ) {

          return;
        }


        try {

          var result =
            await supabase
              .from(
                "call_sessions"
              )
              .select("*")
              .eq(
                "callee_id",
                me.id
              )
              .eq(
                "status",
                "ringing"
              )
              .order(
                "created_at",
                {
                  ascending:
                    false
                }
              )
              .limit(1);


          if (
            result.data &&
            result.data.length
          ) {

            showIncoming(
              result.data[0]
            );
          }

        } catch (error) {

          console.error(
            "check incoming:",
            error
          );
        }
      }


      await checkOnce();


      incomingTimer =
        setInterval(
          checkOnce,
          2000
        );
    }


    /* =========================================================
       麥克風
    ========================================================= */

    document
      .getElementById(
        "btnMic"
      )
      .onclick =
        function () {

          if (
            !localStream
          ) {
            return;
          }


          micOn =
            !micOn;


          localStream
            .getAudioTracks()
            .forEach(
              function (track) {

                track.enabled =
                  micOn;

              }
            );


          var button =
            document.getElementById(
              "btnMic"
            );


          button.textContent =
            micOn
              ? "麥"
              : "靜音";


          button.classList.toggle(
            "off",
            !micOn
          );
        };


    /* =========================================================
       鏡頭
    ========================================================= */

    document
      .getElementById(
        "btnCam"
      )
      .onclick =
        function () {

          if (
            !localStream ||
            mode === "audio"
          ) {
            return;
          }


          camOn =
            !camOn;


          localStream
            .getVideoTracks()
            .forEach(
              function (track) {

                track.enabled =
                  camOn;

              }
            );


          var button =
            document.getElementById(
              "btnCam"
            );


          button.textContent =
            camOn
              ? "鏡頭"
              : "關鏡";


          button.classList.toggle(
            "off",
            !camOn
          );
        };


    /* =========================================================
       掛斷按鈕
    ========================================================= */

    document
      .getElementById(
        "btnHang"
      )
      .onclick =
        function () {

          hangup(true);

        };


    /* =========================================================
       接聽／拒接
    ========================================================= */

    document
      .getElementById(
        "btnAccept"
      )
      .onclick =
        function () {

          acceptCall();

        };


    document
      .getElementById(
        "btnReject"
      )
      .onclick =
        function () {

          rejectCall();

        };


    /* =========================================================
       啟動
    ========================================================= */

    async function boot() {

      try {

        setStatus(
          "正在啟動通話…"
        );


        if (
          !window.supabase
        ) {

          throw new Error(
            "Supabase 套件載入失敗"
          );
        }


        supabase =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );


        setStatus(
          "正在確認登入狀態…"
        );


        var sessionResult =
          await supabase.auth.getSession();


        if (
          sessionResult.error
        ) {

          throw new Error(
            sessionResult.error.message
          );
        }


        if (
          !sessionResult.data.session
        ) {

          window.location.href =
            "login.html";

          return;
        }


        me =
          sessionResult
            .data
            .session
            .user;


        console.log(
          "目前使用者:",
          me.id
        );


        /*
         * 第一次使用者操作解除
         * iPhone / Safari 音訊限制。
         */

        document.body.addEventListener(
          "click",
          function () {

            try {

              ensureAudio();

            } catch (e) {}

          },
          {
            once: true
          }
        );


        /*
         * 先啟動來電監聽。
         */

        await listenIncoming();


        /*
         * 有 to：
         * 代表從聯絡人／群組成員
         * 發起一對一電話。
         */

        if (toUser) {


          if (
            toUser === me.id
          ) {

            hideConnecting();

            setStatus(
              "不能打給自己"
            );

            return;
          }


          await startAsCaller();


        } else {


          /*
           * 沒有 to：
           * 這個頁面只等待來電。
           */

          hideConnecting();


          setStatus(
            "等待來電…"
          );
        }


      } catch (error) {

        console.error(
          "CALL BOOT ERROR:",
          error
        );


        stopRing();

        hideConnecting();


        setStatus(
          "通話初始化失敗"
        );


        showError(
          error.message ||
          "通話初始化失敗"
        );
      }
    }


    /* =========================================================
       開始
    ========================================================= */

    boot();


  })();
  </script>
