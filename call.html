<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通話 - 安全團聚</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      position: relative;
    }

    #remoteVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
      z-index: 1;
    }

    #remoteAudio {
      display: none;
    }

    #localVideo {
      position: absolute;
      top: 56px;
      right: 12px;
      width: 105px;
      height: 145px;
      border-radius: 14px;
      object-fit: cover;
      transform: scaleX(-1);
      background: #333;
      border: 2px solid rgba(255,255,255,.65);
      z-index: 10;
    }

    #audioBg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(160deg, #1b5e20, #0d47a1);
      z-index: 2;
    }

    #audioIcon {
      font-size: 70px;
    }

    #audioTitle {
      font-size: 20px;
      font-weight: 700;
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 48px 16px 16px;
      text-align: center;
      background: linear-gradient(
        rgba(0,0,0,.7),
        rgba(0,0,0,0)
      );
      pointer-events: none;
    }

    .top-name {
      font-size: 18px;
      font-weight: 700;
    }

    .top-status {
      margin-top: 7px;
      font-size: 13px;
      opacity: .95;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 20px 12px 38px;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.85)
      );
    }

    .ctrl {
      min-width: 58px;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.22);
      font-size: 12px;
      font-weight: 700;
    }

    .ctrl.off {
      background: #e53935;
    }

    .ctrl.hangup {
      background: #e53935;
      width: 64px;
      height: 64px;
    }

    .ctrl.accept {
      background: #06C755;
      width: 64px;
      height: 64px;
    }

    #incomingPanel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
      background: rgba(0,0,0,.91);
    }

    #incomingPanel.show {
      display: flex;
    }

    .incoming-title {
      font-size: 26px;
      font-weight: 800;
    }

    .incoming-sub {
      font-size: 16px;
      opacity: .9;
    }

    .incoming-buttons {
      display: flex;
      gap: 30px;
      margin-top: 20px;
    }

    #errorPanel {
      display: none;
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 115px;
      z-index: 40;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(180,20,20,.92);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    #errorPanel.show {
      display: block;
    }

    #connectingPanel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 25;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
      background: rgba(0,0,0,.35);
      pointer-events: none;
    }

    #connectingPanel.show {
      display: flex;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .connecting-text {
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>

  <audio
    id="remoteAudio"
    autoplay
    playsinline
  ></audio>

  <div id="audioBg">
    <div id="audioIcon">📞</div>
    <div id="audioTitle">語音通話</div>
  </div>

  <video
    id="localVideo"
    autoplay
    playsinline
    muted
  ></video>

  <div class="top-bar">
    <div class="top-name" id="callName">通話</div>
    <div class="top-status" id="callStatus">準備中…</div>
  </div>

  <div id="connectingPanel">
    <div class="spinner"></div>
    <div class="connecting-text" id="connectingText">
      正在建立安全連線…
    </div>
  </div>

  <div id="errorPanel"></div>

  <div id="incomingPanel">

    <div class="incoming-title">
      來電
    </div>

    <div class="incoming-sub" id="incomingSub">
      邀請你通話
    </div>

    <div class="incoming-buttons">

      <button
        class="ctrl hangup"
        id="btnReject"
        type="button"
      >
        拒接
      </button>

      <button
        class="ctrl accept"
        id="btnAccept"
        type="button"
      >
        接聽
      </button>

    </div>

  </div>

  <div class="controls">

    <button
      class="ctrl"
      id="btnMic"
      type="button"
    >
      麥
    </button>

    <button
      class="ctrl"
      id="btnCam"
      type="button"
    >
      鏡頭
    </button>

    <button
      class="ctrl hangup"
      id="btnHang"
      type="button"
    >
      掛斷
    </button>

  </div>


<script>
(function () {

  "use strict";


  /* ============================================================
     Supabase
     ============================================================ */

  var SUPABASE_URL =
    "https://perfsipperncvjocznhl.supabase.co";

  /*
   * 使用 Supabase Dashboard 目前的 Publishable Key。
   * 不要把 Metered Username / Password 放在這裡。
   */

  var SUPABASE_KEY =
    "sb_publishable_qpqAwj49L6HcWqWTnNsTxw_oBEauWBA";


  /* ============================================================
     URL
     ============================================================ */

  var params =
    new URLSearchParams(location.search);

  var mode =
    params.get("mode") || "video";

  var toUser =
    params.get("to") || "";

  var name =
    params.get("name") || "通話";

  try {
    name = decodeURIComponent(name);
  } catch (e) {}

  document.getElementById("callName").textContent =
    name;


  /* ============================================================
     狀態
     ============================================================ */

  var supabase = null;

  var me = null;

  var pc = null;

  var localStream = null;

  var remoteStream = null;

  var callRowId = null;

  var isCaller = false;

  var micOn = true;

  var camOn = true;

  var channel = null;

  var incomingChannel = null;

  var pollTimer = null;

  var incomingPollTimer = null;

  var callTimeoutTimer = null;

  var ringTimer = null;

  var audioCtx = null;

  var remoteDescriptionSet = false;

  var answerApplied = false;

  var ending = false;

  var cleaned = false;

  var localIceQueue = [];

  var remoteIceQueue = [];

  var appliedRemoteIce = {};

  var remoteTracksAdded = false;


  /* ============================================================
     UI
     ============================================================ */

  function setStatus(text) {

    var el =
      document.getElementById("callStatus");

    if (el) {
      el.textContent = text;
    }
  }


  function showConnecting(text) {

    var panel =
      document.getElementById("connectingPanel");

    var label =
      document.getElementById("connectingText");

    if (label) {
      label.textContent = text || "正在建立安全連線…";
    }

    if (panel) {
      panel.classList.add("show");
    }
  }


  function hideConnecting() {

    var panel =
      document.getElementById("connectingPanel");

    if (panel) {
      panel.classList.remove("show");
    }
  }


  function showError(text) {

    hideConnecting();

    var panel =
      document.getElementById("errorPanel");

    if (panel) {

      panel.textContent = text;

      panel.classList.add("show");

      setTimeout(function () {

        panel.classList.remove("show");

      }, 8000);
    }
  }


  function clearError() {

    var panel =
      document.getElementById("errorPanel");

    if (panel) {
      panel.classList.remove("show");
      panel.textContent = "";
    }
  }


  /* ============================================================
     音效
     ============================================================ */

  function ensureAudio() {

    try {

      if (!audioCtx) {

        var AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContext) {
          return null;
        }

        audioCtx =
          new AudioContext();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(function () {});
      }

      return audioCtx;

    } catch (e) {

      return null;
    }
  }


  function beep(freq, duration) {

    try {

      var ctx = ensureAudio();

      if (!ctx) return;

      var oscillator =
        ctx.createOscillator();

      var gain =
        ctx.createGain();

      oscillator.type = "sine";

      oscillator.frequency.value =
        freq;

      gain.gain.value =
        0.08;

      oscillator.connect(gain);

      gain.connect(ctx.destination);

      oscillator.start();

      oscillator.stop(
        ctx.currentTime +
        (duration || 0.2)
      );

    } catch (e) {}
  }


  function startDialTone() {

    stopRing();

    ringTimer =
      setInterval(function () {

        beep(440, .15);

        setTimeout(function () {
          beep(480, .15);
        }, 180);

      }, 1200);
  }


  function startIncomingRing() {

    stopRing();

    if (navigator.vibrate) {

      try {

        navigator.vibrate([
          300,
          200,
          300,
          200
        ]);

      } catch (e) {}
    }

    ringTimer =
      setInterval(function () {

        beep(880, .25);

        setTimeout(function () {
          beep(980, .25);
        }, 300);

        if (navigator.vibrate) {

          try {
            navigator.vibrate(200);
          } catch (e) {}

        }

      }, 1500);
  }


  function stopRing() {

    if (ringTimer) {

      clearInterval(ringTimer);

      ringTimer = null;
    }
  }


  /* ============================================================
     清除逾時
     ============================================================ */

  function clearCallTimeout() {

    if (callTimeoutTimer) {

      clearTimeout(callTimeoutTimer);

      callTimeoutTimer = null;
    }
  }


  function startCallTimeout() {

    clearCallTimeout();

    callTimeoutTimer =
      setTimeout(function () {

        if (ending) return;

        if (
          !pc ||
          (
            pc.iceConnectionState !== "connected" &&
            pc.iceConnectionState !== "completed"
          )
        ) {

          setStatus("連線逾時");

          showError(
            "通話連線失敗，請確認雙方網路是否正常。"
          );

          setTimeout(function () {

            hangup(true);

          }, 2500);
        }

      }, 15000);
  }


  /* ============================================================
     媒體
     ============================================================ */

  async function getMedia() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "此瀏覽器不支援麥克風／相機"
      );
    }

    var constraints;

    if (mode === "audio") {

      constraints = {
        audio: true,
        video: false
      };

    } else {

      constraints = {
        audio: true,
        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        }
      };
    }

    localStream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );

    var localVideo =
      document.getElementById("localVideo");

    if (mode === "audio") {

      document.getElementById(
        "audioBg"
      ).style.display = "flex";

      document.getElementById(
        "remoteVideo"
      ).style.display = "none";

      localVideo.style.display = "none";

      document.getElementById(
        "btnCam"
      ).style.display = "none";

    } else {

      localVideo.srcObject =
        localStream;

      localVideo.style.display =
        "block";

      try {
        await localVideo.play();
      } catch (e) {}
    }

    return localStream;
  }


  /* ============================================================
     TURN
     ============================================================ */

  async function getIceServers() {

    setStatus(
      "取得安全連線設定…"
    );

    try {

      var result =
        await supabase.functions.invoke(
          "get-turn-credentials",
          {
            method: "POST",
            body: {}
          }
        );

      if (result.error) {

        console.error(
          "TURN Function Error:",
          result.error
        );

        throw new Error(
          "TURN 設定取得失敗：" +
          (
            result.error.message ||
            "Edge Function 無法連線"
          )
        );
      }

      if (
        !result.data ||
        !Array.isArray(
          result.data.iceServers
        )
      ) {

        throw new Error(
          "TURN 回傳資料格式錯誤"
        );
      }

      console.log(
        "TURN ICE Servers:",
        result.data.iceServers
      );

      return {
        iceServers:
          result.data.iceServers
      };

    } catch (error) {

      console.error(
        "getIceServers:",
        error
      );

      throw error;
    }
  }


  /* ============================================================
     建立 PeerConnection
     ============================================================ */

  async function createPeerConnection(role) {

    var rtcConfig =
      await getIceServers();

    console.log(
      "建立 PeerConnection:",
      role
    );

    pc =
      new RTCPeerConnection(
        rtcConfig
      );

    remoteStream =
      new MediaStream();

    remoteDescriptionSet =
      false;

    answerApplied =
      false;

    remoteTracksAdded =
      false;

    appliedRemoteIce = {};

    remoteIceQueue = [];


    /* ------------------------------------------------------------
       本機媒體
       ------------------------------------------------------------ */

    if (localStream) {

      localStream
        .getTracks()
        .forEach(function (track) {

          pc.addTrack(
            track,
            localStream
          );

        });
    }


    /* ------------------------------------------------------------
       遠端媒體
       ------------------------------------------------------------ */

    pc.ontrack =
      function (event) {

        console.log(
          "收到遠端 Track:",
          event.track.kind
        );

        if (
          event.streams &&
          event.streams[0]
        ) {

          var stream =
            event.streams[0];

          var remoteVideo =
            document.getElementById(
              "remoteVideo"
            );

          remoteVideo.srcObject =
            stream;

          var remoteAudio =
            document.getElementById(
              "remoteAudio"
            );

          remoteAudio.srcObject =
            stream;

        } else {

          if (
            !remoteStream
          ) {

            remoteStream =
              new MediaStream();

          }

          remoteStream.addTrack(
            event.track
          );

          var rv =
            document.getElementById(
              "remoteVideo"
            );

          rv.srcObject =
            remoteStream;

          var ra =
            document.getElementById(
              "remoteAudio"
            );

          ra.srcObject =
            remoteStream;
        }

        remoteTracksAdded = true;

        if (mode === "audio") {

          document.getElementById(
            "audioBg"
          ).style.display = "flex";

          document.getElementById(
            "remoteAudio"
          ).play().catch(function () {});

        } else {

          var remote =
            document.getElementById(
              "remoteVideo"
            );

          remote.style.display =
            "block";

          remote.play().catch(function () {});
        }

        hideConnecting();

        setStatus(
          "通話中"
        );

        stopRing();
      };


    /* ------------------------------------------------------------
       ICE 狀態
       ------------------------------------------------------------ */

    pc.oniceconnectionstatechange =
      function () {

        if (!pc) return;

        var state =
          pc.iceConnectionState;

        console.log(
          "ICE connection state:",
          state
        );

        if (
          state === "checking"
        ) {

          showConnecting(
            "正在建立安全連線…"
          );

          setStatus(
            "正在建立安全連線…"
          );

        } else if (
          state === "connected" ||
          state === "completed"
        ) {

          clearCallTimeout();

          hideConnecting();

          stopRing();

          setStatus(
            "通話中"
          );

        } else if (
          state === "disconnected"
        ) {

          setStatus(
            "網路暫時中斷…"
          );

        } else if (
          state === "failed"
        ) {

          hideConnecting();

          setStatus(
            "連線失敗"
          );

          showError(
            "通話連線失敗，請確認雙方網路是否正常。"
          );

        } else if (
          state === "closed"
        ) {

          setStatus(
            "通話已結束"
          );
        }
      };


    /* ------------------------------------------------------------
       ICE Gathering
       ------------------------------------------------------------ */

    pc.onicegatheringstatechange =
      function () {

        console.log(
          "ICE gathering:",
          pc.iceGatheringState
        );
      };


    /* ------------------------------------------------------------
       ICE Candidate
       ------------------------------------------------------------ */

    pc.onicecandidate =
      function (event) {

        if (!event.candidate) {
          return;
        }

        var candidate =
          event.candidate.toJSON();

        console.log(
          "本機 ICE Candidate:",
          candidate
        );

        queueOrPushLocalIce(
          role,
          candidate
        );
      };


    /* ------------------------------------------------------------
       Signaling State
       ------------------------------------------------------------ */

    pc.onsignalingstatechange =
      function () {

        if (!pc) return;

        console.log(
          "Signaling state:",
          pc.signalingState
        );
      };


    return pc;
  }


  /* ============================================================
     Local ICE
     ============================================================ */

  async function queueOrPushLocalIce(
    role,
    candidate
  ) {

    if (!callRowId) {

      localIceQueue.push({
        role: role,
        candidate: candidate
      });

      return;
    }

    await pushIce(
      role,
      candidate
    );
  }


  async function pushIce(
    role,
    candidate
  ) {

    if (!callRowId ||
        !candidate) {

      return;
    }

    var column =
      role === "caller"
        ? "caller_ice"
        : "callee_ice";

    try {

      var result =
        await supabase
          .from("call_sessions")
          .select(column)
          .eq("id", callRowId)
          .single();

      if (result.error) {

        console.error(
          "讀取 ICE 失敗:",
          result.error
        );

        return;
      }

      var list =
        result.data &&
        result.data[column];

      if (!Array.isArray(list)) {
        list = [];
      }

      /*
       * 防止完全相同 candidate
       * 重複寫入。
       */

      var candidateText =
        JSON.stringify(candidate);

      for (
        var i = 0;
        i < list.length;
        i++
      ) {

        if (
          JSON.stringify(list[i]) ===
          candidateText
        ) {

          return;
        }
      }

      list.push(candidate);

      var patch = {};

      patch[column] =
        list;

      var updateResult =
        await supabase
          .from("call_sessions")
          .update(patch)
          .eq("id", callRowId);

      if (updateResult.error) {

        console.error(
          "寫入 ICE 失敗:",
          updateResult.error
        );
      }

    } catch (error) {

      console.error(
        "pushIce error:",
        error
      );
    }
  }


  async function flushLocalIce() {

    if (
      !callRowId ||
      !localIceQueue.length
    ) {

      return;
    }

    var list =
      localIceQueue.slice();

    localIceQueue = [];

    for (
      var i = 0;
      i < list.length;
      i++
    ) {

      await pushIce(
        list[i].role,
        list[i].candidate
      );
    }
  }


  /* ============================================================
     Remote ICE
     ============================================================ */

  async function addRemoteCandidate(
    candidate
  ) {

    if (!pc ||
        !candidate) {

      return;
    }

    var key =
      JSON.stringify(candidate);

    if (
      appliedRemoteIce[key]
    ) {

      return;
    }

    /*
     * 沒有 RemoteDescription 時
     * 先暫存。
     */

    if (
      !pc.remoteDescription
    ) {

      remoteIceQueue.push(
        candidate
      );

      return;
    }

    try {

      await pc.addIceCandidate(
        candidate
      );

      appliedRemoteIce[key] =
        true;

    } catch (error) {

      console.error(
        "加入遠端 ICE 失敗:",
        error
      );
    }
  }


  async function applyRemoteIce(
    list
  ) {

    if (
      !Array.isArray(list) ||
      !list.length
    ) {

      return;
    }

    for (
      var i = 0;
      i < list.length;
      i++
    ) {

      await addRemoteCandidate(
        list[i]
      );
    }
  }


  async function flushRemoteIce() {

    if (
      !pc ||
      !pc.remoteDescription
    ) {

      return;
    }

    var list =
      remoteIceQueue.slice();

    remoteIceQueue = [];

    for (
      var i = 0;
      i < list.length;
      i++
    ) {

      await addRemoteCandidate(
        list[i]
      );
    }
  }


  /* ============================================================
     Realtime
     ============================================================ */

  function subscribeCall() {

    if (!callRowId) {
      return;
    }

    if (channel) {

      try {
        supabase.removeChannel(
          channel
        );
      } catch (e) {}

      channel = null;
    }

    channel =
      supabase
        .channel(
          "call-session-" +
          callRowId +
          "-" +
          Date.now()
        )
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "call_sessions",
            filter:
              "id=eq." +
              callRowId
          },
          function (payload) {

            if (
              payload &&
              payload.new
            ) {

              handleCallUpdate(
                payload.new
              );
            }
          }
        )
        .subscribe(
          function (status) {

            console.log(
              "Call Realtime:",
              status
            );
          }
        );
  }


  /* ============================================================
     處理 Call Session
     ============================================================ */

  async function handleCallUpdate(
    row
  ) {

    if (!row || ending) {
      return;
    }

    /*
     * 被拒接
     */

    if (
      row.status === "rejected"
    ) {

      if (isCaller) {

        stopRing();

        hideConnecting();

        setStatus(
          "對方已拒接"
        );

        setTimeout(
          function () {
            hangup(false);
          },
          800
        );
      }

      return;
    }


    /*
     * 已掛斷
     */

    if (
      row.status === "ended"
    ) {

      if (!ending) {
        hangup(false);
      }

      return;
    }


    /*
     * Caller 收到 Answer
     */

    if (
      isCaller &&
      row.answer &&
      pc &&
      !answerApplied
    ) {

      /*
       * 只有在 caller 的
       * signalingState 為 have-local-offer
       * 時才能設定 answer。
       */

      if (
        pc.signalingState ===
        "have-local-offer"
      ) {

        try {

          await pc.setRemoteDescription(
            row.answer
          );

          remoteDescriptionSet =
            true;

          answerApplied =
            true;

          console.log(
            "Caller 已設定 Remote Answer"
          );

          setStatus(
            "已接通，建立媒體中…"
          );

          stopRing();

          await flushRemoteIce();

          /*
           * Answer 設定後，
           * 再讀一次資料庫中的 ICE。
           */

          await refreshCallRow();

        } catch (error) {

          console.error(
            "設定 answer 失敗:",
            error
          );

          /*
           * 如果已經是 stable，
           * 不再重複設定。
           */

          if (
            pc &&
            pc.signalingState ===
            "stable"
          ) {

            answerApplied = true;

            await flushRemoteIce();

          } else {

            setStatus(
              "Answer 建立失敗"
            );

            showError(
              "通話協商失敗，請重新撥打。"
            );
          }
        }
      }

    }


    /*
     * Caller / Callee ICE
     */

    if (
      isCaller
    ) {

      await applyRemoteIce(
        row.callee_ice
      );

    } else {

      await applyRemoteIce(
        row.caller_ice
      );
    }
  }


  /* ============================================================
     重新讀取 Call
     ============================================================ */

  async function refreshCallRow() {

    if (!callRowId) {
      return null;
    }

    try {

      var result =
        await supabase
          .from("call_sessions")
          .select("*")
          .eq("id", callRowId)
          .single();

      if (
        result.error ||
        !result.data
      ) {

        return null;
      }

      await handleCallUpdate(
        result.data
      );

      return result.data;

    } catch (error) {

      console.error(
        "refreshCallRow:",
        error
      );

      return null;
    }
  }


  /* ============================================================
     Polling
     ============================================================ */

  function startCallPolling() {

    if (pollTimer) {
      clearInterval(pollTimer);
    }

    pollTimer =
      setInterval(
        function () {

          if (
            !callRowId ||
            ending
          ) {

            return;
          }

          refreshCallRow();

        },
        1500
      );
  }


  /* ============================================================
     掛斷
     ============================================================ */

  async function hangup(
    updateDatabase
  ) {

    if (ending) {
      return;
    }

    ending = true;

    clearCallTimeout();

    stopRing();

    hideConnecting();

    if (pollTimer) {

      clearInterval(
        pollTimer
      );

      pollTimer = null;
    }

    if (incomingPollTimer) {

      clearInterval(
        incomingPollTimer
      );

      incomingPollTimer = null;
    }

    if (channel) {

      try {

        await supabase.removeChannel(
          channel
        );

      } catch (e) {}

      channel = null;
    }

    if (incomingChannel) {

      try {

        await supabase.removeChannel(
          incomingChannel
        );

      } catch (e) {}

      incomingChannel = null;
    }

    if (
      updateDatabase &&
      callRowId &&
      supabase
    ) {

      try {

        await supabase
          .from("call_sessions")
          .update({
            status: "ended"
          })
          .eq(
            "id",
            callRowId
          );

      } catch (e) {}
    }

    if (pc) {

      try {
        pc.ontrack = null;
        pc.onicecandidate = null;
        pc.close();
      } catch (e) {}

      pc = null;
    }

    if (localStream) {

      localStream
        .getTracks()
        .forEach(function (track) {

          try {
            track.stop();
          } catch (e) {}

        });

      localStream = null;
    }

    if (!cleaned) {

      cleaned = true;

      setTimeout(
        function () {

          location.href =
            "contacts.html";

        },
        100
      );
    }
  }


  /* ============================================================
     撥出
     ============================================================ */

  async function startAsCaller() {

    isCaller = true;

    clearError();

    setStatus(
      "準備撥號…"
    );

    startDialTone();


    /*
     * 取得媒體
     */

    try {

      await getMedia();

    } catch (error) {

      console.error(
        "getUserMedia:",
        error
      );

      stopRing();

      setStatus(
        "無法取得麥克風／相機"
      );

      showError(
        "請允許瀏覽器使用麥克風與相機。"
      );

      return;
    }


    /*
     * 建立 PeerConnection
     */

    try {

      showConnecting(
        "正在取得安全連線設定…"
      );

      await createPeerConnection(
        "caller"
      );

    } catch (error) {

      console.error(
        "建立 PeerConnection:",
        error
      );

      stopRing();

      hideConnecting();

      setStatus(
        "安全連線設定失敗"
      );

      showError(
        error.message ||
        "無法取得 TURN 連線設定。"
      );

      return;
    }


    /*
     * Offer
     */

    var offer;

    try {

      setStatus(
        "建立通話邀請…"
      );

      offer =
        await pc.createOffer();

      await pc.setLocalDescription(
        offer
      );

    } catch (error) {

      console.error(
        "createOffer:",
        error
      );

      stopRing();

      showError(
        "建立通話邀請失敗。"
      );

      return;
    }


    /*
     * 建立 Session
     */

    try {

      var insertResult =
        await supabase
          .from("call_sessions")
          .insert({
            caller_id: me.id,
            callee_id: toUser,
            mode: mode,
            status: "ringing",
            offer: {
              type:
                pc.localDescription.type,
              sdp:
                pc.localDescription.sdp
            },
            caller_ice: [],
            callee_ice: []
          })
          .select()
          .single();


      if (
        insertResult.error
      ) {

        console.error(
          "建立 call_sessions:",
          insertResult.error
        );

        stopRing();

        showError(
          "撥號失敗：" +
          insertResult.error.message
        );

        setStatus(
          "撥號失敗"
        );

        return;
      }


      callRowId =
        insertResult.data.id;


      /*
       * 把 Offer 建立之前
       * 暫存的 ICE 補送。
       */

      await flushLocalIce();


      subscribeCall();

      startCallPolling();

      startCallTimeout();

      setStatus(
        "等待對方接聽…"
      );

    } catch (error) {

      console.error(
        "建立通話:",
        error
      );

      stopRing();

      showError(
        "撥號失敗：" +
        (
          error.message ||
          error
        )
      );
    }
  }


  /* ============================================================
     顯示來電
     ============================================================ */

  function showIncoming(
    row
  ) {

    if (
      !row ||
      !row.id ||
      ending ||
      isCaller
    ) {

      return;
    }

    /*
     * 已經有同一通來電
     */

    if (
      callRowId === row.id &&
      document
        .getElementById(
          "incomingPanel"
        )
        .classList
        .contains("show")
    ) {

      return;
    }

    callRowId =
      row.id;

    mode =
      row.mode || "video";

    document
      .getElementById(
        "incomingSub"
      )
      .textContent =
        (
          mode === "audio"
            ? "語音"
            : "視訊"
        ) +
        "通話邀請";

    document
      .getElementById(
        "incomingPanel"
      )
      .classList
      .add("show");

    startIncomingRing();

    setStatus(
      "來電中"
    );

    subscribeCall();
  }


  /* ============================================================
     接聽
     ============================================================ */

  async function acceptCall() {

    if (
      !callRowId ||
      ending
    ) {

      return;
    }

    clearError();

    stopRing();

    document
      .getElementById(
        "incomingPanel"
      )
      .classList
      .remove("show");

    showConnecting(
      "正在接聽…"
    );

    setStatus(
      "接聽中…"
    );


    /*
     * 取得媒體
     */

    try {

      await getMedia();

    } catch (error) {

      console.error(
        "接聽 getUserMedia:",
        error
      );

      hideConnecting();

      setStatus(
        "無法取得麥克風／相機"
      );

      showError(
        "請允許瀏覽器使用麥克風與相機。"
      );

      return;
    }


    /*
     * 取得 PeerConnection / TURN
     */

    try {

      showConnecting(
        "正在建立安全連線…"
      );

      await createPeerConnection(
        "callee"
      );

    } catch (error) {

      console.error(
        "接聽建立 PeerConnection:",
        error
      );

      hideConnecting();

      setStatus(
        "安全連線設定失敗"
      );

      showError(
        error.message ||
        "無法取得 TURN 連線設定。"
      );

      return;
    }


    /*
     * 重新取得最新 Call Session
     */

    var result;

    try {

      result =
        await supabase
          .from("call_sessions")
          .select("*")
          .eq(
            "id",
            callRowId
          )
          .single();

    } catch (error) {

      console.error(error);

      showError(
        "無法取得來電資料。"
      );

      return;
    }


    if (
      result.error ||
      !result.data ||
      !result.data.offer
    ) {

      hideConnecting();

      setStatus(
        "來電已失效"
      );

      showError(
        "這通電話已經不存在或已經結束。"
      );

      return;
    }

    var row =
      result.data;


    /*
     * 設定 Caller Offer
     */

    try {

      await pc.setRemoteDescription(
        row.offer
      );

      remoteDescriptionSet =
        true;


      /*
       * Offer 已經設定完成，
       * 現在可以安全加入 Caller ICE。
       */

      await applyRemoteIce(
        row.caller_ice
      );

      await flushRemoteIce();


    } catch (error) {

      console.error(
        "setRemoteDescription:",
        error
      );

      hideConnecting();

      setStatus(
        "Offer 設定失敗"
      );

      showError(
        "無法建立通話協商。"
      );

      return;
    }


    /*
     * 建立 Answer
     */

    var answer;

    try {

      setStatus(
        "建立通話回覆…"
      );

      answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

    } catch (error) {

      console.error(
        "createAnswer:",
        error
      );

      hideConnecting();

      setStatus(
        "建立 Answer 失敗"
      );

      showError(
        "無法建立通話回覆。"
      );

      return;
    }


    /*
     * 更新 Session
     */

    try {

      var answerResult =
        await supabase
          .from("call_sessions")
          .update({
            status: "accepted",
            answer: {
              type:
                pc.localDescription.type,
              sdp:
                pc.localDescription.sdp
            }
          })
          .eq(
            "id",
            callRowId
          );

      if (
        answerResult.error
      ) {

        console.error(
          "更新 Answer:",
          answerResult.error
        );

        hideConnecting();

        setStatus(
          "回覆通話失敗"
        );

        showError(
          "無法將接聽結果送給對方。"
        );

        return;
      }

      /*
       * 本機 ICE 補送
       */

      await flushLocalIce();

      /*
       * 重新取得一次最新 ICE
       */

      await refreshCallRow();

      subscribeCall();

      startCallPolling();

      startCallTimeout();

      setStatus(
        "已接聽，等待建立媒體連線…"
      );

    } catch (error) {

      console.error(
        "acceptCall update:",
        error
      );

      hideConnecting();

      showError(
        "接聽失敗：" +
        (
          error.message ||
          error
        )
      );
    }
  }


  /* ============================================================
     拒接
     ============================================================ */

  async function rejectCall() {

    stopRing();

    if (
      callRowId &&
      supabase
    ) {

      try {

        await supabase
          .from("call_sessions")
          .update({
            status: "rejected"
          })
          .eq(
            "id",
            callRowId
          );

      } catch (error) {

        console.error(
          "rejectCall:",
          error
        );
      }
    }

    location.href =
      "contacts.html";
  }


  /* ============================================================
     監聽新來電
     ============================================================ */

  async function listenIncoming() {

    try {

      incomingChannel =
        supabase
          .channel(
            "incoming-calls-" +
            me.id +
            "-" +
            Date.now()
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "call_sessions",
              filter:
                "callee_id=eq." +
                me.id
            },
            function (payload) {

              if (
                payload &&
                payload.new &&
                payload.new.status ===
                "ringing"
              ) {

                showIncoming(
                  payload.new
                );
              }
            }
          )
          .subscribe(
            function (status) {

              console.log(
                "Incoming Realtime:",
                status
              );
            }
          );

    } catch (error) {

      console.error(
        "Incoming channel:",
        error
      );
    }


    /*
     * Realtime 備援輪詢
     */

    async function checkIncoming() {

      if (
        isCaller ||
        ending ||
        callRowId
      ) {

        return;
      }

      try {

        var result =
          await supabase
            .from("call_sessions")
            .select("*")
            .eq(
              "callee_id",
              me.id
            )
            .eq(
              "status",
              "ringing"
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            )
            .limit(1);

        if (
          result.data &&
          result.data.length
        ) {

          showIncoming(
            result.data[0]
          );
        }

      } catch (error) {

        console.error(
          "checkIncoming:",
          error
        );
      }
    }


    await checkIncoming();

    incomingPollTimer =
      setInterval(
        checkIncoming,
        2000
      );
  }


  /* ============================================================
     麥克風
     ============================================================ */

  document
    .getElementById("btnMic")
    .onclick =
      function () {

        if (!localStream) {
          return;
        }

        micOn =
          !micOn;

        localStream
          .getAudioTracks()
          .forEach(
            function (track) {

              track.enabled =
                micOn;

            }
          );

        var button =
          document.getElementById(
            "btnMic"
          );

        button.textContent =
          micOn
            ? "麥"
            : "靜音";

        button.classList.toggle(
          "off",
          !micOn
        );
      };


  /* ============================================================
     鏡頭
     ============================================================ */

  document
    .getElementById("btnCam")
    .onclick =
      function () {

        if (
          !localStream ||
          mode === "audio"
        ) {

          return;
        }

        camOn =
          !camOn;

        localStream
          .getVideoTracks()
          .forEach(
            function (track) {

              track.enabled =
                camOn;

            }
          );

        var button =
          document.getElementById(
            "btnCam"
          );

        button.textContent =
          camOn
            ? "鏡頭"
            : "關鏡";

        button.classList.toggle(
          "off",
          !camOn
        );
      };


  /* ============================================================
     掛斷按鈕
     ============================================================ */

  document
    .getElementById("btnHang")
    .onclick =
      function () {

        hangup(true);

      };


  /* ============================================================
     接聽 / 拒接
     ============================================================ */

  document
    .getElementById("btnAccept")
    .onclick =
      function () {

        acceptCall();

      };


  document
    .getElementById("btnReject")
    .onclick =
      function () {

        rejectCall();

      };


  /* ============================================================
     啟動
     ============================================================ */

  async function boot() {

    try {

      if (!window.supabase) {

        setStatus(
          "Supabase 套件載入失敗"
        );

        return;
      }


      /*
       * 建立 Supabase Client
       */

      supabase =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      /*
       * 驗證登入
       */

      var sessionResult =
        await supabase.auth.getSession();

      if (
        sessionResult.error
      ) {

        console.error(
          "getSession:",
          sessionResult.error
        );

        setStatus(
          "登入狀態取得失敗"
        );

        return;
      }


      if (
        !sessionResult.data ||
        !sessionResult.data.session
      ) {

        location.href =
          "login.html";

        return;
      }


      me =
        sessionResult
          .data
          .session
          .user;


      /*
       * 使用者第一次點擊時解除
       * iPhone / Safari AudioContext 限制。
       */

      document.body.addEventListener(
        "click",
        function () {

          ensureAudio();

        },
        {
          once: true
        }
      );


      /*
       * 監聽來電
       */

      await listenIncoming();


      /*
       * 有 to = 撥電話
       */

      if (toUser) {

        if (
          toUser === me.id
        ) {

          setStatus(
            "不能打給自己"
          );

          return;
        }

        await startAsCaller();

      } else {

        /*
         * 沒有 to：
         * 等待來電。
         */

        setStatus(
          "等待來電…"
        );
      }

    } catch (error) {

      console.error(
        "boot error:",
        error
      );

      setStatus(
        "通話初始化失敗"
      );

      showError(
        error.message ||
        "通話初始化失敗。"
      );
    }
  }


  /*
   * 開始
   */

  boot();

})();
</script>
