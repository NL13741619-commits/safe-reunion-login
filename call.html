<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通話 - 安全團聚</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111; color: #fff; height: 100vh; overflow: hidden; position: relative;
    }
    #remoteVideo {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #1a1a1a;
    }
    #localVideo {
      position: absolute; top: 56px; right: 12px; width: 100px; height: 140px;
      border-radius: 12px; object-fit: cover; transform: scaleX(-1);
      border: 2px solid rgba(255,255,255,0.55); z-index: 10; background: #333;
    }
    #audioBg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #1b5e20, #0d47a1);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; z-index: 1;
    }
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      padding: 48px 16px 14px; text-align: center;
      background: linear-gradient(rgba(0,0,0,0.55), transparent);
    }
    .top-name { font-size: 17px; font-weight: 600; }
    .top-status { font-size: 13px; opacity: 0.95; margin-top: 6px; }
    .controls {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      padding: 16px 12px 36px;
      background: linear-gradient(transparent, rgba(0,0,0,0.78));
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    }
    .ctrl {
      min-width: 54px; height: 54px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.22); color: #fff;
      font-size: 12px; font-weight: 600; padding: 0 8px;
    }
    .ctrl.off { background: #e53935; }
    .ctrl.hangup { background: #e53935; width: 58px; height: 58px; }
    .ctrl.accept { background: #06C755; width: 58px; height: 58px; }
    #incomingPanel {
      display: none; position: absolute; inset: 0; z-index: 30;
      background: rgba(0,0,0,0.88);
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #incomingPanel.show { display: flex; }
    #incomingPanel .big { font-size: 22px; font-weight: 700; }
  </style>
</head>
<body>
  <video id="remoteVideo" autoplay playsinline></video>
  <div id="audioBg">
    <div style="font-size:64px">📞</div>
    <div style="font-size:18px;font-weight:600">語音通話</div>
  </div>
  <video id="localVideo" autoplay playsinline muted></video>

  <div class="top-bar">
    <div class="top-name" id="callName">通話</div>
    <div class="top-status" id="callStatus">準備中…</div>
  </div>

  <div id="incomingPanel">
    <div class="big" id="incomingTitle">來電</div>
    <div id="incomingSub">邀請你通話</div>
    <div style="display:flex;gap:24px;margin-top:20px">
      <button class="ctrl hangup" type="button" id="btnReject">拒接</button>
      <button class="ctrl accept" type="button" id="btnAccept">接聽</button>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl" id="btnMic" type="button">麥</button>
    <button class="ctrl" id="btnCam" type="button">鏡頭</button>
    <button class="ctrl hangup" id="btnHang" type="button">掛斷</button>
  </div>

  <script>
  (function () {
    var SUPABASE_URL = 'https://perfsipperncvjocznhl.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';

    var params = new URLSearchParams(location.search);
    var mode = params.get('mode') || 'video';
    var toUser = params.get('to') || '';
    var callId = params.get('call') || '';
    var name = params.get('name') ? decodeURIComponent(params.get('name')) : '通話';
    document.getElementById('callName').textContent = name;

    var supabase = null;
    var me = null;
    var pc = null;
    var localStream = null;
    var callRowId = callId || null;
    var isCaller = false;
    var micOn = true, camOn = true;
    var ringTimer = null;
    var audioCtx = null;

    function setStatus(t) {
      document.getElementById('callStatus').textContent = t;
    }

    // ----- 鈴聲（免音檔）-----
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function beep(freq, dur, type) {
      try {
        var ctx = ensureAudio();
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        g.gain.value = 0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + (dur || 0.2));
      } catch (e) {}
    }
    function startDialTone() {
      stopRing();
      ringTimer = setInterval(function () {
        beep(440, 0.15); setTimeout(function () { beep(480, 0.15); }, 180);
      }, 1200);
    }
    function startIncomingRing() {
      stopRing();
      if (navigator.vibrate) navigator.vibrate([300, 200, 300, 200, 300]);
      ringTimer = setInterval(function () {
        beep(880, 0.25); setTimeout(function () { beep(980, 0.25); }, 300);
        if (navigator.vibrate) navigator.vibrate(200);
      }, 1500);
    }
    function stopRing() {
      if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
    }

    function iceServers() {
      return {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };
    }

    async function getMedia() {
      var constraints = mode === 'audio'
        ? { audio: true, video: false }
        : { audio: true, video: { facingMode: 'user' } };
      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      var localVideo = document.getElementById('localVideo');
      if (mode === 'audio') {
        document.getElementById('audioBg').style.display = 'flex';
        document.getElementById('remoteVideo').style.display = 'none';
        localVideo.style.display = 'none';
        document.getElementById('btnCam').style.display = 'none';
      } else {
        localVideo.srcObject = localStream;
        localVideo.style.display = 'block';
      }
      return localStream;
    }

    function createPc() {
      pc = new RTCPeerConnection(iceServers());
      localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });
      pc.ontrack = function (ev) {
        var remote = document.getElementById('remoteVideo');
        if (mode === 'audio') {
          // 語音：只接聲音
          remote.srcObject = ev.streams[0];
          remote.style.display = 'none';
        } else {
          remote.srcObject = ev.streams[0];
        }
        setStatus('通話中');
        stopRing();
      };
      pc.onicecandidate = function (ev) {
        // 簡化：依賴 SDP 內 candidate（無 trickle）；正式可再加 ICE 表
      };
      return pc;
    }

    async function hangup(updateDb) {
      stopRing();
      if (pc) { try { pc.close(); } catch (e) {} pc = null; }
      if (localStream) {
        localStream.getTracks().forEach(function (t) { t.stop(); });
        localStream = null;
      }
      if (updateDb && callRowId && supabase) {
        await supabase.from('call_sessions').update({ status: 'ended' }).eq('id', callRowId);
      }
      location.href = 'contacts.html';
    }

    async function startAsCaller() {
      isCaller = true;
      setStatus('撥號中…');
      startDialTone();
      await getMedia();
      createPc();

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      var ins = await supabase.from('call_sessions').insert({
        caller_id: me.id,
        callee_id: toUser,
        mode: mode,
        status: 'ringing',
        offer: offer
      }).select().single();

      if (ins.error) {
        stopRing();
        setStatus('撥號失敗：' + ins.error.message);
        return;
      }
      callRowId = ins.data.id;

      // 等對方 answer
      supabase.channel('call-' + callRowId)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'call_sessions',
          filter: 'id=eq.' + callRowId
        }, async function (payload) {
          var row = payload.new;
          if (row.status === 'rejected') {
            stopRing();
            setStatus('對方已拒接');
            setTimeout(function () { hangup(false); }, 1000);
            return;
          }
          if (row.status === 'ended') {
            hangup(false);
            return;
          }
          if (row.answer && pc && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(row.answer);
            setStatus('已接通');
            stopRing();
          }
        })
        .subscribe();
    }

    async function showIncoming(row) {
      callRowId = row.id;
      mode = row.mode || mode;
      document.getElementById('incomingPanel').classList.add('show');
      document.getElementById('incomingTitle').textContent = '來電';
      document.getElementById('incomingSub').textContent =
        (mode === 'audio' ? '語音' : '視訊') + '通話邀請';
      startIncomingRing();
      setStatus('來電中');
    }

    async function acceptCall() {
      stopRing();
      document.getElementById('incomingPanel').classList.remove('show');
      setStatus('接聽中…');
      await getMedia();
      createPc();

      var { data: row } = await supabase.from('call_sessions').select('*').eq('id', callRowId).single();
      if (!row || !row.offer) {
        setStatus('來電已失效');
        return;
      }
      await pc.setRemoteDescription(row.offer);
      var answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await supabase.from('call_sessions').update({
        status: 'accepted',
        answer: answer
      }).eq('id', callRowId);
      setStatus('通話中');
    }

    async function rejectCall() {
      stopRing();
      if (callRowId) {
        await supabase.from('call_sessions').update({ status: 'rejected' }).eq('id', callRowId);
      }
      location.href = 'contacts.html';
    }

    async function listenIncoming() {
      // 監聽打給我的來電
      supabase.channel('incoming-' + me.id)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'call_sessions',
          filter: 'callee_id=eq.' + me.id
        }, function (payload) {
          if (payload.new.status === 'ringing' && !isCaller) {
            showIncoming(payload.new);
          }
        })
        .subscribe();

      // 進頁時檢查是否已有未接 ringing
      var { data } = await supabase.from('call_sessions')
        .select('*')
        .eq('callee_id', me.id)
        .eq('status', 'ringing')
        .order('created_at', { ascending: false })
        .limit(1);
      if (data && data[0] && !toUser) {
        showIncoming(data[0]);
      }
    }

    document.getElementById('btnHang').onclick = function () { hangup(true); };
    document.getElementById('btnAccept').onclick = acceptCall;
    document.getElementById('btnReject').onclick = rejectCall;
    document.getElementById('btnMic').onclick = function () {
      if (!localStream) return;
      micOn = !micOn;
      localStream.getAudioTracks().forEach(function (t) { t.enabled = micOn; });
      document.getElementById('btnMic').textContent = micOn ? '麥' : '靜音';
      document.getElementById('btnMic').classList.toggle('off', !micOn);
    };
    document.getElementById('btnCam').onclick = function () {
      if (!localStream || mode === 'audio') return;
      camOn = !camOn;
      localStream.getVideoTracks().forEach(function (t) { t.enabled = camOn; });
      document.getElementById('btnCam').textContent = camOn ? '鏡頭' : '關鏡';
      document.getElementById('btnCam').classList.toggle('off', !camOn);
    };

    async function boot() {
      if (!window.supabase) {
        setStatus('套件載入失敗');
        return;
      }
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var sess = await supabase.auth.getSession();
      if (!sess.data.session) {
        location.href = 'login.html';
        return;
      }
      me = sess.data.session.user;

      // 使用者手勢後才能出聲：點頁任意處
      document.body.addEventListener('click', function once() {
        ensureAudio();
      }, { once: true });

      await listenIncoming();

      if (toUser) {
        if (toUser === me.id) {
          setStatus('不能打給自己');
          return;
        }
        await startAsCaller();
      } else if (callId) {
        var { data } = await supabase.from('call_sessions').select('*').eq('id', callId).single();
        if (data && data.status === 'ringing') showIncoming(data);
        else setStatus('等待來電或從通訊錄撥打');
      } else {
        setStatus('等待來電…（或從通訊錄按視訊）');
        // 本機預覽可選
        try {
          await getMedia();
        } catch (e) {
          setStatus('請允許麥克風／相機');
        }
      }
    }

    boot();
  })();
  </script>
</body>
</html>
