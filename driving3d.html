<script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   V3 CONFIG
========================================================= */

const CONFIG = {

  mapStyle:
    "https://tiles.openfreemap.org/styles/liberty",

  osrmProfile:
    "driving",

  osrmBase:
    "https://router.project-osrm.org",

  routeTable:
    "navigation_routes",

  stepTable:
    "navigation_route_steps",

  sessionTable:
    "navigation_sessions",

  cameraTable:
    "speed_cameras",

  routeCameraRadiusMeters:
    150,

  cameraLookAheadMeters:
    5000

};


/* =========================================================
   全域狀態
========================================================= */

let map = null;

let supabase = null;

let supabaseReady = false;

let gpsWatchId = null;

let currentLat = null;

let currentLng = null;

let currentHeading = 0;

let currentSpeed = 0;

let lastGPS = null;

let followMode = true;

let drivingMode = true;

let routeData = null;

let routeCoordinates = [];

let routeSteps = [];

let currentStepIndex = 0;

let routeId = null;

let sessionId = null;

let cachedCameras = [];

let routeRequestBusy = false;

let lastRouteLat = null;

let lastRouteLng = null;

let lastCameraCheck = 0;

let destination = null;


/* =========================================================
   工具
========================================================= */

function $(id) {

  return document.getElementById(id);

}


function clamp(value,min,max) {

  return Math.max(
    min,
    Math.min(max,value)
  );

}


function normalizeHeading(value) {

  return (
    (
      Number(value) % 360
    ) + 360
  ) % 360;

}


function formatDistance(meters) {

  meters = Number(meters) || 0;

  if (meters < 1000) {

    return Math.round(meters) + " 公尺";

  }

  return (
    (meters / 1000)
      .toFixed(1)
      .replace(".0","")
    + " 公里"
  );

}


/* =========================================================
   從 map.html 自動讀取 Supabase 設定
   不把 anon key 再寫死一份
========================================================= */

async function loadSupabaseConfig() {

  try {

    const response =
      await fetch(
        "map.html",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "無法讀取 map.html"
      );

    }

    const html =
      await response.text();


    let url = null;

    let key = null;


    const patterns = [

      /SUPABASE_URL\s*=\s*["'`]([^"'`]+)["'`]/,

      /supabaseUrl\s*[:=]\s*["'`]([^"'`]+)["'`]/

    ];


    const keyPatterns = [

      /SUPABASE_ANON_KEY\s*=\s*["'`]([^"'`]+)["'`]/,

      /SUPABASE_KEY\s*=\s*["'`]([^"'`]+)["'`]/,

      /supabaseKey\s*[:=]\s*["'`]([^"'`]+)["'`]/,

      /anonKey\s*[:=]\s*["'`]([^"'`]+)["'`]/

    ];


    for (
      const pattern of patterns
    ) {

      const match =
        html.match(pattern);

      if (match) {

        url =
          match[1];

        break;

      }

    }


    for (
      const pattern of keyPatterns
    ) {

      const match =
        html.match(pattern);

      if (match) {

        key =
          match[1];

        break;

      }

    }


    /*
       也支援直接從 createClient 找
    */

    if (!url || !key) {

      const createMatch =
        html.match(
          /createClient\s*\(\s*["'`]([^"'`]+)["'`]\s*,\s*["'`]([^"'`]+)["'`]/
        );

      if (createMatch) {

        url =
          createMatch[1];

        key =
          createMatch[2];

      }

    }


    if (
      !url ||
      !key
    ) {

      throw new Error(
        "找不到 Supabase 設定"
      );

    }


    return {
      url,
      key
    };

  } catch (error) {

    console.warn(
      "Supabase config:",
      error
    );

    return null;

  }

}


/* =========================================================
   初始化 Supabase
========================================================= */

async function initializeSupabase() {

  const config =
    await loadSupabaseConfig();


  if (!config) {

    $("gpsStatus").textContent =
      "GPS 已啟動｜Supabase 尚未連線";

    return;

  }


  try {

    supabase =
      window.supabase.createClient(
        config.url,
        config.key
      );

    supabaseReady = true;


    $("gpsStatus").textContent =
      "✓ GPS + Supabase 已啟動";

  } catch (error) {

    console.warn(
      "Supabase 初始化失敗:",
      error
    );

  }

}


/* =========================================================
   建立地圖
========================================================= */

function initializeMap() {

  map =
    new maplibregl.Map({

      container: "map",

      style:
        CONFIG.mapStyle,

      center: [
        121.5654,
        25.0330
      ],

      zoom: 17,

      pitch: 60,

      bearing: 0,

      maxPitch: 75,

      antialias: true

    });


  map.addControl(

    new maplibregl.NavigationControl({
      showCompass: true
    }),

    "top-right"

  );


  /*
     手動拖曳：
     立即停止 GPS 自動跟隨
  */

  map.on(
    "dragstart",
    function() {

      followMode = false;

      $("gpsStatus").textContent =
        "已暫停自動跟隨｜可查看前方道路";

    }
  );


  map.on(
    "load",
    function() {

      $("loading")
        .classList
        .add("hidden");

      $("gpsStatus").textContent =
        "3D 駕駛引擎已啟動｜等待 GPS";

      /*
         Route source
      */

      map.addSource(
        "navigation-route",
        {
          type: "geojson",

          data: {
            type: "FeatureCollection",
            features: []
          }
        }
      );


      map.addLayer({

        id: "navigation-route-outline",

        type: "line",

        source: "navigation-route",

        layout: {

          "line-cap": "round",

          "line-join": "round"

        },

        paint: {

          "line-color":
            "#ffffff",

          "line-width":
            9,

          "line-opacity":
            .75

        }

      });


      map.addLayer({

        id: "navigation-route",

        type: "line",

        source: "navigation-route",

        layout: {

          "line-cap": "round",

          "line-join": "round"

        },

        paint: {

          "line-color":
            "#16803c",

          "line-width":
            6,

          "line-opacity":
            .95

        }

      });


      /*
         測速照相
      */

      map.addSource(
        "speed-cameras",
        {
          type: "geojson",

          data: {
            type: "FeatureCollection",
            features: []
          }
        }
      );


      map.addLayer({

        id: "speed-cameras",

        type: "circle",

        source: "speed-cameras",

        paint: {

          "circle-radius": 7,

          "circle-color":
            "#e53935",

          "circle-stroke-color":
            "#ffffff",

          "circle-stroke-width":
            2

        }

      });


      /*
         Route arrows
      */

      map.addSource(
        "route-arrow",
        {
          type: "geojson",

          data: {
            type: "FeatureCollection",
            features: []
          }
        }
      );


      map.addLayer({

        id: "route-arrow",

        type: "symbol",

        source: "route-arrow",

        layout: {

          "text-field":
            "➤",

          "text-size":
            24,

          "text-rotate":
            [
              "get",
              "bearing"
            ],

          "text-allow-overlap":
            true

        },

        paint: {

          "text-color":
            "#ffffff",

          "text-halo-color":
            "#16803c",

          "text-halo-width":
            3

        }

      });

    }

  );

}


/* =========================================================
   距離
========================================================= */

function distanceBetween(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R = 6371000;

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dp =
    (lat2-lat1) *
    Math.PI /
    180;

  const dl =
    (lng2-lng1) *
    Math.PI /
    180;


  const a =

    Math.sin(dp/2) *
    Math.sin(dp/2)

    +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dl/2) *
    Math.sin(dl/2);


  return (

    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )

  );

}


/* =========================================================
   Bearing
========================================================= */

function calculateBearing(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dl =
    (lng2-lng1) *
    Math.PI /
    180;


  const y =
    Math.sin(dl) *
    Math.cos(p2);


  const x =

    Math.cos(p1) *
    Math.sin(p2)

    -

    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);


  return normalizeHeading(
    Math.atan2(y,x) *
    180 /
    Math.PI
  );

}


/* =========================================================
   最近 Route 點
========================================================= */

function findNearestRoutePoint(
  lat,
  lng
) {

  if (
    !routeCoordinates.length
  ) {

    return null;

  }


  let nearest = null;

  let bestDistance =
    Infinity;


  for (
    let i = 0;
    i < routeCoordinates.length;
    i++
  ) {

    const point =
      routeCoordinates[i];


    const d =
      distanceBetween(
        lat,
        lng,
        point[1],
        point[0]
      );


    if (
      d <
      bestDistance
    ) {

      bestDistance = d;

      nearest = {

        index: i,

        coordinate: point,

        distance: d

      };

    }

  }


  return nearest;

}


/* =========================================================
   Route arrows
========================================================= */

function updateRouteArrows() {

  if (
    !map ||
    !routeCoordinates.length
  ) {

    return;

  }


  const features = [];

  const gap = 15;


  for (
    let i = 0;
    i < routeCoordinates.length - 1;
    i += gap
  ) {

    const a =
      routeCoordinates[i];

    const b =
      routeCoordinates[
        Math.min(
          i + 2,
          routeCoordinates.length - 1
        )
      ];


    const bearing =
      calculateBearing(
        a[1],
        a[0],
        b[1],
        b[0]
      );


    features.push({

      type: "Feature",

      geometry: {

        type: "Point",

        coordinates: a

      },

      properties: {

        bearing:
          bearing

      }

    });

  }


  const source =
    map.getSource(
      "route-arrow"
    );


  if (source) {

    source.setData({

      type:
        "FeatureCollection",

      features

    });

  }

}


/* =========================================================
   Route 顯示
========================================================= */

function drawRoute(route) {

  if (
    !map ||
    !route ||
    !route.geometry
  ) {

    return;

  }


  routeCoordinates =
    route.geometry.coordinates ||
    [];


  const source =
    map.getSource(
      "navigation-route"
    );


  if (source) {

    source.setData({

      type: "Feature",

      geometry:
        route.geometry,

      properties: {}

    });

  }


  updateRouteArrows();

}


/* =========================================================
   Route 步驟
========================================================= */

function normalizeRouteSteps(route) {

  const steps = [];


  if (
    !route ||
    !route.legs
  ) {

    return steps;

  }


  for (
    const leg of route.legs
  ) {

    for (
      const step of (
        leg.steps || []
      )
    ) {

      steps.push(step);

    }

  }


  return steps;

}


/* =========================================================
   找目前下一個 step
========================================================= */

function updateCurrentStep() {

  if (
    !routeSteps.length ||
    currentLat === null
  ) {

    return;

  }


  let nearestStep =
    currentStepIndex;


  for (
    let i =
      currentStepIndex;

    i <
      routeSteps.length;

    i++
  ) {

    const step =
      routeSteps[i];


    const loc =
      step.maneuver &&
      step.maneuver.location;


    if (
      !loc
    ) {

      continue;

    }


    const d =
      distanceBetween(
        currentLat,
        currentLng,
        loc[1],
        loc[0]
      );


    if (
      d < 35
    ) {

      nearestStep =
        Math.min(
          i + 1,
          routeSteps.length - 1
        );

    }

  }


  currentStepIndex =
    nearestStep;


  const step =
    routeSteps[
      currentStepIndex
    ];


  if (!step) {

    return;

  }


  const maneuver =
    step.maneuver || {};


  const loc =
    maneuver.location;


  let distance = 0;


  if (loc) {

    distance =
      distanceBetween(
        currentLat,
        currentLng,
        loc[1],
        loc[0]
      );

  }


  const type =
    String(
      maneuver.type || ""
    );


  const modifier =
    String(
      maneuver.modifier || ""
    );


  let icon = "↑";

  let text = "直行";


  if (
    modifier.includes("left")
  ) {

    icon =
      modifier.includes("sharp")
        ? "↙"
        : modifier.includes("slight")
          ? "↖"
          : "←";

    text = "左轉";

  }


  if (
    modifier.includes("right")
  ) {

    icon =
      modifier.includes("sharp")
        ? "↘"
        : modifier.includes("slight")
          ? "↗"
          : "→";

    text = "右轉";

  }


  if (
    type === "roundabout" ||
    type === "rotary"
  ) {

    icon = "⟳";

    text = "進入圓環";

  }


  if (
    type === "arrive"
  ) {

    icon = "🏁";

    text = "即將抵達";

  }


  const road =
    step.name ||
    "前方道路";


  $("turnIcon").textContent =
    icon;

  $("turnText").textContent =
    text;

  $("roadName").textContent =
    road;

  $("distanceText").textContent =
    distance > 0
      ? "前方 " +
        formatDistance(distance)
      : "導航中";

}


/* =========================================================
   建立 Route
========================================================= */

async function requestRoute(
  startLat,
  startLng
) {

  if (
    !destination ||
    routeRequestBusy
  ) {

    return;

  }


  routeRequestBusy = true;


  try {

    const url =

      CONFIG.osrmBase +

      "/route/v1/" +

      CONFIG.osrmProfile +

      "/" +

      startLng +
      "," +
      startLat +
      ";" +
      destination.lng +
      "," +
      destination.lat +

      "?overview=full" +

      "&geometries=geojson" +

      "&steps=true" +

      "&alternatives=false";


    const response =
      await fetch(
        url
      );


    if (!response.ok) {

      throw new Error(
        "Route HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      data.code !== "Ok" ||
      !data.routes ||
      !data.routes[0]
    ) {

      throw new Error(
        "找不到道路 Route"
      );

    }


    const route =
      data.routes[0];


    routeData =
      route;


    routeSteps =
      normalizeRouteSteps(
        route
      );


    currentStepIndex =
      0;


    lastRouteLat =
      startLat;

    lastRouteLng =
      startLng;


    drawRoute(route);

    updateCurrentStep();


    await cacheRouteToSupabase(
      route
    );


    await loadRouteCameras(
      route
    );


    $("gpsStatus").textContent =
      "✓ 真實道路 Route 已建立";


  } catch (error) {

    console.error(
      "Route:",
      error
    );


    $("gpsStatus").textContent =
      "Route 建立失敗｜GPS 仍可使用";

  } finally {

    routeRequestBusy =
      false;

  }

}


/* =========================================================
   Supabase：建立 Session
========================================================= */

async function createNavigationSession() {

  if (
    !supabaseReady
  ) {

    return;

  }


  try {

    const row = {

      started_at:
        new Date().toISOString(),

      status:
        "active",

      mode:
        "3d"

    };


    const result =
      await supabase

        .from(
          CONFIG.sessionTable
        )

        .insert(row)

        .select("id")

        .single();


    if (
      result.error
    ) {

      console.warn(
        "navigation_sessions:",
        result.error
      );

      return;

    }


    sessionId =
      result.data.id;


  } catch (error) {

    console.warn(
      "Session:",
      error
    );

  }

}


/* =========================================================
   Supabase：Route 快取
========================================================= */

async function cacheRouteToSupabase(
  route
) {

  if (
    !supabaseReady ||
    !route
  ) {

    return;

  }


  try {

    const row = {

      session_id:
        sessionId,

      destination_lat:
        destination
          ? destination.lat
          : null,

      destination_lng:
        destination
          ? destination.lng
          : null,

      distance_m:
        route.distance || 0,

      duration_s:
        route.duration || 0,

      geometry:
        route.geometry || null,

      created_at:
        new Date().toISOString()

    };


    const result =
      await supabase

        .from(
          CONFIG.routeTable
        )

        .insert(row)

        .select("id")

        .single();


    if (
      result.error
    ) {

      console.warn(
        "navigation_routes:",
        result.error
      );

      return;

    }


    routeId =
      result.data.id;


    /*
       Route steps
    */

    const rows = [];


    let order = 0;


    for (
      const step of routeSteps
    ) {

      const maneuver =
        step.maneuver || {};


      rows.push({

        route_id:
          routeId,

        step_order:
          order++,

        name:
          step.name || "",

        distance_m:
          step.distance || 0,

        duration_s:
          step.duration || 0,

        maneuver_type:
          maneuver.type || "",

        maneuver_modifier:
          maneuver.modifier || "",

        maneuver_lat:
          maneuver.location
            ? maneuver.location[1]
            : null,

        maneuver_lng:
          maneuver.location
            ? maneuver.location[0]
            : null,

        geometry:
          step.geometry || null

      });

    }


    if (
      rows.length
    ) {

      const stepResult =
        await supabase

          .from(
            CONFIG.stepTable
          )

          .insert(rows);


      if (
        stepResult.error
      ) {

        console.warn(
          "navigation_route_steps:",
          stepResult.error
        );

      }

    }

  } catch (error) {

    console.warn(
      "Route cache:",
      error
    );

  }

}


/* =========================================================
   Route 附近測速照相
========================================================= */

async function loadRouteCameras(
  route
) {

  if (
    !supabaseReady ||
    !route ||
    !route.geometry
  ) {

    return;

  }


  const now =
    Date.now();


  if (
    now -
    lastCameraCheck <
    15000
  ) {

    return;

  }


  lastCameraCheck =
    now;


  try {

    /*
       先取得 Route bounding box
    */

    const coords =
      route.geometry.coordinates || [];


    if (
      !coords.length
    ) {

      return;

    }


    let minLat = 90;

    let maxLat = -90;

    let minLng = 180;

    let maxLng = -180;


    for (
      const point of coords
    ) {

      const lng =
        Number(point[0]);

      const lat =
        Number(point[1]);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        continue;

      }


      minLat =
        Math.min(
          minLat,
          lat
        );

      maxLat =
        Math.max(
          maxLat,
          lat
        );

      minLng =
        Math.min(
          minLng,
          lng
        );

      maxLng =
        Math.max(
          maxLng,
          lng
        );

    }


    /*
       留一點緩衝範圍
    */

    const buffer =
      0.003;


    minLat -= buffer;
    maxLat += buffer;

    minLng -= buffer;
    maxLng += buffer;


    /*
       你的 speed_cameras 欄位
       先使用 lat / lng
    */

    const result =
      await supabase

        .from(
          CONFIG.cameraTable
        )

        .select("*")

        .gte(
          "lat",
          minLat
        )

        .lte(
          "lat",
          maxLat
        )

        .gte(
          "lng",
          minLng
        )

        .lte(
          "lng",
          maxLng
        );


    if (
      result.error
    ) {

      console.warn(
        "speed_cameras:",
        result.error
      );

      return;

    }


    const cameras =
      result.data || [];


    /*
       再精確判斷：
       測速照相是否真的靠近 Route
    */

    cachedCameras =
      cameras.filter(
        camera => {

          const lat =
            Number(
              camera.lat
            );

          const lng =
            Number(
              camera.lng
            );


          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
          ) {

            return false;

          }


          let nearest =
            Infinity;


          /*
             不必掃整條 Route
             每隔數個點判斷
          */

          for (
            let i = 0;
            i < coords.length;
            i += 5
          ) {

            const point =
              coords[i];


            const d =
              distanceBetween(
                lat,
                lng,
                point[1],
                point[0]
              );


            nearest =
              Math.min(
                nearest,
                d
              );

            if (
              nearest <=
              CONFIG.routeCameraRadiusMeters
            ) {

              return true;

            }

          }


          return nearest <=
            CONFIG.routeCameraRadiusMeters;

        }
      );


    drawSpeedCameras();


  } catch (error) {

    console.warn(
      "Camera cache:",
      error
    );

  }

}


/* =========================================================
   顯示測速照相
========================================================= */

function drawSpeedCameras() {

  if (
    !map
  ) {

    return;

  }


  const features =
    cachedCameras.map(
      camera => {

        const lat =
          Number(
            camera.lat
          );

        const lng =
          Number(
            camera.lng
          );


        return {

          type: "Feature",

          geometry: {

            type: "Point",

            coordinates: [
              lng,
              lat
            ]

          },

          properties: {

            id:
              camera.id || "",

            speed:
              camera.speed_limit ||
              camera.limit ||
              ""

          }

        };

      }
    );


  const source =
    map.getSource(
      "speed-cameras"
    );


  if (source) {

    source.setData({

      type:
        "FeatureCollection",

      features

    });

  }

}


/* =========================================================
   檢查前方測速照相
========================================================= */

function updateCameraWarning() {

  if (
    !cachedCameras.length ||
    currentLat === null
  ) {

    $("cameraWarning")
      .classList
      .remove("show");

    return;

  }


  let nearest =
    null;

  let nearestDistance =
    Infinity;


  for (
    const camera of cachedCameras
  ) {

    const lat =
      Number(
        camera.lat
      );

    const lng =
      Number(
        camera.lng
      );


    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lng)
    ) {

      continue;

    }


    const d =
      distanceBetween(
        currentLat,
        currentLng,
        lat,
        lng
      );


    if (
      d <
      nearestDistance
    ) {

      nearestDistance =
        d;

      nearest =
        camera;

    }

  }


  /*
     先做距離警示。
     方向欄位等我們確認你資料實際欄位後，
     再接南北向精準判斷。
  */

  if (
    nearest &&
    nearestDistance <=
      CONFIG.cameraLookAheadMeters
  ) {

    $("cameraWarning").textContent =
      "⚠ 前方約 " +
      formatDistance(
        nearestDistance
      ) +
      " 測速照相";

    $("cameraWarning")
      .classList
      .add("show");

  } else {

    $("cameraWarning")
      .classList
      .remove("show");

  }

}


/* =========================================================
   駕駛攝影機
========================================================= */

function updateDrivingCamera() {

  if (
    !map ||
    currentLat === null ||
    !followMode
  ) {

    return;

  }


  /*
     使用 offset：
     把目前車輛視覺位置壓到畫面下方，
     讓前方道路佔據主要視野。
  */

  const height =
    window.innerHeight;


  const offsetY =
    Math.round(
      height * 0.23
    );


  map.easeTo({

    center: [
      currentLng,
      currentLat
    ],

    zoom: 18.2,

    pitch:
      drivingMode
        ? 60
        : 0,

    bearing:
      drivingMode
        ? currentHeading
        : 0,

    offset: [
      0,
      offsetY
    ],

    duration: 350,

    essential: true

  });

}


/* =========================================================
   GPS
========================================================= */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    $("gpsStatus").textContent =
      "此裝置不支援 GPS";

    return;

  }


  gpsWatchId =
    navigator.geolocation.watchPosition(

      handleGPS,

      function(error) {

        $("gpsStatus").textContent =
          "GPS：" +
          error.message;

      },

      {

        enableHighAccuracy:
          true,

        maximumAge:
          1000,

        timeout:
          15000

      }

    );

}


/* =========================================================
   GPS 更新
========================================================= */

async function handleGPS(
  position
) {

  const c =
    position.coords;


  const lat =
    Number(
      c.latitude
    );

  const lng =
    Number(
      c.longitude
    );


  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ) {

    return;

  }


  /*
     Speed
  */

  let speed =
    Number(
      c.speed
    );


  if (
    !Number.isFinite(speed) ||
    speed < 0
  ) {

    speed = 0;

  } else {

    speed *= 3.6;

  }


  currentSpeed =
    clamp(
      speed,
      0,
      200
    );


  /*
     Heading
  */

  let heading =
    Number(
      c.heading
    );


  if (
    !Number.isFinite(heading) &&
    lastGPS
  ) {

    const moved =
      distanceBetween(
        lastGPS.lat,
        lastGPS.lng,
        lat,
        lng
      );


    if (
      moved > 5
    ) {

      heading =
        calculateBearing(
          lastGPS.lat,
          lastGPS.lng,
          lat,
          lng
        );

    }

  }


  if (
    Number.isFinite(heading) &&
    (
      currentSpeed > 2 ||
      !lastGPS
    )
  ) {

    currentHeading =
      normalizeHeading(
        heading
      );

  }


  currentLat =
    lat;

  currentLng =
    lng;


  /*
     UI
  */

  $("speedValue").textContent =
    Math.round(
      currentSpeed
    );


  $("gpsStatus").textContent =
    "GPS ±" +
    Math.round(
      c.accuracy || 0
    ) +
    "m｜" +
    Math.round(
      currentHeading
    ) +
    "°";


  /*
     Route
  */

  if (
    destination &&
    !routeData &&
    !routeRequestBusy
  ) {

    await requestRoute(
      lat,
      lng
    );

  }


  /*
     如果離開 Route 太遠，
     重新計算
  */

  if (
    routeData &&
    !routeRequestBusy &&
    lastRouteLat !== null
  ) {

    const movedFromRouteStart =
      distanceBetween(
        lat,
        lng,
        lastRouteLat,
        lastRouteLng
      );


    if (
      movedFromRouteStart >
      800
    ) {

      await requestRoute(
        lat,
        lng
      );

    }

  }


  /*
     找 Route 上的位置
  */

  if (
    routeCoordinates.length
  ) {

    const nearest =
      findNearestRoutePoint(
        lat,
        lng
      );


    if (
      nearest &&
      nearest.distance >
      120
    ) {

      /*
         GPS 明顯偏離道路。
         不立刻旋轉畫面，
         等下一次 GPS。
      */

    }

  }


  updateCurrentStep();

  updateCameraWarning();


  if (
    followMode
  ) {

    updateDrivingCamera();

  }


  lastGPS = {

    lat,
    lng,

    time:
      position.timestamp

  };

}


/* =========================================================
   目的地
========================================================= */

function readDestination() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const lat =
    Number(
      params.get(
        "destLat"
      )
    );


  const lng =
    Number(
      params.get(
        "destLng"
      )
    );


  if (
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    Math.abs(lat) <= 90 &&
    Math.abs(lng) <= 180
  ) {

    return {

      lat,
      lng

    };

  }


  return null;

}


/* =========================================================
   如果沒有目的地
========================================================= */

function showWaitingDestination() {

  $("turnIcon").textContent =
    "↑";

  $("turnText").textContent =
    "駕駛模式";

  $("roadName").textContent =
    "等待導航目的地";

  $("distanceText").textContent =
    "由 map.html 傳入目的地後開始 Route";

}


/* =========================================================
   按鈕：回到駕駛
========================================================= */

$("followButton")
  .addEventListener(
    "click",
    function() {

      followMode =
        true;

      drivingMode =
        true;

      this.textContent =
        "🎯 已回到駕駛";

      $("modeButton").textContent =
        "🗺️ 平面";


      updateDrivingCamera();


      setTimeout(
        () => {

          this.textContent =
            "🎯 回到駕駛";

        },
        1200
      );

    }
  );


/* =========================================================
   按鈕：3D / 平面
========================================================= */

$("modeButton")
  .addEventListener(
    "click",
    function() {

      drivingMode =
        !drivingMode;


      if (
        drivingMode
      ) {

        followMode =
          true;

        this.textContent =
          "🗺️ 平面";

        updateDrivingCamera();

      } else {

        followMode =
          false;

        this.textContent =
          "🚗 3D";

        if (map) {

          map.easeTo({

            pitch: 0,

            duration: 350,

            essential: true

          });

        }

      }

    }
  );


/* =========================================================
   返回 map.html
========================================================= */

$("backButton")
  .addEventListener(
    "click",
    function() {

      window.location.href =
        "map.html";

    }
  );


/* =========================================================
   啟動
========================================================= */

async function startApplication() {

  destination =
    readDestination();


  initializeMap();


  await initializeSupabase();


  await createNavigationSession();


  startGPS();


  if (!destination) {

    showWaitingDestination();

  }

}


startApplication();

</script>
