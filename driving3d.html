<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no”

<title>安全團聚｜3D 駕駛</title>
<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css"
>
<style>
*{
  box-sizing:border-box;
}
html,
body,
#map{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}
body{
  background:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    sans-serif;
}
/* ===============================
   頂部資訊
================================ */
#navBox{
  position:fixed;
  top:
    max(
      12px,
      env(safe-area-inset-top)
    );
  left:12px;
  right:12px;
  z-index:100;
  display:flex;
  justify-content:center;
  pointer-events:none;
}
#navCard{
  min-width:230px;
  max-width:90%;
  padding:
    10px
    18px;
  border-radius:14px;
  background:#16803c;
  color:white;
  text-align:center;
  box-shadow:
    0 4px 16px
    rgba(0,0,0,.4);
}
#navMain{
  font-size:21px;
  font-weight:900;
}
#navSub{
  margin-top:4px;
  font-size:13px;
}
/* ===============================
   車輛
================================ */
#car{
  position:fixed;
  left:50%;
  bottom:18%;
  transform:
    translateX(-50%);
  width:52px;
  height:72px;
  z-index:90;
  pointer-events:none;
}
#carBody{
  position:absolute;
  left:9px;
  top:0;
  width:34px;
  height:66px;
  border-radius:
    16px
    16px
    8px
    8px;
  background:#06C755;
  border:3px solid white;
  box-shadow:
    0 4px 7px
    rgba(0,0,0,.5);
}
#carWindow{
  position:absolute;
  left:16px;
  top:9px;
  width:20px;
  height:24px;
  border-radius:7px;
  background:white;
}
/* ===============================
   速度
================================ */
#speedBox{
  position:fixed;
  left:14px;
  bottom:
    max(
      18px,
      env(safe-area-inset-bottom)
    );
  width:94px;
  height:94px;
  z-index:100;
  border-radius:50%;
  background:white;
  border:5px solid #16803c;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:
    0 4px 16px
    rgba(0,0,0,.4);
}
#speed{
  font-size:31px;
  font-weight:900;
  line-height:1;
}
#speedUnit{
  margin-top:5px;
  font-size:11px;
  color:#555;
}
/* ===============================
   按鈕
================================ */
#buttons{
  position:fixed;
  right:12px;
  top:
    max(
      78px,
      calc(
        env(safe-area-inset-top)
        + 68px
      )
    );
  z-index:110;
  display:flex;
  flex-direction:column;
  gap:8px;
}
button{
  border:0;
  border-radius:11px;
  padding:
    10px
    13px;
  background:
    rgba(255,255,255,.96);
  font-size:13px;
  font-weight:700;
  box-shadow:
    0 3px 12px
    rgba(0,0,0,.35);
}
/* ===============================
   GPS
================================ */
#gps{
  position:fixed;
  right:12px;
  bottom:
    max(
      18px,
      env(safe-area-inset-bottom)
    );
  z-index:100;
  padding:
    8px
    11px;
  border-radius:10px;
  background:
    rgba(0,0,0,.7);
  color:white;
  font-size:11px;
  text-align:right;
}
/* ===============================
   Loading
================================ */
#loading{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    rgba(0,0,0,.75);
  color:white;
}
#loadingCard{
  width:
    min(
      320px,
      88%
    );
  padding:24px;
  border-radius:16px;
  background:
    #1d1d1d;
  text-align:center;
}
#loadingTitle{
  font-size:21px;
  font-weight:900;
  margin-bottom:10px;
}
#loadingText{
  font-size:13px;
  line-height:1.7;
}
#loading.hidden{
  display:none;
}
</style>
</head>
<body>
<div id="map"></div>
<div id="navBox">
  <div id="navCard">
<div id="navMain">
  🚗 3D 駕駛模式
</div>
<div id="navSub">
  正在定位…
</div>
  </div>
</div>
<div id="car">
  <div id="carBody"></div>
  <div id="carWindow"></div>
</div>
<div id="buttons">
  <button id="driverBtn">
    🚗 駕駛視角
  </button>
  <button id="flatBtn">
    🗺️ 平面
  </button>
  <button id="backBtn">
    ← 返回地圖
  </button>
</div>
<div id="speedBox">
  <div id="speed">
    0
  </div>
  <div id="speedUnit">
    km/h
  </div>
</div>
<div id="gps">
  GPS 定位中…
</div>
<div id="loading">
  <div id="loadingCard">
<div id="loadingTitle">
  🚗 3D 駕駛模式
</div>
<div id="loadingText">
  正在載入地圖…
</div>
  </div>
</div>
<script type="module">
import maplibregl
from
"https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";
/* =====================================================
   基本資料
===================================================== */
let map;
let watchId = null;
let latitude = 25.0330;
let longitude = 121.5654;
let heading = 0;
let speed = 0;
let lastPosition = null;
let driving = true;
/* =====================================================
   DOM
===================================================== */
const loading =
  document.getElementById(
    "loading"
  );
const loadingText =
  document.getElementById(
    "loadingText"
  );
const navMain =
  document.getElementById(
    "navMain"
  );
const navSub =
  document.getElementById(
    "navSub"
  );
const speedEl =
  document.getElementById(
    "speed"
  );
const gpsEl =
  document.getElementById(
    "gps"
  );
/* =====================================================
   隱藏 Loading
===================================================== */
function hideLoading(){
  loading.classList.add(
    "hidden"
  );
}
/* =====================================================
   建立 MapLibre
===================================================== */
function initMap(){
  map =
    new maplibregl.Map({
      container:
        "map",
      style:
        "https://tiles.openfreemap.org/styles/liberty",
      center:[
        longitude,
        latitude
      ],
      zoom:16.5,
      pitch:65,
      bearing:heading,
      antialias:true,
      attributionControl:true
    });
  map.on(
    "load",
    function(){
      hideLoading();
      navMain.textContent =
        "🚗 3D 駕駛模式";
      navSub.textContent =
        "MapLibre WebGL 已啟動";
    }
  );
  map.on(
    "error",
    function(e){
      console.error(
        "MapLibre:",
        e
      );
    }
  );
}
/* =====================================================
   距離
===================================================== */
function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){
  const R = 6371000;
  const p1 =
    lat1 *
    Math.PI /
    180;
  const p2 =
    lat2 *
    Math.PI /
    180;
  const dp =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;
  const dl =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;
  const a =
    Math.sin(dp / 2) ** 2
    +
    Math.cos(p1)
    *
    Math.cos(p2)
    *
    Math.sin(dl / 2) ** 2;
  return
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );
}
/* =====================================================
   方位
===================================================== */
function getBearing(
  lat1,
  lon1,
  lat2,
  lon2
){
  const p1 =
    lat1 *
    Math.PI /
    180;
  const p2 =
    lat2 *
    Math.PI /
    180;
  const dl =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;
  const y =
    Math.sin(dl)
    *
    Math.cos(p2);
  const x =
    Math.cos(p1)
    *
    Math.sin(p2)
    -
    Math.sin(p1)
    *
    Math.cos(p2)
    *
    Math.cos(dl);
  return (
    Math.atan2(y,x)
    *
    180 /
    Math.PI
    +
    360
  ) % 360;
}
/* =====================================================
   GPS
===================================================== */
function startGPS(){
  if(
    !navigator.geolocation
  ){
    gpsEl.textContent =
      "裝置不支援 GPS";
    return;
  }
  watchId =
    navigator.geolocation.watchPosition(
      onPosition,
      function(error){
        console.warn(
          "GPS error",
          error
        );
        gpsEl.textContent =
          "GPS 無法定位";
      },
      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:15000
      }
    );
}
/* =====================================================
   GPS Position
===================================================== */
function onPosition(
  position
){
  const c =
    position.coords;
  const lat =
    Number(
      c.latitude
    );
  const lon =
    Number(
      c.longitude
    );
  const accuracy =
    Number(
      c.accuracy
    );
  if(
    !Number.isFinite(lat)
    ||
    !Number.isFinite(lon)
  ){
    return;
  }
  /* =========================
     速度
  ========================= */
  let newSpeed =
    Number(
      c.speed
    );
  if(
    Number.isFinite(newSpeed)
    &&
    newSpeed >= 0
  ){
    newSpeed *= 3.6;
  }else if(
    lastPosition
  ){
    const d =
      distanceMeters(
        lastPosition.coords.latitude,
        lastPosition.coords.longitude,
        lat,
        lon
      );
    const dt =
      (
        position.timestamp
        -
        lastPosition.timestamp
      ) / 1000;
    if(
      dt > 0
      &&
      dt < 10
    ){
      newSpeed =
        d /
        dt *
        3.6;
    }else{
      newSpeed = 0;
    }
  }else{
    newSpeed = 0;
  }
  if(
    !Number.isFinite(newSpeed)
    ||
    newSpeed < 0
  ){
    newSpeed = 0;
  }
  if(newSpeed > 200)
    newSpeed = 200;
  speed =
    speed * .65
    +
    newSpeed * .35;
  /* =========================
     方向
  ========================= */
  let newHeading =
    Number(
      c.heading
    );
  if(
    !Number.isFinite(newHeading)
    &&
    lastPosition
  ){
    const moved =
      distanceMeters(
        lastPosition.coords.latitude,
        lastPosition.coords.longitude,
        lat,
        lon
      );
    if(moved >= 5){
      newHeading =
        getBearing(
          lastPosition.coords.latitude,
          lastPosition.coords.longitude,
          lat,
          lon
        );
    }
  }
  if(
    Number.isFinite(newHeading)
    &&
    speed >= 3
  ){
    heading =
      newHeading;
  }
  latitude =
    lat;
  longitude =
    lon;
  /* =========================
     UI
  ========================= */
  speedEl.textContent =
    Math.round(
      speed
    );
  gpsEl.innerHTML =
    "GPS ±"
    +
    (
      Number.isFinite(
        accuracy
      )
      ?
      Math.round(
        accuracy
      )
      :
      "--"
    )
    +
    "m<br>"
    +
    Math.round(
      heading
    )
    +
    "°";
  navSub.textContent =
    "行駛方向 "
    +
    Math.round(
      heading
    )
    +
    "°";
  /* =========================
     駕駛相機
  ========================= */
  if(
    map
    &&
    driving
  ){
    map.easeTo({
      center:[
        longitude,
        latitude
      ],
      zoom:18,
      pitch:68,
      bearing:heading,
      duration:300,
      essential:true
    });
  }
  lastPosition =
    position;
}
/* =====================================================
   駕駛模式
===================================================== */
document
  .getElementById(
    "driverBtn"
  )
  .onclick =
  function(){
    driving = true;
    if(!map)
      return;
    map.easeTo({
      center:[
        longitude,
        latitude
      ],
      zoom:18,
      pitch:68,
      bearing:heading,
      duration:500,
      essential:true
    });
  };
/* =====================================================
   平面模式
===================================================== */
document
  .getElementById(
    "flatBtn"
  )
  .onclick =
  function(){
    driving = false;
    if(!map)
      return;
    map.easeTo({
      center:[
        longitude,
        latitude
      ],
      zoom:16,
      pitch:0,
      bearing:0,
      duration:500,
      essential:true
    });
  };
/* =====================================================
   返回
===================================================== */
document
  .getElementById(
    "backBtn"
  )
  .onclick =
  function(){
    if(
      document.referrer
    ){
      history.back();
    }else{
      location.href =
        "map.html";
    }
  };
/* =====================================================
   啟動
===================================================== */
initMap();
startGPS();
/* =====================================================
   清理 GPS
===================================================== */
window.addEventListener(
  "beforeunload",
  function(){
    if(
      watchId !== null
    ){
      navigator
        .geolocation
        .clearWatch(
          watchId
        );
    }
  }
);
</script>
</body>
</html>
