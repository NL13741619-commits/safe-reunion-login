<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>安全團聚｜3D 駕駛</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css"
>

<style>

html,
body,
#map {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body {
  background:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    sans-serif;
}

/* =====================================================
   頂部導航卡
===================================================== */

#navPanel {

  position:absolute;

  z-index:100;

  top:calc(env(safe-area-inset-top) + 10px);

  left:10px;
  right:10px;

  pointer-events:none;

}

#navCard {

  width:fit-content;

  max-width:92%;

  margin:auto;

  padding:10px 20px;

  border-radius:14px;

  background:rgba(18,128,60,.97);

  color:white;

  text-align:center;

  box-shadow:
    0 4px 16px rgba(0,0,0,.45);

}

#turnIcon {

  font-size:30px;

  font-weight:900;

  line-height:1;

}

#roadName {

  margin-top:3px;

  font-size:15px;

  font-weight:800;

}

#distanceText {

  margin-top:2px;

  font-size:13px;

  opacity:.95;

}


/* =====================================================
   駕駛速度
===================================================== */

#speedCircle {

  position:absolute;

  z-index:100;

  left:14px;

  bottom:calc(env(safe-area-inset-bottom) + 18px);

  width:88px;

  height:88px;

  border-radius:50%;

  background:white;

  border:5px solid #16803c;

  box-shadow:
    0 4px 16px rgba(0,0,0,.5);

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

}

#speedValue {

  font-size:31px;

  line-height:1;

  font-weight:900;

}

#speedUnit {

  margin-top:4px;

  font-size:11px;

  color:#555;

}


/* =====================================================
   右側按鈕
===================================================== */

#buttons {

  position:absolute;

  z-index:110;

  right:12px;

  bottom:calc(env(safe-area-inset-bottom) + 18px);

  display:flex;

  flex-direction:column;

  gap:8px;

}

.navButton {

  min-width:100px;

  min-height:45px;

  border:0;

  border-radius:12px;

  background:white;

  color:#222;

  font-size:14px;

  font-weight:800;

  box-shadow:
    0 3px 12px rgba(0,0,0,.4);

}

.navButton:active {

  transform:scale(.96);

}


/* =====================================================
   GPS 狀態
===================================================== */

#gpsStatus {

  position:absolute;

  z-index:100;

  left:112px;

  right:120px;

  bottom:calc(env(safe-area-inset-bottom) + 21px);

  padding:8px 10px;

  border-radius:9px;

  background:rgba(0,0,0,.7);

  color:white;

  font-size:12px;

  text-align:center;

}


/* =====================================================
   駕駛模式中央車輛
===================================================== */

#vehicle {

  position:absolute;

  z-index:90;

  left:50%;

  bottom:27%;

  transform:translateX(-50%);

  width:34px;

  height:58px;

  pointer-events:none;

}

#vehicle::before {

  content:"";

  position:absolute;

  left:3px;

  top:0;

  width:28px;

  height:52px;

  border-radius:
    13px
    13px
    8px
    8px;

  background:#06C755;

  border:3px solid white;

  box-shadow:
    0 3px 9px rgba(0,0,0,.55);

}

#vehicle::after {

  content:"";

  position:absolute;

  left:10px;

  top:7px;

  width:14px;

  height:20px;

  border-radius:6px;

  background:#dff8ff;

}


/* =====================================================
   前方道路光暈
===================================================== */

#roadGlow {

  position:absolute;

  z-index:50;

  pointer-events:none;

  left:50%;

  bottom:0;

  transform:translateX(-50%);

  width:70%;

  height:45%;

  background:
    linear-gradient(
      to top,
      rgba(255,255,255,.12),
      rgba(255,255,255,0)
    );

}


/* =====================================================
   返回按鈕特別提高層級
===================================================== */

#backButton {

  position:absolute;

  z-index:9999;

  top:calc(env(safe-area-inset-top) + 10px);

  left:10px;

  min-width:78px;

  min-height:44px;

  border:0;

  border-radius:11px;

  background:white;

  font-size:14px;

  font-weight:900;

  box-shadow:
    0 3px 12px rgba(0,0,0,.45);

}

</style>
</head>

<body>

<div id="map"></div>


<button
  id="backButton"
  type="button">
  ← 地圖
</button>


<div id="navPanel">

  <div id="navCard">

    <div id="turnIcon">
      ↑
    </div>

    <div id="roadName">
      駕駛模式
    </div>

    <div id="distanceText">
      正在取得 GPS…
    </div>

  </div>

</div>


<div id="vehicle"></div>

<div id="roadGlow"></div>


<div id="speedCircle">

  <div id="speedValue">
    0
  </div>

  <div id="speedUnit">
    km/h
  </div>

</div>


<div id="gpsStatus">
  正在啟動 GPS…
</div>


<div id="buttons">

  <button
    class="navButton"
    id="followButton"
    type="button">
    🎯 回到駕駛
  </button>

  <button
    class="navButton"
    id="modeButton"
    type="button">
    🗺️ 平面
  </button>

</div>


<script
  src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js">
</script>


<script>

let map = null;


/* =====================================================
   GPS 狀態
===================================================== */

let currentLat = null;

let currentLng = null;

let currentHeading = 0;

let currentSpeed = 0;

let lastGPS = null;


/* =====================================================
   駕駛模式
===================================================== */

let drivingMode = true;

let followMode = true;


/* =====================================================
   建立地圖
===================================================== */

function createMap() {

  map = new maplibregl.Map({

    container:"map",

    style:
      "https://tiles.openfreemap.org/styles/liberty",

    center:[
      121.5654,
      25.0330
    ],

    zoom:17,

    pitch:68,

    bearing:0,

    maxPitch:75,

    antialias:true

  });


  map.addControl(

    new maplibregl.NavigationControl({
      showCompass:true
    }),

    "top-right"

  );


  /*
     使用者開始拖曳地圖
     → 解除自動跟隨
  */

  map.on(
    "dragstart",
    function(){

      followMode=false;

      document.getElementById(
        "gpsStatus"
      ).textContent =
        "已暫停跟隨｜拖動查看前方道路";

    }
  );


  map.on(
    "load",
    function(){

      document.getElementById(
        "gpsStatus"
      ).textContent =
        "✓ 3D 駕駛畫面已啟動";

    }
  );

}


/* =====================================================
   距離
===================================================== */

function distanceBetween(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R=6371000;

  const p1 =
    lat1*Math.PI/180;

  const p2 =
    lat2*Math.PI/180;

  const dp =
    (lat2-lat1)*Math.PI/180;

  const dl =
    (lng2-lng1)*Math.PI/180;

  const a =

    Math.sin(dp/2)**2 +

    Math.cos(p1)*
    Math.cos(p2)*

    Math.sin(dl/2)**2;

  return (

    R *

    2 *

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )

  );

}


/* =====================================================
   計算方向
===================================================== */

function calculateBearing(
  lat1,
  lng1,
  lat2,
  lng2
){

  const p1 =
    lat1*Math.PI/180;

  const p2 =
    lat2*Math.PI/180;

  const dl =
    (lng2-lng1)*Math.PI/180;

  const y =
    Math.sin(dl)*
    Math.cos(p2);

  const x =

    Math.cos(p1)*
    Math.sin(p2)

    -

    Math.sin(p1)*
    Math.cos(p2)*
    Math.cos(dl);

  return (

    Math.atan2(y,x)*
    180/
    Math.PI+

    360

  )%360;

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "裝置不支援 GPS";

    return;

  }


  navigator.geolocation.watchPosition(

    handleGPS,

    function(error){

      document.getElementById(
        "gpsStatus"
      ).textContent =
        "GPS：" +
        error.message;

    },

    {

      enableHighAccuracy:true,

      maximumAge:1000,

      timeout:15000

    }

  );

}


/* =====================================================
   GPS 更新
===================================================== */

function handleGPS(position){

  const c =
    position.coords;


  const lat =
    Number(c.latitude);

  const lng =
    Number(c.longitude);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){
    return;
  }


  /* -------------------------------
     速度
  -------------------------------- */

  let speed =
    Number(c.speed);


  if(
    !Number.isFinite(speed) ||
    speed<0
  ){

    speed=0;

  }else{

    speed*=3.6;

  }


  currentSpeed =
    Math.min(
      200,
      Math.max(
        0,
        speed
      )
    );


  /* -------------------------------
     方向
  -------------------------------- */

  let heading =
    Number(c.heading);


  if(
    !Number.isFinite(heading) &&
    lastGPS
  ){

    const moved =
      distanceBetween(

        lastGPS.lat,
        lastGPS.lng,

        lat,
        lng

      );


    if(moved>5){

      heading =
        calculateBearing(

          lastGPS.lat,
          lastGPS.lng,

          lat,
          lng

        );

    }

  }


  if(
    Number.isFinite(heading) &&
    currentSpeed>2
  ){

    currentHeading =
      heading;

  }


  currentLat=lat;

  currentLng=lng;


  /* -------------------------------
     UI
  -------------------------------- */

  document.getElementById(
    "speedValue"
  ).textContent =
    Math.round(
      currentSpeed
    );


  document.getElementById(
    "gpsStatus"
  ).textContent =
    "GPS ±"+
    Math.round(
      c.accuracy||0
    )+
    "m｜"+
    Math.round(
      currentHeading
    )+
    "°";


  /* -------------------------------
     地圖中心
  -------------------------------- */

  if(
    followMode
  ){

    updateDrivingCamera();

  }


  lastGPS={
    lat,
    lng,
    time:position.timestamp
  };

}


/* =====================================================
   駕駛攝影機
===================================================== */

function updateDrivingCamera(){

  if(
    !map ||
    currentLat===null ||
    !followMode
  ){

    return;

  }


  map.easeTo({

    center:[
      currentLng,
      currentLat
    ],

    zoom:18,

    pitch:
      drivingMode
        ? 70
        : 0,

    bearing:
      drivingMode
        ? currentHeading
        : 0,

    duration:250,

    essential:true

  });

}


/* =====================================================
   回到駕駛
===================================================== */

document
  .getElementById(
    "followButton"
  )
  .addEventListener(
    "click",
    function(){

      followMode=true;

      drivingMode=true;

      document.getElementById(
        "modeButton"
      ).textContent =
        "🗺️ 平面";

      updateDrivingCamera();

    }
  );


/* =====================================================
   3D / 平面
===================================================== */

document
  .getElementById(
    "modeButton"
  )
  .addEventListener(
    "click",
    function(){

      drivingMode=
        !drivingMode;

      if(
        drivingMode
      ){

        this.textContent=
          "🗺️ 平面";

        followMode=true;

      }else{

        this.textContent=
          "🚗 3D";

        followMode=false;

      }

      updateDrivingCamera();

    }
  );


/* =====================================================
   返回 map.html
===================================================== */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    function(){

      window.location.replace(
        "map.html"
      );

    }
  );


/* =====================================================
   啟動
===================================================== */

createMap();

startGPS();

</script>

</body>
</html>
