<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>安全團聚｜3D 駕駛模式 V4.1</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css"
>

<style>
* {
  box-sizing: border-box;
}

html,
body,
#map {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #101010;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    sans-serif;
}

/* =====================================================
   地圖
===================================================== */

#map {
  position: absolute;
  inset: 0;
}

/* =====================================================
   返回地圖
===================================================== */

#backButton {
  position: absolute;
  z-index: 9999;

  top: calc(env(safe-area-inset-top) + 10px);
  left: 10px;

  min-width: 78px;
  min-height: 44px;

  padding: 8px 12px;

  border: 0;
  border-radius: 12px;

  background: rgba(255,255,255,.96);
  color: #222;

  font-size: 14px;
  font-weight: 900;

  box-shadow:
    0 3px 12px rgba(0,0,0,.4);
}

/* =====================================================
   頂部導航
===================================================== */

#navPanel {
  position: absolute;
  z-index: 500;

  top: calc(env(safe-area-inset-top) + 10px);

  left: 96px;
  right: 10px;

  pointer-events: none;
}

#navCard {
  width: fit-content;
  max-width: 100%;

  margin: 0 auto;

  padding: 8px 18px;

  border-radius: 14px;

  background: rgba(19,126,59,.97);
  color: white;

  text-align: center;

  box-shadow:
    0 4px 16px rgba(0,0,0,.4);
}

#turnIcon {
  font-size: 30px;
  line-height: 1;

  font-weight: 900;
}

#roadName {
  margin-top: 3px;

  max-width: 260px;

  font-size: 15px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#distanceText {
  margin-top: 3px;

  font-size: 13px;
}

/* =====================================================
   車輛
===================================================== */

#vehicle {
  position: absolute;

  z-index: 900;

  left: 50%;
  bottom: 14%;

  width: 52px;
  height: 82px;

  transform:
    translateX(-50%);

  pointer-events: none;

  filter:
    drop-shadow(
      0 5px 8px rgba(0,0,0,.45)
    );
}

#vehicleBody {
  position: absolute;

  left: 6px;
  top: 4px;

  width: 40px;
  height: 72px;

  border-radius:
    18px
    18px
    11px
    11px;

  background:
    linear-gradient(
      to bottom,
      #18d66c 0%,
      #06b957 65%,
      #07883e 100%
    );

  border: 3px solid white;
}

#vehicleGlass {
  position: absolute;

  left: 13px;
  top: 12px;

  width: 26px;
  height: 26px;

  border-radius:
    9px
    9px
    6px
    6px;

  background:
    linear-gradient(
      135deg,
      #eefaff,
      #a9d5e1
    );

  border:
    2px solid rgba(255,255,255,.9);
}

#vehicleLightLeft,
#vehicleLightRight {
  position: absolute;

  top: 62px;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #fff;

  box-shadow:
    0 0 6px rgba(255,255,255,.9);
}

#vehicleLightLeft {
  left: 11px;
}

#vehicleLightRight {
  right: 11px;
}

/* =====================================================
   駕駛道路視野漸層
===================================================== */

#roadFade {
  position: absolute;

  z-index: 300;

  left: 0;
  right: 0;
  bottom: 0;

  height: 38%;

  pointer-events: none;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.38),
      rgba(0,0,0,.12) 40%,
      rgba(0,0,0,0)
    );
}

/* =====================================================
   速度
===================================================== */

#speedPanel {
  position: absolute;

  z-index: 1000;

  left: 14px;
  bottom:
    calc(
      env(safe-area-inset-bottom) + 18px
    );

  width: 92px;
  height: 92px;

  border-radius: 50%;

  background: white;

  border: 5px solid #16803c;

  box-shadow:
    0 4px 16px rgba(0,0,0,.5);

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;
}

#speedValue {
  font-size: 31px;
  line-height: 1;

  font-weight: 900;
}

#speedUnit {
  margin-top: 4px;

  font-size: 11px;

  color: #555;
}

/* =====================================================
   GPS 狀態
===================================================== */

#gpsStatus {
  position: absolute;

  z-index: 1000;

  left: 116px;
  right: 116px;

  bottom:
    calc(
      env(safe-area-inset-bottom) + 23px
    );

  padding: 8px 10px;

  border-radius: 9px;

  background:
    rgba(0,0,0,.72);

  color: white;

  text-align: center;

  font-size: 12px;
}

/* =====================================================
   控制
===================================================== */

#controls {
  position: absolute;

  z-index: 1100;

  right: 12px;

  bottom:
    calc(
      env(safe-area-inset-bottom) + 18px
    );

  display: flex;
  flex-direction: column;

  gap: 8px;
}

.controlButton {
  min-width: 104px;
  min-height: 45px;

  padding: 8px 12px;

  border: 0;
  border-radius: 12px;

  background: white;
  color: #222;

  font-size: 14px;
  font-weight: 800;

  box-shadow:
    0 3px 12px rgba(0,0,0,.4);
}

.controlButton:active {
  transform: scale(.96);
}

/* =====================================================
   測速照相
===================================================== */

#cameraWarning {
  position: absolute;

  z-index: 1300;

  left: 50%;
  top: 18%;

  transform:
    translateX(-50%);

  display: none;

  min-width: 210px;

  padding: 10px 16px;

  border-radius: 12px;

  background:
    rgba(210,55,35,.96);

  color: white;

  text-align: center;

  font-weight: 900;

  box-shadow:
    0 4px 16px rgba(0,0,0,.45);
}

/* =====================================================
   啟動
===================================================== */

#loading {
  position: absolute;

  z-index: 5000;

  inset: 0;

  display: flex;

  justify-content: center;
  align-items: center;

  background:
    rgba(0,0,0,.62);

  color: white;

  font-size: 17px;
  font-weight: 800;

  text-align: center;
}

#loadingBox {
  max-width: 300px;

  padding: 20px 24px;

  border-radius: 16px;

  background:
    rgba(20,20,20,.94);

  box-shadow:
    0 6px 25px rgba(0,0,0,.5);
}

/* =====================================================
   駕駛模式提示
===================================================== */

#driveModeBadge {
  position: absolute;

  z-index: 1000;

  left: 50%;

  top:
    calc(
      env(safe-area-inset-top) + 78px
    );

  transform:
    translateX(-50%);

  padding: 6px 12px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.62);

  color: white;

  font-size: 11px;
  font-weight: 800;

  pointer-events: none;
}

/* =====================================================
   小螢幕
===================================================== */

@media (max-width: 430px) {

  #gpsStatus {
    left: 112px;
    right: 112px;

    font-size: 11px;
  }

  #vehicle {
    bottom: 13%;
  }

  #navCard {
    padding-left: 14px;
    padding-right: 14px;
  }

}
</style>
</head>

<body>

<div id="map"></div>

<button id="backButton" type="button">
  ← 地圖
</button>

<div id="navPanel">

  <div id="navCard">

    <div id="turnIcon">↑</div>

    <div id="roadName">
      尚未建立路線
    </div>

    <div id="distanceText">
      等待目的地
    </div>

  </div>

</div>

<div id="driveModeBadge">
  🚗 駕駛視角
</div>

<div id="vehicle">

  <div id="vehicleBody"></div>

  <div id="vehicleGlass"></div>

  <div id="vehicleLightLeft"></div>

  <div id="vehicleLightRight"></div>

</div>

<div id="roadFade"></div>

<div id="speedPanel">

  <div id="speedValue">
    0
  </div>

  <div id="speedUnit">
    km/h
  </div>

</div>

<div id="gpsStatus">
  正在啟動 GPS…
</div>

<div id="controls">

  <button
    id="followButton"
    class="controlButton"
    type="button">
    🎯 回到駕駛
  </button>

  <button
    id="routeButton"
    class="controlButton"
    type="button">
    🛣️ 建立路線
  </button>

  <button
    id="modeButton"
    class="controlButton"
    type="button">
    🗺️ 平面
  </button>

</div>

<div id="cameraWarning">
  ⚠️ 前方測速照相
</div>

<div id="loading">

  <div id="loadingBox">
    正在啟動駕駛引擎…
  </div>

</div>


<script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>

<script>
"use strict";

/* =====================================================
   全域狀態
===================================================== */

let map = null;

let gpsWatchId = null;

let currentLat = null;
let currentLng = null;

let currentHeading = 0;
let currentSpeed = 0;

let lastGPS = null;

let followMode = true;

let drivingMode = true;

let routeData = null;

let routeSteps = [];

let currentStepIndex = 0;

let routeCoordinates = [];

let routeDestination = null;

let routeReady = false;

let cameraData = [];

let cameraMarkers = [];

let lastRouteRequest = 0;

let mapReady = false;

let lastCameraBearing = 0;


/* =====================================================
   DOM
===================================================== */

const $ = function(id) {
  return document.getElementById(id);
};


/* =====================================================
   URL 目的地
===================================================== */

function getDestinationFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const lat =
    Number(
      params.get("lat")
    );

  const lng =
    Number(
      params.get("lng")
    );

  if (
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    lat >= -90 &&
    lat <= 90 &&
    lng >= -180 &&
    lng <= 180
  ) {

    return {
      lat: lat,
      lng: lng
    };

  }

  return null;
}


/* =====================================================
   距離
===================================================== */

function distanceBetween(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R = 6371000;

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dp =
    (lat2 - lat1) *
    Math.PI /
    180;

  const dl =
    (lng2 - lng1) *
    Math.PI /
    180;

  const a =
    Math.sin(dp / 2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl / 2) ** 2;

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );
}


/* =====================================================
   Bearing
===================================================== */

function calculateBearing(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dl =
    (lng2 - lng1) *
    Math.PI /
    180;

  const y =
    Math.sin(dl) *
    Math.cos(p2);

  const x =
    Math.cos(p1) *
    Math.sin(p2) -
    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);

  return (
    Math.atan2(y, x) *
    180 /
    Math.PI +
    360
  ) % 360;
}


/* =====================================================
   角度差
===================================================== */

function angleDifference(
  a,
  b
) {

  return (
    (a - b + 540) %
    360
  ) - 180;
}


/* =====================================================
   GPS
===================================================== */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    setGPSStatus(
      "此裝置不支援 GPS"
    );

    return;

  }

  gpsWatchId =
    navigator.geolocation.watchPosition(

      handleGPS,

      function(error) {

        console.error(
          "GPS error:",
          error
        );

        setGPSStatus(
          "GPS：" +
          (
            error.message ||
            "定位失敗"
          )
        );

      },

      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000
      }

    );

}


/* =====================================================
   GPS 更新
===================================================== */

function handleGPS(position) {

  if (
    !position ||
    !position.coords
  ) {
    return;
  }

  const c =
    position.coords;

  const lat =
    Number(c.latitude);

  const lng =
    Number(c.longitude);

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ) {
    return;
  }


  /* ---------------------------------------------------
     速度
  --------------------------------------------------- */

  let speed =
    Number(c.speed);

  if (
    !Number.isFinite(speed) ||
    speed < 0
  ) {

    speed = 0;

  } else {

    speed *= 3.6;

  }


  /*
     GPS 沒有速度時，
     使用兩次定位估算。
  */

  if (
    speed <= 0 &&
    lastGPS
  ) {

    const d =
      distanceBetween(
        lastGPS.lat,
        lastGPS.lng,
        lat,
        lng
      );

    const dt =
      (
        position.timestamp -
        lastGPS.time
      ) / 1000;

    if (
      dt > 0.2 &&
      dt < 30 &&
      d > 1
    ) {

      speed =
        d /
        dt *
        3.6;

    }

  }


  currentSpeed =
    Math.max(
      0,
      Math.min(
        200,
        speed
      )
    );


  /* ---------------------------------------------------
     方向
  --------------------------------------------------- */

  let heading =
    Number(c.heading);

  if (
    !Number.isFinite(heading)
  ) {

    heading = null;

  }


  /*
     如果 GPS heading 不可靠，
     用移動方向估算。
  */

  if (
    heading === null &&
    lastGPS
  ) {

    const moved =
      distanceBetween(
        lastGPS.lat,
        lastGPS.lng,
        lat,
        lng
      );

    if (
      moved >= 4
    ) {

      heading =
        calculateBearing(
          lastGPS.lat,
          lastGPS.lng,
          lat,
          lng
        );

    }

  }


  if (
    Number.isFinite(heading) &&
    (
      currentSpeed >= 2 ||
      lastGPS === null
    )
  ) {

    currentHeading =
      (
        heading +
        360
      ) % 360;

  }


  currentLat = lat;

  currentLng = lng;


  /* ---------------------------------------------------
     HUD
  --------------------------------------------------- */

  $("speedValue").textContent =
    String(
      Math.round(
        currentSpeed
      )
    );


  const accuracy =
    Number(c.accuracy);


  setGPSStatus(

    "GPS ±" +
    (
      Number.isFinite(accuracy)
        ? Math.round(accuracy)
        : "?"
    ) +
    "m｜" +
    Math.round(
      currentHeading
    ) +
    "°"

  );


  /* ---------------------------------------------------
     Route
  --------------------------------------------------- */

  if (
    routeReady
  ) {

    updateRouteProgress();

  }


  /* ---------------------------------------------------
     駕駛攝影機
  --------------------------------------------------- */

  if (
    followMode &&
    mapReady
  ) {

    updateDrivingCamera();

  }


  lastGPS = {

    lat: lat,

    lng: lng,

    time:
      position.timestamp

  };

}


/* =====================================================
   MapLibre 地圖
===================================================== */

function createMap() {

  try {

    map =
      new maplibregl.Map({

        container: "map",

        style:
          "https://tiles.openfreemap.org/styles/liberty",

        center: [
          121.5654,
          25.0330
        ],

        zoom: 17,

        pitch: 63,

        bearing: 0,

        maxPitch: 75,

        attributionControl: true,

        antialias: true

      });


    /*
       不使用 NavigationControl 的
       觸控旋轉功能作為駕駛控制。
    */

    map.addControl(

      new maplibregl.NavigationControl({
        showCompass: true
      }),

      "top-right"

    );


    /*
       使用者開始拖動地圖：
       停止自動跟隨。
    */

    map.on(
      "dragstart",
      function() {

        if (
          !mapReady
        ) {
          return;
        }

        followMode = false;

        setGPSStatus(
          "已暫停跟隨｜可自由查看道路"
        );

      }
    );


    /*
       使用者開始旋轉地圖：
       也停止跟隨。
    */

    map.on(
      "rotatestart",
      function() {

        if (
          !mapReady
        ) {
          return;
        }

        followMode = false;

        setGPSStatus(
          "已暫停駕駛跟隨"
        );

      }
    );


    /*
       地圖載入完成。
    */

    map.on(
      "load",
      function() {

        mapReady = true;

        addRouteLayer();

        hideLoading();

        setGPSStatus(
          "✓ 駕駛引擎已啟動"
        );


        /*
           如果 GPS 已經先取得，
           立即進入駕駛視角。
        */

        if (
          currentLat !== null
        ) {

          updateDrivingCamera();

        }


        /*
           如果 URL 有目的地，
           自動建立路線。
        */

        if (
          routeDestination &&
          currentLat !== null
        ) {

          buildRoute();

        }

      }
    );


    /*
       MapLibre 錯誤不要讓整個頁面卡死。
    */

    map.on(
      "error",
      function(event) {

        console.error(
          "MapLibre error:",
          event
        );

      }
    );

  } catch (error) {

    console.error(
      "Map creation error:",
      error
    );

    hideLoading();

    setGPSStatus(
      "地圖啟動失敗，請重新整理"
    );

  }

}


/* =====================================================
   Route 圖層
===================================================== */

function addRouteLayer() {

  if (
    !map ||
    !mapReady
  ) {
    return;
  }


  if (
    map.getSource(
      "navigation-route"
    )
  ) {

    return;

  }


  map.addSource(
    "navigation-route",
    {

      type: "geojson",

      data: {
        type:
          "FeatureCollection",

        features: []

      }

    }
  );


  map.addLayer({

    id:
      "navigation-route-shadow",

    type:
      "line",

    source:
      "navigation-route",

    layout: {

      "line-cap":
        "round",

      "line-join":
        "round"

    },

    paint: {

      "line-color":
        "#ffffff",

      "line-width":
        13,

      "line-opacity":
        0.82

    }

  });


  map.addLayer({

    id:
      "navigation-route-line",

    type:
      "line",

    source:
      "navigation-route",

    layout: {

      "line-cap":
        "round",

      "line-join":
        "round"

    },

    paint: {

      "line-color":
        "#16803c",

      "line-width":
        8,

      "line-opacity":
        0.98

    }

  });

}


/* =====================================================
   Route GeoJSON
===================================================== */

function setRouteGeoJSON(
  geometry
) {

  if (
    !map ||
    !mapReady ||
    !geometry
  ) {

    return;

  }


  const source =
    map.getSource(
      "navigation-route"
    );


  if (!source) {

    return;

  }


  source.setData({

    type:
      "Feature",

    properties: {},

    geometry:
      geometry

  });

}


/* =====================================================
   V4.1 真正駕駛攝影機
===================================================== */

function updateDrivingCamera() {

  if (
    !map ||
    !mapReady ||
    currentLat === null ||
    currentLng === null ||
    !followMode
  ) {

    return;

  }


  /*
     -----------------------------------------------
     1. 平滑車頭方向
  -----------------------------------------------
  */

  let targetBearing =
    Number(currentHeading);


  if (
    !Number.isFinite(targetBearing)
  ) {

    targetBearing =
      lastCameraBearing;

  }


  targetBearing =
    (
      targetBearing +
      360
    ) % 360;


  const bearingDiff =
    angleDifference(
      targetBearing,
      lastCameraBearing
    );


  /*
     停車時不要因 GPS 雜訊亂旋轉。
  */

  if (
    currentSpeed < 2 &&
    Math.abs(
      bearingDiff
    ) > 30
  ) {

    targetBearing =
      lastCameraBearing;

  } else {

    /*
       平滑旋轉。
    */

    targetBearing =
      lastCameraBearing +
      bearingDiff *
      0.25;

  }


  targetBearing =
    (
      targetBearing +
      360
    ) % 360;


  lastCameraBearing =
    targetBearing;


  /*
     -----------------------------------------------
     2. Look Ahead
  -----------------------------------------------

     駕駛模式不是把 GPS 放在畫面中心。

     鏡頭中心在車前方。
  */

  let lookAheadMeters =
    55;


  if (
    currentSpeed >= 30
  ) {

    lookAheadMeters =
      75;

  }


  if (
    currentSpeed >= 60
  ) {

    lookAheadMeters =
      105;

  }


  if (
    currentSpeed >= 90
  ) {

    lookAheadMeters =
      135;

  }


  /*
     米 → 緯度。
  */

  const metersPerDegreeLat =
    111320;


  const headingRad =
    targetBearing *
    Math.PI /
    180;


  const targetLat =
    currentLat +
    (
      Math.cos(
        headingRad
      ) *
      lookAheadMeters /
      metersPerDegreeLat
    );


  const cosLat =
    Math.max(
      0.2,
      Math.cos(
        currentLat *
        Math.PI /
        180
      )
    );


  const metersPerDegreeLng =
    metersPerDegreeLat *
    cosLat;


  const targetLng =
    currentLng +
    (
      Math.sin(
        headingRad
      ) *
      lookAheadMeters /
      metersPerDegreeLng
    );


  /*
     -----------------------------------------------
     3. Zoom
  -----------------------------------------------
  */

  let zoom =
    17.8;


  if (
    currentSpeed >= 30
  ) {

    zoom =
      17.5;

  }


  if (
    currentSpeed >= 60
  ) {

    zoom =
      17.2;

  }


  if (
    currentSpeed >= 90
  ) {

    zoom =
      16.9;

  }


  /*
     -----------------------------------------------
     4. Pitch
  -----------------------------------------------

     不用 90°。

     60～68° 是前視 3D 的主要範圍。
  */

  let pitch =
    66;


  if (
    currentSpeed >= 60
  ) {

    pitch =
      63;

  }


  /*
     -----------------------------------------------
     5. Padding
  -----------------------------------------------

     讓車落在畫面下方。
  */

  const bottomPadding =
    Math.round(
      window.innerHeight *
      0.34
    );


  /*
     -----------------------------------------------
     6. Camera
  -----------------------------------------------
  */

  try {

    map.easeTo({

      center: [
        targetLng,
        targetLat
      ],

      zoom:
        zoom,

      pitch:
        drivingMode
          ? pitch
          : 0,

      bearing:
        drivingMode
          ? targetBearing
          : 0,

      padding: {

        top: 90,

        bottom:
          drivingMode
            ? bottomPadding
            : 0,

        left: 0,

        right: 0

      },

      duration:
        currentSpeed >= 5
          ? 420
          : 650,

      essential: true

    });

  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

  }

}


/* =====================================================
   回到駕駛
===================================================== */

function returnToDrivingView() {

  followMode =
    true;

  drivingMode =
    true;

  $("modeButton").textContent =
    "🗺️ 平面";

  updateDrivingCamera();

  setGPSStatus(
    "✓ 已回到駕駛視角"
  );

}


/* =====================================================
   建立 Route
===================================================== */

async function buildRoute() {

  if (
    currentLat === null ||
    currentLng === null
  ) {

    setGPSStatus(
      "尚未取得 GPS，請稍候"
    );

    return;

  }


  /*
     沒有目的地就不建立假的路線。
  */

  if (
    !routeDestination
  ) {

    setGPSStatus(
      "請先從 map.html 選擇目的地"
    );

    return;

  }


  const now =
    Date.now();


  if (
    now -
    lastRouteRequest <
    3000
  ) {

    return;

  }


  lastRouteRequest =
    now;


  routeReady =
    false;


  setGPSStatus(
    "正在計算真實道路路線…"
  );


  /*
     OSRM：

     lng,lat
     →
     lng,lat
  */

  const url =
    "https://router.project-osrm.org/route/v1/driving/" +

    encodeURIComponent(
      currentLng
    ) +

    "," +

    encodeURIComponent(
      currentLat
    ) +

    ";" +

    encodeURIComponent(
      routeDestination.lng
    ) +

    "," +

    encodeURIComponent(
      routeDestination.lat
    ) +

    "?steps=true" +

    "&geometries=geojson" +

    "&overview=full" +

    "&alternatives=false";


  try {

    const response =
      await fetch(
        url,
        {
          method:
            "GET",

          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Route HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      data.code !== "Ok" ||
      !Array.isArray(
        data.routes
      ) ||
      !data.routes.length
    ) {

      throw new Error(
        "找不到道路路線"
      );

    }


    routeData =
      data.routes[0];


    routeCoordinates =
      Array.isArray(
        routeData.geometry?.coordinates
      )
        ? routeData.geometry.coordinates
        : [];


    routeSteps =
      [];


    for (
      const leg of
      routeData.legs || []
    ) {

      for (
        const step of
        leg.steps || []
      ) {

        routeSteps.push(
          step
        );

      }

    }


    currentStepIndex =
      0;


    routeReady =
      routeCoordinates.length > 1;


    if (
      !routeReady
    ) {

      throw new Error(
        "Route 資料不完整"
      );

    }


    setRouteGeoJSON(
      routeData.geometry
    );


    updateNavigationHUD();


    setGPSStatus(
      "✓ 真實道路 Route 已載入"
    );


    followMode =
      true;


    updateDrivingCamera();

  } catch (error) {

    console.error(
      "Route error:",
      error
    );


    setGPSStatus(
      "Route 失敗：" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}


/* =====================================================
   Route 進度
===================================================== */

function updateRouteProgress() {

  if (
    !routeSteps.length ||
    currentLat === null
  ) {

    return;

  }


  let bestIndex =
    currentStepIndex;

  let bestDistance =
    Infinity;


  const start =
    Math.max(
      0,
      currentStepIndex - 1
    );


  const end =
    Math.min(
      routeSteps.length - 1,
      currentStepIndex + 5
    );


  for (
    let i = start;
    i <= end;
    i++
  ) {

    const step =
      routeSteps[i];


    const location =
      step?.maneuver?.location;


    if (
      !Array.isArray(
        location
      ) ||
      location.length < 2
    ) {

      continue;

    }


    const d =
      distanceBetween(

        currentLat,
        currentLng,

        Number(location[1]),
        Number(location[0])

      );


    if (
      Number.isFinite(d) &&
      d < bestDistance
    ) {

      bestDistance =
        d;

      bestIndex =
        i;

    }

  }


  currentStepIndex =
    bestIndex;


  updateNavigationHUD();

}


/* =====================================================
   導航 HUD
===================================================== */

function updateNavigationHUD() {

  if (
    !routeSteps.length
  ) {

    return;

  }


  const step =
    routeSteps[
      currentStepIndex
    ];


  if (!step) {
    return;
  }


  const maneuver =
    step.maneuver ||
    {};


  const type =
    String(
      maneuver.type ||
      ""
    ).toLowerCase();


  const modifier =
    String(
      maneuver.modifier ||
      ""
    ).toLowerCase();


  let icon =
    "↑";


  if (
    type === "arrive"
  ) {

    icon =
      "🏁";

  } else if (
    modifier.includes(
      "uturn"
    )
  ) {

    icon =
      "↶";

  } else if (
    modifier.includes(
      "left"
    )
  ) {

    icon =
      "↰";

  } else if (
    modifier.includes(
      "right"
    )
  ) {

    icon =
      "↱";

  }


  $("turnIcon").textContent =
    icon;


  const road =
    step.name ||
    "前方道路";


  $("roadName").textContent =
    road;


  const distance =
    Number(
      step.distance || 0
    );


  $("distanceText").textContent =
    formatDistance(
      distance
    );

}


/* =====================================================
   距離格式
===================================================== */

function formatDistance(
  meters
) {

  if (
    !Number.isFinite(
      meters
    )
  ) {

    return "—";

  }


  if (
    meters < 1000
  ) {

    return (
      Math.max(
        0,
        Math.round(
          meters
        )
      ) +
      " 公尺"
    );

  }


  return (
    (
      meters /
      1000
    ).toFixed(1) +
    " 公里"
  );

}


/* =====================================================
   測速照相 Marker
===================================================== */

function createCameraMarker(
  camera
) {

  if (
    !map ||
    !mapReady
  ) {

    return;

  }


  const el =
    document.createElement(
      "div"
    );


  el.style.width =
    "34px";

  el.style.height =
    "34px";

  el.style.borderRadius =
    "50%";

  el.style.background =
    "#e53935";

  el.style.border =
    "3px solid white";

  el.style.boxShadow =
    "0 3px 10px rgba(0,0,0,.55)";

  el.style.display =
    "flex";

  el.style.alignItems =
    "center";

  el.style.justifyContent =
    "center";

  el.style.fontSize =
    "18px";

  el.textContent =
    "⚠";


  const marker =
    new maplibregl.Marker({
      element: el
    })
    .setLngLat([
      camera.lng,
      camera.lat
    ])
    .addTo(map);


  cameraMarkers.push(
    marker
  );

}


/* =====================================================
   測速照相資料介面
===================================================== */

function setSpeedCameras(
  rows
) {

  cameraData =
    Array.isArray(rows)
      ? rows
      : [];


  for (
    const marker of
    cameraMarkers
  ) {

    try {
      marker.remove();
    } catch (_) {}

  }


  cameraMarkers =
    [];


  for (
    const row of
    cameraData
  ) {

    const lat =
      Number(
        row.lat ??
        row.latitude
      );

    const lng =
      Number(
        row.lng ??
        row.longitude
      );


    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lng)
    ) {

      continue;

    }


    createCameraMarker({

      lat: lat,

      lng: lng

    });

  }

}


/* =====================================================
   測速照相警告
===================================================== */

function checkSpeedCameraWarning() {

  if (
    currentLat === null ||
    currentLng === null
  ) {

    return;

  }


  let nearest =
    null;

  let nearestDistance =
    Infinity;


  for (
    const camera of
    cameraData
  ) {

    if (
      !camera ||
      !Number.isFinite(
        Number(camera.lat)
      ) ||
      !Number.isFinite(
        Number(camera.lng)
      )
    ) {

      continue;

    }


    const d =
      distanceBetween(

        currentLat,
        currentLng,

        Number(camera.lat),
        Number(camera.lng)

      );


    if (
      d < nearestDistance
    ) {

      nearestDistance =
        d;

      nearest =
        camera;

    }

  }


  const warning =
    $("cameraWarning");


  if (
    nearest &&
    nearestDistance <= 500
  ) {

    warning.style.display =
      "block";

    warning.textContent =
      "⚠️ 前方約 " +
      Math.round(
        nearestDistance
      ) +
      " 公尺測速照相";

  } else {

    warning.style.display =
      "none";

  }

}


/* =====================================================
   平面／駕駛
===================================================== */

$("modeButton")
  .addEventListener(
    "click",
    function() {

      drivingMode =
        !drivingMode;


      if (
        drivingMode
      ) {

        this.textContent =
          "🗺️ 平面";

        followMode =
          true;

        updateDrivingCamera();

        setGPSStatus(
          "✓ 駕駛視角"
        );

      } else {

        this.textContent =
          "🚗 駕駛";

        followMode =
          false;


        if (
          map &&
          mapReady
        ) {

          map.easeTo({

            pitch:
              0,

            bearing:
              0,

            padding: {
              top: 0,
              bottom: 0,
              left: 0,
              right: 0
            },

            duration:
              450,

            essential:
              true

          });

        }


        setGPSStatus(
          "已切換平面地圖"
        );

      }

    }
  );


/* =====================================================
   回到駕駛
===================================================== */

$("followButton")
  .addEventListener(
    "click",
    function() {

      returnToDrivingView();

    }
  );


/* =====================================================
   建立路線
===================================================== */

$("routeButton")
  .addEventListener(
    "click",

      const destination =

      if (
        destination
      ) {

        routeDestination =

      }


      buildRoute();

    }
  );


/* =====================================================
   返回 map.html
===================================================== */

$("backButton")
  .addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      event.stopPropagation();

      window.location.href =
        "./map.html";

    }
  );


/* =====================================================
   GPS 狀態
===================================================== */

function setGPSStatus(
  text
) {

  const el =
    $("gpsStatus");


  if (
    el
  ) {

    el.textContent =
      String(text);

  }

}


/* =====================================================
   Loading
===================================================== */

function hideLoading() {

  const el =
    $("loading");


  if (
    el
  ) {

    el.style.display =
      "none";

  }

}


/* =====================================================
   視窗大小
===================================================== */

window.addEventListener(
  "resize",
  function() {

    if (
      map &&
      mapReady
    ) {

      map.resize();

      if (
        followMode
      ) {

        updateDrivingCamera();

      }

    }

  }
);


/* =====================================================
   測速照相定時檢查
===================================================== */

setInterval(
  function() {

    checkSpeedCameraWarning();

  },
  1000
);


/* =====================================================
   啟動
===================================================== */

(function init() {

  const destination =
    getDestinationFromURL();


  if (
    destination
  ) {

    routeDestination =
      destination;

  }


  createMap();

  startGPS();

})();
