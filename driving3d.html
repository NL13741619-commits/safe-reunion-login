<body>

<div id="map"></div>

<button

type="button">

<div id="searchPanel">

<input
id="destinationInput"
type="text"
inputmode="search"
autocomplete="off"
placeholder="輸入目的地，例如：台北車站">

<button
id="searchButton"
type="button">
搜尋

================================ -->

↑

等待目的地

</div>

</div>

================================ -->

<div id="vehicle">

================================ -->

0
</div>

km/h

class="controlButton"
type="button">
🛣️ 開始導航

id="modeButton"
class="controlButton"
type="button">
🗺️ 平面
</button>

⚠️ 前方測速照相
</div>

<script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>

<script>

/* =====================================================
全域狀態
===================================================== */

let map = null;

let gpsWatchId = null;

let currentLat = null;
let currentLng = null;

let currentHeading = 0;
let currentSpeed = 0;

let lastGPS = null;

let followMode = true;

let drivingMode = true;

let routeData = null;

let routeSteps = [];

let currentStepIndex = 0;

let routeCoordinates = [];

let routeDestination = null;

let routeReady = false;

let cameraData = [];

let cameraMarkers = [];

let lastRouteRequest = 0;


/* =====================================================
工具
===================================================== */

function setGPSStatus(text){

const el =
document.getElementById("gpsStatus");

if(el){
el.textContent = text;
}

}


function hideLoading(){

const el =
document.getElementById("loading");

if(el){
el.style.display = "none";
}

}


function distanceBetween(
lat1,
lng1,
lat2,
lng2
){

const R = 6371000;

const p1 =
lat1 * Math.PI / 180;

const p2 =
lat2 * Math.PI / 180;

const dp =
(lat2-lat1) * Math.PI / 180;

const dl =
(lng2-lng1) * Math.PI / 180;

const a =

Math.sin(dp/2)**2 +

Math.cos(p1) *
Math.cos(p2) *
Math.sin(dl/2)**2;

return R *
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}


function calculateBearing(
lat1,
lng1,
lat2,
lng2
){

const p1 =
lat1 * Math.PI / 180;

const p2 =
lat2 * Math.PI / 180;

const dl =
(lng2-lng1) *
Math.PI / 180;

const y =
Math.sin(dl) *
Math.cos(p2);

const x =

Math.cos(p1) *
Math.sin(p2)

-

Math.sin(p1) *
Math.cos(p2) *
Math.cos(dl);

return (

Math.atan2(y,x) *
180 /
Math.PI +
360

)%360;

}


/* =====================================================
建立地圖
===================================================== */

function createMap(){

map =
new maplibregl.Map({

container:"map",

style:
"https://tiles.openfreemap.org/styles/liberty",

center:[
121.5654,
25.0330
],

zoom:17,

pitch:60,

bearing:0,

maxPitch:60,

antialias:true

});


map.addControl(

new maplibregl.NavigationControl({
showCompass:true
}),

"top-right"

);


/* 使用者手動拖動後
   停止自動跟隨 */

map.on(
"dragstart",
function(){

followMode = false;

setGPSStatus(
"已暫停跟隨｜可自由查看道路"
);

});


map.on(
"load",
function(){

addRouteLayer();

hideLoading();

setGPSStatus(
"3D 駕駛引擎已啟動"
);

});

}


/* =====================================================
Route Layer
===================================================== */

function addRouteLayer(){

if(!map){
return;
}

if(
map.getSource("navigation-route")
){
return;
}

map.addSource(
"navigation-route",
{

type:"geojson",

data:{
type:"FeatureCollection",
features:[]
}

});


map.addLayer({

id:"navigation-route-shadow",

type:"line",

source:"navigation-route",

layout:{
"line-cap":"round",
"line-join":"round"
},

paint:{
"line-color":"#ffffff",
"line-width":14,
"line-opacity:.9
}

});


map.addLayer({

id:"navigation-route-line",

type:"line",

source:"navigation-route",

layout:{
"line-cap":"round",
"line-join":"round"
},

paint:{
"line-color":"#16803c",
"line-width":8,
"line-opacity:.98
}

});

}


function setRouteGeoJSON(
geometry
){

if(!map){
return;
}

const source =
map.getSource(
"navigation-route"
);

if(!source){
return;
}

source.setData({

type:"Feature",

properties:{},

geometry:geometry

});

}


/* =====================================================
GPS
===================================================== */

function startGPS(){

if(!navigator.geolocation){

setGPSStatus(
"此裝置不支援 GPS"
);

return;

}

gpsWatchId =
navigator.geolocation.watchPosition(

handleGPS,

function(error){

setGPSStatus(
"GPS：" +
error.message
);

},

{

enableHighAccuracy:true,

maximumAge:1000,

timeout:15000

}

);

}


function handleGPS(
position
){

const c =
position.coords;

const lat =
Number(c.latitude);

const lng =
Number(c.longitude);

if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){
return;
}


/* ================================
速度
================================ */

let speed =
Number(c.speed);

if(
!Number.isFinite(speed) ||
speed < 0
){

speed = 0;

}else{

speed *= 3.6;

}


if(
speed === 0 &&
lastGPS
){

const d =
distanceBetween(
lastGPS.lat,
lastGPS.lng,
lat,
lng
);

const dt =
(
position.timestamp -
lastGPS.time
)/1000;

if(
dt > .2 &&
dt < 30
){

speed =
d / dt * 3.6;

}

}


currentSpeed =
Math.max(
0,
Math.min(
200,
speed
)
);


/* ================================
方向
================================ */

let heading =
Number(c.heading);

if(
!Number.isFinite(heading) &&
lastGPS
){

const moved =
distanceBetween(
lastGPS.lat,
lastGPS.lng,
lat,
lng
);

if(
moved > 5
){

heading =
calculateBearing(
lastGPS.lat,
lastGPS.lng,
lat,
lng
);

}

}


if(
Number.isFinite(heading) &&
currentSpeed > 2
){

currentHeading =
heading;

}


currentLat = lat;
currentLng = lng;


/* ================================
HUD
================================ */

document.getElementById(
"speedValue"
).textContent =
Math.round(
currentSpeed
);


setGPSStatus(

"GPS ±" +
Math.round(
c.accuracy || 0
) +
"m｜" +
Math.round(
currentHeading
) +
"°"

);


/* ================================
Route
================================ */

if(routeReady){

updateRouteProgress();

}


/* ================================
駕駛鏡頭
================================ */

if(followMode){

updateDrivingCamera();

}


lastGPS = {

lat:lat,

lng:lng,

time:
position.timestamp

};

}


/* =====================================================
駕駛鏡頭
===================================================== */

function updateDrivingCamera(){

if(
!map ||
currentLat === null ||
!followMode
){

return;

}

map.easeTo({

center:[
currentLng,
currentLat
],

zoom:18.2,

pitch:
drivingMode
? 60
: 0,

bearing:
drivingMode
? currentHeading
: 0,

padding:{

top:150,

bottom:
Math.round(
window.innerHeight*.30
),

left:0,

right:0

},

duration:350,

essential:true

});

}


/* =====================================================
地址搜尋
===================================================== */

async function searchDestination(){

const input =
document.getElementById(
"destinationInput"
);

const results =
document.getElementById(
"searchResults"
);

const query =
input.value.trim();

if(!query){

setGPSStatus(
"請先輸入目的地"
);

input.focus();

return;

}


results.style.display =
"block";

results.innerHTML =
'<div class="searchResult">正在搜尋目的地…</div>';


try{

const url =

"https://nominatim.openstreetmap.org/search" +

"?format=jsonv2" +

"&q=" +
encodeURIComponent(query) +

"&limit=5" +

"&accept-language=zh-TW";


const response =
await fetch(
url,
{
headers:{
"Accept":
"application/json"
}
}
);


if(!response.ok){

throw new Error(
"搜尋 HTTP " +
response.status
);

}


const data =
await response.json();


if(
!Array.isArray(data) ||
!data.length
){

results.innerHTML =
'<div class="searchResult">找不到這個地點，請換個地址試試。</div>';

return;

}


results.innerHTML = "";


data.forEach(
function(item){

const div =
document.createElement(
"div"
);

div.className =
"searchResult";

div.textContent =
item.display_name;

div.addEventListener(
"click",
function(){

const lat =
Number(item.lat);

const lng =
Number(item.lon);


if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){

return;

}


routeDestination = {

lat:lat,

lng:lng,

name:
item.display_name

};


results.style.display =
"none";


input.value =
item.display_name;


showDestinationInfo();


map.flyTo({

center:[
lng,
lat
],

zoom:15,

pitch:45,

duration:900

});


setGPSStatus(
"✓ 已選擇目的地"
);


document.getElementById(
"routeButton"
).textContent =
"🛣️ 建立路線";

}
);


results.appendChild(
div
);

}
);


}catch(error){

console.error(
"Search error:",
error
);

results.innerHTML =
'<div class="searchResult">搜尋失敗，請稍後再試。</div>';

setGPSStatus(
"目的地搜尋失敗"
);

}

}


/* =====================================================
目的地資訊
===================================================== */

function showDestinationInfo(){

const box =
document.getElementById(
"destinationInfo"
);

if(
!box ||
!routeDestination
){

return;

}

box.style.display =
"block";

box.textContent =
"📍 目的地：" +
(
routeDestination.name ||
(
routeDestination.lat.toFixed(5) +
", " +
routeDestination.lng.toFixed(5)
)
);

}


/* =====================================================
建立 Route
===================================================== */

async function buildRoute(){

if(
currentLat === null ||
currentLng === null
){

setGPSStatus(
"尚未取得 GPS，請稍候"
);

return;

}


if(!routeDestination){

setGPSStatus(
"請先輸入並選擇目的地"
);

document.getElementById(
"destinationInput"
).focus();

return;

}


/* ================================
座標最後一次安全檢查
================================ */

const startLat =
Number(currentLat);

const startLng =
Number(currentLng);

const endLat =
Number(routeDestination.lat);

const endLng =
Number(routeDestination.lng);


if(
!Number.isFinite(startLat) ||
!Number.isFinite(startLng) ||
!Number.isFinite(endLat) ||
!Number.isFinite(endLng)
){

setGPSStatus(
"座標無效，無法建立 Route"
);

return;

}


const distance =
distanceBetween(
startLat,
startLng,
endLat,
endLng
);


if(
distance < 10
){

setGPSStatus(
"你已經在目的地附近"
);

return;

}


if(
distance > 100000
){

setGPSStatus(
"目的地距離太遠，請重新選擇"
);

return;

}


const now =
Date.now();


if(
now-lastRouteRequest < 3000
){

return;

}

lastRouteRequest =
now;


setGPSStatus(
"正在計算真實道路路線…"
);


/* ================================
OSRM
================================ */

const coordinates =

startLng.toFixed(6) +
"," +
startLat.toFixed(6) +
";" +
endLng.toFixed(6) +
"," +
endLat.toFixed(6);


const url =

"https://router.project-osrm.org/route/v1/driving/" +

coordinates +

"?steps=true" +

"&geometries=geojson" +

"&overview=full" +

"&alternatives=false";


console.log(
"OSRM URL:",
url
);


try{

const response =
await fetch(
url
);


if(!response.ok){

throw new Error(
"Route HTTP " +
response.status
);

}


const data =
await response.json();


if(
data.code !== "Ok" ||
!Array.isArray(data.routes) ||
!data.routes.length
){

throw new Error(
data.message ||
"找不到道路路線"
);

}


routeData =
data.routes[0];


if(
!routeData.geometry ||
!Array.isArray(
routeData.geometry.coordinates
)
){

throw new Error(
"Route geometry 無效"
);

}


routeCoordinates =
routeData.geometry.coordinates;


routeSteps =
[];


for(
const leg of
routeData.legs || []
){

for(
const step of
leg.steps || []
){

routeSteps.push(
step
);

}

}


currentStepIndex = 0;

routeReady = true;


setRouteGeoJSON(
routeData.geometry
);


updateNavigationHUD();


/* ================================
Route 資訊
================================ */

const km =
(
Number(routeData.distance || 0) /
1000
).toFixed(1);

const minutes =
Math.round(
Number(routeData.duration || 0) /
60
);


setGPSStatus(
"✓ 路線完成｜" +
km +
" km｜約 " +
minutes +
" 分鐘"
);


document.getElementById(
"routeButton"
).textContent =
"🔄 重新導航";


/* ================================
進入真正駕駛模式
================================ */

drivingMode = true;

followMode = true;

document.getElementById(
"modeButton"
).textContent =
"🗺️ 平面";


updateDrivingCamera();


}catch(error){

console.error(
"Route error:",
error
);

routeReady = false;

setGPSStatus(
"Route 失敗：" +
error.message
);

}

}


/* =====================================================
Route 進度
===================================================== */

function updateRouteProgress(){

if(
!routeSteps.length ||
currentLat === null
){

return;

}


let bestIndex =
currentStepIndex;

let bestDistance =
Infinity;


const start =
Math.max(
0,
currentStepIndex - 1
);

const end =
Math.min(
routeSteps.length - 1,
currentStepIndex + 5
);


for(
let i=start;
i<=end;
i++
){

const step =
routeSteps[i];


if(
!step.maneuver ||
!step.maneuver.location
){

continue;

}


const p =
step.maneuver.location;


const d =
distanceBetween(

currentLat,
currentLng,

p[1],
p[0]

);


if(
d < bestDistance
){

bestDistance = d;

bestIndex = i;

}

}


currentStepIndex =
bestIndex;


updateNavigationHUD();

}


/* =====================================================
導航 HUD
===================================================== */

function updateNavigationHUD(){

if(
!routeSteps.length
){

return;

}


const step =
routeSteps[
currentStepIndex
];


if(!step){
return;
}


const maneuver =
step.maneuver || {};


const type =
String(
maneuver.type || ""
).toLowerCase();


const modifier =
String(
maneuver.modifier || ""
).toLowerCase();


let icon = "↑";


if(
type === "arrive"
){

icon = "🏁";

}else if(
modifier.includes("uturn")
){

icon = "↶";

}else if(
modifier.includes("left")
){

icon = "↰";

}else if(
modifier.includes("right")
){

icon = "↱";

}else if(
modifier.includes("slight left")
){

icon = "↖";

}else if(
modifier.includes("slight right")
){

icon = "↗";

}else if(
modifier.includes("sharp left")
){

icon = "⬅";

}else if(
modifier.includes("sharp right")
){

icon = "➡";

}


document.getElementById(
"turnIcon"
).textContent =
icon;


document.getElementById(
"roadName"
).textContent =

step.name ||
"前方道路";


document.getElementById(
"distanceText"
).textContent =

formatDistance(
Number(
step.distance || 0
)
);

}


function formatDistance(
meters
){

if(
meters < 1000
){

return (
Math.round(meters) +
" 公尺"
);

}

return (
(meters/1000).toFixed(1) +
" 公里"
);

}


/* =====================================================
測速照相
===================================================== */

function createCameraMarker(
camera
){

const el =
document.createElement(
"div"
);

el.style.width =
"34px";

el.style.height =
"34px";

el.style.borderRadius =
"50%";

el.style.background =
"#e53935";

el.style.border =
"3px solid white";

el.style.boxShadow =
"0 3px 10px rgba(0,0,0,.55)";

el.style.display =
"flex";

el.style.alignItems =
"center";

el.style.justifyContent =
"center";

el.style.fontSize =
"18px";

el.textContent =
"⚠";


const marker =
new maplibregl.Marker({
element:el
})

.setLngLat([
camera.lng,
camera.lat
])

.addTo(map);


cameraMarkers.push(
marker
);

}


function setSpeedCameras(
rows
){

cameraData =
Array.isArray(rows)
? rows
: [];


for(
const marker
of cameraMarkers
){

marker.remove();

}


cameraMarkers = [];


for(
const camera
of cameraData
){

const lat =
Number(
camera.lat ??
camera.latitude
);

const lng =
Number(
camera.lng ??
camera.longitude
);


if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){

continue;

}


createCameraMarker({
lat:lat,
lng:lng
});

}

}


function checkSpeedCameraWarning(){

if(
currentLat === null ||
currentLng === null
){

return;

}


let nearest = null;

let nearestDistance =
Infinity;


for(
const camera
of cameraData
){

const d =
distanceBetween(

currentLat,
currentLng,

camera.lat,
camera.lng

);


if(
d < nearestDistance
){

nearestDistance =
d;

nearest =
camera;

}

}


const warning =
document.getElementById(
"cameraWarning"
);


if(
nearest &&
nearestDistance <= 500
){

warning.style.display =
"block";

warning.textContent =
"⚠️ 前方約 " +
Math.round(
nearestDistance
) +
" 公尺測速照相";

}else{

warning.style.display =
"none";

}

}
