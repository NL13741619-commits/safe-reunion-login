<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>安全團聚｜3D 駕駛模式</title>

<link
  href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css"
  rel="stylesheet"
/>

<style>
html,
body,
#map {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
  background: #111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    sans-serif;
}

/* =========================
   上方導航資訊
========================= */

#navigationPanel {
  position: absolute;
  z-index: 20;

  top: env(safe-area-inset-top, 12px);
  left: 12px;
  right: 12px;

  margin-top: 8px;

  background: rgba(20, 128, 60, .96);
  color: white;

  border-radius: 14px;

  padding: 12px 16px;

  text-align: center;

  box-shadow:
    0 4px 15px rgba(0,0,0,.35);

  pointer-events: none;
}

#direction {
  font-size: 24px;
  font-weight: 900;
}

#roadName {
  margin-top: 4px;
  font-size: 15px;
  font-weight: 700;
}

#distance {
  margin-top: 3px;
  font-size: 13px;
}

/* =========================
   車速
========================= */

#speedPanel {
  position: absolute;
  z-index: 20;

  left: 14px;
  bottom: calc(env(safe-area-inset-bottom, 14px) + 14px);

  width: 88px;
  height: 88px;

  border-radius: 50%;

  background: white;

  border: 5px solid #16803c;

  box-shadow:
    0 4px 14px rgba(0,0,0,.4);

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;
}

#speed {
  font-size: 30px;
  font-weight: 900;
  line-height: 1;
}

#speedUnit {
  margin-top: 5px;
  font-size: 11px;
  color: #555;
}

/* =========================
   控制
========================= */

#controls {
  position: absolute;
  z-index: 20;

  right: 12px;
  bottom: calc(env(safe-area-inset-bottom, 14px) + 14px);

  display: flex;
  flex-direction: column;

  gap: 8px;
}

.controlButton {
  min-width: 86px;
  min-height: 44px;

  border: none;
  border-radius: 11px;

  background: white;

  font-size: 14px;
  font-weight: 800;

  box-shadow:
    0 3px 12px rgba(0,0,0,.35);
}

/* =========================
   GPS 狀態
========================= */

#gpsStatus {
  position: absolute;
  z-index: 20;

  left: 110px;
  right: 110px;

  bottom: calc(env(safe-area-inset-bottom, 14px) + 20px);

  padding: 8px 10px;

  border-radius: 9px;

  background: rgba(0,0,0,.65);

  color: white;

  text-align: center;

  font-size: 12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="navigationPanel">

  <div id="direction">
    ↑
  </div>

  <div id="roadName">
    3D 駕駛模式
  </div>

  <div id="distance">
    正在取得 GPS…
  </div>

</div>

<div id="speedPanel">

  <div id="speed">
    0
  </div>

  <div id="speedUnit">
    km/h
  </div>

</div>

<div id="controls">

  <button
    class="controlButton"
    id="followButton">
    🎯 跟隨
  </button>

  <button
    class="controlButton"
    id="flatButton">
    🗺️ 平面
  </button>

  <button
    class="controlButton"
    id="backButton">
    ← 地圖
  </button>

</div>

<div id="gpsStatus">
  正在啟動 3D 地圖…
</div>


<script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>

<script>

let map = null;

let userMarker = null;

let currentLat = null;
let currentLng = null;

let currentHeading = 0;
let currentSpeed = 0;

let followMode = true;
let is3D = true;

let lastPosition = null;


/* =========================================
   建立 MapLibre 真正 WebGL 地圖
========================================= */

function initialize3DMap() {

  map = new maplibregl.Map({

    container: "map",

    style:
      "https://tiles.openfreemap.org/styles/liberty",

    center: [
      121.5654,
      25.0330
    ],

    zoom: 16,

    pitch: 68,

    bearing: 0,

    maxPitch: 75,

    antialias: true

  });


  map.addControl(

    new maplibregl.NavigationControl({
      showCompass: true
    }),

    "top-right"

  );


  map.on("load", function() {

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "✓ WebGL 3D 地圖已啟動，等待 GPS…";

  });

}


/* =========================================
   計算兩點距離
========================================= */

function distanceBetween(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dp =
    (lat2 - lat1) *
    Math.PI / 180;

  const dl =
    (lng2 - lng1) *
    Math.PI / 180;

  const a =
    Math.sin(dp / 2) *
    Math.sin(dp / 2) +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dl / 2) *
    Math.sin(dl / 2);

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}


/* =========================================
   計算行進方向
========================================= */

function calculateBearing(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dl =
    (lng2 - lng1) *
    Math.PI / 180;

  const y =
    Math.sin(dl) *
    Math.cos(p2);

  const x =
    Math.cos(p1) *
    Math.sin(p2) -

    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);

  return (
    Math.atan2(y, x) *
    180 /
    Math.PI +
    360
  ) % 360;

}


/* =========================================
   建立自己的車輛圖示
========================================= */

function createVehicleElement() {

  const vehicle =
    document.createElement("div");

  vehicle.style.width = "0";
  vehicle.style.height = "0";

  vehicle.style.borderLeft =
    "14px solid transparent";

  vehicle.style.borderRight =
    "14px solid transparent";

  vehicle.style.borderBottom =
    "38px solid #06C755";

  vehicle.style.filter =
    "drop-shadow(0 3px 4px rgba(0,0,0,.5))";

  return vehicle;

}


/* =========================================
   GPS
========================================= */

function startGPS() {

  if (!navigator.geolocation) {

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "此裝置不支援 GPS";

    return;

  }


  navigator.geolocation.watchPosition(

    function(position) {

      updateGPS(position);

    },

    function(error) {

      document.getElementById(
        "gpsStatus"
      ).textContent =
        "GPS 定位失敗：" +
        error.message;

    },

    {

      enableHighAccuracy: true,

      maximumAge: 1000,

      timeout: 15000

    }

  );

}


/* =========================================
   更新 GPS
========================================= */

function updateGPS(position) {

  const coords =
    position.coords;

  const lat =
    Number(coords.latitude);

  const lng =
    Number(coords.longitude);


  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ) {
    return;
  }


  /* ---------- 速度 ---------- */

  let speed =
    Number(coords.speed);


  if (
    !Number.isFinite(speed) ||
    speed < 0
  ) {

    speed = 0;

  } else {

    speed *= 3.6;

  }


  currentSpeed =
    Math.max(
      0,
      Math.min(
        200,
        speed
      )
    );


  /* ---------- 方向 ---------- */

  let heading =
    Number(coords.heading);


  if (
    !Number.isFinite(heading) &&
    lastPosition
  ) {

    const moved =
      distanceBetween(

        lastPosition.lat,
        lastPosition.lng,

        lat,
        lng

      );


    if (moved > 5) {

      heading =
        calculateBearing(

          lastPosition.lat,
          lastPosition.lng,

          lat,
          lng

        );

    }

  }


  if (
    Number.isFinite(heading) &&
    currentSpeed > 2
  ) {

    currentHeading =
      heading;

  }


  currentLat = lat;

  currentLng = lng;


  /* ---------- 車輛 ---------- */

  if (!userMarker) {

    userMarker =
      new maplibregl.Marker({

        element:
          createVehicleElement(),

        rotationAlignment:
          "map",

        pitchAlignment:
          "map"

      })

      .setLngLat([
        lng,
        lat
      ])

      .addTo(map);

  } else {

    userMarker
      .setLngLat([
        lng,
        lat
      ]);

  }


  /* ---------- 顯示速度 ---------- */

  document.getElementById(
    "speed"
  ).textContent =
    Math.round(
      currentSpeed
    );


  /* ---------- GPS 狀態 ---------- */

  document.getElementById(
    "gpsStatus"
  ).textContent =
    "GPS ±" +
    Math.round(
      coords.accuracy || 0
    ) +
    "m｜方向 " +
    Math.round(
      currentHeading
    ) +
    "°";


  /* ---------- 駕駛攝影機 ---------- */

  updateDrivingCamera();


  lastPosition = {

    lat: lat,

    lng: lng

  };

}


/* =========================================
   真正 3D 駕駛攝影機
========================================= */

function updateDrivingCamera() {

  if (
    !map ||
    currentLat === null ||
    !followMode
  ) {

    return;

  }


  map.easeTo({

    center: [
      currentLng,
      currentLat
    ],

    zoom: 18,

    pitch:
      is3D
        ? 68
        : 0,

    bearing:
      is3D
        ? currentHeading
        : 0,

    duration: 250,

    essential: true

  });

}


/* =========================================
   跟隨
========================================= */

document
  .getElementById(
    "followButton"
  )
  .addEventListener(
    "click",
    function() {

      followMode = true;

      updateDrivingCamera();

    }
  );


/* =========================================
   3D / 平面
========================================= */

document
  .getElementById(
    "flatButton"
  )
  .addEventListener(
    "click",
    function() {

      is3D = !is3D;

      this.textContent =
        is3D
          ? "🗺️ 平面"
          : "🚗 3D";

      updateDrivingCamera();

    }
  );


/* =========================================
   回到 map.html
========================================= */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    function() {

      window.location.href =
        "map.html";

    }
  );


/* =========================================
   啟動
========================================= */

initialize3DMap();

startGPS();

</script>

</body>
</html>
