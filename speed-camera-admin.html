/* =========================
   CSV 基本工具
========================= */

function cleanHeader(value) {

  return String(value || "")
    .replace(/^\uFEFF/, "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "");
}

function parseCSVLine(
  line,
  separator
) {

  var result = [];

  var current = "";

  var insideQuotes = false;

  for (
    var i = 0;
    i < line.length;
    i++
  ) {

    var char = line[i];

    if (char === '"') {

      if (
        insideQuotes &&
        line[i + 1] === '"'
      ) {

        current += '"';

        i++;

      } else {

        insideQuotes =
          !insideQuotes;
      }

    } else if (
      char === separator &&
      !insideQuotes
    ) {

      result.push(
        current.trim()
      );

      current = "";

    } else {

      current += char;
    }
  }

  result.push(
    current.trim()
  );

  return result;
}

function detectSeparator(line) {

  if (line.includes("\t")) {
    return "\t";
  }

  if (line.includes(",")) {
    return ",";
  }

  if (line.includes(";")) {
    return ";";
  }

  return ",";
}

function getCSVLines(text) {

  text =
    text.replace(/^\uFEFF/, "");

  return text
    .split(/\r?\n/)
    .filter(function(line) {

      return line.trim() !== "";

    });
}

function getHeaders(lines) {

  if (!lines.length) {

    throw new Error(
      "CSV 沒有資料。"
    );
  }

  var separator =
    detectSeparator(lines[0]);

  var headers =
    parseCSVLine(
      lines[0],
      separator
    );

  return {
    separator: separator,
    headers: headers
  };
}

function makeHeaderIndex(headers) {

  var index = {};

  headers.forEach(
    function(header, i) {

      index[
        cleanHeader(header)
      ] = i;

    }
  );

  return index;
}

function getValue(
  values,
  index,
  names
) {

  for (
    var i = 0;
    i < names.length;
    i++
  ) {

    var key =
      cleanHeader(names[i]);

    if (
      index[key] !== undefined
    ) {

      return (
        values[index[key]] ||
        ""
      ).trim();
    }
  }

  return "";
}

function numberValue(value) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ) {

    return null;
  }

  var n =
    Number(
      String(value)
        .trim()
        .replace(/,/g, "")
    );

  return Number.isFinite(n)
    ? n
    : null;
}

/* =========================
   固定測速 CSV
========================= */

function parseOfficialCSV(text) {

  var lines =
    getCSVLines(text);

  if (lines.length < 3) {

    throw new Error(
      "CSV 資料不足。"
    );
  }

  var headerInfo =
    getHeaders(lines);

  var separator =
    headerInfo.separator;

  var headers =
    headerInfo.headers;

  var index =
    makeHeaderIndex(headers);

  var requiredHeaders = [

    "CityName",
    "RegionName",
    "Address",
    "DeptNm",
    "BranchNm",
    "Longitude",
    "Latitude",
    "direct",
    "limit"

  ];

  for (
    var h = 0;
    h < requiredHeaders.length;
    h++
  ) {

    if (
      index[
        cleanHeader(
          requiredHeaders[h]
        )
      ] === undefined
    ) {

      throw new Error(
        "缺少官方欄位：" +
        requiredHeaders[h]
      );
    }
  }

  var rows = [];

  /*
    第一行：英文欄位
    第二行：中文說明
    第三行開始：資料
  */

  for (
    var i = 2;
    i < lines.length;
    i++
  ) {

    var values =
      parseCSVLine(
        lines[i],
        separator
      );

    var longitude =
      numberValue(
        getValue(
          values,
          index,
          ["Longitude"]
        )
      );

    var latitude =
      numberValue(
        getValue(
          values,
          index,
          ["Latitude"]
        )
      );

    var limitText =
      getValue(
        values,
        index,
        ["limit"]
      );

    var speedLimit =
      numberValue(
        limitText
      );

    if (
      longitude === null ||
      latitude === null
    ) {

      throw new Error(
        "第 " +
        (i + 1) +
        " 行經緯度不是有效數字。"
      );
    }

    if (
      speedLimit !== null &&
      !Number.isInteger(
        speedLimit
      )
    ) {

      throw new Error(
        "第 " +
        (i + 1) +
        " 行速限不是整數。"
      );
    }

    rows.push({

      CityName:
        getValue(
          values,
          index,
          ["CityName"]
        ) || null,

      RegionName:
        getValue(
          values,
          index,
          ["RegionName"]
        ) || null,

      Address:
        getValue(
          values,
          index,
          ["Address"]
        ) || null,

      DeptNm:
        getValue(
          values,
          index,
          ["DeptNm"]
        ) || null,

      BranchNm:
        getValue(
          values,
          index,
          ["BranchNm"]
        ) || null,

      Longitude:
        longitude,

      Latitude:
        latitude,

      direct:
        getValue(
          values,
          index,
          ["direct"]
        ) || null,

      limit:
        speedLimit

    });
  }

  if (!rows.length) {

    throw new Error(
      "沒有讀取到任何資料。"
    );
  }

  return rows;
}

/* =========================
   科技執法格式辨識
========================= */

function detectTechFormat(headers) {

  var h =
    headers.map(
      cleanHeader
    );

  /*
    台中科技執法
  */

  if (
    h.includes("科技執法種類") &&
    h.includes("設置地點") &&
    h.includes("取締項目") &&
    h.includes("經度") &&
    h.includes("緯度")
  ) {

    return "taichung_tech";
  }

  /*
    台北科技執法
  */

  if (
    h.includes("名稱") &&
    h.includes("取締路段") &&
    h.includes("座標-x") &&
    h.includes("座標-y") &&
    h.includes("啟用日期") &&
    h.includes("取締項目")
  ) {

    return "taipei_tech";
  }

  return null;
}

/* =========================
   台中科技執法
========================= */

function parseTaichungTech(
  lines,
  separator,
  headers
) {

  var index =
    makeHeaderIndex(headers);

  var rows = [];

  for (
    var i = 1;
    i < lines.length;
    i++
  ) {

    var values =
      parseCSVLine(
        lines[i],
        separator
      );

    var longitude =
      numberValue(
        getValue(
          values,
          index,
          ["經度"]
        )
      );

    var latitude =
      numberValue(
        getValue(
          values,
          index,
          ["緯度"]
        )
      );

    if (
      longitude === null ||
      latitude === null
    ) {

      throw new Error(
        "台中科技執法第 " +
        (i + 1) +
        " 行經緯度無效。"
      );
    }

    rows.push({

      city_name:
        "台中市",

      enforcement_type:
        getValue(
          values,
          index,
          ["科技執法種類"]
        ) || null,

      location:
        getValue(
          values,
          index,
          ["設置地點"]
        ) || null,

      violation_types:
        getValue(
          values,
          index,
          ["取締項目"]
        ) || null,

      longitude:
        longitude,

      latitude:
        latitude,

      activation_date:
        null,

      source_name:
        "台中市政府",

      source_format:
        "taichung_tech"

    });
  }

  return rows;
}

/* =========================

========================= */

function parseTechCSV(text) {

  var lines =
    getCSVLines(text);

  if (lines.length < 2) {

    throw new Error(
      "科技執法 CSV 資料不足。"
    );
  }

  var headerInfo =
    getHeaders(lines);

  var separator =
    headerInfo.separator;

  var headers =
    headerInfo.headers;

  var format =
    detectTechFormat(
      headers
    );

  if (!format) {

    throw new Error(
      "無法辨識科技執法 CSV 格式。\n\n" +
      "目前支援：\n" +
      "1. 台中科技執法\n" +
      "2. 台北科技執法"
    );
  }

  detectedTechFormat =
    format;

  if (
    format === "taichung_tech"
  ) {

    return parseTaichungTech(
      lines,
      separator,
      headers
    );
  }

  if (
    format === "taipei_tech"
  ) {

    return parseTaipeiTech(
      lines,
      separator,
      headers
    );
  }

  throw new Error(
    "未知科技執法格式。"
  );
}

/* =========================
   科技執法預覽
========================= */

techPreviewBtn.addEventListener(
  "click",
  async function() {

    techUpdateBtn.disabled =
      true;

    techPreview.classList.remove(
      "hidden"
    );

    var file =
      techCsvFile.files[0];

    if (!file) {

      techPreview.textContent =
        "請先選擇科技執法 CSV 檔案。";

      return;
    }

    try {

      var text =
        await file.text();

      parsedTechRows =
        parseTechCSV(text);

      var formatName =
        detectedTechFormat ===
        "taichung_tech"
          ? "台中科技執法"
          : "台北科技執法";

      var html =

        '<div class="info-row">' +
          '<span>檔案</span>' +
          '<strong>' +
          escapeHTML(
            file.name
          ) +
          '</strong>' +
        '</div>' +

        '<div class="info-row">' +
          '<span>辨識格式</span>' +
          '<strong>' +
            '<span class="badge">' +
              formatName +
            '</span>' +
          '</strong>' +
        '</div>' +

        '<div class="info-row">' +
          '<span>資料筆數</span>' +
          '<strong>' +
          parsedTechRows.length +
          '</strong>' +
        '</div>';

      if (
        parsedTechRows.length
      ) {

        var first =
          parsedTechRows[0];

        html +=

          '<div class="info-row">' +
            '<span>第一筆地點</span>' +
            '<strong>' +
            escapeHTML(
              first.location ||
              ""
            ) +
            '</strong>' +
          '</div>' +

          '<div class="info-row">' +
            '<span>第一筆經度</span>' +
            '<strong>' +
            first.longitude +
            '</strong>' +
          '</div>' +

          '<div class="info-row">' +
            '<span>第一筆緯度</span>' +
            '<strong>' +
            first.latitude +
            '</strong>' +
          '</div>' +

          '<div class="info-row">' +
            '<span>取締項目</span>' +
            '<strong>' +
            escapeHTML(
              first.violation_types ||
              ""
            ) +
            '</strong>' +
          '</div>';
      }

      html +=

        '<div class="success-box">' +
        '✓ 科技執法格式辨識成功。' +
        '</div>' +

        '<p>' +
        '系統已經把官方欄位轉換成統一格式。' +
        '</p>' +

        '<p>' +
        '請確認資料筆數與內容正確後，再按下「確認更新科技執法資料」。' +
        '</p>';

      techPreview.innerHTML =
        html;

      techUpdateBtn.disabled =
        parsedTechRows.length === 0;

    } catch (error) {

      parsedTechRows = [];

      detectedTechFormat = "";

      techPreview.innerHTML =
        '<div class="danger-box">' +
        '匯入檢查失敗：\n' +
        escapeHTML(
          error.message
        ) +
        '</div>';
    }
  }
);

/* =========================
   科技執法更新
========================= */

techUpdateBtn.addEventListener(
  "click",
  async function() {

    if (
      !parsedTechRows.length
    ) {

      return;
    }

    var formatName =
      detectedTechFormat ===
      "taichung_tech"
        ? "台中科技執法"
        : "台北科技執法";

    var confirmed =
      confirm(
        "確定要更新科技執法資料嗎？\n\n" +
        "格式：" +
        formatName +
        "\n" +
        "資料筆數：" +
        parsedTechRows.length +
        " 筆\n\n" +
        "系統將用這批資料更新 tech_enforcement。"
      );

    if (!confirmed) {
      return;
    }

    techUpdateBtn.disabled =
      true;

    techPreview.textContent =
      "正在更新科技執法資料，請稍候...";

    try {

      var result =
        await supabaseClient.rpc(
          "replace_tech_enforcement",
          {
            enforcement_data:
              parsedTechRows
          }
        );

      if (result.error) {
        throw result.error;
      }

      techPreview.innerHTML =
        '<div class="success-box">' +
        '✓ 科技執法更新成功！\n' +
        '格式：' +
        formatName +
        '\n' +
        '共更新 ' +
        result.data +
        ' 筆資料。' +
        '</div>';

      parsedTechRows = [];

      detectedTechFormat = "";

      await loadDatabaseStatus();

    } catch (error) {

      techPreview.innerHTML =
        '<div class="danger-box">' +
        '更新失敗：\n' +
        escapeHTML(
          error.message
        ) +
        '</div>';

      techUpdateBtn.disabled =
        false;
    }
  }
);

/* =========================
   資料庫狀態
========================= */

async function loadDatabaseStatus() {

  /*
    固定測速
  */

  var speedResult =
    await supabaseClient
      .from("speed_cameras")
      .select("*", {
        count: "exact",
        head: true
      });

  var speedElement =
    document.getElementById(
      "speedCameraCount"
    );

  if (
    speedResult.error
  ) {

    speedElement.textContent =
      "讀取失敗";

    console.error(
      "測速資料筆數讀取失敗：",
      speedResult.error
    );

  } else {

    speedElement.textContent =
      (
        speedResult.count || 0
      ) +
      " 筆";
  }

  /*
    科技執法
  */

  var techResult =
    await supabaseClient
      .from("tech_enforcement")
      .select("*", {
        count: "exact",
        head: true
      });

  var techElement =
    document.getElementById(
      "techEnforcementCount"
    );

  if (
    techResult.error
  ) {

    techElement.textContent =
      "讀取失敗";

    console.error(
      "科技執法資料筆數讀取失敗：",
      techResult.error
    );

  } else {

    techElement.textContent =
      (
        techResult.count || 0
      ) +
      " 筆";
  }
}

/* =========================
   HTML 安全處理
========================= */

function escapeHTML(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

/* =========================
   啟動
========================= */

checkAdmin().then(
  function(isAdmin) {

    if (isAdmin) {

      loadDatabaseStatus();
    }

  }
);
