<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>對話 - 安全團聚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #e8e8e8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: #111;
}

/* =========================
   頂部
========================= */

.header {
  background: #06C755;
  color: #fff;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.back {
  color: #fff;
  text-decoration: none;
  font-size: 24px;
  padding: 4px;
}

.header-info {
  flex: 1;
  min-width: 0;
}

.header-name {
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-status {
  font-size: 12px;
  opacity: 0.95;
}

.header-actions {
  display: flex;
  gap: 2px;
}

.header-actions button {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 13px;
  padding: 6px 8px;
}

/* =========================
   訊息區
========================= */

.messages {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 一整列訊息 */

.message-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
}

.message-row.me {
  flex-direction: row-reverse;
}

/* 頭像 */

.message-avatar {
  width: 38px;
  height: 38px;
  min-width: 38px;
  border-radius: 50%;
  background: #d8d8d8;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #666;
  font-size: 19px;
  font-weight: 700;
  margin-top: 2px;
}

.message-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 訊息內容 */

.message-content {
  max-width: 78%;
  min-width: 0;
}

.sender-name {
  font-size: 11px;
  color: #666;
  margin: 0 4px 3px;
  font-weight: 600;
}

.message-row.me .sender-name {
  text-align: right;
}

/* 訊息泡泡 */

.msg {
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.4;
  word-break: break-word;
}

.msg.them {
  background: #fff;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.msg.me {
  background: #dcf8c6;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.msg.recalled {
  background: #f0f0f0;
  color: #888;
  font-size: 13px;
  font-style: italic;
}

.msg-time {
  font-size: 11px;
  color: #999;
  margin-top: 4px;
  text-align: right;
}

.msg-tag {
  font-size: 11px;
  color: #06C755;
  margin-bottom: 4px;
  font-weight: 600;
}

.msg img,
.msg video {
  max-width: 100%;
  border-radius: 10px;
  display: block;
}

.msg audio {
  width: 100%;
}

/* =========================
   SOS 訊息
========================= */

.sos-message {
  background: #fff0f0 !important;
  border: 2px solid #e53935;
  color: #b71c1c;
}

.sos-title {
  font-size: 15px;
  font-weight: 800;
  color: #d32f2f;
  margin-bottom: 4px;
}

.sos-location {
  font-size: 13px;
  margin-top: 5px;
  color: #555;
}

/* =========================
   Composer
========================= */

.composer {
  background: #f7f7f7;
  border-top: 1px solid #ddd;
  padding: 8px 8px 12px;
  position: sticky;
  bottom: 0;
  z-index: 50;
}

.settings-bar {
  display: flex;
  gap: 12px;
  padding: 4px 8px 0;
  font-size: 12px;
  color: #666;
}

.composer-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.icon-btn,
.text-btn {
  border: none;
  background: transparent;
  color: #333;
  font-size: 13px;
  padding: 6px 4px;
  flex-shrink: 0;
}

.icon-btn {
  width: 36px;
  height: 36px;
  font-size: 20px;
}

#msgInput {
  flex: 1;
  min-width: 0;
  background: #fff;
  border-radius: 18px;
  padding: 10px 14px;
  font-size: 15px;
  border: 1px solid #e0e0e0;
  outline: none;
}

.send-btn {
  border: none;
  background: #06C755;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 16px;
}

/* =========================
   彈出選單
========================= */

.sheet-mask,
.action-mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
}

.sheet-mask.show,
.action-mask.show {
  display: block;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: #fff;
  border-radius: 14px 14px 0 0;
  z-index: 201;
  padding: 8px 0 24px;
  transform: translateY(100%);
  transition: transform 0.2s;
}

.sheet.show {
  transform: translateY(0);
}

.sheet-item {
  padding: 16px 20px;
  font-size: 16px;
  border-bottom: 1px solid #f0f0f0;
}

.sheet-cancel {
  text-align: center;
  color: #06C755;
  font-weight: 600;
  padding: 14px;
}

/* =========================
   訊息操作
========================= */

.action-box {
  display: none;
  position: fixed;
  left: 50%;
  top: 40%;
  transform: translate(-50%,-50%);
  background: #fff;
  border-radius: 12px;
  min-width: 200px;
  z-index: 301;
  overflow: hidden;
}

.action-box.show {
  display: block;
}

.action-item {
  padding: 14px 18px;
  font-size: 15px;
  border-bottom: 1px solid #f0f0f0;
}

.action-item.danger {
  color: #c62828;
}

/* =========================
   貼圖
========================= */

.sticker-panel {
  display: none;
  background: #fff;
  border-top: 1px solid #ddd;
  padding: 10px;
  max-height: 160px;
  overflow-y: auto;
}

.sticker-panel.show {
  display: block;
}

.sticker-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.sticker-grid span {
  font-size: 28px;
  text-align: center;
  padding: 4px;
}

/* =========================
   File
========================= */

input[type="file"] {
  display: none;
}

/* =========================
   成員管理
========================= */

.member-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}

.member-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ddd;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.member-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.member-info {
  flex: 1;
  min-width: 0;
}

.member-name {
  font-size: 14px;
  font-weight: 600;
}

.member-role {
  font-size: 11px;
  color: #999;
  margin-top: 2px;
}
</style>
</head>

<body>

<!-- =========================
     Header
========================= -->

<div class="header">

  <a class="back" href="chat.html">‹</a>

  <div class="header-info">
    <div class="header-name" id="roomName">對話</div>
    <div class="header-status" id="roomStatus">啟動中…</div>
  </div>

  <div class="header-actions">

    <button type="button" id="btnAudio">
      語音
    </button>

    <button type="button" id="btnVideo">
      視訊
    </button>

    <button type="button" id="btnMap">
      地圖
    </button>

    <button type="button" id="btnMembers" style="display:none">
      成員
    </button>

  </div>

</div>


<!-- =========================
     Messages
========================= -->

<div class="messages" id="messages"></div>


<!-- =========================
     Sticker
========================= -->

<div class="sticker-panel" id="stickerPanel">

  <div class="sticker-grid" id="stickerGrid"></div>

</div>


<!-- =========================
     Composer
========================= -->

<div class="composer">

  <div class="settings-bar">

    <label>
      <input type="checkbox" id="optSound" checked>
      提示音
    </label>

    <label>
      <input type="checkbox" id="optVibrate" checked>
      震動
    </label>

  </div>

  <div class="composer-row">

    <button
      type="button"
      class="icon-btn"
      id="btnPlus">
      ＋
    </button>

    <button
      type="button"
      class="text-btn"
      id="btnCam">
      相機
    </button>

    <input
      type="text"
      id="msgInput"
      placeholder="輸入訊息"
      autocomplete="off">

    <button
      type="button"
      class="text-btn"
      id="btnSticker">
      表情
    </button>

    <button
      type="button"
      class="text-btn"
      id="btnVoice">
      語音
    </button>

    <button
      type="button"
      class="send-btn"
      id="btnSend">
      送出
    </button>

  </div>

</div>


<!-- =========================
     Plus Sheet
========================= -->

<div class="sheet-mask" id="plusMask"></div>

<div class="sheet" id="plusSheet">

  <div class="sheet-item" id="pickAlbum">
    相簿（照片／影片）
  </div>

  <div class="sheet-item" id="pickFile">
    檔案
  </div>

  <div class="sheet-cancel" id="plusCancel">
    取消
  </div>

</div>


<input
  type="file"
  id="fileAlbum"
  accept="image/*,video/*,audio/*">

<input
  type="file"
  id="fileAny"
  accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.mp3,.mp4,.mov,.csv,image/*,video/*,audio/*">

<input
  type="file"
  id="fileCamera"
  accept="image/*,video/*"
  capture="environment">


<!-- =========================
     Message Action
========================= -->

<div class="action-mask" id="actionMask"></div>

<div class="action-box" id="actionBox"></div>


<!-- =========================
     Group Members
========================= -->

<div class="sheet-mask" id="membersMask"></div>

<div class="sheet" id="membersSheet">

  <div style="
    text-align:center;
    font-weight:700;
    padding:12px 0 8px;
    font-size:16px;">
    群組成員管理
  </div>

  <div
    id="membersList"
    style="
      max-height:35vh;
      overflow:auto;
      padding:0 12px;">
  </div>

  <div style="
    font-size:13px;
    color:#888;
    padding:12px 16px 6px;">
    邀請好友加入
  </div>

  <div
    id="inviteList"
    style="
      max-height:30vh;
      overflow:auto;
      padding:0 12px 16px;">
  </div>

  <div
    class="sheet-cancel"
    id="membersClose">
    關閉
  </div>

</div>


<script>

(function () {

  /* =====================================================
     基本設定
  ===================================================== */

  var statusEl =
    document.getElementById('roomStatus');

  function setStatus(t) {

    if (statusEl) {
      statusEl.textContent = t;
    }

  }


  var SUPABASE_URL =
    'https://perfsipperncvjocznhl.supabase.co';

  var SUPABASE_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';


  var RECALL_MS =
    2 * 60 * 1000;


  var stickers = [
    '😀','😅','😂','😊','😍','🤔',
    '👍','👏','🙏','💪','❤️','🔥',
    '✅','❌','🎉','🏠','🚗','📍'
  ];


  var supabase = null;

  var messages = [];

  var selectedId = null;

  var myUser = null;

  var recognizing = false;

  var recognition = null;

  var profileMap = {};


  /* =====================================================
     URL / 房間
  ===================================================== */

  var params =
    new URLSearchParams(location.search);


  var roomName =
    params.get('name')
      ? decodeURIComponent(params.get('name'))
      : '對話';


  var roomId =
    params.get('id') || roomName;


  var isGroup =
    String(roomId).indexOf('dm_') !== 0;


  var isOwner = false;

  var groupMembers = [];


  document.getElementById('roomName').textContent =
    roomName;


  /* =====================================================
     Escape HTML
  ===================================================== */

  function escapeHtml(s) {

    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');

  }


  /* =====================================================
     Avatar URL
  ===================================================== */

  function getAvatarUrl(userId) {

    if (!userId) return '';

    var p = profileMap[userId];

    if (!p) return '';

    return p.avatar_url || '';

  }


  /* =====================================================
     顯示名稱
  ===================================================== */

  function getDisplayName(userId, fallback) {

    if (userId && profileMap[userId]) {

      var p = profileMap[userId];

      if (p.nickname &&
          String(p.nickname).trim()) {

        return p.nickname;

      }

      if (p.username &&
          String(p.username).trim()) {

        return p.username;

      }

    }

    return fallback || '成員';

  }


  /* =====================================================
     頭像 HTML
  ===================================================== */

  function avatarHtml(userId, fallbackName) {

    var url =
      getAvatarUrl(userId);

    var name =
      getDisplayName(userId, fallbackName);


    if (url) {

      return (
        '<div class="message-avatar">' +
          '<img src="' +
          escapeHtml(url) +
          '" alt="' +
          escapeHtml(name) +
          '">' +
        '</div>'
      );

    }


    return (
      '<div class="message-avatar">' +
        '👤' +
      '</div>'
    );

  }


  /* =====================================================
     載入 Profiles
  ===================================================== */

  async function loadProfiles(userIds) {

    if (!supabase) return;

    var ids = [];

    (userIds || []).forEach(function (id) {

      if (!id) return;

      if (ids.indexOf(id) === -1) {
        ids.push(id);
      }

    });


    if (!ids.length) return;


    var missing = ids.filter(function (id) {

      return !profileMap[id];

    });


    if (!missing.length) return;


    try {

      var res =
        await supabase
          .from('profiles')
          .select('id,username,nickname,avatar_url')
          .in('id', missing);


      if (res.error) {

        console.log(
          'profiles 載入失敗:',
          res.error.message
        );

        return;

      }


      (res.data || []).forEach(function (p) {

        profileMap[p.id] = p;

      });


    } catch (e) {

      console.log(
        'profiles error:',
        e
      );

    }

  }


  /* =====================================================
     從現有訊息收集使用者
  ===================================================== */

  async function loadProfilesFromMessages(rows) {

    var ids = (rows || [])
      .map(function (r) {
        return r.user_id;
      })
      .filter(Boolean);


    await loadProfiles(ids);

  }


  /* =====================================================
     私聊對象
  ===================================================== */

  function peerIdFromRoom() {

    if (
      !myUser ||
      !roomId ||
      String(roomId).indexOf('dm_') !== 0
    ) {
      return '';
    }


    var rest =
      String(roomId).slice(3);


    var mid =
      rest.indexOf(myUser.id);


    if (mid < 0) return '';


    if (
      rest.indexOf(myUser.id) === 0
    ) {

      return rest.slice(
        myUser.id.length + 1
      );

    }


    return rest.slice(
      0,
      rest.length -
      myUser.id.length -
      1
    );

  }


  /* =====================================================
     通話
  ===================================================== */

  function goCall(mode) {

    var to =
      peerIdFromRoom();


    var url =
      'call.html?mode=' +
      encodeURIComponent(mode) +
      '&name=' +
      encodeURIComponent(roomName);


    if (to) {

      url +=
        '&to=' +
        encodeURIComponent(to);

    }


    location.href = url;

  }


  document.getElementById('btnAudio').onclick =
    function () {

      goCall('audio');

    };


  document.getElementById('btnVideo').onclick =
    function () {

      goCall('video');

    };


  document.getElementById('btnMap').onclick =
    function () {

      location.href =
        'map.html?id=' +
        encodeURIComponent(roomId) +
        '&name=' +
        encodeURIComponent(roomName);

    };


  /* =====================================================
     時間
  ===================================================== */

  function nowTime() {

    var n = new Date();

    return (
      n.getHours() +
      ':' +
      String(n.getMinutes()).padStart(2,'0')
    );

  }


  function nowTimeFrom(iso) {

    if (!iso) return '';

    var d = new Date(iso);

    return (
      d.getHours() +
      ':' +
      String(d.getMinutes()).padStart(2,'0')
    );

  }


  /* =====================================================
     DB row → local
  ===================================================== */

  function rowToLocal(row) {

    var profile =
      profileMap[row.user_id] || {};


    return {

      id: row.id,

      mine:
        myUser &&
        row.user_id === myUser.id,

      kind:
        row.kind || 'text',

      text:
        row.body || '',

      all:
        !!row.is_all,

      time:
        nowTimeFrom(row.created_at),

      createdAt:
        new Date(row.created_at).getTime(),

      recalled:
        !!row.recalled,

      hiddenLocal:
        false,

      senderName:
        profile.nickname ||
        profile.username ||
        row.sender_name ||
        '成員',

      avatarUrl:
        profile.avatar_url ||
        '',

      userId:
        row.user_id

    };

  }


  /* =====================================================
     通知聲音
  ===================================================== */

  function playNotify() {

    try {

      if (
        document.getElementById('optSound') &&
        document.getElementById('optSound').checked
      ) {

        var ctx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();


        var o =
          ctx.createOscillator();


        var g =
          ctx.createGain();


        o.frequency.value =
          880;


        g.gain.value =
          0.06;


        o.connect(g);

        g.connect(
          ctx.destination
        );


        o.start();

        o.stop(
          ctx.currentTime + 0.12
        );

      }


      if (
        document.getElementById('optVibrate') &&
        document.getElementById('optVibrate').checked &&
        navigator.vibrate
      ) {

        navigator.vibrate(120);

      }

    } catch (e) {}

  }


  /* =====================================================
     SOS 訊息判斷
  ===================================================== */

  function isSosMessage(m) {

    if (!m) return false;

    var text =
      String(m.text || '').toUpperCase();


    return (
      text.indexOf('SOS') >= 0 ||
      text.indexOf('緊急求助') >= 0 ||
      text.indexOf('緊急 SOS') >= 0
    );

  }


  /* =====================================================
     渲染訊息
  ===================================================== */

  function renderMessages() {

    var box =
      document.getElementById('messages');


    box.innerHTML = '';


    messages.forEach(function (m) {

      if (m.hiddenLocal) return;


      var row =
        document.createElement('div');


      row.className =
        'message-row ' +
        (m.mine ? 'me' : 'them');


      var content =
        document.createElement('div');


      content.className =
        'message-content';


      var displayName =
        getDisplayName(
          m.userId,
          m.senderName
        );


      var avatar =
        avatarHtml(
          m.userId,
          displayName
        );


      var nameHtml =
        '<div class="sender-name">' +
        escapeHtml(displayName) +
        '</div>';


      var msg =
        document.createElement('div');


      var cls =
        'msg ' +
        (m.mine ? 'me' : 'them');


      if (m.recalled) {

        cls += ' recalled';

      }


      if (isSosMessage(m)) {

        cls += ' sos-message';

      }


      msg.className =
        cls;


      /* -------------------------
         已回收
      ------------------------- */

      if (m.recalled) {

        msg.innerHTML =
          (
            m.mine
              ? '你已回收一則訊息'
              : '對方已回收一則訊息'
          ) +
          '<div class="msg-time">' +
          m.time +
          '</div>';

      }

      else {

        var html = '';


        /* 群組 / 私聊全部顯示名字 */

        html += nameHtml;


        /* @all */

        if (m.all) {

          html +=
            '<div class="msg-tag">' +
            '@all 全體' +
            '</div>';

        }


        /* SOS */

        if (isSosMessage(m)) {

          html +=
            '<div class="sos-title">' +
            '🚨 緊急 SOS 求救' +
            '</div>';

        }


        /* 圖片 */

        if (m.kind === 'image') {

          html +=
            '<img src="' +
            escapeHtml(m.text) +
            '" alt="圖片">';

        }


        /* 影片 */

        else if (m.kind === 'video') {

          html +=
            '<video src="' +
            escapeHtml(m.text) +
            '" controls playsinline></video>';

        }


        /* 音訊 */

        else if (m.kind === 'audio') {

          html +=
            '<audio src="' +
            escapeHtml(m.text) +
            '" controls></audio>';

        }


        /* 貼圖 */

        else if (m.kind === 'sticker') {

          html +=
            '<span style="font-size:36px">' +
            escapeHtml(m.text) +
            '</span>';

        }


        /* 檔案 */

        else if (
          m.kind === 'file' ||
          m.kind === 'media' ||
          m.kind === 'camera'
        ) {

          if (
            /^https?:\/\//.test(m.text)
          ) {

            html +=
              '<a href="' +
              escapeHtml(m.text) +
              '" target="_blank" rel="noopener">' +
              '開啟檔案' +
              '</a>';

          }

          else {

            html +=
              '［檔案］' +
              escapeHtml(m.text);

          }

        }


        /* 文字 */

        else {

          html +=
            escapeHtml(m.text);

        }


        html +=
          '<div class="msg-time">' +
          m.time +
          '</div>';


        msg.innerHTML =
          html;

      }


      content.appendChild(msg);

      row.innerHTML =
        avatar;


      row.appendChild(content);


      /* 長按 */

      var timer = null;


      row.addEventListener(
        'touchstart',
        function () {

          timer =
            setTimeout(
              function () {

                openAction(m.id);

              },
              450
            );

        },
        { passive: true }
      );


      row.addEventListener(
        'touchend',
        function () {

          clearTimeout(timer);

        }
      );


      row.addEventListener(
        'touchmove',
        function () {

          clearTimeout(timer);

        }
      );


      row.addEventListener(
        'contextmenu',
        function (e) {

          e.preventDefault();

          openAction(m.id);

        }
      );


      box.appendChild(row);

    });


    box.scrollTop =
      box.scrollHeight;

  }

  /* =====================================================
     檔案類型
  ===================================================== */

  function guessKind(file) {

    var t =
      (file.type || '').toLowerCase();


    if (
      t.indexOf('image/') === 0
    ) return 'image';


    if (
      t.indexOf('video/') === 0
    ) return 'video';


    if (
      t.indexOf('audio/') === 0
    ) return 'audio';


    return 'file';

  }


  /* =====================================================
     上傳檔案
  ===================================================== */

  async function uploadAndSend(file) {

    if (!file) return;


    if (!myUser || !supabase) {

      setStatus(
        '請先登入才能傳檔'
      );

      return;

    }


    setStatus('上傳中…');


    var kind =
      guessKind(file);


    var ext =
      (
        file.name
          .split('.')
          .pop() ||
        'bin'
      ).toLowerCase();


    var path =
      myUser.id +
      '/' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 10000
      ) +
      '.' +
      ext;


    var up =
      await supabase
        .storage
        .from('chat-media')
        .upload(
          path,
          file,
          {
            cacheControl: '3600',
            upsert: false,
            contentType:
              file.type || undefined
          }
        );


    if (up.error) {

      setStatus(
        '上傳失敗：' +
        up.error.message
      );

      return;

    }


    var pub =
      supabase
        .storage
        .from('chat-media')
        .getPublicUrl(path);


    var url =
      pub.data &&
      pub.data.publicUrl;


    if (!url) {

      setStatus(
        '無法取得檔案網址'
      );

      return;

    }


    var ins =
      await supabase
        .from('messages')
        .insert({

          room_id:
            roomId,

          user_id:
            myUser.id,

          sender_name:
            getDisplayName(
              myUser.id,
              myUser.email
            ),

          kind:
            kind,

          body:
            url,

          is_all:
            false

        });


    if (ins.error) {

      setStatus(
        '訊息失敗：' +
        ins.error.message
      );

      return;

    }


    setStatus(
      '即時通訊已開啟'
    );

  }


  /* =====================================================
     發送文字
  ===================================================== */

  async function sendMsg() {

    var input =
      document.getElementById(
        'msgInput'
      );


    var text =
      input.value.trim();


    if (!text) return;


    var all = false;


    if (
      /^@all\b/i.test(text) ||
      text.indexOf('@全體') === 0
    ) {

      all = true;


      text =
        text
          .replace(/^@all\b/i, '')
          .replace(/^@全體/, '')
          .trim() ||
        '（全體通知）';

    }


    input.value = '';


    if (!myUser || !supabase) {

      pushLocal(
        'text',
        text,
        all
      );

      setStatus(
        '本機模式（未登入或未連線）'
      );

      return;

    }


    setStatus('送出中…');


    var res =
      await supabase
        .from('messages')
        .insert({

          room_id:
            roomId,

          user_id:
            myUser.id,

          sender_name:
            getDisplayName(
              myUser.id,
              myUser.email || 'user'
            ),

          kind:
            'text',

          body:
            text,

          is_all:
            all

        });


    if (res.error) {

      setStatus(
        '送出失敗：' +
        res.error.message
      );


      pushLocal(
        'text',
        text,
        all
      );


      return;

    }


    setStatus(
      '即時通訊已開啟'
    );

  }

  /* =====================================================
     Realtime 初始化
  ===================================================== */

  async function initRealtime() {

    try {

      setStatus(
        '檢查套件…'
      );


      if (
        !window.supabase ||
        !window.supabase.createClient
      ) {

        setStatus(
          '套件未載入，可先本機聊天'
        );

        return;

      }


      supabase =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      setStatus(
        '檢查登入…'
      );


      var sessRes =
        await supabase.auth.getSession();


      var session =
        sessRes.data &&
        sessRes.data.session;


      if (!session) {

        setStatus(
          '未登入：可本機聊天，或先去登入'
        );

        return;

      }


      myUser =
        session.user;


      /* -------------------------
         先載入自己的 Profile
      ------------------------- */

      await loadProfiles([
        myUser.id
      ]);


      /* -------------------------
         私聊：載入對方 Profile
      ------------------------- */

      var peer =
        peerIdFromRoom();


      if (peer) {

        await loadProfiles([
          peer
        ]);

      }


      setStatus(
        '已登入，載入訊息…'
      );


      /* -------------------------
         讀取聊天
      ------------------------- */

      var q =
        await supabase
          .from('messages')
          .select('*')
          .eq(
            'room_id',
            roomId
          )
          .order(
            'created_at',
            {
              ascending: true
            }
          )
          .limit(100);


      if (q.error) {

        setStatus(
          '載入失敗：' +
          q.error.message +
          '（仍可本機聊天）'
        );

        return;

      }


      /* -------------------------
         先抓所有訊息使用者 Profile
      ------------------------- */

      await loadProfilesFromMessages(
        q.data || []
      );


      messages =
        (q.data || [])
          .map(rowToLocal);


      renderMessages();


      setStatus(
        '已連線'
      );


      /* -------------------------
         群組成員
      ------------------------- */

      if (isGroup) {

        await loadGroupMemberProfiles();

        await checkOwnerAndShowMembersBtn();

      }


      /* =================================================
         Realtime
      ================================================= */

      supabase
        .channel(
          'room:' + roomId
        )

        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'messages',
            filter:
              'room_id=eq.' + roomId
          },

          async function (payload) {

            /* -------------------------
               新訊息
            ------------------------- */

            if (
              payload.eventType ===
              'INSERT'
            ) {

              /* 先取得發送者 Profile */

              await loadProfiles([
                payload.new.user_id
              ]);


              var m =
                rowToLocal(
                  payload.new
                );


              if (
                !messages.find(
                  function (x) {
                    return x.id === m.id;
                  }
                )
              ) {

                messages.push(m);

                renderMessages();


                if (!m.mine) {

                  playNotify();

                }

              }

            }


            /* -------------------------
               更新
            ------------------------- */

            if (
              payload.eventType ===
              'UPDATE'
            ) {

              await loadProfiles([
                payload.new.user_id
              ]);


              var m2 =
                rowToLocal(
                  payload.new
                );


              var i =
                messages.findIndex(
                  function (x) {
                    return x.id === m2.id;
                  }
                );


              if (i >= 0) {

                messages[i] =
                  Object.assign(
                    {},
                    messages[i],
                    m2
                  );

              }

              else {

                messages.push(m2);

              }


              renderMessages();

            }


            /* -------------------------
               刪除
            ------------------------- */

            if (
              payload.eventType ===
              'DELETE'
            ) {

              var delId =
                payload.old &&
                payload.old.id;


              if (delId) {

                messages =
                  messages.filter(
                    function (x) {
                      return x.id !== delId;
                    }
                  );


                renderMessages();

              }

            }

          }
        )

        .subscribe(
          function (status) {

            if (
              status === 'SUBSCRIBED'
            ) {

              setStatus(
                '即時通訊已開啟'
              );

            }

          }
        );


    } catch (e) {

      setStatus(
        '錯誤：' +
        (
          e &&
          e.message
            ? e.message
            : e
        )
      );

    }

  }

  /* =====================================================
     訊息操作
  ===================================================== */

  function openAction(id) {

    selectedId =
      id;


    var m =
      messages.find(
        function (x) {
          return x.id === id;
        }
      );


    if (
      !m ||
      m.recalled ||
      m.hiddenLocal
    ) {
      return;
    }


    var box =
      document.getElementById(
        'actionBox'
      );


    var html =
      '';


    var canRecall =
      m.mine &&
      !m.recalled &&
      (
        Date.now() -
        m.createdAt <=
        RECALL_MS
      ) &&
      String(m.id).indexOf(
        'local_'
      ) !== 0;


    if (canRecall) {

      html +=
        '<div class="action-item" id="actRecall">' +
        '回收（2分鐘內）' +
        '</div>';

    }


    /*
       一般聊天訊息仍然按照原本邏輯
       這裡沒有加入任何資料庫 SOS 刪除
    */

    html +=
      '<div class="action-item danger" id="actDel">' +
      '刪除' +
      '</div>';


    html +=
      '<div class="action-item" id="actCancel">' +
      '取消' +
      '</div>';


    box.innerHTML =
      html;


    document
      .getElementById(
        'actionMask'
      )
      .classList.add('show');


    box.classList.add('show');


    var r =
      document.getElementById(
        'actRecall'
      );


    if (r) {

      r.onclick =
        doRecall;

    }


    document
      .getElementById(
        'actDel'
      )
      .onclick =
      doDeleteLocal;


    document
      .getElementById(
        'actCancel'
      )
      .onclick =
      closeAction;

  }

  /* =====================================================
     回收
  ===================================================== */

  async function doRecall() {

    var m =
      messages.find(
        function (x) {
          return x.id === selectedId;
        }
      );


    closeAction();


    if (
      !m ||
      !supabase ||
      !myUser
    ) {
      return;
    }


    var res =
      await supabase
        .from('messages')
        .update({
          recalled: true
        })
        .eq(
          'id',
          m.id
        )
        .eq(
          'user_id',
          myUser.id
        );


    if (res.error) {

      setStatus(
        '回收失敗：' +
        res.error.message
      );

    }

  }


  /* =====================================================
     刪除
  ===================================================== */

  async function doDeleteLocal() {

    var m =
      messages.find(
        function (x) {
          return x.id === selectedId;
        }
      );


    closeAction();


    if (!m) return;


    /*
       本機訊息
       只從目前手機畫面消失
    */

    if (
      String(m.id).indexOf(
        'local_'
      ) === 0
    ) {

      m.hiddenLocal =
        true;


      renderMessages();

      return;

    }


    /*
       這裡保留你原本的聊天訊息刪除功能。
       如果你後續要求：
       「聊天訊息不能刪除，只允許 SOS 本機刪除」
       再另外調整。
    */

    if (
      !m.mine ||
      !supabase ||
      !myUser
    ) {

      m.hiddenLocal =
        true;


      renderMessages();

      return;

    }


    setStatus(
      '刪除中…'
    );


    var res =
      await supabase
        .from('messages')
        .delete()
        .eq(
          'id',
          m.id
        )
        .eq(
          'user_id',
          myUser.id
        );


    if (res.error) {

      setStatus(
        '刪除失敗：' +
        res.error.message
      );

      return;

    }


    messages =
      messages.filter(
        function (x) {
          return x.id !== m.id;
        }
      );


    renderMessages();


    setStatus(
      '即時通訊已開啟'
    );

  }


  /* =====================================================
     按鈕
  ===================================================== */

  document
    .getElementById('btnSend')
    .onclick =
    sendMsg;


  document
    .getElementById('msgInput')
    .addEventListener(
      'keydown',
      function (e) {

        if (e.key === 'Enter') {

          sendMsg();

        }

      }
    );


  document
    .getElementById('btnPlus')
    .onclick =
    openPlus;


  document
    .getElementById('plusMask')
    .onclick =
    closePlus;


  document
    .getElementById('plusCancel')
    .onclick =
    closePlus;


  document
    .getElementById('pickAlbum')
    .onclick =
    function () {

      document
        .getElementById(
          'fileAlbum'
        )
        .click();

    };


  document
    .getElementById('pickFile')
    .onclick =
    function () {

      document
        .getElementById(
          'fileAny'
        )
        .click();

    };


  document
    .getElementById('btnCam')
    .onclick =
    function () {

      document
        .getElementById(
          'fileCamera'
        )
        .click();

    };


  document
    .getElementById('actionMask')
    .onclick =
    closeAction;


  /* =====================================================
     File events
  ===================================================== */

  document
    .getElementById('fileAlbum')
    .onchange =
    function () {

      var f =
        this.files &&
        this.files[0];


      this.value =
        '';


      closePlus();


      uploadAndSend(f);

    };


  document
    .getElementById('fileAny')
    .onchange =
    function () {

      var f =
        this.files &&
        this.files[0];


      this.value =
        '';


      closePlus();


      uploadAndSend(f);

    };


  document
    .getElementById('fileCamera')
    .onchange =
    function () {

      var f =
        this.files &&
        this.files[0];


      this.value =
        '';


      uploadAndSend(f);

    };


  /* =====================================================
     Sticker
  ===================================================== */

  document
    .getElementById('btnSticker')
    .onclick =
    function () {

      var p =
        document.getElementById(
          'stickerPanel'
        );


      p.classList.toggle(
        'show'
      );


      var grid =
        document.getElementById(
          'stickerGrid'
        );


      if (
        p.classList.contains('show') &&
        !grid.children.length
      ) {

        stickers.forEach(
          function (s) {

            var span =
              document.createElement(
                'span'
              );


            span.textContent =
              s;


            span.onclick =
              function () {

                p.classList.remove(
                  'show'
                );


                sendPayload(
                  'sticker',
                  s
                );

              };


            grid.appendChild(
              span
            );

          }
        );

      }

    };


  /* =====================================================
     語音轉文字
  ===================================================== */

  document
    .getElementById('btnVoice')
    .onclick =
    function () {

      var SR =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SR) {

        setStatus(
          '不支援語音轉文字'
        );

        return;

      }


      if (
        recognizing &&
        recognition
      ) {

        recognition.stop();

        recognizing =
          false;

        document
          .getElementById(
            'btnVoice'
          )
          .textContent =
          '語音';

        return;

      }


      recognition =
        new SR();


      recognition.lang =
        'zh-TW';


      recognition.onresult =
        function (e) {

          var t =
            e.results[0][0]
              .transcript;


          var input =
            document.getElementById(
              'msgInput'
            );


          input.value =
            (
              input.value
                ? input.value + ' '
                : ''
            ) +
            t;

        };


      recognition.onend =
        recognition.onerror =
        function () {

          recognizing =
            false;


          document
            .getElementById(
              'btnVoice'
            )
            .textContent =
            '語音';

        };


      recognizing =
        true;


      document
        .getElementById(
          'btnVoice'
        )
        .textContent =
        '聆聽中';


      recognition.start();

    };


  /* =====================================================
     啟動
  ===================================================== */

  setStatus(
    '等待套件…'
  );


  var tries = 0;


  function boot() {

    tries += 1;


    if (
      window.supabase
    ) {

      initRealtime();

    }

    else if (
      tries < 30
    ) {

      setStatus(
        '等待套件…(' +
        tries +
        ')'
      );


      setTimeout(
        boot,
        200
      );

    }

    else {

      setStatus(
        '套件載入失敗，可本機聊天'
      );

    }

  }


  boot();


})();

</script>
