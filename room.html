<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>對話 - 安全團聚</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

  background: #e8e8e8;
  color: #111;

  min-height: 100vh;

  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  background: #06C755;
  color: #fff;

  padding: 10px 12px;

  display: flex;
  align-items: center;
  gap: 8px;

  position: sticky;
  top: 0;

  z-index: 100;

  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}

.back {
  color: #fff;
  text-decoration: none;

  font-size: 28px;

  padding: 2px 7px;

  line-height: 1;
}

.header-info {
  flex: 1;
  min-width: 0;
}

.header-name {
  font-weight: 700;
  font-size: 16px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-status {
  font-size: 12px;
  opacity: .95;

  margin-top: 2px;
}

.header-actions {
  display: flex;
  gap: 1px;
}

.header-actions button {
  background: transparent;
  border: none;

  color: #fff;

  font-size: 12px;

  padding: 6px 7px;
}

/* =========================
   MESSAGE AREA
========================= */

.messages {
  flex: 1;

  padding: 12px 10px 14px;

  overflow-y: auto;

  display: flex;
  flex-direction: column;

  gap: 9px;

  min-height: 0;
}

/* =========================
   NORMAL MESSAGE ROW
========================= */

.message-row {
  width: 100%;

  display: flex;

  align-items: flex-end;

  gap: 7px;
}

.message-row.them {
  justify-content: flex-start;
}

.message-row.me {
  justify-content: flex-end;
}

/* =========================
   AVATAR
========================= */

.avatar {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  flex-shrink: 0;

  overflow: hidden;

  background: #d9d9d9;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #666;

  font-size: 16px;
  font-weight: 700;

  border: 1px solid rgba(0,0,0,.08);
}

.avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

/* =========================
   MESSAGE CONTENT
========================= */

.message-column {
  max-width: 78%;

  display: flex;
  flex-direction: column;
}

.message-row.me .message-column {
  align-items: flex-end;
}

.sender-name {
  font-size: 11px;

  color: #666;

  margin-bottom: 3px;

  max-width: 100%;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.msg {
  max-width: 100%;

  padding: 10px 12px;

  border-radius: 14px;

  font-size: 15px;

  line-height: 1.4;

  word-break: break-word;

  box-shadow: 0 1px 1px rgba(0,0,0,.04);
}

.msg.them {
  background: #fff;

  align-self: flex-start;

  border-bottom-left-radius: 4px;
}

.msg.me {
  background: #dcf8c6;

  align-self: flex-end;

  border-bottom-right-radius: 4px;
}

.msg.recalled {
  background: #f0f0f0;

  color: #888;

  font-size: 13px;

  font-style: italic;
}

.msg-time {
  font-size: 10px;

  color: #999;

  margin-top: 4px;

  text-align: right;
}

.msg img,
.msg video {
  max-width: 100%;

  border-radius: 10px;

  display: block;
}

.msg audio {
  width: 100%;
}

/* =========================
   SOS
========================= */

.sos-row {
  width: 100%;

  display: flex;

  align-items: flex-end;

  gap: 7px;
}

.sos-row.them {
  justify-content: flex-start;
}

.sos-row.me {
  justify-content: flex-end;
}

.sos-column {
  max-width: 86%;

  display: flex;
  flex-direction: column;
}

.sos-row.me .sos-column {
  align-items: flex-end;
}

.sos-card {
  width: 100%;

  background: #fff;

  border: 3px solid #e53935;

  border-radius: 14px;

  padding: 12px;

  box-shadow:
    0 2px 8px rgba(229,57,53,.18);
}

.sos-title {
  display: flex;

  align-items: center;

  gap: 7px;

  color: #d32f2f;

  font-size: 16px;

  font-weight: 800;

  margin-bottom: 7px;
}

.sos-icon {
  font-size: 23px;
}

.sos-sender {
  display: flex;

  align-items: center;

  gap: 7px;

  margin-bottom: 8px;
}

.sos-sender-avatar {
  width: 30px;
  height: 30px;

  border-radius: 50%;

  overflow: hidden;

  background: #eee;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  font-size: 13px;
}

.sos-sender-avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.sos-sender-name {
  font-size: 13px;

  font-weight: 700;

  color: #333;
}

.sos-message {
  color: #333;

  font-size: 14px;

  line-height: 1.45;

  margin-bottom: 8px;

  white-space: pre-wrap;

  word-break: break-word;
}

.sos-location {
  background: #fff3f3;

  border-radius: 8px;

  padding: 8px;

  font-size: 12px;

  color: #555;

  margin-bottom: 9px;
}

.sos-actions {
  display: flex;

  gap: 7px;

  flex-wrap: wrap;
}

.sos-btn {
  border: none;

  border-radius: 8px;

  padding: 7px 10px;

  font-size: 12px;

  font-weight: 600;

  cursor: pointer;
}

.sos-map-btn {
  background: #1976d2;
  color: #fff;
}

.sos-delete-btn {
  background: #eeeeee;
  color: #555;
}

.sos-resolve-btn {
  background: #ff9800;
  color: #fff;
}

.sos-time {
  font-size: 10px;

  color: #999;

  margin-top: 7px;

  text-align: right;
}

.sos-hidden-local {
  display: none !important;
}

/* =========================
   COMPOSER
========================= */

.composer {
  background: #f7f7f7;

  border-top: 1px solid #ddd;

  padding: 8px 8px 12px;

  position: sticky;
  bottom: 0;

  z-index: 50;
}

.settings-bar {
  display: flex;

  gap: 12px;

  padding: 4px 8px 6px;

  font-size: 12px;

  color: #666;
}

.composer-row {
  display: flex;

  align-items: center;

  gap: 6px;
}

.icon-btn,
.text-btn {
  border: none;

  background: transparent;

  color: #333;

  font-size: 13px;

  padding: 6px 4px;

  flex-shrink: 0;
}

.icon-btn {
  width: 36px;
  height: 36px;

  font-size: 20px;
}

#msgInput {
  flex: 1;

  min-width: 0;

  background: #fff;

  border-radius: 18px;

  padding: 10px 14px;

  font-size: 15px;

  border: 1px solid #e0e0e0;

  outline: none;
}

#msgInput:focus {
  border-color: #06C755;
}

.send-btn {
  border: none;

  background: #06C755;

  color: #fff;

  font-size: 13px;

  font-weight: 600;

  padding: 8px 12px;

  border-radius: 16px;
}

/* =========================
   STICKERS
========================= */

.sticker-panel {
  display: none;

  background: #fff;

  border-top: 1px solid #ddd;

  padding: 10px;

  max-height: 160px;

  overflow-y: auto;
}

.sticker-panel.show {
  display: block;
}

.sticker-grid {
  display: grid;

  grid-template-columns: repeat(6, 1fr);

  gap: 8px;
}

.sticker-grid span {
  font-size: 28px;

  text-align: center;

  padding: 4px;
}

/* =========================
   SHEETS
========================= */

.sheet-mask,
.action-mask {
  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.35);

  z-index: 200;
}

.sheet-mask.show,
.action-mask.show {
  display: block;
}

.sheet {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  background: #fff;

  border-radius: 14px 14px 0 0;

  z-index: 201;

  padding: 8px 0 24px;

  transform: translateY(100%);

  transition: transform .2s;
}

.sheet.show {
  transform: translateY(0);
}

.sheet-item {
  padding: 16px 20px;

  font-size: 16px;

  border-bottom: 1px solid #f0f0f0;
}

.sheet-cancel {
  text-align: center;

  color: #06C755;

  font-weight: 600;

  padding: 14px;
}

/* =========================
   ACTION BOX
========================= */

.action-box {
  display: none;

  position: fixed;

  left: 50%;
  top: 40%;

  transform: translate(-50%,-50%);

  background: #fff;

  border-radius: 12px;

  min-width: 210px;

  z-index: 301;

  overflow: hidden;

  box-shadow: 0 8px 30px rgba(0,0,0,.2);
}

.action-box.show {
  display: block;
}

.action-item {
  padding: 14px 18px;

  font-size: 15px;

  border-bottom: 1px solid #f0f0f0;
}

.action-item.danger {
  color: #c62828;
}

/* =========================
   GROUP MEMBERS
========================= */

#membersList,
#inviteList {
  max-height: 35vh;

  overflow: auto;
}

/* =========================
   FILE
========================= */

input[type="file"] {
  display: none;
}

/* =========================
   EMPTY
========================= */

.empty-chat {
  text-align: center;

  color: #999;

  padding: 40px 20px;

  font-size: 14px;
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

  <a class="back" href="chat.html">‹</a>

  <div class="header-info">

    <div class="header-name" id="roomName">
      對話
    </div>

    <div class="header-status" id="roomStatus">
      啟動中…
    </div>

  </div>

  <div class="header-actions">

    <button type="button" id="btnAudio">
      語音
    </button>

    <button type="button" id="btnVideo">
      視訊
    </button>

    <button type="button" id="btnMap">
      地圖
    </button>

    <button
      type="button"
      id="btnMembers"
      style="display:none">
      成員
    </button>

  </div>

</div>

<!-- =========================
     MESSAGE AREA
========================= -->

<div class="messages" id="messages"></div>

<!-- =========================
     STICKER
========================= -->

<div
  class="sticker-panel"
  id="stickerPanel">

  <div
    class="sticker-grid"
    id="stickerGrid">
  </div>

</div>

<!-- =========================
     COMPOSER
========================= -->

<div class="composer">

  <div class="settings-bar">

    <label>
      <input
        type="checkbox"
        id="optSound"
        checked>
      提示音
    </label>

    <label>
      <input
        type="checkbox"
        id="optVibrate"
        checked>
      震動
    </label>

  </div>

  <div class="composer-row">

    <button
      type="button"
      class="icon-btn"
      id="btnPlus">
      ＋
    </button>

    <button
      type="button"
      class="text-btn"
      id="btnCam">
      相機
    </button>

    <input
      type="text"
      id="msgInput"
      placeholder="輸入訊息"
      autocomplete="off">

    <button
      type="button"
      class="text-btn"
      id="btnSticker">
      表情
    </button>

    <button
      type="button"
      class="text-btn"
      id="btnVoice">
      語音
    </button>

    <button
      type="button"
      class="send-btn"
      id="btnSend">
      送出
    </button>

  </div>

</div>

<!-- =========================
     PLUS SHEET
========================= -->

<div
  class="sheet-mask"
  id="plusMask">
</div>

<div
  class="sheet"
  id="plusSheet">

  <div
    class="sheet-item"
    id="pickAlbum">
    相簿（照片／影片）
  </div>

  <div
    class="sheet-item"
    id="pickFile">
    檔案
  </div>

  <div
    class="sheet-cancel"
    id="plusCancel">
    取消
  </div>

</div>

<input
  type="file"
  id="fileAlbum"
  accept="image/*,video/*,audio/*">

<input
  type="file"
  id="fileAny"
  accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.mp3,.mp4,.mov,.csv,image/*,video/*,audio/*">

<input
  type="file"
  id="fileCamera"
  accept="image/*,video/*"
  capture="environment">

<!-- =========================
     ACTION BOX
========================= -->

<div
  class="action-mask"
  id="actionMask">
</div>

<div
  class="action-box"
  id="actionBox">
</div>

<!-- =========================
     MEMBERS
========================= -->

<div
  class="sheet-mask"
  id="membersMask">
</div>

<div
  class="sheet"
  id="membersSheet">

  <div
    style="
      text-align:center;
      font-weight:700;
      padding:12px 0 8px;
      font-size:16px;
    ">
    群組成員管理
  </div>

  <div
    id="membersList"
    style="padding:0 12px;">
  </div>

  <div
    style="
      font-size:13px;
      color:#888;
      padding:12px 16px 6px;
    ">
    邀請好友加入
  </div>

  <div
    id="inviteList"
    style="padding:0 12px 16px;">
  </div>

  <div
    class="sheet-cancel"
    id="membersClose">
    關閉
  </div>

</div>

<script>

(function () {

  /* =====================================================
     SUPABASE
  ===================================================== */

  var SUPABASE_URL =
    'https://perfsipperncvjocznhl.supabase.co';

  var SUPABASE_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';


  var supabase = null;

  var myUser = null;

  var messages = [];

  var sosEvents = [];

  var profileCache = {};

  var selectedId = null;

  var recognizing = false;

  var recognition = null;

  var isOwner = false;

  var groupMembers = [];

  var RECALL_MS =
    2 * 60 * 1000;


  var stickers = [
    '😀','😅','😂','😊','😍','🤔',
    '👍','👏','🙏','💪','❤️','🔥',
    '✅','❌','🎉','🏠','🚗','📍'
  ];


  /* =====================================================
     URL
  ===================================================== */

  var params =
    new URLSearchParams(location.search);

  var roomName =
    params.get('name') || '對話';

  var roomId =
    params.get('id') || roomName;

  var isGroup =
    String(roomId).indexOf('dm_') !== 0;


  document.getElementById('roomName').textContent =
    roomName;


  /* =====================================================
     STATUS
  ===================================================== */

  var statusEl =
    document.getElementById('roomStatus');


  function setStatus(text) {

    if (statusEl) {
      statusEl.textContent = text;
    }

  }


  setStatus('腳本開始執行');


  /* =====================================================
     ESCAPE
  ===================================================== */

  function escapeHtml(value) {

    return String(value == null ? '' : value)

      .replace(/&/g, '&amp;')

      .replace(/</g, '&lt;')

      .replace(/>/g, '&gt;')

      .replace(/"/g, '&quot;')

      .replace(/'/g, '&#039;');

  }


  /* =====================================================
     TIME
  ===================================================== */

  function nowTime() {

    var n = new Date();

    return n.getHours() +
      ':' +
      String(n.getMinutes()).padStart(2, '0');

  }


  function timeFromIso(iso) {

    if (!iso) return '';

    var d = new Date(iso);

    return d.getHours() +
      ':' +
      String(d.getMinutes()).padStart(2, '0');

  }


  /* =====================================================
     PROFILE
  ===================================================== */

  function getProfileName(profile, fallback) {

    if (!profile) {
      return fallback || '成員';
    }

    return profile.nickname ||
      profile.username ||
      fallback ||
      '成員';

  }


  function initials(name) {

    name = String(name || '成員').trim();

    if (!name) return '👤';

    return name.slice(0, 1).toUpperCase();

  }


  function avatarHtml(profile, name, small) {

    var sizeClass =
      small ? 'sos-sender-avatar' : 'avatar';

    var safeName =
      escapeHtml(name || '成員');

    if (
      profile &&
      profile.avatar_url &&
      String(profile.avatar_url).trim()
    ) {

      return (
        '<div class="' +
        sizeClass +
        '">' +

        '<img src="' +
        escapeHtml(profile.avatar_url) +
        '" ' +

        'alt="' +
        safeName +
        '" ' +

        'onerror="this.style.display=\'none\';' +
        'this.parentElement.textContent=\'' +
        escapeHtml(initials(name)) +
        '\';">' +

        '</div>'
      );

    }

    return (
      '<div class="' +
      sizeClass +
      '">' +
      escapeHtml(initials(name)) +
      '</div>'
    );

  }


  /* =====================================================
     LOAD PROFILES
  ===================================================== */

  async function loadProfiles(userIds) {

    if (!supabase) return;

    var ids = [];

    (userIds || []).forEach(function (id) {

      if (!id) return;

      if (ids.indexOf(id) < 0) {

        ids.push(id);

      }

    });


    ids = ids.filter(function (id) {

      return !profileCache[id];

    });


    if (!ids.length) return;


    var res =
      await supabase
        .from('profiles')
        .select('id,username,nickname,avatar_url')
        .in('id', ids);


    if (res.error) {

      console.warn(
        'profiles 載入失敗：',
        res.error.message
      );

      return;

    }


    (res.data || []).forEach(function (p) {

      profileCache[p.id] = p;

    });

  }


  async function loadAllProfiles() {

    var ids = [];


    messages.forEach(function (m) {

      if (m.userId) {
        ids.push(m.userId);
      }

    });


    sosEvents.forEach(function (s) {

      if (s.user_id) {
        ids.push(s.user_id);
      }

    });


    await loadProfiles(ids);

  }


  /* =====================================================
     MESSAGE CONVERT
  ===================================================== */

  function rowToLocal(row) {

    var profile =
      profileCache[row.user_id] || null;


    var fallback =
      row.sender_name ||
      '成員';


    var name =
      getProfileName(
        profile,
        fallback
      );


    return {

      id: row.id,

      mine:
        myUser &&
        row.user_id === myUser.id,

      kind:
        row.kind || 'text',

      text:
        row.body || '',

      all:
        !!row.is_all,

      time:
        timeFromIso(row.created_at),

      createdAt:
        new Date(row.created_at).getTime(),

      recalled:
        !!row.recalled,

      hiddenLocal:
        false,

      senderName:
        name,

      userId:
        row.user_id,

      profile:
        profile

    };

  }


  /* =====================================================
     NOTIFICATION
  ===================================================== */

  function playNotify() {

    try {

      var sound =
        document.getElementById('optSound');

      var vibrate =
        document.getElementById('optVibrate');


      if (
        sound &&
        sound.checked
      ) {

        var ctx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        var o =
          ctx.createOscillator();

        var g =
          ctx.createGain();

        o.frequency.value = 880;

        g.gain.value = .06;

        o.connect(g);

        g.connect(ctx.destination);

        o.start();

        o.stop(
          ctx.currentTime + .12
        );

      }


      if (
        vibrate &&
        vibrate.checked &&
        navigator.vibrate
      ) {

        navigator.vibrate(120);

      }

    } catch (e) {}

  }


  /* =====================================================
     LOCAL SOS DELETE
     
     IMPORTANT:
     ONLY THIS DEVICE.
     DOES NOT DELETE DATABASE.
  ===================================================== */

  function sosStorageKey() {

    return 'safe_reunion_hidden_sos_' +
      String(roomId);

  }


  function getHiddenSosIds() {

    try {

      var raw =
        localStorage.getItem(
          sosStorageKey()
        );

      if (!raw) return {};

      var obj =
        JSON.parse(raw);

      return obj || {};

    } catch (e) {

      return {};

    }

  }


  function isSosHidden(id) {

    var hidden =
      getHiddenSosIds();

    return !!hidden[id];

  }


  function hideSosLocally(id) {

    var hidden =
      getHiddenSosIds();

    hidden[id] = true;

    try {

      localStorage.setItem(
        sosStorageKey(),
        JSON.stringify(hidden)
      );

    } catch (e) {}

  }


  /* =====================================================
     SOS DATA
  ===================================================== */

  function sosTime(sos) {

    return timeFromIso(
      sos.created_at
    );

  }


  function sosDisplayName(sos) {

    var profile =
      profileCache[sos.user_id];


    return getProfileName(
      profile,
      sos.display_name ||
      '求救者'
    );

  }


  function renderSos(sos) {

    if (isSosHidden(sos.id)) {

      return;

    }


    var profile =
      profileCache[sos.user_id] || null;


    var name =
      sosDisplayName(sos);


    var mine =
      myUser &&
      sos.user_id === myUser.id;


    var row =
      document.createElement('div');


    row.className =
      'sos-row ' +
      (mine ? 'me' : 'them');


    var avatar =
      avatarHtml(
        profile,
        name,
        true
      );


    var locationHtml = '';


    if (
      sos.lat !== null &&
      sos.lat !== undefined &&
      sos.lng !== null &&
      sos.lng !== undefined
    ) {

      locationHtml =
        '<div class="sos-location">' +

        '📍 已取得求救位置<br>' +

        '緯度：' +
        escapeHtml(
          Number(sos.lat).toFixed(6)
        ) +

        '<br>' +

        '經度：' +
        escapeHtml(
          Number(sos.lng).toFixed(6)
        ) +

        '</div>';

    }


    var message =
      sos.message ||
      '有人發出 SOS 緊急求救';


    var buttons =
      '';


    if (
      sos.lat !== null &&
      sos.lat !== undefined &&
      sos.lng !== null &&
      sos.lng !== undefined
    ) {

      buttons +=
        '<button ' +
        'type="button" ' +
        'class="sos-btn sos-map-btn" ' +
        'data-sos-map="' +
        escapeHtml(sos.id) +
        '">' +
        '📍 查看位置' +
        '</button>';

    }


    /*
      只有自己的 SOS
      可以從自己的手機畫面刪除。

      這裡絕對沒有呼叫
      supabase.from('sos_events').delete()
    */

    if (mine) {

      buttons +=
        '<button ' +
        'type="button" ' +
        'class="sos-btn sos-delete-btn" ' +
        'data-sos-delete="' +
        escapeHtml(sos.id) +
        '">' +
        '🗑️ 從我的手機刪除' +
        '</button>';

    }


    row.innerHTML =

      avatar +

      '<div class="sos-column">' +

        '<div class="sos-card">' +

          '<div class="sos-title">' +

            '<span class="sos-icon">🚨</span>' +

            '<span>緊急 SOS 求救</span>' +

          '</div>' +


          '<div class="sos-sender">' +

            '<div class="sos-sender-name">' +

              escapeHtml(name) +

            '</div>' +

          '</div>' +


          '<div class="sos-message">' +

            escapeHtml(message) +

          '</div>' +


          locationHtml +


          '<div class="sos-actions">' +

            buttons +

          '</div>' +


          '<div class="sos-time">' +

            sosTime(sos) +

          '</div>' +

        '</div>' +

      '</div>';


    var deleteBtn =
      row.querySelector(
        '[data-sos-delete]'
      );


    if (deleteBtn) {

      deleteBtn.onclick =
        function () {

          deleteSosLocal(
            sos.id
          );

        };

    }


    var mapBtn =
      row.querySelector(
        '[data-sos-map]'
      );


    if (mapBtn) {

      mapBtn.onclick =
        function () {

          openSosMap(
            sos
          );

        };

    }


    return row;

  }


  /* =====================================================
     DELETE SOS ONLY FROM THIS DEVICE
  ===================================================== */

  function deleteSosLocal(id) {

    var sos =
      sosEvents.find(function (x) {

        return String(x.id) ===
          String(id);

      });


    if (!sos) return;


    if (
      !myUser ||
      sos.user_id !== myUser.id
    ) {

      alert(
        '只能刪除你自己發出的 SOS。'
      );

      return;

    }


    var ok =
      confirm(
        '確定從你的手機畫面刪除這則 SOS？\n\n' +
        '注意：資料庫中的 SOS 紀錄不會刪除，其他群組成員仍然可以看到。'
      );


    if (!ok) return;


    hideSosLocally(id);

    renderAll();

  }


  /* =====================================================
     OPEN SOS MAP
  ===================================================== */

  function openSosMap(sos) {

    if (
      sos.lat === null ||
      sos.lat === undefined ||
      sos.lng === null ||
      sos.lng === undefined
    ) {

      alert('這筆 SOS 沒有位置資料。');

      return;

    }


    location.href =
      'map.html' +

      '?id=' +
      encodeURIComponent(roomId) +

      '&name=' +
      encodeURIComponent(roomName) +

      '&lat=' +
      encodeURIComponent(sos.lat) +

      '&lng=' +
      encodeURIComponent(sos.lng) +

      '&sos=' +
      encodeURIComponent(sos.id);

  }


  /* =====================================================
     LOAD SOS
  ===================================================== */

  async function loadSosEvents() {

    if (!supabase) return;


    var res =
      await supabase

        .from('sos_events')

        .select(
          'id,room_id,user_id,display_name,lat,lng,message,created_at'
        )

        .eq(
          'room_id',
          roomId
        )

        .order(
          'created_at',
          {
            ascending: true
          }
        )

        .limit(100);


    if (res.error) {

      console.warn(
        'SOS 載入失敗：',
        res.error.message
      );

      return;

    }


    sosEvents =
      res.data || [];


    await loadAllProfiles();

    renderAll();

  }


  /* =====================================================
     RENDER NORMAL MESSAGES
  ===================================================== */

  function renderMessage(m) {

    if (m.hiddenLocal) {
      return null;
    }


    var profile =
      profileCache[m.userId] ||
      m.profile ||
      null;


    var name =
      getProfileName(
        profile,
        m.senderName
      );


    var row =
      document.createElement('div');


    row.className =
      'message-row ' +
      (m.mine ? 'me' : 'them');


    var avatar =
      avatarHtml(
        profile,
        name,
        false
      );


    var html =
      '';


    if (m.recalled) {

      html =
        '<div class="msg recalled">' +

          (
            m.mine
              ? '你已回收一則訊息'
              : '對方已回收一則訊息'
          ) +

          '<div class="msg-time">' +
            escapeHtml(m.time) +
          '</div>' +

        '</div>';

    } else {

      if (!m.mine && isGroup) {

        html +=
          '<div class="sender-name">' +
            escapeHtml(name) +
          '</div>';

      }


      if (m.all) {

        html +=
          '<div class="msg-tag">' +
            '@all 全體' +
          '</div>';

      }


      if (m.kind === 'image') {

        html +=
          '<div class="msg">' +

            '<img src="' +
            escapeHtml(m.text) +
            '" alt="圖片">' +

            '<div class="msg-time">' +
              escapeHtml(m.time) +
            '</div>' +

          '</div>';

      }

      else if (m.kind === 'video') {

        html +=
          '<div class="msg">' +

            '<video src="' +
            escapeHtml(m.text) +
            '" controls playsinline></video>' +

            '<div class="msg-time">' +
              escapeHtml(m.time) +
            '</div>' +

          '</div>';

      }

      else if (m.kind === 'audio') {

        html +=
          '<div class="msg">' +

            '<audio src="' +
            escapeHtml(m.text) +
            '" controls></audio>' +

            '<div class="msg-time">' +
              escapeHtml(m.time) +
            '</div>' +

          '</div>';

      }

      else if (m.kind === 'sticker') {

        html +=
          '<div class="msg">' +

            '<span style="font-size:36px">' +
              escapeHtml(m.text) +
            '</span>' +

            '<div class="msg-time">' +
              escapeHtml(m.time) +
            '</div>' +

          '</div>';

      }

      else if (
        m.kind === 'file' ||
        m.kind === 'media' ||
        m.kind === 'camera'
      ) {

        if (
          /^https?:\/\//.test(
            String(m.text)
          )
        ) {

          html +=
            '<div class="msg">' +

              '<a href="' +
              escapeHtml(m.text) +
              '" target="_blank" rel="noopener">' +

              '開啟檔案' +

              '</a>' +

              '<div class="msg-time">' +
                escapeHtml(m.time) +
              '</div>' +

            '</div>';

        } else {

          html +=
            '<div class="msg">' +

              '［檔案］' +
              escapeHtml(m.text) +

              '<div class="msg-time">' +
                escapeHtml(m.time) +
              '</div>' +

            '</div>';

        }

      }

      else {

        html +=
          '<div class="msg">' +

            escapeHtml(m.text) +

            '<div class="msg-time">' +
              escapeHtml(m.time) +
            '</div>' +

          '</div>';

      }

    }


    var column =
      document.createElement('div');


    column.className =
      'message-column';


    column.innerHTML =
      html;


    if (m.mine) {

      row.appendChild(column);

      row.insertAdjacentHTML(
        'beforeend',
        avatar
      );

    } else {

      row.insertAdjacentHTML(
        'beforeend',
        avatar
      );

      row.appendChild(column);

    }


    /*
      長按普通聊天訊息。
      仍保留你原本的回收／刪除功能。
    */

    if (
      !m.recalled &&
      !m.hiddenLocal
    ) {

      var timer = null;


      row.addEventListener(
        'touchstart',
        function () {

          timer =
            setTimeout(
              function () {

                openAction(
                  m.id
                );

              },
              450
            );

        },
        {
          passive: true
        }
      );


      row.addEventListener(
        'touchend',
        function () {

          clearTimeout(timer);

        }
      );


      row.addEventListener(
        'touchmove',
        function () {

          clearTimeout(timer);

        }
      );


      row.addEventListener(
        'contextmenu',
        function (e) {

          e.preventDefault();

          openAction(
            m.id
          );

        }
      );

    }


    return row;

  }


  /* =====================================================
     RENDER ALL
     
     SOS is rendered separately from messages.
  ===================================================== */

  function renderAll() {

    var box =
      document.getElementById(
        'messages'
      );


    box.innerHTML = '';


    var combined = [];


    messages.forEach(function (m) {

      combined.push({

        type: 'message',

        time:
          m.createdAt,

        data: m

      });

    });


    sosEvents.forEach(function (s) {

      if (
        isSosHidden(s.id)
      ) {

        return;

      }


      combined.push({

        type: 'sos',

        time:
          new Date(
            s.created_at
          ).getTime(),

        data: s

      });

    });


    combined.sort(
      function (a, b) {

        return a.time - b.time;

      }
    );


    if (!combined.length) {

      box.innerHTML =
        '<div class="empty-chat">' +
          '尚無訊息' +
        '</div>';

      return;

    }


    combined.forEach(function (item) {

      if (item.type === 'message') {

        var node =
          renderMessage(
            item.data
          );

        if (node) {
          box.appendChild(node);
        }

      }

      else if (item.type === 'sos') {

        var sosNode =
          renderSos(
            item.data
          );

        if (sosNode) {

          box.appendChild(
            sosNode
          );

        }

      }

    });


    setTimeout(
      function () {

        box.scrollTop =
          box.scrollHeight;

      },
      20
    );

  }

  ) {

        ),

      hiddenLocal: false,

          profileCache[
            myUser &&
            myUser.id
          ],
          '我'
        ),

      userId:
        myUser &&
        myUser.id,

      profile:
        profileCache[
          myUser &&
          myUser.id
        ] || null

    });


    renderAll();

  }


  /* =====================================================
     SEND NORMAL MESSAGE
  ===================================================== */

  async function sendMsg() {

    var input =
      document.getElementById(
        'msgInput'
      );


    var text =
      input.value.trim();


    if (!text) return;


    var all = false;


    if (
      /^@all\b/i.test(text) ||
      text.indexOf('@全體') === 0
    ) {

      all = true;

      text =
        text
          .replace(/^@all\b/i, '')
          .replace(/^@全體/, '')
          .trim();

      if (!text) {

        text =
          '（全體通知）';

      }

    }


    input.value = '';


    if (
      !myUser ||
      !supabase
    ) {

      pushLocal(
        'text',
        text,
        all
      );

      setStatus(
        '本機模式'
      );

      return;

    }


    setStatus(
      '送出中…'
    );


    var profile =
      profileCache[
        myUser.id
      ];


    var senderName =
      getProfileName(
        profile,
        myUser.email
          ? myUser.email.split('@')[0]
          : '成員'
      );


    var res =
      await supabase
        .from('messages')
        .insert({

          room_id:
            roomId,

          user_id:
            myUser.id,

          sender_name:
            senderName,

          kind:
            'text',

          body:
            text,

          is_all:
            all

        });


    if (res.error) {

      setStatus(
        '送出失敗：' +
        res.error.message
      );

      pushLocal(
        'text',
        text,
        all
      );

      return;

    }


    setStatus(
      '即時通訊已開啟'
    );

  }

  /* =====================================================
     FILE
  ===================================================== */

  function guessKind(file) {

    var t =
      (file.type || '')
        .toLowerCase();


    if (
      t.indexOf('image/') === 0
    ) {

      return 'image';

    }


    if (
      t.indexOf('video/') === 0
    ) {

      return 'video';

    }


    if (
      t.indexOf('audio/') === 0
    ) {

      return 'audio';

    }


    return 'file';

  }


  async function uploadAndSend(file) {

    if (!file) return;


    if (
      !myUser ||
      !supabase
    ) {

      setStatus(
        '請先登入才能傳檔'
      );

      return;

    }


    setStatus(
      '上傳中…'
    );


    var kind =
      guessKind(file);


    var ext =
      (
        file.name
          .split('.')
          .pop() ||
        'bin'
      ).toLowerCase();


    var path =
      myUser.id +
      '/' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 10000
      ) +
      '.' +
      ext;


    var up =
      await supabase
        .storage
        .from('chat-media')
        .upload(
          path,
          file,
          {
            cacheControl: '3600',
            upsert: false,
            contentType:
              file.type ||
              undefined
          }
        );


    if (up.error) {

      setStatus(
        '上傳失敗：' +
        up.error.message
      );

      return;

    }


    var pub =
      supabase
        .storage
        .from('chat-media')
        .getPublicUrl(
          path
        );


    var url =
      pub.data &&
      pub.data.publicUrl;


    if (!url) {

      setStatus(
        '無法取得檔案網址'
      );

      return;

    }


    var profile =
      profileCache[
        myUser.id
      ];


    var senderName =
      getProfileName(
        profile,
        myUser.email
          ? myUser.email.split('@')[0]
          : '成員'
      );


    var ins =
      await supabase
        .from('messages')
        .insert({

          room_id:
            roomId,

          user_id:
            myUser.id,

          sender_name:
            senderName,

          kind:
            kind,

          body:
            url,

          is_all:
            false

        });


    if (ins.error) {

      setStatus(
        '訊息失敗：' +
        ins.error.message
      );

      return;

    }


    setStatus(
      '即時通訊已開啟'
    );

  }


  /* =====================================================
     REALTIME
  ===================================================== */

  async function initRealtime() {

    try {

      setStatus(
        '檢查套件…'
      );


      if (
        !window.supabase ||
        !window.supabase.createClient
      ) {

        setStatus(
          'Supabase 套件未載入'
        );

        return;

      }


      supabase =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      setStatus(
        '檢查登入…'
      );


      var sessRes =
        await supabase
          .auth
          .getSession();


      var session =
        sessRes.data &&
        sessRes.data.session;


      if (!session) {

        setStatus(
          '未登入'
        );

        location.href =
          'login.html';

        return;

      }


      myUser =
        session.user;


      /*
        先載入自己的 profile。
      */

      await loadProfiles([
        myUser.id
      ]);


      setStatus(
        '載入訊息…'
      );


      /* =========================
         NORMAL MESSAGES
      ========================= */

      var q =
        await supabase
          .from('messages')
          .select('*')
          .eq(
            'room_id',
            roomId
          )
          .order(
            'created_at',
            {
              ascending: true
            }
          )
          .limit(100);


      if (q.error) {

        setStatus(
          '聊天載入失敗：' +
          q.error.message
        );

      } else {

        messages =
          q.data || [];

        await loadAllProfiles();

      }


      /* =========================
         SOS
      ========================= */

      await loadSosEvents();


      renderAll();


      setStatus(
        '已連線'
      );


      /* =========================
         GROUP MEMBER BUTTON
      ========================= */

      if (isGroup) {

        await checkOwnerAndShowMembersBtn();

      }


      /* =================================================
         REALTIME CHANNEL
         
         messages + sos_events
      ================================================= */

      var channel =
        supabase.channel(
          'room-realtime:' +
          roomId +
          ':' +
          myUser.id
        );


      /* =========================
         MESSAGES REALTIME
      ========================= */

      channel.on(

        'postgres_changes',

        {

          event: '*',

          schema: 'public',

          table: 'messages',

          filter:
            'room_id=eq.' +
            roomId

        },

        async function (payload) {

          if (
            payload.eventType ===
            'INSERT'
          ) {

            await loadProfiles([
              payload.new.user_id
            ]);


            var m =
              rowToLocal(
                payload.new
              );


            if (
              !messages.find(
                function (x) {

                  return String(x.id) ===
                    String(m.id);

                }
              )
            ) {

              messages.push(m);

              renderAll();


              if (!m.mine) {

                playNotify();

              }

            }

          }


          if (
            payload.eventType ===
            'UPDATE'
          ) {

            await loadProfiles([
              payload.new.user_id
            ]);


            var m2 =
              rowToLocal(
                payload.new
              );


            var i =
              messages.findIndex(
                function (x) {

                  return String(x.id) ===
                    String(m2.id);

                }
              );


            if (i >= 0) {

              messages[i] =
                m2;

            } else {

              messages.push(m2);

            }


            renderAll();

          }


          if (
            payload.eventType ===
            'DELETE'
          ) {

            var delId =
              payload.old &&
              payload.old.id;


            if (delId) {

              messages =
                messages.filter(
                  function (x) {

                    return String(x.id) !==
                      String(delId);

                  }
                );


              renderAll();

            }

          }

        }

      );


      /* =========================
         SOS REALTIME
      ========================= */

      channel.on(

        'postgres_changes',

        {

          event: 'INSERT',

          schema: 'public',

          table: 'sos_events',

          filter:
            'room_id=eq.' +
            roomId

        },

        async function (payload) {

          var sos =
            payload.new;


          if (!sos) return;


          /*
            載入 SOS 發送者的頭像與暱稱。
          */

          await loadProfiles([
            sos.user_id
          ]);


          /*
            防止同一 SOS 重複。
          */

          var exists =
            sosEvents.some(
              function (x) {

                return String(x.id) ===
                  String(sos.id);

              }
            );


          if (!exists) {

            sosEvents.push(
              sos
            );

          }


          /*
            即使這台手機之前
            隱藏過這筆 SOS，
            Realtime 不會刪資料庫。
          */

          renderAll();


          /*
            只有別人的 SOS
            播放通知。
          */

          if (
            !myUser ||
            sos.user_id !==
            myUser.id
          ) {

            playNotify();

          }


          setStatus(
            '🚨 收到新的 SOS 求救'
          );

        }

      );


      channel.subscribe(
        function (status) {

          if (
            status ===
            'SUBSCRIBED'
          ) {

            setStatus(
              '即時通訊已開啟'
            );

          }

        }
      );


    } catch (e) {

      console.error(e);

      setStatus(
        '錯誤：' +
        (
          e &&
          e.message
            ? e.message
            : e
        )
      );

    }

  }


  /* =====================================================
     GROUP OWNER
  ===================================================== */

        .eq(

          'user_id',
          myUser.id

        .maybeSingle();

      m.data &&
      m.data.role ===
      'owner'

      isOwner = true;

  async function loadMembersAndFriends() {

    if (
      !supabase ||
      !myUser
    ) return;


    var memBox =
      document.getElementById(
        'membersList'
      );


    var invBox =
      document.getElementById(
        'inviteList'
      );


    memBox.innerHTML =
      '載入中…';


    invBox.innerHTML =
      '';


    var mems =
      await supabase
        .from('group_members')
        .select(
          'user_id, role'
        )
        .eq(
          'group_id',
          roomId
        );


    var memberIds =
      (mems.data || [])
        .map(
          function (m) {

            return m.user_id;

          }
        );


    groupMembers =
      memberIds;


    await loadProfiles(
      memberIds
    );


    memBox.innerHTML =
      '';


    (mems.data || [])
      .forEach(
        function (m) {

          var p =
            profileCache[
              m.user_id
            ] || {};


          var name =
            getProfileName(
              p,
              m.user_id.slice(0, 8)
            );


          var div =
            document.createElement(
              'div'
            );


          div.style.cssText =
            'display:flex;' +
            'align-items:center;' +
            'justify-content:space-between;' +
            'padding:10px 0;' +
            'border-bottom:1px solid #f0f0f0;';


          div.innerHTML =
            '<div style="display:flex;align-items:center;gap:8px;">' +

              avatarHtml(
                p,
                name,
                false
              ) +

              '<div>' +
                escapeHtml(name) +
                (
                  m.role === 'owner'
                    ? '（群主）'
                    : ''
                ) +
              '</div>' +

            '</div>';


          if (
            isOwner &&
            m.user_id !==
            myUser.id
          ) {

            var btn =
              document.createElement(
                'button'
              );


            btn.textContent =
              '移除';


            btn.style.cssText =
              'border:none;' +
              'background:#e53935;' +
              'color:#fff;' +
              'border-radius:8px;' +
              'padding:6px 12px;' +
              'font-size:13px;';


            btn.onclick =
              function () {

                removeMember(
                  m.user_id,
                  name
                );

              };


            div.appendChild(
              btn
            );

          }


          memBox.appendChild(
            div
          );

        }
      );


    var fr =
      await supabase
        .from('friendships')
        .select('*')
        .eq(
          'status',
          'accepted'
        )
        .or(
          'user_id.eq.' +
          myUser.id +
          ',friend_id.eq.' +
          myUser.id
        );


    var friendIds = [];


    (fr.data || [])
      .forEach(
        function (r) {

          var oid =
            r.user_id ===
            myUser.id
              ? r.friend_id
              : r.user_id;


          if (
            friendIds.indexOf(oid) <
            0 &&
            memberIds.indexOf(oid) <
            0
          ) {

            friendIds.push(
              oid
            );

          }

        }
      );


    if (!friendIds.length) {

      invBox.innerHTML =
        '<div style="color:#888;padding:8px 0">' +
        '沒有可邀請的好友' +
        '</div>';

      return;

    }


    await loadProfiles(
      friendIds
    );


    friendIds.forEach(
      function (uid) {

        var p =
          profileCache[
            uid
          ] || {};


        var name =
          getProfileName(
            p,
            '好友'
          );


        var div =
          document.createElement(
            'div'
          );


        div.style.cssText =
          'display:flex;' +
          'align-items:center;' +
          'justify-content:space-between;' +
          'padding:10px 0;' +
          'border-bottom:1px solid #f0f0f0;';


        div.innerHTML =
          '<div style="display:flex;align-items:center;gap:8px;">' +

            avatarHtml(
              p,
              name,
              false
            ) +

            '<div>' +
              escapeHtml(name) +
            '</div>' +

          '</div>';


        var btn =
          document.createElement(
            'button'
          );


        btn.textContent =
          '邀請';


        btn.style.cssText =
          'border:none;' +
          'background:#06C755;' +
          'color:#fff;' +
          'border-radius:8px;' +
          'padding:6px 12px;' +
          'font-size:13px;';


        btn.onclick =
          function () {

            inviteMember(
              uid,
              name
            );

          };


        div.appendChild(
          btn
        );


        invBox.appendChild(
          div
        );

      }
    );

  }


  async function inviteMember(
    uid,
    name
  ) {

    if (
      !confirm(
        '確定邀請「' +
        name +
        '」加入這個群組？'
      )
    ) return;


    var res =
      await supabase
        .from('group_members')
        .insert({

          group_id:
            roomId,

          user_id:
            uid,

          role:
            'member'

        });


    if (res.error) {

      alert(
        '邀請失敗：' +
        res.error.message
      );

      return;

    }


    alert(
      '已邀請 ' +
      name
    );


    loadMembersAndFriends();

  }


  async function removeMember(
    uid,
    name
  ) {

    if (
      !confirm(
        '確定把「' +
        name +
        '」移出群組？'
      )
    ) return;


    var res =
      await supabase
        .from('group_members')
        .delete()
        .eq(
          'group_id',
          roomId
        )
        .eq(
          'user_id',
          uid
        );


    if (res.error) {

      alert(
        '移除失敗：' +
        res.error.message
      );

      return;

    }


    alert(
      '已移除 ' +
      name
    );


    loadMembersAndFriends();

  }


  /* =====================================================
     NORMAL MESSAGE ACTION
     
     This is only for normal chat messages.
     SOS has its own delete function.
  ===================================================== */

  function openAction(id) {

    selectedId =
      id;


    var m =
      messages.find(
        function (x) {

          return String(x.id) ===
            String(id);

        }
      );


    if (
      !m ||
      m.recalled ||
      m.hiddenLocal
    ) return;


    var box =
      document.getElementById(
        'actionBox'
      );


    var html =
      '';


    var canRecall =
      m.mine &&
      !m.recalled &&
      (
        Date.now() -
        m.createdAt <=
        RECALL_MS
      ) &&
      String(m.id)
        .indexOf('local_') !== 0;


    if (canRecall) {

      html +=
        '<div class="action-item" id="actRecall">' +
          '回收（2分鐘內）' +
        '</div>';

    }


    html +=
      '<div class="action-item danger" id="actDel">' +
        '刪除' +
      '</div>';


    html +=
      '<div class="action-item" id="actCancel">' +
        '取消' +
      '</div>';


    box.innerHTML =
      html;


    document
      .getElementById(
        'actionMask'
      )
      .classList.add('show');


    box.classList.add(
      'show'
    );


    var r =
      document.getElementById(
        'actRecall'
      );


    if (r) {

      r.onclick =
        doRecall;

    }


    document
      .getElementById(
        'actDel'
      )
      .onclick =
      doDeleteLocal;


    document
      .getElementById(
        'actCancel'
      )
      .onclick =
      closeAction;

  }


  function closeAction() {

    selectedId =
      null;


    document
      .getElementById(
        'actionMask'
      )
      .classList.remove('show');


    document
      .getElementById(
        'actionBox'
      )
      .classList.remove('show');

  }


  async function doRecall() {

    var m =
      messages.find(
        function (x) {

          return String(x.id) ===
            String(selectedId);

        }
      );


    closeAction();


    if (
      !m ||
      !supabase ||
      !myUser
    ) return;


    var res =
      await supabase
        .from('messages')
        .update({
          recalled: true
        })
        .eq(
          'id',
          m.id
        )
        .eq(
          'user_id',
          myUser.id
        );


    if (res.error) {

      setStatus(
        '回收失敗：' +
        res.error.message
      );

    }

  }


  async function doDeleteLocal() {

    var m =
      messages.find(
        function (x) {

          return String(x.id) ===
            String(selectedId);

        }
      );


    closeAction();


    if (!m) return;


    /*
      一般聊天訊息：
      保留你原本的刪除功能。
    */

    if (
      String(m.id)
        .indexOf('local_') === 0
    ) {

      m.hiddenLocal =
        true;

      renderAll();

      return;

    }


    if (
      !m.mine ||
      !supabase ||
      !myUser
    ) {

      m.hiddenLocal =
        true;

      renderAll();

      return;

    }


    setStatus(
      '刪除中…'
    );


    var res =
      await supabase
        .from('messages')
        .delete()
        .eq(
          'id',
          m.id
        )
        .eq(
          'user_id',
          myUser.id
        );


    if (res.error) {

      setStatus(
        '刪除失敗：' +
        res.error.message
      );

      return;

    }


    messages =
      messages.filter(
        function (x) {

          return String(x.id) !==
            String(m.id);

        }
      );


    renderAll();


    setStatus(
      '即時通訊已開啟'
    );

  }

  /* =====================================================
     SPEECH TO TEXT
  ===================================================== */

  document
    .getElementById(
      'btnVoice'
    )
    .onclick =
    function () {

      var SR =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SR) {

        setStatus(
          '不支援語音轉文字'
        );

        return;

      }


      if (
        recognizing &&
        recognition
      ) {

        recognition.stop();

        recognizing =
          false;

        document
          .getElementById(
            'btnVoice'
          )
          .textContent =
          '語音';

        return;

      }


      recognition =
        new SR();


      recognition.lang =
        'zh-TW';


      recognition.onresult =
        function (e) {

          var t =
            e.results[0][0]
              .transcript;


          var input =
            document.getElementById(
              'msgInput'
            );


          input.value =
            (
              input.value
                ? input.value + ' '
                : ''
            ) +
            t;

        };


      recognition.onend =
      recognition.onerror =
        function () {

          recognizing =
            false;

          document
            .getElementById(
              'btnVoice'
            )
            .textContent =
            '語音';

        };


      recognizing =
        true;


      document
        .getElementById(
          'btnVoice'
        )
        .textContent =
        '聆聽中';


      recognition.start();

    };


  /* =====================================================
     CALL
  ===================================================== */

  function peerIdFromRoom() {

    if (
      !myUser ||
      !roomId ||
      String(roomId)
        .indexOf('dm_') !== 0
    ) {

      return '';

    }


    var rest =
      String(roomId).slice(3);


    var mid =
      rest.indexOf(
        myUser.id
      );


    if (mid < 0) {

      return '';

    }


    if (
      rest.indexOf(
        myUser.id
      ) === 0
    ) {

      return rest.slice(
        myUser.id.length + 1
      );

    }


    return rest.slice(
      0,
      rest.length -
      myUser.id.length -
      1
    );

  }


  function goCall(mode) {

    var to =
      peerIdFromRoom();


    var url =
      'call.html?mode=' +
      encodeURIComponent(mode) +
      '&name=' +
      encodeURIComponent(roomName);


    if (to) {

      url +=
        '&to=' +
        encodeURIComponent(to);

    }


    location.href =
      url;

  }


  document
    .getElementById(
      'btnAudio'
    )
    .onclick =

      goCall(
        'audio'
      );

  /* =====================================================
     BOOT
  ===================================================== */

  setStatus(
    '等待套件…'
  );


  var tries =
    0;


  function boot() {

    tries += 1;


    if (
      window.supabase
    ) {

      initRealtime();

    }

    else if (
      tries < 30
    ) {

      setStatus(
        '等待套件…(' +
        tries +
        ')'
      );


      setTimeout(
        boot,
        200
      );

    }

    else {

      setStatus(
        '套件載入失敗'
      );

    }

  }


  boot();
