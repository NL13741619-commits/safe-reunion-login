<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>對話 - 安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e5ddd5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back {
      color: white;
      text-decoration: none;
      font-size: 22px;
    }
    .header-info { flex: 1; }
    .header-name { font-weight: 700; font-size: 16px; }
    .header-status { font-size: 12px; opacity: 0.9; }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.them {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.me {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }

    .input-bar {
      background: #f0f0f0;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      position: sticky;
      bottom: 0;
    }
    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
    }
    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #06C755;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <a class="back" href="chat.html">‹</a>
    <div class="header-info">
      <div class="header-name" id="roomName">家人群組</div>
      <div class="header-status">5 位成員</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg them">
      今天集合點在公園門口
      <div class="msg-time">10:20</div>
    </div>
    <div class="msg them">
      大家記得帶水
      <div class="msg-time">10:21</div>
    </div>
    <div class="msg me">
      收到，我大概 11 點到
      <div class="msg-time">10:25</div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="輸入訊息…" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>

  <script>
    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg me';
      const now = new Date();
      const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
      div.innerHTML = text + '<div class="msg-time">' + time + '</div>';
      messages.appendChild(div);
      input.value = '';
      messages.scrollTop = messages.scrollHeight;
    }

    // 從網址讀取聊天對象名稱（之後可接真實資料）
    const params = new URLSearchParams(location.search);
    const name = params.get('name');
    if (name) {
      document.getElementById('roomName').textContent = decodeURIComponent(name);
    }
  </script>
</body>
</html>
