<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>對話 - 安全團聚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e5ddd5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #06C755;
      color: white;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back {
      color: white;
      text-decoration: none;
      font-size: 24px;
      line-height: 1;
      padding: 4px;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-name {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-status { font-size: 12px; opacity: 0.9; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-actions button {
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }
    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.them {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.me {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }
    .input-bar {
      background: #f0f0f0;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      position: sticky;
      bottom: 0;
    }
    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
    }
    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #06C755;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
    }
    .overlay.show { display: block; }
    .side-menu {
      position: fixed;
      top: 0; right: 0;
      width: 85%;
      max-width: 320px;
      height: 100%;
      background: white;
      z-index: 201;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
    }
    .side-menu.show { transform: translateX(0); }
    .menu-header {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }
    .menu-title { font-size: 16px; font-weight: 700; }
    .menu-sub { font-size: 13px; color: #888; margin-top: 4px; }
    .menu-actions {
      display: flex;
      justify-content: space-around;
      padding: 16px 8px;
      border-bottom: 1px solid #eee;
    }
    .menu-action {
      text-align: center;
      font-size: 12px;
      color: #333;
      width: 64px;
    }
    .menu-action-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin: 0 auto 6px;
    }
    .menu-list { padding: 8px 0; }
    .menu-item {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
    }
    .menu-item:active { background: #f9f9f9; }

    #callSheet {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
    }
    #callSheet.show { display: flex; }
    .sheet-box {
      background: #fff;
      width: 100%;
      border-radius: 16px 16px 0 0;
      padding: 20px 16px 32px;
      text-align: center;
    }
    .sheet-title {
      font-size: 15px;
      color: #666;
      margin-bottom: 16px;
    }
    .sheet-options {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 20px;
    }
    .sheet-opt { cursor: pointer; }
    .sheet-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 8px;
    }
    .sheet-icon.audio { background: #e8f5e9; }
    .sheet-icon.video { background: #e3f2fd; }
    .sheet-label { font-size: 13px; color: #333; }
    .sheet-cancel {
      color: #06C755;
      font-size: 16px;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <a class="back" href="chat.html">‹</a>
    <div class="header-info">
      <div class="header-name" id="roomName">家人群組</div>
      <div class="header-status" id="roomStatus">5 位成員</div>
    </div>
    <div class="header-actions">
  <button onclick="alert('搜尋訊息（之後做）')">🔍</button>
  <button onclick="startCall()">📞</button>
  <button onclick="location.href='map.html?name=' + encodeURIComponent(document.getElementById('roomName').textContent)">🛰️</button>
  <button onclick="alert('行事曆（之後做）')">📅</button>
  <button onclick="openMenu()">☰</button>
</div>
  </div>

  <div class="messages" id="messages">
    <div class="msg them">
      今天集合點在公園門口
      <div class="msg-time">10:20</div>
    </div>
    <div class="msg them">
      大家記得帶水
      <div class="msg-time">10:21</div>
    </div>
    <div class="msg me">
      收到，我大概 11 點到
      <div class="msg-time">10:25</div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="輸入訊息…" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>

  <div class="overlay" id="overlay" onclick="closeMenu()"></div>
  <div class="side-menu" id="sideMenu">
    <div class="menu-header">
      <div class="menu-title" id="menuTitle">家人群組</div>
      <div class="menu-sub" id="menuSub">5 位成員</div>
    </div>
    <div class="menu-actions">
      <div class="menu-action" onclick="alert('關閉提醒（之後做）')">
        <div class="menu-action-icon">🔔</div>
        提醒
      </div>
      <div class="menu-action" onclick="alert('成員列表（之後做）')">
        <div class="menu-action-icon">👥</div>
        成員
      </div>
      <div class="menu-action" onclick="alert('邀請好友（之後做）')">
        <div class="menu-action-icon">➕</div>
        邀請
      </div>
      <div class="menu-action" onclick="alert('退出群組（之後做）')">
        <div class="menu-action-icon">🚪</div>
        退出
      </div>
    </div>
    <div class="menu-list">
      <div class="menu-item" onclick="alert('照片・影片（之後做）')">🖼️ 照片・影片</div>
      <div class="menu-item" onclick="alert('相簿（之後做）')">📁 相簿</div>
      <div class="menu-item" onclick="alert('記事本（之後做）')">📝 記事本</div>
      <div class="menu-item" onclick="alert('行事曆（之後做）')">📅 行事曆</div>
      <div class="menu-item" onclick="alert('活動（之後做）')">🎯 活動</div>
      <div class="menu-item" onclick="alert('連結（之後做）')">🔗 連結</div>
      <div class="menu-item" onclick="alert('檔案（之後做）')">📄 檔案</div>
      <div class="menu-item" onclick="alert('設定（之後做）')">⚙️ 設定</div>
    </div>
  </div>

  <div id="callSheet">
    <div class="sheet-box">
      <div class="sheet-title">選擇通話方式</div>
      <div class="sheet-options">
        <div class="sheet-opt" onclick="goCall('audio')">
          <div class="sheet-icon audio">📞</div>
          <div class="sheet-label">語音通話</div>
        </div>
        <div class="sheet-opt" onclick="goCall('video')">
          <div class="sheet-icon video">📹</div>
          <div class="sheet-label">視訊通話</div>
        </div>
      </div>
      <div class="sheet-cancel" onclick="closeCallSheet()">取消</div>
    </div>
  </div>

  <script>
    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg me';
      const now = new Date();
      const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
      div.innerHTML = text + '<div class="msg-time">' + time + '</div>';
      messages.appendChild(div);
      input.value = '';
      messages.scrollTop = messages.scrollHeight;
    }

    function openMenu() {
      document.getElementById('overlay').classList.add('show');
      document.getElementById('sideMenu').classList.add('show');
    }
    function closeMenu() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('sideMenu').classList.remove('show');
    }

    function startCall() {
      document.getElementById('callSheet').classList.add('show');
    }
    function closeCallSheet() {
      document.getElementById('callSheet').classList.remove('show');
    }
    function goCall(mode) {
      const name = document.getElementById('roomName').textContent || '通話';
      location.href = 'call.html?name=' + encodeURIComponent(name) + '&mode=' + mode;
    }

    const params = new URLSearchParams(location.search);
    const name = params.get('name');
    if (name) {
      const decoded = decodeURIComponent(name);
      document.getElementById('roomName').textContent = decoded;
      document.getElementById('menuTitle').textContent = decoded;
    }
  </script>
</body>
</html>
