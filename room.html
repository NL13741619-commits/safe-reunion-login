<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"

<title>對話 - 安全團聚</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

  background: #e8e8e8;

  min-height: 100vh;

  display: flex;
  flex-direction: column;

  color: #111;
}


/* =========================
   HEADER
========================= */

.header {

  background: #06C755;

  color: #fff;

  padding: 10px 12px;

  display: flex;

  align-items: center;

  gap: 8px;

  position: sticky;

  top: 0;

  z-index: 100;
}

.back {

  color: #fff;

  text-decoration: none;

  font-size: 24px;

  padding: 4px;
}

.header-info {

  flex: 1;

  min-width: 0;
}

.header-name {

  font-weight: 700;

  font-size: 16px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.header-status {

  font-size: 12px;

  opacity: 0.95;
}

.header-actions {

  display: flex;

  gap: 2px;
}

.header-actions button {

  background: transparent;

  border: none;

  color: #fff;

  font-size: 13px;

  padding: 6px 8px;
}


/* =========================
   MESSAGE AREA
========================= */

.messages {

  flex: 1;

  padding: 12px;

  overflow-y: auto;

  display: flex;

  flex-direction: column;

  gap: 8px;
}


/* =========================
   MESSAGE ROW
========================= */

.msg-row {

  display: flex;

  align-items: flex-end;

  gap: 7px;

  width: 100%;
}

.msg-row.me {

  justify-content: flex-end;
}

.msg-row.them {

  justify-content: flex-start;
}


/* =========================
   AVATAR
========================= */

.msg-avatar {

  width: 34px;

  height: 34px;

  min-width: 34px;

  border-radius: 50%;

  object-fit: cover;

  background: #ddd;

  border: 1px solid #ddd;
}

.msg-avatar-default {

  width: 34px;

  height: 34px;

  min-width: 34px;

  border-radius: 50%;

  background: #ccc;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 18px;
}


/* =========================
   MESSAGE
========================= */

.msg {

  max-width: 78%;

  padding: 10px 12px;

  border-radius: 14px;

  font-size: 15px;

  line-height: 1.4;

  word-break: break-word;
}

.msg.them {

  background: #fff;

  align-self: flex-start;

  border-bottom-left-radius: 4px;
}

.msg.me {

  background: #dcf8c6;

  align-self: flex-end;

  border-bottom-right-radius: 4px;
}

.msg.recalled {

  background: #f0f0f0;

  color: #888;

  font-size: 13px;

  font-style: italic;
}

.msg-time {

  font-size: 11px;

  color: #999;

  margin-top: 4px;

  text-align: right;
}

.msg-tag {

  font-size: 11px;

  color: #06C755;

  margin-bottom: 4px;

  font-weight: 600;
}

.msg img,
.msg video {

  max-width: 100%;

  border-radius: 10px;

  display: block;
}

.msg audio {

  width: 100%;
}


/* =========================
   SOS
========================= */

.sos-card {

  width: 100%;

  background: #d32f2f;

  color: #fff;

  border-radius: 14px;

  padding: 14px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.18);

  margin: 4px 0;

  align-self: stretch;

  border: 2px solid #b71c1c;
}

.sos-title {

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 6px;
}

.sos-name {

  font-size: 14px;

  font-weight: 700;

  margin-bottom: 5px;
}

.sos-message {

  font-size: 14px;

  line-height: 1.5;
}

.sos-location {

  font-size: 12px;

  margin-top: 7px;

  opacity: .95;
}

.sos-time {

  font-size: 11px;

  margin-top: 7px;

  opacity: .8;
}

.sos-status {

  display: inline-block;

  margin-top: 8px;

  background: #fff;

  color: #c62828;

  padding: 4px 8px;

  border-radius: 8px;

  font-size: 11px;

  font-weight: 700;
}

.sos-actions {

  display: flex;

  gap: 8px;

  margin-top: 12px;

  flex-wrap: wrap;
}

.sos-btn {

  border: 0;

  border-radius: 8px;

  padding: 8px 12px;

  font-size: 13px;

  font-weight: 700;

  cursor: pointer;
}

.sos-delete-btn {

  background: #fff;

  color: #c62828;
}

.sos-resolve-btn {

  background: #8bc34a;

  color: #fff;
}

.sos-map-btn {

  background: #fff;

  color: #333;
}


/* =========================
   COMPOSER
========================= */

.composer {

  background: #f7f7f7;

  border-top: 1px solid #ddd;

  padding: 8px 8px 12px;

  position: sticky;

  bottom: 0;

  z-index: 50;
}

.settings-bar {

  display: flex;

  gap: 12px;

  padding: 4px 8px 0;

  font-size: 12px;

  color: #666;
}

.composer-row {

  display: flex;

  align-items: center;

  gap: 6px;
}

.icon-btn,
.text-btn {

  border: none;

  background: transparent;

  color: #333;

  font-size: 13px;

  padding: 6px 4px;

  flex-shrink: 0;
}

.icon-btn {

  width: 36px;

  height: 36px;

  font-size: 20px;
}

#msgInput {

  flex: 1;

  min-width: 0;

  background: #fff;

  border-radius: 18px;

  padding: 10px 14px;

  font-size: 15px;

  border: 1px solid #e0e0e0;

  outline: none;
}

.send-btn {

  border: none;

  background: #06C755;

  color: #fff;

  font-size: 13px;

  font-weight: 600;

  padding: 8px 12px;

  border-radius: 16px;
}


/* =========================
   SHEET
========================= */

.sheet-mask,
.action-mask {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.35);

  z-index: 200;
}

.sheet-mask.show,
.action-mask.show {

  display: block;
}

.sheet {

  position: fixed;

  left: 0;

  right: 0;

  bottom: 0;

  background: #fff;

  border-radius: 14px 14px 0 0;

  z-index: 201;

  padding: 8px 0 24px;

  transform: translateY(100%);

  transition: transform 0.2s;
}

.sheet.show {

  transform: translateY(0);
}

.sheet-item {

  padding: 16px 20px;

  font-size: 16px;

  border-bottom: 1px solid #f0f0f0;
}

.sheet-cancel {

  text-align: center;

  color: #06C755;

  font-weight: 600;

  padding: 14px;
}


/* =========================
   ACTION BOX
========================= */

.action-box {

  display: none;

  position: fixed;

  left: 50%;

  top: 40%;

  transform: translate(-50%,-50%);

  background: #fff;

  border-radius: 12px;

  min-width: 200px;

  z-index: 301;

  overflow: hidden;
}

.action-box.show {

  display: block;
}

.action-item {

  padding: 14px 18px;

  font-size: 15px;

  border-bottom: 1px solid #f0f0f0;
}

.action-item.danger {

  color: #c62828;
}


/* =========================
   STICKERS
========================= */

.sticker-panel {

  display: none;

  background: #fff;

  border-top: 1px solid #ddd;

  padding: 10px;

  max-height: 160px;

  overflow-y: auto;
}

.sticker-panel.show {

  display: block;
}

.sticker-grid {

  display: grid;

  grid-template-columns:
    repeat(6, 1fr);

  gap: 8px;
}

.sticker-grid span {

  font-size: 28px;

  text-align: center;

  padding: 4px;
}

input[type="file"] {

  display: none;
}


/* =========================
   MEMBERS
========================= */

#membersList,
#inviteList {

  font-size: 14px;
}


/* 會議進行中橫幅（僅群組） */
.meeting-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #e8f5e9;
  border-bottom: 1px solid #c8e6c9;
  padding: 8px 12px;
  font-size: 13px;
  color: #1b5e20;
  position: sticky;
  top: 52px;
  z-index: 90;
}
.meeting-banner.show {
  display: flex;
}
.meeting-banner .mb-left {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  min-width: 0;
}
.meeting-banner .mb-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #06C755;
  box-shadow: 0 0 6px #06C755;
  flex-shrink: 0;
}
.meeting-banner .mb-btns {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.meeting-banner button {
  border: 0;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  background: #06C755;
  color: #fff;
}
.meeting-banner button.secondary {
  background: #1565c0;
}
.meeting-banner button.exit {
  background: #e53935;
}

</style>

</head>

<script>

(function () {


/* =====================================================
   基本設定
===================================================== */

var statusEl =
  document.getElementById(
    'roomStatus'
  );


function setStatus(text) {

  if (statusEl) {

    statusEl.textContent =
      text;

  }

}


setStatus(
  '腳本開始執行'
);


var SUPABASE_URL =
  'https://perfsipperncvjocznhl.supabase.co';


var SUPABASE_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcmZzaXBwZXJuY3Zqb2N6bmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTUyMzAsImV4cCI6MjEwMTU5MTIzMH0.I7vXkV247kAzRJ0RigDZt3Hzn8KJDyMc6o9E3oHJZoY';


var RECALL_MS =
  2 * 60 * 1000;


var stickers = [

  '😀','😅','😂','😊','😍','🤔',
  '👍','👏','🙏','💪','❤️','🔥',
  '✅','❌','🎉','🏠','🚗','📍'

];


var supabase = null;

var messages = [];

var selectedId = null;

var myUser = null;

var recognizing = false;

var recognition = null;

var isOwner = false;

var groupMembers = [];

var profileCache = {};

var realtimeChannel = null;

var sosChannel = null;


/* =====================================================
   URL
===================================================== */

var params =
  new URLSearchParams(
    location.search
  );


var roomName =
  params.get('name')
    ? decodeURIComponent(
        params.get('name')
      )
    : '對話';


var roomId =
  params.get('id') ||
  roomName;


var originalRoomId =
  roomId;


/*
   判斷是不是 DM。
*/

var isGroup =
  String(roomId)
    .indexOf('dm_') !== 0;


/* =====================================================
   DM ROOM ID 統一
===================================================== */

/*
   重要：

   以前可能出現：

   dm_A_B

   和

   dm_B_A

   這兩個其實是同一個人對人聊天室。

   現在統一排序：

   dm_較小ID_較大ID

   這樣 A、B 雙方永遠得到
   完全相同的 room_id。
*/

function normalizeDMRoomId() {

  if (
    !myUser ||
    !originalRoomId
  ) {

    return;

  }


  if (
    String(
      originalRoomId
    ).indexOf('dm_') !== 0
  ) {

    return;

  }


  var rest =
    String(
      originalRoomId
    ).slice(3);


  var ids =
    rest.split('_');


  /*
     UUID 本身不包含底線，
     所以正常 DM 應該正好兩個 ID。
  */

  if (
    ids.length !== 2
  ) {

    setStatus(
      'DM 房間 ID 格式錯誤'
    );

    return;

  }


  var a =
    ids[0];

  var b =
    ids[1];


  if (
    !a ||
    !b
  ) {

    setStatus(
      'DM 對話對象錯誤'
    );

    return;

  }


  var sorted =
    [a, b].sort();


  roomId =
    'dm_' +
    sorted[0] +
    '_' +
    sorted[1];


  isGroup =
    false;


  console.log(
    'DM 原始 room_id:',
    originalRoomId
  );


  console.log(
    'DM 統一 room_id:',
    roomId
  );

}


/* =====================================================
   取得 DM 對方 ID
===================================================== */

function peerIdFromRoom() {

  if (
    !myUser ||
    !roomId
  ) {

    return '';

  }


  if (
    String(roomId)
      .indexOf('dm_') !== 0
  ) {

    return '';

  }


  var rest =
    String(roomId)
      .slice(3);


  var ids =
    rest.split('_');


  if (
    ids.length !== 2
  ) {

    return '';

  }


  if (
    ids[0] === myUser.id
  ) {

    return ids[1];

  }


  if (
    ids[1] === myUser.id
  ) {

    return ids[0];

  }


  return '';

}


/* =====================================================
   DM 名稱
===================================================== */

async function loadDMName() {

  if (
    !supabase ||
    !myUser ||
    isGroup
  ) {

    return;

  }


  var peerId =
    peerIdFromRoom();


  if (!peerId) {

    document.getElementById(
      'roomName'
    ).textContent =
      '私人聊天';

    return;

  }


  try {

    var result =
      await supabase
        .from('profiles')
        .select('*')
        .eq('id', peerId)
        .maybeSingle();


    if (
      result.data
    ) {

      var p =
        result.data;


      var name =
        p.nickname ||
        p.username ||
        '好友';


      roomName =
        name;


      document.getElementById(
        'roomName'
      ).textContent =
        name;


      profileCache[
        peerId
      ] = p;


      return;

    }


    document.getElementById(
      'roomName'
    ).textContent =
      '私人聊天';


  } catch (e) {

    console.log(
      'DM 名稱讀取失敗:',
      e
    );


    document.getElementById(
      'roomName'
    ).textContent =
      '私人聊天';

  }

}


/* =====================================================
   GROUP NAME
===================================================== */

async function loadRoomName() {

  if (
    !supabase ||
    !roomId ||
    !isGroup
  ) {

    return;

  }


  try {

    var result =
      await supabase
        .from('chat_groups')
        .select('name')
        .eq('id', roomId)
        .maybeSingle();


    if (
      result.data &&
      result.data.name &&
      result.data.name.trim()
    ) {

      roomName =
        result.data.name.trim();


      document.getElementById(
        'roomName'
      ).textContent =
        roomName;


      return;

    }


    document.getElementById(
      'roomName'
    ).textContent =
      '對話';


  } catch (e) {

    console.log(
      '聊天室名稱讀取錯誤:',
      e
    );


    document.getElementById(
      'roomName'
    ).textContent =
      '對話';

  }

}


/* =====================================================
   SOS 本機刪除
===================================================== */

var deletedSOS = {};


function sosLocalKey(id) {

  return (
    'safe_reunion_deleted_sos_' +
    String(roomId) +
    '_' +
    String(id)
  );

}


function isSOSDeletedLocally(id) {

  try {

    return (
      localStorage.getItem(
        sosLocalKey(id)
      ) === '1'
    );

  } catch (e) {

    return false;

  }

}


function deleteSOSLocally(id) {

  if (!id) return;


  try {

    localStorage.setItem(
      sosLocalKey(id),
      '1'
    );


    deletedSOS[id] =
      true;

  } catch (e) {}


  var el =
    document.getElementById(
      'sos_' + id
    );


  if (el) {

    el.remove();

  }

}


/* =====================================================
   SOS ALERT STATUS
===================================================== */

async function getSOSAlertStatus(
  eventId
) {

  if (
    !supabase ||
    !eventId
  ) {

    return null;

  }


  try {

    var result =
      await supabase
        .from('sos_alerts')
        .select(
          'id,status,resolved_by,resolved_at'
        )
        .eq(
          'event_id',
          eventId
        )
        .order(
          'created_at',
          {
            ascending:false
          }
        )
        .limit(1)
        .maybeSingle();


    if (result.error) {

      return null;

    }


    return result.data ||
      null;


  } catch (e) {

    return null;

  }

}


/* =====================================================
   SOS RESOLVE
===================================================== */

async function resolveSOS(
  sos
) {

  if (
    !sos ||
    !supabase ||
    !myUser
  ) {

    return;

  }


  var ok =
    confirm(
      '確定要解除這個 SOS 救援通知嗎？\n\n' +
      '解除後代表目前已不需要持續求救。'
    );


  if (!ok) {

    return;

  }


  setStatus(
    '解除 SOS 中…'
  );


  try {

    var result =
      await supabase
        .from('sos_alerts')
        .update({

          status:
            'resolved',

          resolved_by:
            myUser.id,

          resolved_at:
            new Date().toISOString()

        })
        .eq(
          'event_id',
          sos.id
        );


    if (result.error) {

      setStatus(
        '解除 SOS 失敗：' +
        result.error.message
      );

      return;

    }


    updateSOSCardResolved(
      sos.id
    );


    setStatus(
      'SOS 已解除'
    );


  } catch (e) {

    setStatus(
      '解除 SOS 失敗'
    );

  }

}


function updateSOSCardResolved(
  id
) {

  var card =
    document.getElementById(
      'sos_' + id
    );


  if (!card) return;


  var status =
    card.querySelector(
      '.sos-status'
    );


  if (status) {

    status.textContent =
      '✓ SOS 已解除';

  }


  var btn =
    card.querySelector(
      '.sos-resolve-btn'
    );


  if (btn) {

    btn.disabled =
      true;

    btn.textContent =
      '已解除';

    btn.style.opacity =
      '0.6';

  }

}


/* =====================================================
   SOS RENDER
===================================================== */

async function renderSOS(
  sos,
  options
) {

  options =
    options || {};


  if (
    !sos ||
    !sos.id
  ) {

    return;

  }


  if (
    isSOSDeletedLocally(
      sos.id
    )
  ) {

    return;

  }


  var box =
    document.getElementById(
      'messages'
    );


  if (!box) return;


  var old =
    document.getElementById(
      'sos_' + sos.id
    );


  if (old) {

    old.remove();

  }


  var alertStatus =
    await getSOSAlertStatus(
      sos.id
    );


  var resolved =
    alertStatus &&
    alertStatus.status ===
      'resolved';


  var div =
    document.createElement(
      'div'
    );


  div.id =
    'sos_' + sos.id;


  div.className =
    'sos-card';


  var name =
    sos.display_name ||
    '群組成員';


  var message =
    sos.message ||
    '緊急求救';


  var lat =
    sos.lat !== undefined &&
    sos.lat !== null
      ? sos.lat
      : null;


  var lng =
    sos.lng !== undefined &&
    sos.lng !== null
      ? sos.lng
      : null;


  var time =
    sos.created_at
      ? nowTimeFrom(
          sos.created_at
        )
      : '';


  var locationHtml =
    '';


  if (
    lat !== null &&
    lng !== null
  ) {

    locationHtml =
      '<div class="sos-location">' +
      '📍 緯度：' +
      escapeHtml(
        String(lat)
      ) +
      '<br>' +
      '　　經度：' +
      escapeHtml(
        String(lng)
      ) +
      '</div>';

  }


  var statusHtml =
    resolved

      ? '<div class="sos-status">' +
        '✓ SOS 已解除' +
        '</div>'

      : '<div class="sos-status">' +
        '🚨 正在求救' +
        '</div>';


  var resolveButton =
    resolved

      ? '<button type="button" ' +
        'class="sos-btn sos-resolve-btn" ' +
        'disabled ' +
        'style="opacity:.6">' +
        '已解除' +
        '</button>'

      : '<button type="button" ' +
        'class="sos-btn sos-resolve-btn">' +
        '解除 SOS' +
        '</button>';


  var mapButton =
    '';


  if (
    lat !== null &&
    lng !== null
  ) {

    mapButton =
      '<button type="button" ' +
      'class="sos-btn sos-map-btn">' +
      '📍 查看位置' +
      '</button>';

  }


  div.innerHTML =

    '<div class="sos-title">' +
      '🚨 SOS 緊急求救' +
    '</div>' +

    '<div class="sos-name">' +
      escapeHtml(name) +
    '</div>' +

    '<div class="sos-message">' +
      escapeHtml(message) +
    '</div>' +

    locationHtml +

    '<div class="sos-time">' +
      time +
    '</div>' +

    statusHtml +

    '<div class="sos-actions">' +

      resolveButton +

      mapButton +

      '<button type="button" ' +
      'class="sos-btn sos-delete-btn">' +
      '🗑️ 刪除本機通知' +
      '</button>' +

    '</div>';


  var deleteBtn =
    div.querySelector(
      '.sos-delete-btn'
    );


  if (deleteBtn) {

    deleteBtn.onclick =
      function () {

        deleteSOSLocally(
          sos.id
        );

      };

  }


  var resolveBtn =
    div.querySelector(
      '.sos-resolve-btn'
    );


  if (
    resolveBtn &&
    !resolved
  ) {

    resolveBtn.onclick =
      function () {

        resolveSOS(
          sos
        );

      };

  }


  var mapBtn =
    div.querySelector(
      '.sos-map-btn'
    );


  if (mapBtn) {

    mapBtn.onclick =
      function () {

        var url =
          'https://www.google.com/maps/search/?api=1&query=' +
          encodeURIComponent(
            String(lat) +
            ',' +
            String(lng)
          );


        window.open(
          url,
          '_blank'
        );

      };

  }


  box.appendChild(
    div
  );


  if (
    options.scroll !== false
  ) {

    box.scrollTop =
      box.scrollHeight;

  }

}


/* =====================================================
   LOAD SOS
===================================================== */

async function loadSOS() {

  if (
    !supabase ||
    !myUser ||
    !isGroup
  ) {

    return;

  }


  try {

    var res =
      await supabase
        .from('sos_events')
        .select('*')
        .eq(
          'room_id',
          roomId
        )
        .order(
          'created_at',
          {
            ascending:true
          }
        )
        .limit(100);


    if (res.error) {

      console.log(
        'SOS 載入失敗:',
        res.error.message
      );

      return;

    }


    var rows =
      res.data || [];


    for (
      var i = 0;
      i < rows.length;
      i++
    ) {

      await renderSOS(
        rows[i],
        {
          scroll:false
        }
      );

    }


  } catch (e) {

    console.log(
      'SOS 載入錯誤:',
      e
    );

  }

}


/* =====================================================
   SOS REALTIME
===================================================== */

function subscribeSOS() {

  if (
    !supabase ||
    !isGroup
  ) {

    return;

  }


  if (sosChannel) {

    try {

      supabase.removeChannel(
        sosChannel
      );

    } catch (e) {}

  }


  sosChannel =
    supabase
      .channel(
        'sos-room-' +
        String(roomId)
      )

      .on(
        'postgres_changes',
        {
          event:'INSERT',
          schema:'public',
          table:'sos_events',
          filter:
            'room_id=eq.' +
            String(roomId)
        },

        async function (
          payload
        ) {

          var sos =
            payload.new;


          if (!sos) return;


          await renderSOS(
            sos
          );


          playNotify();


          setStatus(
            '🚨 收到新的 SOS 求救'
          );

        }
      )

      .on(
        'postgres_changes',
        {
          event:'UPDATE',
          schema:'public',
          table:'sos_events',
          filter:
            'room_id=eq.' +
            String(roomId)
        },

        async function (
          payload
        ) {

          if (
            payload.new
          ) {

            await renderSOS(
              payload.new
            );

          }

        }
      )

      .subscribe(
        function (
          status
        ) {

          console.log(
            'SOS Realtime:',
            status
          );

        }
      );

}


/* =====================================================
   時間
===================================================== */

function nowTime() {

  var n =
    new Date();


  return (
    n.getHours() +
    ':' +
    String(
      n.getMinutes()
    ).padStart(
      2,
      '0'
    )
  );

}


function nowTimeFrom(
  iso
) {

  var d =
    new Date(
      iso
    );


  return (
    d.getHours() +
    ':' +
    String(
      d.getMinutes()
    ).padStart(
      2,
      '0'
    )
  );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
  s
) {

  return String(s)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    );

}

   ROW → LOCAL
===================================================== */

function rowToLocal(

) {

      ),

async function loadSenderProfiles() {
  var ids = [];
  messages.forEach(function (m) {
    if (m.userId && ids.indexOf(m.userId) < 0) ids.push(m.userId);
  });
  if (myUser && ids.indexOf(myUser.id) < 0) ids.push(myUser.id);
  if (!ids.length || !supabase) return;
  var res = await supabase
    .from("profiles")
    .select("id,nickname,username,avatar_url,avatar")
    .in("id", ids);
  (res.data || []).forEach(function (p) {
    profileCache[p.id] = p;
  });
}
function senderProfile(userId) {
  return (userId && profileCache[userId]) || {};
}
function senderNameOf(m) {
  var p = senderProfile(m.userId);
  return p.nickname || p.username || m.senderName || "成員";
}
function senderAvatarUrl(m) {
  var p = senderProfile(m.userId);
  return p.avatar_url || p.avatar || "";
}
function appendAvatar(row, m) {
  var url = senderAvatarUrl(m);
  var name = senderNameOf(m);
  if (url) {
    var img = document.createElement("img");
    img.className = "msg-avatar";
    img.src = url;
    img.alt = name;
    row.appendChild(img);
  } else {
    var avatar = document.createElement("div");
    avatar.className = "msg-avatar-default";
    avatar.textContent = String(name).slice(0, 1);
    row.appendChild(avatar);
  }
}

/* =====================================================
   NOTIFY
===================================================== */

function playNotify() {

  try {

    var sound =
      document.getElementById(
        'optSound'
      );


    if (
      !sound ||
      !sound.checked
    ) {

      /* 仍允許震動 */

    } else {

      var AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;


      if (AudioCtx) {

        var ctx =
          new AudioCtx();


        function tone(freq, when, dur, vol) {

          var o =
            ctx.createOscillator();

          var g =
            ctx.createGain();

          o.type =
            'sine';

          o.frequency.value =
            freq;

          g.gain.value =
            vol || 0.09;

          o.connect(g);

          g.connect(
            ctx.destination
          );

          o.start(
            ctx.currentTime +
            when
          );

          o.stop(
            ctx.currentTime +
            when +
            dur
          );

        }


        /* 訊息提示：兩短音 */
        tone(880, 0, 0.12, 0.1);

        tone(1175, 0.14, 0.14, 0.1);

      }

    }


    var vibrate =
      document.getElementById(
        'optVibrate'
      );


    if (
      vibrate &&
      vibrate.checked &&
      navigator.vibrate
    ) {

      navigator.vibrate(
        [80, 40, 80]
      );

    }

  } catch (e) {}

}



function renderMessages() {

  var box =
    document.getElementById(
      'messages'
    );


  if (!box) return;


  box.innerHTML =
    '';


  messages.forEach(
    function (m) {

      if (
        m.hiddenLocal
      ) {

        return;

      }


      /*
         外層 row
      */

      var row =
        document.createElement(
          'div'
        );


      row.className =
        'msg-row ' +
        (
          m.mine
            ? 'me'
            : 'them'
        );


      /*
         對方頭像
      */

      if (!m.mine) appendAvatar(row, m);

      /*
         訊息泡泡
      */

      var div =
        document.createElement(
          'div'
        );


      var cls =
        'msg ' +
        (
          m.mine
            ? 'me'
            : 'them'
        );


      if (
        m.recalled
      ) {

        cls +=
          ' recalled';

      }


      div.className =
        cls;


      if (
        m.recalled
      ) {

        div.innerHTML =
          (
            m.mine
              ? '你已回收一則訊息'
              : '對方已回收一則訊息'
          ) +

          '<div class="msg-time">' +
          m.time +
          '</div>';

      } else {

        var html =
          '';


        /*
           群組才顯示發訊息者
        */

        if (
          !m.mine &&
          isGroup
        ) {

          html +=
            '<div class="msg-tag" ' +
            'style="color:#555;font-weight:600;margin-bottom:2px">' +
            escapeHtml(
  senderNameOf(m)
) +
            '</div>';

        }


        if (
          m.all
        ) {

          html +=
            '<div class="msg-tag">' +
            '@all 全體' +
            '</div>';

        }


        if (
          m.kind ===
          'image'
        ) {

          html +=
            '<img src="' +
            escapeHtml(
              m.text
            ) +
            '" alt="圖片">';

        }

        else if (
          m.kind ===
          'video'
        ) {

          html +=
            '<video src="' +
            escapeHtml(
              m.text
            ) +
            '" controls playsinline></video>';

        }

        else if (
          m.kind ===
          'audio'
        ) {

          html +=
            '<audio src="' +
            escapeHtml(
              m.text
            ) +
            '" controls></audio>';

        }

        else if (
          m.kind ===
          'sticker'
        ) {

          html +=
            '<span style="font-size:36px">' +
            escapeHtml(
              m.text
            ) +
            '</span>';

        }

        else if (
          m.kind === 'file' ||
          m.kind === 'media' ||
          m.kind === 'camera'
        ) {

          if (
            /^https?:\/\//.test(
              m.text
            )
          ) {

            html +=
              '<a href="' +
              escapeHtml(
                m.text
              ) +
              '" target="_blank" rel="noopener">' +
              '開啟檔案' +
              '</a>';

          } else {

            html +=
              '［檔案］' +
              escapeHtml(
                m.text
              );

          }

        }

        else {

          html +=
            escapeHtml(
              m.text
            );

        }


        html +=
          '<div class="msg-time">' +
          m.time +
          '</div>';


        div.innerHTML =
          html;

      }


      /*
         長按
      */

      var timer =
        null;


      div.addEventListener(
        'touchstart',
        function () {

          timer =
            setTimeout(
              function () {

                openAction(
                  m.id
                );

              },
              450
            );

        },
        {
          passive:true
        }
      );


      div.addEventListener(
        'touchend',
        function () {

          clearTimeout(
            timer
          );

        }
      );


      div.addEventListener(
        'touchmove',
        function () {

          clearTimeout(
            timer
          );

        }
      );


      div.addEventListener(
        'contextmenu',
        function (e) {

          e.preventDefault();

          openAction(
            m.id
          );

        }
      );


      row.appendChild(
        div
      );


      /*
         自己的訊息不需要左邊頭像
      */

      box.appendChild(
        row
      );

    }
  );


  box.scrollTop =
    box.scrollHeight;

}


/* =====================================================
   LOCAL MESSAGE
===================================================== */

function pushLocal(
  kind,
  text,
  all
) {

  messages.push({

    id:
      'local_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() *
        1000
      ),

    mine:true,

    kind:
      kind || 'text',

    text:text,

    all:!!all,

    time:
      nowTime(),

    createdAt:
      Date.now(),

    recalled:false,

    hiddenLocal:false,

    senderName:
      '你',

    userId:
      myUser
        ? myUser.id
        : ''

  });


  renderMessages();

}


/* =====================================================
   FILE KIND
===================================================== */

function guessKind(
  file
) {

  var type =
    (
      file.type ||
      ''
    ).toLowerCase();


  if (
    type.indexOf(
      'image/'
    ) === 0
  ) {

    return 'image';

  }


  if (
    type.indexOf(
      'video/'
    ) === 0
  ) {

    return 'video';

  }


  if (
    type.indexOf(
      'audio/'
    ) === 0
  ) {

    return 'audio';

  }


  return 'file';

}


/* =====================================================
   UPLOAD
===================================================== */

async function uploadAndSend(
  file
) {

  if (!file) {

    return;

  }


  if (
    !myUser ||
    !supabase
  ) {

    setStatus(
      '請先登入才能傳檔'
    );

    return;

  }


  setStatus(
    '上傳中…'
  );


  var kind =
    guessKind(
      file
    );


  var ext =
    (
      file.name
        .split('.')
        .pop() ||
      'bin'
    ).toLowerCase();


  var path =
    myUser.id +
    '/' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      10000
    ) +
    '.' +
    ext;


  var up =
    await supabase
      .storage
      .from(
        'chat-media'
      )
      .upload(
        path,
        file,
        {
          cacheControl:'3600',
          upsert:false,
          contentType:
            file.type ||
            undefined
        }
      );


  if (up.error) {

    setStatus(
      '上傳失敗：' +
      up.error.message
    );

    return;

  }


  var pub =
    supabase
      .storage
      .from(
        'chat-media'
      )
      .getPublicUrl(
        path
      );


  var url =
    pub.data &&
    pub.data.publicUrl;


  if (!url) {

    setStatus(
      '無法取得檔案網址'
    );

    return;

  }


  var senderName =
    getMyDisplayName();


  var ins =
    await supabase
      .from('messages')
      .insert({

        room_id:
          roomId,

        user_id:
          myUser.id,

        sender_name:
          senderName,

        kind:
          kind,

        body:
          url,

        is_all:
          false

      });


  if (ins.error) {

    setStatus(
      '訊息失敗：' +
      ins.error.message
    );

    return;

  }


  setStatus(
    '即時通訊已開啟'
  );

}


/* =====================================================
   MY NAME
===================================================== */

function getMyDisplayName() {

  if (!myUser) {

    return '成員';

  }


  var meta =
    myUser.user_metadata ||
    {};


  return (
    meta.nickname ||
    meta.username ||
    meta.full_name ||
    (
      myUser.email
        ? myUser.email.split('@')[0]
        : '成員'
    )
  );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMsg() {

  var input =
    document.getElementById(
      'msgInput'
    );


  var text =
    input.value.trim();


  if (!text) {

    return;

  }


  var all =
    false;


  if (
    /^@all\b/i.test(
      text
    ) ||
    text.indexOf(
      '@全體'
    ) === 0
  ) {

    all =
      true;


    text =
      text
        .replace(
          /^@all\b/i,
          ''
        )
        .replace(
          /^@全體/,
          ''
        )
        .trim() ||
      '（全體通知）';

  }


  input.value =
    '';


  if (
    !myUser ||
    !supabase
  ) {

    pushLocal(
      'text',
      text,
      all
    );


    setStatus(
      '本機模式（未登入或未連線）'
    );

    return;

  }


  setStatus(
    '送出中…'
  );


  var res =
    await supabase
      .from('messages')
      .insert({

        room_id:
          roomId,

        user_id:
          myUser.id,

        sender_name:
          getMyDisplayName(),

        kind:
          'text',

        body:
          text,

        is_all:
          all

      });


  if (res.error) {

    console.error(
      'sendMsg error:',
      res.error
    );


    setStatus(
      '送出失敗：' +

/* =====================================================
   REALTIME
===================================================== */

function subscribeMessages() {

  if (!supabase) {

    return;

  }


  if (realtimeChannel) {

    try {

      supabase.removeChannel(
        realtimeChannel
      );

    } catch (e) {}

  }


  realtimeChannel =
    supabase
      .channel(
        'room:' +
        String(roomId)
      )

      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'messages',
          filter:
            'room_id=eq.' +
            String(roomId)
        },

        function (
          payload
        ) {

          console.log(
            'Messages Realtime:',
            payload
          );


          if (
            payload.eventType ===
            'INSERT'
          ) {

            var m =
              rowToLocal(
                payload.new
              );


            var exists =
              messages.find(
                function (x) {

                  return (
                    String(x.id) ===
                    String(m.id)
                  );

                }
              );


            if (!exists) {

              messages.push(
                m
              );


              renderMessages();


              if (
                !m.mine
              ) {

                playNotify();

              }

            }

          }


          if (
            payload.eventType ===
            'UPDATE'
          ) {

            var updated =
              rowToLocal(
                payload.new
              );


            var index =
              messages.findIndex(
                function (x) {

                  return (
                    String(x.id) ===
                    String(updated.id)
                  );

                }
              );


            if (index >= 0) {

              messages[index] =
                Object.assign(
                  {},
                  messages[index],
                  updated
                );

            } else {

              messages.push(
                updated
              );

            }


            renderMessages();

          }


          if (
            payload.eventType ===
            'DELETE'
          ) {

            var deleteId =
              payload.old &&
              payload.old.id;


            if (deleteId) {

              messages =
                messages.filter(
                  function (x) {

                    return (
                      String(x.id) !==
                      String(deleteId)
                    );

                  }
                );


              renderMessages();

            }

          }

        }
      )

      .subscribe(
        function (
          status
        ) {

          console.log(
            'Messages channel:',
            status
          );


          if (
            status ===
            'SUBSCRIBED'
          ) {

            setStatus(
              '即時通訊已開啟'
            );

          }


          if (
            status ===
            'CHANNEL_ERROR'
          ) {

            setStatus(
              'Realtime 連線失敗'
            );

          }


          if (
            status ===
            'TIMED_OUT'
          ) {

            setStatus(
              'Realtime 連線逾時'
            );

          }

        }
      );

}

/* =====================================================
   群組會議進行中橫幅
===================================================== */

var meetingChannel = null;
var meetingActive = false;

function meetingFlagKey() {
  return 'safe_reunion_in_meeting_' + String(roomId || '');
}

function updateMeetingBanner(active, count) {
  meetingActive = !!active;
  var banner = document.getElementById('meetingBanner');
  var btn = document.getElementById('btnMeetingJoin');
  var text = document.getElementById('meetingBannerText');
  if (!banner || !btn || !text) return;

  if (!isGroup) {
    banner.classList.remove('show');
    return;
  }

  if (active) {
    banner.classList.add('show');
    var starter =
      meetingStarterName
        ? (meetingStarterName + ' 發起群組通話')
        : '會議進行中';
    text.textContent =
      starter +
      (count ? '（' + count + ' 人）' : '');
    var inLocal = false;
    try {
      inLocal = localStorage.getItem(meetingFlagKey()) === '1';
    } catch (e) {}
    if (inLocal) {
      btn.textContent = '退出';
      btn.classList.add('exit');
    } else {
      btn.textContent = '進入';
      btn.classList.remove('exit');
    }
  } else {
    banner.classList.remove('show');
    meetingStarterName = '';
    try { stopGroupMeetingRing(); } catch (e) {}
    try {
      localStorage.removeItem(meetingFlagKey());
    } catch (e) {}
  }
}


var groupRingTimer = null;
var groupAudioCtx = null;
var lastMeetingRingAt = 0;
var meetingStarterName = '';

function ensureGroupAudio() {
  try {
    if (!groupAudioCtx) {
      groupAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (groupAudioCtx.state === 'suspended') groupAudioCtx.resume();
    return groupAudioCtx;
  } catch (e) {
    return null;
  }
}

function groupBeep(freq, dur) {
  try {
    var ctx = ensureGroupAudio();
    if (!ctx) return;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.frequency.value = freq;
    g.gain.value = 0.08;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + (dur || 0.2));
  } catch (e) {}
}

function startGroupMeetingRing() {
  // 避免短時間重複狂響
  var now = Date.now();
  if (now - lastMeetingRingAt < 8000) return;
  lastMeetingRingAt = now;

  stopGroupMeetingRing();
  if (navigator.vibrate) {
    try { navigator.vibrate([300, 200, 300, 200]); } catch (e) {}
  }
  groupRingTimer = setInterval(function () {
    groupBeep(880, 0.25);
    setTimeout(function () { groupBeep(980, 0.25); }, 300);
    if (navigator.vibrate) {
      try { navigator.vibrate(200); } catch (e) {}
    }
  }, 1500);

  // 20 秒後自動停鈴（橫幅仍保留，可手動進入）
  setTimeout(function () {
    stopGroupMeetingRing();
  }, 20000);
}

function stopGroupMeetingRing() {
  if (groupRingTimer) {
    clearInterval(groupRingTimer);
    groupRingTimer = null;
  }
}

async function startMeetingWatch() {
  if (!isGroup || !roomId || !supabase || !myUser) return;

  try {
    if (meetingChannel) {
      try { supabase.removeChannel(meetingChannel); } catch (e) {}
      meetingChannel = null;
    }

    if (window._meetingPollTimer) {
      clearInterval(window._meetingPollTimer);
      window._meetingPollTimer = null;
    }

    meetingChannel = supabase.channel(
      'group-call:' + String(roomId)
    );

    function countOnlineFromPresence() {
      var state = meetingChannel.presenceState() || {};
      var count = 0;
      var seen = {};
      Object.keys(state).forEach(function (k) {
        var metas = state[k] || [];
        metas.forEach(function (m) {
          if (!m || !m.online) return;
          var uid = m.user_id || k;
          if (seen[uid]) return;
          seen[uid] = true;
          count++;
        });
      });
      return count;
    }

    function refreshFromPresence() {
      try {
        var count = countOnlineFromPresence();
        // 只要還有人在會議中，就顯示橫幅，晚到的人也能「進入」
        updateMeetingBanner(count > 0, count);
      } catch (e) {
        console.warn(e);
      }
    }

    meetingChannel
      .on('presence', { event: 'sync' }, refreshFromPresence)
      .on('presence', { event: 'join' }, refreshFromPresence)
      .on('presence', { event: 'leave' }, refreshFromPresence)
      .on('broadcast', { event: 'meeting_start' }, function (payload) {
        var p = payload && payload.payload ? payload.payload : payload;
        if (p && p.starter_name) meetingStarterName = p.starter_name;
        // 自己發起的不響鈴
        if (p && myUser && p.starter_id === myUser.id) {
          updateMeetingBanner(true, 1);
          return;
        }
        updateMeetingBanner(true, 1);
        startGroupMeetingRing();
        try { playNotify(); } catch (e) {}
        setStatus(
          (meetingStarterName || '成員') +
          ' 發起群組通話，可點「進入」加入'
        );
      })
      .on('broadcast', { event: 'meeting_alive' }, function (payload) {
        var p = payload && payload.payload ? payload.payload : payload;
        var n = p && p.count != null ? p.count : 1;
        if (p && p.starter_name && !meetingStarterName) {
          meetingStarterName = p.starter_name;
        }
        var was = meetingActive;
        updateMeetingBanner(true, n);
        // 從無到有：晚到者也響一次
        if (!was) {
          if (!(p && myUser && p.starter_id === myUser.id)) {
            startGroupMeetingRing();
          }
        }
      })
      .on('broadcast', { event: 'meeting_end' }, function () {
        meetingStarterName = '';
        stopGroupMeetingRing();
        updateMeetingBanner(false, 0);
      });

    await meetingChannel.subscribe(function (status) {
      console.log('Meeting watch:', status);
      if (status === 'SUBSCRIBED') {
        refreshFromPresence();
      }
    });

    // 輪詢備援：晚進聊天室的人也能很快看到進行中會議
    window._meetingPollTimer = setInterval(function () {
      if (!meetingChannel) return;
      refreshFromPresence();
    }, 2000);

  } catch (e) {
    console.warn('startMeetingWatch', e);
  }
}

function openGroupMeeting(opts) {
  opts = opts || {};
  try { stopGroupMeetingRing(); } catch (e) {}
  try {
    localStorage.setItem(meetingFlagKey(), '1');
  } catch (e) {}
  var url =
    'group-call.html?mode=' +
    encodeURIComponent(opts.mode || 'audio') +
    '&name=' +
    encodeURIComponent(roomName) +
    '&room_id=' +
    encodeURIComponent(String(roomId)) +
    '&id=' +
    encodeURIComponent(String(roomId));
  if (opts.textonly) url += '&textonly=1';
  location.href = url;
}

function bindMeetingBannerButtons() {
  var btn = document.getElementById('btnMeetingJoin');
  var btnText = document.getElementById('btnMeetingText');
  if (btn) {
    btn.onclick = function () {
      if (!meetingActive) return;
      var inLocal = false;
      try {
        inLocal = localStorage.getItem(meetingFlagKey()) === '1';
      } catch (e) {}
      if (inLocal) {
        // 退出：清除旗標並進入通話頁讓使用者掛斷（或直接回聊天）
        try { localStorage.removeItem(meetingFlagKey()); } catch (e) {}
        openGroupMeeting({ mode: 'audio' });
        return;
      }
      openGroupMeeting({ mode: 'audio' });
    };
  }
  if (btnText) {
    btnText.onclick = function () {
      if (!meetingActive) return;
      openGroupMeeting({ mode: 'audio', textonly: true });
    };
  }
}

/* =====================================================
   ACTION
===================================================== */

function openAction(
  id
) {

  selectedId =
    id;


  var m =
    messages.find(
      function (x) {

        return x.id === id;

      }
    );


  if (
    !m ||
    m.recalled ||
    m.hiddenLocal
  ) {

    return;

  }


  var box =
    document.getElementById(
      'actionBox'
    );


  var html =
    '';


  var canRecall =
    m.mine &&
    !m.recalled &&
    (
      Date.now() -
      m.createdAt <=
      RECALL_MS
    ) &&
    String(
      m.id
    ).indexOf(
      'local_'
    ) !== 0;


  if (canRecall) {

    html +=
      '<div class="action-item" id="actRecall">' +
      '回收（2分鐘內）' +
      '</div>';

  }


  html +=
    '<div class="action-item danger" id="actDel">' +
    '刪除' +
    '</div>';


  html +=
    '<div class="action-item" id="actCancel">' +
    '取消' +
    '</div>';


  box.innerHTML =
    html;


  document.getElementById(
    'actionMask'
  ).classList.add(
    'show'
  );


  box.classList.add(
    'show'
  );


  var recall =
    document.getElementById(
      'actRecall'
    );


  if (recall) {

    recall.onclick =
      doRecall;

  }


  document.getElementById(
    'actDel'
  ).onclick =
    doDeleteLocal;


  document.getElementById(
    'actCancel'
  ).onclick =
    closeAction;

}


function closeAction() {

  selectedId =
    null;


  document.getElementById(
    'actionMask'
  ).classList.remove(
    'show'
  );


  document.getElementById(
    'actionBox'
  ).classList.remove(
    'show'
  );

}


/* =====================================================
   RECALL
===================================================== */

async function doRecall() {

  var m =
    messages.find(
      function (x) {

        return (
          x.id ===
          selectedId
        );

      }
    );


  closeAction();


  if (
    !m ||
    !supabase ||
    !myUser
  ) {

    return;

  }


  var res =
    await supabase
      .from('messages')
      .update({
        recalled:true
      })
      .eq(
        'id',
        m.id
      )
      .eq(
        'user_id',
        myUser.id
      );


  if (res.error) {

    setStatus(
      '回收失敗：' +
      res.error.message
    );

  }

}


/* =====================================================
   DELETE
===================================================== */

async function doDeleteLocal() {

  var m =
    messages.find(
      function (x) {

        return (
          x.id ===
          selectedId
        );

      }
    );


  closeAction();


  if (!m) {

    return;

  }


  if (
    String(
      m.id
    ).indexOf(
      'local_'
    ) === 0
  ) {

    m.hiddenLocal =
      true;


    renderMessages();

    return;

  }


  if (
    !m.mine ||
    !supabase ||
    !myUser
  ) {

    m.hiddenLocal =
      true;


    renderMessages();

    return;

  }


  setStatus(
    '刪除中…'
  );


  var res =
    await supabase
      .from('messages')
      .delete()
      .eq(
        'id',
        m.id
      )
      .eq(
        'user_id',
        myUser.id
      );


  if (res.error) {

    setStatus(
      '刪除失敗：' +
      res.error.message
    );

    return;

  }


  messages =
    messages.filter(
      function (x) {

        return (
          x.id !==
          m.id
        );

      }
    );


  renderMessages();


  setStatus(
    '即時通訊已開啟'
  );

}

document.getElementById(
  'btnVoice'
).onclick =
  function () {

    var SR =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SR) {

      setStatus(
        '不支援語音轉文字'
      );

      return;

    }


    if (
      recognizing &&
      recognition
    ) {

      recognition.stop();

      recognizing =
        false;


      document.getElementById(
        'btnVoice'
      ).textContent =
        '語音';

      return;

    }


    recognition =
      new SR();


    recognition.lang =
      'zh-TW';


    recognition.continuous =
      false;


    recognition.interimResults =
      false;


    recognition.onresult =
      function (e) {

        var text =
          e.results[0][0]
            .transcript;


        var input =
          document.getElementById(
            'msgInput'
          );


        input.value =
          (
            input.value
              ? input.value + ' '
              : ''
          ) +
          text;

      };


    recognition.onend =
      function () {

        recognizing =
          false;


        document.getElementById(
          'btnVoice'
        ).textContent =
          '語音';

      };


    recognition.onerror =
      function () {

        recognizing =
          false;


        document.getElementById(
          'btnVoice'
        ).textContent =
          '語音';

      };


    recognizing =
      true;


    document.getElementById(
      'btnVoice'
    ).textContent =
      '聆聽中';


    recognition.start();

  };


/* =====================================================
   INIT
===================================================== */

async function initRealtime() {

  try {

    setStatus(
      '檢查 Supabase…'
    );


    if (
      !window.supabase ||
      !window.supabase.createClient
    ) {

      setStatus(
        'Supabase 套件載入失敗'
      );

      return;

    }


    supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    setStatus(
      '檢查登入狀態…'
    );


    var sessionResult =
      await supabase.auth.getSession();


    if (
      sessionResult.error
    ) {

      setStatus(
        '登入狀態讀取失敗：' +
        sessionResult.error.message
      );

      return;

    }


    var session =
      sessionResult.data &&
      sessionResult.data.session;


    if (!session) {

      setStatus(
        '尚未登入'
      );


      document.getElementById(
        'roomName'
      ).textContent =
        roomName;


      return;

    }


    myUser =
      session.user;


    console.log(
      '登入使用者:',
      myUser.id
    );


    /*
       ★★★★★
       這裡是這次最重要的修正
       ★★★★★
    */

    if (
      String(
        originalRoomId
      ).indexOf('dm_') === 0
    ) {

      normalizeDMRoomId();

      await loadDMName();

    } else {

      await loadRoomName();

    }


    setStatus(
      '載入聊天訊息…'
    );


    var loaded =
      await loadMessages();


    if (!loaded) {

      return;

    }


    /*
       群組功能
    */

    if (isGroup) {

      await checkOwnerAndShowMembersBtn();

      await loadSOS();

      subscribeSOS();

      try {
        await startMeetingWatch();
      } catch (e) {
        console.warn(e);
      }

    }


    /*
       聊天 Realtime
    */

    subscribeMessages();


    setStatus(
      '即時通訊已開啟'
    );


  } catch (e) {

    console.error(
      'initRealtime error:',
      e
    );


    setStatus(
      '錯誤：' +
      (
        e &&
        e.message
          ? e.message
          : String(e)
      )
    );

  }

}


/* =====================================================
   BOOT
===================================================== */

setStatus(
  '等待 Supabase…'
);


var tries =
  0;


function boot() {

  tries += 1;


  if (
    window.supabase
  ) {

    initRealtime();


    return;

  }


  if (
    tries < 30
  ) {

    setStatus(
      '等待 Supabase…(' +
      tries +
      ')'
    );


    setTimeout(
      boot,
      200
    );


    return;

  }


  setStatus(
    'Supabase 套件載入失敗'
  );

}


boot();

/* 解鎖 iOS 提示音（需使用者先點過畫面） */
document.body.addEventListener('click', function () {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    g.gain.value = 0.0001;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.01);
  } catch (e) {}
}, { once: true });



})();
